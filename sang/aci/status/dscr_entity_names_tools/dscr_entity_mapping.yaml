    notes: Read by 1 rule.

  - flat: ownership_months
    target: SubjectProperty.ownership_months
    basis: proposed
    derived: true
    unit_change: "months (int); ontology has no acquisition date for the subject."
    notes: Read by 1 rule (vacant cash-out seasoning).

  - flat: mixed_use
    target: SubjectProperty.is_mixed_use
    basis: hand_built
    unit_change: none
    notes: Pack meaning is wider (mixed use OR adult care OR assisted living). Read by 1 rule.

  - flat: interest_only_10_40
    target: LoanCore.is_interest_only_10_40
    basis: proposed
    derived: true
    unit_change: none
    notes: Product flag. Derivable as interest_only_period_months == 120 AND term_months == 480 (both ontology); kept boolean. Read by 2 rules.

  - flat: first_time_homebuyer
    target: Borrower.is_first_time_homebuyer
    basis: hand_built
    unit_change: none
    notes: Read by 4 rules.

  - flat: rural_property
    target: SubjectProperty.is_rural
    basis: proposed
    unit_change: none
    notes: No ontology field. Read by 4 rules.

  - flat: vacant_property
    target: SubjectProperty.is_vacant
    basis: proposed
    unit_change: none
    notes: Hand-built routes vacancy through SubjectProperty.occupancy_type, whose enum has no Vacant member. Read by 8 rules.

  - flat: delayed_financing
    target: LoanCore.is_delayed_financing
    basis: proposed
    unit_change: none
    notes: Hand-built says "when the LOS flags delayed financing" without a key; LoanCore.refinance_type has no member for it. Read by 2 rules.

  - flat: listed_for_sale_last_6_months
    target: SubjectProperty.listed_for_sale_last_6_months
    basis: proposed
    derived: true
    unit_change: "hand-built uses SubjectProperty.last_listing_date (prose; not in ontology) -- a date. Pointing there needs within_6_months(last_listing_date, LoanCore.application_date); keep the derived boolean."
    notes: Read by 5 rules.

  # Derived metrics (metrics.yaml ids) -- also listed under derived_metrics.
  - flat: cltv_pct
    target: LoanCore.cltv_percent
    basis: hand_built
    derived: true
    unit_change: "none (pack percent 75.0; ontology LtvRate 0-200 percent)"
    renamed_had: LoanCore.cltv_percent
    notes: >-
      metrics.yaml id; 26 matrix compare_field + 5 rule fields; pack_manifest compose_caps.compare_field;
      jtbd_template reads + units; gold `expected.cltv_pct`. The formula (100*loan/value) is really a
      first-lien LTV (metrics.yaml calls it a book-LTV proxy); hand-built uses cltv_percent for the caps,
      so the name stays. Kept from RENAMED.

  - flat: dscr
    target: RatioSet.dscr
    basis: proposed
    derived: true
    unit_change: none
    renamed_had: RatioSet.dscr
    notes: >-
      metrics.yaml id only; no rule reads it (ratio rules compute numerator/denominator themselves,
      ratio_name DSCR). RatioSet has no dscr field and hand-built never stores one. Kept from RENAMED,
      marked proposed.

# ---------------------------------------------------------------------------------------------
# 2. Names that stay flat (not facts).
# ---------------------------------------------------------------------------------------------
stays_flat:
  - flat: loan_id
    why: Case identity and the conductor's subject_field (pack_manifest.yaml); keys fixtures, gold cases, run ids. LoanCore.loan_number exists but the run key is not a fact a rule reads.
  - flat: program_id
    why: Routing selector for the manifest's `programs:` (which policy set applies); not a loan fact. Plato and the page pass it as a run parameter.
  - flat: submission_date
    why: Envelope metadata (defaults to now); no rule reads it.
  - flat: source_system
    why: Envelope metadata (DataProvenance.source_system in the ontology is per-entity provenance, a different thing).
  - flat: borrower_name
    why: Display/identity; no rule reads it; no single ontology field (Borrower.first_name/last_name; no entity-name field). Alternative if it must move -- proposed Borrower.entity_name.
  - flat: sponsor_name
    why: Display/identity; no rule reads it; no sponsor/guarantor entity. Alternative -- proposed Borrower.sponsor_name.
  - flat: loan_officer
    why: Display/identity; no rule reads it; ontology form is a filtered path (LoanPersonnel[designation=LoanOfficer].name). Alternative -- derived LoanCore.loan_officer_name.
  - flat: binding_cap_pct
    why: Not a fact -- an assessment output (gold `expected.binding_cap_pct`, EligibilityAssessment.binding_cap_pct, run_dscr_eval_plato.py). Listed so the script does not touch it.
  - flat: "profile threshold/table keys (cltv/fico/reserves in names: max_cltv_grid, fico_min_rural, reserves_months_fthb, ...)"
    why: PolicyProfile keys and profile_custom_key values, not fact names; the rename regex must not match inside them (e.g. `reserves_months` inside `reserves_months_fthb`).

# ---------------------------------------------------------------------------------------------
# 3. Derived metrics that land on (or beside) stored ontology fields.
# ---------------------------------------------------------------------------------------------
derived_metrics:
  - id: cltv_pct -> LoanCore.cltv_percent
    formula_after: "100 * LoanCore.total_loan_amount_usd / SubjectProperty.appraised_value_usd"
    issue: >-
      LoanCore.cltv_percent is a stored ontology field. A record that also supplies it (from the LOS)
      collides with the derived value. Decide which wins (derived should, as today), or name the
      metric distinctly. Rounding 2 places unchanged.
  - id: dscr -> RatioSet.dscr
    formula_after: "RatioSet.total_monthly_income_usd / RatioSet.total_monthly_obligation_usd"
    issue: Not in the ontology (proposed). Same formula as hand-built DSCR-CALC.

# ---------------------------------------------------------------------------------------------
# 4. Filtered / nested paths (plan 2b recommends derived fields, keeping reads plain).
# ---------------------------------------------------------------------------------------------
filtered_paths:
  - path: SubjectProperty.address.state
    used_for: property_state
    recommendation: derived SubjectProperty.state (hand-built's own spelling)
  - path: "RealEstateOwned[is_subject_property=True].gross_rental_income_usd"
    used_for: "not the pack's gross_rental_income (that maps to RatioSet.total_monthly_income_usd); hand-built's lease-rent jobs"
    recommendation: derived SubjectProperty.lease_rent_monthly_usd if a rule ever reads lease rent
  - path: "Liability[is_subject_property_lien=True].monthly_payment_usd"
    used_for: none in this pack (hand-built subordinate-lien jobs)
    recommendation: derived; out of scope for this migration
  - path: LoanCore.down_payment.percent_of_purchase_price
    used_for: none in this pack
    recommendation: RatioSet.down_payment_percent already exists as a plain field
  - path: "LoanPersonnel[designation=LoanOfficer].name"
    used_for: loan_officer (stays flat)
  - path: "Liability[mortgage|rent].late_30_days_count over 12/24 months"
    used_for: housing_history, mortgage_history_0x30x24
    recommendation: derived (proposed CreditReport.housing_history_rating / mortgage_0x30x24)

# ---------------------------------------------------------------------------------------------
# 5. Booleans/attestations the pack derives with no ontology counterpart (all `proposed`).
# ---------------------------------------------------------------------------------------------
derived_booleans:
  - entity_is_borrower_1
  - entity_documents_complete
  - title_multiple_transfers_among_related_parties
  - duplicate_ssn_cleared
  - broker_nmls_verified
  - loan_officer_nmls_verified
  - tradelines_meet_requirement
  - mortgage_history_0x30x24
  - bankruptcy_or_foreclosure        # OR of two ontology booleans
  - short_sale_dil_or_modification   # OR of two ontology booleans + modification (none)
  - interest_only_10_40
  - listed_for_sale_last_6_months
  # Non-derived booleans with no ontology field (also proposed): current_lease_in_place,
  # property_currently_listed_for_sale, rural_property, vacant_property, delayed_financing,
  # hoa_reserves_adequate, hoa_litigation_pending.

# ---------------------------------------------------------------------------------------------
# 6. Evidence fixtures (fixtures/*.json). Not read by the assessment; read by the investigator
#    model and test_dscr_document_ingest.py:192-195. Optional to migrate; targets if they are.
# ---------------------------------------------------------------------------------------------
fixture_fields:
  appraisal.json:
    - {flat: appraised_value, target: AppraisalSummary.appraised_value_usd, basis: ontology, unit_change: none}
    - {flat: appraisal_date, target: AppraisalSummary.effective_date, basis: ontology, unit_change: none}
    - {flat: property_address, target: SubjectProperty.address, basis: hand_built, unit_change: "string vs Address object (as above)"}
    - {flat: property_condition, target: AppraisalSummary.property_condition, basis: ontology, unit_change: none}
    - {flat: condition_note, target: AppraisalSummary.condition_note, basis: proposed, unit_change: none}
