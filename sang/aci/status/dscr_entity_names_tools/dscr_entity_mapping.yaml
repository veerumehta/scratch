  - flat: residential_unit_count
    target: SubjectProperty.number_of_units
    basis: hand_built
    unit_change: none
    notes: Read by 4 rules; dscr_schemas.py before-validator resolves it from property_type.

  - flat: interest_rate
    target: LoanCore.note_rate_percent
    basis: hand_built
    unit_change: "none (both percent, 7.5 = 7.5%; ontology PercentageRate 0-100)"
