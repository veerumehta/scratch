    derived: true
    unit_change: none
    notes: = Borrower.has_preforeclosure_short_sale OR has_conveyed_title_in_lieu (ontology); loan modification has no ontology field. Read by 2 rules.

  - flat: months_since_short_sale_dil_or_modification
    target: Borrower.months_since_short_sale_dil_or_modification
    basis: proposed
    derived: true
    unit_change: "months (int); ontology has no short-sale / DIL / modification date at all."
    notes: Read by 3 rules.

  - flat: credit_score_count
    target: CreditReport.score_count
    basis: proposed
    derived: true
    unit_change: "hand-built's 'Number of Repository Scores' metric is CreditReport.scores (array of CreditScore). Targeting it would need count = len(scores) and array fixtures; keep a derived count."
    notes: Read by 4 rules.

  - flat: tradelines_meet_requirement
    target: CreditReport.tradelines_meet_requirement
    basis: proposed
    derived: true
    unit_change: none
    notes: Derived from CreditReport.total_trade_lines / oldest_trade_line_date (ontology) per the 2x24 or 3x12 rule. Read by 4 rules.

  - flat: seller_concession_pct
    target: LoanCore.seller_concession_percent
    basis: proposed
    derived: true
    unit_change: >-
      Hand-built's Seller-Paid Contributions metric is ClosingFee.seller_paid_at_closing_usd -- USD,
