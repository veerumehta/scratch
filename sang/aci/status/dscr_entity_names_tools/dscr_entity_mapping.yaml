# Flat fact names in jaci's Acra DSCR pack -> Entity.field names (DRAFT, 2026-10-13).
#
# Pack: /Users/sangit/src/jaci/config/packs/acra_dscr_policy (pack_version 0.2.14)
# Plan: .scratch/sang/ape/plans/plan_document_registry_and_job_shape.md sections 2b and 4 (D2).
#
# Sources, in priority order:
#   1. hand_built: japes/documents/Acra/acra_New_Guideline_JTBD{,_Platinum}.json -- metric_key
#      values and the Entity.field names used in their indicator_context / requirement text.
#   2. ontology: mortgage-app-ontology/common/resources/ontologies/mortgage_ontology_v2.json
#      ($defs: 45 entities, 631 fields -- the only copy that matches; mortgage-app 49/693,
#      policy-workbench 49/690, macer 39/424).
#   3. japes/tests/test_dotted_fact_names.py RENAMED (6 names) -- see `renamed_conflicts`.
#
# Field meanings:
#   basis        hand_built | ontology | proposed. hand_built = the exact key appears in the hand-built
#                set (as metric_key unless `hand_built_use: text`). proposed = no ontology field fits.
#   in_ontology  false where a hand_built key is NOT in the production ontology (the hand-built set
#                uses a few such names in its prose); always false for proposed.
#   unit_change  "none" when a key rename alone keeps values identical. Otherwise the transform the
#                migration must apply to rules, fixtures and gold cases alike, or what differs.
#   vocab        for enums: the pack's value vocabulary vs the ontology enum. Recommendation for all
#                of them: rename the key, KEEP the pack's values (acceptance needs identical values,
#                and several pack values have no ontology member). Recorded so nobody "fixes" it later.
#   derived      true where the pack (or the record supplier) computes the value rather than reading
#                a stored field; see `derived_metrics` and `derived_booleans`.

ontology_file: /Users/sangit/src/mortgage-app-ontology/common/resources/ontologies/mortgage_ontology_v2.json

# ---------------------------------------------------------------------------------------------
# 1. Facts: schemas/loan_application.json properties (54) = loan_document_fields.json (53, all
#    but loan_id) + metrics.yaml ids/inputs. Order follows loan_application.json.
# ---------------------------------------------------------------------------------------------
facts:
  - flat: loan_amount
    target: LoanCore.total_loan_amount_usd
    basis: hand_built
    unit_change: none
    renamed_had: LoanCore.loan_amount
    notes: >-
      Hand-built uses total_loan_amount_usd (35x) for every amount cap (min/max, IO, FTHB, ITIN,
      NPR, delayed financing) and base_loan_amount_usd (10x) for a few (escrow waiver, delayed
      financing). DSCR has no financed MI/FF, so the two are equal here. Read by 24 rules (matrix
      axes incl. profile_custom_key band edges) and is a cltv metric input. RENAMED's
      LoanCore.loan_amount is not an ontology field.

  - flat: loan_purpose
    target: LoanCore.loan_purpose
    basis: hand_built
    unit_change: none
    vocab: "pack purchase|rate_term_refinance|cash_out_refinance vs ontology Purchase|RefinanceRateAndTerm|RefinanceCashOut|...; keep pack values (they are matrix axis keys and profile table keys)."
    notes: Read by 35 rules, matrix axis of every CLTV grid.

  - flat: property_type
    target: SubjectProperty.property_type
    basis: hand_built
    unit_change: none
    vocab: "pack sfr|warrantable_condo|townhome|pud|non_warrantable_condo|condotel|manufactured|two_to_four_unit vs ontology SingleFamily|Condominium|Townhouse|PUD|TwoToFourUnit|ManufacturedHome|...; ontology has no condotel / non-warrantable member (it splits them into SubjectProperty.condo_project_classification and CondoProject.transient_use_status). Keep pack values."
    notes: Read by 12 rules; also matrix axis and table keys (non_warrantable_condo|purchase ...).

  - flat: property_address
    target: SubjectProperty.address
    basis: hand_built
    hand_built_use: text
    unit_change: "type: pack string vs ontology $ref Address (object: street_line_1, city, state, postal_code ...). No rule reads it; keep it a string under this key, or keep it flat (see stays_flat alternative)."
    notes: Read by document_agent (loan_application, appraisal_report, title_commitment) and the appraisal fixture.

  - flat: property_state
    target: SubjectProperty.state
    basis: hand_built
    hand_built_use: text
    in_ontology: false
    unit_change: none
    notes: >-
      Hand-built writes SubjectProperty.state (once, prose); the ontology has only the nested
      SubjectProperty.address.state (Address.state, USStateCode). Recommend SubjectProperty.state
      as a derived field (plan 2b: derived, keep reads plain) = address.state. Read by 19 rules
      (ineligible states, every state PPP rule) and the IL interest_rate validator. NEEDS DECISION
      (see report).

  - flat: property_value
    target: SubjectProperty.appraised_value_usd
    basis: hand_built
    hand_built_use: text
    unit_change: none
    renamed_had: SubjectProperty.value
    notes: >-
      RENAMED's SubjectProperty.value is not an ontology field. Pack says "stated or appraised";
      ontology also has estimated_value_usd and purchase_price_usd, and AppraisalSummary.appraised_value_usd.
      appraised_value_usd chosen because the appraisal fixture's appraised_value must equal it
      (test_dscr_document_ingest.py:192). cltv metric input; read by no rule directly.

  - flat: fico
    target: CreditReport.representative_score
    basis: hand_built
    unit_change: none
    renamed_had: CreditReport.representative_score
    notes: Read by 15 rules incl. every grid's FICO axis. Kept from RENAMED.

  - flat: citizenship_type
    target: Borrower.citizenship_status
    basis: hand_built
    unit_change: none
    vocab: "pack us_citizen|permanent_resident|non_permanent_resident|itin|foreign_national vs ontology USCitizen|PermanentResidentAlien|NonPermanentResidentAlien. itin is Borrower.tax_id_type=ITIN in the ontology and foreign_national has no member; the pack folds three ontology facts into one enum. Keep pack values."
    notes: Read by 8 rules. A Borrower field on a loan with one borrower; multi-borrower grain is D3's question.

  - flat: gross_rental_income
    target: RatioSet.total_monthly_income_usd
    basis: hand_built
    unit_change: none
    notes: >-
      Monthly, the DSCR numerator. Hand-built's DSCR-CALC / LFC-DSCR-FINAL compute DSCR =
      RatioSet.total_monthly_income_usd / RatioSet.total_monthly_obligation_usd, with
      total_monthly_income_usd the qualifying rent. The lease rent itself is the filtered path
      RealEstateOwned[is_subject_property=True].gross_rental_income_usd (see filtered_paths); the
      pack's figure is the qualifying one. Ratio rule numerator (14 rules), dscr metric input.

  - flat: pitia
    target: RatioSet.total_monthly_obligation_usd
    basis: hand_built
    unit_change: none
    notes: >-
      DSCR denominator (14 ratio rules), dscr metric input. Hand-built uses total_monthly_obligation_usd
      as the DSCR denominator ("PITIA at the first payment") and RatioSet.proposed_housing_expense_usd
      for the PITIA reconciliation job; on a DSCR file both are PITIA(+subordinate payment).
      NEEDS DECISION if they should diverge.

  - flat: reserves_months
    target: RatioSet.reserves_months
    basis: hand_built
    unit_change: "none (pack integer, ontology number)"
    notes: Read by 8 rules.

  - flat: occupancy_subtype
    target: SubjectProperty.occupancy_subtype
    basis: proposed
    unit_change: none
    notes: >-
      standard|short_term_rental. SubjectProperty.occupancy_type is PrimaryResidence|SecondHome|Investment
      (always Investment for DSCR). Closest ontology fact is CondoProject.transient_use_status=ShortTermRental,
      but that is a condo project attribute, not the subject's rental mode. Read by 3 rules.

  - flat: dscr_documentation_type
    target: LoanCore.dscr_qualification_method
    basis: hand_built
    hand_built_use: text
    in_ontology: false
    unit_change: none
    notes: full|no_ratio. Hand-built names LoanCore.dscr_qualification_method once in prose; not in the ontology. Read by 5 rules.

  - flat: escrow_waiver_requested
    target: LoanCore.is_escrow_waived
    basis: hand_built
    unit_change: none
    notes: Read by 8 rules. Semantics shift from "requested" to "waived"; the rules test the request, which on an application is the same flag.

  - flat: product_is_interest_only
    target: MortgageLoanInformation.is_interest_only
    basis: ontology
    unit_change: none
    notes: >-
      Boolean in the ontology. Hand-built instead tests LoanCore.interest_only_period_months > 0
