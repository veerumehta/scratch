    notes: RENAMED's LoanCore.interest_rate is not an ontology field. Read by DSCR-PPP-IL-2 and the IL validator; jtbd_template units entry moves with it.

  - flat: channel
    target: LoanCore.channel
    basis: hand_built
    unit_change: none
    vocab: "pack wholesale|correspondent|unspecified vs ontology null|Retail|Wholesale|Correspondent|ConsumerDirect|BrokerDirect. Keep pack values ('unspecified' is a deliberate held-to-correspondent value, not null)."
    notes: Read by 2 rules.

  - flat: housing_history
    target: CreditReport.housing_history_rating
