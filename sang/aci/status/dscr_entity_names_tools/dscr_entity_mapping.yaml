      lender section; if entities should stay to the hand-built ones, use a derived
      LoanCore.is_interest_only (= interest_only_period_months > 0). Read by 7 rules.

  - flat: borrower_name
    target: null
    stays_flat: true
    basis: n/a
    unit_change: none
    notes: See stays_flat. Ontology has Borrower.first_name/last_name (split) and no entity-name field.

  - flat: sponsor_name
    target: null
    stays_flat: true
    basis: n/a
    unit_change: none
    notes: See stays_flat. No guarantor/sponsor entity in the ontology.

  - flat: loan_officer
    target: null
    stays_flat: true
    basis: n/a
    unit_change: none
    notes: See stays_flat. Ontology form is the filtered LoanPersonnel[designation=LoanOfficer].name.

  - flat: borrower_entity_type
    target: Borrower.entity_type
    basis: hand_built
    hand_built_use: text
    in_ontology: false
    unit_change: none
    notes: >-
      individual|llc|corporation|trust. Hand-built uses Borrower.entity_type (8x prose) and maps the
      "Entity vs Individual" metric to Borrower.borrower_type, whose ontology enum is
      Primary|CoBorrower|... (a different fact). Not in the ontology. Read by 7 rules, the IL
      validator, and pack_manifest.yaml required_classes `when:`.

  - flat: entity_is_borrower_1
    target: Borrower.is_entity_borrower_1
    basis: proposed
    derived: true
    unit_change: none
    notes: Cross-document attestation (entity is Borrower 1 on all docs). Hand-built has Borrower.is_entity (prose, not in ontology) which is a different fact. Read by 1 rule.

  - flat: entity_documents_complete
    target: Borrower.entity_documents_complete
    basis: proposed
    derived: true
    unit_change: none
    notes: Judgement across operating agreement / articles / good standing. No ontology counterpart. Read by 1 rule (DSCR-ENTITY-DOCS).

  - flat: title_multiple_transfers_among_related_parties
    target: TitleInformation.has_related_party_transfers
    basis: proposed
    derived: true
    unit_change: none
    notes: TitleInformation.chain_of_title_status (Clear|NotClear) is broader; using it would need bool->enum and lose meaning. Read by 1 rule.

  - flat: duplicate_ssn_cleared
    target: UnderwritingSummary.duplicate_ssn_cleared
    basis: proposed
    derived: true
    unit_change: none
    notes: Process attestation (Stage 1 duplicate-SSN check). No ontology counterpart; entity choice is a guess. Read by 1 rule.

  - flat: broker_nmls_verified
    target: UnderwritingSummary.broker_nmls_verified
    basis: proposed
    derived: true
    unit_change: none
    notes: Verification outcome. Ontology has only NMLS ids (LoanPersonnel.external_id, CoBorrowerInvitation.company_nmls). Read by 1 rule.

  - flat: loan_officer_nmls_verified
    target: UnderwritingSummary.loan_officer_nmls_verified
    basis: proposed
    derived: true
    unit_change: none
    notes: As broker_nmls_verified (CoBorrowerInvitation.loan_officer_nmls is an id). Read by 1 rule.

  - flat: property_currently_listed_for_sale
    target: SubjectProperty.is_listed_for_sale
    basis: proposed
    unit_change: none
    notes: >-
      Hand-built maps "Listed-For-Sale Status" to RealEstateOwned.property_status, whose enum is
      Sold|PendingSale|Retained (no "Listed") and which describes REO, not the subject. Read by 1 rule.

  - flat: hoa_reserves_adequate
    target: CondoProject.hoa_reserves_adequate
    basis: proposed
    unit_change: none
    notes: >-
      Ontology alternative CondoProject.budget_adequacy_status (Adequate|Deficit|Undetermined) would
      need bool->enum in rules, fixtures and gold (true->Adequate, false->Deficit) and the pack's
      fail-closed default has no Undetermined. Proposed boolean keeps values identical. NEEDS DECISION.

  - flat: hoa_litigation_pending
    target: CondoProject.hoa_litigation_pending
    basis: proposed
    unit_change: none
    notes: >-
      Ontology alternative CondoProject.litigation_status (None|MinorExcepted|Material) needs
      bool->enum (true->Material?, false->None) and MinorExcepted has no pack value. NEEDS DECISION.

  - flat: prepayment_penalty_requested
    target: LoanCore.prepayment_penalty_structure
    basis: proposed
    unit_change: none
    notes: >-
      Enum of PPP structures (5yr_5pct_fixed, 5yr_step, ...). Ontology has LoanCore.prepayment_penalty
      (bool) and prepayment_penalty_term_months (int) -- the structure (term + percent schedule) does
