    derived: true
    unit_change: "months (int) vs the ontology's dates Borrower.bankruptcy_discharge_date / foreclosure_date (hand_built). Pointing at the dates would need months = diff(application_date, latest event date) -- keep the derived month count."
    notes: Read by 3 rules (matrix axis lt12/12_23/24_35 ...).

  - flat: short_sale_dil_or_modification
