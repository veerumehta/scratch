    - ownership-interest documentation, including applicable certificates or units
    - corporate stock certificates or stock ledger, outstanding-share accounting,
      and any required Affidavit of Lost Stock Certificate
    - applicable K-1 statements and CPA or Tax Preparer letter, including any required
      statement about taxes not filed
    - entity-document names, identification, and any required letter of explanation
    - closing date and Certificate of Good Standing or equivalent
    - entity formation state, state where business is conducted, property location,
