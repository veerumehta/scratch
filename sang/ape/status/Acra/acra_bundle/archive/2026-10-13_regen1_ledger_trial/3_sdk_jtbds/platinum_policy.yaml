        PLAT-3.10 Single family investment properties with excessive monthly rent
        payments reflected on the lease require documentation supporting that the
        monthly rent is typical for the area; acceptable documentation may include
        classified ads from local newspapers, a 1007 completed by the appraiser, or
        a market rent survey completed by a local real estate company or rental management
