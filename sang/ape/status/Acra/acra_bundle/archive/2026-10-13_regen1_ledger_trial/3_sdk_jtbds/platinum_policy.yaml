    purpose: Obtain Acra confirmation because the stated denominator treatment does
      not establish whether subordinate financing is permitted.
    steps:
    - Establish whether subordinate financing is present or proposed.
    - If it is present or proposed, obtain Acra confirmation whether subordinate financing
      is permitted.
