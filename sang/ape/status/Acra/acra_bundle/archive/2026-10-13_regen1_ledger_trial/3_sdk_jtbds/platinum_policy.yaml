  priority: 100
  description: Distinguish the DSCR denominator calculation rule from permission to
    have subordinate financing.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The ratio
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-3.4 Denominator, per §5.32: “the sum of annual principal, interest,
        real estate taxes, property insurance, and homeowner''s / condominium association
        fees (collectively, ‘PITIA’). Subordinate financing, if applicable, would
        also be included in the denominator for the sake of this calculation.” \[G
        §5.32, p. 3\]


        PLAT-3.5 “Acra calculates the DSCR utilizing the first payment due under the
        terms of the Note.” §7.5 defines Interest Only payments as “the amount sufficient
        to pay the accrued interest to the mortgage on a monthly basis at the time
        of origination”, while the §5.32 denominator lists “annual principal, interest
        …”. Which payment enters the DSCR denominator on an interest-only loan: Acra
        confirmation requested → Q-21. \[G §7.5, p. 13; §5.32, p. 3\]


        PLAT-3.6 The reference to subordinate financing in the denominator is a calculation
        rule; it does not itself establish that a subordinate lien is permitted. The
        Platinum Summary does not address subordinate financing or restate the Standard
        Summary''s HELOC calculation: Acra confirmation requested → Q-15. \[G §5.32,
        p. 3\]'
