  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.5 Applicants with
    recent forbearance or mortgage lates
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-3.12 The Platinum Summary requires “0x30x12” housing history (PLAT-6.6).
        §5.32 of the excerpt provides: “If the Applicant has had forbearance or mortgage
        lates within the last 12-months, Tenant occupied properties will require documentation
        of (i) timely receipt for the prior two (2) months rental payments or (ii)
        12-months of subject''s payment in reserve, which may be from transaction''s
        cash-in-hand.” Neither source states how the two provisions relate. Whether
        the §5.32 alternatives can apply on Platinum Select where a late exists, which
        cases they cover (for example forbearance without a reported late), and whether
        “Applicant” includes guarantors of an entity borrower: Acra confirmation requested
        → Q-17. \[G §5.32, p. 3; P: Borrower Credit History Requirements\]'
