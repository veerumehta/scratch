- rule_id: acra-platinum.dscr_calculation_and_rent_evidence.verify_rent_schedule_and_rent_evidence
  condition:
    kind: procedure
    purpose: Confirm the required 1007 and any applicable documentation supporting
      lease rent.
    steps:
    - For a DSCR qualifying file, verify that a Single-Family Comparable Rent Schedule
      (FNMA Form 1007) is provided.
    - Verify that the 1007 is from the original appraiser or a state licensed appraiser.
    - For a lease-option purchase where the down payment required in §3.45 is generated
      from excess monthly rent contributions, verify that a 1007 is provided.
    - When proposed rental income is being used to qualify, verify that a 1007 is
      provided.
    - For a single family investment property with excessive monthly rent payments
      reflected on the lease, review documentation supporting that the monthly rent
      is typical for the area. Acceptable documentation may include classified ads
      from local newspapers, a 1007 completed by the appraiser, or a market rent survey
      completed by a local real estate company or rental management company familiar
      with market rents in the area.
    checks:
    - A Single-Family Comparable Rent Schedule (FNMA Form 1007) is provided for the
      DSCR qualifying file.
    - The 1007 is from the original appraiser or a state licensed appraiser.
    - If the transaction is a lease-option purchase and the down payment required
      in §3.45 is generated from excess monthly rent contributions, a 1007 is provided.
    - If proposed rental income is being used to qualify, a 1007 is provided.
    - If a single family investment property's lease reflects excessive monthly rent
      payments, documentation supports that the monthly rent is typical for the area.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable requirements are met subject to conditions that must
        be cleared.
    - status: FAIL
      verdict: violated
      criterion: A required step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case is not a DSCR qualifying file and none of the other stated
        1007 triggers applies.
    evidence_types: []
    reads:
    - dscr_documentation_type
    - loan_purpose
    - property_type
    - residential_unit_count
    - gross_rental_income
    computable_checks: []
    missing_reads:
    - Form 1007 and its appraiser's identity and licensing status
    - Whether the transaction is a lease-option purchase
    - Whether the down payment required in §3.45 is generated from excess monthly
      rent contributions
    - Whether proposed rental income is being used to qualify
    - Lease rent and evidence needed to determine whether the monthly rent is excessive
    - If monthly rent is excessive, supporting documentation such as classified ads
      from local newspapers, a 1007 completed by the appraiser, or a market rent survey
      completed by a local real estate company or rental management company familiar
      with market rents in the area
  action: require_evidence
  priority: 100
  description: Check required rent schedules and, when lease rent is excessive, supporting
    evidence that the rent is typical for the area.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy, purpose
    and qualification ¶2
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying rent,
    as printed in the Platinum Summary
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.4 Rent schedules
    and rent evidence
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-1.7 The program is offered through two channels with different
        minimum ratios: Correspondent ≥ 1.2, Wholesale ≥ 1.0 (PLAT-3.7). Matrix footnote
        3 also restricts Correspondent pricing (PLAT-2.3). \[P: Minimum DSCR; matrix
        footnote 3\]


        PLAT-1.8 Every loan must meet the applicable channel minimum DSCR. The Platinum
        Summary lists no No Ratio option and no allowance for a ratio below 1.0; a
        ratio below the channel minimum does not meet the published requirement. Whether
        No Ratio or sub-1.0 qualification exists on this program in any form: Acra
        confirmation requested → Q-12. \[P: Minimum DSCR\]


        PLAT-1.9 Acra will not calculate a DTI for applicants who qualify using a
        DSCR; income or employment listed on an application is superfluous to the
        underwrite and may be left blank, and if represented, a DTI should not be
        calculated. The Standard Summary''s statement that borrowing-entity income
        documentation is not required does not appear in the Platinum Summary; whether
        it applies: Acra confirmation requested → Q-13. \[G §7.3, p. 5\]


        PLAT-1.10 “A 1007 will always be required on DSCR transactions”; the Platinum
        Summary refers to market rent “as established on the 1007 or 1025”. Whether
        a Form 1025 alone satisfies the requirement for a two-unit property: Acra
        confirmation requested → Q-04. \[G §5.32, p. 3; §14.12, p. 4; P: Income Documentation\]


        PLAT-1.11 All borrowers purchasing or refinancing a one- to four-family investment
        property must execute a One- to Four-Family Rider with the loan documents
        and provide rent loss insurance coverage per §23.40 (PLAT-7.9 to 7.12). \[G
        §3.41, p. 11\]


        PLAT-1.12 Only the subject property, principal residence and second homes
        are required to be listed on the application or Schedule of Real Estate Owned.
        \[G §5.32, p. 3; §4.15, p. 5\]


        PLAT-3.1 “When calculating the DSCR, Acra will use the greater of the market
        rent as established on the 1007 or 1025, or actual rent. When using actual
        rent, the actual rent must be documented via evidence of 2 months’ proof of
        receipts and the lease must be in place for at least 3 months after the loan
        closing. This applies to long-term rents only and is not appropriate for short-term
        rentals.” \[P: Income Documentation & Debt Ratio Requirements\]


        PLAT-3.2 §5.32 of the excerpt states the general formula as “the lesser of
        (i) annual in-place rent or (ii) market rent”, then notes that “Acra may use
        the higher of actual or market rents” subject to “two (2) consecutive months
        proof of rental income receipt”, a lease continuing at least three months
        after closing, and: “Security Deposit does not count towards receipt, and
        the rents cannot be prepaid.” The Platinum Summary''s statement (PLAT-3.1)
        is program-specific; the excerpt''s general formula is reproduced here. Which
        governs Platinum Select and how they relate, whether “2 months’ proof of receipts”
        means consecutive months, and whether the security-deposit and prepaid-rent
        conditions apply: Acra confirmation requested → Q-03. \[G §5.32, p. 3\]


        PLAT-3.3 Short-term rentals are ineligible for the program (PLAT-7.2); the
        Seller''s Guide provisions on short-term rental income and appraisal forms
        are not restated (Appendix B). \[P: Subject Property Requirements\]


        PLAT-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA Form
        1007) for single family properties on (i) all DSCR qualifying files, (ii)
        lease-option purchase transactions where the down payment required in §3.45
        is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. A 1007 may be from the original appraiser
        or any state licensed appraiser. \[G §14.12, p. 4\]


        PLAT-3.10 Single family investment properties with excessive monthly rent
        payments reflected on the lease require documentation supporting that the
        monthly rent is typical for the area; acceptable documentation may include
        classified ads from local newspapers, a 1007 completed by the appraiser, or
        a market rent survey completed by a local real estate company or rental management
        company familiar with the market rents in the area. \[G §14.12, p. 4\]


        PLAT-3.11 Cash-out refinance: current lease agreement required (PLAT-1.5).
        \[P: Loan Purpose Requirements\]'
