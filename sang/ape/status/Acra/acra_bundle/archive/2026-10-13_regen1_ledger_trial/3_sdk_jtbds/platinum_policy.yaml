- rule_id: acra-platinum.loan_amount_decisioning_score_and_cltv_limits.apply_cltv_limits
  condition:
    kind: procedure
    purpose: Determine whether CLTV meets the matrix and the additional stated limits
      and adjustments.
    steps:
    - 'Apply the matrix row for the decisioning score and loan purpose: 730 and above,
      80% for Purchase, 80% for Rate & Term, and 75% for Cash-Out; 721 through 729,
      80%, 80%, and 65%, respectively; 700 through 720 on a literal reading of the
      printed thresholds, 80%, 80%, and 55%, respectively.'
    - Apply the 75.00% maximum CLTV when the loan amount is less than $350,000 or
      greater than $1,500,000.
    - Apply the 75.00% maximum CLTV for a Warrantable Condo or Two-Units property.
    - Apply the 75.00% maximum CLTV for Interest-Only (5 Yr Term).
    - Apply the 65% LTV / CLTV maximum when the property was listed for sale within
      six months.
    - For Correspondent loans with a score of 700-719, apply the stated 60% CLTV restriction;
      for a cash-out loan in that score range, do not use that restriction to raise
      the matrix’s 55% limit.
    - For a declining-market property, account for the stated -5% CLTV adjustment
      and obtain confirmation of how it combines with other caps.
    - Where the score is 720, or the Correspondent 700-719 restriction interacts with
      the matrix by purpose, obtain the requested Acra confirmation on treatment of
      the printed 721 threshold and the limits.
    checks:
    - cltv_pct does not exceed the matrix maximum for the decisioning score and loan_purpose,
      using the printed thresholds literally.
    - If loan_amount is less than $350,000 or greater than $1,500,000, cltv_pct does
      not exceed 75.00%.
    - If property_type is Warrantable Condo or Two-Units, cltv_pct does not exceed
      75.00%.
    - If product_is_interest_only is true, cltv_pct does not exceed 75.00%.
    - If listed_for_sale_last_6_months is true, cltv_pct does not exceed 65%.
    - If channel is Correspondent and the decisioning score is from 700 through 719,
      cltv_pct does not exceed 60%; a cash-out case in this range must also meet the
      matrix maximum.
    - If the property is in a declining market, the -5% CLTV adjustment is applied
      using the combination with other caps confirmed by Acra.
    - If the case has a score of 720, or is a Correspondent case with a score of 700-719,
      the applicable Q-01 treatment has been confirmed by Acra.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable CLTV check holds, and any applicable Q-01 or Q-08
        treatment has been confirmed and applied.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A Q-01 or Q-08 confirmation or declining-market profile needed to
        determine the applicable CLTV limit is pending.
    - status: FAIL
      verdict: violated
      criterion: Any applicable CLTV check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case has no CLTV limit to assess.
    evidence_types: []
    reads:
    - cltv_pct
    - fico
    - loan_purpose
    - loan_amount
    - property_type
    - product_is_interest_only
    - listed_for_sale_last_6_months
    - channel
    computable_checks:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    missing_reads:
    - Confirmation under Q-01 of whether the printed 721 threshold is intended and
      how a score of 720 is treated, including how the Correspondent restriction applies
      by purpose; whether the property is in a declining market and the property/borrower
      full profile needed for the -5% CLTV adjustment; confirmation under Q-08 of
      how that reduction combines with other caps.
  action: require_evidence
  priority: 100
  description: Identify each applicable published CLTV cap and check the case CLTV
    against it.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2. Loan amount,
    FICO and maximum CLTV
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2.1 Matrix as printed
    — Loan Amount, FICO, CLTV Requirements
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#Loan amount ≤ \$2,000,000
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2.2 Matrix footnotes,
    quoted
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2.3 Loan-amount
    conditions
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.3 Location
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1 Property types,
    as printed
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.2 Interest-only
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#11.1 Published CLTV
    caps and adjustments
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'One matrix covers all loan amounts to \$2,000,000. It is reproduced
        below exactly as printed, followed by its footnotes in Acra''s words. The
        printed FICO thresholds are 730, 721 and 700, which leaves a score of exactly
        720 to be read literally; the reading and its consequences are set out for
        Acra to confirm rather than adopted.


        PLAT-2.1 The rows below are Acra''s. Each row is a minimum-FICO threshold:
        a score at or above the threshold and below the next higher threshold takes
        that row. No row is printed below 700. \[P: Loan Amount, FICO, CLTV Requirements\]


        | **Min FICO** | **Purchase** | **Rate & Term** | **Cash-Out** |

        |--------------|--------------|-----------------|--------------|

        | 730          | 80%          | 80%             | 75%          |

        | 721          | 80%          | 80%             | 65%          |

        | 700          | 80%          | 80%             | 55%          |


        <table>

        <colgroup>

        <col style="width: 100%" />

        </colgroup>

        <tbody>

        <tr>

        <td><p><strong>THE PRINTED 721 THRESHOLD AND A SCORE OF 720</strong></p>

        <p>Read literally, a decisioning score of 720 falls in the 700 row (cash-out
        maximum 55%), sits outside the Correspondent restriction printed for “700-719
        FICO” (footnote 3), and takes the 3.25 ARM margin printed for “720-759”. This
        document does not normalize 721 to 720. Whether the 721 threshold is intended,
        and how 720 is treated on each of the three points: Acra confirmation requested
        → Q-01.</p></td>

        </tr>

        </tbody>

        </table>


        PLAT-2.2 Footnote 1, whose marker is printed on the Cash-Out column heading:
        “When LTV \> 65% Max Cash-in-Hand: \$1,000,000 for loans ≥ \$1,500,000, \$500,000
        for loans \< \$1,500,000.” Footnote 2, whose marker appears nowhere in the
        matrix: “When LTV ≤ 65%, unlimited cash-in-hand allowed.” The footnotes are
        stated in LTV while the matrix is labelled CLTV: Acra confirmation requested
        → Q-16. \[P: matrix footnotes 1–2\]


        PLAT-2.3 Footnote 3, whose marker also appears nowhere in the matrix: “Correspondent
        Pricing limited to 60% CLTV for 700-719 FICO”. For a Correspondent cash-out
        at 700-719 the matrix already prints 55%; the 60% footnote does not raise
        that figure. How the two limits apply together by purpose: Acra confirmation
        requested → Q-01. \[P: matrix footnote 3\]


        PLAT-2.4 Footnote \*: “Delayed financing is capped at \$1.5MM” (PLAT-1.4,
        Q-02). \[P: matrix footnote\]


        PLAT-2.5 Loan amount \< \$350,000 or \> \$1,500,000: maximum CLTV 75.00% (PLAT-1.14).
        \[P: Loan Amount Requirements\]


        PLAT-1.16 Under the heading “Ineligible State: Non-Owner Occupied” the Summary
        lists “SD, U.S. Terrs.” \[P: Subject Property Location Requirements\]


        PLAT-1.17 Declining market: “-5% CLTV property/borrower full profile”. How
        this reduction combines with other caps: Acra confirmation requested → Q-08.
        \[P: Subject Property Location Requirements\]


        PLAT-7.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo, Two-Units.
        “Two-Units, Warrantable Condo, Max CLTV: 75.00%”. \[P: Subject Property Requirements\]


        PLAT-7.2 “Rural Properties, Condotels, Non-Warrantable Condos ineligible”;
        “Short-Term Rentals (STR) ineligible”. \[P: Subject Property Requirements\]


