- rule_id: acra-platinum.property_eligibility_and_property_specific_conditions.property_type_and_location_eligibility.python
  condition:
    kind: python
    source: "import rules_lib\n\n\ndef check(ctx):\n    property_type = ctx['property_type']\n\
      \    property_state = ctx['property_state']\n    missing = rules_lib.gaps(property_type=property_type,\
      \ property_state=property_state)\n    if missing:\n        return rules_lib.unknown(*missing)\n\
      \n    if rules_lib.same(property_state, 'SD', 'U.S. Terrs'):\n        return\
      \ (False, {'property_type_status': 'not evaluated', 'property_state': property_state})\n\
      \n    eligible_types = ('SFR', 'Townhome', 'PUD', 'Warrantable Condo', 'Two-Units')\n\
      \    ineligible_types = ('Rural Properties', 'Condotels', 'Non-Warrantable Condos',\
      \ 'Short-Term Rentals')\n    if rules_lib.same(property_type, *ineligible_types):\n\
      \        return (False, {'property_type_status': 'ineligible', 'property_state':\
      \ property_state})\n\n    if rules_lib.same(property_type, 'Warrantable Condo',\
      \ 'Two-Units'):\n        cltv_pct = ctx['cltv_pct']\n        missing = rules_lib.gaps(cltv_pct=cltv_pct)\n\
      \        if missing:\n            return rules_lib.unknown(*missing)\n     \
      \   return (cltv_pct <= 75.00, {\n            'property_type_status': 'eligible',\n\
      \            'property_state': property_state,\n            'cltv_pct': cltv_pct,\n\
      \            'max_cltv_pct': 75.00,\n        })\n\n    if rules_lib.same(property_type,\
      \ *eligible_types):\n        return (True, {'property_type_status': 'eligible',\
      \ 'property_state': property_state})\n\n    # Unlisted property types are not\
      \ treated as ineligible; their status needs review.\n    return (True, {'property_type_status':\
      \ 'not addressed; review required', 'property_state': property_state})"
    entrypoint: check
    reads:
    - property_type
    - property_state
    - cltv_pct
    derived_from: acra-platinum.property_eligibility_and_property_specific_conditions.property_type_and_location_eligibility
