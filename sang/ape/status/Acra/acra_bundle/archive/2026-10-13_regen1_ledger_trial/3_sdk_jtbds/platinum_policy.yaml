- rule_id: acra-platinum.loan_amount_decisioning_score_and_cltv_limits.determine_decisioning_score_and_tradelines
  condition:
    kind: procedure
    purpose: Determine whether the decisioning score and tradelines meet PLAT-6.1
      through PLAT-6.5.
    steps:
    - 'Determine the decisioning score using the applicable PLAT-6.1 rule: the Primary
      Wage Earner middle score; for a loan closing in an entity’s name, the highest
      middle score of personal guarantors when ownership percentages are equal; or,
      when ownership percentages differ, the individual with the highest concentration
      of ownership.'
    - Check that the decisioning score is at least 700.
    - For applicants with scores from 3 repositories, apply no tradeline overlay;
      for applicants with 2 or fewer scores, check the stated tradeline and history
      requirement.
    checks:
    - The decisioning score is selected in accordance with PLAT-6.1.
    - fico is at least 700.
    - credit_score_count is 3, or credit_score_count is 2 or fewer and tradelines_meet_requirement
      is true.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The score-selection check and minimum-score check hold, and the applicable
        tradeline requirement holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required score-selection detail or tradeline/history detail is
        pending, or a Q-05 score-selection question applies and awaits confirmation.
    - status: FAIL
      verdict: violated
      criterion: The decisioning score is below 700, the score is not selected in
        accordance with the applicable rule, or the applicable tradeline requirement
        does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case has no applicant decisioning score or tradeline requirement
        to assess.
    evidence_types: []
    reads:
    - borrower_entity_type
    - entity_is_borrower_1
    - ownership_months
    - credit_score_count
    - fico
    - tradelines_meet_requirement
    computable_checks:
    - 1
    - 2
    missing_reads:
    - Middle scores for the relevant wage earner or personal guarantors; entity loan
      ownership percentages and guarantor ownership concentrations, as applicable;
      identification of the Primary Wage Earner; confirmation under Q-05 of how the
      decisioning score is set with one score or two scores, whether a no-score pathway
      exists, how the Primary Wage Earner is identified without income documentation,
      and whose score is used when two or more guarantors hold an equal largest ownership
      interest and ownership is not equal across all guarantors; for applicants with
      2 or fewer scores, the tradeline count and history needed to establish 2 tradelines
      & 24 month history or 3 tradelines & 12 month history.
  action: require_evidence
  priority: 100
  description: Apply the stated decisioning-score selection rule, minimum score, and
    tradeline requirements.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.1 Decisioning
    score and tradelines
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-6.1 “Decisioning Credit Score: Primary Wage Earner middle score.
        For loans that close in the name of an entity, use the highest middle score
        of the personal guarantors, presuming equal percentages of ownership. If ownership
        percentages differ, use the individual with the highest concentration of ownership.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.2 Minimum decisioning score 700 (no matrix row below 700, PLAT-2.1);
        Correspondent pricing limited to 60% CLTV for 700-719 (PLAT-2.3). \[P: matrix;
        footnote 3\]


        PLAT-6.3 “Tradelines: Applicants with scores from 3 repositories are deemed
        to be acceptable with no tradeline overlay. 2 tradelines & 24 month history
        or 3 tradelines & 12 month history for applicants with 2 or fewer scores.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.4 Applicants with one score are within “2 or fewer scores” for the
        tradeline requirement above. The Platinum Summary does not state how the decisioning
        score is set with one score or with two scores, whether any no-score pathway
        exists, or how “Primary Wage Earner” is identified on a file with no income
        documentation. The Standard Summary''s one-or-no-score provision is not restated
        here: Acra confirmation requested → Q-05. \[P: Borrower Credit History Requirements\]


        PLAT-6.5 Where two or more guarantors hold an equal largest ownership interest
        and ownership is not equal across all guarantors, PLAT-6.1 does not say whose
        score is used: Acra confirmation requested → Q-05. \[P: Borrower Credit History
        Requirements\]'
