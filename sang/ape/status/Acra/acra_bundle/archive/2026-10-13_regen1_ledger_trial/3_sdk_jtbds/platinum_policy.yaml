rules:
- rule_id: acra-platinum.borrower_eligibility_and_credit_history.borrower_citizenship_and_homeownership_eligibility
  condition:
    kind: procedure
    purpose: Determine whether the borrower meets the stated citizenship and homeownership
      eligibility requirements.
    steps:
    - Check whether the borrower is a US Citizen or Permanent Resident.
    - If the borrower is a Permanent Resident, verify an unexpired PRA ID and SSA
      card / SSA-89.
    - Check whether the application is for a First Time Homebuyer. Acra defines a
      First Time Home Buyer as “an application where all Applicants have never previously
      owned a home (real property)”.
    - Verify that at least one guarantor has prior homeownership experience and that
      at least one borrower / guarantor attests on the application that they are not
      a first-time homebuyer. Applicability of the guarantor requirements to individual
      borrowers as well as entities is part of Q-13.
    checks:
    - The borrower’s citizenship type is US Citizen or Permanent Resident.
    - If the borrower is a Permanent Resident, the borrower has an unexpired PRA ID
      and SSA card / SSA-89.
    - The application is not a First Time Homebuyer application.
    - At least one guarantor has prior homeownership experience.
    - At least one borrower / guarantor attests on the application that they are not
      a first-time homebuyer.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Eligibility requirements are otherwise met, subject to obtaining
        required documentation, attestation, or Acra confirmation that must be cleared.
    - status: FAIL
      verdict: violated
      criterion: The borrower is not a US Citizen or Permanent Resident, the application
        is for a First Time Homebuyer, or an applicable requirement is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: This job does not apply to the case.
    evidence_types: []
    reads:
    - citizenship_type
    - first_time_homebuyer
    - borrower_entity_type
    computable_checks:
    - 0
    - 2
    missing_reads:
    - Unexpired PRA ID
    - SSA card / SSA-89
    - Prior homeownership history for at least one guarantor
    - Application attestation by at least one borrower / guarantor
    - Acra confirmation on whether the guarantor requirements apply to individual
      borrowers as well as entities (Q-13)
  action: require_evidence
  priority: 100
  description: Verify borrower citizenship eligibility and the program’s first-time-homebuyer
    and guarantor requirements.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#4. Borrower eligibility
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'The Platinum Summary lists two eligible citizenship types and excludes
        first-time homebuyers. Borrowing entities, guarantors and trusts follow the
        Seller''s Guide excerpt and are in section 5.


        PLAT-4.1 Eligible borrower citizenship types: US Citizen, Permanent Resident.
        \[P: Borrower Citizenship Requirements\]


        PLAT-4.2 Permanent Resident must have an unexpired PRA ID and SSA card / SSA-89.
        \[P: Borrower Citizenship Requirements\]


        PLAT-4.3 Non-permanent residents, foreign nationals and ITIN borrowers are
        not among the listed eligible types. The Seller''s Guide foreign-national
        program (§3.10) is therefore not restated (Appendix B). \[P: Borrower Citizenship
        Requirements\]


        PLAT-4.4 “First Time Homebuyer (FTHB) ineligible for this program”. Acra defines
        a First Time Home Buyer as “an application where all Applicants have never
        previously owned a home (real property)”; the §3.13 DSCR allowance for first-time
        homebuyers is not restated (Appendix B). \[P: Borrower Credit History Requirements;
        G §3.13, p. 10\]


        PLAT-4.5 §3.12 requires at least one guarantor to have prior homeownership
        experience, and at least one borrower / guarantor to attest on the application
        that they are not a first-time homebuyer (PLAT-5.9). Whether it applies to
        individual borrowers as well as entities is part of Q-13. \[G §3.12, p. 7\]'
  approval_refs: []
- rule_id: acra-platinum.borrower_eligibility_and_credit_history.decisioning_score_and_tradelines
  condition:
    kind: procedure
    purpose: Determine whether the applicant’s decisioning score and tradelines meet
      the Platinum Summary requirements.
    steps:
    - For a loan that does not close in the name of an entity, identify the Primary
      Wage Earner middle score as the decisioning credit score.
    - For a loan that closes in the name of an entity, use the highest middle score
      of the personal guarantors, presuming equal percentages of ownership. If ownership
      percentages differ, use the individual with the highest concentration of ownership.
    - Check that the decisioning credit score is at least 700.
    - 'Apply the tradeline rule: applicants with scores from 3 repositories are acceptable
      with no tradeline overlay; applicants with 2 or fewer scores require 2 tradelines
      & 24 month history or 3 tradelines & 12 month history.'
    - If the case has one score, treat it as within “2 or fewer scores” for the tradeline
      requirement. Do not infer a decisioning-score rule for one or two scores, a
      no-score pathway, how to identify the Primary Wage Earner without income documentation,
      or which score to use when two or more guarantors hold an equal largest ownership
      interest and ownership is not equal across all guarantors; those matters require
      Acra confirmation (Q-05).
    checks:
    - The decisioning credit score is the Primary Wage Earner middle score, or, for
      an entity loan, the score selected using the stated personal-guarantor and ownership
      rule.
    - The decisioning credit score is at least 700.
    - Applicants with scores from 3 repositories are treated as acceptable with no
      tradeline overlay, and applicants with 2 or fewer scores meet 2 tradelines &
      24 month history or 3 tradelines & 12 month history.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The requirements are otherwise met, subject to obtaining missing
        score, ownership, income, or tradeline information, or Acra confirmation that
        must be cleared.
    - status: FAIL
      verdict: violated
      criterion: The decisioning score is below 700 or an applicable tradeline requirement
        is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: This job does not apply to the case.
    evidence_types: []
    reads:
    - borrower_entity_type
    - credit_score_count
    - fico
    - entity_is_borrower_1
    - tradelines_meet_requirement
    computable_checks:
    - 1
    missing_reads:
    - Middle scores for the relevant applicant or personal guarantors
    - Income documentation needed to identify the Primary Wage Earner where not identified
    - Ownership percentages and the ownership concentration of each personal guarantor
    - Tradeline counts and history durations
    - Acra confirmation on decisioning-score treatment for one or two scores, any
      no-score pathway, identifying the Primary Wage Earner without income documentation,
      and equal largest guarantor ownership interests (Q-05)
  action: require_evidence
  priority: 100
  description: Apply the stated decisioning-score selection and minimum-score rules,
    then verify the applicable tradeline requirement.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.1 Decisioning
    score and tradelines
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-6.1 “Decisioning Credit Score: Primary Wage Earner middle score.
        For loans that close in the name of an entity, use the highest middle score
        of the personal guarantors, presuming equal percentages of ownership. If ownership
        percentages differ, use the individual with the highest concentration of ownership.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.2 Minimum decisioning score 700 (no matrix row below 700, PLAT-2.1);
        Correspondent pricing limited to 60% CLTV for 700-719 (PLAT-2.3). \[P: matrix;
        footnote 3\]


        PLAT-6.3 “Tradelines: Applicants with scores from 3 repositories are deemed
        to be acceptable with no tradeline overlay. 2 tradelines & 24 month history
        or 3 tradelines & 12 month history for applicants with 2 or fewer scores.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.4 Applicants with one score are within “2 or fewer scores” for the
        tradeline requirement above. The Platinum Summary does not state how the decisioning
        score is set with one score or with two scores, whether any no-score pathway
        exists, or how “Primary Wage Earner” is identified on a file with no income
        documentation. The Standard Summary''s one-or-no-score provision is not restated
        here: Acra confirmation requested → Q-05. \[P: Borrower Credit History Requirements\]


        PLAT-6.5 Where two or more guarantors hold an equal largest ownership interest
        and ownership is not equal across all guarantors, PLAT-6.1 does not say whose
        score is used: Acra confirmation requested → Q-05. \[P: Borrower Credit History
        Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.borrower_eligibility_and_credit_history.escrow_waiver_eligibility
  condition:
    kind: procedure
    purpose: Determine whether a requested escrow waiver meets the printed loan-amount,
      mortgage-history, and Section 35 requirements.
    steps:
    - If no escrow waiver is requested, stop; this job does not apply.
    - For a requested waiver, verify that the loan amount does not exceed $1.5M.
    - Verify “0x30x24 Mortgage History required”.
    - Verify that the loan is not a Section 35 loan. “Section 35” is not defined in
      the sources; Acra confirmation is requested (Q-14). Do not apply a CLTV or FICO
      limit, as none is printed for the Platinum waiver.
    checks:
    - If an escrow waiver is requested, the loan amount is no more than $1.5M.
    - If an escrow waiver is requested, the required “0x30x24 Mortgage History” is
      met.
    - If an escrow waiver is requested, the loan is not a Section 35 loan.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: An escrow waiver is requested and every applicable step is met and
        every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: An escrow waiver is requested and the requirements are otherwise
        met, subject to obtaining required mortgage-history information or Acra clarification
        that must be cleared.
    - status: FAIL
      verdict: violated
      criterion: An escrow waiver is requested and the loan amount exceeds $1.5M,
        the required mortgage history is not met, or the loan is a Section 35 loan.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: No escrow waiver is requested.
    evidence_types: []
    reads:
    - escrow_waiver_requested
    - loan_amount
    computable_checks:
    - 0
    missing_reads:
    - Mortgage-history details
    - Acra definition of “0x30x24” (Q-06)
    - Information establishing whether the loan is a Section 35 loan
    - Acra confirmation on the meaning of “Section 35” (Q-14)
  action: require_evidence
  priority: 100
  description: Apply the stated escrow-waiver requirements only when an escrow waiver
    is requested.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.4 Escrow waiver
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-6.13 Escrow waiver: maximum loan amount \$1.5M; “0x30x24 Mortgage
        History required, Section 35 loans ineligible”. No CLTV or FICO limit is printed
        for the Platinum waiver, and “Section 35” is not defined in the sources: Acra
        confirmation requested → Q-09 and Q-14. \[P: Escrow Waiver Requirements\]


        PLAT-6.14 Impounds are separately required on a property listed for sale (§11.5,
        PLAT-7.8). \[G §11.5, p. 12\]'
  approval_refs: []
- rule_id: acra-platinum.borrower_eligibility_and_credit_history.housing_history_and_previous_credit_events
  condition:
    kind: procedure
    purpose: Determine whether the case meets the stated “0x30x12” housing-history
      and “48 Mo Seasoning” previous-credit-event requirements, subject to the requested
      clarifications.
    steps:
    - Review the borrower’s housing history against the requirement labeled “0x30x12”.
    - Review applicable Previous Credit Events (PCEs) against the requirement labeled
      “48 Mo Seasoning”.
    - Do not assume which events are covered, the starting event or ending date, the
      month-counting convention, or the treatment of modifications and forbearance;
      Acra confirmation is requested (Q-06).
    checks:
    - The housing history meets “0x30x12”.
    - Applicable Previous Credit Events (PCEs) meet “48 Mo Seasoning”.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds under the applicable
        clarified requirements.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The case is otherwise eligible, subject to obtaining the required
        history information or Acra clarifications that must be cleared.
    - status: FAIL
      verdict: violated
      criterion: The housing history or an applicable previous credit event does not
        meet the applicable requirement.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: This job does not apply to the case.
    evidence_types: []
    reads:
    - housing_history
    - bankruptcy_or_foreclosure
    - months_since_bankruptcy_or_foreclosure
    - short_sale_dil_or_modification
    - months_since_short_sale_dil_or_modification
    computable_checks: []
    missing_reads:
    - Acra definition of “0x30x12” and “0x30x24” (Q-06)
    - Acra confirmation of which Previous Credit Events are covered, the starting
      event and ending date, the month-counting convention, and the treatment of modifications
      and forbearance (Q-06)
    - Housing-history details
    - Previous credit-event details and dates
  action: require_evidence
  priority: 100
  description: Review the stated housing-history and previous-credit-event requirements
    without supplying definitions the source does not provide.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.2 Housing history
    and previous credit events
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-6.6 Housing History: “0x30x12”. \[P: Borrower Credit History Requirements\]


        PLAT-6.7 The label is reproduced as printed; its definition, and that of “0x30x24”
        in the escrow-waiver panel: Acra confirmation requested → Q-06. \[P: Borrower
        Credit History Requirements\]


        PLAT-6.8 Previous Credit Events (PCEs): “48 Mo Seasoning”. Which events are
        covered, the starting event and ending date, the month-counting convention,
        and the treatment of modifications and forbearance: Acra confirmation requested
        → Q-06. \[P: Borrower Credit History Requirements\]


        PLAT-6.9 “First Time Homebuyer (FTHB) ineligible for this program” (PLAT-4.4).
        \[P: Borrower Credit History Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.borrower_eligibility_and_credit_history.mortgage_and_rental_payment_history
  condition:
    kind: procedure
    purpose: Determine whether the mortgage / rental rating review uses the required
      properties and history period, including the DSCR documentation scope.
    steps:
    - For determining mortgage pricing, evaluate ratings for properties the borrower
      owns and / or rents over the last twelve (12) months.
    - Consider all reported mortgages on credit. Where the applicant has mortgages
      that are not reported, review documentation for the applicant’s primary residence(s),
      any secondary residence(s), and the subject property.
    - For DSCR loans, require documentation on the subject property, principal residence,
      and second home (if any) of the borrower and / or guarantor(s). Require payment
      history for the primary residence, subject property, and second homes, if applicable.
      Additional properties do not require housing history to be documented unless
      documents in the file suggest a major credit event has occurred, for example
      a foreclosure listing the borrower (individually or as guarantor) on the credit
      report.
    - For a loan that has matured, rate it based on the maturity date of the loan;
      any extensions of the maturity date must be in writing.
    checks:
    - Mortgage / rental ratings for properties the borrower owns and / or rents over
      the last twelve (12) months have been evaluated.
    - All reported mortgages on credit have been considered, and documentation is
      present to evaluate history on primary residence(s), any secondary residence(s),
      and the subject property where the applicant has mortgages that are not reported.
    - For a DSCR loan, documentation and payment history cover the subject property,
      primary residence, and second home (if any) of the borrower and / or guarantor(s),
      with additional-property housing history documented when file documents suggest
      a major credit event has occurred.
    - A matured loan is rated based on its maturity date, and any extension of the
      maturity date is in writing.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The requirements are otherwise met, subject to obtaining required
        payment-history, mortgage, maturity-date, or written-extension documentation
        that must be cleared.
    - status: FAIL
      verdict: violated
      criterion: An applicable history-scope or matured-loan requirement is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: This job does not apply to the case.
    evidence_types: []
    reads:
    - loan_purpose
    - housing_history
    - occupancy_subtype
    - property_type
    computable_checks: []
    missing_reads:
    - Mortgage and rental ratings for the last twelve (12) months
    - Reported mortgage information
    - Documentation of history for mortgages not reported on credit
    - DSCR payment-history documentation for the subject property, primary residence,
      and second home (if any)
    - File documentation indicating whether a major credit event has occurred on an
      additional property
    - Loan maturity date
    - Written maturity-date extensions, if any
  action: require_evidence
  priority: 100
  description: Review the required mortgage or rental history scope and apply the
    stated rules for matured loans.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.3 Mortgage / rental
    rating and payment history
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-6.10 The mortgage / rental rating for determining mortgage pricing
        is determined by evaluating the ratings for properties the borrower owns and
        / or rents over the last twelve (12) months. All reported mortgages on credit
        should be considered; where the applicant has mortgages that are not reported,
        the file should contain documentation to evaluate history on the applicant''s
        primary residence(s), any secondary residence(s), and the subject property.
        \[G §4.15, p. 5\]


        PLAT-6.11 DSCR loans only require documentation on the subject property, principal
        residence, and second home (if any) of the borrower and / or guarantor(s).
        Additional properties do not require housing history to be documented unless
        documents in the file suggest a major credit event has occurred, for example
        a foreclosure listing the borrower (individually or as guarantor) on the credit
        report. For DSCR loans, the payment history is required for the primary residence,
        subject property, and second homes, if applicable. \[G §4.15, p. 5; §6.7,
        p. 6\]


        PLAT-6.12 Loans that have matured are rated based on the maturity date of
        the loan; any extensions of the maturity date must be in writing. \[G §4.15,
        p. 5\]'
  approval_refs: []
- rule_id: acra-platinum.dscr_calculation_and_rent_evidence.calculate_dscr_and_test_the_channel_minimum
  condition:
    kind: procedure
    purpose: Determine the qualifying DSCR and whether it meets the minimum for the
      loan channel.
    steps:
    - Confirm the transaction is a DSCR transaction and identify whether the rental
      income is long-term or short-term.
    - Use the greater of market rent as established on the 1007 or 1025, or actual
      rent, as the qualifying rent.
    - If actual rent is used, verify evidence of 2 months’ proof of receipts and that
      the lease is in place for at least 3 months after loan closing.
    - Calculate the denominator using annual principal, interest, real estate taxes,
      property insurance, and homeowner's / condominium association fees (collectively,
      ‘PITIA’); include subordinate financing, if applicable.
    - Use the first payment due under the terms of the Note when calculating the DSCR.
      If the loan is interest-only, do not decide which payment enters the denominator;
      that question is identified as Q-21.
    - 'Compare the resulting DSCR with the applicable channel minimum: Correspondent
      ≥ 1.2; Wholesale ≥ 1.0.'
    checks:
    - The rental income used to qualify is long-term, not short-term.
    - The qualifying rent is the greater of market rent established on the 1007 or
      1025, or actual rent.
    - If actual rent is used, evidence documents 2 months’ proof of receipts.
    - If actual rent is used, the lease is in place for at least 3 months after loan
      closing.
    - The denominator includes annual principal, interest, real estate taxes, property
      insurance, and homeowner's / condominium association fees, and includes subordinate
      financing if applicable.
    - The DSCR calculation uses the first payment due under the terms of the Note.
    - 'The DSCR is at least the applicable channel minimum: Correspondent ≥ 1.2; Wholesale
      ≥ 1.0.'
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable requirements are met subject to conditions that must
        be cleared.
    - status: FAIL
      verdict: violated
      criterion: A required step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case is not a DSCR transaction.
    evidence_types: []
    reads:
    - channel
    - dscr_documentation_type
    - gross_rental_income
    - pitia
    - product_is_interest_only
    - interest_only_10_40
    - loan_purpose
    - property_type
    - residential_unit_count
    computable_checks: []
    missing_reads:
    - Rental term type (long-term or short-term)
    - Market rent established on the 1007 or 1025
    - Actual rent amount, if used
    - Evidence of 2 months’ proof of actual-rent receipts, if actual rent is used
    - Lease term and loan closing date, if actual rent is used
    - Annual principal, interest, real estate taxes, property insurance, and homeowner's
      / condominium association fees
    - Subordinate financing amount, if applicable
    - First payment due under the terms of the Note
    - For an interest-only loan, Acra's answer to Q-21 on which payment enters the
      DSCR denominator
  action: require_evidence
  priority: 100
  description: Apply the stated rent numerator, PITIA denominator, and channel minimum
    without resolving open policy questions.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy, purpose
    and qualification ¶2
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3. DSCR calculation
    and rental income
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying rent,
    as printed in the Platinum Summary
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The ratio
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.3 Minimum ratio
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.2 Interest-only
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-1.7 The program is offered through two channels with different
        minimum ratios: Correspondent ≥ 1.2, Wholesale ≥ 1.0 (PLAT-3.7). Matrix footnote
        3 also restricts Correspondent pricing (PLAT-2.3). \[P: Minimum DSCR; matrix
        footnote 3\]


        PLAT-1.8 Every loan must meet the applicable channel minimum DSCR. The Platinum
        Summary lists no No Ratio option and no allowance for a ratio below 1.0; a
        ratio below the channel minimum does not meet the published requirement. Whether
        No Ratio or sub-1.0 qualification exists on this program in any form: Acra
        confirmation requested → Q-12. \[P: Minimum DSCR\]


        PLAT-1.9 Acra will not calculate a DTI for applicants who qualify using a
        DSCR; income or employment listed on an application is superfluous to the
        underwrite and may be left blank, and if represented, a DTI should not be
        calculated. The Standard Summary''s statement that borrowing-entity income
        documentation is not required does not appear in the Platinum Summary; whether
        it applies: Acra confirmation requested → Q-13. \[G §7.3, p. 5\]


        PLAT-1.10 “A 1007 will always be required on DSCR transactions”; the Platinum
        Summary refers to market rent “as established on the 1007 or 1025”. Whether
        a Form 1025 alone satisfies the requirement for a two-unit property: Acra
        confirmation requested → Q-04. \[G §5.32, p. 3; §14.12, p. 4; P: Income Documentation\]


        PLAT-1.11 All borrowers purchasing or refinancing a one- to four-family investment
        property must execute a One- to Four-Family Rider with the loan documents
        and provide rent loss insurance coverage per §23.40 (PLAT-7.9 to 7.12). \[G
        §3.41, p. 11\]


        PLAT-1.12 Only the subject property, principal residence and second homes
        are required to be listed on the application or Schedule of Real Estate Owned.
        \[G §5.32, p. 3; §4.15, p. 5\]


        The Platinum Summary states its own rule for qualifying rent; the Seller''s
        Guide excerpt supplies the denominator, the payment used, the rent-schedule
        requirements and the treatment of applicants with recent forbearance or lates.
        Both are quoted where they differ.


        PLAT-3.1 “When calculating the DSCR, Acra will use the greater of the market
        rent as established on the 1007 or 1025, or actual rent. When using actual
        rent, the actual rent must be documented via evidence of 2 months’ proof of
        receipts and the lease must be in place for at least 3 months after the loan
        closing. This applies to long-term rents only and is not appropriate for short-term
        rentals.” \[P: Income Documentation & Debt Ratio Requirements\]


        PLAT-3.2 §5.32 of the excerpt states the general formula as “the lesser of
        (i) annual in-place rent or (ii) market rent”, then notes that “Acra may use
        the higher of actual or market rents” subject to “two (2) consecutive months
        proof of rental income receipt”, a lease continuing at least three months
        after closing, and: “Security Deposit does not count towards receipt, and
        the rents cannot be prepaid.” The Platinum Summary''s statement (PLAT-3.1)
        is program-specific; the excerpt''s general formula is reproduced here. Which
        governs Platinum Select and how they relate, whether “2 months’ proof of receipts”
        means consecutive months, and whether the security-deposit and prepaid-rent
        conditions apply: Acra confirmation requested → Q-03. \[G §5.32, p. 3\]


        PLAT-3.3 Short-term rentals are ineligible for the program (PLAT-7.2); the
        Seller''s Guide provisions on short-term rental income and appraisal forms
        are not restated (Appendix B). \[P: Subject Property Requirements\]


        PLAT-3.4 Denominator, per §5.32: “the sum of annual principal, interest, real
        estate taxes, property insurance, and homeowner''s / condominium association
        fees (collectively, ‘PITIA’). Subordinate financing, if applicable, would
        also be included in the denominator for the sake of this calculation.” \[G
        §5.32, p. 3\]


        PLAT-3.5 “Acra calculates the DSCR utilizing the first payment due under the
        terms of the Note.” §7.5 defines Interest Only payments as “the amount sufficient
        to pay the accrued interest to the mortgage on a monthly basis at the time
        of origination”, while the §5.32 denominator lists “annual principal, interest
        …”. Which payment enters the DSCR denominator on an interest-only loan: Acra
        confirmation requested → Q-21. \[G §7.5, p. 13; §5.32, p. 3\]


        PLAT-3.6 The reference to subordinate financing in the denominator is a calculation
        rule; it does not itself establish that a subordinate lien is permitted. The
        Platinum Summary does not address subordinate financing or restate the Standard
        Summary''s HELOC calculation: Acra confirmation requested → Q-15. \[G §5.32,
        p. 3\]


        PLAT-3.7 Minimum Debt Service Coverage Ratio: Correspondent ≥ 1.2; Wholesale
        ≥ 1.0. \[P: Minimum DSCR\]


        PLAT-3.8 Property listed for sale within six months (§11.5): the excerpt requires
        “≥1.0 DSCR”; on this program the channel minimum applies — Wholesale 1.0,
        Correspondent 1.2 (PLAT-7.8). \[G §11.5, p. 11; P: Minimum DSCR\]


        PLAT-9.3 “Interest-Only (5 Yr Term), Max CLTV: 75.00%”. \[P: Product Requirements
        — Restrictions\]


        PLAT-9.4 No minimum loan amount or minimum FICO is printed for interest-only
        loans on Platinum Select: Acra confirmation requested → Q-09. \[P: Product
        Requirements\]


        PLAT-9.5 Interest-only is not available on a property listed for sale (PLAT-7.8).
        \[G §11.5, p. 11\]


        PLAT-9.6 Interest Only payments are calculated as the amount sufficient to
        pay the accrued interest on the mortgage monthly at the time of origination,
        usually for a set term at the beginning of the repayment term; after that
        term the payments are recast to a fully amortized payment for the balance
        of the term ending at maturity. Acra calculates the DSCR using the first payment
        due under the Note (PLAT-3.5; which payment enters the denominator on an interest-only
        loan is Q-21). The excerpt''s DTI calculation for interest-only loans is a
        DTI-program provision — Q-14. \[G §7.5, p. 13\]'
  approval_refs: []
- rule_id: acra-platinum.dscr_calculation_and_rent_evidence.verify_current_lease_for_cash_out_refinance
