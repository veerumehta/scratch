- rule_id: acra-platinum.products_arm_terms_and_interest_only_terms.verify_interest_only_payment_and_dscr_treatment
  condition:
    kind: procedure
    purpose: Determine whether the interest-only payment mechanics and DSCR treatment
      are established for the loan.
    steps:
    - Establish whether the loan is interest-only.
    - Review the interest-only payment terms at origination and the payment terms
      after the interest-only term.
    - Verify that Acra calculates DSCR utilizing the first payment due under the terms
      of the Note.
    - For an interest-only loan, obtain Acra confirmation of which payment enters
      the DSCR denominator; do not infer the answer from the stated DSCR and interest-only
      provisions.
    - Verify that the DSCR denominator includes annual principal, interest, real estate
      taxes, property insurance, and homeowner's / condominium association fees (PITIA),
      and subordinate financing if applicable.
    checks:
    - The interest-only payment at origination is the amount sufficient to pay the
      accrued interest on the mortgage monthly.
    - After the interest-only term, payments are recast to a fully amortized payment
      for the balance of the term ending at maturity.
    - Acra calculates DSCR utilizing the first payment due under the terms of the
      Note.
    - For an interest-only loan, Acra has confirmed which payment enters the DSCR
      denominator.
    - The DSCR denominator includes annual principal, interest, real estate taxes,
      property insurance, and homeowner's / condominium association fees (PITIA),
      and subordinate financing if applicable.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The loan is interest-only and all five checks hold, including Acra’s
        confirmation of the DSCR denominator payment.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The loan is interest-only, and one or more required payment terms,
        calculation inputs, or Acra’s confirmation remain outstanding.
    - status: FAIL
      verdict: violated
      criterion: The loan is interest-only and any established payment or DSCR check
        does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The loan is not an interest-only product.
    evidence_types: []
    reads:
    - product_is_interest_only
    computable_checks: []
    missing_reads:
    - Note payment schedule and first payment due
    - interest-only payment amount and term
    - Acra confirmation of which payment enters the DSCR denominator for an interest-only
      loan
    - annual principal, interest, real estate taxes, property insurance, and homeowner's
      / condominium association fees
    - whether subordinate financing applies and, if applicable, its payment amount
  action: require_evidence
  priority: 100
  description: Review interest-only payment mechanics and the stated DSCR calculation
    instructions without resolving the open denominator question by assumption.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The ratio
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.2 Interest-only
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-3.4 Denominator, per §5.32: “the sum of annual principal, interest,
        real estate taxes, property insurance, and homeowner''s / condominium association
        fees (collectively, ‘PITIA’). Subordinate financing, if applicable, would
        also be included in the denominator for the sake of this calculation.” \[G
        §5.32, p. 3\]


