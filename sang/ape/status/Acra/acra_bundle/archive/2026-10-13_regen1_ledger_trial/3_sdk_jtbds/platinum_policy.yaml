    - status: PASS
      verdict: satisfied
      criterion: Subordinate financing is absent, or Acra has confirmed that it is
        permitted.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Subordinate financing is present or proposed and Acra’s confirmation
        is outstanding.
    - status: FAIL
      verdict: violated
      criterion: Acra has confirmed that subordinate financing is not permitted and
        it is present or proposed.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: This review does not apply because there is no subordinate financing
        present or proposed.
    evidence_types: []
    reads: []
    computable_checks: []
    missing_reads:
    - whether subordinate financing is present or proposed
    - Acra confirmation whether subordinate financing is permitted
