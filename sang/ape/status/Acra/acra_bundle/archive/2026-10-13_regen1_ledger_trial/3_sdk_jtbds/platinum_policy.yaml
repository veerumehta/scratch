- rule_id: acra-platinum.products_arm_terms_and_interest_only_terms.resolve_interest_only_minimums_and_dti_treatment
  condition:
    kind: procedure
    purpose: Resolve the source’s open questions about interest-only minimum loan
      amount, minimum FICO, and the applicability of the excerpt’s DTI calculation.
    steps:
