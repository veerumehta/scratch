        8) or other similar attestation approved by Acra.” The excerpt''s §8.4 also
        refers to consumer transactions (PLAT-8.2); whether every loan on this program
        is a business-purpose transaction: Acra confirmation requested → Q-22. \[G
        §5.32, p. 3; acralending.com/ratesheets\]


        PLAT-1.4 Eligible loan purpose types: Purchase, Rate & Term Refinance, Cash-Out
        Refinance, Delayed Financing. The matrix footnote states “Delayed financing
        is capped at \$1.5MM”; which matrix column and which cash-in-hand rule apply
        to delayed financing: Acra confirmation requested → Q-02. \[P: Loan Purpose
        Requirements; matrix footnote\]


        PLAT-1.5 “Debt Service Coverage Ratio (DSCR) Cash-Out Refinance Transactions
        requires current lease agreement”. \[P: Loan Purpose Requirements\]


        PLAT-1.6 “Vacant properties ineligible”. The Seller''s Guide provisions on
        vacant purchases and §10.17 vacant refinances therefore do not apply (Appendix
        B). \[P: Loan Purpose Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.property_eligibility_and_property_specific_conditions.properties_listed_for_sale
  condition:
    kind: procedure
    purpose: Determine whether a property listed for sale in the last six months meets
      the listed-property conditions, while preserving the stated applicability uncertainty.
    steps:
    - Determine whether the property was listed for sale in the last six months, measured
      from the last date listed to the Application Date.
    - If it was, obtain Acra confirmation whether §11.5 applies to Platinum Select
      unchanged.
    - If §11.5 applies, verify lien status, tenant occupancy for investment properties,
      the applicable channel DSCR, prepayment-penalty rule, reserves, amortization,
      LTV / CLTV limit, subordinate financing, and impounds.
    checks:
    - The property has not been listed for sale in the last six months, measured from
      the last date of being listed to the Application Date, or is treated as a listed
      property for the following checks.
    - Acra confirms whether §11.5 applies to Platinum Select unchanged.
    - The property is not in default or otherwise delinquent on lien(s).
    - If the property is an investment property, the subject is occupied by a tenant
      and is not vacant.
    - 'The loan meets the applicable channel minimum DSCR: Correspondent ≥ 1.2 or
      Wholesale ≥ 1.0.'
    - The loan has a prepayment penalty of at least three (3) years unless the property
      is in a state that does not allow prepayment penalties.
    - Twenty-four (24) months of reserves are provided.
    - The loan has a fully amortizing term and is not interest only.
    - Maximum LTV / CLTV is 65% based on the lesser of appraised value or lowest recent
      listing price.
    - No subordinate financing is present.
    - Impounds are in place.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not listed within the defined six-month period, or,
        if listed, §11.5 applicability is confirmed and every applicable listed-property
        check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The property is listed within the defined period and §11.5 applicability,
        or any applicable listed-property fact, remains unresolved.
    - status: FAIL
      verdict: violated
      criterion: The property is listed within the defined period, §11.5 applies,
        and an applicable listed-property check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case is not a property loan subject to the listed-for-sale review.
    evidence_types: []
    reads:
    - listed_for_sale_last_6_months
    - property_currently_listed_for_sale
    - channel
    - vacant_property
    - current_lease_in_place
    - reserves_months
    - product_is_interest_only
    - interest_only_10_40
    - cltv_pct
    - property_value
    - prepayment_penalty_requested
    - property_state
    computable_checks:
    - 0
    missing_reads:
    - Last date the property was listed and Application Date
    - Acra confirmation whether §11.5 applies to Platinum Select unchanged
    - Whether the property is in default or otherwise delinquent on lien(s)
    - Tenant occupancy information
    - Actual DSCR
    - Prepayment-penalty term
    - Whether the property is in a state that does not allow prepayment penalties
    - Appraised value and lowest recent listing price
    - LTV
    - Whether subordinate financing is present
    - Whether impounds are in place
  action: require_evidence
  priority: 100
  description: Apply the stated listed-for-sale conditions when the property was listed
    within the defined period.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.3 Properties listed
    for sale (§11.5)
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-7.6 A property is considered listed for sale under §11.5 if it
        has been listed for sale in the last six months, measured from (a) the last
        date of being listed to (b) the Application Date. \[G §11.5, p. 12\]


        PLAT-7.7 Whether §11.5 applies to Platinum Select unchanged is part of Q-13;
        it is restated here because the Platinum Summary does not exclude it. \[G
        §11.5\]


        PLAT-7.8 Loans on such properties will be considered under the following characteristics:
        the property is not in default or otherwise delinquent on lien(s); for investment
        properties, the subject must be occupied by a tenant and may not be vacant;
        the loan must qualify as either (a) ≥ 1.0 DSCR or (b) 43% maximum DTI — on
        this program the channel minimum DSCR applies, Wholesale 1.0 and Correspondent
        1.2 (PLAT-3.8), and the DTI alternative is Q-14; a prepayment penalty of at
        least three (3) years is required unless the property is in a state that does
        not allow prepayment penalties; twenty-four (24) months of reserves are required,
        and cash-in-hand may be considered if otherwise consistent with the Guide;
        the loan must have a fully amortizing term, interest only is not available;
        the maximum LTV / CLTV is 65% based on the lesser of (a) appraised value or
        (b) lowest recent listing price; no subordinate financing is allowed; impounds
        are required. \[G §11.5, pp. 11–12\]'
  approval_refs: []
- rule_id: acra-platinum.property_eligibility_and_property_specific_conditions.property_type_and_location_eligibility
  condition:
    kind: procedure
    purpose: Determine whether the property's type and location meet the published
      requirements and identify cases the Summary does not address.
    steps:
    - Compare the property type with the expressly eligible and ineligible types.
    - For a Warrantable Condo or Two-Units, apply the stated maximum CLTV.
    - Identify whether the property has a feature the Summary marks as not addressed
      and leave that eligibility unresolved pending Acra confirmation.
    - Check the property state against the listed ineligible locations.
    - If the property is in a declining market, apply the stated CLTV reduction and
      obtain clarification on how it combines with other caps.
    checks:
    - The property type is SFR, Townhome, PUD, Warrantable Condo, or Two-Units.
    - The property type is not Rural Properties, Condotels, Non-Warrantable Condos,
      or Short-Term Rentals.
    - If the property type is Warrantable Condo or Two-Units, CLTV is no more than
      75.00%.
    - A three- or four-unit property, manufactured home, mixed-use property, Adult
      Care / Assisted Living property, or PUDtel is not treated as eligible or ineligible
      without Acra confirmation.
    - The property state is not SD or a U.S. Terr.
    - If the property is in a declining market, the stated -5% CLTV property/borrower
      full profile reduction is applied.
    - The application of the declining-market reduction in combination with other
      caps is confirmed by Acra.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property type and location meet every applicable stated requirement,
        and any applicable CLTV limit or declining-market reduction is satisfied.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The property has a feature not addressed by the Summary, or declining-market
        status, the required profile, or cap interaction remains unresolved.
    - status: FAIL
      verdict: violated
      criterion: The property type or location is expressly ineligible, or an applicable
        CLTV limit or reduction is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case is not subject to the property-type or location requirements.
    evidence_types: []
    reads:
    - property_type
    - residential_unit_count
    - cltv_pct
    - property_state
    - rural_property
    - mixed_use
    computable_checks:
    - 0
    - 1
    - 2
    - 4
    missing_reads:
    - Whether any feature not addressed by the Platinum Summary applies
    - Acra confirmation for features not addressed by the Platinum Summary
    - Whether the property is in a declining market
    - Property/borrower full profile information needed for the declining-market reduction
    - Acra confirmation on how the declining-market reduction combines with other
      caps
  action: require_evidence
  priority: 100
  description: Classify the property and location against the stated eligibility,
    ineligibility, and CLTV limits.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.3 Location
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7. Property eligibility
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1 Property types,
    as printed
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-1.16 Under the heading “Ineligible State: Non-Owner Occupied”
        the Summary lists “SD, U.S. Terrs.” \[P: Subject Property Location Requirements\]


        PLAT-1.17 Declining market: “-5% CLTV property/borrower full profile”. How
        this reduction combines with other caps: Acra confirmation requested → Q-08.
        \[P: Subject Property Location Requirements\]


        The Platinum Summary lists eligible property types and states which types
        are ineligible. Features it neither lists nor excludes are marked as not addressed
        and asked in Q-07 rather than assumed either way.


        PLAT-7.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo, Two-Units.
        “Two-Units, Warrantable Condo, Max CLTV: 75.00%”. \[P: Subject Property Requirements\]


        PLAT-7.2 “Rural Properties, Condotels, Non-Warrantable Condos ineligible”;
        “Short-Term Rentals (STR) ineligible”. \[P: Subject Property Requirements\]


        | **Feature** | **Status in the Platinum Summary** | **Where stated** |

        |----|----|----|

        | SFR, Townhome, PUD | Expressly eligible | PLAT-7.1 |

        | Warrantable Condo | Expressly eligible; maximum CLTV 75.00% | PLAT-7.1 |

        | Two-Units | Expressly eligible; maximum CLTV 75.00% | PLAT-7.1 |

        | Rural Properties | Expressly ineligible | PLAT-7.2 |

        | Condotels | Expressly ineligible | PLAT-7.2 |

        | Non-Warrantable Condos | Expressly ineligible | PLAT-7.2 |

        | Short-Term Rentals | Expressly ineligible | PLAT-7.2 |

        | Three- and four-unit properties | Not addressed — Q-07 | — |

        | Manufactured homes | Not addressed — Q-07 | — |

        | Mixed use; Adult Care / Assisted Living (§10.7) | Not addressed — Q-07 |
        — |

        | PUDtel | Not addressed — Q-07 | — |


        PLAT-7.3 Declining market: “-5% CLTV property/borrower full profile” (PLAT-1.17).
        \[P: Subject Property Location Requirements\]


        PLAT-7.4 Ineligible locations: SD, U.S. Terrs. (PLAT-1.16). \[P: Subject Property
        Location Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.property_eligibility_and_property_specific_conditions.rider_and_rent_loss_insurance
  condition:
    kind: procedure
    purpose: Determine whether applicable one- to four-unit non-owner occupied income-property
      requirements are met.
    steps:
    - For a borrower purchasing or refinancing a one- to four-family investment property,
      verify execution of the One- to Four-Family Rider with the loan documents.
    - 'Determine whether the six (6) months'' rent loss insurance trigger applies:
      the property is a one- to four-unit non-owner occupied income property, LTV
      is greater than 70%, and subject property rents are used to qualify.'
    - Apply the stated exemption for loans with ≤ 70% CLTV and leave the LTV-at-or-below-70%
      / CLTV-above-70% case unresolved pending Acra confirmation.
    - If rent loss insurance is required but cannot be obtained, verify the permitted
      reserve substitution for each month of coverage not provided.
    checks:
    - A borrower purchasing or refinancing a one- to four-family investment property
      executes a One- to Four-Family Rider with the loan documents.
    - Six (6) months' rent loss insurance is provided when the property is a one-
      to four-unit non-owner occupied income property with LTV > 70% and subject property
      rents are used to qualify.
    - A loan with ≤ 70% CLTV is not required to carry rent loss insurance.
    - The LTV-at-or-below-70% and CLTV-above-70% case is resolved by Acra confirmation.
    - When required rent loss insurance cannot be obtained, the borrower provides
      two (2) months reserves for every one (1) month of rent loss coverage not provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable Rider and rent loss insurance requirement is met,
        including any permitted reserve substitution.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required Rider, insurance coverage, reserve substitution, or Acra
        confirmation is pending.
    - status: FAIL
      verdict: violated
      criterion: An applicable Rider or insurance requirement is not met and the permitted
        reserve substitution does not satisfy the requirement.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The transaction is not a purchase or refinance of a one- to four-family
        investment property subject to these requirements.
    evidence_types: []
    reads:
    - occupancy_subtype
    - residential_unit_count
    - loan_purpose
    - cltv_pct
    - gross_rental_income
    - reserves_months
    computable_checks: []
    missing_reads:
    - Whether the property is an income property
    - Executed One- to Four-Family Rider
    - LTV
    - Whether subject property rents are used to qualify
    - Rent loss insurance coverage obtained
    - Acra confirmation for the LTV-at-or-below-70% and CLTV-above-70% case
    - Months of rent loss coverage not provided
    - Reserves available for the permitted substitution
  action: require_evidence
  priority: 100
  description: Verify the One- to Four-Family Rider and apply the stated rent loss
    insurance and reserve-substitution rules.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy, purpose
    and qualification ¶2
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.4 Rent loss insurance
    (§23.40)
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-1.7 The program is offered through two channels with different
        minimum ratios: Correspondent ≥ 1.2, Wholesale ≥ 1.0 (PLAT-3.7). Matrix footnote
        3 also restricts Correspondent pricing (PLAT-2.3). \[P: Minimum DSCR; matrix
        footnote 3\]


        PLAT-1.8 Every loan must meet the applicable channel minimum DSCR. The Platinum
        Summary lists no No Ratio option and no allowance for a ratio below 1.0; a
        ratio below the channel minimum does not meet the published requirement. Whether
        No Ratio or sub-1.0 qualification exists on this program in any form: Acra
        confirmation requested → Q-12. \[P: Minimum DSCR\]


        PLAT-1.9 Acra will not calculate a DTI for applicants who qualify using a
        DSCR; income or employment listed on an application is superfluous to the
        underwrite and may be left blank, and if represented, a DTI should not be
        calculated. The Standard Summary''s statement that borrowing-entity income
        documentation is not required does not appear in the Platinum Summary; whether
        it applies: Acra confirmation requested → Q-13. \[G §7.3, p. 5\]


        PLAT-1.10 “A 1007 will always be required on DSCR transactions”; the Platinum
        Summary refers to market rent “as established on the 1007 or 1025”. Whether
        a Form 1025 alone satisfies the requirement for a two-unit property: Acra
        confirmation requested → Q-04. \[G §5.32, p. 3; §14.12, p. 4; P: Income Documentation\]


        PLAT-1.11 All borrowers purchasing or refinancing a one- to four-family investment
        property must execute a One- to Four-Family Rider with the loan documents
        and provide rent loss insurance coverage per §23.40 (PLAT-7.9 to 7.12). \[G
        §3.41, p. 11\]


        PLAT-1.12 Only the subject property, principal residence and second homes
        are required to be listed on the application or Schedule of Real Estate Owned.
        \[G §5.32, p. 3; §4.15, p. 5\]


        PLAT-7.9 Rent loss insurance covers rental losses that are incurred during
        the period that a property is being rehabilitated following a casualty. \[G
        §23.40, p. 13\]


        PLAT-7.10 Six (6) months'' rent loss insurance is required on one- to four-unit
        non-owner occupied income properties with LTV \> 70% and when subject property
        rents are used to qualify. \[G §23.40, p. 13\]


        PLAT-7.11 “Loans with ≤ 70% CLTV are not required to carry rent loss insurance.”
        The requirement is stated in LTV and the exemption in CLTV; the case of LTV
        at or below 70% with CLTV above 70%: Acra confirmation requested → Q-10. \[G
        §23.40, p. 13\]


        PLAT-7.12 When rent loss insurance is required but cannot be obtained, the
        borrower may substitute two (2) months reserves for every one (1) month of
        rent loss coverage not provided. \[G §23.40, p. 13\]'
  approval_refs: []
- rule_id: acra-platinum.borrower_eligibility_and_credit_history.borrower_citizenship_and_homeownership_eligibility.python
  condition:
    kind: python
    source: "import rules_lib\n\ndef check(ctx):\n    citizenship_type = ctx['citizenship_type']\n\
      \    first_time_homebuyer = ctx['first_time_homebuyer']\n\n    missing = rules_lib.gaps(\n\
      \        citizenship_type=citizenship_type,\n        first_time_homebuyer=first_time_homebuyer,\n\
      \    )\n    if missing:\n        return rules_lib.unknown(*missing)\n\n    is_first_time_homebuyer\
      \ = rules_lib.flag(first_time_homebuyer)\n    if is_first_time_homebuyer is\
      \ None:\n        return rules_lib.unknown('first_time_homebuyer')\n\n    return\
      \ (\n        rules_lib.same(citizenship_type, 'US Citizen', 'Permanent Resident')\n\
      \        and not is_first_time_homebuyer\n    )"
