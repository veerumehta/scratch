- rule_id: acra-platinum.funds_to_close_seasoning_and_reserves.reserve_requirements_by_trigger
  condition:
    kind: procedure
    purpose: Assess the reserve requirements stated for CLTV, property listed for
      sale, recent forbearance or mortgage lates with tenant occupancy, and unavailable
      rent loss insurance.
    steps:
    - If CLTV is greater than 75.00%, check for 6-months Reserves required for CLTV
      > 75.00%.
    - If the property was listed for sale within six months, check for twenty-four
      (24) months of reserves. Cash-in-hand may be considered if otherwise consistent
      with the Guide.
    - Determine whether the property is tenant-occupied and whether there was forbearance
      or mortgage lates in the last 12 months without timely receipt of the prior
      two months' rent. If so, check for 12 months of the subject's payment in reserve;
      this may be from the transaction's cash-in-hand. The relationship to 0x30x12
      is unresolved in the source.
    - If rent loss insurance is required but cannot be obtained, check for two (2)
      months reserves for every one (1) month of coverage not provided.
    - Do not assume a base reserve requirement at CLTV of 75.00% or below, a payment
      basis, permitted sources, whether overlapping triggers are cumulative, or whether
      reserves substituted for rent loss insurance are additional; obtain Acra confirmation.
    checks:
    - If cltv_pct > 75.00%, reserves_months >= 6.
    - If listed_for_sale_last_6_months is true, reserves_months >= 24.
    - If there was forbearance or mortgage lates in the last 12 months, the subject
      is tenant-occupied, and the prior two months' rent was not received timely,
      12 months of the subject's payment are held in reserve.
    - If rent loss insurance is required but cannot be obtained, reserves equal two
      (2) months for every one (1) month of coverage not provided.
    - The base reserve requirement at CLTV of 75.00% or below, payment basis, permitted
      sources, cumulative treatment of overlapping triggers, and treatment of reserves
      substituted for rent loss insurance as additional reserves have been confirmed
      by Acra where applicable.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable reserve trigger is identified, each corresponding
        reserve check holds, and all applicable unresolved reserve terms have been
        confirmed by Acra.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: No applicable reserve check is known to fail, but trigger facts,
        reserve amounts, or applicable Acra confirmations remain outstanding.
    - status: FAIL
      verdict: violated
      criterion: Any applicable reserve check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: No stated reserve trigger applies and no unresolved base reserve
        requirement applies to the case.
    evidence_types: []
    reads:
    - cltv_pct
    - listed_for_sale_last_6_months
    - reserves_months
    - housing_history
    - current_lease_in_place
    - mortgage_history_0x30x24
    computable_checks:
    - 0
    - 1
    missing_reads:
    - Whether there was forbearance or a mortgage late in the last 12 months.
    - Whether the subject is tenant-occupied and whether the prior two months' rent
      was received timely.
    - Subject payment amount and reserve amount available for that requirement.
    - Whether rent loss insurance is required, whether it can be obtained, and the
      months of coverage not provided.
    - Acra confirmation on the base requirement at CLTV of 75.00% or below, payment
      basis (including on an interest-only loan), permitted sources, cumulative treatment
      of overlapping triggers, and whether reserves substituted for rent loss insurance
      are additional.
    - Whether cash-in-hand is otherwise consistent with the Guide, if relied on.
  action: require_evidence
  priority: 100
  description: Identify each stated reserve trigger and verify the corresponding reserve
    amount without assuming unstated rules.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#8.2 Reserves by
    trigger, as stated
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-8.7 The sources state reserves only for the situations below and
        state the payment basis in none of them. The base requirement at CLTV of 75.00%
        or below, the payment basis (including on an interest-only loan), permitted
        sources, whether overlapping triggers are cumulative, and whether reserves
        substituted for rent loss insurance are additional: Acra confirmation requested
        → Q-08. \[P; G\]


        | **Trigger** | **Reserves as printed** | **Source** |

        |----|----|----|

        | CLTV \> 75.00% | “6-months Reserves required for CLTV \> 75.00%” | P: Reserve
        Requirements |

        | Property listed for sale within six months | Twenty-four (24) months of
        reserves; cash-in-hand may be considered if otherwise consistent with the
