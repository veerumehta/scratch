- rule_id: acra-platinum.entity_guarantor_and_trust_requirements.entity_eligibility_and_guarantees
  condition:
    kind: procedure
    purpose: Determine whether an entity borrower and its ownership and guarantee
      arrangements meet PLAT-5.1 through PLAT-5.9.
    steps:
    - Determine whether the transaction is business purpose and concerns an investment
      property exclusively.
    - Confirm that collateral title will be held directly by individual person(s)
      or by an entity acceptable to Acra in its sole discretion.
    - For an entity borrower, identify every direct and indirect owner, each ownership
      percentage, and any party with managing control; determine which individuals
      have direct or indirect ownership ≥ 20%.
    - Verify that every individual with direct or indirect ownership ≥ 20% provides
      an Acra-approved recourse guarantee or Exhibit 7. If there are multiple guarantors,
      verify that recourse is joint and several.
    - Verify that the entity borrower is a single purpose entity with no assets other
      than residential investment or rental properties and is engaged in owning and
      operating residential investment or rental properties; verify that it is not
      a series limited liability company.
    - Identify every entity that will hold direct ownership of the subject property
      and be on title as a direct owner; verify that each is a borrowing entity.
    - Review operating-agreement or bylaw changes affecting ownership percentages
      and their timing in relation to the Application Date and application process;
      do not recognize changes made with intent to circumvent required personal guarantors
      or changes within 30 days prior to an Application Date or throughout the application
      process.
    - Verify that the entity is a US formed and based Entity and is not a foreign
      owned entity; verify that its type is one of the allowed types and is not a
      prohibited type.
    - 'Check that the structure does not involve a prohibited business entity arrangement:
      nesting is limited to only one (1) wholly-owned subsidiary owned by individual(s),
      and multiple nesting or ownership by multiple entities, trusts, etcetera are
      not acceptable.'
    - Verify that at least one guarantor has prior homeownership experience and that
      at least one borrower / guarantor attests on the application that they are not
      a first-time homebuyer.
    checks:
    - The transaction is a business purpose transaction involving an investment property
      exclusively.
    - Collateral title is held directly by individual person(s) or by an entity acceptable
      to Acra in its sole discretion.
    - Every individual with direct or indirect ownership ≥ 20% provides an Acra-approved
      recourse guarantee or Exhibit 7.
    - Where there are multiple guarantors, all recourse is joint and several.
    - The entity borrower is a single purpose entity as defined in PLAT-5.4 and is
      not a series limited liability company.
    - Every entity that will hold direct ownership of the subject property and be
      on title as a direct owner is a borrowing entity.
    - No ownership-percentage change with intent to circumvent required personal guarantors
      is recognized, and no such change is made within 30 days prior to an Application
      Date or throughout the application process.
    - The entity is US formed and based, is not foreign owned, and is of an allowed
      type rather than a prohibited type.
    - The entity ownership structure complies with the stated one-subsidiary limit
      and does not involve multiple nesting or ownership by multiple entities, trusts,
      etcetera.
    - At least one guarantor has prior homeownership experience.
    - At least one borrower / guarantor attests on the application that they are not
      a first-time homebuyer.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable requirements are met subject to conditions that must
        be cleared.
    - status: FAIL
      verdict: violated
      criterion: An applicable step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no entity borrower or other entity arrangement to which
        this job applies.
    evidence_types: []
    reads:
    - loan_purpose
    - property_type
    - borrower_entity_type
    - entity_is_borrower_1
    computable_checks:
    - 0
    missing_reads:
    - whether the transaction is business purpose and the property is exclusively
      an investment property, if not established by the case fields
    - title vesting and Acra’s determination whether an entity is acceptable in its
      sole discretion
    - all direct and indirect owners, their ownership percentages, and parties with
      managing control
    - recourse guarantees, whether each is Acra-approved or Exhibit 7, and whether
      multiple guarantors’ recourse is joint and several
    - entity assets and business activities; whether an LLC is a series LLC
    - all direct title holders and whether each is a borrowing entity
    - ownership-change purpose and dates, Application Date, and application-process
      dates
    - entity formation and base location, foreign ownership, and entity type details
      not held in the case fields
    - the complete entity ownership and nesting structure
    - guarantor prior homeownership experience
    - application attestation that a borrower / guarantor is not a first-time homebuyer
  action: require_evidence
  priority: 100
  description: Verify the entity, ownership structure, required guarantors, and related
    eligibility conditions against the stated requirements.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#4. Borrower eligibility
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#Section 3.12
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity eligibility
    and guarantees ¶1
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity eligibility
    and guarantees ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'The Platinum Summary lists two eligible citizenship types and excludes
        first-time homebuyers. Borrowing entities, guarantors and trusts follow the
        Seller''s Guide excerpt and are in section 5.


        PLAT-4.1 Eligible borrower citizenship types: US Citizen, Permanent Resident.
        \[P: Borrower Citizenship Requirements\]


        PLAT-4.2 Permanent Resident must have an unexpired PRA ID and SSA card / SSA-89.
        \[P: Borrower Citizenship Requirements\]


        PLAT-4.3 Non-permanent residents, foreign nationals and ITIN borrowers are
        not among the listed eligible types. The Seller''s Guide foreign-national
        program (§3.10) is therefore not restated (Appendix B). \[P: Borrower Citizenship
        Requirements\]


        PLAT-4.4 “First Time Homebuyer (FTHB) ineligible for this program”. Acra defines
        a First Time Home Buyer as “an application where all Applicants have never
        previously owned a home (real property)”; the §3.13 DSCR allowance for first-time
        homebuyers is not restated (Appendix B). \[P: Borrower Credit History Requirements;
        G §3.13, p. 10\]


        PLAT-4.5 §3.12 requires at least one guarantor to have prior homeownership
        experience, and at least one borrower / guarantor to attest on the application
        that they are not a first-time homebuyer (PLAT-5.9). Whether it applies to
        individual borrowers as well as entities is part of Q-13. \[G §3.12, p. 7\]


        Section 3.12 governs loans to entities, the personal guarantees Acra requires,
        the entity documentation it accepts and title vesting in a revocable living
        trust. Nothing in the Platinum Summary modifies it; whether it applies to
        Platinum Select unchanged is Q-13.


        PLAT-5.1 Business Entities are eligible for financing on business purpose
        transactions (investment properties exclusively). \[G §3.12, p. 7\]


        PLAT-5.2 Acra will lend to, and require that title to the collateral be held,
        either (i) directly by an individual person(s) or (ii) by an entity acceptable
        to Acra in its sole discretion. \[G §3.12, p. 7\]


        PLAT-5.3 Acra requires all individuals with direct or indirect ownership ≥
        20% to provide a recourse guarantee (Acra approved, or Exhibit 7) in the case
        of an entity borrower. All recourse is joint and several in the case of multiple
        guarantors. \[G §3.12, p. 7\]


        PLAT-5.4 An entity borrower must be a single purpose entity (SPE): “an entity
        with no assets other than residential investment or rental properties; engaged
        in the business of owning and operating residential investment or rental properties.”
        Series limited liability companies are not allowed. \[G §3.12, p. 7\]


        PLAT-5.5 All entities that will hold direct ownership of the subject property
        and will be on title as a direct owner are required to be a borrowing entity.
        \[G §3.12, p. 7\]


        PLAT-5.6 Changes to the operating agreement or bylaws with the intent of changing
        ownership percentages to circumvent required personal guarantors will not
        be considered. “Lookback to changes cannot occur within 30 days prior to an
        Application Date or throughout the application process as these changes will
        not be recognized by Acra Lending.” \[G §3.12, p. 7\]


        PLAT-5.7 Entity / guarantor types allowed: Domestic Corporations (C and S
        Corp); single purpose Limited Liability Companies (LLC), excluding series
        LLC; Limited Liability Partnership (LLP); Limited Liability Limited Partnership
        (LLLP); General Partnership (GP); Limited Partnership (LP); and Sole Proprietorship.
        “In all events, the Borrower must be a US formed and based Entity, foreign
        entities (i.e.: entities formed or based outside the US) or foreign owned
        entities are not allowed.” \[G §3.12, p. 8\]


        PLAT-5.8 Not allowed: Cooperatives, Irrevocable Trusts, Land Trusts, IRAs,
        Non-Profit, and Joint Ventures. “Business entity nesting is limited to only
        one (1) wholly-owned subsidiary that in turn must be owned by individual(s);
        multiple nesting or ownership by multiple entities, trusts, etcetera are not
        acceptable.” An illustration of the permitted structure: Acra confirmation
        requested → Q-18. \[G §3.12, p. 8\]


        PLAT-5.9 Acra requires at least one guarantor to have prior homeownership
        experience. At least one (1) borrower / guarantor on the loan must attest
        on the application that they are not a first-time homebuyer; if prior home
        ownership is not evident within the loan file, the underwriter reserves the
        right to condition for supporting documentation. \[G §3.12, p. 7\]'
  approval_refs: []
- rule_id: acra-platinum.entity_guarantor_and_trust_requirements.revocable_living_trust_title_vesting
  condition:
    kind: procedure
    purpose: Determine whether title vesting in an inter vivos revocable trust meets
      PLAT-5.13.
    steps:
    - Determine whether title is to be vested in an inter vivos revocable trust; if
      so, obtain a complete, legible copy of the Trust or a Certification of Trust
      containing every item specified in PLAT-5.13.
    - Verify that the Trust is valid under the laws of the state in which it is established
      and is revocable, meaning it can be changed or canceled at any time for any
      reason during a Trustor's lifetime.
    - Verify that the Trust is established by one or more natural persons, solely
      or jointly, and becomes effective during the lifetime of the person(s) establishing
      it.
    - Verify that the primary beneficiary is the individual(s) establishing the Trust.
    - If the Trustor(s) and Trustee(s) are not the same, obtain written exception
      by Acra Senior Management.
    - Verify that the Trust specifies the Trustee’s power to hold title and mortgage
      the property; the beneficiary does not need to grant written consent for the
      Trust to borrow money or that consent has been granted in writing for purposes
      of the mortgage; there is no unusual risk or impairment to the lender's rights;
      and holding title in the Trust does not diminish the lender's rights as a creditor.
    - Record any additional supporting documentation Legal conditions for in its sole
      discretion.
    checks:
    - A complete, legible copy of the Trust or a Certification of Trust states the
      existence and date of the Trust; Trustor(s) and current Trustee(s); Trustee
      powers; whether the Trust is revocable and, if so, who holds the right to revoke;
      required Trustee signers; Trust identification number; how title to Trust assets
      should be taken; and that the Trust has not been revoked, modified, or amended
      in any manner.
    - The Trust is valid under the laws of the state in which it is established and
      is revocable as specified.
    - The Trust is established by one or more natural persons, solely or jointly,
      and becomes effective during the lifetime of the person(s) establishing it.
    - The primary beneficiary of the Trust is the individual(s) establishing the Trust.
    - If the Trustor(s) and Trustee(s) are not the same, written exception by Acra
      Senior Management is obtained.
    - The Trust contains all required provisions concerning the Trustee’s powers,
      beneficiary consent to borrowing, unusual risk or impairment to the lender's
      rights, and the lender's rights as a creditor.
    - Any additional supporting documentation required by Legal in its sole discretion
      is provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Title is vested in an inter vivos revocable trust and every applicable
        requirement is met, including any additional documentation required by Legal.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required written exception or other applicable condition remains
        to be obtained or cleared.
    - status: FAIL
      verdict: violated
      criterion: An applicable trust requirement is not met, including where the trust
        is irrevocable.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Title is not vested in an inter vivos revocable trust.
    evidence_types: []
    reads: []
    computable_checks: []
    missing_reads:
    - whether title is vested in an inter vivos revocable trust
    - Trust or Certification of Trust and all required statements and identifying
      information
    - state where the Trust is established and evidence of validity under that state’s
      laws
    - Trust terms establishing revocability and the right to revoke
    - identity and status of the natural-person Trustor(s), effective date, and primary
      beneficiary
    - Trustor(s), Trustee(s), and written exception by Acra Senior Management if they
      are not the same
    - Trust terms concerning Trustee powers, beneficiary consent, lender rights, and
      any unusual risk or impairment
    - any additional supporting documentation Legal requires in its sole discretion
  action: require_evidence
  priority: 100
  description: Review trust documents and terms against each stated requirement for
    permitted title vesting in an inter vivos revocable trust.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.4 Revocable living
    trusts
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-5.13 Title vesting in an inter vivos revocable trust is permitted
        when all of the following requirements are followed. \[G §3.12, pp. 9–10\]


        - A complete, legible copy of the Trust, or a Certification of Trust stating:
        the existence and date of the Trust; the Trustor(s) and the current Trustee(s);
        the powers of the Trustee; whether the Trust is revocable and, if revocable,
        who holds the right to revoke; the names and number of the Trustees required
        to sign on behalf of the Trust; the Trust identification number (a Social
        Security number or an IRS-issued Tax Identification Number); how title to
        the Trust assets should be taken; and a statement that the Trust has not been
        revoked, modified, or amended in any manner.


        - The Trust must be valid under the laws of the state in which it is established.


        - The Trust must be revocable, meaning it can be changed or canceled at any
        time for any reason during a Trustor''s lifetime. Irrevocable trust is not
        permitted.


        - The Trust must be established by one or more natural persons, solely or
        jointly (Grantor, Trustor, or Settlor), and must become effective during the
        lifetime of the person(s) establishing it.


        - The primary beneficiary of the Trust must be the individual(s) establishing
        the Trust.


        - Written exception by Acra Senior Management must be obtained if the Trustor(s)
        and Trustee(s) are not the same.


        - The Trust must specify that the Trustee has the power to hold title and
        mortgage the property; that the beneficiary does not need to grant written
        consent for the Trust to borrow money, or that such consent has been granted
        in writing for purposes of the mortgage; that there is no unusual risk or
        impairment to the lender''s rights; and that holding title in the Trust does
        not diminish the lender''s rights as a creditor.


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
  approval_refs: []
- rule_id: acra-platinum.funds_to_close_seasoning_and_reserves.escrow_waiver_and_listed_property_impounds
  condition:
    kind: procedure
    purpose: Determine whether a requested escrow waiver meets the stated loan amount
      and mortgage-history requirements, account for the undefined Section 35 exclusion,
      and address the separate impound requirement for a property listed for sale.
    steps:
    - If an escrow waiver is requested, check that the loan amount does not exceed
      $1.5M.
    - If an escrow waiver is requested, check for 0x30x24 Mortgage History.
    - If an escrow waiver is requested, determine whether the loan is a Section 35
      loan; Section 35 loans are ineligible, but Section 35 is not defined in the
      source, so obtain Acra confirmation as needed.
    - Separately, if the property is listed for sale, require impounds.
    checks:
    - If escrow_waiver_requested is true, loan_amount <= $1,500,000.
    - If escrow_waiver_requested is true, mortgage_history_0x30x24 is true.
    - If escrow_waiver_requested is true, the loan is not a Section 35 loan.
    - If property_currently_listed_for_sale is true, impounds are in place.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable escrow-waiver and listed-property impound check
        holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: No applicable check is known to fail, but Section 35 status or evidence
        that required impounds are in place remains outstanding.
    - status: FAIL
      verdict: violated
      criterion: Any applicable escrow-waiver or listed-property impound check does
        not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: No escrow waiver is requested and the property is not listed for
        sale.
    evidence_types: []
    reads:
    - escrow_waiver_requested
    - loan_amount
    - mortgage_history_0x30x24
    - property_currently_listed_for_sale
    computable_checks:
    - 0
    - 1
    missing_reads:
    - Acra confirmation or other authoritative determination of whether the loan is
      a Section 35 loan, because Section 35 is not defined in the source.
    - Whether required impounds are in place for a property listed for sale.
  action: require_evidence
  priority: 100
  description: Apply the printed escrow-waiver limits and separately check the stated
    impound requirement for a property listed for sale.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.4 Escrow waiver
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-6.13 Escrow waiver: maximum loan amount \$1.5M; “0x30x24 Mortgage
        History required, Section 35 loans ineligible”. No CLTV or FICO limit is printed
        for the Platinum waiver, and “Section 35” is not defined in the sources: Acra
        confirmation requested → Q-09 and Q-14. \[P: Escrow Waiver Requirements\]


        PLAT-6.14 Impounds are separately required on a property listed for sale (§11.5,
        PLAT-7.8). \[G §11.5, p. 12\]'
  approval_refs: []
- rule_id: acra-platinum.funds_to_close_seasoning_and_reserves.funds_held_in_a_foreign_bank_or_currency
  condition:
    kind: procedure
    purpose: Assess the stated requirement for funds held in a foreign bank or currency
      and identify the Acra confirmation needed for eligible borrowers holding funds
      abroad.
    steps:
    - Determine whether funds to close are held in a foreign bank or currency.
    - If funds are held in a foreign bank or currency, assess the stated requirement
      that they be repatriated at minimum three (3) business days prior to Closing.
    - Obtain Acra confirmation on whether this repatriation requirement applies to
      eligible borrowers holding funds abroad and what evidence and timing convention
      apply.
    - Do not apply the stated 60-day seasoning requirement to eligible borrowers;
      the source states it for Foreign Nationals only and does not restate it for
      eligible borrowers.
    checks:
    - If funds to close are held in a foreign bank or currency, the stated repatriation
      timing of at minimum three (3) business days prior to Closing is addressed,
      subject to Acra confirmation of applicability, evidence, and timing convention.
    - The 60-day seasoning requirement is not applied to an eligible borrower on the
      basis of this source.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The job applies, the repatriation requirement is established in accordance
        with Acra's confirmation, and the 60-day seasoning requirement has not been
        applied to an eligible borrower on the basis of this source.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: No applicable check is known to fail, but the presence of foreign-held
        funds, repatriation evidence or timing, or required Acra confirmation remains
        outstanding.
    - status: FAIL
      verdict: violated
      criterion: An applicable repatriation requirement, as confirmed by Acra, is
        not met, or the 60-day seasoning requirement is applied to an eligible borrower
        on the basis of this source.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Funds to close are not held in a foreign bank or currency.
    evidence_types: []
    reads:
    - citizenship_type
    computable_checks: []
    missing_reads:
    - Whether funds to close are held in a foreign bank or currency.
    - Closing date and evidence of repatriation date.
    - Acra confirmation on applicability of repatriation to eligible borrowers holding
      funds abroad, and on required evidence and timing convention.
  action: require_evidence
  priority: 100
  description: Check the stated repatriation timing without resolving the source's
    open applicability question.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#8.1 Gift funds,
    funds to close and seasoning
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-8.1 Gift funds, investment property: applicant(s) are required
        to contribute a portion of their own sourced and seasoned funds to the transaction
        at a minimum of 10% of the purchase price (PLAT-1.15). \[G §8.7, p. 12\]


        PLAT-8.2 Verification of the seasoning of funds to close is required on loans
        over 70% CLTV for consumer transactions, or business purpose loans where funds
        to close are over \$50,000 and over 70% CLTV. Whether any loan on this program
        is a consumer transaction is Q-22. \[G §8.4, p. 12\]


        PLAT-8.3 Where the account(s) serving as the source of funds must be verified,
        verification may include a copy of the borrower''s bank statement(s) for the
        most recent month(s), or a VOD reflecting a current and average balance for
        the most recent month(s). \[G §8.4, p. 12\]


        PLAT-8.4 “All transactions require a minimum of 30-days documentation.” Whether
        any seasoning period applies to domestic funds beyond this documentation minimum:
        Acra confirmation requested → Q-11. \[G §8.4, p. 12\]


