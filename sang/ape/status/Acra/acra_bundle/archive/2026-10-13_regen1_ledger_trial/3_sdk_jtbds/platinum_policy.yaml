- rule_id: acra-platinum.entity_guarantor_and_trust_requirements.borrower_and_guarantor_due_diligence
  condition:
    kind: procedure
    purpose: Determine whether due diligence meets PLAT-5.11 and whether the required
      parties are included in the background review described in PLAT-5.12.
    steps:
    - Determine the date of loan approval or draw and verify that Borrower / Guarantor
      Due Diligence is current as of that date.
    - For an entity borrower, identify the entity, recourse guarantor(s), every party
      (individual or entity) owning 20% or more of the entity directly or indirectly,
      and every party with managing control.
    - For individual borrowers, identify all such individuals.
    - Verify that the background review covers the applicable Key Principals and Entities.
      The review may be ordered from Checkpoint, LexisNexis or another comparable
      provider and may include criminal history, OFAC searches, litigation, judgment,
      and lien searches.
    checks:
    - Borrower / Guarantor Due Diligence is current as of the date of any loan approval
      or draw.
    - For an entity borrower, the background-review scope includes the entity, recourse
      guarantor(s), all direct or indirect owners of 20% or more, and parties with
      managing control.
    - For individual borrowers, the background-review scope includes all such individuals.
    - The background review is of the Key Principals and Entities described in PLAT-5.12.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Due diligence is current as of the applicable approval or draw date
        and the background-review scope includes the applicable Key Principals and
        Entities.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A due-diligence or background-review requirement remains subject
        to a condition that must be cleared.
    - status: FAIL
      verdict: violated
      criterion: Due diligence is not current as of the applicable date or the required
        parties are not included in the review scope.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case has no borrower or guarantor due-diligence review to perform.
    evidence_types: []
    reads:
    - borrower_entity_type
    - entity_is_borrower_1
    computable_checks: []
    missing_reads:
    - date of loan approval or draw and date/status of Borrower / Guarantor Due Diligence
    - entity borrower status, entity identity, recourse guarantor(s), direct and indirect
      ownership percentages, and parties with managing control
    - individual borrower identities and applicable Key Principals and Entities
    - background-review records and parties reviewed
  action: require_evidence
  priority: 100
  description: Verify the currency and scope of the required borrower and guarantor
    due diligence and background review.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.3 Due diligence
    and background checks
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'PLAT-5.11 Borrower / Guarantor Due Diligence as described above is
        required to be current as of the date of any loan approval or draw. \[G §3.12,
        p. 9\]


        PLAT-5.12 Acra reviews the background of the Key Principals and Entities:
        in the case of entity borrowers, the entity, the recourse guarantor(s), and
        any party (individual or entity) that owns 20% or more of the entity directly
        or indirectly or has managing control; in the case of individual borrowers,
        all such individuals. Acra may order background checks on all Key Principals
        and Entities from Checkpoint, LexisNexis or another comparable provider, including
        criminal history, OFAC searches, litigation, judgment, and lien searches.
        \[G §3.12, p. 9\]'
  approval_refs: []
- rule_id: acra-platinum.entity_guarantor_and_trust_requirements.borrower_citizenship_and_first_time_homebuyer_eligibility
  condition:
    kind: procedure
    purpose: Determine whether the borrower meets the citizenship and first-time homebuyer
      requirements stated in PLAT-4.1 through PLAT-4.4.
    steps:
    - Check whether the borrower is a US Citizen or Permanent Resident.
    - If the borrower is a Permanent Resident, verify an unexpired PRA ID and SSA
      card / SSA-89.
    - 'Determine whether the application meets Acra’s definition of a First Time Home
      Buyer: all Applicants have never previously owned a home (real property).'
    - Apply the stated ineligibility of First Time Homebuyers for this program.
    checks:
    - The borrower’s citizenship type is US Citizen or Permanent Resident.
    - For a Permanent Resident, the PRA ID is unexpired and an SSA card / SSA-89 is
      provided.
    - The borrower is not a First Time Homebuyer under Acra’s stated definition.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The borrower has an eligible citizenship type, satisfies the Permanent
        Resident document requirement if applicable, and is not a First Time Homebuyer.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: An applicable requirement remains subject to a condition that must
        be cleared.
    - status: FAIL
      verdict: violated
      criterion: The borrower has a citizenship type not listed as eligible, fails
        an applicable Permanent Resident document requirement, or is a First Time
        Homebuyer.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: This borrower eligibility review does not apply to the case.
    evidence_types: []
    reads:
    - citizenship_type
    - first_time_homebuyer
    computable_checks:
    - 0
    - 2
    missing_reads:
    - unexpired PRA ID
    - SSA card / SSA-89
    - whether all Applicants have never previously owned a home (real property), if
      not established by the case field
  action: require_evidence
  priority: 100
  description: Compare the borrower’s stated citizenship and first-time homebuyer
    status with the stated eligibility requirements.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#4. Borrower eligibility
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'The Platinum Summary lists two eligible citizenship types and excludes
        first-time homebuyers. Borrowing entities, guarantors and trusts follow the
        Seller''s Guide excerpt and are in section 5.


        PLAT-4.1 Eligible borrower citizenship types: US Citizen, Permanent Resident.
        \[P: Borrower Citizenship Requirements\]


        PLAT-4.2 Permanent Resident must have an unexpired PRA ID and SSA card / SSA-89.
        \[P: Borrower Citizenship Requirements\]


        PLAT-4.3 Non-permanent residents, foreign nationals and ITIN borrowers are
        not among the listed eligible types. The Seller''s Guide foreign-national
        program (§3.10) is therefore not restated (Appendix B). \[P: Borrower Citizenship
        Requirements\]


        PLAT-4.4 “First Time Homebuyer (FTHB) ineligible for this program”. Acra defines
        a First Time Home Buyer as “an application where all Applicants have never
        previously owned a home (real property)”; the §3.13 DSCR allowance for first-time
        homebuyers is not restated (Appendix B). \[P: Borrower Credit History Requirements;
        G §3.13, p. 10\]


        PLAT-4.5 §3.12 requires at least one guarantor to have prior homeownership
        experience, and at least one borrower / guarantor to attest on the application
        that they are not a first-time homebuyer (PLAT-5.9). Whether it applies to
        individual borrowers as well as entities is part of Q-13. \[G §3.12, p. 7\]'
  approval_refs: []
- rule_id: acra-platinum.entity_guarantor_and_trust_requirements.entity_documentation
  condition:
    kind: procedure
    purpose: Determine whether the entity documentation required by PLAT-5.10 is complete
      and acceptable for review under the stated requirements.
    steps:
    - Obtain a complete, legible Certificate of Formation / Articles of Organization
      and all amendments.
    - For LLCs and Partnerships, obtain a complete, legible Operating Agreement with
      all referenced exhibits and all amendments; for corporations, obtain the Bylaws
      with all referenced exhibits and all amendments. Verify that the document states
      whether the entity is member or manager managed, authorizes borrowing money
      and entering into contracts for mortgage assets, and designates signers. Determine
      whether additional information is required if formation documents and the Operating
      Agreement or Bylaws conflict.
    - Obtain documentation evidencing all ownership interests. For LLCs and Partnerships,
      verify that the Operating Agreement identifies by name all persons and their
      ownership interest or attaches that information as an exhibit, or that membership
      interest certificates / units are provided in compliance with the Operating
      Agreement.
    - For S or C Corporations, obtain shareholder / stockholder certificates complying
      with the Bylaws, if any, or, if stock certificates are lost or unavailable,
      the corporation’s stock ledger. Verify that the certificate or ledger accounts
      for all outstanding shares noted in the Certificate of Formation / Articles
      of Organization, including those held by the corporation. If stock certificates
      are lost, destroyed, mutilated, or otherwise unavailable, obtain an Affidavit
      of Lost Stock Certificate.
    - For S-corporations or Partnerships where both stock certificate and stock ledger
      are unavailable, obtain the most recent preceding tax year's K-1 statement for
      all members with 20% or more interest and a letter from the CPA or Tax Preparer
      affirming current ownership interest; if the preceding year's taxes have not
      been filed, verify that the letter includes a statement to that effect.
    - Verify that names on entity documents match the identification; if they do not
      match exactly, obtain a letter of explanation addressing the discrepancy.
    - Obtain a Certificate of Good Standing or equivalent document valid within ninety
      (90) days of the closing date.
    - If the entity is formed in a state other than where business is conducted or
      the property is located, obtain a Certificate of Foreign Qualification or other
      qualification to operate in the state where business is being conducted.
    - Obtain the entity’s IRS Form SS4 or Federal Taxpayer Identification Number (TIN)
      or Employer Identification Number (EIN) issuance letter. If an EIN exception
      is requested, verify that it is submitted for review by Acra's Legal Department
      with a letter of explanation stating the applicable grounds.
    - Obtain a Unanimous Written Consent / Board Resolution signed by all members
      regardless of their percentage of interest, authorizing the transaction with
      Acra Lending and identifying who is authorized to sign the loan documents on
      behalf of and to bind the entity. Check whether the Operating Agreement or Bylaws
      require it even where ownership is held by one individual. Do not accept it
      to designate a signor on a personal guarantee.
    - If an attorney in fact is designated to execute a personal guarantee, verify
      that the principal utilizes a Power of Attorney for that designation.
    - Record any additional supporting documentation Legal conditions for in its sole
      discretion.
    checks:
    - A complete, legible Certificate of Formation / Articles of Organization and
      all amendments are provided.
    - The applicable Operating Agreement or Bylaws and all referenced exhibits and
      amendments are provided and contain the required management, borrowing, contracting,
      and signer provisions.
    - Documentation evidences all ownership interests in the manner required for the
      entity type.
    - The applicable corporate share evidence accounts for all outstanding shares,
      and an Affidavit of Lost Stock Certificate is provided when required.
    - When both stock certificate and stock ledger are unavailable for an S-corporation
      or Partnership, the required K-1 statements and CPA or Tax Preparer letter are
      provided, including the required statement if the preceding year's taxes have
      not been filed.
    - Names on entity documents match identification, or a letter of explanation addresses
      any exact-name discrepancy.
    - A Certificate of Good Standing or equivalent is valid within ninety (90) days
      of the closing date.
    - Where applicable, qualification to operate in the state where business is being
      conducted is documented.
    - The entity’s IRS Form SS4 or TIN or EIN issuance letter is provided, or an EIN
      exception request with the required grounds letter is submitted for review by
      Acra's Legal Department.
    - The required Unanimous Written Consent / Board Resolution is signed by all members,
      authorizes the transaction, and identifies the authorized loan-document signatory;
      it is not used to designate a personal-guarantee signor.
    - A Power of Attorney is utilized by the principal to designate an attorney in
      fact to execute a personal guarantee, where applicable.
    - Any additional supporting documentation required by Legal in its sole discretion
      is provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable required document and content requirement is satisfied,
        and any additional documentation required by Legal is provided.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Documentation is subject to a condition, including an EIN exception
        request or additional supporting documentation required by Legal, that must
