        loan is Q-21). The excerpt''s DTI calculation for interest-only loans is a
        DTI-program provision — Q-14. \[G §7.5, p. 13\]


        | **Condition** | **Purchase** | **Rate & Term** | **Cash-Out** | **Stated
        at** |

        |----|----|----|----|----|

