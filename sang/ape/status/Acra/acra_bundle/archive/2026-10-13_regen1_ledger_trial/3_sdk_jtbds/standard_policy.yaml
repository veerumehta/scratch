- rule_id: acra-standard.first_time_homebuyer_eligibility.review_entity_guarantor_homeownership_requirement
  condition:
    kind: procedure
    purpose: Determine whether the stated guarantor requirement is established for
      an entity borrower and retain the requested Acra confirmation on how it interacts
      with FTHB eligibility.
    steps:
    - If the borrower is an entity, establish that at least one guarantor has prior
      homeownership experience.
    - Establish that at least one borrower / guarantor on the loan attests on the
      application that they are not a first-time homebuyer.
    - If prior home ownership is not evident within the loan file, note that the underwriter
      reserves the right to condition for supporting documentation.
    - For an entity FTHB case, retain the unresolved Acra confirmation requested on
      how the entity guarantor requirement and the first-time-homebuyer allowance
      interact (Q-09).
    checks:
    - For an entity borrower, at least one guarantor has prior homeownership experience.
    - For an entity borrower, at least one borrower / guarantor on the loan attests
      on the application that they are not a first-time homebuyer.
    - If prior home ownership is not evident within the loan file, supporting documentation
      is conditioned if the underwriter exercises that reserved right.
    - For an entity FTHB case, the interaction of the entity guarantor requirement
      and the FTHB allowance is not treated as resolved without Acra confirmation.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The borrower is an entity, the guarantor checks hold, and the interaction
        with the FTHB allowance is resolved by Acra confirmation.
