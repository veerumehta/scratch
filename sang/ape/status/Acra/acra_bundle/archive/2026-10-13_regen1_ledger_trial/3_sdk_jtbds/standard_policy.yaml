- rule_id: acra-standard.funds_to_close_seasoning_and_reserves.funds_to_close_and_seasoning_documentation
  condition:
    kind: procedure
    purpose: Determine whether funds to close are documented for the required period
      and whether seasoning verification is required under the stated transaction
      and CLTV conditions.
    steps:
    - Require a minimum of 30-days documentation for all transactions.
    - 'Determine whether the seasoning-verification trigger applies: loans over 70%
      CLTV for consumer transactions, or business purpose loans where funds to close
      are over $50,000 and over 70% CLTV.'
    - Where source-account verification is required, review the borrower's bank statement(s)
      for the most recent month(s), or a VOD reflecting a current and average balance
      for the most recent month(s).
    - For funds not seasoned a minimum of sixty (60) days, review a letter of explanation
      and information comprising a sixty (60) day chain of funds where the applicable
      source-account requirements call for them.
    - Do not impose a domestic seasoning period beyond the stated 30-days documentation
      minimum absent the requested Acra confirmation.
    checks:
    - The transaction has a minimum of 30-days documentation.
    - For a consumer transaction over 70% CLTV, seasoning of funds to close is verified.
    - For a business purpose loan, if funds to close are over $50,000 and CLTV is
      over 70%, seasoning of funds to close is verified.
    - Where source-account verification is required, the account is verified by the
      stated bank statement(s) or VOD option.
    - Where funds are not seasoned a minimum of sixty (60) days and the stated account-documentation
      condition applies, a letter of explanation and information comprising a sixty
      (60) day chain of funds are provided.
