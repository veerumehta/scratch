- rule_id: acra-standard.property_eligibility_and_property_specific_overlays.apply_rural_or_unique_property_overlay
  condition:
    kind: procedure
    purpose: Determine whether an applicable rural or unique property meets its printed
      CLTV, FICO and DSCR requirements.
    steps:
    - Determine whether the property is rural or unique.
    - 'For an applicable property, compare CLTV with the maximum: 80% for purchase,
      75% for refinance — rate & term, or 70% for refinance — cash-out.'
    - Verify minimum FICO 700.
    - Verify minimum DSCR 1.00.
    - Determine whether marketing time is excessive or the property exhibits unusual,
      inadequate or peculiar functionality; if so, review whether LTV may be further
      reduced.
    checks:
    - 'If the property is rural or unique, CLTV does not exceed the maximum for its
      purpose: 80% for purchase, 75% for refinance — rate & term, or 70% for refinance
      — cash-out.'
    - If the property is rural or unique, FICO is at least 700.
    - If the property is rural or unique, DSCR is at least 1.00.
    - If marketing time is excessive or the property exhibits unusual, inadequate
      or peculiar functionality, any further LTV reduction determined to apply is
      applied.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not rural or unique, or every applicable printed
        minimum and cap is met and any applicable further LTV reduction is applied.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required DSCR determination or review of marketing time, functionality,
        or a possible further LTV reduction remains outstanding.
    - status: FAIL
      verdict: violated
      criterion: An applicable printed CLTV cap, minimum FICO 700, or minimum DSCR
        1.00 is not met, or an applicable further LTV reduction is not applied.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not rural or unique.
