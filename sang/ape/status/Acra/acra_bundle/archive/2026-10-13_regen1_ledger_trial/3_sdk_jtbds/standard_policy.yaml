  condition:
    kind: procedure
    purpose: Determine the published maximum CLTV for the applicable Investment Property
      matrix entry and whether the case CLTV is within that value.
    steps:
    - Confirm whether the case is subject to the Investment Property matrix.
    - 'Select the loan-amount tier: loan_amount ≤ $1,500,000; $1,500,001–$2,000,000;
