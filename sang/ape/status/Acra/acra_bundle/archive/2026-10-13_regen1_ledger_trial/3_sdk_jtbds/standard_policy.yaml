- rule_id: acra-standard.dscr_qualification_rental_income_and_rent_evidence.apply_ratio_dependent_qualification_conditions
  condition:
    kind: procedure
    purpose: Check the ratio-dependent minimums and restrictions collected in the
      program provisions.
    steps:
    - 'Determine which stated situations apply: LTV above 80.00%; loan amount over
      $2,000,000; 1 or no score / deficient tradelines; rural / unique property; non-warrantable
      condo or condotel / PUDtel; first-time homebuyer; vacant property refinance
      purpose; property listed for sale within six months; or mixed use, adult care
      or assisted living.'
    - For each applicable situation, compare DSCR with the stated minimum.
    - 'For LTV above 80.00%, also check the stated 6 months PITIA reserves and property-type
      limitation: SFR, Warrantable Condos outside of Florida, Townhome, PUD.'
    checks:
    - If LTV is above 80.00%, DSCR is at least 1.20.
    - If LTV is above 80.00%, reserves are 6 months PITIA.
    - If LTV is above 80.00%, the property is limited to SFR, Warrantable Condos outside
      of Florida, Townhome, PUD.
    - If the loan amount is over $2,000,000, DSCR is at least 1.0.
    - If there is 1 or no score / deficient tradelines, DSCR is at least 1.1.
    - If the property is rural / unique, DSCR is at least 1.00.
    - If the property is a non-warrantable condo; condotel / PUDtel, DSCR is at least
      1.0.
    - If the borrower is a first-time homebuyer, DSCR is at least 1.150.
    - If the property is vacant and the transaction is a rate & term refinance, DSCR
      is at least 1.000 (“OR Maximum 40.0% DTI”).
    - If the property is vacant and the transaction is a cash-out refinance, DSCR
      is at least 1.15.
    - If the property was listed for sale within six months, DSCR is at least 1.0
      (“or (b) 43% maximum DTI”).
    - If the property is mixed use, adult care or assisted living, DSCR is at least
      1.2.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every applicable check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable requirements are met, subject to conditions that must
        be cleared.
    - status: FAIL
      verdict: violated
      criterion: A required step is not met or an applicable check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: None of the listed situations applies.
    evidence_types: []
    reads:
    - loan_amount
    - credit_score_count
    - tradelines_meet_requirement
    - rural_property
    - property_type
    - first_time_homebuyer
    - vacant_property
    - loan_purpose
    - property_currently_listed_for_sale
    - listed_for_sale_last_6_months
    - mixed_use
    - cltv_pct
    - reserves_months
    - pitia
    - fico
    computable_checks: []
    missing_reads:
    - LTV
    - calculated DSCR
    - whether property is rural / unique
    - whether a condo is warrantable
    - whether the property is a condotel / PUDtel
    - whether the property is adult care or assisted living
    - whether the applicable DTI alternative is met
    - PITIA reserve amount and the reserve-month calculation
