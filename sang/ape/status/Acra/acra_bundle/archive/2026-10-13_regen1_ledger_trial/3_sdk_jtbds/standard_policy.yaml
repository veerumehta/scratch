- rule_id: acra-standard.entity_borrowers_guarantors_and_trusts.borrower_guarantor_due_diligence
  condition:
    kind: procedure
    purpose: Determine whether borrower / guarantor due diligence is current at the
      required event and whether the required Key Principals and Entities are within
      the background review scope.
    steps:
    - Confirm borrower / guarantor due diligence is current as of the date of any
      loan approval or draw, applying the schedule referred to in the guideline when
      available.
    - For an entity borrower, confirm Acra reviews the entity, the recourse guarantor(s),
      and any party (individual or entity) that owns 20% or more of the entity directly
      or indirectly or has managing control.
    - For an individual borrower, confirm Acra reviews all such individuals.
    - Note that Acra may order background checks on all Key Principals and Entities
      from Checkpoint, LexisNexis or another comparable provider, including criminal
      history, OFAC searches, litigation, judgment, and lien searches.
    checks:
    - Borrower / Guarantor Due Diligence is current as of the date of any loan approval
      or draw, as required by the applicable schedule.
    - For an entity borrower, the background review scope includes the entity, the
      recourse guarantor(s), and any party (individual or entity) that owns 20% or
      more of the entity directly or indirectly or has managing control.
    - For an individual borrower, the background review scope includes all such individuals.
    - The review recognizes that Acra may order background checks on all Key Principals
      and Entities from Checkpoint, LexisNexis or another comparable provider, including
      criminal history, OFAC searches, litigation, judgment, and lien searches.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The job applies, every step is met, and every check holds under the
        applicable due diligence schedule.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The job applies and requirements are met subject to conditions that
        must be cleared.
    - status: FAIL
      verdict: violated
      criterion: The job applies and a step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case has no borrower / guarantor due diligence subject to this
        section.
