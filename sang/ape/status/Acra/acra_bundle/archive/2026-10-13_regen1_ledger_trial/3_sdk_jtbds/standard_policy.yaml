- rule_id: acra-standard.credit_housing_history_and_escrow_waiver.review_scores_tradelines_and_reserves
  condition:
    kind: procedure
    purpose: Determine whether the score and tradeline requirements are met, apply
      the stated overlays when applicable, and verify the reserve requirement for
      FICO below 620.
    steps:
    - Review the number of repositories reporting scores and the tradeline information.
    - If there are scores from 3 repositories, apply the stated acceptable-with-no-tradeline-overlay
      treatment.
    - If there are 2 or fewer scores, check for either 2 tradelines & 24 month history
      or 3 tradelines & 12 month history.
    - 'If there is 1 or No Score / Deficient Tradelines, check each of the three printed
      entries: Max 65% LTV/CLTV; DSCR Ratio ≥ 1.1; 24mos 0x30 housing history.'
    - Verify that scores & tradelines are reported under the correct ITIN or SSN.
    - If FICO is < 620, verify 12 months of reserves.
    checks:
    - Applicants with scores from 3 repositories are treated as acceptable with no
      tradeline overlay.
    - For applicants with 2 or fewer scores, either 2 tradelines & 24 month history
      or 3 tradelines & 12 month history is met.
    - For 1 or No Score / Deficient Tradelines, CLTV is no greater than 65%.
    - For 1 or No Score / Deficient Tradelines, DSCR Ratio is ≥ 1.1.
    - For 1 or No Score / Deficient Tradelines, 24mos 0x30 housing history is met.
    - Scores & tradelines are reported under the correct ITIN or SSN.
    - If FICO is < 620, reserves are at least 12 months.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required tradeline, DSCR Ratio, housing-history, or ITIN/SSN report
        item is not available for review.
    - status: FAIL
      verdict: violated
      criterion: An applicable credit requirement or overlay does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: the job does not apply to this case
    evidence_types: []
    reads:
    - credit_score_count
    - tradelines_meet_requirement
    - cltv_pct
    - dscr_documentation_type
