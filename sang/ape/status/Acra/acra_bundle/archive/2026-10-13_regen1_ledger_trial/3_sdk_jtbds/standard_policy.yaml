    reads:
    - borrower_entity_type
    computable_checks: []
    missing_reads:
    - The due diligence status and date, the date of any loan approval or draw, and
      the schedule referred to in the guideline, which is not reproduced in the excerpt.
    - Whether the borrower is an entity or individual; the recourse guarantors; direct
      and indirect ownership interests; managing control; and the entities and individuals
      included in the background review.
    - Whether Acra ordered background checks, the provider used, and the scope and
      results of any checks.
  action: require_evidence
  priority: 100
