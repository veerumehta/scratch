    reads:
    - rural_property
    - loan_purpose
    - cltv_pct
    - fico
    computable_checks:
    - 0
    - 1
    missing_reads:
    - DSCR calculation or documentation
    - Whether marketing time is excessive
    - Whether the property exhibits unusual, inadequate or peculiar functionality
    - Any determination of a further LTV reduction
