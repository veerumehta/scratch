- rule_id: acra-standard.dscr_qualification_rental_income_and_rent_evidence.review_qualifying_rent_and_actual_rent_evidence
  condition:
    kind: procedure
    purpose: Check the rent evidence requirements stated for actual rents without
      selecting between the section's differing rent formulations.
    steps:
    - Determine whether actual rents exceed market rents.
    - If actual rents exceed market rents, review the proof of rental income receipt
      and lease agreement(s).
    - Confirm the receipt evidence covers two (2) consecutive months, the lease agreement(s)
      continue at a minimum of three (3) months after closing, and the rents are not
      prepaid; do not count a Security Deposit as receipt.
    checks:
    - Where actual rents exceed market rents, evidence of actual rents is documented
      via two (2) consecutive months proof of rental income receipt.
    - Where actual rents exceed market rents, lease agreement(s) continue at a minimum
      of three (3) months after closing.
    - A Security Deposit is not counted towards receipt, and the rents are not prepaid.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable requirement is met, subject to conditions that must
        be cleared.
    - status: FAIL
      verdict: violated
      criterion: A required step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Actual rents do not exceed market rents.
