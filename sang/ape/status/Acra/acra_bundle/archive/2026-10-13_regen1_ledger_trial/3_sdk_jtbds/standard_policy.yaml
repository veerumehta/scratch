        is typical for the area; acceptable documentation may include classified ads
        from local newspapers, a 1007 completed by the appraiser, or a market rent
        survey completed by a local real estate company or rental management company
        familiar with the market rents in the area. \[G §14.12, p. 4\]


        STD-3.12 Short-term rental, appraisal form: for properties occupied as a short-term
        rental, an STRpro or similar appraisal form is acceptable as replacement to
        a 1007 as long as it is signed by an appropriately licensed appraiser. \[G
        §14.13, p. 4\]


        STD-3.13 Short-term rental, actual rents: “Acra can accept short term rentals
        with 12-month ledgers from condotel management companies, property managers,
        AirBnB, VRBO, etcetera as documentation for actual rents.” How a 12-month
        ledger establishes qualifying rent, and how the receipt and lease conditions
        of STD-3.6 apply to short-term rentals: Acra confirmation requested → Q-02.
        \[G §5.32, p. 3; §14.13, p. 4\]


        STD-3.14 Short-term rental caps: “Properties qualifying with short-term rentals
        are limited to 75% & 70% LTV / CLTV for Purchase or Refinance transactions
