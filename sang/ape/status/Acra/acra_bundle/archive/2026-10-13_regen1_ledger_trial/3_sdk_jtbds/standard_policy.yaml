- rule_id: acra-standard.program_scope_occupancy_and_transaction_setup.set_rent_based_qualification
  condition:
    kind: procedure
    purpose: Establish the permitted qualification method and follow the stated income-documentation
      and DTI instructions.
    steps:
    - Qualify the loan on the subject property's rent rather than the borrower's income.
    - Identify whether the loan qualifies using a calculated DSCR or as No Ratio DSCR,
      where no ratio is calculated.
    - For calculated DSCR, apply the stated minimum when LTV is above 80%; where DSCR
      is below 1.0, apply the stated caps.
    - Do not require borrowing entity income documentation.
    - For applicants qualifying using a DSCR, do not calculate DTI; income or employment
      listed on an application is superfluous to the underwrite and may be left blank,
      and if represented, a DTI should not be calculated.
    checks:
    - Qualification is based on the subject property's rent rather than the borrower's
      income.
    - The qualification method is either calculated DSCR or No Ratio DSCR, where no
      ratio is calculated.
    - If LTV is above 80%, calculated DSCR is at least 1.20.
    - If DSCR is below 1.0, the applicable caps are met.
    - Borrowing entity income documentation is not required.
    - For applicants qualifying using a DSCR, DTI is not calculated.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
