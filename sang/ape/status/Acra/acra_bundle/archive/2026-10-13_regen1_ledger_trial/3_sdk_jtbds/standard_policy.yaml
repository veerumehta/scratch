- rule_id: acra-standard.property_eligibility_and_property_specific_overlays.review_property_listed_for_sale
  condition:
    kind: procedure
    purpose: Determine whether the §11.5 requirements for a property listed for sale
      apply and are met.
    steps:
    - Determine whether the property was listed for sale in the last six months, measured
      from the last date of being listed to the Application Date.
    - For a property in scope, verify that the property is not in default or otherwise
      delinquent on lien(s).
    - For an investment property in scope, verify that the subject is occupied by
      a tenant and is not vacant.
    - Verify qualification as either ≥ 1.0 DSCR or 43% maximum DTI.
    - Verify a prepayment penalty of at least three (3) years unless the property
      is in a state that does not allow prepayment penalties.
    - Verify twenty-four (24) months of reserves; cash-in-hand may be considered if
      otherwise consistent with the Guide.
    - Verify a fully amortizing term and no interest only.
    - Verify maximum LTV / CLTV of 65% based on the lesser of appraised value or lowest
      recent listing price.
    - Verify no subordinate financing and impounds.
    checks:
    - The property was listed for sale in the last six months, measured from the last
      date of being listed to the Application Date, for this overlay to apply.
    - The property is not in default or otherwise delinquent on lien(s).
    - For an investment property, the subject is occupied by a tenant and is not vacant.
    - The loan qualifies as either ≥ 1.0 DSCR or 43% maximum DTI.
    - A prepayment penalty of at least three (3) years is in place unless the property
      is in a state that does not allow prepayment penalties.
    - Reserves are twenty-four (24) months, with cash-in-hand considered only if otherwise
      consistent with the Guide.
    - The loan has a fully amortizing term.
    - The loan is not interest only.
    - LTV / CLTV does not exceed 65% based on the lesser of appraised value or lowest
      recent listing price.
    - No subordinate financing is present.
    - Impounds are in place.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The overlay does not apply, or the property is in scope and every
        applicable stated characteristic is met.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Listing dates or any required characteristic or documentation remains
        to be verified.
    - status: FAIL
      verdict: violated
      criterion: The property is in scope and an applicable stated characteristic
        is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property was not listed for sale in the last six months under
        the stated measurement, or the job otherwise does not apply.
    evidence_types: []
    reads:
    - listed_for_sale_last_6_months
    - loan_purpose
    - occupancy_subtype
    - current_lease_in_place
    - vacant_property
    - reserves_months
    - product_is_interest_only
    - cltv_pct
    - property_value
    - property_state
    computable_checks: []
    missing_reads:
    - Last date the property was listed for sale
    - Application Date
    - Lien status and default or delinquency information
    - Whether the property is an investment property and evidence of tenant occupancy
    - DSCR calculation or documentation
    - DTI calculation or documentation
    - Prepayment penalty duration
    - Whether the property state does not allow prepayment penalties
    - Reserve documentation and whether cash-in-hand is consistent with the Guide
    - Amortization terms
    - Appraised value and lowest recent listing price
    - Subordinate financing information
    - Impound status
  action: require_evidence
  priority: 100
  description: Apply the six-month listing definition and check each stated loan characteristic
    for a listed property.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.3 Properties listed for
    sale (§11.5)
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'STD-8.8 A property is considered listed for sale under §11.5 if it
        has been listed for sale in the last six months, measured from (a) the last
        date of being listed to (b) the Application Date. \[G §11.5, p. 12\]


        STD-8.9 Loans on such properties will be considered under the following characteristics:
        the property is not in default or otherwise delinquent on lien(s); for investment
        properties, the subject must be occupied by a tenant and may not be vacant;
        the loan must qualify as either (a) ≥ 1.0 DSCR or (b) 43% maximum DTI (Q-14);
        a prepayment penalty of at least three (3) years is required unless the property
        is in a state that does not allow prepayment penalties; twenty-four (24) months
        of reserves are required, and cash-in-hand may be considered if otherwise
        consistent with the Guide; the loan must have a fully amortizing term, interest
        only is not available; the maximum LTV / CLTV is 65% based on the lesser of
        (a) appraised value or (b) lowest recent listing price; no subordinate financing
        is allowed; impounds are required. \[G §11.5, pp. 11–12\]'
