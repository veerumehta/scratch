- rule_id: acra-standard.entity_borrowers_guarantors_and_trusts.revocable_living_trust_title_vesting
  condition:
    kind: procedure
    purpose: Determine whether title vesting in an inter vivos revocable trust meets
      each stated requirement.
    steps:
    - Confirm a complete, legible copy of the Trust or a Certification of Trust containing
      every specified item is provided.
    - Confirm the Trust is valid under the laws of the state in which it is established.
    - Confirm the Trust is revocable and can be changed or canceled at any time for
      any reason during a Trustor's lifetime.
    - Confirm the Trust is established by one or more natural persons, solely or jointly,
      and becomes effective during the lifetime of the person(s) establishing it.
    - Confirm the primary beneficiary of the Trust is the individual(s) establishing
      the Trust.
    - If the Trustor(s) and Trustee(s) are not the same, confirm written exception
      by Acra Senior Management is obtained.
    - Confirm the Trust contains each required provision concerning the Trustee's
      power, beneficiary consent, lender rights, and title.
    - Note that Legal reserves the right to condition for additional supporting documentation
      as determined in its sole discretion.
    checks:
    - A complete, legible copy of the Trust or a Certification of Trust states the
      existence and date of the Trust; the Trustor(s) and current Trustee(s); the
      powers of the Trustee; whether the Trust is revocable and, if revocable, who
      holds the right to revoke; the names and number of Trustees required to sign
      on behalf of the Trust; the Trust identification number (a Social Security number
      or an IRS-issued Tax Identification Number); how title to the Trust assets should
      be taken; and that the Trust has not been revoked, modified, or amended in any
      manner.
    - The Trust is valid under the laws of the state in which it is established.
    - The Trust is revocable, meaning it can be changed or canceled at any time for
      any reason during a Trustor's lifetime.
    - The Trust is established by one or more natural persons, solely or jointly (Grantor,
      Trustor, or Settlor), and becomes effective during the lifetime of the person(s)
      establishing it.
    - The primary beneficiary of the Trust is the individual(s) establishing the Trust.
    - If the Trustor(s) and Trustee(s) are not the same, written exception by Acra
      Senior Management is obtained.
    - The Trust specifies that the Trustee has the power to hold title and mortgage
      the property.
    - The Trust specifies that the beneficiary does not need to grant written consent
      for the Trust to borrow money, or that such consent has been granted in writing
      for purposes of the mortgage.
    - The Trust specifies that there is no unusual risk or impairment to the lender's
      rights.
    - The Trust specifies that holding title in the Trust does not diminish the lender's
      rights as a creditor.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The job applies, every step is met, and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The job applies and the requirements are met subject to conditions
        that must be cleared, including any additional supporting documentation Legal
        conditions for.
    - status: FAIL
      verdict: violated
      criterion: The job applies and a step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Title is not vested in an inter vivos revocable trust.
    evidence_types: []
    reads: []
    computable_checks: []
    missing_reads:
    - Whether title is vested in an inter vivos revocable trust and the complete Trust
      or Certification of Trust.
    - The Trust's existence and date, Trustor(s), Trustee(s), Trustee powers, revocability
      and right to revoke, required Trustee signers, identification number, title
      instructions, and statement that the Trust has not been revoked, modified, or
      amended.
    - The state in which the Trust is established and whether it is valid under that
      state's laws.
    - Whether the Trust is changeable or cancelable at any time for any reason during
      a Trustor's lifetime, who established it, and when it became effective.
    - The primary beneficiary and whether the Trustor(s) and Trustee(s) are the same;
      if not, the written Acra Senior Management exception.
    - The Trust provisions on holding title, mortgaging the property, beneficiary
      consent, unusual risk or impairment to lender rights, and lender rights as a
      creditor.
    - Whether Legal conditions for additional supporting documentation.
