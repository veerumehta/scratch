      is No Ratio DSCR.
    - For a DSCR transaction, verify that a Form 1007 is provided.
    - For a 2-4 unit property where Form 1025 is offered as satisfying the requirement,
      obtain Acra confirmation; the policy does not resolve whether Form 1025 satisfies
      it.
    checks:
    - For a DSCR transaction, a Form 1007 is provided, including for No Ratio DSCR.
    - For a 2-4 unit property relying on Form 1025 instead of Form 1007, Acra has
      confirmed whether Form 1025 satisfies the requirement.
    outcomes:
