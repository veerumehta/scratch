- rule_id: acra-standard.property_eligibility_and_property_specific_overlays.check_property_type_eligibility_and_caps.python
  condition:
    kind: python
    source: "import rules_lib\n\ndef check(ctx):\n    property_type = ctx['property_type']\n\
      \    missing = rules_lib.gaps(property_type=property_type)\n    if missing:\n\
      \        return rules_lib.unknown(*missing)\n\n    kind = rules_lib.match(property_type,\
      \ (\n        'SFR', 'Townhome', 'PUD', 'Warrantable Condo',\n        'Non-Warrantable\
      \ Condo', 'Condotel / PUDtel',\n        '2-4 Units', '2-4 Unit', 'Manufactured',\
      \ 'Manufactured Home',\n    ))\n    if kind is None:\n        return False\n\
      \n    if rules_lib.same(kind, 'SFR', 'Townhome', 'PUD', 'Warrantable Condo'):\n\
      \        return True\n\n    if rules_lib.same(kind, '2-4 Units', '2-4 Unit'):\n\
      \        cltv_pct = ctx['cltv_pct']\n        missing = rules_lib.gaps(cltv_pct=cltv_pct)\n\
      \        if missing:\n            return rules_lib.unknown(*missing)\n     \
      \   return cltv_pct <= 80\n\n    cltv_pct = ctx['cltv_pct']\n    loan_purpose\
      \ = ctx['loan_purpose']\n    needs_florida_check = rules_lib.same(\n       \
      \ kind, 'Non-Warrantable Condo', 'Condotel / PUDtel'\n    )\n    if needs_florida_check:\n\
      \        property_state = ctx['property_state']\n        missing = rules_lib.gaps(\n\
      \            cltv_pct=cltv_pct,\n            loan_purpose=loan_purpose,\n  \
      \          property_state=property_state,\n        )\n    else:\n        missing\
      \ = rules_lib.gaps(cltv_pct=cltv_pct, loan_purpose=loan_purpose)\n    if missing:\n\
      \        return rules_lib.unknown(*missing)\n\n    if rules_lib.same(kind, 'Non-Warrantable\
      \ Condo'):\n        if rules_lib.same(loan_purpose, 'Purchase'):\n         \
      \   cap = 80\n        elif rules_lib.same(loan_purpose, 'Refi R/T'):\n     \
      \       cap = 75\n        elif rules_lib.same(loan_purpose, 'Refi C/O'):\n \
      \           cap = 75\n        else:\n            return False\n    elif rules_lib.same(kind,\
      \ 'Condotel / PUDtel'):\n        if rules_lib.same(loan_purpose, 'Purchase'):\n\
      \            cap = 75\n        elif rules_lib.same(loan_purpose, 'Refi R/T'):\n\
      \            cap = 70\n        elif rules_lib.same(loan_purpose, 'Refi C/O'):\n\
      \            cap = 65\n        else:\n            return False\n    elif rules_lib.same(kind,\
      \ 'Manufactured', 'Manufactured Home'):\n        if rules_lib.same(loan_purpose,\
      \ 'Purchase'):\n            cap = 65\n        elif rules_lib.same(loan_purpose,\
      \ 'Refi R/T'):\n            cap = 60\n        elif rules_lib.same(loan_purpose,\
      \ 'Refi C/O'):\n            cap = 60\n        else:\n            return False\n\
      \    else:\n        return False\n\n    if needs_florida_check and rules_lib.same(property_state,\
      \ 'Florida', 'FL'):\n        cap -= 5\n    return cltv_pct <= cap"
    entrypoint: check
    reads:
    - property_type
    - cltv_pct
    - loan_purpose
    - property_state
    derived_from: acra-standard.property_eligibility_and_property_specific_overlays.check_property_type_eligibility_and_caps
