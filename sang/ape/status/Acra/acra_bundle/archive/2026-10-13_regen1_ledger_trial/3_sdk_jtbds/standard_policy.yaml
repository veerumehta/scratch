- rule_id: acra-standard.funds_to_close_seasoning_and_reserves.reserve_requirements_by_trigger
  condition:
    kind: procedure
    purpose: Determine whether the reserve requirements stated for applicable loan,
      borrower, and property circumstances are met.
    steps:
    - Determine whether LTV is > 80.00%; if so, verify 6 months PITIA reserves.
    - Determine whether FICO is < 620; if so, apply the stated 12 Months reserve requirement
      without assuming a payment basis not stated in the source.
    - For a first-time homebuyer, verify Minimum six months reserves (“Requires 6mos
      Reserves”).
    - For a vacant property, determine whether the transaction is a rate & term refinance
      or cash-out refinance and apply the corresponding stated minimum six months
      reserves or 6 months reserves.
    - If the property was listed for sale within six months, verify Twenty-four (24)
      months of reserves; cash-in-hand may be considered if otherwise consistent with
      the Guide.
    - For forbearance or mortgage lates in the last 12 months, where the subject is
      tenant-occupied and the prior two months' rent were not timely received, verify
      12 months of the subject's payment in reserve; this may be from the transaction's
      cash-in-hand.
    - If rent loss insurance is required but cannot be obtained, verify Two (2) months
      reserves for every one (1) month of coverage not provided.
    - Do not infer a base reserve requirement, a payment basis where only “months”
      is stated, permitted sources, whether overlapping triggers are cumulative, or
      whether reserves substituted for rent loss insurance are additional; Acra confirmation
      is requested in Q-07.
    checks:
    - If LTV is > 80.00%, 6 months PITIA reserves are held.
    - If FICO is < 620, the stated 12 Months reserve requirement is met; its payment
      basis is not specified in the source.
    - A first-time homebuyer has Minimum six months reserves (“Requires 6mos Reserves”).
    - For a vacant property — rate & term refinance, Minimum six months reserves are
      held.
    - For a vacant property — cash-out refinance, 6 months reserves are held.
    - If the property was listed for sale within six months, Twenty-four (24) months
      of reserves are held, with cash-in-hand considered only if otherwise consistent
      with the Guide.
    - If forbearance or mortgage lates in the last 12 months, tenant-occupied subject,
      and no timely receipt of the prior two months' rent all apply, 12 months of
      the subject's payment are held in reserve; the reserve may be from the transaction's
      cash-in-hand.
    - If rent loss insurance is required but cannot be obtained, Two (2) months reserves
      are held for every one (1) month of coverage not provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A requirement remains subject to conditions that must be cleared.
    - status: FAIL
      verdict: violated
      criterion: A step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The job does not apply to this case.
    evidence_types: []
    reads:
    - fico
    - first_time_homebuyer
    - vacant_property
    - loan_purpose
    - property_currently_listed_for_sale
    - listed_for_sale_last_6_months
    - housing_history
    - mortgage_history_0x30x24
    - current_lease_in_place
    - occupancy_subtype
    - reserves_months
    - pitia
    computable_checks:
    - 1
    - 2
    - 5
    missing_reads:
    - LTV (the available case field is CLTV, not LTV)
    - Reserve amount and records supporting the stated reserve requirement
    - Payment basis for the FICO < 620 trigger's 12 Months requirement (Acra confirmation
      requested in Q-07)
    - Whether vacant property is a rate & term refinance or cash-out refinance
    - Whether cash-in-hand is otherwise consistent with the Guide
    - Whether forbearance occurred or mortgage lates occurred in the last 12 months
    - Whether the subject is tenant-occupied and whether the prior two months' rent
      were timely received
    - Subject payment amount and reserve records
    - Whether rent loss insurance is required, whether it can be obtained, and months
      of coverage not provided
    - Base reserve requirement where no trigger applies; payment basis where only
      “months” is stated; permitted sources; whether overlapping triggers are cumulative;
      whether reserves substituted for rent loss insurance are additional (Acra confirmation
      requested in Q-07)
  action: require_evidence
  priority: 100
  description: Identify each stated reserve trigger and verify its printed reserve
    requirement without supplying unstated bases or cumulative rules.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#9.2 Reserves by trigger,
    as stated
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'STD-9.6 The sources state reserves only for the situations below, and
        state the payment basis only where shown. The base requirement where no trigger
        applies, the payment basis where only “months” is stated, permitted sources,
        whether overlapping triggers are cumulative, and whether reserves substituted
        for rent loss insurance are additional: Acra confirmation requested → Q-07.
        \[S; G\]


        | **Trigger** | **Reserves as printed** | **Source** |

        |----|----|----|

        | LTV \> 80.00% | 6 months PITIA reserves | S: Income Documentation |

        | FICO \< 620 | 12 Months | S: Credit Requirements |

        | First-time homebuyer | Minimum six months reserves (“Requires 6mos Reserves”)
        | G §3.13; S: Restrictions |

        | Vacant property — rate & term refinance | Minimum six months reserves |
        G §10.17; S: Occupancy Type |

        | Vacant property — cash-out refinance | 6 months reserves | S: Occupancy
        Type |

        | Property listed for sale within six months | Twenty-four (24) months of
        reserves; cash-in-hand may be considered if otherwise consistent with the
        Guide | G §11.5 |

        | Forbearance or mortgage lates in the last 12 months, tenant-occupied subject,
        without timely receipt of the prior two months'' rent | 12 months of the subject''s
        payment in reserve, which may be from the transaction''s cash-in-hand | G
        §5.32 |

        | Rent loss insurance required but cannot be obtained | Two (2) months reserves
        for every one (1) month of coverage not provided | G §23.40 |'
