      are not a first-time homebuyer.
    - Whether prior home ownership is evident within the loan file and whether the
      underwriter conditions for supporting documentation.
    - Acra confirmation on the interaction of the entity guarantor requirement and
      the first-time-homebuyer allowance (Q-09).
