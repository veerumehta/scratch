- rule_id: acra-standard.property_eligibility_and_property_specific_overlays.check_property_type_eligibility_and_caps
  condition:
    kind: procedure
    purpose: Determine whether the property type is eligible and whether the applicable
      printed type cap and Florida condition are met.
    steps:
    - 'Check whether the property type is one of: SFR, Townhome, PUD, Warrantable
      Condo, Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units, Manufactured.'
    - 'For a Non-Warrantable Condo, compare CLTV with the printed cap: 80% for Purchase,
      75% for Refi R/T, or 75% for Refi C/O.'
    - 'For a Condotel / PUDtel, compare CLTV with the printed cap: 75% for Purchase,
      70% for Refi R/T, or 65% for Refi C/O.'
    - 'For a 2-4 Unit property, apply the printed “Max CLTV: 80%” cap, with no purpose
      split.'
    - 'For a Manufactured Home, compare CLTV with the printed cap: 65% for Purchase,
      60% for Refi R/T, or 60% for Refi C/O.'
    - For a Florida Non-Warrantable Condo or Condotel / PUDtel, apply the printed
      “-5% CLTV” condition.
    - 'For a Non-Warrantable Condo or Condotel / PUDtel, verify the printed Min DSCR:
      1.0 condition.'
    checks:
    - The property type is on the printed eligible property types list.
    - 'A Non-Warrantable Condo meets the printed cap for its loan purpose: 80% for
      Purchase, 75% for Refi R/T, or 75% for Refi C/O.'
    - 'A Condotel / PUDtel meets the printed cap for its loan purpose: 75% for Purchase,
      70% for Refi R/T, or 65% for Refi C/O.'
    - 'A 2-4 Unit property meets the printed “Max CLTV: 80%” cap.'
    - 'A Manufactured Home meets the printed cap for its loan purpose: 65% for Purchase,
      60% for Refi R/T, or 60% for Refi C/O.'
    - For a Florida Non-Warrantable Condo or Condotel / PUDtel, the printed “-5% CLTV”
      condition is applied.
    - 'A Non-Warrantable Condo or Condotel / PUDtel has Min DSCR: 1.0.'
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property type is eligible and every applicable printed cap and
        condition is met.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: An applicable DSCR condition or other required review remains outstanding.
    - status: FAIL
      verdict: violated
      criterion: The property type is not eligible, or an applicable printed cap or
        condition is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property-type eligibility and cap rules are not being reviewed
        for the case.
    evidence_types: []
    reads:
    - property_type
    - loan_purpose
    - property_state
    - cltv_pct
    computable_checks:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    missing_reads:
    - 'DSCR calculation or documentation for the Min DSCR: 1.0 condition'
