- rule_id: acra-standard.dscr_qualification_rental_income_and_rent_evidence.review_tenant_rent_evidence_after_recent_mortgage_events
  condition:
    kind: procedure
    purpose: Apply the rent-evidence requirement when an Applicant has had forbearance
      or mortgage lates within the last 12-months.
