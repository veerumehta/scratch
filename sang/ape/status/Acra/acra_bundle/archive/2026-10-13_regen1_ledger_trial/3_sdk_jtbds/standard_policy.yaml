- rule_id: acra-standard.funds_to_close_seasoning_and_reserves.foreign_account_funds_and_closing_timing
  condition:
    kind: procedure
    purpose: Determine whether foreign-account funds and funds held by Foreign Nationals
      meet the stated verification and closing requirements.
    steps:
    - For assets held in foreign accounts, verify U.S. Dollar equivalency using the
      current exchange rate via www.xe.com or the Wall Street Journal conversion table.
    - Verify that sufficient funds to close are on deposit with the Escrow / Closing
      Agent at least three (3) business days, including Saturdays for this calculation,
      prior to any closing date.
    - Obtain a copy of the two (2) most recent statements of the account. Translate
      bank statements in any language other than English into English.
    - If funds are not seasoned a minimum of sixty (60) days, obtain a letter of explanation
      and information comprising a sixty (60) day chain of funds.
    - For Foreign Nationals, verify a minimum of 60 days seasoning regardless of LTV
      / CLTV.
    - For funds held in a foreign bank / currency, verify repatriation at minimum
      three (3) business days prior to Closing; the scope of this requirement and
      applicable evidence are subject to the Acra confirmation requested in Q-12.
    checks:
    - Foreign-account assets are verified in U.S. Dollar equivalency at the current
      exchange rate via www.xe.com or the Wall Street Journal conversion table.
    - Sufficient funds to close are on deposit with the Escrow / Closing Agent at
      least three (3) business days, including Saturdays for this calculation, prior
      to any closing date.
    - The two (2) most recent statements of the account are provided.
    - Any bank statement in a language other than English is translated into English.
    - Where funds are not seasoned a minimum of sixty (60) days, a letter of explanation
      and information comprising a sixty (60) day chain of funds are provided.
    - A Foreign National documents a minimum of 60 days seasoning regardless of LTV
      / CLTV.
    - Funds held in a foreign bank / currency are repatriated at minimum three (3)
      business days prior to Closing, subject to the unresolved scope and evidence
      question in Q-12.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A requirement remains subject to conditions that must be cleared.
    - status: FAIL
      verdict: violated
      criterion: A step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The job does not apply to this case.
    evidence_types: []
    reads:
    - citizenship_type
    - cltv_pct
    computable_checks: []
    missing_reads:
    - Whether assets are held in a foreign account
    - Current exchange rate and conversion verification
    - Sufficient funds-to-close amount and deposit record
    - Closing date and business-day calculation, including Saturdays
    - Two (2) most recent account statements
    - Statement language and English translation, if required
    - Funds seasoning history
    - Letter of explanation and information comprising a sixty (60) day chain of funds,
      when required
    - Whether the borrower is a Foreign National
    - Whether funds are held in a foreign bank / currency
    - Repatriation record and timing
    - Scope of the repatriation requirement and applicable evidence (Acra confirmation
      requested in Q-12)
  action: require_evidence
  priority: 100
  description: Verify foreign-account funds in U.S. Dollar equivalency and check the
    stated account, seasoning, translation, and timing requirements.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign
    accounts
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#9.1 Gift funds, funds to
    close and seasoning
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'STD-5.6 Assets held / foreign accounts must be verified in U.S. Dollar
        equivalency at the current exchange rate via www.xe.com or the Wall Street
        Journal conversion table. \[G §3.10, p. 6\]


        STD-5.7 Sufficient funds to close must be on deposit with the Escrow / Closing
        Agent at least three (3) business days (including Saturdays for this calculation)
