- rule_id: acra-standard.products_interest_only_terms_and_subordinate_financing.apply_interest_only_payment_mechanics
  condition:
    kind: procedure
    purpose: Ensure the interest-only payment is calculated and recast as described,
      and that DSCR uses the first payment due under the Note.
    steps:
    - Verify that the interest-only payment is calculated as the amount sufficient
      to pay the accrued interest on the mortgage monthly at the time of origination.
    - After the interest-only term, verify that payments are recast to a fully amortized
      payment for the balance of the term ending at maturity.
    - Verify that Acra calculates DSCR using the first payment due under the Note.
    checks:
    - The interest-only payment is calculated as the amount sufficient to pay the
      accrued interest on the mortgage monthly at the time of origination.
    - After the interest-only term, payments are recast to a fully amortized payment
      for the balance of the term ending at maturity.
    - Acra calculates DSCR using the first payment due under the Note.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable payment-mechanics and DSCR check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A payment-mechanics or DSCR condition remains to be cleared, including
        resolution of which interest-only payment enters the DSCR denominator.
    - status: FAIL
      verdict: violated
      criterion: A step is not met or a payment-mechanics or DSCR check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The loan is not interest-only.
    evidence_types: []
    reads:
    - interest_rate
    - loan_amount
    - pitia
    - product_is_interest_only
    computable_checks: []
    missing_reads:
    - Interest-only payment calculation and payment schedule at origination.
    - Interest-only term, balance used for recast, remaining term, and maturity date.
    - Note payment schedule identifying the first payment due.
    - Q-26 guidance identifying which payment enters the denominator on an interest-only
      loan.
  action: require_evidence
  priority: 100
  description: Review the interest-only payment calculation and the payment used for
    DSCR under the stated guidance.
