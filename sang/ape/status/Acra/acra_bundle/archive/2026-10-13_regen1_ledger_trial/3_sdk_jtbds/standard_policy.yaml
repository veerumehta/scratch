    purpose: Establish whether the case meets the program-scope values stated in the
      published summary.
    steps:
    - Check the loan amount against the published range and increment.
    - Check the minimum FICO that applies to the loan amount.
    - Check the property type, state, and borrower citizenship against the published
      lists.
    - For delayed financing, apply the published loan-amount cap.
    - Apply the published CLTV values where their stated amount and FICO conditions
      apply.
    - Check the product and prepayment option against the published options and restrictions.
    checks:
    - Loan amount is from $100,000 to $3,000,000, in $50 increments.
    - FICO is at least 600 for loans ≤ $1,500,000; 620 for $1,500,001–$2,000,000;
      or 700 for $2,000,001–$3,000,000.
    - Property type is SFR, Townhome, PUD, Warrantable Condo, Non-Warrantable Condo,
      Condotel / PUDtel, 2-4 Units, or Manufactured.
    - Property state is not SD.
    - Borrower citizenship is US Citizen, Permanent Resident, Non-Permanent Resident,
      Foreign National, or ITIN.
    - If delayed financing, loan amount is no more than $1.5MM.
    - For loans ≤ $1,500,000 at FICO 720+, CLTV is no more than 85% for purchase or
      80% for rate & term or cash-out.
    - The product is 30 Yr Fixed; 5/1 and 7/1 ARM; or Interest Only 5 Yr / 30 and
      10 Yr / 40.
    - The prepayment option is a 5-, 4-, 3-, 2-, 1-year structure or No Prepay, and
      applicable state restrictions are met.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The case meets the checks that can be established, but a required
