rules:
- rule_id: acra-standard.borrower_citizenship_and_foreign_national_requirements.review_foreign_national_program_eligibility_and_restrictions
  condition:
    kind: procedure
    purpose: Establish whether a Foreign National or qualifying ITIN borrower meets
      the foreign-national program requirements stated in the section.
    steps:
    - Determine whether the Foreign National or ITIN borrower meets the stated residence
      and authorization requirements.
    - Verify that the transaction is business purpose and concerns an investment property.
    - Apply the stated Foreign National CLTV limit for the transaction type and the
      stated FICO pricing requirement.
    - Check the escrow-waiver restriction and resolve the stated Credit Requirements
      restriction question.
    - Review the required post-close financial position and ability to mitigate exchange-rate
      fluctuations.
    - Review the referenced OFAC restrictions and state-specific exclusions.
    checks:
    - A Foreign National is a Non-Resident Alien not authorized to live or work in
      the U.S. and resides outside of the U.S.; an ITIN holder is eligible under this
      program only if the borrower resides outside of the U.S.
    - The transaction is business purpose and is an investment property.
    - For a Foreign National, CLTV is no more than 70% for purchase or 65% for refinance
      — rate & term and cash-out.
    - For a Foreign National, the loan is priced at FICO equal to 700.
    - A Foreign National is not receiving an escrow waiver.
    - Acra has confirmed the scope of the Credit Requirements panel’s statement “Foreign
      National ineligible”.
    - The applicant’s post-close financial position and ability to mitigate exchange
      rate fluctuations have been reviewed with scrutiny.
    - The applicable OFAC restrictions and state-specific exclusions have been reviewed.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The job applies, every applicable foreign-national program check
        holds, and the referenced restrictions have been reviewed.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable requirements are met except that the Acra confirmation
        requested for the scope of “Foreign National ineligible” remains outstanding.
    - status: FAIL
      verdict: violated
      criterion: An applicable foreign-national program check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is neither a Foreign National nor an ITIN holder.
    evidence_types: []
    reads:
    - citizenship_type
    - loan_purpose
    - occupancy_subtype
    - cltv_pct
    - escrow_waiver_requested
    - property_state
    - fico
    computable_checks:
    - 1
    - 2
    - 4
    missing_reads:
    - Whether the borrower resides outside the U.S.
    - Whether a Foreign National is authorized to live or work in the U.S.
    - Whether the transaction is business purpose and the property is an investment
      property, if not established by the case fields
    - Loan pricing basis showing pricing at FICO equal to 700
    - Acra confirmation of the scope of “Foreign National ineligible” under Credit
      Requirements
    - Post-close financial position
    - Applicant’s ability to mitigate exchange-rate fluctuations
    - OFAC restrictions referred to in §3.10
    - State-specific exclusions referred to in §3.10
  action: require_evidence
  priority: 100
  description: Apply the foreign-national program’s eligibility rules, limits, and
    restrictions.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.2 Foreign nationals — restrictions
    stated in other panels
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#Section 3.10
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.1 Eligibility
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'STD-4.7 Foreign National ineligible for the escrow waiver (STD-7.12).
        \[S: Escrow Waiver\]


        STD-4.8 The Credit Requirements panel also states “Foreign National ineligible”
        under Restrictions, without stating its scope: Acra confirmation requested
        → Q-04. \[S: Credit Requirements\]


        Section 3.10 of the Seller''s Guide, reproduced in the excerpt, governs foreign
        nationals on business-purpose transactions. Its OFAC restrictions and state-specific
        exclusions are referred to but not reproduced.


        STD-5.1 Foreign Nationals are eligible for financing on business purpose transactions
        only (i.e. investment properties). \[G §3.10, p. 6\]


        STD-5.2 Eligible under the Foreign National Program are Non-Resident Aliens
        who are not authorized to live or work in the U.S. “A true Foreign National
        may periodically visit the U.S. for various reasons including vacation and
        / or business, may purchase property for limited personal use or investment,
        or may own a U.S based business entity, but they must reside outside of the
        U.S.” \[G §3.10, p. 6\]


        STD-5.3 Borrowers who are holders of Individual Tax Identification Numbers
        (ITIN) are eligible for this program if they reside outside of the U.S. \[G
        §3.10, p. 6\]


        STD-5.4 “Due to market exchange rates, applicants are to be reviewed with
        scrutiny toward a post-close financial position and their ability to mitigate
        exchange rate fluctuations.” \[G §3.10, p. 6\]


        STD-5.5 “See 3.10 for OFAC restrictions and state specific exclusions” — not
        reproduced (Appendix B). \[G §3.10, p. 7\]'
  approval_refs: []
- rule_id: acra-standard.borrower_citizenship_and_foreign_national_requirements.verify_citizenship_type_and_citizenship_specific_requirements
  condition:
    kind: procedure
    purpose: Establish whether the borrower has an eligible citizenship type and meets
      the requirements stated for that type.
    steps:
    - Check that the borrower’s citizenship type is one of the eligible types.
    - For a Permanent Resident, verify the required identification and Social Security
      documentation.
    - For a Non-Permanent Resident, verify proof of legal residency and resolve the
      stated limit interpretation.
    - For an ITIN borrower, check the stated loan amount, FICO, and CLTV limits, and
      resolve the stated eligibility and tier questions.
    - For an ITIN borrower, verify that scores and tradelines are reported under the
      correct ITIN or SSN.
    checks:
    - 'citizenship_type is one of: US Citizen, Permanent Resident, Non-Permanent Resident,
      Foreign National, ITIN.'
    - If citizenship_type is Permanent Resident, the borrower has an unexpired PRA
      ID and SSA card / SSA-89.
    - If citizenship_type is Non-Permanent Resident, the borrower has proof of legal
      residency, which may include an unexpired employment authorization document
      (EAD) or valid visa.
    - 'If citizenship_type is Non-Permanent Resident, Acra has confirmed how to apply
      the printed limit “Max Loan Amount: $1.5M: Max CLTV 80%”.'
    - If citizenship_type is ITIN, loan_amount is no more than $1.0M.
    - If citizenship_type is ITIN, FICO is at least 640.
    - 'If citizenship_type is ITIN, CLTV meets the printed tier for the applicable
      FICO and transaction: “FICO 700” is 70% purchase and 65% refinance — R/T and
      cash-out; “FICO 660 to 699” is 65% purchase and 60% refinance — R/T and cash-out;
      “FICO 640 to 659” is 60% purchase and 60% refinance — R/T and cash-out.'
    - If citizenship_type is ITIN, Acra has confirmed whether a US-resident ITIN holder
      is eligible and whether the tier printed “FICO 700” means 700 and above.
    - If citizenship_type is ITIN, scores and tradelines are reported under the correct
      ITIN or SSN to meet requirements.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The citizenship type is eligible and every applicable citizenship-specific
        check holds, including resolution of the stated Acra confirmation questions.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable requirements are met except that an Acra confirmation
        requested in this section remains outstanding.
    - status: FAIL
      verdict: violated
      criterion: The citizenship type is not eligible, or an applicable citizenship-specific
        check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: This job does not apply because the case has no borrower citizenship
        type to review.
    evidence_types: []
    reads:
    - citizenship_type
    - loan_amount
    - fico
    - cltv_pct
    - loan_purpose
    computable_checks:
    - 0
    - 4
    - 5
    - 6
    missing_reads:
    - Unexpired PRA ID
    - SSA card or SSA-89
    - Proof of legal residency
    - 'Acra confirmation of how to apply “Max Loan Amount: $1.5M: Max CLTV 80%”'
    - Acra confirmation of whether a US-resident ITIN holder is eligible and whether
      “FICO 700” means 700 and above
    - Documentation showing the scores and tradelines are reported under the correct
      ITIN or SSN
    - Borrower’s residence in or outside the United States, if needed for the ITIN
      eligibility question
  action: require_evidence
  priority: 100
  description: Match the borrower’s citizenship type to the applicable documentation
    and limits.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4. Borrower eligibility
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.1 Citizenship types and
    limits ¶1
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.1 Citizenship types and
    limits ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'Eligible citizenship types and their limits come from the Summary.
        The foreign-national program and borrowing entities come from the Seller''s
        Guide excerpt and are in sections 5 and 6; first-time homebuyers are in 4.3.


        STD-4.1 Eligible borrower citizenship types: US Citizen, Permanent Resident,
        Non-Permanent Resident, Foreign National, ITIN. \[S: Borrower Citizenship\]


        STD-4.2 Permanent Resident must have an unexpired PRA ID and SSA card / SSA-89.
        \[S: Borrower Citizenship\]


        STD-4.3 Non-Permanent Resident must have proof of legal residency, which may
        include an unexpired employment authorization document (EAD) or valid visa.
        Limit printed as “Max Loan Amount: \$1.5M: Max CLTV 80%” — whether this is
        two independent limits or one conditional limit: Acra confirmation requested
        → Q-21. \[S: Borrower Citizenship\]


        STD-4.4 Foreign National: “Borrowers whose Primary Residence is not located
        in the United States of America.” Maximum CLTV 70% (purchase) and 65% (refinance
        — rate & term and cash-out); “Price loan at FICO equal to 700”. No maximum
        loan amount is stated for foreign nationals: Acra confirmation requested →
        Q-21. Program documentation is in section 5. \[S: Borrower Citizenship\]


        STD-4.5 ITIN: “ITIN is defined as any non-resident that is unable to provide
        any of the ‘Non-Permanent Resident Alien’ documents listed above.” Maximum
        loan amount \$1.0M; minimum FICO 640; maximum CLTV by FICO as printed below.
        §3.10 separately admits ITIN holders under the foreign-national program when
        they reside outside the US. Whether a US-resident ITIN holder is eligible,
        and whether the tier printed “FICO 700” means 700 and above: Acra confirmation
        requested → Q-03. \[S: Borrower Citizenship; G §3.10, p. 6\]


        | **ITIN tier as printed** | **Purchase** | **Refinance — R/T and cash-out**
        |

        |--------------------------|--------------|----------------------------------|

        | “FICO 700”               | 70%          | 65%                              |

        | “FICO 660 to 699”        | 65%          | 60%                              |

        | “FICO 640 to 659”        | 60%          | 60%                              |


        STD-4.6 “Scores & tradelines must be reported under the correct ITIN or SSN
        to meet requirements.” \[S: Credit Requirements\]'
  approval_refs: []
- rule_id: acra-standard.borrower_citizenship_and_foreign_national_requirements.verify_foreign_national_closing_documents
  condition:
    kind: procedure
    purpose: Establish that the Foreign National’s required closing documents and
      any applicable signing formalities meet the stated requirements.
    steps:
    - Verify a copy of the required current identity or tax document.
    - Verify the title and closing agent is approved and / or vetted by Acra.
    - If a Power of Attorney is used, verify its acceptability under Acra requirements
      and to the title company.
    - Verify an executed W-8 (BEN) IRS form.
    - If documents are signed outside the U.S., verify the applicable stated notarization
      and title-company acceptance requirements.
    checks:
    - A copy of a current Passport, Visa, or ITIN is provided.
    - The loan closes with a title and closing agent approved and / or vetted by Acra.
    - If a Power of Attorney is used, it conforms to Acra requirements and is acceptable
      to the title company.
    - An executed W-8 (BEN) IRS form is provided.
    - For documents signed outside of the U.S. and notarized by a U.S. embassy or
      consular official, the certificate of acknowledgement includes the embassy or
      consular seal and is acceptable to the title company.
    - For documents signed in a country that is party to the Hague Convention Treaty
      Abolishing the Requirement of Legalization for Foreign Public Documents, the
      certificate of acknowledgment is completed and signed by an authorized notary
      public, authenticated by apostille in English, attached to the executed documents,
      and acceptable to the title company.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable closing-document and signing-formality check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: met, subject to conditions that must be cleared
    - status: FAIL
      verdict: violated
      criterion: An applicable closing-document or signing-formality check does not
        hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The job does not apply because the borrower is not being reviewed
        under the Foreign National program.
    evidence_types: []
    reads:
    - citizenship_type
    computable_checks: []
    missing_reads:
    - Copy of current Passport, Visa, or ITIN
    - Acra approval or vetting of the title and closing agent
    - Power of Attorney, if used
    - Evidence that the Power of Attorney conforms to Acra requirements
    - Title-company acceptance of the Power of Attorney, if used
    - Executed W-8 (BEN) IRS form
    - Whether documents are signed outside of the U.S.
    - Embassy or consular notarization and certificate of acknowledgement, if that
      route is used
    - Whether the signing country is party to the Hague Convention Treaty Abolishing
      the Requirement of Legalization for Foreign Public Documents
    - Authorized-notary certificate of acknowledgment, English apostille, attachment
      to executed documents, and title-company acceptance, if the Hague Convention
      route is used
  action: require_evidence
  priority: 100
  description: Check the required identity, closing-agent, tax, and applicable signing
    documents.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.4 Closing documents
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'STD-5.11 Each of the following must be met: a copy of current Passport,
        Visa, or ITIN; all loans closed with a title and closing agent approved and
        / or vetted by Acra; Power of Attorney acceptable provided it conforms to
        Acra requirements and is acceptable to the title company; executed W-8 (BEN)
        IRS form. \[G §3.10, p. 7\]


        STD-5.12 Documents signed outside of the U.S. may be notarized by a U.S. embassy
        or consular official; the certificate of acknowledgement must include the
        embassy or consular seal and be acceptable to the title company. For documents
        signed in a country that is party to the Hague Convention Treaty Abolishing
        the Requirement of Legalization for Foreign Public Documents, a certificate
        of acknowledgment completed and signed by an authorized notary public plus
        authentication by apostille in English, attached to the executed documents,
        with title company acceptance, is agreeable to Acra. \[G §3.10, p. 7\]'
  approval_refs: []
- rule_id: acra-standard.borrower_citizenship_and_foreign_national_requirements.verify_foreign_national_credit_references
  condition:
    kind: procedure
    purpose: Establish that the Foreign National satisfies one of the permitted credit-reference
      alternatives.
    steps:
    - Determine whether at least one of the four stated credit-reference alternatives
      is documented.
    - If relying on a U.S. credit report, verify its trade-line count and the minimum
      age of one trade line.
    checks:
    - 'At least one of the following is documented: a U.S. credit report with at least
      two (2) trade lines and a minimum age of two (2) years for one trade line; an
      international credit report; an original credit reference letter from an internationally
      known financial institution; or a bank statement documenting a foreign financial
      banking relationship for the past 60 days.'
    - If relying on a U.S. credit report, it has at least two (2) trade lines and
      one trade line has a minimum age of two (2) years.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: At least one permitted credit-reference alternative is documented
        and, if a U.S. credit report is relied on, its stated trade-line requirements
        hold.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: met, subject to conditions that must be cleared
    - status: FAIL
      verdict: violated
      criterion: No permitted credit-reference alternative is documented, or the U.S.
        credit-report requirements do not hold when that alternative is relied on.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The job does not apply because the borrower is not being reviewed
        under the Foreign National program.
    evidence_types: []
    reads:
    - citizenship_type
    computable_checks: []
    missing_reads:
    - U.S. credit report and trade-line ages, if used
    - International credit report, if used
    - Original credit reference letter from an internationally known financial institution,
      if used
    - Bank statement documenting a foreign financial banking relationship for the
      past 60 days, if used
  action: require_evidence
  priority: 100
  description: Confirm that at least one stated foreign-national credit-reference
    option is documented.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.3 Credit references (AML
    / OFAC)
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'STD-5.10 One of the following is required: a U.S. credit report with
        at least two (2) trade lines with minimum age of two (2) years for one trade
        line; or an international credit report; or an original credit reference letter
        from an internationally known financial institution (the letter does not need
        to include details or payment histories of debt obligations located outside
        of the U.S.); or a bank statement documenting a foreign financial banking
        relationship for the past 60 days. \[G §3.10, p. 6\]'
  approval_refs: []
- rule_id: acra-standard.borrower_citizenship_and_foreign_national_requirements.verify_foreign_national_funds_and_account_documentation
  condition:
    kind: procedure
    purpose: Establish that foreign-national funds meet the stated verification, deposit,
      seasoning, and documentation requirements.
    steps:
    - Verify foreign-account assets in U.S. Dollar equivalency using the current exchange
      rate from www.xe.com or the Wall Street Journal conversion table.
    - Verify sufficient funds to close are on deposit with the Escrow / Closing Agent
      at least three (3) business days before closing, counting Saturdays for this
      calculation.
    - Verify the required seasoning and, for funds held in a foreign bank / currency,
      repatriation timing.
    - Review the account statements and, if funds are not seasoned a minimum of sixty
      (60) days, the required letter of explanation and chain of funds.
    - Verify English translations for bank statements in any language other than English.
    checks:
    - Assets held in foreign accounts are verified in U.S. Dollar equivalency at the
      current exchange rate via www.xe.com or the Wall Street Journal conversion table.
    - Sufficient funds to close are on deposit with the Escrow / Closing Agent at
      least three (3) business days prior to any closing date, including Saturdays
      for this calculation.
    - Foreign Nationals document a minimum of 60 days seasoning, regardless of LTV
      / CLTV.
    - Funds held in a foreign bank / currency are repatriated at minimum three (3)
      business days prior to Closing.
    - A copy of the two (2) most recent statements of the account is provided.
    - If funds are not seasoned a minimum of sixty (60) days, a letter of explanation
      is provided along with the information to comprise a sixty (60) day chain of
      funds.
    - Bank statements in any language other than English are translated into English.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable funds and account-documentation check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: met, subject to conditions that must be cleared
    - status: FAIL
      verdict: violated
      criterion: An applicable funds or account-documentation check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The job does not apply because the borrower is not being reviewed
        under the Foreign National program.
    evidence_types: []
    reads:
    - citizenship_type
    - cltv_pct
    computable_checks: []
    missing_reads:
    - Foreign account statements and balances
    - Current exchange rate from www.xe.com or the Wall Street Journal conversion
      table
    - Funds required to close
    - Closing date and deposit date
    - Evidence of funds’ seasoning period
    - Evidence of foreign-bank / currency funds repatriation date
    - Two most recent statements of the account
    - Letter of explanation, if funds are not seasoned a minimum of sixty (60) days
    - Information comprising a sixty (60) day chain of funds, if required
    - English translation of bank statements not in English
  action: require_evidence
  priority: 100
  description: Verify foreign-account funds, seasoning, transfer timing, and required
    statements.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign
    accounts
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'STD-5.6 Assets held / foreign accounts must be verified in U.S. Dollar
        equivalency at the current exchange rate via www.xe.com or the Wall Street
        Journal conversion table. \[G §3.10, p. 6\]


        STD-5.7 Sufficient funds to close must be on deposit with the Escrow / Closing
        Agent at least three (3) business days (including Saturdays for this calculation)
        prior to any closing date. \[G §3.10, p. 6\]


        STD-5.8 A copy of the two (2) most recent statements of that account is required.
        If the funds are not seasoned a minimum of sixty (60) days, a letter of explanation
        is required along with the information to comprise a sixty (60) day chain
        of funds. Bank statements in any language other than English must be translated
        into English. \[G §3.10, p. 6\]


        STD-5.9 Per §8.4, Foreign Nationals, regardless of LTV / CLTV, need to document
        a minimum of 60 days seasoning, and funds held in a foreign bank / currency
        must be repatriated at minimum three (3) business days prior to Closing (STD-9.5).
        \[G §8.4, p. 12\]'
  approval_refs: []
- rule_id: acra-standard.credit_housing_history_and_escrow_waiver.apply_mortgage_history_restrictions
  condition:
    kind: procedure
    purpose: Apply the mortgage history restrictions and their printed CLTV limits.
    steps:
    - Identify the applicable printed mortgage-history label and the loan purpose.
    - 'Apply the printed maximum CLTV for that label and purpose: 1x30x12 — 80% Purchase,
      75% Refi R/T, Refi C/O; 0x60x12 — 75% Purchase, 70% Refi R/T, Refi C/O; 0x90x12
      — 65% for both; 0x120x12 — Ineligible for both.'
    - Confirm the applicable CLTV does not exceed the printed maximum, or that the
      case is not in a category printed as Ineligible.
    checks:
    - The applicable printed mortgage-history label and loan-purpose column permit
      the case's CLTV; 0x120x12 is Ineligible.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable printed limit permits the case's CLTV, using an established
        mortgage-history label and loan-purpose column.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable label, its definition or seasoning measurement, or
        the loan-purpose column is not established.
    - status: FAIL
      verdict: violated
      criterion: The applicable printed limit is exceeded or the applicable label
        is printed as Ineligible.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: the job does not apply to this case
    evidence_types: []
    reads:
    - housing_history
    - loan_purpose
    - cltv_pct
    computable_checks: []
    missing_reads:
    - Applicable printed mortgage-history label
    - Acra definitions of the mortgage-history labels and how seasoning is measured
    - Loan-purpose classification as Purchase, Refi R/T, or Refi C/O
  action: require_evidence
  priority: 100
  description: Match the printed mortgage-history label and loan purpose to the applicable
    maximum CLTV.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#7.3 Housing history and previous
    credit events, as printed
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'STD-7.9 Mortgage history restrictions. The labels are Acra''s; their
        definitions and how seasoning is measured: Acra confirmation requested → Q-05.
        In the three tables below, where the Summary prints a single figure without
        a purpose split (“Max CLTV: 65%”), it is shown in both columns. \[S: Housing
        History & PCEs\]


        | **Printed label** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T, Refi
        C/O** |

        |----|----|----|

        | 1x30x12 | 80% | 75% |

        | 0x60x12 | 75% | 70% |

        | 0x90x12 | 65% | 65% |

        | 0x120x12 | Ineligible | Ineligible |


        STD-7.10 Bankruptcy & foreclosure restrictions. \[S: Housing History & PCEs\]


        | **Seasoning as printed** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T,
        Refi C/O** |

        |----|----|----|

        | ≥ 36 Mo | No Restrictions | No Restrictions |

        | 24-35 Mo | 80% | 75% |

        | 12-23 Mo | 65% | 65% |

        | \< 12 Mo | Ineligible | Ineligible |


        STD-7.11 Short sale, deed-in-lieu & modification restrictions; and, printed
        beneath them, “FB Taken ≤6 Mos: Case-by-case” (meaning and timing → Q-05).
        \[S: Housing History & PCEs\]


        | **Seasoning as printed** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T,
        Refi C/O** |

        |----|----|----|

        | ≥ 24 Mo | No Restrictions | No Restrictions |

        | 12-23 Mo | 80% | 75% |

        | \< 12 Mo | 75% | 70% |'
  approval_refs: []
- rule_id: acra-standard.credit_housing_history_and_escrow_waiver.identify_separate_impound_requirements
  condition:
    kind: procedure
    purpose: Check the impound requirements stated separately for first-time homebuyers,
      vacant-property refinances, and properties listed for sale, without resolving
      their interaction with an otherwise eligible escrow waiver.
    steps:
    - Check whether the borrower is a first-time homebuyer; impounds are separately
      required for first-time homebuyers.
    - For a refinance of a vacant property, check that impounds are required.
    - For a property listed for sale, check that impounds are required.
    - If an otherwise eligible escrow waiver is requested in any applicable circumstance,
      obtain Acra confirmation on how the separate impound requirement interacts with
      the waiver.
    checks:
