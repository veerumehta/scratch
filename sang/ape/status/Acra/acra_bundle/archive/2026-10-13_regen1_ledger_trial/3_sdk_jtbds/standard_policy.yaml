- rule_id: acra-standard.credit_housing_history_and_escrow_waiver.review_mortgage_and_rental_rating_history
  condition:
    kind: procedure
    purpose: Determine whether the history needed to evaluate mortgage pricing and
      DSCR payment history has been documented for the properties specified by the
      guidelines.
    steps:
    - Evaluate the ratings for properties the borrower owns and / or rents over the
      last twelve (12) months.
    - Consider all reported mortgages on credit.
    - Where the applicant has mortgages that are not reported, check that the file
      contains documentation to evaluate history on the applicant's primary residence(s),
      any secondary residence(s), and the subject property.
    - For DSCR loans, check documentation on the subject property, principal residence,
      and second home (if any) of the borrower and / or guarantor(s).
    - For DSCR loans, do not require housing history documentation for additional
      properties unless documents in the file suggest a major credit event has occurred.
    - For DSCR loans, check payment history for the primary residence, subject property,
      and second homes, if applicable.
    - For loans that have matured, rate the loan based on the maturity date; check
      that any extensions of the maturity date are in writing.
    checks:
    - Ratings for properties the borrower owns and / or rents over the last twelve
      (12) months are evaluated.
    - All reported mortgages on credit are considered.
    - Where mortgages are not reported, the file contains documentation to evaluate
      history on the applicant's primary residence(s), any secondary residence(s),
      and the subject property.
    - For a DSCR loan, documentation covers the subject property, principal residence,
      and second home (if any) of the borrower and / or guarantor(s).
    - For a DSCR loan, additional properties are not required to have housing history
      documented unless documents in the file suggest a major credit event has occurred.
    - For a DSCR loan, payment history is available for the primary residence, subject
      property, and second homes, if applicable.
    - For a loan that has matured, the rating is based on the maturity date and any
      extension of the maturity date is in writing.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable documentation and rating check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Required history, payment-history, maturity, or extension information
        is not available for review.
    - status: FAIL
      verdict: violated
      criterion: An applicable documentation or rating requirement is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: the job does not apply to this case
    evidence_types: []
    reads:
    - housing_history
    - loan_purpose
    - dscr_documentation_type
    computable_checks: []
    missing_reads:
    - Mortgage and rental ratings for properties owned and / or rented over the last
      twelve (12) months
    - Reported mortgage list
    - Documentation of history for any unreported mortgages on primary residence(s),
      secondary residence(s), and subject property
    - Whether the loan is a DSCR loan
    - Documentation of DSCR housing and payment history for the subject property,
      principal residence, and second home (if any)
    - File documents indicating whether a major credit event has occurred on an additional
      property
    - Loan maturity date and written maturity-date extensions, if any
