- rule_id: acra-standard.program_scope_occupancy_and_transaction_setup.check_published_program_scope.python
  condition:
    kind: python
    source: "def check(ctx):\n    loan_amount = ctx['loan_amount']\n    fico = ctx['fico']\n\
      \    property_type = ctx['property_type']\n    property_state = ctx['property_state']\n\
      \    citizenship_type = ctx['citizenship_type']\n    delayed_financing = ctx['delayed_financing']\n\
      \n    missing = rules_lib.gaps(\n        loan_amount=loan_amount,\n        fico=fico,\n\
      \        property_type=property_type,\n        property_state=property_state,\n\
      \        citizenship_type=citizenship_type,\n        delayed_financing=delayed_financing,\n\
      \    )\n    if missing:\n        return rules_lib.unknown(*missing)\n\n    delayed\
      \ = rules_lib.flag(delayed_financing)\n    if delayed is None:\n        return\
      \ rules_lib.unknown('delayed_financing')\n\n    meets = (\n        100000 <=\
      \ loan_amount <= 3000000\n        and (loan_amount - 100000) % 50 == 0\n   \
      \     and not rules_lib.same(property_state, 'SD')\n        and any(rules_lib.same(property_type,\
      \ option) for option in (\n            'SFR', 'Townhome', 'PUD', 'Warrantable\
      \ Condo',\n            'Non-Warrantable Condo', 'Condotel / PUDtel', '2-4 Units',\n\
      \            'Manufactured',\n        ))\n        and any(rules_lib.same(citizenship_type,\
      \ option) for option in (\n            'US Citizen', 'Permanent Resident', 'Non-Permanent\
      \ Resident',\n            'Foreign National', 'ITIN',\n        ))\n        and\
      \ (not delayed or loan_amount <= 1500000)\n    )\n\n    if loan_amount <= 1500000:\n\
      \        meets = meets and fico >= 600\n    elif loan_amount <= 2000000:\n \
      \       meets = meets and fico >= 620\n    elif loan_amount <= 3000000:\n  \
      \      meets = meets and fico >= 700\n\n    if loan_amount <= 1500000 and fico\
      \ >= 720:\n        loan_purpose = ctx['loan_purpose']\n        cltv_pct = ctx['cltv_pct']\n\
      \        missing = rules_lib.gaps(loan_purpose=loan_purpose, cltv_pct=cltv_pct)\n\
      \        if missing:\n            return rules_lib.unknown(*missing)\n\n   \
      \     if rules_lib.same(loan_purpose, 'purchase'):\n            cltv_limit =\
      \ 85\n        elif rules_lib.same(loan_purpose, 'rate & term') or rules_lib.same(loan_purpose,\
      \ 'cash-out'):\n            cltv_limit = 80\n        else:\n            return\
      \ rules_lib.unknown('loan_purpose')\n        meets = meets and cltv_pct <= cltv_limit\n\
      \n    return bool(meets)"
    entrypoint: check
