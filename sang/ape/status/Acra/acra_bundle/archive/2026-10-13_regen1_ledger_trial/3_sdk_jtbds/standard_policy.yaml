- rule_id: acra-standard.prepayment_penalty_structures_and_state_restrictions.screen_state_prepayment_restrictions
  condition:
    kind: procedure
    purpose: Identify whether a printed state restriction applies and route restrictions
      requiring Acra confirmation for review.
    steps:
    - If no prepayment penalty is requested, treat this job as not applicable.
    - Compare the case fields with each state restriction printed in STD-11.3.
    - For an applicable BUY-OUT restriction, request Acra confirmation as indicated
      by Q-24; do not infer what “BUY-OUT” requires.
    - For Mississippi, establish whether the residential 1-unit restriction applies
      and obtain the selected structure to assess the printed “BUY-OUT or 5 year (STEP)”
      wording. Do not apply that restriction to 2+ units.
    checks:
    - 'Alaska restriction applies: the property is in Alaska and is Residential 1-4.'
    - 'Illinois clause 1 applies: the property is in Illinois, is Residential 1-4,
      the loan is to an ENTITY OR INDIVIDUAL, and the loan amount is ≤$250,000.'
    - 'Illinois clause 2 applies: the property is in Illinois, is Residential 1-4,
      the loan is to an INDIVIDUAL, the loan amount is >$250,000, and the interest
      rate is >8%.'
    - 'Kansas restriction applies: the property is in Kansas and is Residential 1-4.'
    - 'Maryland restriction applies: the property is in Maryland.'
    - 'Michigan restriction applies: the property is in Michigan and is Residential
      1-4.'
    - 'Minnesota restriction applies: the property is in Minnesota and is Residential
      1-4.'
    - 'Mississippi restriction applies: the property is in Mississippi and is Residential
      1 unit.'
    - 'New Jersey restriction applies: the property is in New Jersey and the loan
      is closing in the name of an INDIVIDUAL.'
    - 'New Mexico restriction applies: the property is in New Mexico and is Residential
      1-4.'
    - 'Ohio restriction applies: the property is in Ohio and is Residential 1-2.'
    - 'Pennsylvania restriction applies: the property is in Pennsylvania, is Residential
      1-2, the loan is to an INDIVIDUAL, and the loan amount is <$319,777.'
    - 'Rhode Island restriction applies: the property is in Rhode Island and the transaction
      is a PURCHASE.'
    - 'Virginia restriction applies: the property is in Virginia, is Residential 1-4,
      and is closed in the name of an individual.'
    - 'Vermont restriction applies: the property is in Vermont and the loan amount
      is < $1 Million.'
    - For any applicable BUY-OUT restriction, Acra confirmation has been requested
      as indicated by Q-24.
    - For an applicable Mississippi restriction, the selected structure has been reviewed
      against the printed “BUY-OUT or 5 year (STEP)” wording.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: No printed state restriction applies, or each applicable restriction
        has been resolved with the confirmation or structure review required by the
        printed wording.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A printed BUY-OUT restriction applies and Acra confirmation requested
        by Q-24 is outstanding, or an applicable Mississippi restriction has not been
        resolved against the selected structure.
    - status: FAIL
      verdict: violated
      criterion: The selected structure does not satisfy an applicable state restriction
        as confirmed by Acra.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: No prepayment penalty is requested.
