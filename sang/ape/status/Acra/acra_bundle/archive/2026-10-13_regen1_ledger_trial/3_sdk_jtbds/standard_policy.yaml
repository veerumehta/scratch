- rule_id: acra-standard.property_eligibility_and_property_specific_overlays.review_mixed_use_property
  condition:
    kind: procedure
    purpose: Determine whether a mixed-use property meets the stated minimum DSCR
      and whether the conditions referenced in §10.7 have been reviewed.
    steps:
    - Determine whether the property is mixed use, meaning a portion of its space
      is dedicated to commercial use and the rest to residential use.
    - For a mixed-use property, verify a minimum DSCR ratio of 1.2.
    - Review the conditions in §10.7, including the restrictions regarding Adult Care
      / Assisted Living Facilities; the section is not reproduced in the source excerpt.
    checks:
    - A mixed-use property has a minimum DSCR ratio of 1.2.
    - The applicable conditions and restrictions in §10.7 have been reviewed.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not mixed use, or the minimum DSCR ratio of 1.2 is
        met and the applicable §10.7 conditions have been reviewed.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: DSCR or the applicable §10.7 conditions remain to be verified.
    - status: FAIL
      verdict: violated
      criterion: A mixed-use property does not meet minimum DSCR ratio of 1.2, or
        a reviewed applicable §10.7 condition is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not mixed use.
    evidence_types: []
    reads:
    - mixed_use
    computable_checks: []
    missing_reads:
    - DSCR calculation or documentation
    - The complete §10.7 conditions and restrictions, including those regarding Adult
      Care / Assisted Living Facilities
    - Property-use information establishing the commercial and residential portions
