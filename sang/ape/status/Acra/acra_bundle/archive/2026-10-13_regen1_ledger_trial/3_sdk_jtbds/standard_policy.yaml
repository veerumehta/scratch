- rule_id: acra-standard.entity_borrowers_guarantors_and_trusts.entity_documentation
  condition:
    kind: procedure
    purpose: Determine whether the entity borrower has provided the entity documentation
      required without exception and whether applicable conditional documents or additional
      information are required.
    steps:
    - Confirm that the complete, legible Certificate of Formation / Articles of Organization
      and all amendments are provided.
    - For LLCs and Partnerships, confirm the complete Operating Agreement with all
      referenced exhibits and all amendments is provided; for corporations, confirm
      the complete Bylaws with all referenced exhibits and all amendments are provided.
    - Confirm the Operating Agreement or Bylaws states whether the entity is member
      or manager managed, contains authorization to borrow money and enter into contracts
      for mortgage assets, and designates signers.
    - If the formation documents and the Operating Agreement or Bylaws conflict, determine
      whether additional information is required.
    - Confirm documentation evidencing all ownership interests is provided in the
      form specified for the entity type.
    - For S or C Corporations, confirm the applicable shareholder / stockholder certificates
      or stock ledger and any required Affidavit of Lost Stock Certificate are provided
      and account for all outstanding shares noted in the Certificate of Formation
      / Articles of Organization, including those held by the corporation.
    - For S-corporations or Partnerships where both stock certificate and stock ledger
      are unavailable, confirm the specified K-1 statements and CPA or Tax Preparer
      letter are provided.
    - Confirm names on the entity documents match the identification, or, if they
      do not match exactly, a letter of explanation addresses the discrepancy.
    - Confirm a Certificate of Good Standing or equivalent document is valid within
      ninety (90) days of the closing date.
    - If the entity is formed in a state other than where business is performed or
      where the property is located, confirm a Certificate of Foreign Qualification
      or other qualification to operate in the state where business is being conducted
      is provided.
    - Confirm the entity's IRS Form SS4 or Federal Taxpayer Identification Number
      (TIN) or Employer Identification Number (EIN) issuance letter is provided; if
      an EIN exception is requested, confirm it is submitted for review by Acra's
      Legal Department with a letter of explanation stating the applicable grounds.
    - Confirm a Unanimous Written Consent / Board Resolution signed by all members
      regardless of their percentage of interest authorizes the transaction with Acra
      Lending and identifies who is authorized to sign the loan documents on behalf
      of and to bind the entity.
    - Confirm a Unanimous Written Consent / Board Resolution is not used to designate
      a signor on a personal guarantee.
    - If a principal uses an attorney in fact to execute a personal guarantee, confirm
      a Power of Attorney is utilized by the principal to designate that attorney
      in fact.
    - Do not accept borrower letters stating required documents are not required,
      available, or excused from providing them; note that Legal reserves the right
      to condition for additional supporting documentation as determined in its sole
      discretion.
    checks:
    - A complete, legible copy of the Certificate of Formation / Articles of Organization
      and all amendments thereto is provided.
    - The applicable Operating Agreement for LLCs and Partnerships, or Bylaws for
      corporations, is complete with all referenced exhibits, legible, and includes
      all amendments.
    - The Operating Agreement or Bylaws states whether the entity is member or manager
      managed, contains authorization to borrow money and enter into contracts for
      mortgage assets, and designates signers.
    - Any additional information required because the formation documents and the
      Operating Agreement or Bylaws conflict is provided.
    - All documentation evidencing ownership interests is provided.
    - For LLCs and Partnerships, the Operating Agreement identifies, or attaches as
      an exhibit, all persons by name with their ownership interest, or copies of
      the membership interest certificates / units in compliance with the Operating
      Agreement are provided.
    - For S or C Corporations, shareholder / stockholder certificates that comply
      with the Bylaws, if any, or, if stock certificates are lost or unavailable,
      the corporation's stock ledger is provided.
    - For S or C Corporations, the certificate or ledger accounts for all outstanding
      shares noted in the Certificate of Formation / Articles of Organization, including
      those held by the corporation.
    - If stock certificates are lost, destroyed, mutilated, or otherwise unavailable,
      an Affidavit of Lost Stock Certificate is provided.
    - For S-corporations or Partnerships where both stock certificate and stock ledger
      are unavailable, the most recent preceding tax year's K-1 statement for all
      members with 20% or more interest is provided.
    - For S-corporations or Partnerships where both stock certificate and stock ledger
      are unavailable, a letter from the CPA or Tax Preparer affirming current ownership
      interest is provided, with a statement to that effect if the preceding year's
      taxes have not been filed.
    - Names on the entity documents match the identification, or a letter of explanation
      addresses any failure to match exactly.
    - A Certificate of Good Standing or equivalent document is valid within ninety
      (90) days of the closing date.
    - If the entity is formed in a state other than where business is performed or
      where the property is located, a Certificate of Foreign Qualification or other
      qualification to operate in the state where business is being conducted is provided.
    - The entity's IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or
      Employer Identification Number (EIN) issuance letter is provided, or an EIN
      exception request is submitted for review by Acra's Legal Department with a
      letter of explanation stating the applicable grounds.
    - A Unanimous Written Consent / Board Resolution signed by all members regardless
      of their percentage of interest authorizes the transaction with Acra Lending.
    - The Unanimous Written Consent / Board Resolution identifies who is authorized
      to sign the loan documents on behalf of and to bind the entity.
    - The Unanimous Written Consent / Board Resolution is not used to designate a
      signor on a personal guarantee.
    - If a principal uses an attorney in fact to execute a personal guarantee, a Power
      of Attorney is utilized by the principal to designate the attorney in fact.
    - Borrower letters stating that required documents are not required, available,
      or excused from providing them are not accepted.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The job applies, every step is met, and every check holds, including
        applicable conditional requirements.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The job applies and the requirements are met subject to conditions
        that must be cleared, including additional information or supporting documentation
        required or conditioned by Acra or Legal.
    - status: FAIL
      verdict: violated
      criterion: The job applies and a step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
    evidence_types: []
    reads:
