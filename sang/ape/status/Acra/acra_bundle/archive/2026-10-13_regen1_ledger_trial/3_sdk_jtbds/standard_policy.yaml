- rule_id: acra-standard.cross_cutting_published_caps_and_score_thresholds.apply_published_minimum_fico_thresholds
  condition:
    kind: procedure
    purpose: Check the minimum FICO thresholds collected in this section, distinguishing
      the Foreign National pricing statement from a stated minimum.
    steps:
    - Identify which features in the published minimum-FICO table apply to the case,
      using the stated feature conditions and loan-amount bands.
    - For each applicable feature with a stated minimum, compare the case FICO with
      that minimum.
    - Treat Foreign National as “Priced at FICO 700; no minimum stated”; do not treat
      that entry as a stated minimum FICO threshold.
    checks:
    - For every applicable feature with a stated minimum FICO, the case FICO is at
      least that minimum.
