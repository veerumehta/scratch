- rule_id: acra-standard.loan_amount_fico_and_matrix_leverage.loan_amount_conditions_and_matrix_footnotes
  condition:
    kind: procedure
    purpose: Determine whether the case meets the additional loan-amount conditions
      and whether the stated matrix cash-in-hand footnote applies.
    steps:
    - If loan_amount is less than $200,000, apply the maximum CLTV of 80% for Purchase
      or 75% for refinance (Rate & Term and Cash-Out).
    - If loan_amount is greater than $2,000,000, verify that DSCR is 1.0 or greater.
    - If the loan is interest-only, verify the minimum loan amount of $250,000, maximum
      loan amount of $3,000,000, and minimum FICO of 640.
    - If delayed financing applies, apply the stated $1.5MM cap.
    - 'For Cash-Out, where LTV is greater than 65%, apply footnote 1: maximum cash-in-hand
      is $1,000,000 for loans ≥ $1,500,000 and $500,000 for loans < $1,500,000.'
    - 'Note footnote 2 as printed: “When LTV ≤ 65%, unlimited cash-in-hand allowed”.
      The source requests Acra confirmation on whether footnote 2 applies to every
      tier or only the tier bearing its marker, and why the footnotes use LTV while
      the matrix is labelled CLTV.'
    checks:
    - If loan_amount is less than $200,000 and loan_purpose is Purchase, cltv_pct
      is no more than 80%.
    - If loan_amount is less than $200,000 and loan_purpose is Rate & Term or Cash-Out,
      cltv_pct is no more than 75%.
    - If loan_amount is greater than $2,000,000, DSCR is at least 1.0.
    - If the loan is interest-only, loan_amount is at least $250,000.
    - If the loan is interest-only, loan_amount is no more than $3,000,000.
    - If the loan is interest-only, fico is at least 640.
    - If delayed financing applies, loan_amount is no more than $1.5MM.
    - If the loan is Cash-Out and LTV is greater than 65%, cash-in-hand is no more
      than the applicable footnote 1 cap.
    - The applicable treatment of footnote 2 and the LTV-versus-CLTV footnotes is
      confirmed where needed.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable condition is met and every applicable check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Applicable conditions that can be evaluated are met, subject to required
        data or Acra confirmations that must be cleared.
    - status: FAIL
      verdict: violated
      criterion: An applicable step is not met or an applicable check does not hold.
    - status: NOT_APPLICABLE
