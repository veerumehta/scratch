- rule_id: acra-standard.property_eligibility_and_property_specific_overlays.determine_rent_loss_insurance_requirement
  condition:
    kind: procedure
    purpose: Determine whether six (6) months' rent loss insurance is required and
      whether the stated reserve substitution applies.
    steps:
    - Determine whether the property is a one- to four-unit non-owner occupied income
      property.
    - Determine whether LTV is > 70% and subject property rents are used to qualify,
      including No Ratio DSCR.
    - If the stated conditions apply, require six (6) months' rent loss insurance.
    - 'Apply the printed exemption: loans with ≤ 70% CLTV are not required to carry
      rent loss insurance. Obtain Acra confirmation for the case of LTV at or below
      70% with CLTV above 70%.'
    - If rent loss insurance is required but cannot be obtained, allow the borrower
      to substitute two (2) months reserves for every one (1) month of rent loss coverage
      not provided.
    checks:
    - The property is a one- to four-unit non-owner occupied income property when
      the insurance trigger is applied.
    - Where LTV is > 70% and subject property rents are used to qualify, six (6) months'
      rent loss insurance is provided.
    - Loans with ≤ 70% CLTV are not required to carry rent loss insurance.
    - For LTV at or below 70% with CLTV above 70%, Acra has confirmed the treatment.
    - When required rent loss insurance cannot be obtained, the borrower provides
      two (2) months reserves for every one (1) month of rent loss coverage not provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The insurance trigger and exemption have been applied, any required
        six (6) months' coverage or permitted reserve substitution is provided, and
        any stated Acra confirmation has been obtained.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: LTV, rent use, insurance availability, reserve substitution, or required
        Acra confirmation remains to be verified.
    - status: FAIL
      verdict: violated
      criterion: Rent loss insurance required by the stated rule is neither provided
        nor replaced by the permitted reserve substitution.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not a one- to four-unit non-owner occupied income
        property, or the stated insurance trigger does not apply and the CLTV exemption
        applies.
    evidence_types: []
    reads:
    - residential_unit_count
    - occupancy_subtype
    - cltv_pct
    - dscr_documentation_type
    - gross_rental_income
    computable_checks:
    - 0
    - 2
    missing_reads:
    - LTV
    - Whether the property is an income property and non-owner occupied
    - Whether subject property rents are used to qualify, including No Ratio DSCR
    - Rent loss insurance coverage and whether it can be obtained
    - Acra confirmation for LTV at or below 70% with CLTV above 70%
    - Reserves available for any substitution
