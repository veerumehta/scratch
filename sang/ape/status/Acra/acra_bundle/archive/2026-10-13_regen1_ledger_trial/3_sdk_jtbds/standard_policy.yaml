- rule_id: acra-standard.borrower_citizenship_and_foreign_national_requirements.review_foreign_national_program_eligibility_and_restrictions.python
  condition:
    kind: python
    source: "import rules_lib\n\ndef check(ctx):\n    citizenship_type = ctx['citizenship_type']\n\
      \    occupancy_subtype = ctx['occupancy_subtype']\n    is_foreign_national =\
      \ rules_lib.same(citizenship_type, 'Foreign National')\n\n    if is_foreign_national:\n\
      \        loan_purpose = ctx['loan_purpose']\n        cltv_pct = ctx['cltv_pct']\n\
      \        escrow_waiver_requested = ctx['escrow_waiver_requested']\n        missing\
      \ = rules_lib.gaps(\n            citizenship_type=citizenship_type,\n      \
      \      occupancy_subtype=occupancy_subtype,\n            loan_purpose=loan_purpose,\n\
      \            cltv_pct=cltv_pct,\n            escrow_waiver_requested=escrow_waiver_requested,\n\
      \        )\n    else:\n        missing = rules_lib.gaps(\n            citizenship_type=citizenship_type,\n\
      \            occupancy_subtype=occupancy_subtype,\n        )\n\n    if missing:\n\
      \        return rules_lib.unknown(*missing)\n\n    if not rules_lib.same(occupancy_subtype,\
      \ 'investment', 'investment property'):\n        return False\n\n    if not\
      \ is_foreign_national:\n        return True\n\n    is_purchase = rules_lib.same(loan_purpose,\
      \ 'purchase')\n    is_refinance = rules_lib.same(\n        loan_purpose,\n \
      \       'refinance',\n        'rate & term',\n        'rate & term refinance',\n\
      \        'cash-out',\n        'cash-out refinance',\n    )\n    if not is_purchase\
      \ and not is_refinance:\n        return rules_lib.unknown('loan_purpose')\n\n\
      \    cltv_limit = 70 if is_purchase else 65\n    within_cltv_limit = rules_lib.band(cltv_pct,\
      \ [(cltv_limit, True)], above=False)\n    if within_cltv_limit is None:\n  \
      \      return rules_lib.unknown('cltv_pct')\n\n    escrow_waiver = rules_lib.flag(escrow_waiver_requested)\n\
      \    if escrow_waiver is None:\n        return rules_lib.unknown('escrow_waiver_requested')\n\
      \n    return within_cltv_limit and not escrow_waiver"
    entrypoint: check
    reads:
    - citizenship_type
    - occupancy_subtype
    - loan_purpose
    - cltv_pct
    - escrow_waiver_requested
    derived_from: acra-standard.borrower_citizenship_and_foreign_national_requirements.review_foreign_national_program_eligibility_and_restrictions
    cases:
    - context:
        citizenship_type: Foreign National
        occupancy_subtype: Investment Property
        loan_purpose: Purchase
        cltv_pct: 70
        escrow_waiver_requested: false
      expected: satisfied
    - context:
        citizenship_type: Foreign National
        occupancy_subtype: Investment Property
        loan_purpose: Purchase
        cltv_pct: 70.01
        escrow_waiver_requested: false
      expected: violated
    - context:
        citizenship_type: Foreign National
        occupancy_subtype: Investment Property
        loan_purpose: Rate & Term Refinance
        cltv_pct: 65
        escrow_waiver_requested: false
      expected: satisfied
    - context:
        citizenship_type: Foreign National
        occupancy_subtype: Investment Property
        loan_purpose: Cash-Out Refinance
        cltv_pct: 65.01
        escrow_waiver_requested: false
      expected: violated
    - context:
        citizenship_type: Foreign National
        occupancy_subtype: Investment Property
        loan_purpose: Purchase
        cltv_pct: 70
        escrow_waiver_requested: true
      expected: violated
    - context:
        citizenship_type: ITIN
        occupancy_subtype: Investment Property
      expected: satisfied
    - context:
        citizenship_type: Foreign National
        occupancy_subtype: Primary Residence
        loan_purpose: Purchase
        cltv_pct: 70
        escrow_waiver_requested: false
      expected: violated
    lib_version: 1.1.0
