- rule_id: acra-standard.borrower_citizenship_and_foreign_national_requirements.verify_citizenship_type_and_citizenship_specific_requirements.python
  condition:
    kind: python
    source: "import rules_lib\n\ndef check(ctx):\n    citizenship_type = ctx['citizenship_type']\n\
      \    citizenship = rules_lib.match(citizenship_type, [\n        'US Citizen',\
      \ 'Permanent Resident', 'Non-Permanent Resident',\n        'Foreign National',\
      \ 'ITIN'\n    ])\n    missing = rules_lib.gaps(citizenship_type=citizenship_type)\n\
      \    if missing:\n        return rules_lib.unknown(*missing)\n    if citizenship\
      \ is None:\n        return False\n    if not rules_lib.same(citizenship, 'ITIN'):\n\
      \        return True\n\n    loan_amount = ctx['loan_amount']\n    fico = ctx['fico']\n\
      \    cltv_pct = ctx['cltv_pct']\n    loan_purpose = ctx['loan_purpose']\n  \
      \  missing = rules_lib.gaps(\n        loan_amount=loan_amount, fico=fico,\n\
      \        cltv_pct=cltv_pct, loan_purpose=loan_purpose\n    )\n    if missing:\n\
      \        return rules_lib.unknown(*missing)\n\n    if loan_amount > 1000000\
      \ or fico < 640:\n        return False\n\n    if rules_lib.same(loan_purpose,\
      \ 'purchase'):\n        is_purchase = True\n    elif rules_lib.same(loan_purpose,\
      \ 'refinance') or rules_lib.same(\n        loan_purpose, 'rate and term'\n \
      \   ) or rules_lib.same(loan_purpose, 'cash-out'):\n        is_purchase = False\n\
      \    else:\n        return rules_lib.unknown('loan_purpose')\n\n    # Apply\
      \ only the FICO tiers stated in the table; do not extend the\n    # printed\
      \ “FICO 700” tier to scores above 700.\n    if 640 <= fico <= 659:\n       \
      \ max_cltv = 60\n    elif 660 <= fico <= 699:\n        max_cltv = 65 if is_purchase\
      \ else 60\n    elif fico == 700:\n        max_cltv = 70 if is_purchase else\
      \ 65\n    else:\n        max_cltv = None\n\n    return max_cltv is None or cltv_pct\
      \ <= max_cltv"
    entrypoint: check
