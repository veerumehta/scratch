- rule_id: acra-standard.property_eligibility_and_property_specific_overlays.confirm_dscr_rent_documentation
  condition:
    kind: procedure
    purpose: Determine whether a DSCR transaction has the required Form 1007 documentation,
      including a No Ratio DSCR transaction.
