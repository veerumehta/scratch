    source: "import rules_lib\n\ndef check(ctx):\n    rural_property = ctx['rural_property']\n\
      \    rural_property = rules_lib.flag(rural_property)\n    missing = rules_lib.gaps(rural_property=rural_property)\n\
      \    if missing:\n        return rules_lib.unknown(*missing)\n    if rural_property\
      \ is False:\n        return True\n\n    loan_purpose = ctx['loan_purpose']\n\
      \    cltv_pct = ctx['cltv_pct']\n    fico = ctx['fico']\n    missing = rules_lib.gaps(loan_purpose=loan_purpose,\
      \ cltv_pct=cltv_pct, fico=fico)\n    if missing:\n        return rules_lib.unknown(*missing)\n\
      \n    if rules_lib.same(loan_purpose, 'purchase'):\n        max_cltv = 80\n\
      \    elif rules_lib.same(loan_purpose, 'refinance rate & term', 'refinance rate\
      \ and term', 'refi r/t'):\n        max_cltv = 75\n    elif rules_lib.same(loan_purpose,\
      \ 'refinance cash-out', 'refinance cash out', 'refi cash-out'):\n        max_cltv\
      \ = 70\n    else:\n        return rules_lib.unknown('loan_purpose')\n\n    return\
      \ cltv_pct <= max_cltv and fico >= 700"
