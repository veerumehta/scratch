- rule_id: acra-standard.prepayment_penalty_structures_and_state_restrictions.apply_transaction_minimum_terms
  condition:
    kind: procedure
    purpose: Establish whether the minimum terms stated for particular transactions
      are met, subject to the stated “where allowable” and state-interaction qualifications.
    steps:
    - Determine whether the case is a vacant-property rate & term refinance, a vacant-property
      cash-out refinance, or a property listed for sale.
    - For a vacant-property rate & term refinance, verify a term of at least two years,
      “where allowable.”
    - For a vacant-property cash-out refinance, verify a term of at least three years,
      “where allowable.”
    - For a property listed for sale, verify a term of at least three years unless
      the property is located in a state that does not allow prepayment penalties.
    - For a minimum whose interaction with a state restriction needs confirmation,
      request Acra confirmation as indicated by Q-24.
    checks:
    - The case is a vacant-property rate & term refinance.
    - The case is a vacant-property cash-out refinance.
    - The property is listed for sale.
    - If the case is a vacant-property rate & term refinance, the selected term is
      at least two years where allowable.
    - If the case is a vacant-property cash-out refinance, the selected term is at
      least three years where allowable.
    - If the property is listed for sale and is not located in a state that does not
      allow prepayment penalties, the selected term is at least three years.
    - Any applicable state-restriction interaction with a minimum term has the Acra
      confirmation requested by Q-24.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable minimum term is met and any applicable state-restriction
        interaction has the confirmation requested by Q-24.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: An applicable term, “where allowable” determination, state exception,
        or state-interaction confirmation remains unresolved.
    - status: FAIL
      verdict: violated
      criterion: An applicable minimum term is not met.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: None of the specified transaction types applies.
    evidence_types: []
    reads:
    - vacant_property
    - loan_purpose
    - property_currently_listed_for_sale
    - property_state
    computable_checks:
    - 0
    - 1
    - 2
    missing_reads:
    - Selected prepayment penalty term.
    - Whether the selected term is allowable for the vacant-property transaction.
    - Whether the property is located in a state that does not allow prepayment penalties.
    - Acra confirmation on how the state restriction interacts with the applicable
      minimum term.
