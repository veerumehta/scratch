- rule_id: acra-standard.property_eligibility_and_property_specific_overlays.apply_state_and_declining_market_overlays
  condition:
    kind: procedure
    purpose: Determine whether the property is in the ineligible state and apply the
      stated declining-market CLTV overlay where applicable.
    steps:
    - Check the subject property state; a property in SD is ineligible.
    - Determine whether the subject property is in a declining market.
    - For a declining-market property, apply the stated “-5% CLTV property/borrower
      full profile” overlay; obtain Acra confirmation on how the reduction combines
      with other caps.
    checks:
    - The subject property is not in SD.
    - If the property is in a declining market, the “-5% CLTV property/borrower full
      profile” overlay is applied.
    - If the property is in a declining market, Acra has confirmed how the reduction
      combines with other caps.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The subject property is not in SD and any applicable declining-market
        overlay and cap-combination question have been addressed.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The subject property is not in SD, but the declining-market determination,
        overlay, or required Acra confirmation remains outstanding.
    - status: FAIL
      verdict: violated
      criterion: The subject property is in SD, or an applicable declining-market
        overlay is not applied after the required determination.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The job does not apply to a subject property.
    evidence_types: []
    reads:
    - property_state
    - cltv_pct
    - property_type
    - loan_purpose
    computable_checks:
    - 0
    missing_reads:
    - Whether the subject property is in a declining market
    - Acra confirmation on how the declining-market reduction combines with other
      caps
    - The applicable CLTV cap and property/borrower full profile used to apply the
      reduction
