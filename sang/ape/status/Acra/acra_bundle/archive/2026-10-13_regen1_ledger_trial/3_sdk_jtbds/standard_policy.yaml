- rule_id: acra-standard.entity_borrowers_guarantors_and_trusts.entity_eligibility_and_guarantees
  condition:
    kind: procedure
    purpose: Determine whether an entity borrower, its ownership structure, and its
      guarantors meet the entity eligibility and guarantee requirements.
    steps:
    - Confirm the transaction is a business purpose transaction for investment properties
      exclusively.
    - Confirm the collateral title is held directly by individual person(s) or by
      an entity acceptable to Acra in its sole discretion.
    - Confirm the entity is US formed and based and is not a foreign owned entity.
    - Confirm the entity or guarantor type is allowed and is not a prohibited type.
    - For an entity borrower, confirm it is a single purpose entity with no assets
      other than residential investment or rental properties and that it is engaged
      in owning and operating residential investment or rental properties.
    - Confirm the entity borrower is not a series limited liability company.
    - Confirm every entity that will hold direct ownership of the subject property
      and be on title as a direct owner is a borrowing entity.
    - Confirm any business entity nesting is limited to one (1) wholly-owned subsidiary
      owned by individual(s), with no multiple nesting or ownership by multiple entities,
      trusts, etcetera.
    - Confirm all individuals with direct or indirect ownership ≥ 20% provide a recourse
      guarantee (Acra approved, or Exhibit 7).
    - If there are multiple guarantors, confirm all recourse is joint and several.
    - Confirm changes to the operating agreement or bylaws intended to change ownership
      percentages to circumvent required personal guarantors are not considered; changes
      within 30 days prior to an Application Date or throughout the application process
      will not be recognized by Acra Lending.
    - Confirm at least one guarantor has prior homeownership experience.
    - Confirm at least one (1) borrower / guarantor on the loan attests on the application
      that they are not a first-time homebuyer; if prior home ownership is not evident
      within the loan file, note that the underwriter reserves the right to condition
      for supporting documentation.
    checks:
    - The transaction is a business purpose transaction for investment properties
      exclusively.
    - Title to the collateral is held either directly by individual person(s) or by
      an entity acceptable to Acra in its sole discretion.
    - The entity is US formed and based and is not a foreign owned entity.
    - The entity or guarantor type is among Domestic Corporations (C and S Corp),
      single purpose Limited Liability Companies (LLC) excluding series LLC, Limited
      Liability Partnership (LLP), Limited Liability Limited Partnership (LLLP), General
      Partnership (GP), Limited Partnership (LP), or Sole Proprietorship, and is not
      a Cooperative, Irrevocable Trust, Land Trust, IRA, Non-Profit, or Joint Venture.
    - The entity borrower has no assets other than residential investment or rental
      properties.
    - The entity borrower is engaged in the business of owning and operating residential
      investment or rental properties.
    - The entity borrower is not a series limited liability company.
    - Every entity that will hold direct ownership of the subject property and be
      on title as a direct owner is a borrowing entity.
    - Business entity nesting is limited to only one (1) wholly-owned subsidiary that
      in turn is owned by individual(s), with no multiple nesting or ownership by
      multiple entities, trusts, etcetera.
    - All individuals with direct or indirect ownership ≥ 20% provide a recourse guarantee
      (Acra approved, or Exhibit 7).
    - All recourse is joint and several in the case of multiple guarantors.
    - Changes to the operating agreement or bylaws with the intent of changing ownership
      percentages to circumvent required personal guarantors are not considered.
    - Changes to ownership percentages within 30 days prior to an Application Date
      or throughout the application process are not recognized by Acra Lending.
    - At least one guarantor has prior homeownership experience.
    - At least one (1) borrower / guarantor on the loan attests on the application
      that they are not a first-time homebuyer.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The job applies, every step is met, and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The job applies and the requirements are met subject to conditions
        that must be cleared; this includes supporting documentation the underwriter
        conditions for when prior home ownership is not evident within the loan file.
    - status: FAIL
      verdict: violated
      criterion: The job applies and a step is not met or a check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
    evidence_types: []
    reads:
    - borrower_entity_type
    computable_checks: []
    missing_reads:
    - Whether the transaction is for business purpose and the property is exclusively
      an investment property.
    - Whether the entity is acceptable to Acra in its sole discretion.
    - Whether the entity is US formed and based, is foreign owned, and meets the precise
      permitted or prohibited entity categories.
    - The entity's assets and business activities; whether it is a series LLC; and
      the ownership, title, and borrowing-entity structure, including any nesting.
    - Direct and indirect ownership interests and recourse guarantees, including whether
      guarantees are Acra approved or on Exhibit 7 and whether multiple guarantors'
      recourse is joint and several.
    - The intent and dates of operating agreement or bylaw changes relative to the
      Application Date and application process.
    - Prior homeownership evidence, the loan-file contents, and the borrower / guarantor
      application attestation.
  action: require_evidence
  priority: 100
  description: Assess entity-borrower eligibility, ownership, guarantees, and required
    attestations against §6.1.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#Section 3.12
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.1 Entity eligibility and
    guarantees ¶1
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.1 Entity eligibility and
    guarantees ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    ledger:
      clause: 'Section 3.12 governs loans to entities, the personal guarantees Acra
        requires, the entity documentation it accepts and title vesting in a revocable
        living trust. It is restated here as requirements; nothing in it is program-specific.


        STD-6.1 Business Entities are eligible for financing on business purpose transactions
        (investment properties exclusively). \[G §3.12, p. 7\]


        STD-6.2 Acra will lend to, and require that title to the collateral be held,
        either (i) directly by an individual person(s) or (ii) by an entity acceptable
        to Acra in its sole discretion. \[G §3.12, p. 7\]


        STD-6.3 Acra requires all individuals with direct or indirect ownership ≥
        20% to provide a recourse guarantee (Acra approved, or Exhibit 7) in the case
        of an entity borrower. All recourse is joint and several in the case of multiple
        guarantors. \[G §3.12, p. 7\]


        STD-6.4 An entity borrower must be a single purpose entity (SPE): “an entity
        with no assets other than residential investment or rental properties; engaged
        in the business of owning and operating residential investment or rental properties.”
        Series limited liability companies are not allowed. \[G §3.12, p. 7\]


        STD-6.5 All entities that will hold direct ownership of the subject property
        and will be on title as a direct owner are required to be a borrowing entity.
        \[G §3.12, p. 7\]


        STD-6.6 Changes to the operating agreement or bylaws with the intent of changing
        ownership percentages to circumvent required personal guarantors will not
        be considered. “Lookback to changes cannot occur within 30 days prior to an
        Application Date or throughout the application process as these changes will
        not be recognized by Acra Lending.” \[G §3.12, p. 7\]


        STD-6.7 Entity / guarantor types allowed: Domestic Corporations (C and S Corp);
        single purpose Limited Liability Companies (LLC), excluding series LLC; Limited
        Liability Partnership (LLP); Limited Liability Limited Partnership (LLLP);
        General Partnership (GP); Limited Partnership (LP); and Sole Proprietorship.
        “In all events, the Borrower must be a US formed and based Entity, foreign
        entities (i.e.: entities formed or based outside the US) or foreign owned
        entities are not allowed.” \[G §3.12, p. 8\]


        STD-6.8 Not allowed: Cooperatives, Irrevocable Trusts, Land Trusts, IRAs,
        Non-Profit, and Joint Ventures. “Business entity nesting is limited to only
        one (1) wholly-owned subsidiary that in turn must be owned by individual(s);
        multiple nesting or ownership by multiple entities, trusts, etcetera are not
        acceptable.” An illustration of the permitted structure: Acra confirmation
        requested → Q-22. \[G §3.12, p. 8\]


        STD-6.9 Acra requires at least one guarantor to have prior homeownership experience.
        At least one (1) borrower / guarantor on the loan must attest on the application
        that they are not a first-time homebuyer; if prior home ownership is not evident
        within the loan file, the underwriter reserves the right to condition for
        supporting documentation. See Q-09. \[G §3.12, p. 7\]'
