      and the property is tenant occupied, documentation shows timely receipt for
      the prior two (2) months rental payments or 12-months of the subject's payment
      in reserve.
    - The 12-months of the subject's payment in reserve may be from transaction's
      cash-in-hand.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every check holds.
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable requirement is met, subject to conditions that must
        be cleared.
    - status: FAIL
      verdict: violated
      criterion: A required step is not met or an applicable check does not hold.
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The Applicant has not had the stated recent mortgage event, or the
        property is not tenant occupied.
