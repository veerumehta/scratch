    - 'Step 2 - Eligibility Verification: Identify all individuals with direct or
      indirect ownership ≥ 20% and verify that each provides a recourse guarantee
      that is Acra approved, or Exhibit 7. Recourse is joint and several when there
      are multiple guarantors.'
    - 'Step 3 - Validation and Verification: Verify that at least one guarantor has
      prior homeownership experience and at least one borrower / guarantor attests
      on the application that they are not a first-time homebuyer. If prior home ownership
      is not evident within the loan file, the underwriter reserves the right to condition
      for supporting documentation.'
    - 'Step 4 - Final Determination: Record whether the required guarantees and attestation
      are evidenced.'
    checks:
