      and that “0x30x24 Mortgage History” is required. Section 35 loans are ineligible.'
    - 'Step 3 - Validation and Verification: Verify the mortgage-history record. Do
      not define “0x30x24” or “Section 35”; Acra confirmation is requested on the
      applicable interpretation. A property listed for sale has separately required
      impounds.'
    - 'Step 4 - Final Determination: Record whether the waiver meets the stated requirements,
      and identify any unresolved definition or classification.'
    checks:
    - If an escrow waiver is requested, the loan amount does not exceed $1.5M.
    - If an escrow waiver is requested, the required “0x30x24 Mortgage History” is
      met.
    - If an escrow waiver is requested, the loan is not a Section 35 loan.
    - Impounds are required on a property listed for sale.
    outcomes:
