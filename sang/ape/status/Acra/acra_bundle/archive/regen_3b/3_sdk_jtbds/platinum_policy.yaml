- rule_id: acra-platinum.credit_review_analysis.minimum_score_and_matrix_cltv
  condition:
    kind: procedure
    purpose: Determine whether the decisioning score meets the stated minimum and
      whether CLTV is within the applicable printed matrix maximum.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit_report and loan_application
      for the score and loan purpose used in the case.'
    - 'Step 2 - Eligibility Verification: Use the decisioning score determined under
      the Decisioning Score job. The minimum decisioning score is 700. Apply the printed
      matrix for loans ≤ $2,000,000: at 730 and above, maximum CLTV is 80% purchase,
      80% rate & term, and 75% cash-out; at 721–729, it is 80%, 80%, and 65%, respectively;
      on a literal reading, scores 700–720 take the 700 row, with maxima of 80%, 80%,
      and 55%, respectively.'
    - 'Step 3 - Validation and Verification: Compare the case CLTV with the maximum
      for the applicable score and loan purpose. Do not normalize the printed 721
      threshold to 720. Acra confirmation is requested on how score 720 is treated.'
    - 'Step 4 - Final Determination: Record whether the minimum score is met and whether
      the applicable matrix CLTV maximum is met.'
    checks:
    - The decisioning score is at least 700 and LoanCore.cltv_percent does not exceed
      the printed matrix maximum for the score and LoanCore.loan_purpose.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The decisioning score is at least 700 and CLTV is within the applicable
        printed matrix maximum.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The decisioning score is below 700 or CLTV exceeds the applicable
        printed matrix maximum.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - credit_report
    - loan_application
    reads:
    - CreditReport.representative_score
    - LoanCore.cltv_percent
    - LoanCore.loan_purpose
    - LoanCore.total_loan_amount_usd
    computable_checks:
    - 0
    missing_reads:
    - Confirmation from Acra on whether the printed 721 threshold is intended and
      how a score of 720 is treated
  action: require_evidence
  priority: 100
  description: Apply the printed minimum score and loan-purpose CLTV matrix to the
    decisioning score, loan purpose, and case CLTV.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2. Loan amount,
    FICO and maximum CLTV
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2.1 Matrix as printed
    — Loan Amount, FICO, CLTV Requirements
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#Loan amount ≤ \$2,000,000
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.1 Decisioning
    score and tradelines
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#11.1 Published CLTV
    caps and adjustments
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Credit
      assistant:
      - Underwriter
      mnemonic: CRD-MATRIX
      job_kind: limit
    ledger:
      clause: 'One matrix covers all loan amounts to \$2,000,000. It is reproduced
        below exactly as printed, followed by its footnotes in Acra''s words. The
        printed FICO thresholds are 730, 721 and 700, which leaves a score of exactly
        720 to be read literally; the reading and its consequences are set out for
        Acra to confirm rather than adopted.


        PLAT-2.1 The rows below are Acra''s. Each row is a minimum-FICO threshold:
        a score at or above the threshold and below the next higher threshold takes
        that row. No row is printed below 700. \[P: Loan Amount, FICO, CLTV Requirements\]


        | **Min FICO** | **Purchase** | **Rate & Term** | **Cash-Out** |

        |--------------|--------------|-----------------|--------------|

        | 730          | 80%          | 80%             | 75%          |

        | 721          | 80%          | 80%             | 65%          |

        | 700          | 80%          | 80%             | 55%          |


        <table>

        <colgroup>

        <col style="width: 100%" />

        </colgroup>

        <tbody>

        <tr>

        <td><p><strong>THE PRINTED 721 THRESHOLD AND A SCORE OF 720</strong></p>

        <p>Read literally, a decisioning score of 720 falls in the 700 row (cash-out
        maximum 55%), sits outside the Correspondent restriction printed for “700-719
        FICO” (footnote 3), and takes the 3.25 ARM margin printed for “720-759”. This
        document does not normalize 721 to 720. Whether the 721 threshold is intended,
        and how 720 is treated on each of the three points: Acra confirmation requested
        → Q-01.</p></td>

        </tr>

        </tbody>

        </table>


        PLAT-6.1 “Decisioning Credit Score: Primary Wage Earner middle score. For
        loans that close in the name of an entity, use the highest middle score of
        the personal guarantors, presuming equal percentages of ownership. If ownership
        percentages differ, use the individual with the highest concentration of ownership.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.2 Minimum decisioning score 700 (no matrix row below 700, PLAT-2.1);
        Correspondent pricing limited to 60% CLTV for 700-719 (PLAT-2.3). \[P: matrix;
        footnote 3\]


        PLAT-6.3 “Tradelines: Applicants with scores from 3 repositories are deemed
        to be acceptable with no tradeline overlay. 2 tradelines & 24 month history
        or 3 tradelines & 12 month history for applicants with 2 or fewer scores.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.4 Applicants with one score are within “2 or fewer scores” for the
        tradeline requirement above. The Platinum Summary does not state how the decisioning
        score is set with one score or with two scores, whether any no-score pathway
        exists, or how “Primary Wage Earner” is identified on a file with no income
        documentation. The Standard Summary''s one-or-no-score provision is not restated
        here: Acra confirmation requested → Q-05. \[P: Borrower Credit History Requirements\]


        PLAT-6.5 Where two or more guarantors hold an equal largest ownership interest
        and ownership is not equal across all guarantors, PLAT-6.1 does not say whose
        score is used: Acra confirmation requested → Q-05. \[P: Borrower Credit History
        Requirements\]


        | **Condition** | **Purchase** | **Rate & Term** | **Cash-Out** | **Stated
        at** |

        |----|----|----|----|----|

        | Matrix, FICO 730 and above | 80% | 80% | 75% | PLAT-2.1 |

        | Matrix, FICO 721–729 | 80% | 80% | 65% | PLAT-2.1 |

        | Matrix, FICO 700–720 (literal reading, Q-01) | 80% | 80% | 55% | PLAT-2.1
        |

        | Correspondent, “700-719 FICO” | 60% | 60% | 60% (matrix prints 55%) | PLAT-2.3
        |

        | Loan amount \< \$350,000 | 75.00% | 75.00% | 75.00% | PLAT-1.14 |

        | Loan amount \> \$1,500,000 | 75.00% | 75.00% | 75.00% | PLAT-1.14 |

        | Warrantable Condo | 75.00% | 75.00% | 75.00% | PLAT-7.1 |

        | Two-Units | 75.00% | 75.00% | 75.00% | PLAT-7.1 |

        | Interest-Only (5 Yr Term) | 75.00% | 75.00% | 75.00% | PLAT-9.3 |

        | Listed for sale within six months (LTV / CLTV) | 65% | 65% | 65% | PLAT-7.8
        |

        | Declining market (adjustment) | −5% | −5% | −5% | PLAT-1.17 |'
