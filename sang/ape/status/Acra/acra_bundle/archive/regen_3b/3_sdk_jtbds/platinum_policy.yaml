      carries_conditions: false
    evidence_types:
    - appraisal_report
    - lease_agreement
    - rent_roll
    reads:
    - LoanCore.dscr_qualification_method
    computable_checks: []
    missing_reads:
    - Market rent established on the 1007 or 1025
    - Actual rent
    - Rent amount used to calculate the DSCR
  action: require_evidence
  priority: 100
