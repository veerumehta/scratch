- rule_id: acra-platinum.loan_program_eligibility.prepayment_penalty_requirements
  condition:
    kind: procedure
    purpose: Decide whether the loan’s prepayment penalty structure meets the printed
      program requirements and applicable restriction.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application, note terms,
      property location, loan amount, purpose, occupancy or borrower type, and unit
      count.'
    - 'Step 2 - Eligibility Verification: Compare the selected structure with the
      structures printed: 5 Year 5% Fixed (5% / 5% / 5% / 5% / 5%) or Sequential Stepdown
      (5% / 4% / 3% / 2% / 1%); 3 Year 5% Fixed (5% / 5% / 5%) or 3% Fixed (3% / 3%
      / 3%); 2 Year 3% Fixed (3% / 3%); 1 Year 3% Fixed (3%); or No Prepay. Apply
      the printed state restriction for the property state and transaction facts.'
    - 'Step 3 - Validation and Verification: Verify the selected structure and all
      facts needed to apply the state restriction. For a property listed for sale
      within six months, verify a prepayment penalty of at least three (3) years unless
      the property is in a state that does not allow prepayment penalties.'
    - 'Step 4 - Final Determination: Record whether the selected structure complies
      with the printed structure and applicable printed restrictions.'
    checks:
    - The prepayment penalty structure is one of the structures printed for Platinum
      Select.
    - The selected structure satisfies the printed state restriction applicable to
      the property and transaction facts.
    - For a property listed for sale within six months, the prepayment penalty is
      at least three (3) years unless the property is in a state that does not allow
      prepayment penalties.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All applicable checks hold.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A transaction fact or state allowance needed to apply a restriction
        remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The selected structure is not printed or an applicable printed restriction
        is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - loan_application
    - title_commitment
    reads:
    - SubjectProperty.state
    - SubjectProperty.number_of_units
    - LoanCore.total_loan_amount_usd
    - LoanCore.loan_purpose
    - Borrower.entity_type
    - Borrower.is_entity_borrower_1
    - LoanCore.prepayment_penalty_structure
    - SubjectProperty.listed_for_sale_last_6_months
    computable_checks: []
    missing_reads:
    - selected prepayment penalty percentages and term
    - borrower or title holder type relevant to state restriction
    - interest rate for the Illinois restriction
    - transaction facts needed to apply the printed state restrictions
    - whether the property state does not allow prepayment penalties
  action: require_evidence
  priority: 100
  description: Verify that the prepayment penalty structure is one printed for the
    program and apply the stated state restrictions.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#10.1 Structures
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#10.2 State restrictions,
    as printed
  on_violation: fail
  replaces: []
  domain_extensions:
