- rule_id: acra-platinum.title_review.prior_homeownership_experience
  condition:
    kind: procedure
    purpose: Determine whether the required prior homeownership experience is attested
      to on the application and address the stated documentation condition when applicable.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application for the borrower
      / guarantor homebuyer attestation and the loan file for evidence of prior home
      ownership.'
    - 'Step 2 - Eligibility Verification: Verify that at least one borrower / guarantor
      attests on the application that they are not a first-time homebuyer.'
    - 'Step 3 - Validation and Verification: If prior home ownership is not evident
      within the loan file, determine whether supporting documentation is required
      by the underwriter and, if conditioned, review it.'
    - 'Step 4 - Final Determination: Determine whether the attestation requirement
      is met and any condition for supporting documentation is cleared.'
    checks:
    - At least one borrower / guarantor attests on the application that they are not
      a first-time homebuyer; if prior home ownership is not evident within the loan
      file, any underwriter condition for supporting documentation is cleared.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: At least one borrower / guarantor attests on the application that
        they are not a first-time homebuyer, and any condition for supporting documentation
        has been cleared.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The application attestation is present, but a condition for supporting
        documentation where prior home ownership is not evident remains uncleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: No borrower / guarantor attests on the application that they are
        not a first-time homebuyer.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - loan_application
    reads:
    - Borrower.is_first_time_homebuyer
    missing_reads:
    - Application attestation by a borrower / guarantor
    - Evidence of prior home ownership within the loan file
    - Whether the underwriter has conditioned for supporting documentation and, if
      so, the supporting documentation
