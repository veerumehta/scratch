      job_kind: verification
    ledger:
      clause: 'PLAT-6.10 The mortgage / rental rating for determining mortgage pricing
        is determined by evaluating the ratings for properties the borrower owns and
        / or rents over the last twelve (12) months. All reported mortgages on credit
        should be considered; where the applicant has mortgages that are not reported,
        the file should contain documentation to evaluate history on the applicant''s
        primary residence(s), any secondary residence(s), and the subject property.
        \[G §4.15, p. 5\]


        PLAT-6.11 DSCR loans only require documentation on the subject property, principal
        residence, and second home (if any) of the borrower and / or guarantor(s).
        Additional properties do not require housing history to be documented unless
        documents in the file suggest a major credit event has occurred, for example
