- rule_id: acra-platinum.loan_program_eligibility.channel_minimum_dscr
  condition:
    kind: procedure
    purpose: Decide whether the loan meets the channel-specific minimum DSCR requirement.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application and rent evidence
      used to qualify the subject property.'
    - 'Step 2 - Eligibility Verification: Identify the channel and the applicable
      minimum: Correspondent ≥ 1.2 or Wholesale ≥ 1.0.'
    - 'Step 3 - Validation and Verification: Verify the calculated DSCR and its qualifying
      method against the supporting rent and loan information.'
    - 'Step 4 - Final Determination: Record whether the applicable minimum DSCR is
      met.'
    checks:
    - The calculated DSCR is at least 1.2 for Correspondent or at least 1.0 for Wholesale.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable channel minimum DSCR is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The calculated DSCR or channel needed to establish compliance remains
        outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The calculated DSCR is below the applicable channel minimum.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - loan_application
    - lease_agreement
    - rent_roll
    - appraisal_report
    reads:
    - LoanCore.channel
    - LoanCore.dscr_qualification_method
    computable_checks: []
    missing_reads:
    - calculated DSCR
    - channel-specific DSCR minimum comparison result
  action: require_evidence
  priority: 100
  description: Verify that the loan meets the minimum DSCR for its channel.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#Program at a glance
    (published values)
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy, purpose
    and qualification ¶2
