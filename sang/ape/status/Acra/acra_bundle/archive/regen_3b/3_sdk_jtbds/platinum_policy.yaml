- rule_id: acra-platinum.loan_program_eligibility.non_owner_occupancy
  condition:
    kind: procedure
    purpose: Decide whether the property is non-owner occupied as required for the
      program.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application and any lease
      agreement or rent roll for evidence of occupancy and tenancy.'
    - 'Step 2 - Eligibility Verification: Determine whether the subject property is
      non-owner occupied.'
    - 'Step 3 - Validation and Verification: Reconcile the stated occupancy with the
      available tenancy and property records.'
    - 'Step 4 - Final Determination: Record whether the non-owner-occupied requirement
      is met.'
    checks:
    - The subject property is non-owner occupied.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The subject property is established as non-owner occupied.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Non-owner occupancy remains to be established with required supporting
        evidence.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The subject property is owner occupied.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - loan_application
    - lease_agreement
    - rent_roll
    reads:
    - SubjectProperty.occupancy_subtype
    - SubjectProperty.has_current_lease
    computable_checks: []
    missing_reads:
    - evidence of who occupies the property and whether the owner occupies it
  action: require_evidence
  priority: 100
  description: Determine whether the subject property meets Platinum Select’s non-owner-occupied
    occupancy requirement.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1. Program basics
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy, purpose
    and qualification ¶1
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Eligibility
      assistant:
      - Underwriter
      mnemonic: LPE-OCCUPANCY
      job_kind: determination
    ledger:
      clause: 'Platinum Select finances loans on non-owner occupied property, qualified
        on the subject property''s rent, within a narrower box than the Standard program;
        whether every loan is a business-purpose transaction is Q-22. This section
        collects the program-level requirements that apply before the matrix or any
        condition is consulted.


        PLAT-1.1 Occupancy: Non-Owner Occupied. \[P: Occupancy Requirements\]


        PLAT-1.2 An investment property is “a one- to four-unit residential dwelling
        or a unit in a condominium complex or a PUD owned by an individual who does
        not occupy the dwelling. The dwelling is leased and occupied as a principal
        year-round residence to individuals other than the owner.” The property types
        the Platinum Summary lists as eligible are at PLAT-7.1; types it does not
        list are set out in the table at 7.1 and asked in Q-07. \[G §3.41, p. 11;
        P: Subject Property Requirements\]


        PLAT-1.3 The Program Summary is listed as “Business Purpose DSCR Platinum”
        on Acra''s rate-sheet page. “Where the borrower is qualifying utilizing the
        subject property''s actual or market cashflow under a business purpose transaction,
        borrower must execute with loan docs a Business Purpose Attestation (Exhibit
        8) or other similar attestation approved by Acra.” The excerpt''s §8.4 also
        refers to consumer transactions (PLAT-8.2); whether every loan on this program
        is a business-purpose transaction: Acra confirmation requested → Q-22. \[G
        §5.32, p. 3; acralending.com/ratesheets\]


        PLAT-1.4 Eligible loan purpose types: Purchase, Rate & Term Refinance, Cash-Out
        Refinance, Delayed Financing. The matrix footnote states “Delayed financing
        is capped at \$1.5MM”; which matrix column and which cash-in-hand rule apply
        to delayed financing: Acra confirmation requested → Q-02. \[P: Loan Purpose
        Requirements; matrix footnote\]


        PLAT-1.5 “Debt Service Coverage Ratio (DSCR) Cash-Out Refinance Transactions
        requires current lease agreement”. \[P: Loan Purpose Requirements\]


        PLAT-1.6 “Vacant properties ineligible”. The Seller''s Guide provisions on
        vacant purchases and §10.17 vacant refinances therefore do not apply (Appendix
        B). \[P: Loan Purpose Requirements\]'
