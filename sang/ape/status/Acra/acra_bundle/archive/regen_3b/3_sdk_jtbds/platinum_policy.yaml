- rule_id: acra-platinum.credit_review_analysis.decisioning_score
  condition:
    kind: procedure
    purpose: Determine the credit score used for decisioning under the program's stated
      rules.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit_report and, for an entity
      loan, entity_documents for the borrowers'' and personal guarantors'' credit
      scores and ownership percentages. Review the loan_application for income and
      borrower information.'
    - 'Step 2 - Eligibility Verification: For a non-entity loan, identify the Primary
      Wage Earner and that person''s middle score. For a loan closing in the name
      of an entity, use the highest middle score of the personal guarantors if ownership
      percentages are equal; if they differ, use the individual with the highest concentration
      of ownership.'
    - 'Step 3 - Validation and Verification: Where there is one score, two scores,
      no income documentation to identify the Primary Wage Earner, or two or more
      guarantors with an equal largest ownership interest and ownership not equal
      across all guarantors, do not infer a score-selection rule not stated in the
      source.'
    - 'Step 4 - Final Determination: Record the decisioning score only when it can
      be established under the stated rule; otherwise record that the source does
      not resolve the score-selection issue.'
    checks:
    - 'The decisioning score is established using the applicable stated rule: the
      Primary Wage Earner''s middle score, or the entity guarantor score rule where
      applicable.'
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The decisioning score is established under the applicable stated
        rule.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The decisioning score does not follow the applicable stated rule.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - credit_report
    - entity_documents
    - loan_application
    reads:
    - Borrower.entity_type
    - Borrower.entity_documents_complete
    - Borrower.is_entity_borrower_1
    - CreditReport.score_count
    - CreditReport.representative_score
    missing_reads:
    - Individual middle scores
    - Primary Wage Earner identification
    - Guarantor ownership percentages
    - Confirmation of the decisioning score for one-score or two-score files, files
      with no income documentation, and equal-largest-ownership ties
  action: require_evidence
  priority: 100
  description: Establish the decisioning credit score using the stated wage-earner
    or entity-guarantor rule; do not supply a rule where the source requests confirmation.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.1 Decisioning
    score and tradelines
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Credit
      assistant:
      - Underwriter
      mnemonic: CRD-SCORE
      job_kind: determination
    ledger:
      clause: 'PLAT-6.1 “Decisioning Credit Score: Primary Wage Earner middle score.
        For loans that close in the name of an entity, use the highest middle score
        of the personal guarantors, presuming equal percentages of ownership. If ownership
        percentages differ, use the individual with the highest concentration of ownership.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.2 Minimum decisioning score 700 (no matrix row below 700, PLAT-2.1);
        Correspondent pricing limited to 60% CLTV for 700-719 (PLAT-2.3). \[P: matrix;
        footnote 3\]


        PLAT-6.3 “Tradelines: Applicants with scores from 3 repositories are deemed
        to be acceptable with no tradeline overlay. 2 tradelines & 24 month history
        or 3 tradelines & 12 month history for applicants with 2 or fewer scores.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.4 Applicants with one score are within “2 or fewer scores” for the
        tradeline requirement above. The Platinum Summary does not state how the decisioning
        score is set with one score or with two scores, whether any no-score pathway
        exists, or how “Primary Wage Earner” is identified on a file with no income
        documentation. The Standard Summary''s one-or-no-score provision is not restated
        here: Acra confirmation requested → Q-05. \[P: Borrower Credit History Requirements\]


        PLAT-6.5 Where two or more guarantors hold an equal largest ownership interest
