      property.'
    - 'Eligibility Verification: Apply this requirement when the property was listed
      for sale in the last six months and is an investment property.'
    - 'Validation and Verification: Verify from the reviewed evidence that a tenant
      occupies the subject property and check the case field for vacancy status.'
    - 'Final Determination: Determine whether the subject is occupied by a tenant
      and is not vacant.'
    checks:
    - If the property was listed for sale in the last six months and is an investment
      property, the subject is occupied by a tenant and is not vacant.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property was listed for sale in the last six months and, if it
        is an investment property, the subject is occupied by a tenant and is not
        vacant.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property was listed for sale in the last six months, is an investment
        property, and the subject is vacant or is not occupied by a tenant.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property was not listed for sale in the last six months, or it
        is not an investment property.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    - rent_roll
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.occupancy_subtype
    - SubjectProperty.is_vacant
    computable_checks: []
    missing_reads: []
  action: require_evidence
  priority: 100
  description: Verify the tenant-occupancy and vacancy requirements for an investment
    property listed for sale within the last six months.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.3 Properties listed
    for sale (§11.5)
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Liabilities
      assistant:
      - Underwriter
      mnemonic: LIA-TENANTOCCUPANCY
      job_kind: verification
    ledger:
      clause: 'PLAT-7.6 A property is considered listed for sale under §11.5 if it
        has been listed for sale in the last six months, measured from (a) the last
        date of being listed to (b) the Application Date. \[G §11.5, p. 12\]


        PLAT-7.7 Whether §11.5 applies to Platinum Select unchanged is part of Q-13;
        it is restated here because the Platinum Summary does not exclude it. \[G
        §11.5\]


        PLAT-7.8 Loans on such properties will be considered under the following characteristics:
        the property is not in default or otherwise delinquent on lien(s); for investment
        properties, the subject must be occupied by a tenant and may not be vacant;
        the loan must qualify as either (a) ≥ 1.0 DSCR or (b) 43% maximum DTI — on
        this program the channel minimum DSCR applies, Wholesale 1.0 and Correspondent
        1.2 (PLAT-3.8), and the DTI alternative is Q-14; a prepayment penalty of at
        least three (3) years is required unless the property is in a state that does
        not allow prepayment penalties; twenty-four (24) months of reserves are required,
        and cash-in-hand may be considered if otherwise consistent with the Guide;
        the loan must have a fully amortizing term, interest only is not available;
        the maximum LTV / CLTV is 65% based on the lesser of (a) appraised value or
        (b) lowest recent listing price; no subordinate financing is allowed; impounds
        are required. \[G §11.5, pp. 11–12\]'
