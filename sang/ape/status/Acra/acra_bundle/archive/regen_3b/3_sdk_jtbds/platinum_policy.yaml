- rule_id: acra-platinum.liabilities_assessment.dscr_denominator
  condition:
    kind: procedure
    purpose: Establish the denominator calculation stated for DSCR and preserve the
      unresolved interest-only payment question.
    steps:
    - 'Initial Document Review: Identify the annual principal, interest, real estate
      taxes, property insurance, homeowner''s / condominium association fees, and
      any applicable subordinate financing used in the calculation.'
    - 'Eligibility Verification: Apply this calculation rule when DSCR is calculated.'
    - 'Validation and Verification: Verify that the denominator is the sum of those
      listed components. Acra calculates DSCR utilizing the first payment due under
      the terms of the Note. For an interest-only loan, do not resolve which payment
      enters the denominator; Acra confirmation is requested (Q-21).'
    - 'Final Determination: Record the denominator calculation, or record that the
      interest-only payment basis awaits Acra confirmation.'
    checks:
    - The DSCR denominator is the sum of annual principal, interest, real estate taxes,
      property insurance, and homeowner's / condominium association fees; subordinate
      financing, if applicable, is also included.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The denominator uses the stated components and, for a non-interest-only
        loan, the first payment due under the terms of the Note.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The loan is interest-only and the payment entering the denominator
        awaits the requested Acra confirmation (Q-21).
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The denominator does not use the stated components.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads:
    - MortgageLoanInformation.is_interest_only
    - LoanCore.is_interest_only_10_40
    computable_checks: []
    missing_reads:
    - Annual principal and interest amounts used in the denominator
    - Real estate taxes, property insurance, and homeowner's / condominium association
      fees used in the denominator
    - Applicable subordinate financing amount
    - For an interest-only loan, Acra confirmation of which payment enters the denominator
      (Q-21)
  action: require_evidence
  priority: 100
  description: Verify the components included in the DSCR denominator and identify
    when the interest-only payment calculation requires Acra confirmation.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The ratio
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Liabilities
      assistant:
      - Underwriter
      mnemonic: LIA-DENOMINATOR
      job_kind: determination
    ledger:
      clause: 'PLAT-3.4 Denominator, per §5.32: “the sum of annual principal, interest,
        real estate taxes, property insurance, and homeowner''s / condominium association
        fees (collectively, ‘PITIA’). Subordinate financing, if applicable, would
        also be included in the denominator for the sake of this calculation.” \[G
        §5.32, p. 3\]


        PLAT-3.5 “Acra calculates the DSCR utilizing the first payment due under the
        terms of the Note.” §7.5 defines Interest Only payments as “the amount sufficient
        to pay the accrued interest to the mortgage on a monthly basis at the time
        of origination”, while the §5.32 denominator lists “annual principal, interest
        …”. Which payment enters the DSCR denominator on an interest-only loan: Acra
        confirmation requested → Q-21. \[G §7.5, p. 13; §5.32, p. 3\]


        PLAT-3.6 The reference to subordinate financing in the denominator is a calculation
        rule; it does not itself establish that a subordinate lien is permitted. The
        Platinum Summary does not address subordinate financing or restate the Standard
        Summary''s HELOC calculation: Acra confirmation requested → Q-15. \[G §5.32,
        p. 3\]'
  approval_refs: []
- rule_id: acra-platinum.liabilities_assessment.listed_investment_property_occupancy
  condition:
