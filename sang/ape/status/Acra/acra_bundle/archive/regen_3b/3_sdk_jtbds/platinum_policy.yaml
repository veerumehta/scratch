      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A step is not met or an applicable requirement does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - bank_statement
    reads:
