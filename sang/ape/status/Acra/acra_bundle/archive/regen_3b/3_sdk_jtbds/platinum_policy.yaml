      applicable to the calculation.'
    - 'Step 3 - Validation and Verification: Verify that the denominator is the sum
      of annual principal, interest, real estate taxes, property insurance, and homeowner''s
      / condominium association fees, and includes subordinate financing if applicable.'
    - 'Step 4 - Final Determination: Determine whether the denominator follows those
      components.'
    checks:
    - The denominator is the sum of annual principal, interest, real estate taxes,
      property insurance, and homeowner's / condominium association fees.
    - Subordinate financing is included in the denominator if applicable.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The denominator includes the stated components and includes subordinate
        financing if applicable.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The denominator omits a stated component or omits subordinate financing
        when applicable.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
