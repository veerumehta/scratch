    - entity_documents
    - loan_application
    reads:
    - Borrower.entity_type
    - Borrower.entity_documents_complete
    - Borrower.is_entity_borrower_1
    computable_checks: []
    missing_reads:
    - direct and indirect ownership percentages
    - guarantee documents and Acra approval status
    - guarantor prior homeownership evidence
    - application attestation
