- rule_id: acra-platinum.credit_review_analysis.tradelines
  condition:
    kind: procedure
    purpose: Determine whether the applicant meets the tradeline and history requirement
      for the stated score-count category.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit_report for the applicant''s
      repository scores, tradeline count, and history.'
    - 'Step 2 - Eligibility Verification: Applicants with scores from 3 repositories
      are acceptable with no tradeline overlay. Applicants with 2 or fewer scores
      must meet 2 tradelines and 24 month history or 3 tradelines and 12 month history.'
    - 'Step 3 - Validation and Verification: Verify the repository count and applicable
      tradeline and history facts from the credit_report; do not treat the case''s
      summary field as a substitute for review where the underlying facts are unavailable.'
    - 'Step 4 - Final Determination: Record whether the applicable tradeline requirement
      is met.'
    checks:
    - The applicant either has scores from 3 repositories, or has 2 or fewer scores
      and meets 2 tradelines and 24 month history or 3 tradelines and 12 month history.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicant meets the applicable tradeline requirement.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicant does not meet the applicable tradeline requirement.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - credit_report
    reads:
    - CreditReport.score_count
    - CreditReport.tradelines_meet_requirement
    missing_reads:
    - Underlying number of tradelines
    - Length of tradeline history
  action: require_evidence
  priority: 100
  description: Verify the stated tradeline requirement according to the applicant's
    number of credit repositories.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.1 Decisioning
    score and tradelines
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Credit
      assistant:
      - Underwriter
      mnemonic: CRD-TRADELINES
      job_kind: verification
    ledger:
      clause: 'PLAT-6.1 “Decisioning Credit Score: Primary Wage Earner middle score.
        For loans that close in the name of an entity, use the highest middle score
        of the personal guarantors, presuming equal percentages of ownership. If ownership
        percentages differ, use the individual with the highest concentration of ownership.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.2 Minimum decisioning score 700 (no matrix row below 700, PLAT-2.1);
        Correspondent pricing limited to 60% CLTV for 700-719 (PLAT-2.3). \[P: matrix;
        footnote 3\]


        PLAT-6.3 “Tradelines: Applicants with scores from 3 repositories are deemed
        to be acceptable with no tradeline overlay. 2 tradelines & 24 month history
        or 3 tradelines & 12 month history for applicants with 2 or fewer scores.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.4 Applicants with one score are within “2 or fewer scores” for the
        tradeline requirement above. The Platinum Summary does not state how the decisioning
        score is set with one score or with two scores, whether any no-score pathway
        exists, or how “Primary Wage Earner” is identified on a file with no income
        documentation. The Standard Summary''s one-or-no-score provision is not restated
        here: Acra confirmation requested → Q-05. \[P: Borrower Credit History Requirements\]


        PLAT-6.5 Where two or more guarantors hold an equal largest ownership interest
        and ownership is not equal across all guarantors, PLAT-6.1 does not say whose
        score is used: Acra confirmation requested → Q-05. \[P: Borrower Credit History
        Requirements\]'
