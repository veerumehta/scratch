      criterion: A required guarantee, attestation, or supporting evidence of prior
        homeownership remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A required guarantee or attestation is not provided, or no guarantor
        has prior homeownership experience.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
