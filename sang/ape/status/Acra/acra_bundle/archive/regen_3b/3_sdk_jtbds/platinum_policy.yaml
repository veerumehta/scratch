rules:
- rule_id: acra-platinum.appraisal_review.actual_rent_lease_term
  condition:
    kind: procedure
    purpose: Verify the lease-duration requirement for actual rent used in qualifying.
    steps:
    - 'Initial Document Review: Review the lease agreement and identify the loan closing
      date and lease end date.'
    - 'Eligibility Verification: Determine whether actual rent is being used and whether
      the rent is for a long-term rental.'
    - 'Validation and Verification: Verify that the lease is in place for at least
      3 months after the loan closing.'
    - 'Final Determination: Record whether the lease meets the stated duration requirement.'
    checks:
    - Actual rent is being used for a long-term rental.
    - The lease is in place for at least 3 months after the loan closing.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Actual rent is being used for a long-term rental and the lease is
        in place for at least 3 months after the loan closing.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Actual rent is being used for a long-term rental and the lease is
        not in place for at least 3 months after the loan closing.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Actual rent is not being used, or the rental is not long-term.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    reads: []
    computable_checks: []
    missing_reads:
    - Whether actual rent is being used
    - Whether the rental is long-term
    - Lease end date
    - Loan closing date
  action: require_evidence
  priority: 100
  description: Verify that the lease meets the required duration after closing when
    actual rent is used for a long-term rental.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying rent,
    as printed in the Platinum Summary
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-LEASETERM
      job_kind: verification
    ledger:
      clause: 'PLAT-3.1 “When calculating the DSCR, Acra will use the greater of the
        market rent as established on the 1007 or 1025, or actual rent. When using
        actual rent, the actual rent must be documented via evidence of 2 months’
        proof of receipts and the lease must be in place for at least 3 months after
        the loan closing. This applies to long-term rents only and is not appropriate
        for short-term rentals.” \[P: Income Documentation & Debt Ratio Requirements\]


        PLAT-3.2 §5.32 of the excerpt states the general formula as “the lesser of
        (i) annual in-place rent or (ii) market rent”, then notes that “Acra may use
        the higher of actual or market rents” subject to “two (2) consecutive months
        proof of rental income receipt”, a lease continuing at least three months
        after closing, and: “Security Deposit does not count towards receipt, and
        the rents cannot be prepaid.” The Platinum Summary''s statement (PLAT-3.1)
        is program-specific; the excerpt''s general formula is reproduced here. Which
        governs Platinum Select and how they relate, whether “2 months’ proof of receipts”
        means consecutive months, and whether the security-deposit and prepaid-rent
        conditions apply: Acra confirmation requested → Q-03. \[G §5.32, p. 3\]


        PLAT-3.3 Short-term rentals are ineligible for the program (PLAT-7.2); the
        Seller''s Guide provisions on short-term rental income and appraisal forms
        are not restated (Appendix B). \[P: Subject Property Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.appraisal_review.actual_rent_receipts
  condition:
    kind: procedure
    purpose: Verify the evidence of actual rent receipts required when actual rent
      is used.
    steps:
    - 'Initial Document Review: Review bank statements and other rent evidence in
      the file.'
    - 'Eligibility Verification: Determine whether actual rent is being used and whether
      the rent is for a long-term rental.'
    - 'Validation and Verification: Verify that evidence documents 2 months’ proof
      of receipts.'
    - 'Final Determination: Record whether the required proof of receipts is documented.'
    checks:
    - Actual rent is being used for a long-term rental.
    - Evidence documents 2 months’ proof of receipts.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Actual rent is being used for a long-term rental and evidence documents
        2 months’ proof of receipts.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Actual rent is being used for a long-term rental and evidence does
        not document 2 months’ proof of receipts.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Actual rent is not being used, or the rental is not long-term.
      carries_conditions: false
    evidence_types:
    - bank_statement
    - lease_agreement
    - rent_roll
    reads: []
    computable_checks: []
    missing_reads:
    - Whether actual rent is being used
    - Whether the rental is long-term
    - Evidence of 2 months’ proof of receipts
  action: require_evidence
  priority: 100
  description: Verify the required proof of receipts when actual rent is used for
    a long-term rental.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying rent,
    as printed in the Platinum Summary
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-RECEIPTS
      job_kind: verification
    ledger:
      clause: 'PLAT-3.1 “When calculating the DSCR, Acra will use the greater of the
        market rent as established on the 1007 or 1025, or actual rent. When using
        actual rent, the actual rent must be documented via evidence of 2 months’
        proof of receipts and the lease must be in place for at least 3 months after
        the loan closing. This applies to long-term rents only and is not appropriate
        for short-term rentals.” \[P: Income Documentation & Debt Ratio Requirements\]


        PLAT-3.2 §5.32 of the excerpt states the general formula as “the lesser of
        (i) annual in-place rent or (ii) market rent”, then notes that “Acra may use
        the higher of actual or market rents” subject to “two (2) consecutive months
        proof of rental income receipt”, a lease continuing at least three months
        after closing, and: “Security Deposit does not count towards receipt, and
        the rents cannot be prepaid.” The Platinum Summary''s statement (PLAT-3.1)
        is program-specific; the excerpt''s general formula is reproduced here. Which
        governs Platinum Select and how they relate, whether “2 months’ proof of receipts”
        means consecutive months, and whether the security-deposit and prepaid-rent
        conditions apply: Acra confirmation requested → Q-03. \[G §5.32, p. 3\]


        PLAT-3.3 Short-term rentals are ineligible for the program (PLAT-7.2); the
        Seller''s Guide provisions on short-term rental income and appraisal forms
        are not restated (Appendix B). \[P: Subject Property Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.appraisal_review.cash_out_refinance_lease
  condition:
    kind: procedure
    purpose: Verify the current lease agreement requirement for cash-out refinances.
    steps:
    - 'Initial Document Review: Review the file for a lease agreement for the subject
      property.'
    - 'Eligibility Verification: Determine whether the loan purpose is cash-out refinance.'
    - 'Validation and Verification: If applicable, verify that a current lease agreement
      is provided.'
    - 'Final Determination: Record whether the required current lease agreement is
      provided.'
    checks:
    - The loan purpose is cash-out refinance.
    - A current lease agreement is provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The loan purpose is cash-out refinance and a current lease agreement
        is provided.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The loan purpose is cash-out refinance and a current lease agreement
        is not provided.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The loan purpose is not cash-out refinance.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    reads:
    - LoanCore.loan_purpose
    computable_checks: []
    missing_reads:
    - Whether a current lease agreement is provided
    - Whether the lease agreement is current
  action: require_evidence
  priority: 100
  description: Verify that a current lease agreement is provided for a cash-out refinance.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.4 Rent schedules
    and rent evidence
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-CASHOUT
      job_kind: verification
    ledger:
      clause: 'PLAT-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA
        Form 1007) for single family properties on (i) all DSCR qualifying files,
        (ii) lease-option purchase transactions where the down payment required in
        §3.45 is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. A 1007 may be from the original appraiser
        or any state licensed appraiser. \[G §14.12, p. 4\]


        PLAT-3.10 Single family investment properties with excessive monthly rent
        payments reflected on the lease require documentation supporting that the
        monthly rent is typical for the area; acceptable documentation may include
        classified ads from local newspapers, a 1007 completed by the appraiser, or
        a market rent survey completed by a local real estate company or rental management
        company familiar with the market rents in the area. \[G §14.12, p. 4\]


        PLAT-3.11 Cash-out refinance: current lease agreement required (PLAT-1.5).
        \[P: Loan Purpose Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.appraisal_review.excessive_lease_rent_support
  condition:
    kind: procedure
    purpose: Verify the required support for monthly rent reflected on the lease as
      typical for the area.
    steps:
    - 'Initial Document Review: Review the lease agreement for monthly rent payments
      and supporting rent documentation.'
    - 'Eligibility Verification: Determine whether the subject property is a single
      family investment property and the lease reflects excessive monthly rent payments.'
    - 'Validation and Verification: If applicable, verify that documentation supports
      that the monthly rent is typical for the area. Acceptable documentation may
      include classified ads from local newspapers, a 1007 completed by the appraiser,
      or a market rent survey completed by a local real estate company or rental management
      company familiar with the market rents in the area.'
    - 'Final Determination: Record whether the required support is documented.'
    checks:
    - The subject property is a single family investment property and the lease reflects
      excessive monthly rent payments.
    - Documentation supports that the monthly rent is typical for the area.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The subject property is a single family investment property, the
        lease reflects excessive monthly rent payments, and documentation supports
        that the monthly rent is typical for the area.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The subject property is a single family investment property, the
        lease reflects excessive monthly rent payments, and documentation does not
        support that the monthly rent is typical for the area.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The subject property is not a single family investment property,
        or the lease does not reflect excessive monthly rent payments.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    - appraisal_report
    reads:
    - SubjectProperty.property_type
    - SubjectProperty.occupancy_subtype
    computable_checks: []
    missing_reads:
    - Whether the subject property is an investment property
    - Whether the lease reflects excessive monthly rent payments
    - Whether the monthly rent is typical for the area
  action: require_evidence
  priority: 100
  description: Verify documentation supporting area typicality when a single family
    investment property lease reflects excessive monthly rent payments.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.4 Rent schedules
    and rent evidence
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-TYPICALITY
      job_kind: verification
    ledger:
      clause: 'PLAT-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA
        Form 1007) for single family properties on (i) all DSCR qualifying files,
        (ii) lease-option purchase transactions where the down payment required in
        §3.45 is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. A 1007 may be from the original appraiser
