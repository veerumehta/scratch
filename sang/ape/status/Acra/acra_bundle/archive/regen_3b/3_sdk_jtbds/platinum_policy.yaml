      rent as established on the 1007 or 1025, or actual rent.'
    - 'Final Determination: Record whether the rent used for the DSCR meets the stated
      requirement.'
    checks:
    - The DSCR uses the greater of market rent as established on the 1007 or 1025,
      or actual rent.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The loan is a DSCR transaction and the DSCR uses the greater of market
        rent as established on the 1007 or 1025, or actual rent.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
