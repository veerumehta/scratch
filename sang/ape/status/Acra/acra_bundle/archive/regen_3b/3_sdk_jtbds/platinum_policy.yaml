- rule_id: acra-platinum.compliance_and_closing.revocable_trust_vesting
  condition:
    kind: procedure
    purpose: Determine whether title vesting in an inter vivos revocable trust is
      permitted under the stated requirements.
    steps:
    - 'Initial Document Review: Review the complete, legible Trust or Certification
      of Trust and any written Acra Senior Management exception.'
    - 'Eligibility Verification: Verify the Trust is valid under the laws of the state
      in which it is established, revocable, established by one or more natural persons,
      and effective during the lifetime of the person(s) establishing it; verify that
      the primary beneficiary is the individual(s) establishing the Trust.'
    - 'Validation and Verification: Verify the Trust or Certification of Trust includes
      every stated item: existence and date; Trustor(s) and current Trustee(s); Trustee
      powers; revocability and who holds the right to revoke; required number and
      names of signing Trustees; Trust identification number; how title to Trust assets
      is taken; and a statement that the Trust has not been revoked, modified, or
      amended. Verify the stated mortgage, beneficiary-consent, lender-risk, and creditor-rights
      provisions. Obtain written exception by Acra Senior Management if the Trustor(s)
      and Trustee(s) are not the same. Note that Legal reserves the right to condition
      for additional supporting documentation.'
    - 'Final Determination: Determine whether all stated requirements for permitted
      trust vesting are met.'
    checks:
    - The Trust or Certification of Trust contains all required information and statements.
    - The Trust is valid under the laws of the state in which it is established, is
      revocable, and is established by one or more natural persons and effective during
      their lifetime.
    - The primary beneficiary is the individual(s) establishing the Trust.
    - If the Trustor(s) and Trustee(s) are not the same, written exception by Acra
      Senior Management has been obtained.
    - The Trust specifies the required Trustee power, beneficiary-consent, lender-risk,
      and creditor-rights provisions.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All checks hold.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Additional supporting documentation has been conditioned for and
        remains to be obtained.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Title is not vested in an inter vivos revocable trust.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_type
    missing_reads:
    - Trust and Certification of Trust contents; state-law validity; Trustor(s), Trustee(s),
      beneficiaries, and signing requirements; and any written Acra Senior Management
      exception.
  action: require_evidence
  priority: 100
  description: Verify that title vesting in an inter vivos revocable trust meets each
    stated trust requirement.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.4 Revocable living
    trusts
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Compliance
      assistant:
      - Underwriter
      mnemonic: BET-TRUST
      job_kind: verification
    ledger:
      clause: 'PLAT-5.13 Title vesting in an inter vivos revocable trust is permitted
        when all of the following requirements are followed. \[G §3.12, pp. 9–10\]


        - A complete, legible copy of the Trust, or a Certification of Trust stating:
        the existence and date of the Trust; the Trustor(s) and the current Trustee(s);
        the powers of the Trustee; whether the Trust is revocable and, if revocable,
        who holds the right to revoke; the names and number of the Trustees required
        to sign on behalf of the Trust; the Trust identification number (a Social
        Security number or an IRS-issued Tax Identification Number); how title to
        the Trust assets should be taken; and a statement that the Trust has not been
        revoked, modified, or amended in any manner.


        - The Trust must be valid under the laws of the state in which it is established.


        - The Trust must be revocable, meaning it can be changed or canceled at any
        time for any reason during a Trustor''s lifetime. Irrevocable trust is not
        permitted.


        - The Trust must be established by one or more natural persons, solely or
        jointly (Grantor, Trustor, or Settlor), and must become effective during the
        lifetime of the person(s) establishing it.


        - The primary beneficiary of the Trust must be the individual(s) establishing
        the Trust.


        - Written exception by Acra Senior Management must be obtained if the Trustor(s)
        and Trustee(s) are not the same.


        - The Trust must specify that the Trustee has the power to hold title and
        mortgage the property; that the beneficiary does not need to grant written
        consent for the Trust to borrow money, or that such consent has been granted
        in writing for purposes of the mortgage; that there is no unusual risk or
        impairment to the lender''s rights; and that holding title in the Trust does
        not diminish the lender''s rights as a creditor.


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
  approval_refs: []
