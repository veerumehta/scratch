- rule_id: acra-platinum.loan_program_eligibility.entity_borrower_eligibility
  condition:
    kind: procedure
    purpose: Decide whether the entity borrower meets the stated entity-type and entity-document
      requirements.
    steps:
    - 'Step 1 - Initial Document Review: Review entity documents and the loan application
      for entity type and formation, ownership, and purpose information.'
    - 'Step 2 - Eligibility Verification: Verify that the borrower entity is an allowed
      type, is US formed and based, and is not a foreign entity or foreign owned entity.
      Check that it is a single purpose entity engaged in owning and operating residential
      investment or rental properties, with no assets other than residential investment
      or rental properties; series LLCs are not allowed.'
