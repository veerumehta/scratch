    purpose: Determine whether an escrow waiver meets the requirements stated for
      the Platinum waiver.
    steps:
    - 'Step 1 - Initial Document Review: If an escrow waiver is requested, review
      the loan_application and credit_report for loan amount and mortgage history.'
