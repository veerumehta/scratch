- rule_id: acra-platinum.credit_review_analysis.property_listed_for_sale
  condition:
    kind: procedure
    purpose: Determine whether the property is subject to the listed-for-sale requirements
      and whether each stated characteristic is met.
    steps:
    - 'Step 1 - Initial Document Review: Review the listing_history for listing dates
      and prices, the loan_application for the Application Date and loan terms, and
      the applicable property, lien, reserve, and payment-history records.'
    - 'Step 2 - Eligibility Verification: Treat the property as listed for sale under
      §11.5 if it was listed for sale in the last six months, measured from the last
      date of being listed to the Application Date. Whether §11.5 applies to Platinum
      Select unchanged is part of Q-13.'
    - 'Step 3 - Validation and Verification: For a property meeting the trigger, verify
      that it is not in default or otherwise delinquent on lien(s); for an investment
      property, verify that the subject is occupied by a tenant and is not vacant;
      verify qualification as either ≥ 1.0 DSCR or 43% maximum DTI, with the program''s
      channel minimum DSCR applying (Wholesale 1.0 and Correspondent 1.2) and the
      DTI alternative unresolved as Q-14. Verify a prepayment penalty of at least
      three (3) years unless the property is in a state that does not allow prepayment
      penalties; twenty-four (24) months of reserves; a fully amortizing term; maximum
      LTV / CLTV of 65% based on the lesser of appraised value or lowest recent listing
      price; no subordinate financing; and required impounds. Interest only is not
      available.'
    - 'Step 4 - Final Determination: Record whether the six-month trigger applies
      and whether every applicable stated characteristic is met. Do not resolve the
      stated Q-13 or Q-14 questions without confirmation.'
    checks:
    - The property was listed for sale in the last six months, measured from the last
      date of being listed to the Application Date, for the §11.5 requirements to
      apply.
    - The property is not in default or otherwise delinquent on lien(s).
    - If the property is an investment property, the subject is occupied by a tenant
      and is not vacant.
    - The loan qualifies as either ≥ 1.0 DSCR or 43% maximum DTI, subject to the stated
      channel minimum DSCR and unresolved Q-14 treatment of the DTI alternative.
    - The prepayment penalty is at least three (3) years unless the property is in
      a state that does not allow prepayment penalties.
    - Twenty-four (24) months of reserves are provided.
    - The loan has a fully amortizing term and is not interest only.
    - LTV / CLTV is no more than 65% based on the lesser of appraised value or lowest
      recent listing price.
    - There is no subordinate financing.
    - Impounds are provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: If §11.5 applies, the property meets every applicable stated characteristic;
        if the six-month listing trigger does not apply, this job does not apply.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The six-month listing trigger applies and any applicable stated characteristic
        is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property was not listed for sale in the last six months, measured
        from the last date of being listed to the Application Date.
      carries_conditions: false
    evidence_types:
    - listing_history
    - loan_application
    - title_commitment
    - credit_report
    - lease_agreement
    - rent_roll
    - bank_statement
    - hazard_insurance
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.is_listed_for_sale
    - SubjectProperty.is_vacant
    - SubjectProperty.occupancy_subtype
    - SubjectProperty.appraised_value_usd
    - LoanCore.cltv_percent
    - LoanCore.dscr_qualification_method
    - LoanCore.prepayment_penalty_structure
    - LoanCore.is_interest_only_10_40
    - MortgageLoanInformation.is_interest_only
    - LoanCore.note_rate_percent
    - RatioSet.reserves_months
    - SubjectProperty.state
    - SubjectProperty.is_mixed_use
    - LoanCore.channel
    missing_reads:
    - Last date of listing and Application Date
    - Lowest recent listing price
    - Lien status and delinquency
    - DSCR value or DTI value
    - Acra confirmation on the DTI alternative (Q-14)
    - State prepayment-penalty restriction determination
    - Evidence of twenty-four (24) months of reserves
    - Evidence of subordinate financing status and impounds
    - Acra confirmation whether §11.5 applies to Platinum Select unchanged (Q-13)
  action: require_evidence
  priority: 100
  description: Verify the six-month listing trigger and apply the stated characteristics
    for a property listed for sale.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.4 Escrow waiver
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.3 Properties listed
    for sale (§11.5)
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#11.1 Published CLTV
    caps and adjustments
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Credit
      assistant:
      - Underwriter
      mnemonic: CRD-LISTING
      job_kind: condition
    ledger:
      clause: 'PLAT-6.13 Escrow waiver: maximum loan amount \$1.5M; “0x30x24 Mortgage
        History required, Section 35 loans ineligible”. No CLTV or FICO limit is printed
        for the Platinum waiver, and “Section 35” is not defined in the sources: Acra
        confirmation requested → Q-09 and Q-14. \[P: Escrow Waiver Requirements\]


        PLAT-6.14 Impounds are separately required on a property listed for sale (§11.5,
        PLAT-7.8). \[G §11.5, p. 12\]


        PLAT-7.6 A property is considered listed for sale under §11.5 if it has been
        listed for sale in the last six months, measured from (a) the last date of
        being listed to (b) the Application Date. \[G §11.5, p. 12\]


        PLAT-7.7 Whether §11.5 applies to Platinum Select unchanged is part of Q-13;
        it is restated here because the Platinum Summary does not exclude it. \[G
        §11.5\]


        PLAT-7.8 Loans on such properties will be considered under the following characteristics:
        the property is not in default or otherwise delinquent on lien(s); for investment
        properties, the subject must be occupied by a tenant and may not be vacant;
        the loan must qualify as either (a) ≥ 1.0 DSCR or (b) 43% maximum DTI — on
        this program the channel minimum DSCR applies, Wholesale 1.0 and Correspondent
        1.2 (PLAT-3.8), and the DTI alternative is Q-14; a prepayment penalty of at
        least three (3) years is required unless the property is in a state that does
        not allow prepayment penalties; twenty-four (24) months of reserves are required,
        and cash-in-hand may be considered if otherwise consistent with the Guide;
        the loan must have a fully amortizing term, interest only is not available;
        the maximum LTV / CLTV is 65% based on the lesser of (a) appraised value or
        (b) lowest recent listing price; no subordinate financing is allowed; impounds
        are required. \[G §11.5, pp. 11–12\]


