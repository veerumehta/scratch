- rule_id: acra-platinum.asset_assessment.listed_property_prepayment_penalty.python
  condition:
    kind: python
    source: "import re\nimport rules_lib\n\n\ndef check(ctx):\n    structure = ctx['LoanCore.prepayment_penalty_structure']\n\
      \    missing = rules_lib.gaps(structure=structure)\n    if missing:\n      \
      \  return rules_lib.unknown(*missing)\n\n    match = re.search(r'(?<!\\d)(\\\
      d+(?:\\.\\d+)?)\\s*[- ]?\\s*years?', str(structure), re.IGNORECASE)\n    if\
      \ match is None:\n        return rules_lib.unknown('prepayment penalty term')\n\
      \n    years = float(match.group(1))\n    if years >= 3:\n        return (True,\
      \ {'prepayment_penalty_term_years': years})\n\n    state = ctx['SubjectProperty.state']\n\
      \    missing = rules_lib.gaps(state=state)\n    if missing:\n        return\
      \ rules_lib.unknown(*missing)\n\n    state_text = rules_lib.norm(state)\n  \
      \  if isinstance(state_text, str) and 'does not allow prepayment penalties'\
      \ in state_text:\n        return (True, {'prepayment_penalty_term_years': years,\
      \ 'state': state})\n    if isinstance(state_text, str) and 'allows prepayment\
      \ penalties' in state_text:\n        return (False, {'prepayment_penalty_term_years':\
