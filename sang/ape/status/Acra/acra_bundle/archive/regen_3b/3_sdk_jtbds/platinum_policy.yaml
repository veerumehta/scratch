- rule_id: acra-platinum.identification_requirements.entity_documentation
  condition:
    kind: procedure
    purpose: Establish whether the entity borrower has provided the required entity
      documentation.
    steps:
    - 'Initial Document Review: For an entity borrower, review the entity documents.
      Verify a complete, legible Certificate of Formation / Articles of Organization
      and all amendments. Verify a complete, legible Operating Agreement for LLCs
      and Partnerships, or Bylaws for corporations, with all referenced exhibits and
      amendments. The Operating Agreement or Bylaws must state whether the entity
      is member or manager managed, contain authorization to borrow money and enter
      into contracts for mortgage assets, and designate signers. Verify documentation
      evidencing ownership interests: for LLCs and Partnerships, the Operating Agreement
      must identify by name all persons with their ownership interest, or attach that
      information as an exhibit, or provide membership interest certificates / units
      in compliance with the Operating Agreement. For S or C Corporations, verify
      shareholder / stockholder certificates that comply with the Bylaws, if any,
      or the stock ledger if certificates are lost or unavailable; the certificate
      or ledger must account for all outstanding shares noted in the formation document,
      including those held by the corporation. If stock certificates are lost, destroyed,
      mutilated, or otherwise unavailable, verify an Affidavit of Lost Stock Certificate.
      For S-corporations or Partnerships where both stock certificate and stock ledger
      are unavailable, verify the most recent preceding tax year''s K-1 statement
      for all members with 20% or more interest and a letter from the CPA or Tax Preparer
      affirming current ownership interest, with a statement to that effect if the
      preceding year''s taxes have not been filed.'
    - 'Eligibility Verification: Verify that names on entity documents match the identification;
      if they do not match exactly, verify a letter of explanation addressing the
      discrepancy. Verify a Certificate of Good Standing or equivalent valid within
      ninety (90) days of the closing date. If the entity is formed in a state other
      than where business is performed or where the property is located, verify a
      Certificate of Foreign Qualification or other qualification to operate in the
      state where business is being conducted. Verify IRS Form SS4 or a Federal Taxpayer
      Identification Number (TIN) or Employer Identification Number (EIN) issuance
      letter for the entity. An EIN exception request may be submitted for review
      by Acra''s Legal Department with a letter of explanation stating the applicable
      grounds. Verify a Unanimous Written Consent / Board Resolution signed by all
      members regardless of their percentage of interest, authorizing the transaction
      with Acra Lending and identifying who is authorized to sign the loan documents
      on behalf of and to bind the entity. Check whether it is required by the Operating
      Agreement or Bylaws even where ownership is held by one individual. It cannot
      designate a signor on a personal guarantee, only an authorized signor for the
      loan documents signed by the entity. If a Power of Attorney is used to designate
      an attorney in fact to execute a personal guarantee, verify that it is utilized
      by the principal; see §23.5(C), not reproduced (Appendix B).'
    - 'Validation and Verification: Do not accept borrower letters stating that required
      documents are not required, available, or excused from providing such documents.
      If the formation documents and the Operating Agreement or Bylaws conflict, additional
      information may be required. Legal reserves the right to condition for additional
      supporting documentation as determined in its sole discretion.'
    - 'Final Determination: Record whether all required documentation applicable to
      the entity and the stated document-specific requirements have been verified,
      and identify any outstanding conditions or additional information requested.'
    checks:
    - The complete, legible formation document and all amendments are provided.
    - The applicable Operating Agreement or Bylaws and all referenced exhibits and
      amendments meet the stated requirements.
    - The applicable documentation evidencing ownership interests is provided and
      meets the stated requirements.
    - The applicable corporate share documentation is provided and meets the stated
      requirements, including an Affidavit of Lost Stock Certificate when required.
    - For an S-corporation or Partnership where both stock certificate and stock ledger
      are unavailable, the required K-1 statements and CPA or Tax Preparer letter
      are provided.
    - Entity document names match identification, or a letter of explanation addresses
      any exact-name discrepancy.
    - A Certificate of Good Standing or equivalent valid within ninety (90) days of
      the closing date is provided.
    - If applicable, a Certificate of Foreign Qualification or other qualification
      to operate in the state where business is being conducted is provided.
    - IRS Form SS4 or a Federal Taxpayer Identification Number (TIN) or Employer Identification
      Number (EIN) issuance letter is provided, or an EIN exception request with a
      letter of explanation stating the applicable grounds is submitted for review
      by Acra's Legal Department.
    - The required Unanimous Written Consent / Board Resolution is provided and meets
      the stated requirements.
    - If a Power of Attorney is used to designate an attorney in fact to execute a
      personal guarantee, it is utilized by the principal.
    - No borrower letter states that required documents are not required, available,
      or excused from providing such documents.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The borrower is an entity borrower and every applicable check holds,
        with no outstanding required documentation or requested condition.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The borrower is an entity borrower and documentation or additional
        supporting documentation remains outstanding for a condition.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The borrower is an entity borrower and a required check does not
        hold, including where required documentation is not provided.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_type
    - Borrower.entity_documents_complete
    missing_reads:
    - Entity formation documents and amendments
    - Operating Agreement or Bylaws, referenced exhibits and amendments
    - Ownership-interest documentation
    - Applicable shareholder / stockholder certificates, stock ledger, Affidavit of
      Lost Stock Certificate, K-1 statements and CPA or Tax Preparer letter
    - Identification for comparison with entity document names
    - Closing date
    - Qualification-to-operate documentation, where applicable
    - IRS Form SS4, TIN or EIN issuance letter, or EIN exception request and letter
      of explanation
    - Unanimous Written Consent / Board Resolution
    - Power of Attorney, if used for a personal guarantee
    - Any additional information or supporting documentation requested
  action: require_evidence
  priority: 100
  description: For an entity borrower, verify the required entity documentation and
    the applicable document-specific requirements.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.2 Entity documentation
    ¶1
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.2 Entity documentation
    ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Identification
      assistant:
      - Processor
      mnemonic: BOR-ENTITYDOCS
      job_kind: verification
    ledger:
      clause: 'PLAT-5.10 The documents below are required, without exception, and
        borrower letters stating that they are not required, available, or excused
        from providing such documents are not acceptable. \[G §3.12, pp. 8–9\]


        - Complete, legible copy of the Certificate of Formation / Articles of Organization
        and all amendments thereto.


        - Complete (with all referenced exhibits), legible copy of the Operating Agreement
        for LLCs and Partnerships, or Bylaws for corporations, and all amendments,
        that states whether the entity is member or manager managed, contains authorization
        to borrow money and enter into contracts for mortgage assets, and designates
        signers. Additional information may be required if the formation documents
        and the Operating Agreement or Bylaws conflict.


        - All documentation evidencing ownership interests: for LLCs and Partnerships,
        the Operating Agreement must identify, or attach as an exhibit, all persons
        by name with their ownership interest, or provide copies of the membership
        interest certificates / units in compliance with the Operating Agreement.


        - For S or C Corporations: shareholder / stockholder certificates that comply
        with the Bylaws, if any, or, if stock certificates are lost or unavailable,
        the corporation''s stock ledger. The certificate or ledger must account for
        all outstanding shares noted in the Certificate of Formation / Articles of
        Organization, including those held by the corporation. If stock certificates
        are lost, destroyed, mutilated, or otherwise unavailable, an Affidavit of
        Lost Stock Certificate is required.


        - For S-corporations or Partnerships, where both stock certificate and stock
        ledger are unavailable: (i) the most recent preceding tax year''s K-1 statement
        for all members with 20% or more interest, and (ii) a letter from the CPA
        or Tax Preparer affirming current ownership interest, with a statement to
        that effect if the preceding year''s taxes have not been filed.


        - Names on the entity documents must match the identification; if they do
        not match exactly, a letter of explanation is required to address the discrepancy.


        - Certificate of Good Standing or equivalent document valid within ninety
        (90) days of the closing date.


        - Certificate of Foreign Qualification or other qualification to operate in
        the state where business is being conducted, if the entity is formed in a
        state other than where business is performed or where the property is located.


        - IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or Employer
        Identification Number (EIN) issuance letter for the entity. EIN exception
        requests may be submitted for review by Acra''s Legal Department with a letter
        of explanation stating the applicable grounds.


        - A Unanimous Written Consent / Board Resolution signed by all members regardless
        of their percentage of interest, (i) authorizing the transaction with Acra
        Lending and (ii) identifying who is authorized to sign the loan documents
        on behalf of and to bind the entity. It may be required by the Operating Agreement
        or Bylaws even where ownership is held by one individual. It cannot be used
        to designate a signor on a personal guarantee, only an authorized signor for
        the loan documents signed by the entity.


        - A Power of Attorney must be utilized by the principal to designate an attorney
        in fact to execute a personal guarantee; see §23.5(C), not reproduced (Appendix
        B).


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
  approval_refs: []
- rule_id: acra-platinum.identification_requirements.first_time_homebuyer_eligibility
  condition:
    kind: procedure
    purpose: Establish whether the borrower is ineligible because the borrower is
      a First Time Home Buyer.
    steps:
    - 'Initial Document Review: Review the application information used to identify
      whether all Applicants have never previously owned a home (real property).'
    - 'Eligibility Verification: Apply Acra’s definition: a First Time Home Buyer
