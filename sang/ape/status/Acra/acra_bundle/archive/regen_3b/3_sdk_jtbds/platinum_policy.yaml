  action: require_evidence
  priority: 100
  description: Verify that the entity borrower’s form is one of the entity / guarantor
    types allowed by the guidelines.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity eligibility
    and guarantees ¶1
