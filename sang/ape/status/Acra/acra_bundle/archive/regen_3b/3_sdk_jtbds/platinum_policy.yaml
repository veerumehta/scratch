- rule_id: acra-platinum.appraisal_review.single_family_rent_schedule
  condition:
    kind: procedure
    purpose: Verify the required FNMA Form 1007 for applicable single family properties.
    steps:
    - 'Initial Document Review: Review the appraisal report for the Single-Family
      Comparable Rent Schedule (FNMA Form 1007).'
    - 'Eligibility Verification: Determine whether the subject property is single
      family and whether any of the stated triggers applies: the file qualifies using
      DSCR; the transaction is a lease-option purchase and the down payment required
      in §3.45 is generated from excess monthly rent contributions; or proposed rental
      income is being used to qualify.'
    - 'Validation and Verification: If a trigger applies, verify that Form 1007 is
      provided. Verify that it is from the original appraiser or any state licensed
      appraiser.'
    - 'Final Determination: Record whether the required Form 1007 is provided and
      meets the stated requirement.'
    checks:
    - The subject property is single family.
    - The file qualifies using DSCR, or the transaction is a lease-option purchase
      and the down payment required in §3.45 is generated from excess monthly rent
      contributions, or proposed rental income is being used to qualify.
    - When a trigger applies, Form 1007 is provided.
    - The Form 1007 is from the original appraiser or any state licensed appraiser.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The subject property is single family, a stated trigger applies,
        and Form 1007 is provided from the original appraiser or any state licensed
        appraiser.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The subject property is single family, a stated trigger applies,
        and Form 1007 is not provided or is not from the original appraiser or any
        state licensed appraiser.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The subject property is not single family, or none of the stated
        triggers applies.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    reads:
    - SubjectProperty.property_type
    - LoanCore.dscr_qualification_method
    computable_checks:
    - 0
    missing_reads:
    - Whether the transaction is a lease-option purchase
    - Whether the down payment required in §3.45 is generated from excess monthly
      rent contributions
    - Whether proposed rental income is being used to qualify
    - Whether Form 1007 is provided
    - Whether Form 1007 is from the original appraiser or a state licensed appraiser
  action: require_evidence
  priority: 100
  description: Verify that the required Single-Family Comparable Rent Schedule is
    provided when a stated trigger applies.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.4 Rent schedules
    and rent evidence
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-SCHEDULE
      job_kind: verification
    ledger:
      clause: 'PLAT-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA
        Form 1007) for single family properties on (i) all DSCR qualifying files,
        (ii) lease-option purchase transactions where the down payment required in
        §3.45 is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. A 1007 may be from the original appraiser
        or any state licensed appraiser. \[G §14.12, p. 4\]


        PLAT-3.10 Single family investment properties with excessive monthly rent
        payments reflected on the lease require documentation supporting that the
        monthly rent is typical for the area; acceptable documentation may include
        classified ads from local newspapers, a 1007 completed by the appraiser, or
        a market rent survey completed by a local real estate company or rental management
        company familiar with the market rents in the area. \[G §14.12, p. 4\]


        PLAT-3.11 Cash-out refinance: current lease agreement required (PLAT-1.5).
        \[P: Loan Purpose Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.asset_assessment.cltv_over_75_reserves
  condition:
    kind: procedure
    purpose: Assess the stated reserve trigger for loans with CLTV > 75.00%.
    steps:
    - 'Initial Document Review: Review bank statements for reserve information.'
    - 'Eligibility Verification: Determine whether CLTV is > 75.00%.'
    - 'Validation and Verification: If triggered, verify six months of reserves.'
    - 'Final Determination: Record whether the stated reserve requirement is met.'
    checks:
    - When CLTV is > 75.00%, six months of reserves are available.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every step is met and the stated reserve requirement is met when
        triggered.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A step is not met or six months of reserves are not available when
        triggered.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: CLTV is not > 75.00%.
      carries_conditions: false
    evidence_types:
    - bank_statement
    reads:
    - LoanCore.cltv_percent
    - RatioSet.reserves_months
    computable_checks:
    - 0
    missing_reads:
    - Verified reserve amount expressed in months
  action: require_evidence
  priority: 100
  description: Verify six months of reserves when CLTV is greater than 75.00%.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#8.2 Reserves by
    trigger, as stated
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Assets
      assistant:
      - Underwriter
      mnemonic: AFC-HIGHCLTVRESERVES
      job_kind: limit
    ledger:
      clause: 'PLAT-8.7 The sources state reserves only for the situations below and
        state the payment basis in none of them. The base requirement at CLTV of 75.00%
        or below, the payment basis (including on an interest-only loan), permitted
        sources, whether overlapping triggers are cumulative, and whether reserves
        substituted for rent loss insurance are additional: Acra confirmation requested
        → Q-08. \[P; G\]


        | **Trigger** | **Reserves as printed** | **Source** |

