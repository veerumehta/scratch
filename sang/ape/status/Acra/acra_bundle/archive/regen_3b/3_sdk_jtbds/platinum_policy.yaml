- rule_id: acra-platinum.compliance_and_closing.entity_guarantor_requirements
  condition:
    kind: procedure
    purpose: Establish the entity-borrower guarantor requirements.
    steps:
    - 'Initial Document Review: Review entity ownership documents, the application,
      and recourse guarantees.'
    - 'Eligibility Verification: Identify all individuals with direct or indirect
      ownership ≥ 20% of the entity and identify the guarantors.'
    - 'Validation and Verification: Verify that each identified individual provides
      an Acra approved guarantee or Exhibit 7; where there are multiple guarantors,
      verify that recourse is joint and several. Verify that at least one borrower
      / guarantor attests on the application that they are not a first-time homebuyer;
      if prior home ownership is not evident within the loan file, condition for supporting
      documentation as permitted by the guideline.'
    - 'Final Determination: Determine whether the guarantor requirements are met.'
    checks:
    - All individuals with direct or indirect ownership ≥ 20% provide an Acra approved
      guarantee or Exhibit 7.
    - Recourse is joint and several when there are multiple guarantors.
    - At least one guarantor has prior homeownership experience, with the required
      application attestation and supporting documentation when prior home ownership
      is not evident within the loan file.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All checks hold.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required supporting document has been conditioned for and remains
        to be obtained.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A check does not hold and the requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    - loan_application
    reads:
    - Borrower.is_first_time_homebuyer
    - Borrower.entity_type
    missing_reads:
    - Ownership percentages and whether ownership is direct or indirect.
    - Guarantee documents and whether multiple guarantors have joint and several recourse.
    - The application attestation and, if prior home ownership is not evident within
      the loan file, supporting documentation.
  action: require_evidence
  priority: 100
  description: Verify that each individual with direct or indirect ownership of at
    least 20% provides a required recourse guarantee and that at least one guarantor
    has prior homeownership experience.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity eligibility
    and guarantees ¶1
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity eligibility
    and guarantees ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Compliance
      assistant:
      - Underwriter
      mnemonic: BET-GUARANTORS
      job_kind: verification
    ledger:
      clause: 'PLAT-5.1 Business Entities are eligible for financing on business purpose
        transactions (investment properties exclusively). \[G §3.12, p. 7\]


        PLAT-5.2 Acra will lend to, and require that title to the collateral be held,
        either (i) directly by an individual person(s) or (ii) by an entity acceptable
        to Acra in its sole discretion. \[G §3.12, p. 7\]


        PLAT-5.3 Acra requires all individuals with direct or indirect ownership ≥
        20% to provide a recourse guarantee (Acra approved, or Exhibit 7) in the case
        of an entity borrower. All recourse is joint and several in the case of multiple
        guarantors. \[G §3.12, p. 7\]


        PLAT-5.4 An entity borrower must be a single purpose entity (SPE): “an entity
        with no assets other than residential investment or rental properties; engaged
        in the business of owning and operating residential investment or rental properties.”
        Series limited liability companies are not allowed. \[G §3.12, p. 7\]


        PLAT-5.5 All entities that will hold direct ownership of the subject property
        and will be on title as a direct owner are required to be a borrowing entity.
        \[G §3.12, p. 7\]


        PLAT-5.6 Changes to the operating agreement or bylaws with the intent of changing
        ownership percentages to circumvent required personal guarantors will not
        be considered. “Lookback to changes cannot occur within 30 days prior to an
        Application Date or throughout the application process as these changes will
        not be recognized by Acra Lending.” \[G §3.12, p. 7\]


        PLAT-5.7 Entity / guarantor types allowed: Domestic Corporations (C and S
        Corp); single purpose Limited Liability Companies (LLC), excluding series
        LLC; Limited Liability Partnership (LLP); Limited Liability Limited Partnership
        (LLLP); General Partnership (GP); Limited Partnership (LP); and Sole Proprietorship.
        “In all events, the Borrower must be a US formed and based Entity, foreign
        entities (i.e.: entities formed or based outside the US) or foreign owned
        entities are not allowed.” \[G §3.12, p. 8\]


        PLAT-5.8 Not allowed: Cooperatives, Irrevocable Trusts, Land Trusts, IRAs,
        Non-Profit, and Joint Ventures. “Business entity nesting is limited to only
        one (1) wholly-owned subsidiary that in turn must be owned by individual(s);
        multiple nesting or ownership by multiple entities, trusts, etcetera are not
        acceptable.” An illustration of the permitted structure: Acra confirmation
        requested → Q-18. \[G §3.12, p. 8\]


        PLAT-5.9 Acra requires at least one guarantor to have prior homeownership
        experience. At least one (1) borrower / guarantor on the loan must attest
        on the application that they are not a first-time homebuyer; if prior home
        ownership is not evident within the loan file, the underwriter reserves the
        right to condition for supporting documentation. \[G §3.12, p. 7\]'
  approval_refs: []
