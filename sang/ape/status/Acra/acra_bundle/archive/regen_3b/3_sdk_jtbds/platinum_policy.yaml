- rule_id: acra-platinum.asset_assessment.rent_loss_insurance
  condition:
    kind: procedure
    purpose: Assess whether rent loss insurance is required and, when required, whether
      the stated coverage is provided.
    steps:
    - 'Initial Document Review: Review the hazard insurance declarations for rent
      loss insurance coverage.'
    - 'Eligibility Verification: Determine whether the property is a one- to four-unit
      non-owner occupied income property, whether LTV is greater than 70%, and whether
      subject property rents are used to qualify. Apply the stated exemption that
      loans with ≤ 70% CLTV are not required to carry rent loss insurance.'
    - 'Validation and Verification: If the requirement applies, verify six (6) months''
      rent loss insurance coverage.'
    - 'Final Determination: Record whether required coverage is provided or the stated
      CLTV exemption applies.'
    checks:
    - Six (6) months' rent loss insurance is provided when the property is a one-
      to four-unit non-owner occupied income property with LTV > 70% and subject property
      rents are used to qualify, except that loans with ≤ 70% CLTV are not required
      to carry rent loss insurance.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every step is met and required coverage is provided, or the stated
        CLTV exemption applies.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A step is not met and the stated exemption does not apply, or required
        coverage is not provided.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property does not meet the stated one- to four-unit non-owner
        occupied income-property trigger.
      carries_conditions: false
    evidence_types:
    - hazard_insurance
    reads:
    - SubjectProperty.number_of_units
    - SubjectProperty.occupancy_subtype
    - LoanCore.cltv_percent
    missing_reads:
    - LTV
    - Whether subject property rents are used to qualify
    - Whether the property is an income property
