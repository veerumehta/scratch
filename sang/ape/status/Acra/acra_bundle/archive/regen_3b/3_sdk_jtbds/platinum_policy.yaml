- rule_id: acra-platinum.loan_program_eligibility.listed_for_sale_requirements
  condition:
    kind: procedure
    purpose: Decide whether a loan on a property listed for sale within six months
      meets the stated listed-property requirements.
    steps:
    - 'Step 1 - Initial Document Review: Review listing history, loan and lien information,
      occupancy and rent evidence, credit or reserve evidence, appraisal, and loan
      terms.'
    - 'Step 2 - Eligibility Verification: Determine whether the property has been
      listed for sale in the last six months, measured from the last date of being
      listed to the Application Date. If so, verify the stated requirements: no default
      or other delinquency on lien(s); tenant occupied and not vacant for an investment
      property; channel minimum DSCR; prepayment penalty of at least three (3) years
      unless the property is in a state that does not allow prepayment penalties;
      twenty-four (24) months of reserves; fully amortizing term; maximum LTV / CLTV
      65% based on the lesser of appraised value or lowest recent listing price; no
      subordinate financing; and impounds.'
    - 'Step 3 - Validation and Verification: Verify each applicable listed-property
      requirement against the supporting records. Interest only is not available on
      a property listed for sale.'
    - 'Step 4 - Final Determination: Record whether the listed-property requirements
      are met when the property is within the stated six-month period.'
    checks:
    - If the property has been listed for sale in the last six months, measured from
      the last date of being listed to the Application Date, all applicable stated
      listed-property requirements are met.
    - If the property has been listed for sale within six months, the loan is not
      interest only.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not within the stated six-month listing period, or
        all applicable listed-property checks hold.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required listed-property fact or condition remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is within the stated six-month listing period and any
        applicable listed-property check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - listing_history
    - loan_application
    - lease_agreement
    - rent_roll
    - credit_report
    - appraisal_report
    - hazard_insurance
    - title_commitment
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.is_listed_for_sale
    - SubjectProperty.is_vacant
    - SubjectProperty.has_current_lease
    - LoanCore.channel
    - LoanCore.cltv_percent
    - LoanCore.is_interest_only_10_40
    - MortgageLoanInformation.is_interest_only
    - RatioSet.reserves_months
    - LoanCore.prepayment_penalty_structure
    - SubjectProperty.appraised_value_usd
    computable_checks: []
    missing_reads:
    - Application Date
    - last date listed for sale
    - lien default or delinquency status
    - tenant occupancy evidence
    - prepayment penalty term and state allowance
    - reserves evidence
    - fully amortizing term evidence
    - subordinate financing status
    - impound status
    - lowest recent listing price
    - whether impounds are in place
  action: require_evidence
  priority: 100
  description: Verify the requirements stated for properties listed for sale within
    six months.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.3 Properties listed
    for sale (§11.5)
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.2 Interest-only
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#10.1 Structures
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Eligibility
      assistant:
      - Underwriter
      mnemonic: LPE-LISTING
      job_kind: limit
    ledger:
      clause: 'PLAT-7.6 A property is considered listed for sale under §11.5 if it
        has been listed for sale in the last six months, measured from (a) the last
        date of being listed to (b) the Application Date. \[G §11.5, p. 12\]


        PLAT-7.7 Whether §11.5 applies to Platinum Select unchanged is part of Q-13;
        it is restated here because the Platinum Summary does not exclude it. \[G
        §11.5\]


        PLAT-7.8 Loans on such properties will be considered under the following characteristics:
        the property is not in default or otherwise delinquent on lien(s); for investment
        properties, the subject must be occupied by a tenant and may not be vacant;
        the loan must qualify as either (a) ≥ 1.0 DSCR or (b) 43% maximum DTI — on
        this program the channel minimum DSCR applies, Wholesale 1.0 and Correspondent
        1.2 (PLAT-3.8), and the DTI alternative is Q-14; a prepayment penalty of at
        least three (3) years is required unless the property is in a state that does
        not allow prepayment penalties; twenty-four (24) months of reserves are required,
        and cash-in-hand may be considered if otherwise consistent with the Guide;
        the loan must have a fully amortizing term, interest only is not available;
        the maximum LTV / CLTV is 65% based on the lesser of (a) appraised value or
        (b) lowest recent listing price; no subordinate financing is allowed; impounds
        are required. \[G §11.5, pp. 11–12\]


        PLAT-9.3 “Interest-Only (5 Yr Term), Max CLTV: 75.00%”. \[P: Product Requirements
        — Restrictions\]


        PLAT-9.4 No minimum loan amount or minimum FICO is printed for interest-only
        loans on Platinum Select: Acra confirmation requested → Q-09. \[P: Product
        Requirements\]


        PLAT-9.5 Interest-only is not available on a property listed for sale (PLAT-7.8).
        \[G §11.5, p. 11\]


        PLAT-9.6 Interest Only payments are calculated as the amount sufficient to
        pay the accrued interest on the mortgage monthly at the time of origination,
        usually for a set term at the beginning of the repayment term; after that
        term the payments are recast to a fully amortized payment for the balance
        of the term ending at maturity. Acra calculates the DSCR using the first payment
        due under the Note (PLAT-3.5; which payment enters the denominator on an interest-only
        loan is Q-21). The excerpt''s DTI calculation for interest-only loans is a
        DTI-program provision — Q-14. \[G §7.5, p. 13\]


        PLAT-10.1 Prepayment penalty structures as printed. Whether a 4-year structure
        is available on Platinum Select: Acra confirmation requested → Q-19. \[P:
        Prepayment Penalty Requirements\]


        | **Term** | **Structures as printed** |

        |----|----|

        | 5 Year | 5% Fixed (5% / 5% / 5% / 5% / 5%) or Sequential Stepdown (5% /
        4% / 3% / 2% / 1%) |

        | 3 Year | 5% Fixed (5% / 5% / 5%) or 3% Fixed (3% / 3% / 3%) |

        | 2 Year | 3% Fixed (3% / 3%) |

        | 1 Year | 3% Fixed (3%) |

        | No Prepay | Listed as a structure |


        PLAT-10.2 A property listed for sale within six months requires a prepayment
        penalty of at least three (3) years unless the property is in a state that
        does not allow prepayment penalties (PLAT-7.8). How a state restriction interacts
        with that minimum: Acra confirmation requested → Q-19. \[G §11.5, p. 11\]'
  approval_refs: []
