      mnemonic: BET-DUEDILIGENCE
      job_kind: verification
    ledger:
      clause: 'PLAT-5.11 Borrower / Guarantor Due Diligence as described above is
        required to be current as of the date of any loan approval or draw. \[G §3.12,
        p. 9\]


        PLAT-5.12 Acra reviews the background of the Key Principals and Entities:
        in the case of entity borrowers, the entity, the recourse guarantor(s), and
        any party (individual or entity) that owns 20% or more of the entity directly
        or indirectly or has managing control; in the case of individual borrowers,
        all such individuals. Acra may order background checks on all Key Principals
        and Entities from Checkpoint, LexisNexis or another comparable provider, including
        criminal history, OFAC searches, litigation, judgment, and lien searches.
        \[G §3.12, p. 9\]'
