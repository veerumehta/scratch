- rule_id: acra-platinum.compliance_and_closing.prepayment_penalty_requirements.python
  condition:
    kind: python
    source: "import rules_lib\n\ndef check(ctx):\n    listed_raw = ctx['SubjectProperty.listed_for_sale_last_6_months']\n\
      \    structure = ctx['LoanCore.prepayment_penalty_structure']\n    state = ctx['SubjectProperty.state']\n\
      \    missing = rules_lib.gaps(listed_for_sale_last_6_months=listed_raw, prepayment_penalty_structure=structure,\
      \ state=state)\n    if missing:\n        return rules_lib.unknown(*missing)\n\
      \n    listed = rules_lib.flag(listed_raw)\n    if listed is None:\n        return\
      \ rules_lib.unknown('listed_for_sale_last_6_months')\n\n    five_fixed = rules_lib.same(structure,\
      \ '5 Year 5% Fixed') or rules_lib.same(structure, '5% Fixed (5% / 5% / 5% /\
      \ 5% / 5%)')\n    stepdown = rules_lib.same(structure, 'Sequential Stepdown')\
      \ or rules_lib.same(structure, 'Sequential Stepdown (5% / 4% / 3% / 2% / 1%)')\n\
      \    three_five = rules_lib.same(structure, '3 Year 5% Fixed') or rules_lib.same(structure,\
      \ '5% Fixed (5% / 5% / 5%)')\n    three_fixed = rules_lib.same(structure, '3%\
      \ Fixed (3% / 3% / 3%)')\n    two_fixed = rules_lib.same(structure, '2 Year\
      \ 3% Fixed') or rules_lib.same(structure, '3% Fixed (3% / 3%)')\n    one_fixed\
      \ = rules_lib.same(structure, '1 Year 3% Fixed') or rules_lib.same(structure,\
      \ '3% Fixed (3%)')\n    no_prepay = rules_lib.same(structure, 'No Prepay')\n\
      \n    if not (five_fixed or stepdown or three_five or three_fixed or two_fixed\
      \ or one_fixed or no_prepay):\n        return False\n    if listed and (two_fixed\
      \ or one_fixed or no_prepay):\n        return False\n\n    if rules_lib.same(state,\
      \ 'MS'):\n        property_type = ctx['SubjectProperty.property_type']\n   \
      \     units = ctx['SubjectProperty.number_of_units']\n        missing = rules_lib.gaps(property_type=property_type,\
      \ number_of_units=units)\n        if missing:\n            return rules_lib.unknown(*missing)\n\
      \        if rules_lib.same(property_type, 'Residential') and (units == 1 or\
      \ rules_lib.same(units, '1')):\n            return stepdown\n\n    return True"
