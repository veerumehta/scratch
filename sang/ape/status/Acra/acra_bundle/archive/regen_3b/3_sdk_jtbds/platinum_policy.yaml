      and appraisal report for loan purpose, scores, CLTV, and value.'
    - 'Step 2 - Eligibility Verification: Use the printed matrix row for the applicable
      FICO threshold and the applicable Purchase, Rate & Term, or Cash-Out column.
      The printed thresholds are 730, 721, and 700; no row is printed below 700.'
