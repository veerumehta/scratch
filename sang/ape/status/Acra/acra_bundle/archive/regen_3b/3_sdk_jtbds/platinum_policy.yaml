- rule_id: acra-platinum.compliance_and_closing.entity_documentation_package
  condition:
    kind: procedure
    purpose: Establish that the required entity documentation has been provided without
      exception, subject to the stated EIN exception process and Legal's right to
      condition for additional documentation.
    steps:
    - 'Initial Document Review: Collect and review the entity''s formation documents
      and amendments; Operating Agreement with referenced exhibits for LLCs and Partnerships
      or Bylaws for corporations and amendments; ownership-interest evidence; applicable
      stock certificates, stock ledger, K-1 statements, CPA or Tax Preparer letter,
      and Affidavit of Lost Stock Certificate; identification; Certificate of Good
      Standing or equivalent; applicable foreign qualification; IRS Form SS4, TIN,
      or EIN issuance letter; Unanimous Written Consent / Board Resolution; and any
      required Power of Attorney.'
    - 'Eligibility Verification: Confirm the required documents are provided without
      relying on borrower letters stating that documents are not required, available,
      or excused. Confirm that applicable Operating Agreements or Bylaws state whether
      the entity is member or manager managed, authorize borrowing money and entering
      into contracts for mortgage assets, and designate signers.'
    - 'Validation and Verification: Verify legibility, completeness, required ownership
      information, matching names or a letter of explanation, Certificate of Good
      Standing validity within ninety (90) days of the closing date, applicable foreign
      qualification, and the required authorization and signer information. Apply
      the stated ownership-evidence requirements for LLCs, Partnerships, S or C Corporations,
      and the stated S-corporation or Partnership fallback when both stock certificate
      and stock ledger are unavailable. An EIN exception request may be submitted
      for review by Acra''s Legal Department with a letter of explanation stating
      the applicable grounds. Do not use a Unanimous Written Consent / Board Resolution
      to designate a signor on a personal guarantee. Obtain a Power of Attorney when
      a principal designates an attorney in fact to execute a personal guarantee.
      Refer additional supporting-documentation requests to Legal as applicable.'
    - 'Final Determination: Determine whether the required entity documentation has
      been provided and meets the applicable stated requirements.'
    checks:
    - The required entity documents are provided, complete, legible, and satisfy the
      applicable content, ownership, name, timing, qualification, authorization, and
      signer requirements.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required document or additional supporting documentation has been
        conditioned for and remains to be obtained.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A required document is absent or the check does not hold, and the
        requirement has not been met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_documents_complete
    - Borrower.entity_type
    missing_reads:
    - The applicable entity type and document requirements; the documents and amendments
      provided; their legibility and contents; identity-name comparison; closing date;
      ownership evidence; and whether an EIN exception request or Power of Attorney
      applies.
  action: require_evidence
  priority: 100
  description: Verify the required entity documents are complete, legible, applicable,
    and meet the stated content and timing requirements.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.2 Entity documentation
    ¶1
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.2 Entity documentation
    ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Compliance
      assistant:
      - Processor
      mnemonic: BET-ENTITYDOCS
      job_kind: verification
    ledger:
      clause: 'PLAT-5.10 The documents below are required, without exception, and
        borrower letters stating that they are not required, available, or excused
        from providing such documents are not acceptable. \[G §3.12, pp. 8–9\]


        - Complete, legible copy of the Certificate of Formation / Articles of Organization
        and all amendments thereto.


        - Complete (with all referenced exhibits), legible copy of the Operating Agreement
        for LLCs and Partnerships, or Bylaws for corporations, and all amendments,
        that states whether the entity is member or manager managed, contains authorization
        to borrow money and enter into contracts for mortgage assets, and designates
        signers. Additional information may be required if the formation documents
        and the Operating Agreement or Bylaws conflict.


        - All documentation evidencing ownership interests: for LLCs and Partnerships,
        the Operating Agreement must identify, or attach as an exhibit, all persons
        by name with their ownership interest, or provide copies of the membership
        interest certificates / units in compliance with the Operating Agreement.


        - For S or C Corporations: shareholder / stockholder certificates that comply
        with the Bylaws, if any, or, if stock certificates are lost or unavailable,
        the corporation''s stock ledger. The certificate or ledger must account for
        all outstanding shares noted in the Certificate of Formation / Articles of
        Organization, including those held by the corporation. If stock certificates
        are lost, destroyed, mutilated, or otherwise unavailable, an Affidavit of
        Lost Stock Certificate is required.


        - For S-corporations or Partnerships, where both stock certificate and stock
        ledger are unavailable: (i) the most recent preceding tax year''s K-1 statement
        for all members with 20% or more interest, and (ii) a letter from the CPA
        or Tax Preparer affirming current ownership interest, with a statement to
        that effect if the preceding year''s taxes have not been filed.


        - Names on the entity documents must match the identification; if they do
        not match exactly, a letter of explanation is required to address the discrepancy.


        - Certificate of Good Standing or equivalent document valid within ninety
        (90) days of the closing date.


        - Certificate of Foreign Qualification or other qualification to operate in
        the state where business is being conducted, if the entity is formed in a
        state other than where business is performed or where the property is located.


        - IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or Employer
        Identification Number (EIN) issuance letter for the entity. EIN exception
        requests may be submitted for review by Acra''s Legal Department with a letter
        of explanation stating the applicable grounds.


        - A Unanimous Written Consent / Board Resolution signed by all members regardless
        of their percentage of interest, (i) authorizing the transaction with Acra
        Lending and (ii) identifying who is authorized to sign the loan documents
        on behalf of and to bind the entity. It may be required by the Operating Agreement
        or Bylaws even where ownership is held by one individual. It cannot be used
        to designate a signor on a personal guarantee, only an authorized signor for
        the loan documents signed by the entity.


        - A Power of Attorney must be utilized by the principal to designate an attorney
        in fact to execute a personal guarantee; see §23.5(C), not reproduced (Appendix
        B).


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
  approval_refs: []
- rule_id: acra-platinum.compliance_and_closing.entity_due_diligence_currency
  condition:
