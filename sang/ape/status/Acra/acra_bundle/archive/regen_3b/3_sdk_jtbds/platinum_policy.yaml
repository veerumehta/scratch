- rule_id: acra-platinum.income_stability_sufficiency_analysis.actual_rent_evidence
  condition:
    kind: procedure
    purpose: Verify that actual rent meets the Platinum Select documentation and lease-duration
      requirements when actual rent is used.
    steps:
    - 'Initial Document Review: Review the lease_agreement and bank_statement when
      actual rent is used.'
    - 'Eligibility Verification: Determine whether actual rent is used and whether
      it is long-term rent; actual-rent treatment is not appropriate for short-term
      rentals.'
    - 'Validation and Verification: Verify evidence of 2 months’ proof of receipts
      and that the lease is in place for at least 3 months after the loan closing.'
    - 'Final Determination: Record whether all applicable actual-rent requirements
      are met.'
    checks:
    - When actual rent is used, it is long-term rent.
    - When actual rent is used, it is documented via evidence of 2 months’ proof of
      receipts.
    - When actual rent is used, the lease is in place for at least 3 months after
      the loan closing.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Actual rent is used and all three actual-rent requirements hold.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Actual rent is used and any of the three actual-rent requirements
        does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Actual rent is not used.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    - bank_statement
    reads: []
    computable_checks: []
    missing_reads:
    - Whether actual rent is used
    - Whether the rent is long-term
    - Evidence of 2 months’ proof of receipts
    - Loan closing date
    - Lease end date
  action: require_evidence
  priority: 100
  description: Verify the required evidence and lease term when actual rent is used
    for qualifying rent.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying rent,
    as printed in the Platinum Summary
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-ARE
      job_kind: verification
    ledger:
      clause: 'PLAT-3.1 “When calculating the DSCR, Acra will use the greater of the
        market rent as established on the 1007 or 1025, or actual rent. When using
        actual rent, the actual rent must be documented via evidence of 2 months’
        proof of receipts and the lease must be in place for at least 3 months after
        the loan closing. This applies to long-term rents only and is not appropriate
        for short-term rentals.” \[P: Income Documentation & Debt Ratio Requirements\]


        PLAT-3.2 §5.32 of the excerpt states the general formula as “the lesser of
        (i) annual in-place rent or (ii) market rent”, then notes that “Acra may use
        the higher of actual or market rents” subject to “two (2) consecutive months
        proof of rental income receipt”, a lease continuing at least three months
        after closing, and: “Security Deposit does not count towards receipt, and
        the rents cannot be prepaid.” The Platinum Summary''s statement (PLAT-3.1)
        is program-specific; the excerpt''s general formula is reproduced here. Which
        governs Platinum Select and how they relate, whether “2 months’ proof of receipts”
        means consecutive months, and whether the security-deposit and prepaid-rent
        conditions apply: Acra confirmation requested → Q-03. \[G §5.32, p. 3\]


        PLAT-3.3 Short-term rentals are ineligible for the program (PLAT-7.2); the
        Seller''s Guide provisions on short-term rental income and appraisal forms
        are not restated (Appendix B). \[P: Subject Property Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.income_stability_sufficiency_analysis.channel_minimum_dscr
  condition:
    kind: procedure
    purpose: Determine whether the loan meets the applicable Platinum Select minimum
      DSCR.
    steps:
    - 'Initial Document Review: Review the DSCR calculation and identify the loan
      channel.'
    - 'Eligibility Verification: Apply the Correspondent minimum of ≥ 1.2 or the Wholesale
      minimum of ≥ 1.0, as applicable.'
    - 'Validation and Verification: Compare the calculated DSCR with the applicable
      channel minimum.'
    - 'Final Determination: Record whether the DSCR meets the applicable minimum.'
    checks:
    - LoanCore.channel is Correspondent or Wholesale.
    - The DSCR is ≥ 1.2 for Correspondent or ≥ 1.0 for Wholesale.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The loan channel is Correspondent or Wholesale and the DSCR meets
        that channel's minimum.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The DSCR is below the applicable channel minimum.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads:
    - LoanCore.channel
    computable_checks:
    - 0
    missing_reads:
    - Calculated DSCR
  action: require_evidence
  priority: 100
  description: Verify that the DSCR meets the minimum for the loan channel.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy, purpose
    and qualification ¶2
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.3 Minimum ratio
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-MIN
      job_kind: limit
    ledger:
      clause: 'PLAT-1.7 The program is offered through two channels with different
        minimum ratios: Correspondent ≥ 1.2, Wholesale ≥ 1.0 (PLAT-3.7). Matrix footnote
        3 also restricts Correspondent pricing (PLAT-2.3). \[P: Minimum DSCR; matrix
        footnote 3\]


        PLAT-1.8 Every loan must meet the applicable channel minimum DSCR. The Platinum
        Summary lists no No Ratio option and no allowance for a ratio below 1.0; a
        ratio below the channel minimum does not meet the published requirement. Whether
        No Ratio or sub-1.0 qualification exists on this program in any form: Acra
        confirmation requested → Q-12. \[P: Minimum DSCR\]


        PLAT-1.9 Acra will not calculate a DTI for applicants who qualify using a
        DSCR; income or employment listed on an application is superfluous to the
        underwrite and may be left blank, and if represented, a DTI should not be
        calculated. The Standard Summary''s statement that borrowing-entity income
        documentation is not required does not appear in the Platinum Summary; whether
        it applies: Acra confirmation requested → Q-13. \[G §7.3, p. 5\]


        PLAT-1.10 “A 1007 will always be required on DSCR transactions”; the Platinum
        Summary refers to market rent “as established on the 1007 or 1025”. Whether
        a Form 1025 alone satisfies the requirement for a two-unit property: Acra
        confirmation requested → Q-04. \[G §5.32, p. 3; §14.12, p. 4; P: Income Documentation\]


        PLAT-1.11 All borrowers purchasing or refinancing a one- to four-family investment
        property must execute a One- to Four-Family Rider with the loan documents
        and provide rent loss insurance coverage per §23.40 (PLAT-7.9 to 7.12). \[G
        §3.41, p. 11\]


        PLAT-1.12 Only the subject property, principal residence and second homes
        are required to be listed on the application or Schedule of Real Estate Owned.
        \[G §5.32, p. 3; §4.15, p. 5\]


        PLAT-3.7 Minimum Debt Service Coverage Ratio: Correspondent ≥ 1.2; Wholesale
        ≥ 1.0. \[P: Minimum DSCR\]


        PLAT-3.8 Property listed for sale within six months (§11.5): the excerpt requires
        “≥1.0 DSCR”; on this program the channel minimum applies — Wholesale 1.0,
        Correspondent 1.2 (PLAT-7.8). \[G §11.5, p. 11; P: Minimum DSCR\]'
