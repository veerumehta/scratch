    jtbd:
      source: NEW
      section_type: Assets
      assistant:
      - Underwriter
      mnemonic: AFC-RENTLOSS
      job_kind: verification
    ledger:
      clause: 'PLAT-7.9 Rent loss insurance covers rental losses that are incurred
        during the period that a property is being rehabilitated following a casualty.
        \[G §23.40, p. 13\]


        PLAT-7.10 Six (6) months'' rent loss insurance is required on one- to four-unit
        non-owner occupied income properties with LTV \> 70% and when subject property
        rents are used to qualify. \[G §23.40, p. 13\]


