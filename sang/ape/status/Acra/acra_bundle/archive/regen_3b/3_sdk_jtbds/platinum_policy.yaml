      verdict: satisfied
      criterion: All required entity documents and their required contents are provided
        and meet the stated requirements.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required supporting document or additional supporting documentation
        has been conditioned for and remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A required document is missing, unacceptable, incomplete where required,
        or does not meet a stated requirement; a borrower letter claiming a required
        document is not required, available, or excused is not acceptable.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
