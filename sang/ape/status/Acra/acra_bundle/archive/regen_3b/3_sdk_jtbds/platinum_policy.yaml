- rule_id: acra-platinum.liabilities_assessment.listed_property_qualification
  condition:
    kind: procedure
    purpose: Establish the stated qualification requirement for a listed property
      without resolving the requested Acra confirmation on the DTI alternative or
      interest-only DSCR calculation.
    steps:
    - 'Initial Document Review: Review the loan application and rent roll for the
      information used to assess qualification.'
    - 'Eligibility Verification: Apply this requirement when the property was listed
      for sale in the last six months. The stated alternatives are ≥ 1.0 DSCR or 43%
      maximum DTI; the channel minimum DSCR applies, Wholesale 1.0 and Correspondent
      1.2.'
    - 'Validation and Verification: Verify qualification against the stated DSCR or
      DTI alternative. Do not resolve the requested Acra confirmation for the DTI
      alternative (Q-14) or, for an interest-only loan, the payment used in the DSCR
      denominator (Q-21).'
    - 'Final Determination: Record whether a stated qualification alternative is met,
      or whether the case depends on a requested confirmation.'
    checks:
    - 'If the property was listed for sale in the last six months, the loan qualifies
      under the applicable stated alternative: DSCR meets the channel minimum (Wholesale
      1.0 or Correspondent 1.2), or DTI is no more than 43%.'
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property was listed for sale in the last six months and the loan
        meets a stated qualification alternative without relying on a requested confirmation.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The property was listed for sale in the last six months, and qualification
        depends on the 43% DTI alternative pending Acra confirmation (Q-14), or on
        an interest-only DSCR calculation pending Acra confirmation (Q-21).
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property was listed for sale in the last six months and neither
        stated qualification alternative is met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property was not listed for sale in the last six months.
      carries_conditions: false
    evidence_types:
    - loan_application
    - rent_roll
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - LoanCore.channel
    - LoanCore.dscr_qualification_method
    - RatioSet.total_monthly_income_usd
    - RatioSet.total_monthly_obligation_usd
    - MortgageLoanInformation.is_interest_only
    - LoanCore.is_interest_only_10_40
    computable_checks: []
    missing_reads:
    - Qualifying DSCR and the data needed to verify it
    - DTI alternative applicability pending Acra confirmation (Q-14)
    - For an interest-only loan, Acra confirmation of the payment used in the DSCR
      denominator (Q-21)
