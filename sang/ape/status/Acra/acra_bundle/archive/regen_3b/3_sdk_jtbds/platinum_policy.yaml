- rule_id: acra-platinum.loan_program_eligibility.product_eligibility
  condition:
    kind: procedure
    purpose: Decide whether the selected product and any interest-only terms meet
      the stated product requirements.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application and note terms
      for product, ARM terms, and interest-only status.'
    - 'Step 2 - Eligibility Verification: Verify that the product is 30 Yr Fixed,
      5 Yr ARM, 30 Yr Fixed Interest-Only, or 5 Yr ARM Interest-Only. For an ARM,
      verify Index 1 Yr CMT; Caps 2/2/6; and the printed margin: 3.00 (FICO 760+),
      3.25 (FICO 720-759), or 3.50 (FICO 700-719).'
    - 'Step 3 - Validation and Verification: For Interest-Only, verify the 5 Yr Term
      and maximum CLTV 75.00%; verify that the property is not listed for sale. The
      minimum loan amount or minimum FICO for interest-only is not specified here.'
    - 'Step 4 - Final Determination: Record whether the selected product and applicable
      printed terms meet the requirements.'
    checks:
    - The product is one of the four listed eligible product types.
    - If the product is an ARM, its Index is 1 Yr CMT, Caps are 2/2/6, and its margin
      matches the printed FICO band.
    - If the product is Interest-Only, it has a 5 Yr Term and CLTV no greater than
      75.00%.
    - An Interest-Only loan is not on a property listed for sale.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All applicable product checks hold.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Product or term information needed to establish an applicable check
        remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Any applicable product check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - loan_application
    reads:
    - CreditReport.representative_score
    - LoanCore.note_rate_percent
    - LoanCore.cltv_percent
    - MortgageLoanInformation.is_interest_only
    - LoanCore.is_interest_only_10_40
    - SubjectProperty.is_listed_for_sale
    computable_checks:
    - 3
    missing_reads:
    - selected product type
    - ARM index and caps
    - ARM margin
    - Interest-Only term
    - CLTV used for the Interest-Only maximum comparison
  action: require_evidence
  priority: 100
  description: Verify product eligibility and the printed interest-only restrictions.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.1 Eligible products
    and ARM terms
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.2 Interest-only
  on_violation: fail
