- rule_id: acra-platinum.compliance_and_closing.listed_property_requirements
  condition:
    kind: procedure
    purpose: Determine whether the loan meets the stated §11.5 requirements for a
      property listed for sale in the last six months.
    steps:
    - 'Initial Document Review: Review the listing history, lien status, occupancy,
      qualification, loan terms, reserves, value, financing, and impound information.'
    - 'Eligibility Verification: Determine whether the property has been listed for
      sale in the last six months, measured from the last date of being listed to
      the Application Date.'
    - 'Validation and Verification: For an applicable property, verify it is not in
      default or otherwise delinquent on lien(s); for an investment property, verify
      it is occupied by a tenant and is not vacant; verify qualification as either
      ≥ 1.0 DSCR or 43% maximum DTI, applying the channel minimum DSCR of Wholesale
      1.0 and Correspondent 1.2; verify twenty-four (24) months of reserves; a fully
      amortizing term and no interest only; maximum LTV / CLTV of 65% based on the
      lesser of appraised value or lowest recent listing price; no subordinate financing;
      and impounds. Cash-in-hand may be considered if otherwise consistent with the
      Guide.'
    - 'Final Determination: Determine whether the applicable listed-property requirements
      are met. The source states that whether §11.5 applies to Platinum Select unchanged
      is part of Q-13; the DTI alternative is Q-14.'
    checks:
    - The property has been listed for sale in the last six months measured from the
      last date of being listed to the Application Date, or the job is not applicable.
    - The property is not in default or otherwise delinquent on lien(s).
    - If the property is an investment property, it is occupied by a tenant and is
      not vacant.
    - The loan qualifies as either ≥ 1.0 DSCR or 43% maximum DTI, applying the channel
      minimum DSCR of Wholesale 1.0 and Correspondent 1.2.
    - The loan has twenty-four (24) months of reserves.
    - The loan has a fully amortizing term and is not interest only.
    - LTV / CLTV is no more than 65% based on the lesser of appraised value or lowest
      recent listing price.
    - There is no subordinate financing.
    - Impounds are in place.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is listed for sale in the last six months and all applicable
        checks hold.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is listed for sale in the last six months and an applicable
        check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property has not been listed for sale in the last six months.
      carries_conditions: false
    evidence_types:
    - listing_history
    - rent_roll
    - title_commitment
    - appraisal_report
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.is_vacant
    - SubjectProperty.has_current_lease
    - LoanCore.channel
    - LoanCore.cltv_percent
    - LoanCore.is_interest_only_10_40
    - MortgageLoanInformation.is_interest_only
    - SubjectProperty.appraised_value_usd
    - RatioSet.reserves_months
    computable_checks:
    - 0
    - 5
    missing_reads:
    - Application Date and last date listed; lien default or delinquency status; tenant
      occupancy; DSCR or DTI qualification and the applicable program channel minimum;
      lowest recent listing price; subordinate financing; and impound status.
  action: require_evidence
  priority: 100
  description: Verify the stated occupancy, qualification, reserves, amortization,
    CLTV, subordinate-financing, and impound requirements for a property listed for
    sale in the last six months.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.3 Properties listed
    for sale (§11.5)
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Compliance
      assistant:
      - Underwriter
      mnemonic: BET-LISTEDPROPERTY
      job_kind: limit
    ledger:
      clause: 'PLAT-7.6 A property is considered listed for sale under §11.5 if it
        has been listed for sale in the last six months, measured from (a) the last
        date of being listed to (b) the Application Date. \[G §11.5, p. 12\]


        PLAT-7.7 Whether §11.5 applies to Platinum Select unchanged is part of Q-13;
        it is restated here because the Platinum Summary does not exclude it. \[G
        §11.5\]


        PLAT-7.8 Loans on such properties will be considered under the following characteristics:
        the property is not in default or otherwise delinquent on lien(s); for investment
        properties, the subject must be occupied by a tenant and may not be vacant;
        the loan must qualify as either (a) ≥ 1.0 DSCR or (b) 43% maximum DTI — on
        this program the channel minimum DSCR applies, Wholesale 1.0 and Correspondent
        1.2 (PLAT-3.8), and the DTI alternative is Q-14; a prepayment penalty of at
        least three (3) years is required unless the property is in a state that does
        not allow prepayment penalties; twenty-four (24) months of reserves are required,
        and cash-in-hand may be considered if otherwise consistent with the Guide;
        the loan must have a fully amortizing term, interest only is not available;
        the maximum LTV / CLTV is 65% based on the lesser of (a) appraised value or
        (b) lowest recent listing price; no subordinate financing is allowed; impounds
        are required. \[G §11.5, pp. 11–12\]'
  approval_refs: []
- rule_id: acra-platinum.compliance_and_closing.prepayment_penalty_requirements
  condition:
    kind: procedure
    purpose: Apply the printed prepayment penalty structures, the listed-property
      minimum, and the state restrictions as printed.
    steps:
    - 'Initial Document Review: Review the selected prepayment penalty structure,
      property listing history, state, property type, unit count, loan purpose, borrower/entity
      status, loan amount, and interest rate.'
    - 'Eligibility Verification: Determine whether the property was listed for sale
      within six months and whether a printed state restriction applies.'
    - 'Validation and Verification: Verify that a property listed for sale within
      six months has a prepayment penalty of at least three (3) years unless it is
      in a state that does not allow prepayment penalties. Compare the selected structure
      with the structures printed for 5 Year, 3 Year, 2 Year, 1 Year, and No Prepay.
      Apply the state restrictions using their exact printed wording; do not infer
      what BUY-OUT requires. The source asks for Acra confirmation about availability
      of a 4-year structure and how a state restriction interacts with the three-year
      minimum.'
    - 'Final Determination: Determine whether the selected structure meets the applicable
      stated requirements, and flag unresolved Acra confirmation questions rather
      than resolving them by assumption.'
    checks:
    - If the property was listed for sale within six months, the prepayment penalty
      is at least three (3) years unless the property is in a state that does not
      allow prepayment penalties.
    - 'The selected structure is one of the structures printed: 5 Year 5% Fixed (5%
      / 5% / 5% / 5% / 5%) or Sequential Stepdown (5% / 4% / 3% / 2% / 1%); 3 Year
      5% Fixed (5% / 5% / 5%) or 3% Fixed (3% / 3% / 3%); 2 Year 3% Fixed (3% / 3%);
      1 Year 3% Fixed (3%); or No Prepay.'
    - The selected prepayment structure complies with the restriction printed for
      the subject property's state, property type, unit count, transaction, borrower/entity
      status, loan amount, and interest rate, as applicable.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All applicable checks hold.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Acra confirmation or a required condition remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - listing_history
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.state
    - SubjectProperty.property_type
    - SubjectProperty.number_of_units
    - LoanCore.loan_purpose
    - Borrower.entity_type
    - LoanCore.total_loan_amount_usd
    - LoanCore.note_rate_percent
