- rule_id: acra-platinum.title_review.revocable_living_trust_vesting
  condition:
    kind: procedure
    purpose: Determine whether title vesting in the inter vivos revocable trust satisfies
      PLAT-5.13.
    steps:
    - 'Step 1 - Initial Document Review: Review the complete, legible Trust or Certification
      of Trust and the title documents.'
    - 'Step 2 - Eligibility Verification: Verify the Trust’s required contents, validity
      under the laws of the state in which it is established, revocability, establishment
      by natural person(s) during their lifetime, and that the primary beneficiary
      is the individual(s) establishing it.'
    - 'Step 3 - Validation and Verification: Verify the Trustee powers and required
      lender protections; if the Trustor(s) and Trustee(s) are not the same, obtain
      written exception by Acra Senior Management. Review any additional supporting
      documentation conditioned for by Legal.'
    - 'Step 4 - Final Determination: Determine whether all trust vesting requirements
      are met.'
    checks:
    - The Trust satisfies all requirements stated in PLAT-5.13, including required
      documentation and trust provisions, and written exception by Acra Senior Management
      is obtained if the Trustor(s) and Trustee(s) are not the same.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All requirements stated in PLAT-5.13 are met, including any required
        written exception.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required trust document, written exception, or additional supporting
        document remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The Trust is irrevocable, fails a stated trust requirement, or otherwise
        does not satisfy PLAT-5.13.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The subject property is not vested in an inter vivos revocable trust.
      carries_conditions: false
    evidence_types:
    - entity_documents
    - title_commitment
    reads:
    - Borrower.entity_type
    missing_reads:
    - Complete Trust or Certification of Trust and its required contents
    - Evidence that the Trust is valid under the laws of the state in which it is
      established
    - Evidence of revocability, establishment, lifetime effectiveness, and primary
      beneficiary
    - Trust provisions on Trustee authority, beneficiary consent, lender risk, and
      creditor rights
    - Written exception by Acra Senior Management if Trustor(s) and Trustee(s) are
      not the same
    - Any additional supporting documentation conditioned for by Legal
  action: require_evidence
  priority: 100
  description: Verify each requirement for title vesting in an inter vivos revocable
    trust, including any required written exception by Acra Senior Management.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.4 Revocable living
    trusts
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Title
      assistant:
      - Underwriter
      mnemonic: TTL-TRUSTVESTING
      job_kind: verification
    ledger:
      clause: 'PLAT-5.13 Title vesting in an inter vivos revocable trust is permitted
        when all of the following requirements are followed. \[G §3.12, pp. 9–10\]


        - A complete, legible copy of the Trust, or a Certification of Trust stating:
        the existence and date of the Trust; the Trustor(s) and the current Trustee(s);
        the powers of the Trustee; whether the Trust is revocable and, if revocable,
        who holds the right to revoke; the names and number of the Trustees required
        to sign on behalf of the Trust; the Trust identification number (a Social
        Security number or an IRS-issued Tax Identification Number); how title to
        the Trust assets should be taken; and a statement that the Trust has not been
        revoked, modified, or amended in any manner.


        - The Trust must be valid under the laws of the state in which it is established.


        - The Trust must be revocable, meaning it can be changed or canceled at any
        time for any reason during a Trustor''s lifetime. Irrevocable trust is not
        permitted.


        - The Trust must be established by one or more natural persons, solely or
        jointly (Grantor, Trustor, or Settlor), and must become effective during the
        lifetime of the person(s) establishing it.


        - The primary beneficiary of the Trust must be the individual(s) establishing
        the Trust.


        - Written exception by Acra Senior Management must be obtained if the Trustor(s)
        and Trustee(s) are not the same.


        - The Trust must specify that the Trustee has the power to hold title and
        mortgage the property; that the beneficiary does not need to grant written
        consent for the Trust to borrow money, or that such consent has been granted
        in writing for purposes of the mortgage; that there is no unusual risk or
        impairment to the lender''s rights; and that holding title in the Trust does
        not diminish the lender''s rights as a creditor.


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
