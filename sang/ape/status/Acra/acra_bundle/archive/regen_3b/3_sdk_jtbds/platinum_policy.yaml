- rule_id: acra-platinum.title_review.entity_documentation
  condition:
    kind: procedure
    purpose: Determine whether the required entity documentation is provided and satisfies
      PLAT-5.10 and the related entity-document requirements.
    steps:
    - 'Step 1 - Initial Document Review: Review the complete, legible Certificate
      of Formation / Articles of Organization and amendments; applicable Operating
      Agreement or Bylaws and amendments with referenced exhibits; ownership-interest
      evidence; and the applicable certificates, ledger, affidavit, K-1 statements,
      and CPA or Tax Preparer letter described in PLAT-5.10.'
    - 'Step 2 - Eligibility Verification: Review name consistency with identification,
      the Certificate of Good Standing or equivalent valid within ninety (90) days
      of the closing date, any required foreign qualification, IRS Form SS4 or TIN
      / EIN issuance letter, and the Unanimous Written Consent / Board Resolution.'
    - 'Step 3 - Validation and Verification: Verify the Operating Agreement or Bylaws
      states management type, authorization to borrow money and enter into contracts
      for mortgage assets, and designated signers; verify ownership evidence, required
      authorizations, and any required discrepancy letter, Power of Attorney, or additional
      supporting documentation. Do not accept borrower letters stating that required
      documents are not required, available, or excused from providing them.'
    - 'Step 4 - Final Determination: Determine whether all required documents and
      contents are present and acceptable, without exception.'
    checks:
    - All entity documents required by PLAT-5.10 and the related requirements in U31
      are provided, legible where required, complete where required, current where
      specified, consistent, and contain the required information and authorization.
