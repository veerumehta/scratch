- rule_id: acra-platinum.credit_review_analysis.mortgage_and_rental_history
  condition:
    kind: procedure
    purpose: Determine whether the required mortgage and rental history has been documented
      and evaluated for the applicable properties.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit_report for all reported
      mortgages and review available records for mortgages not reported and for rental
      history.'
    - 'Step 2 - Eligibility Verification: For DSCR loans, require documentation of
      payment history for the subject property, primary residence, and second homes,
      if applicable. Additional properties do not require documented housing history
      unless documents in the file suggest a major credit event has occurred.'
    - 'Step 3 - Validation and Verification: Evaluate the ratings for properties the
      borrower owns and/or rents over the last twelve (12) months. For mortgages not
      reported on credit, the file should contain documentation to evaluate the history
      on the applicant''s primary residence(s), any secondary residence(s), and the
      subject property. Rate a matured loan based on its maturity date; any extension
      of the maturity date must be in writing.'
    - 'Step 4 - Final Determination: Record whether the required history was documented
      and evaluated for the applicable properties and whether any maturity-date extension
      is in writing.'
    checks:
    - The required mortgage and rental history for the applicable properties is documented
      and evaluated over the last twelve (12) months.
    - Any matured loan is rated based on its maturity date, and any extension of the
      maturity date is in writing.
    - Additional properties not required for DSCR housing-history documentation are
      not required unless file documents suggest a major credit event.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All applicable mortgage and rental history is documented and evaluated
        as required.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Required mortgage or rental history is not documented or evaluated,
        or a matured loan or extension is not handled as stated.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - credit_report
    - lease_agreement
    - rent_roll
    - bank_statement
    reads:
    - LoanCore.dscr_qualification_method
    - SubjectProperty.has_current_lease
    missing_reads:
    - Mortgage and rental payment history for applicable properties
    - Written maturity-date extension, if any
    - Documents, if any, suggesting a major credit event
  action: require_evidence
  priority: 100
  description: Verify the required mortgage and rental payment history documentation
    for the subject property, principal residence, and applicable second home.
  citations:
