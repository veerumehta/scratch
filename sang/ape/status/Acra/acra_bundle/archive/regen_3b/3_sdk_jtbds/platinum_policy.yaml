- rule_id: acra-platinum.asset_assessment.funds_to_close_seasoning_verification
  condition:
    kind: procedure
    purpose: Assess the stated funds-to-close verification triggers and the minimum
      30-days documentation requirement.
    steps:
    - 'Initial Document Review: Review the bank statement for the most recent month(s)
      and identify the source account(s) for funds to close.'
    - 'Eligibility Verification: Determine whether the transaction is a consumer transaction,
      or a business purpose loan where funds to close are over $50,000 and CLTV is
      over 70%. Whether any loan on this program is a consumer transaction is unresolved
      in the source.'
    - 'Validation and Verification: Where account(s) serving as the source of funds
      must be verified, review bank statement(s) for the most recent month(s), or
      a VOD reflecting a current and average balance for the most recent month(s).
      Verify that all transactions have a minimum of 30-days documentation.'
    - 'Final Determination: Record whether the applicable funds-to-close verification
      and minimum documentation requirements are met.'
    checks:
    - Seasoning of funds to close is verified on loans over 70% CLTV for consumer
      transactions, or on business purpose loans where funds to close are over $50,000
      and over 70% CLTV.
    - All transactions have a minimum of 30-days documentation.
