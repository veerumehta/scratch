- rule_id: acra-standard.asset_assessment.listed_property_reserves
  condition:
    kind: procedure
    purpose: Determine whether the stated reserve requirement is met for a property
      listed for sale within six months.
    steps:
    - 'Initial Document Review: Review listing history and documentation of reserves
      or cash-in-hand.'
    - 'Eligibility Verification: Determine whether the property was listed for sale
      within six months.'
    - 'Validation and Verification: Verify Twenty-four (24) months of reserves; assess
      cash-in-hand only if otherwise consistent with the Guide.'
    - 'Final Determination: Pass only if the applicable reserve requirement is met.'
    checks:
    - When the property was listed for sale within six months, Twenty-four (24) months
      of reserves are verified, with cash-in-hand considered only if otherwise consistent
      with the Guide.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property was listed for sale within six months and Twenty-four
        (24) months of reserves are verified, or cash-in-hand is considered and is
        otherwise consistent with the Guide.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Reserves or the consistency of cash-in-hand with the Guide remain
        to be verified; treatment of overlapping triggers is subject to Acra confirmation
        → Q-07.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property was listed for sale within six months and the required
        reserves are not verified, and any cash-in-hand considered is not otherwise
        consistent with the Guide.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property was not listed for sale within six months.
      carries_conditions: false
