- rule_id: acra-standard.credit_review_analysis.escrow_waiver_eligibility
  condition:
    kind: procedure
    purpose: Determine whether the case meets the requirements printed for an escrow
      waiver.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application and credit report
      for the waiver request, loan amount, CLTV, FICO, mortgage history, and citizenship
      type.'
