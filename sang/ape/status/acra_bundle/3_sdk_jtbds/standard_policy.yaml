- rule_id: acra-standard.asset_assessment.foreign_funds_repatriation
  condition:
    kind: procedure
    purpose: Determine whether the stated repatriation timing requirement is met for
      funds held in a foreign bank / currency.
    steps:
    - 'Initial Document Review: Review account and repatriation documentation and
      the Closing date.'
    - 'Eligibility Verification: Determine whether funds are held in a foreign bank
      / currency and whether the borrower is a Foreign National.'
    - 'Validation and Verification: Verify repatriation at minimum three (3) business
      days prior to Closing where the requirement applies.'
    - 'Final Determination: Determine whether the applicable repatriation requirement
      is met; obtain Acra confirmation on the stated scope and evidence question where
      needed.'
    checks:
    - Where applicable, funds held in a foreign bank / currency are repatriated at
      minimum three (3) business days prior to Closing.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable repatriation requirement is verified as met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The requirement's scope or applicable evidence remains subject to
        Acra confirmation, or required repatriation documentation remains to be provided.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable funds were not repatriated at minimum three (3) business
        days prior to Closing.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The funds are not held in a foreign bank / currency.
      carries_conditions: false
    evidence_types:
    - bank_statement
    reads:
    - Borrower.citizenship_status
    missing_reads:
    - Whether the borrower holds funds abroad and whether the borrower is a Foreign
      National
    - Acra confirmation on whether the repatriation requirement applies to any borrower
      holding funds abroad or only to Foreign Nationals
    - Acra confirmation on what evidence applies
    - Repatriation date
    - Closing date
  action: require_evidence
  priority: 100
  description: Verify that funds held in a foreign bank / currency are repatriated
    at least three business days prior to Closing.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign
    accounts
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#9.1 Gift funds, funds to
    close and seasoning
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Assets
      assistant:
      - Underwriter
      mnemonic: AFC-REPATRIATION
      job_kind: verification
    ledger:
      clause: 'STD-5.6 Assets held / foreign accounts must be verified in U.S. Dollar
        equivalency at the current exchange rate via www.xe.com or the Wall Street
        Journal conversion table. \[G §3.10, p. 6\]


        STD-5.7 Sufficient funds to close must be on deposit with the Escrow / Closing
        Agent at least three (3) business days (including Saturdays for this calculation)
        prior to any closing date. \[G §3.10, p. 6\]


        STD-5.8 A copy of the two (2) most recent statements of that account is required.
        If the funds are not seasoned a minimum of sixty (60) days, a letter of explanation
        is required along with the information to comprise a sixty (60) day chain
        of funds. Bank statements in any language other than English must be translated
        into English. \[G §3.10, p. 6\]


        STD-5.9 Per §8.4, Foreign Nationals, regardless of LTV / CLTV, need to document
        a minimum of 60 days seasoning, and funds held in a foreign bank / currency
        must be repatriated at minimum three (3) business days prior to Closing (STD-9.5).
        \[G §8.4, p. 12\]


        STD-9.1 Gift funds, investment property or second homes: applicant(s) are
        required to contribute a portion of their own sourced and seasoned funds to
        the transaction at a minimum of 10% of the purchase price. Gift documentation
        requirements are in the Seller''s Guide gift-fund section (Appendix B). \[G
        §8.7, p. 12; S: Loan Amount\]


        STD-9.2 Verification of the seasoning of funds to close is required on loans
        over 70% CLTV for consumer transactions, or business purpose loans where funds
        to close are over \$50,000 and over 70% CLTV. Whether any loan on this program
        is a consumer transaction: Acra confirmation requested → Q-27. \[G §8.4, p.
        12\]


        STD-9.3 Where the account(s) serving as the source of funds must be verified,
