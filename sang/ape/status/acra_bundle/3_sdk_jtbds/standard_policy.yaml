      verdict: satisfied
      criterion: The Certificate of Good Standing or equivalent document is valid
        within ninety (90) days of the closing date.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The document or its validity within ninety (90) days of the closing
        date has not yet been verified.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The document is not valid within ninety (90) days of the closing
        date.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.is_entity_borrower_1
    - Borrower.entity_type
    computable_checks: []
    missing_reads:
    - Certificate of Good Standing or equivalent document
    - Document validity date
    - Closing date
  action: require_evidence
  priority: 100
  description: Verify that the entity’s Certificate of Good Standing or equivalent
    document is valid within ninety (90) days of the closing date.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.2 Entity documentation
    ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Identification
      assistant:
      - Processor
      mnemonic: BOR-ENTGOOD
      job_kind: verification
    ledger:
      clause: '- Names on the entity documents must match the identification; if they
        do not match exactly, a letter of explanation is required to address the discrepancy.


        - Certificate of Good Standing or equivalent document valid within ninety
        (90) days of the closing date.


        - Certificate of Foreign Qualification or other qualification to operate in
        the state where business is being conducted, if the entity is formed in a
        state other than where business is performed or where the property is located.


        - IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or Employer
        Identification Number (EIN) issuance letter for the entity. EIN exception
        requests may be submitted for review by Acra''s Legal Department with a letter
        of explanation stating the applicable grounds.


        - A Unanimous Written Consent / Board Resolution signed by all members regardless
        of their percentage of interest, (i) authorizing the transaction with Acra
        Lending and (ii) identifying who is authorized to sign the loan documents
        on behalf of and to bind the entity. It may be required by the Operating Agreement
        or Bylaws even where ownership is held by one individual. It cannot be used
        to designate a signor on a personal guarantee, only an authorized signor for
        the loan documents signed by the entity.


        - A Power of Attorney must be utilized by the principal to designate an attorney
        in fact to execute a personal guarantee; see §23.5(C), not reproduced (Appendix
        B).


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
