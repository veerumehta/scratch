- rule_id: acra-standard.income_stability_sufficiency_analysis.apply_minimum_dscr_requirements
  condition:
    kind: procedure
    purpose: Determine whether a calculated DSCR meets the stated minimum for each
      applicable situation.
    steps:
    - 'Initial Document Review: Review the DSCR calculation and information identifying
      the loan amount, credit file, property, occupancy, purpose, and borrower status.'
    - 'Eligibility Verification: Identify each applicable situation: LTV above 80.00%;
      loan amount over $2,000,000; 1 or no score / deficient tradelines; rural / unique
      property; non-warrantable condo or condotel / PUDtel; first-time homebuyer;
      vacant-property rate & term refinance; vacant-property cash-out refinance; property
      listed for sale within six months; or mixed use, adult care or assisted living.'
    - 'Validation and Verification: Verify the calculated DSCR against each applicable
      stated minimum: 1.20 for LTV above 80.00%; 1.0 for loan amount over $2,000,000;
      1.1 for 1 or no score / deficient tradelines; 1.00 for rural / unique property;
      1.0 for non-warrantable condo or condotel / PUDtel; 1.150 for first-time homebuyer;
      1.000 for vacant-property rate & term refinance; 1.15 for vacant-property cash-out
      refinance; 1.0 for property listed for sale within six months; and 1.2 for mixed
      use, adult care or assisted living.'
    - 'Final Determination: Record whether the calculated DSCR meets every minimum
      that applies. The stated DTI alternatives for vacant-property rate & term refinance
      and properties listed for sale are not resolved here; Acra confirmation is requested
      on those provisions.'
    checks:
    - If LTV is above 80.00%, calculated DSCR is at least 1.20.
    - If the loan amount is over $2,000,000, calculated DSCR is at least 1.0.
    - If there is 1 or no score / deficient tradelines, calculated DSCR is at least
      1.1.
    - If the property is rural / unique, calculated DSCR is at least 1.00.
    - If the property is a non-warrantable condo or condotel / PUDtel, calculated
      DSCR is at least 1.0.
    - If the borrower is a first-time homebuyer, calculated DSCR is at least 1.150.
    - If the property is vacant and the transaction is a rate & term refinance, calculated
      DSCR is at least 1.000.
    - If the property is vacant and the transaction is a cash-out refinance, calculated
      DSCR is at least 1.15.
    - If the property was listed for sale within six months, calculated DSCR is at
      least 1.0.
    - If the property is mixed use, adult care or assisted living, calculated DSCR
      is at least 1.2.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: A calculated DSCR is established and meets every applicable minimum
        listed in the checks.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A calculated DSCR is below an applicable minimum, or an applicable
        minimum cannot be established as met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: None of the listed situations applies.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    - lease_agreement
    - rent_roll
    - loan_application
    - credit_report
    reads:
    - LoanCore.total_loan_amount_usd
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    - SubjectProperty.property_type
    - SubjectProperty.is_rural
    - SubjectProperty.is_vacant
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.is_listed_for_sale
    - SubjectProperty.is_mixed_use
    - SubjectProperty.occupancy_subtype
    - CreditReport.score_count
    - CreditReport.tradelines_meet_requirement
    - Borrower.is_first_time_homebuyer
    computable_checks: []
    missing_reads:
    - Calculated DSCR
    - LTV
    - Whether the transaction is a refinance and whether it is rate & term or cash-out
    - Whether the property is a non-warrantable condo or condotel / PUDtel
    - Whether a vacant-property refinance is being considered
    - Whether the property was listed for sale within six months, measured from the
      last date of being listed to the Application Date
    - Whether the property is adult care or assisted living
  action: require_evidence
  priority: 100
  description: Verify the minimum DSCR required by each applicable situation stated
    in the guidelines.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.4 Ratio-dependent conditions
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.3 First-time homebuyers
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types
    and caps
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.2 Vacant properties
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.3 Properties listed for
    sale (§11.5)
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.4 Mixed use, adult care
    and assisted living
  on_violation: fail
  replaces: []
