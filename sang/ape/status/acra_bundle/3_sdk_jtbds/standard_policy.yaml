- rule_id: acra-standard.loan_program_eligibility.loan_amount
  condition:
    kind: procedure
    purpose: Determine whether the loan amount meets the published minimum, maximum,
      and increment requirements, including the delayed-financing cap.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan_application for the requested
      loan amount and transaction purpose.'
    - 'Step 2 - Eligibility Verification: Verify the amount against the published
      program range and increment requirement; for interest-only loans, also apply
      the interest-only amount limits.'
    - 'Step 3 - Validation and Verification: For delayed financing, verify that the
      amount does not exceed the stated delayed-financing cap.'
    - 'Step 4 - Final Determination: Determine whether all applicable loan-amount
      requirements are met.'
    checks:
    - The loan amount is from $100,000 to $3,000,000 and is in $50 increments.
    - For an interest-only loan, the loan amount is at least $250,000 and no more
      than $3,000,000.
    - For delayed financing, the loan amount is no more than $1.5MM.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable step is met and every applicable check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable loan-amount requirement does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The loan-amount requirements apply to this case.
      carries_conditions: false
    evidence_types:
    - loan_application
    reads:
    - LoanCore.total_loan_amount_usd
    - LoanCore.loan_purpose
    - LoanCore.is_delayed_financing
    - MortgageLoanInformation.is_interest_only
    computable_checks:
    - 0
    - 1
    - 2
    missing_reads: []
