      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Required tradeline history remains to be provided or verified.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable score-count and tradeline requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
