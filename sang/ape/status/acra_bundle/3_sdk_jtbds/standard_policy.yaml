      financing is allowable.'
    - 'Step 3 - Validation and Verification: Compare the credit line limit with the
      current credit line balance and use the greater amount for CLTV eligibility.'
    - 'Step 4 - Final Determination: Record the greater amount as the HELOC CLTV basis
      for eligibility.'
    checks:
