- rule_id: acra-standard.credit_review_analysis.short_sale_dil_and_modification_seasoning_limits
  condition:
    kind: procedure
    purpose: Check the printed maximum CLTV for short sale, deed-in-lieu, and modification
      seasoning bands.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application and credit information
      for short sale, deed-in-lieu, or modification history, seasoning, loan purpose,
      and CLTV.'
    - 'Step 2 - Eligibility Verification: Apply this provision when the borrower has
      a short sale, deed-in-lieu, or modification.'
    - 'Step 3 - Validation and Verification: Compare seasoning and loan purpose with
      the printed table: ≥ 24 Mo, No Restrictions; 12-23 Mo, 80% purchase / 75% refinance;
      < 12 Mo, 75% purchase / 70% refinance.'
    - 'Step 4 - Final Determination: Record whether the applicable printed restriction
      is met. Treat “FB Taken ≤6 Mos: Case-by-case” as requiring a case-by-case determination;
      the meaning and timing are subject to Acra confirmation → Q-05.'
    checks:
    - For seasoning ≥ 24 Mo, the table states No Restrictions.
    - For seasoning 12-23 Mo, CLTV is no more than 80% for purchase or 75% for refinance
      — rate & term and cash-out.
    - For seasoning < 12 Mo, CLTV is no more than 75% for purchase or 70% for refinance
      — rate & term and cash-out.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable printed seasoning restriction is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: 'The case is subject to “FB Taken ≤6 Mos: Case-by-case” and that
        case-by-case determination remains outstanding.'
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable maximum CLTV is exceeded.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower has no short sale, deed-in-lieu, or modification.
      carries_conditions: false
    evidence_types:
    - loan_application
    - credit_report
    reads:
    - Borrower.has_short_sale_dil_or_modification
    - Borrower.months_since_short_sale_dil_or_modification
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    - 1
    - 2
    missing_reads:
    - Short sale, deed-in-lieu, or modification seasoning as measured under Acra’s
      labels; definitions and measurement are subject to Acra confirmation → Q-05
    - Whether “FB Taken ≤6 Mos” applies and its meaning and timing; Acra confirmation
      requested → Q-05
  action: require_evidence
  priority: 100
  description: Apply the printed short sale, deed-in-lieu, and modification seasoning
    CLTV restrictions by loan purpose.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#7.3 Housing history and previous
    credit events, as printed
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Credit
      assistant:
      - Underwriter
      mnemonic: CRD-SSDMOD
      job_kind: limit
    ledger:
      clause: 'STD-7.9 Mortgage history restrictions. The labels are Acra''s; their
        definitions and how seasoning is measured: Acra confirmation requested → Q-05.
        In the three tables below, where the Summary prints a single figure without
        a purpose split (“Max CLTV: 65%”), it is shown in both columns. \[S: Housing
        History & PCEs\]


        | **Printed label** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T, Refi
        C/O** |

        |----|----|----|

        | 1x30x12 | 80% | 75% |

        | 0x60x12 | 75% | 70% |

        | 0x90x12 | 65% | 65% |

        | 0x120x12 | Ineligible | Ineligible |


        STD-7.10 Bankruptcy & foreclosure restrictions. \[S: Housing History & PCEs\]


        | **Seasoning as printed** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T,
        Refi C/O** |

        |----|----|----|

        | ≥ 36 Mo | No Restrictions | No Restrictions |

        | 24-35 Mo | 80% | 75% |

        | 12-23 Mo | 65% | 65% |

        | \< 12 Mo | Ineligible | Ineligible |


        STD-7.11 Short sale, deed-in-lieu & modification restrictions; and, printed
        beneath them, “FB Taken ≤6 Mos: Case-by-case” (meaning and timing → Q-05).
        \[S: Housing History & PCEs\]


        | **Seasoning as printed** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T,
        Refi C/O** |

        |----|----|----|

        | ≥ 24 Mo | No Restrictions | No Restrictions |

        | 12-23 Mo | 80% | 75% |

        | \< 12 Mo | 75% | 70% |'
  approval_refs: []
- rule_id: acra-standard.identification_requirements.entity_certificate_of_good_standing
  condition:
