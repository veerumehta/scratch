- rule_id: acra-standard.title_review.foreign_document_notarization
  condition:
    kind: procedure
    purpose: Determine whether documents signed outside the U.S. have the required
      notarization and acknowledgment for the applicable signing location.
    steps:
    - 'Initial Document Review: Identify documents signed outside the U.S., where
      they were signed, and the acknowledgment and authentication attached to each.'
    - 'Eligibility Verification: Determine whether the signing country is a party
      to the Hague Convention Treaty Abolishing the Requirement of Legalization for
      Foreign Public Documents.'
    - 'Validation and Verification: For documents signed outside the U.S., verify
      either that a U.S. embassy or consular official notarized them and the certificate
      of acknowledgement includes the embassy or consular seal and is acceptable to
      the title company, or, for a Hague Convention country, that an authorized notary
      public completed and signed the certificate of acknowledgment, authentication
      by apostille in English is attached to the executed documents, and the title
      company accepts it.'
    - 'Final Determination: Record whether the applicable acknowledgment route and
      title company acceptance requirements are met.'
    checks:
    - If documents were signed outside the U.S. before a U.S. embassy or consular
      official, the certificate of acknowledgement includes the embassy or consular
      seal.
    - If documents were signed outside the U.S. before a U.S. embassy or consular
      official, the certificate of acknowledgement is acceptable to the title company.
    - If documents were signed in a country that is a party to the Hague Convention
      Treaty Abolishing the Requirement of Legalization for Foreign Public Documents,
      an authorized notary public completed and signed the certificate of acknowledgment.
    - For documents signed in a Hague Convention country, authentication by apostille
      in English is attached to the executed documents.
    - For documents signed in a Hague Convention country, the title company accepts
      the acknowledgment and apostille.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: No documents were signed outside the U.S., or the applicable notarization
        route, required acknowledgment details, and title company acceptance are satisfied.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Documents were signed outside the U.S. and the applicable notarization
        route, required acknowledgment details, or title company acceptance requirement
        is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads: []
    computable_checks: []
    missing_reads:
    - Whether documents were signed outside the U.S.; country of signing and its Hague
      Convention status; notarization and certificate of acknowledgment; embassy or
      consular seal if applicable; apostille in English attached to executed documents
      if applicable; and title company acceptance.
  action: require_evidence
