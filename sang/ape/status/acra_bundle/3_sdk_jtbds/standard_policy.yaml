- rule_id: acra-standard.title_review.trust_documentation
  condition:
    kind: procedure
    purpose: Determine whether the required trust document or certification and all
      listed trust details are present.
    steps:
    - 'Initial Document Review: Review the complete, legible Trust copy or Certification
      of Trust.'
    - 'Eligibility Verification: Determine whether the file contains one of those
      document forms.'
    - 'Validation and Verification: Verify that the document states the existence
      and date of the Trust; Trustor(s) and current Trustee(s); Trustee powers; revocability
      and, if revocable, who holds the right to revoke; names and number of Trustees
      required to sign on behalf of the Trust; Trust identification number (a Social
      Security number or an IRS-issued Tax Identification Number); how title to Trust
      assets should be taken; and that the Trust has not been revoked, modified, or
      amended in any manner.'
    - 'Final Determination: Record whether the Trust document or Certification of
      Trust is complete, legible, and includes every required item.'
    checks:
    - A complete, legible copy of the Trust or a Certification of Trust is provided.
    - The Trust document or Certification of Trust states the existence and date of
      the Trust.
    - The Trust document or Certification of Trust states the Trustor(s) and current
      Trustee(s).
    - The Trust document or Certification of Trust states the powers of the Trustee.
    - The Trust document or Certification of Trust states whether the Trust is revocable
      and, if revocable, who holds the right to revoke.
    - The Trust document or Certification of Trust states the names and number of
      the Trustees required to sign on behalf of the Trust.
    - The Trust document or Certification of Trust states the Trust identification
      number, which is a Social Security number or an IRS-issued Tax Identification
      Number.
    - The Trust document or Certification of Trust states how title to the Trust assets
      should be taken.
    - The Trust document or Certification of Trust states that the Trust has not been
      revoked, modified, or amended in any manner.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: A complete, legible Trust copy or Certification of Trust is provided
        and every required statement is present.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The Trust copy or Certification of Trust is missing, incomplete,
        illegible, or omits a required statement.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Title is not vested in an inter vivos revocable trust.
      carries_conditions: false
    evidence_types: []
    reads:
    - Borrower.entity_type
    computable_checks: []
    missing_reads:
    - A complete, legible Trust copy or Certification of Trust and each required statement
      in it.
  action: require_evidence
  priority: 100
  description: Verify that the trust file includes a complete, legible Trust copy
    or a Certification of Trust containing each required statement.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.4 Revocable living trusts
