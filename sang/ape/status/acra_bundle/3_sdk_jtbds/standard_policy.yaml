- rule_id: acra-standard.loan_program_eligibility.matrix_fico_and_cltv.python
  condition:
    kind: python
    source: "import decimal\nimport rules_lib\n\n\ndef check(ctx):\n    amount = ctx['LoanCore.total_loan_amount_usd']\n\
      \    score = ctx['CreditReport.representative_score']\n    purpose = ctx['LoanCore.loan_purpose']\n\
      \    cltv_percent = ctx['LoanCore.cltv_percent']\n\n    missing = rules_lib.gaps(\n\
      \        amount=amount,\n        score=score,\n        purpose=purpose,\n  \
      \      cltv_percent=cltv_percent,\n    )\n    if missing:\n        return rules_lib.unknown(*missing)\n\
      \n    if rules_lib.same(purpose, 'purchase'):\n        purpose_index = 0\n \
      \   elif rules_lib.same(purpose, 'rate & term'):\n        purpose_index = 1\n\
      \    elif rules_lib.same(purpose, 'cash-out'):\n        purpose_index = 2\n\
      \    else:\n        return rules_lib.unknown('loan_purpose')\n\n    try:\n \
      \       score = decimal.Decimal(str(score))\n        cltv = decimal.Decimal(str(cltv_percent))\
      \ / decimal.Decimal(100)\n    except (decimal.InvalidOperation, TypeError, ValueError):\n\
      \        return rules_lib.unknown('representative_score', 'cltv_percent')\n\n\
      \    # The excerpt prints the three tables, but does not print their loan-amount\n\
      \    # tier labels. Keep each printed table separate rather than guessing which\n\
      \    # loan amounts select it.\n    tables = [\n        [\n            (600,\
      \ (60, 60, 60)), (620, (65, 65, 65)),\n            (640, (75, 70, 70)), (660,\
      \ (80, 75, 75)),\n            (680, (80, 75, 75)), (700, (80, 80, 75)),\n  \
      \          (720, (85, 80, 80)), (740, (85, 80, 80)),\n            (760, (85,\
      \ 80, 80)), (780, (85, 80, 80)),\n        ],\n        [\n            (620, (65,\
      \ None, None)), (640, (75, 65, 65)),\n            (660, (75, 70, 65)), (680,\
      \ (75, 70, 70)),\n            (700, (75, 70, 70)), (720, (75, 75, 75)),\n  \
      \          (740, (75, 75, 75)), (760, (75, 75, 75)),\n            (780, (75,\
      \ 75, 75)),\n        ],\n        [\n            (700, (70, 70, 65)), (720, (70,\
      \ 70, 65)),\n            (740, (70, 70, 65)), (760, (70, 70, 65)),\n       \
      \     (780, (70, 70, 65)),\n        ],\n    ]\n\n    verdicts = []\n    for\
      \ rows in tables:\n        limits = None\n        for minimum_fico, row_limits\
      \ in rows:\n            if score >= minimum_fico:\n                limits =\
      \ row_limits\n        if limits is None or limits[purpose_index] is None:\n\
      \            verdicts.append(False)\n        else:\n            limit = decimal.Decimal(limits[purpose_index])\
      \ / decimal.Decimal(100)\n            verdicts.append(cltv <= limit)\n\n   \
      \ if all(verdicts):\n        return True\n    if not any(verdicts):\n      \
      \  return False\n    return rules_lib.unknown('applicable_matrix_tier')"
    entrypoint: check
    reads:
    - LoanCore.total_loan_amount_usd
    - CreditReport.representative_score
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    derived_from: acra-standard.loan_program_eligibility.matrix_fico_and_cltv
