    - listing_history
    - bank_statement
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - RatioSet.reserves_months
    missing_reads:
    - Whether cash-in-hand is otherwise consistent with the Guide
    - Acra confirmation requested on treatment of overlapping triggers (Q-07)
