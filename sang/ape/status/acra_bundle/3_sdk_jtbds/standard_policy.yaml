- rule_id: acra-standard.credit_review_analysis.one_or_no_score_deficient_tradelines
  condition:
    kind: procedure
    purpose: Verify the requirements printed for 1 or No Score / Deficient Tradelines.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit report and underwriting
      information for score count, tradeline status, CLTV, DSCR, and housing history.'
    - 'Step 2 - Eligibility Verification: Apply this provision when the case has 1
      or No Score / Deficient Tradelines.'
    - 'Step 3 - Validation and Verification: Verify the printed requirements: Max
      65% LTV/CLTV; DSCR Ratio ≥ 1.1; 24mos 0x30 housing history. Apply “1 Reported
      Score: Use Actual to Max 700; No Score: Price as 700 Tier”.'
    - 'Step 4 - Final Determination: Record whether each applicable printed requirement
      is met; do not infer which score is the decisioning score.'
    checks:
    - For 1 or No Score / Deficient Tradelines, LTV/CLTV is no more than 65%.
    - For 1 or No Score / Deficient Tradelines, DSCR Ratio is at least 1.1.
    - For 1 or No Score / Deficient Tradelines, housing history is 24mos 0x30.
    - For 1 Reported Score, use Actual to Max 700; for No Score, price as 700 Tier.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable printed requirement is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable printed requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case does not have 1 or No Score / Deficient Tradelines.
      carries_conditions: false
    evidence_types:
    - credit_report
    reads:
    - CreditReport.score_count
    - CreditReport.tradelines_meet_requirement
    - LoanCore.cltv_percent
    - CreditReport.housing_history_rating
    computable_checks:
    - 0
    missing_reads:
    - DSCR
    - Whether the case has deficient tradelines
    - The housing-history period and payment history
    - The score used for decisioning; Acra confirmation requested → Q-19
  action: require_evidence
  priority: 100
  description: Apply the printed CLTV, DSCR, housing-history, and score-pricing entries
    for 1 or No Score / Deficient Tradelines.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#7.1 Scores and tradelines
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Credit
      assistant:
      - Underwriter
      mnemonic: CRD-LOWSCORE
      job_kind: limit
    ledger:
      clause: 'STD-7.1 Applicants with scores from 3 repositories: acceptable with
        no tradeline overlay. \[S: Credit Requirements\]


        STD-7.2 Applicants with 2 or fewer scores: 2 tradelines & 24 month history,
        or 3 tradelines & 12 month history, acceptable with no tradeline overlay.
        \[S: Credit Requirements\]


        STD-7.3 1 or No Score / Deficient Tradelines — three entries as printed: Max
        65% LTV/CLTV; DSCR Ratio ≥ 1.1; 24mos 0x30 housing history. Also as printed:
        “1 Reported Score: Use Actual to Max 700; No Score: Price as 700 Tier”. \[S:
        Credit Requirements\]


        STD-7.4 The Summary does not state which score is the decisioning score, or
        how it is set for an entity borrower with several guarantors: Acra confirmation
        requested → Q-19. \[S: Credit Requirements\]


        STD-7.5 Reserves: FICO \< 620 requires 12 months. \[S: Credit Requirements\]'
