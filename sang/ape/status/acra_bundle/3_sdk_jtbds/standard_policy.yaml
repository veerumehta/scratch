- rule_id: acra-standard.loan_program_eligibility.foreign_national_eligibility
  condition:
    kind: procedure
    purpose: Determine whether a Foreign National meets the stated residence and transaction-purpose
      requirements and apply the published CLTV limits.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan_application and supporting
      borrower documentation for residence, authorization to live or work in the U.S.,
      and transaction purpose.'
    - 'Step 2 - Eligibility Verification: Verify that the borrower resides outside
      the U.S., is not authorized to live or work in the U.S., and the transaction
      is for a business purpose (investment property).'
    - 'Step 3 - Validation and Verification: Apply the stated Foreign National CLTV
      maximums: 70% for purchase and 65% for refinance — rate & term and cash-out.
      Verify the loan is priced at FICO equal to 700.'
    - 'Step 4 - Final Determination: Determine whether the stated Foreign National
      requirements are met.'
    checks:
    - The borrower resides outside of the U.S.
    - The borrower is not authorized to live or work in the U.S.
    - The transaction is for a business purpose (investment property).
    - The applicable CLTV does not exceed 70% for purchase or 65% for refinance —
      rate & term and cash-out.
    - The loan is priced at FICO equal to 700.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every stated Foreign National eligibility requirement is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Required evidence or clarification of the borrower's residence, authorization,
        transaction purpose, or pricing remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A stated Foreign National eligibility requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not a Foreign National.
      carries_conditions: false
