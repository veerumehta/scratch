    - Loan amount is no more than $1.5M.
    - CLTV is no more than 80%.
    - FICO is at least 700.
    - Mortgage history is no worse than 0x30x24.
    - The borrower is not a Foreign National.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All printed escrow-waiver requirements are met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: One or more printed escrow-waiver requirements are not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: An escrow waiver is not requested.
      carries_conditions: false
