      minimum FICO 640.'
    - 'Step 3 - Validation and Verification: Apply the printed ITIN CLTV tier for
      the FICO and transaction purpose: “FICO 700” is 70% purchase and 65% refinance;
      FICO 660 to 699 is 65% purchase and 60% refinance; FICO 640 to 659 is 60% purchase
