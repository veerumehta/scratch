- rule_id: acra-standard.loan_program_eligibility.property_listed_for_sale
  condition:
    kind: procedure
    purpose: Determine whether a property listed within the stated period meets the
      applicable loan conditions.
    steps:
    - 'Step 1 - Initial Document Review: Review listing_history, loan_application,
      appraisal_report, and relevant lien and underwriting records for listing dates,
      occupancy, value, and loan terms.'
    - 'Step 2 - Eligibility Verification: Treat a property as listed for sale if it
      was listed in the last six months, measured from the last date of being listed
      to the Application Date.'
    - 'Step 3 - Validation and Verification: For a covered loan, verify that the property
      is not in default or delinquent on liens; an investment property is tenant-occupied
      and not vacant; qualification is ≥ 1.0 DSCR or 43% maximum DTI; PPP is at least
      three (3) years unless the property is in a state that does not allow prepayment
      penalties; reserves are twenty-four (24) months; the loan is fully amortizing
      and not interest only; maximum LTV / CLTV is 65% based on the lesser of appraised
      value or lowest recent listing price; no subordinate financing is allowed; and
      impounds are required.'
    - 'Step 4 - Final Determination: Determine whether the applicable listed-property
      conditions are met.'
    checks:
    - The property was listed for sale within the last six months as measured from
      the last listing date to the Application Date.
    - The property is not in default or otherwise delinquent on lien(s).
    - For an investment property, the subject is occupied by a tenant and is not vacant.
    - The loan qualifies as either ≥ 1.0 DSCR or 43% maximum DTI.
    - The loan has a prepayment penalty of at least three (3) years unless the property
      is in a state that does not allow prepayment penalties.
    - Reserves are twenty-four (24) months.
    - The loan is fully amortizing and is not interest only.
    - LTV / CLTV does not exceed 65% based on the lesser of appraised value or lowest
      recent listing price.
    - No subordinate financing is allowed and impounds are required.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is listed within the stated period and every applicable
        listed-property condition is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Evidence or a condition needed to determine or clear an applicable
        listed-property requirement remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable listed-property condition is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property was not listed for sale in the last six months under
        the stated measurement.
      carries_conditions: false
    evidence_types:
    - listing_history
    - loan_application
    - appraisal_report
    - bank_statement
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.is_listed_for_sale
    - SubjectProperty.is_vacant
    - SubjectProperty.has_current_lease
    - LoanCore.cltv_percent
    - LoanCore.prepayment_penalty_structure
    - MortgageLoanInformation.is_interest_only
    - RatioSet.reserves_months
    computable_checks:
    - 0
    - 5
    - 6
    missing_reads:
    - Application Date and last date of being listed.
    - Lien status, tenant occupancy, qualification result, PPP, subordinate financing
      status, impound requirement, appraised value, and lowest recent listing price.
    - Applicable state determination for whether it allows prepayment penalties.
