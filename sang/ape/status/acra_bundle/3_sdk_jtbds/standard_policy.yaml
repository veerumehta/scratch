- rule_id: acra-standard.identification_requirements.entity_unanimous_written_consent_or_board_resolution
  condition:
    kind: procedure
    purpose: Apply the entity authorization requirement in U45.
    steps:
    - 'Initial Document Review: Obtain and review the Unanimous Written Consent /
      Board Resolution and the entity’s membership information.'
    - 'Eligibility Verification: Confirm that the borrower is an entity borrower.'
    - 'Validation and Verification: Verify that all members signed regardless of their
      percentage of interest, that the transaction with Acra Lending is authorized,
      and that the person authorized to sign the loan documents on behalf of and bind
      the entity is identified. Account for the stated possibility that the Operating
      Agreement or Bylaws may require it even where ownership is held by one individual.
      Verify that it does not designate a signor on a personal guarantee.'
    - 'Final Determination: Record whether the consent or resolution contains the
      required signatures and authorizations.'
    checks:
    - The Unanimous Written Consent / Board Resolution is signed by all members regardless
      of their percentage of interest.
    - The Unanimous Written Consent / Board Resolution authorizes the transaction
      with Acra Lending and identifies who is authorized to sign the loan documents
      on behalf of and to bind the entity.
    - The Unanimous Written Consent / Board Resolution does not designate a signor
      on a personal guarantee.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable consent or resolution is provided and meets the stated
        signature and authorization requirements.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The consent or resolution, member signatures, or applicable Operating
        Agreement or Bylaws have not yet been reviewed.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable consent or resolution is not signed by all members,
        does not provide the required authorizations, or designates a signor on a
        personal guarantee.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.is_entity_borrower_1
    - Borrower.entity_type
    computable_checks: []
    missing_reads:
    - Unanimous Written Consent / Board Resolution
    - Entity membership and member signatures
    - Operating Agreement or Bylaws, if needed to determine whether the consent or
      resolution is required
