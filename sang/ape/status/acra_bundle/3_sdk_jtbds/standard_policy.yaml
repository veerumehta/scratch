- rule_id: acra-standard.appraisal_review.vacant_purchase_rent_appraisal
  condition:
    kind: procedure
    purpose: Determine whether qualifying rents for a vacant property purchase are
      taken from the applicable Form 1007 or Form 1025 appraisal report.
    steps:
    - 'Step 1 - Initial Document Review: Review the appraisal report for a Form 1007
      or Form 1025 and the stated qualifying rents.'
    - 'Step 2 - Eligibility Verification: Determine whether the property is vacant
      and is being purchased.'
    - 'Step 3 - Validation and Verification: Verify that qualifying rents are taken
      from the Form 1007 or Form 1025 appraisal report, as applicable.'
    - 'Step 4 - Final Determination: Record whether the stated vacant-purchase qualifying-rent
      requirement is met.'
    checks:
    - If a vacant property is being purchased, qualifying rents are taken from the
      Form 1007 or Form 1025 appraisal report, as applicable.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: For a vacant property purchase, qualifying rents are taken from the
        applicable Form 1007 or Form 1025 appraisal report.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: For a vacant property purchase, qualifying rents are not taken from
        the applicable Form 1007 or Form 1025 appraisal report.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not vacant or the transaction is not a purchase.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    reads:
    - SubjectProperty.is_vacant
    - LoanCore.loan_purpose
    missing_reads:
    - Whether the transaction is a purchase.
    - Which appraisal form is applicable.
  action: require_evidence
  priority: 100
  description: Review the appraisal evidence for the qualifying-rent source required
    when a vacant property is being purchased.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both
    provisions, as written
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.2 Vacant properties
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-VACANTRENT
      job_kind: verification
      mapped_reads:
      - text: Whether the property is vacant.
        field: SubjectProperty.is_vacant
        how: judged
    ledger:
      clause: 'STD-3.5 Formula: the lesser of annual in-place rent or market rent
        (STD-3.1). \[G §5.32, p. 3\]


        STD-3.6 Note in the same section: “Acra may use the higher of actual or market
        rents. Where actual rents exceed market rents, then evidence of actual rents
        must be documented via two (2) consecutive months proof of rental income receipt
        and lease agreement(s) to continue at a minimum of three (3) months after
        closing. Note: Security Deposit does not count towards receipt, and the rents
        cannot be prepaid.” \[G §5.32, p. 3; repeated under Actual Rents, p. 5\]


        STD-3.7 This document does not select between STD-3.5 and STD-3.6. When market
        rent may be used if actual rent is lower, when higher actual rent may be used,
        and whether the stated documentation is sufficient or further approval is
        required: Acra confirmation requested → Q-01.


        STD-3.8 “If vacant property is being purchased, qualifying rents are taken
        from the 1007 or 1025 Appraisal report, as applicable, for qualifying income.”
        Rental income from the purchase of a vacant property requires a 1007 survey
        if it is the subject of an Acra loan. \[G §5.32, p. 3; §5.30–5.31, p. 4\]


        STD-8.5 A vacant property may be purchased; qualifying rents are taken from
        the 1007 or 1025 (STD-3.8). “Vacant investment properties are only eligible
        for a refinance transaction if consistent with §10.17.” \[G §5.32, p. 3; §3.41,
        p. 11\]


        STD-8.6 Rate and term refinance of a vacant property (§10.17): minimum 700
        FICO score; maximum \$1,000,000 to maximum 70% CLTV; maximum \$2,000,000 to
        maximum 65% CLTV; minimum 1.000 DSCR or maximum 40.0% DTI (Q-14); minimum
        two-year prepayment penalty (where allowable); full amortization required,
        no interest-only programs; impounds required; minimum six months reserves.
        The Summary states the same conditions with “Max CLTV 70% for loan amounts
        under \$1,000,000 and 65% for loan amounts under \$2,000,000”. Treatment at
        exactly \$1,000,000 and \$2,000,000: Acra confirmation requested → Q-10. \[G
        §10.17, p. 11; S: Occupancy Type\]


        STD-8.7 Cash-out refinance of a vacant property: the “Cash-Out Refinances”
        heading in §10.17 is empty in the excerpt. The Summary states: minimum 700
        FICO; DSCR ≥ 1.15; ≥ 3-year PPP (where allowable); no interest only; impounds
        required; 6 months reserves; “Max CLTV 60% for loan amounts under \$1,500,000”;
        “Requires ≥15 months ownership”. Loans of \$1,500,000 or more, and how the
        15 months are measured: Acra confirmation requested → Q-10. \[S: Occupancy
        Type; G §10.17, p. 11\]'
