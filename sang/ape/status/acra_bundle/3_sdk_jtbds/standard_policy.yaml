      rate & term refinance requires at least two years and vacant-property cash-out
      refinance at least three years, each where allowable; property listed for sale
      requires at least three years unless located in a state that does not allow
      prepayment penalties. Apply the printed state restrictions as written; the meaning
      of “BUY-OUT” and how state restrictions interact with the minimums require Acra
      confirmation.'
    - 'Step 4 - Final Determination: Determine whether the selected structure meets
      applicable stated minimums and refer unresolved state-restriction interpretation
