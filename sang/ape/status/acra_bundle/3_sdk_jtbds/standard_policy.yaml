- rule_id: acra-standard.compliance_and_closing.entity_documentation
  condition:
    kind: procedure
    purpose: Determine whether the required entity documents are complete and meet
      the stated requirements.
    steps:
    - 'Initial Document Review: Review the entity documents and identification for
      the required formation, governance, ownership, qualification, tax-identification,
      and transaction-authorization documents.'
    - 'Eligibility Verification: Verify that the documents required for the entity
      type are provided, complete, legible, and include the contents specified by
      the policy.'
    - 'Validation and Verification: Verify that entity names match identification
      or that a letter of explanation addresses a discrepancy; verify that the Certificate
      of Good Standing or equivalent is valid within ninety (90) days of the closing
      date; and review any applicable foreign qualification, EIN exception, or lost-stock-certificate
      documentation.'
    - 'Final Determination: Determine whether the required entity documentation meets
      the stated requirements.'
    checks:
    - All required entity documentation applicable to the entity type is provided
      and meets the stated requirements.
    - The entity documents state whether the entity is member or manager managed,
      authorize borrowing money and entering into contracts for mortgage assets, and
      designate signers, where those requirements apply.
    - Ownership documentation accounts for the ownership interests as required for
      the entity type.
    - The Certificate of Good Standing or equivalent is valid within ninety (90) days
      of the closing date.
    - A Unanimous Written Consent / Board Resolution signed by all members authorizes
      the transaction with Acra Lending and identifies who is authorized to sign the
      loan documents on behalf of and to bind the entity.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every step is met and every check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A step is not met or a check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_type
    - Borrower.entity_documents_complete
    - Borrower.is_entity_borrower_1
    computable_checks: []
    missing_reads:
    - Complete, legible Certificate of Formation / Articles of Organization and all
      amendments
    - Complete, legible Operating Agreement with referenced exhibits, or Bylaws, and
      all amendments
    - Ownership-interest evidence applicable to the entity type
    - Stock certificates or stock ledger, and Affidavit of Lost Stock Certificate
      if required
    - For the stated S-corporation or Partnership circumstance, K-1 statements and
      CPA or Tax Preparer letter
    - Identification
    - Letter of explanation for any name discrepancy
    - Certificate of Good Standing or equivalent
    - Certificate of Foreign Qualification or other qualification, if applicable
    - IRS Form SS4, Federal Taxpayer Identification Number (TIN), or EIN issuance
      letter
    - Acra Legal Department review and letter of explanation for an EIN exception
      request, if applicable
    - Unanimous Written Consent / Board Resolution
    - Power of Attorney for an attorney in fact executing a personal guarantee, if
      applicable
    - Additional supporting documentation required by Legal, if any
  action: require_evidence
  priority: 100
  description: Verify the required entity documentation and its stated contents.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.2 Entity documentation
    ¶1
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.2 Entity documentation
    ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Compliance
      assistant:
      - Underwriter
      mnemonic: BET-ENTITY
      job_kind: verification
    ledger:
      clause: 'STD-6.10 The documents below are required, without exception, and borrower
        letters stating that they are not required, available, or excused from providing
        such documents are not acceptable. \[G §3.12, pp. 8–9\]


        - Complete, legible copy of the Certificate of Formation / Articles of Organization
        and all amendments thereto.


        - Complete (with all referenced exhibits), legible copy of the Operating Agreement
        for LLCs and Partnerships, or Bylaws for corporations, and all amendments,
        that states whether the entity is member or manager managed, contains authorization
        to borrow money and enter into contracts for mortgage assets, and designates
        signers. Additional information may be required if the formation documents
        and the Operating Agreement or Bylaws conflict.


        - All documentation evidencing ownership interests: for LLCs and Partnerships,
        the Operating Agreement must identify, or attach as an exhibit, all persons
        by name with their ownership interest, or provide copies of the membership
        interest certificates / units in compliance with the Operating Agreement.


        - For S or C Corporations: shareholder / stockholder certificates that comply
        with the Bylaws, if any, or, if stock certificates are lost or unavailable,
        the corporation''s stock ledger. The certificate or ledger must account for
        all outstanding shares noted in the Certificate of Formation / Articles of
        Organization, including those held by the corporation. If stock certificates
        are lost, destroyed, mutilated, or otherwise unavailable, an Affidavit of
        Lost Stock Certificate is required.


        - For S-corporations or Partnerships, where both stock certificate and stock
        ledger are unavailable: (i) the most recent preceding tax year''s K-1 statement
        for all members with 20% or more interest, and (ii) a letter from the CPA
        or Tax Preparer affirming current ownership interest, with a statement to
        that effect if the preceding year''s taxes have not been filed.


        - Names on the entity documents must match the identification; if they do
        not match exactly, a letter of explanation is required to address the discrepancy.


        - Certificate of Good Standing or equivalent document valid within ninety
        (90) days of the closing date.


        - Certificate of Foreign Qualification or other qualification to operate in
        the state where business is being conducted, if the entity is formed in a
        state other than where business is performed or where the property is located.


        - IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or Employer
        Identification Number (EIN) issuance letter for the entity. EIN exception
        requests may be submitted for review by Acra''s Legal Department with a letter
        of explanation stating the applicable grounds.


        - A Unanimous Written Consent / Board Resolution signed by all members regardless
        of their percentage of interest, (i) authorizing the transaction with Acra
        Lending and (ii) identifying who is authorized to sign the loan documents
        on behalf of and to bind the entity. It may be required by the Operating Agreement
        or Bylaws even where ownership is held by one individual. It cannot be used
        to designate a signor on a personal guarantee, only an authorized signor for
        the loan documents signed by the entity.


        - A Power of Attorney must be utilized by the principal to designate an attorney
        in fact to execute a personal guarantee; see §23.5(C), not reproduced (Appendix
        B).


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
  approval_refs: []
- rule_id: acra-standard.compliance_and_closing.foreign_account_funds
  condition:
    kind: procedure
    purpose: Determine whether foreign-account funds are documented and available
      as required.
    steps:
    - 'Initial Document Review: Review the two (2) most recent statements for the
      account and the evidence of funds to close.'
    - 'Eligibility Verification: Verify U.S. Dollar equivalency at the current exchange
      rate for assets held in foreign accounts.'
    - 'Validation and Verification: Verify that funds are seasoned a minimum of sixty
      (60) days or, if they are not, that a letter of explanation and information
      comprising a sixty (60) day chain of funds are provided; verify that statements
      in a language other than English are translated into English; and verify the
      required deposit or repatriation timing where applicable.'
    - 'Final Determination: Determine whether the foreign-account funds meet the stated
      documentation and timing requirements.'
    checks:
    - Foreign-account assets are verified in U.S. Dollar equivalency at the current
      exchange rate via www.xe.com or the Wall Street Journal conversion table.
    - A copy of the two (2) most recent statements of the account is provided.
    - If funds are not seasoned a minimum of sixty (60) days, a letter of explanation
      and information to comprise a sixty (60) day chain of funds are provided.
    - Bank statements in a language other than English are translated into English.
    - Sufficient funds to close are on deposit with the Escrow / Closing Agent at
      least three (3) business days, including Saturdays for this calculation, prior
      to any closing date.
    - Funds held in a foreign bank / currency are repatriated at minimum three (3)
      business days prior to Closing where the stated requirement applies.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every step is met and every check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A step is not met or a check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - bank_statement
    reads:
    - Borrower.citizenship_status
    - LoanCore.cltv_percent
    computable_checks: []
    missing_reads:
    - Current exchange-rate conversion from www.xe.com or the Wall Street Journal
      conversion table
    - Two (2) most recent account statements
    - Letter of explanation and sixty (60) day chain of funds, if required
    - English translations of statements, if required
    - Closing date and evidence of funds deposited with the Escrow / Closing Agent
    - Evidence of repatriation and the applicable borrower status
  action: require_evidence
  priority: 100
  description: Verify foreign-account funds in U.S. Dollar equivalency and confirm
    the required closing-funds documentation and timing.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign
    accounts
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#9.1 Gift funds, funds to
    close and seasoning
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Compliance
      assistant:
      - Processor
      mnemonic: CMP-FOREIGNFUNDS
      job_kind: verification
    ledger:
      clause: 'STD-5.6 Assets held / foreign accounts must be verified in U.S. Dollar
        equivalency at the current exchange rate via www.xe.com or the Wall Street
        Journal conversion table. \[G §3.10, p. 6\]


        STD-5.7 Sufficient funds to close must be on deposit with the Escrow / Closing
        Agent at least three (3) business days (including Saturdays for this calculation)
        prior to any closing date. \[G §3.10, p. 6\]


        STD-5.8 A copy of the two (2) most recent statements of that account is required.
        If the funds are not seasoned a minimum of sixty (60) days, a letter of explanation
        is required along with the information to comprise a sixty (60) day chain
        of funds. Bank statements in any language other than English must be translated
        into English. \[G §3.10, p. 6\]


        STD-5.9 Per §8.4, Foreign Nationals, regardless of LTV / CLTV, need to document
        a minimum of 60 days seasoning, and funds held in a foreign bank / currency
        must be repatriated at minimum three (3) business days prior to Closing (STD-9.5).
        \[G §8.4, p. 12\]


        STD-9.1 Gift funds, investment property or second homes: applicant(s) are
        required to contribute a portion of their own sourced and seasoned funds to
        the transaction at a minimum of 10% of the purchase price. Gift documentation
        requirements are in the Seller''s Guide gift-fund section (Appendix B). \[G
        §8.7, p. 12; S: Loan Amount\]


        STD-9.2 Verification of the seasoning of funds to close is required on loans
        over 70% CLTV for consumer transactions, or business purpose loans where funds
        to close are over \$50,000 and over 70% CLTV. Whether any loan on this program
        is a consumer transaction: Acra confirmation requested → Q-27. \[G §8.4, p.
        12\]


        STD-9.3 Where the account(s) serving as the source of funds must be verified,
        verification may include a copy of the borrower''s bank statement(s) for the
        most recent month(s), or a VOD reflecting a current and average balance for
        the most recent month(s). \[G §8.4, p. 12\]


        STD-9.4 “All transactions require a minimum of 30-days documentation.” Whether
        any seasoning period applies to domestic funds beyond this documentation minimum:
        Acra confirmation requested → Q-12. \[G §8.4, p. 12\]


        STD-9.5 “In contrast to the above, but consistent with §3.10.1 of this Guide,
        funds held in a foreign bank / currency will need to be repatriated at minimum
        three (3) business days prior to Closing and Foreign Nationals, regardless
        of LTV / CLTV, need to document a minimum of 60 days seasoning.” Whether the
        repatriation requirement applies to any borrower holding funds abroad or only
        to foreign nationals, and what evidence applies: Acra confirmation requested
        → Q-12. \[G §8.4, p. 12\]'
  approval_refs: []
