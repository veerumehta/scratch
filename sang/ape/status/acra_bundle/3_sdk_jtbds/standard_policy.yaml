- rule_id: acra-standard.loan_program_eligibility.interest_only_eligibility
  condition:
    kind: procedure
    purpose: Determine whether an interest-only loan meets the applicable published
      product and eligibility conditions.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan_application, credit_report,
      and appraisal_report for interest-only term, product, loan amount, FICO, CLTV,
      and property and borrower characteristics.'
    - 'Step 2 - Eligibility Verification: Confirm the selected product is one of the
      published eligible interest-only products: 5 Yr / 30 year term on 5/1 or 7/1
      ARM; 5 Yr / 30 Year Fixed; or 10 Yr / 40 Year Term.'
    - 'Step 3 - Validation and Verification: Apply minimum loan amount $250,000 and
      minimum 640 credit score. For 10 Yr / 40 Year Term, also apply maximum 80% LTV
      / CLTV and maximum $3M loan amount. Interest-only is not available to first-time
      homebuyers, on vacant-property refinances, or on properties listed for sale.'
    - 'Step 4 - Final Determination: Determine whether the applicable interest-only
      product conditions are met.'
    checks:
    - The selected interest-only product is a published eligible product.
    - The loan amount is at least $250,000 and FICO is at least 640.
    - For 10 Yr / 40 Year Term, loan amount does not exceed $3M and LTV / CLTV does
      not exceed 80%.
    - The borrower is not a first-time homebuyer.
    - The loan is not a refinance of a vacant property.
    - The property is not listed for sale.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable interest-only eligibility condition is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Product or loan evidence needed to determine an applicable interest-only
        condition remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The product is not eligible or an applicable interest-only requirement
        or restriction is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The loan is not interest-only.
      carries_conditions: false
    evidence_types:
    - loan_application
    - credit_report
    - appraisal_report
    reads:
    - MortgageLoanInformation.is_interest_only
    - LoanCore.total_loan_amount_usd
    - CreditReport.representative_score
    - LoanCore.cltv_percent
    - Borrower.is_first_time_homebuyer
    - SubjectProperty.is_vacant
    - SubjectProperty.is_listed_for_sale
    computable_checks:
    - 1
    - 2
    - 3
    - 4
    - 5
    missing_reads:
    - Evidence of selected product and term.
    - The loan's LTV for the 10 Yr / 40 Year Term, if not represented by CLTV.
  action: require_evidence
  priority: 100
  description: Verify interest-only product, amount, FICO, CLTV, and restriction requirements.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#10.1 Eligible products and
    ARM terms
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#10.2 Interest-only
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#12.2 Minimum FICO by feature,
    as published
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Eligibility
      assistant:
      - Underwriter
      mnemonic: PPT-INTERESTONLY
      job_kind: limit
    ledger:
      clause: 'STD-10.1 Eligible product types: 30 Yr Fixed; 5/1 ARM; 7/1 ARM; Interest
        Only (5 Yr / 30 year term, available on 5/1 or 7/1 ARM); Interest Only (5
        Yr / 30 Year Fixed); Interest Only (10 Yr / 40 Year Term). \[S: Product Requirements\]


        STD-10.2 ARM requirements: Index 1 Yr CMT; Caps 2/2/6; Margin 3.00 (FICO 760+),
        3.25 (FICO 720-759), 3.50 (FICO 700-719), 3.75 (FICO 680-699), 4.00 (FICO
        660-679), 4.25 (FICO 640-659), 5.00 (FICO 600-639). \[S: Product Requirements\]


        STD-10.3 Interest Only, 5 Yr / 30 Year Fixed or 5/1 and 7/1 ARM: minimum loan
        ≥ \$250K; minimum 640 credit score. \[S: Product Requirements\]


        STD-10.4 Interest Only, 10 Yr / 40 Year Term: minimum loan ≥ \$250K; minimum
        640 credit score; maximum 80% LTV / CLTV; maximum \$3M loan amount. \[S: Product
        Requirements\]


        STD-10.5 Interest-only is not available to first-time homebuyers (STD-4.10),
        on vacant-property refinances (STD-8.6 and 8.7) or on properties listed for
        sale (STD-8.9). \[G §3.13, §10.17, §11.5\]


        STD-10.6 Interest Only payments are calculated as the amount sufficient to
        pay the accrued interest on the mortgage monthly at the time of origination,
        usually for a set term at the beginning of the repayment term; after that
        term the payments are recast to a fully amortized payment for the balance
        of the term ending at maturity. Acra calculates the DSCR using the first payment
        due under the Note (STD-3.2; which payment enters the denominator on an interest-only
        loan is Q-26). The excerpt''s DTI calculation for interest-only loans (first
        fully amortized payment on the original balance; for an ARM, the highest achievable
        rate at that payment''s due date) is a DTI-program provision — Q-14. \[G §7.5,
        p. 13\]


