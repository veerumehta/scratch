- rule_id: acra-standard.liabilities_assessment.dscr_calculation
  condition:
    kind: procedure
    purpose: Determine the DSCR using the calculation rule in STD-3.1 and the first-payment
      rule in STD-3.2.
    steps:
    - 'Step 1 - Initial Document Review: Identify the rent, payment, PITIA, and, if
      applicable, subordinate-financing data needed for the calculation.'
    - 'Step 2 - Eligibility Verification: Apply the lesser of annual in-place rent
      or market rent as the numerator.'
    - 'Step 3 - Validation and Verification: Use the first payment due under the terms
      of the Note and include annual principal, interest, real estate taxes, property
      insurance, homeowner''s / condominium association fees, and subordinate financing
      if applicable in the denominator.'
    - 'Step 4 - Final Determination: Calculate the DSCR only when the required calculation
      inputs and market-rent method are available; otherwise identify the unresolved
      inputs or reference.'
    checks:
    - The numerator is the lesser of annual in-place rent or market rent.
    - The denominator is the sum of annual principal, interest, real estate taxes,
      property insurance, and homeowner's / condominium association fees (PITIA),
      with subordinate financing included if applicable.
    - The calculation utilizes the first payment due under the terms of the Note.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The DSCR is calculated using the required numerator, denominator,
        and first-payment basis, with the required inputs and market-rent method available.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The calculation is pending required inputs or the unavailable §14.14
        market-rent method.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A calculation is made using a numerator, denominator, or payment
        basis that does not meet the checks.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads: []
    computable_checks: []
    missing_reads:
    - annual in-place rent
    - market rent
    - the §14.14 market-rent method
    - the first payment due under the terms of the Note
    - annual principal
    - annual interest
    - annual real estate taxes
    - annual property insurance
    - annual homeowner's / condominium association fees
    - annual subordinate-financing amount, if applicable
  action: require_evidence
  priority: 100
  description: Calculate the DSCR using the specified rent numerator and PITIA denominator,
    including subordinate financing when applicable.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Liabilities
      assistant:
      - Underwriter
      mnemonic: LIA-DSCR
      job_kind: determination
    ledger:
      clause: 'STD-3.1 “Acra calculates the DSCR by dividing (a) the lesser of (i)
        annual in-place rent or (ii) market rent (reference §14.14) by (b) the sum
        of annual principal, interest, real estate taxes, property insurance, and
        homeowner''s / condominium association fees (collectively, ‘PITIA’). Subordinate
        financing, if applicable, would also be included in the denominator for the
        sake of this calculation.” \[G §5.32, p. 3\]


        STD-3.2 “Acra calculates the DSCR utilizing the first payment due under the
        terms of the Note.” §7.5 defines Interest Only payments as “the amount sufficient
        to pay the accrued interest to the mortgage on a monthly basis at the time
        of origination”, while the §5.32 denominator lists “annual principal, interest
        …”. Which payment enters the DSCR denominator on an interest-only loan: Acra
        confirmation requested → Q-26. \[G §7.5, p. 13; §5.32, p. 3\]


        STD-3.3 The reference to subordinate financing in the denominator is a calculation
        rule; it does not itself establish that a subordinate lien is permitted. Whether
        and when subordinate financing is permitted: Acra confirmation requested →
        Q-18. \[G §5.32, p. 3\]


        STD-3.4 §14.14 (market rent), referenced in the formula, is not reproduced
        in the excerpt (Appendix B). \[G §5.32, p. 3\]'
