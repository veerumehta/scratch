    - 'Step 1 - Initial Document Review: Review the credit report for the number of
      repository scores and the reported tradelines and their histories.'
    - 'Step 2 - Eligibility Verification: For 3 repositories, apply the no-tradeline-overlay
      provision. For 2 or fewer scores, verify either 2 tradelines & 24 month history,
      or 3 tradelines & 12 month history.'
    - 'Step 3 - Validation and Verification: Verify the score count and, where applicable,
      the tradeline counts and histories from the credit report.'
