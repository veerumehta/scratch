- rule_id: acra-standard.identification_requirements.foreign_national_cltv_and_fico
  condition:
    kind: procedure
    purpose: Verify the Foreign National Program CLTV and FICO requirements in STD-4.4.
    steps:
    - 'Initial Document Review: Review the loan purpose, CLTV, and representative
      FICO score.'
    - 'Eligibility Verification: Confirm that the borrower is a Foreign National.'
    - 'Validation and Verification: Verify maximum CLTV 70% for purchase and 65% for
      refinance — rate & term and cash-out; verify that the loan is priced at FICO
      equal to 700.'
    - 'Final Determination: Record whether the applicable maximum CLTV and FICO pricing
      requirement are met.'
    checks:
    - For a purchase, CLTV is no greater than 70%.
    - For a refinance — rate & term and cash-out, CLTV is no greater than 65%.
    - The loan is priced at FICO equal to 700.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable maximum CLTV is met and the loan is priced at FICO
        equal to 700.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The transaction type, CLTV, or FICO pricing has not yet been verified.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable maximum CLTV is exceeded or the loan is not priced
        at FICO equal to 700.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not a Foreign National.
      carries_conditions: false
    evidence_types: []
    reads:
    - Borrower.citizenship_status
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    - CreditReport.representative_score
    computable_checks:
    - 0
    - 1
    - 2
    missing_reads: []
  action: require_evidence
  priority: 100
  description: Apply the stated Foreign National maximum CLTV by transaction type
    and price the loan at FICO equal to 700.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.1 Citizenship types and
    limits ¶1
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Identification
      assistant:
      - Underwriter
      mnemonic: FN-FNCLTV
      job_kind: limit
    ledger:
      clause: 'STD-4.1 Eligible borrower citizenship types: US Citizen, Permanent
        Resident, Non-Permanent Resident, Foreign National, ITIN. \[S: Borrower Citizenship\]


        STD-4.2 Permanent Resident must have an unexpired PRA ID and SSA card / SSA-89.
        \[S: Borrower Citizenship\]


        STD-4.3 Non-Permanent Resident must have proof of legal residency, which may
        include an unexpired employment authorization document (EAD) or valid visa.
        Limit printed as “Max Loan Amount: \$1.5M: Max CLTV 80%” — whether this is
        two independent limits or one conditional limit: Acra confirmation requested
        → Q-21. \[S: Borrower Citizenship\]


        STD-4.4 Foreign National: “Borrowers whose Primary Residence is not located
        in the United States of America.” Maximum CLTV 70% (purchase) and 65% (refinance
        — rate & term and cash-out); “Price loan at FICO equal to 700”. No maximum
        loan amount is stated for foreign nationals: Acra confirmation requested →
        Q-21. Program documentation is in section 5. \[S: Borrower Citizenship\]


        STD-4.5 ITIN: “ITIN is defined as any non-resident that is unable to provide
        any of the ‘Non-Permanent Resident Alien’ documents listed above.” Maximum
        loan amount \$1.0M; minimum FICO 640; maximum CLTV by FICO as printed below.
        §3.10 separately admits ITIN holders under the foreign-national program when
        they reside outside the US. Whether a US-resident ITIN holder is eligible,
        and whether the tier printed “FICO 700” means 700 and above: Acra confirmation
        requested → Q-03. \[S: Borrower Citizenship; G §3.10, p. 6\]


        | **ITIN tier as printed** | **Purchase** | **Refinance — R/T and cash-out**
        |

        |--------------------------|--------------|----------------------------------|

        | “FICO 700”               | 70%          | 65%                              |

        | “FICO 660 to 699”        | 65%          | 60%                              |

        | “FICO 640 to 659”        | 60%          | 60%                              |'
  approval_refs: []
