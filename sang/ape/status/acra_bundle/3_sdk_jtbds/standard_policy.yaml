- rule_id: acra-standard.loan_program_eligibility.investment_occupancy
  condition:
    kind: procedure
    purpose: Determine whether the subject meets the program's investment-property
      occupancy requirement.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan_application and any lease_agreement
      or rent_roll for evidence of the subject''s occupancy and rental use.'
    - 'Step 2 - Eligibility Verification: Verify that the property is investment property
      (non-owner occupied) and that it is a one- to four-unit residential dwelling,
      a condominium unit, or a PUD unit owned by an individual who does not occupy
      it.'
    - 'Step 3 - Validation and Verification: Verify that the dwelling is leased and
      occupied as a principal year-round residence by individuals other than the owner.'
    - 'Step 4 - Final Determination: Determine whether the investment-property occupancy
      requirement is met.'
    checks:
    - The subject is an investment property (non-owner occupied).
    - The dwelling is leased and occupied as a principal year-round residence by individuals
      other than the owner.
    - The dwelling or unit is within the eligible investment-property description.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every step is met and every check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The property appears to meet the investment-property requirement,
        subject to obtaining evidence needed to establish tenant occupancy or principal-residence
        use.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The owner occupies the dwelling, the dwelling is not leased and occupied
        as a principal year-round residence by individuals other than the owner, or
        the property is outside the eligible investment-property description.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - loan_application
    - lease_agreement
    - rent_roll
    reads:
    - SubjectProperty.occupancy_subtype
    - SubjectProperty.number_of_units
    - SubjectProperty.has_current_lease
    computable_checks: []
    missing_reads:
    - Evidence establishing whether the owner occupies the dwelling.
    - Evidence establishing year-round tenant occupancy and the dwelling's principal-residence
      use.
  action: require_evidence
  priority: 100
  description: Verify that the subject is an eligible investment property.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.1 Occupancy, purpose and
    qualification ¶1
