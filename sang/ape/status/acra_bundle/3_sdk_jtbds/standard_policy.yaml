    purpose: Determine whether an ITIN loan meets the limits expressly printed for
      the ITIN program.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan_application and credit_report
      for ITIN status, loan amount, score, purpose, and CLTV.'
