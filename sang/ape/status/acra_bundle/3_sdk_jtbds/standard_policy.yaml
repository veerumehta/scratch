- rule_id: acra-standard.identification_requirements.itin_cltv_tier
  condition:
    kind: procedure
    purpose: Verify the ITIN CLTV limits printed in STD-4.5 without interpreting the
      “FICO 700” tier beyond the text.
    steps:
    - 'Initial Document Review: Review the representative FICO score, loan purpose,
      and CLTV.'
    - 'Eligibility Verification: Confirm that the borrower is an ITIN holder.'
    - 'Validation and Verification: Apply the printed tier and maximum CLTV: “FICO
      700” — 70% purchase and 65% refinance — R/T and cash-out; “FICO 660 to 699”
      — 65% purchase and 60% refinance — R/T and cash-out; “FICO 640 to 659” — 60%
      purchase and 60% refinance — R/T and cash-out. Do not resolve the stated “FICO
      700” ambiguity without Acra confirmation.'
    - 'Final Determination: Record whether the applicable printed tier limit is met.'
    checks:
    - For “FICO 700”, purchase CLTV is no greater than 70%.
    - For “FICO 700”, refinance — R/T and cash-out CLTV is no greater than 65%.
    - For “FICO 660 to 699”, purchase CLTV is no greater than 65%.
    - For “FICO 660 to 699”, refinance — R/T and cash-out CLTV is no greater than
      60%.
    - For “FICO 640 to 659”, purchase CLTV is no greater than 60%.
    - For “FICO 640 to 659”, refinance — R/T and cash-out CLTV is no greater than
      60%.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable printed tier’s maximum CLTV is met, and any applicable
        Acra confirmation concerning the “FICO 700” tier has been obtained.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The applicable tier or CLTV has not been verified, or applicable
        Acra confirmation concerning the “FICO 700” tier remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable printed tier’s maximum CLTV is exceeded.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an ITIN holder.
      carries_conditions: false
    evidence_types:
    - credit_report
    reads:
    - Borrower.citizenship_status
    - CreditReport.representative_score
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    missing_reads: []
  action: require_evidence
  priority: 100
  description: Apply the printed ITIN maximum CLTV by FICO tier and transaction type,
    subject to the stated Acra clarification.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.1 Citizenship types and
    limits ¶1
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Identification
      assistant:
      - Underwriter
      mnemonic: BOR-ITINCLTV
      job_kind: limit
    ledger:
      clause: 'STD-4.1 Eligible borrower citizenship types: US Citizen, Permanent
        Resident, Non-Permanent Resident, Foreign National, ITIN. \[S: Borrower Citizenship\]


        STD-4.2 Permanent Resident must have an unexpired PRA ID and SSA card / SSA-89.
        \[S: Borrower Citizenship\]


        STD-4.3 Non-Permanent Resident must have proof of legal residency, which may
        include an unexpired employment authorization document (EAD) or valid visa.
        Limit printed as “Max Loan Amount: \$1.5M: Max CLTV 80%” — whether this is
        two independent limits or one conditional limit: Acra confirmation requested
        → Q-21. \[S: Borrower Citizenship\]


        STD-4.4 Foreign National: “Borrowers whose Primary Residence is not located
