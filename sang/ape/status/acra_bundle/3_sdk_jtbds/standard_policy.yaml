- rule_id: acra-standard.credit_review_analysis.bankruptcy_and_foreclosure_seasoning_limits
  condition:
    kind: procedure
    purpose: Check the printed maximum CLTV or ineligible result for the stated bankruptcy
      and foreclosure seasoning bands.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application and credit information
      for bankruptcy or foreclosure history, seasoning, loan purpose, and CLTV.'
    - 'Step 2 - Eligibility Verification: Apply this provision when the borrower has
      a bankruptcy or foreclosure.'
    - 'Step 3 - Validation and Verification: Compare seasoning and loan purpose with
      the printed table: ≥ 36 Mo, No Restrictions; 24-35 Mo, 80% purchase / 75% refinance;
      12-23 Mo, 65% purchase / 65% refinance; < 12 Mo, Ineligible.'
    - 'Step 4 - Final Determination: Record whether the applicable printed restriction
      is met.'
    checks:
    - For seasoning ≥ 36 Mo, the table states No Restrictions.
    - For seasoning 24-35 Mo, CLTV is no more than 80% for purchase or 75% for refinance
      — rate & term and cash-out.
    - For seasoning 12-23 Mo, CLTV is no more than 65% for purchase or 65% for refinance
      — rate & term and cash-out.
    - For seasoning < 12 Mo, the case is Ineligible.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable seasoning restriction is met and the case is not in
        an Ineligible band.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable maximum CLTV is exceeded or seasoning is < 12 Mo.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower has no bankruptcy or foreclosure.
      carries_conditions: false
    evidence_types:
    - loan_application
    - credit_report
    reads:
    - Borrower.has_bankruptcy_or_foreclosure
    - Borrower.months_since_bankruptcy_or_foreclosure
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    - 1
    - 2
    - 3
    missing_reads:
    - Bankruptcy or foreclosure seasoning as measured under Acra’s labels; definitions
      and measurement are subject to Acra confirmation → Q-05
  action: require_evidence
  priority: 100
  description: Apply the printed bankruptcy and foreclosure seasoning CLTV restrictions
    by loan purpose.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#7.3 Housing history and previous
    credit events, as printed
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Credit
      assistant:
      - Underwriter
      mnemonic: CRD-BKFORE
      job_kind: limit
    ledger:
      clause: 'STD-7.9 Mortgage history restrictions. The labels are Acra''s; their
        definitions and how seasoning is measured: Acra confirmation requested → Q-05.
        In the three tables below, where the Summary prints a single figure without
        a purpose split (“Max CLTV: 65%”), it is shown in both columns. \[S: Housing
        History & PCEs\]


        | **Printed label** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T, Refi
        C/O** |

        |----|----|----|

        | 1x30x12 | 80% | 75% |

        | 0x60x12 | 75% | 70% |

        | 0x90x12 | 65% | 65% |

        | 0x120x12 | Ineligible | Ineligible |


        STD-7.10 Bankruptcy & foreclosure restrictions. \[S: Housing History & PCEs\]


        | **Seasoning as printed** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T,
        Refi C/O** |

        |----|----|----|

        | ≥ 36 Mo | No Restrictions | No Restrictions |

        | 24-35 Mo | 80% | 75% |

        | 12-23 Mo | 65% | 65% |

        | \< 12 Mo | Ineligible | Ineligible |


        STD-7.11 Short sale, deed-in-lieu & modification restrictions; and, printed
        beneath them, “FB Taken ≤6 Mos: Case-by-case” (meaning and timing → Q-05).
        \[S: Housing History & PCEs\]


        | **Seasoning as printed** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T,
        Refi C/O** |

        |----|----|----|

        | ≥ 24 Mo | No Restrictions | No Restrictions |

        | 12-23 Mo | 80% | 75% |

        | \< 12 Mo | 75% | 70% |'
