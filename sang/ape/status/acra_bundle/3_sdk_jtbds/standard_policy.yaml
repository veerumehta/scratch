- rule_id: acra-standard.income_stability_sufficiency_analysis.calculate_dscr
  condition:
    kind: procedure
    purpose: Determine the calculated DSCR for a file qualifying using a calculated
      DSCR.
    steps:
    - 'Initial Document Review: Review the rental-income and property-expense information
      used for the calculation.'
    - 'Eligibility Verification: Confirm that the file qualifies using a calculated
      DSCR, rather than No Ratio DSCR.'
    - 'Validation and Verification: Calculate DSCR by dividing the lesser of annual
      in-place rent or market rent by the sum of annual principal, interest, real
      estate taxes, property insurance, homeowner''s / condominium association fees,
      and subordinate financing, if applicable. Use the first payment due under the
      terms of the Note.'
    - 'Final Determination: Record the calculated DSCR. Do not calculate a DSCR for
      a No Ratio DSCR file. The guidelines do not resolve which payment enters the
      denominator for an interest-only loan.'
    checks:
    - For a file qualifying using a calculated DSCR, the calculated DSCR divides the
      lesser of annual in-place rent or market rent by annual PITIA, including subordinate
      financing if applicable.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The file qualifies using a calculated DSCR and the calculated DSCR
        follows the stated formula.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The file qualifies using a calculated DSCR and the calculation does
        not follow the stated formula, or required calculation inputs are not established.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The file qualifies as No Ratio DSCR, where no ratio is calculated.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    - rent_roll
    - appraisal_report
    reads:
    - LoanCore.dscr_qualification_method
    computable_checks: []
    missing_reads:
    - DSCR qualification method, if not recorded in the case field
    - Annual in-place rent
    - Market rent
    - Annual principal
    - Annual interest
    - Annual real estate taxes
    - Annual property insurance
    - Annual homeowner's / condominium association fees
    - Annual subordinate financing payment, if applicable
    - The applicable interest-only loan payment for the DSCR denominator, if applicable
  action: require_evidence
  priority: 100
  description: Calculate the DSCR using the qualifying rent and PITIA inputs specified
    in the guidelines.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.1 Occupancy, purpose and
    qualification ¶1
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3. DSCR calculation and rental
    income
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-RATIO
      job_kind: determination
    ledger:
      clause: 'STD-1.1 Occupancy is investment property (non-owner occupied) only.
        \[S: Occupancy Type\]


        STD-1.2 An investment property is “a one- to four-unit residential dwelling
        or a unit in a condominium complex or a PUD owned by an individual who does
        not occupy the dwelling. The dwelling is leased and occupied as a principal
        year-round residence to individuals other than the owner.” \[G §3.41, p. 11\]


        STD-1.3 The Program Summary is listed as “Business Purpose DSCR” on Acra''s
        rate-sheet page. “Where the borrower is qualifying utilizing the subject property''s
        actual or market cashflow under a business purpose transaction, borrower must
        execute with loan docs a Business Purpose Attestation (Exhibit 8) or other
        similar attestation approved by Acra.” The excerpt''s §8.4 also refers to
        consumer transactions (STD-9.2); whether every loan on this program is a business-purpose
        transaction: Acra confirmation requested → Q-27. \[G §5.32, p. 3; acralending.com/ratesheets\]


        STD-1.4 The matrix columns are Purchase, Rate & Term and Cash-Out. Delayed
        financing is addressed only by the matrix footnote “Delayed financing is capped
        at \$1.5MM”. Which column and which cash-in-hand rule apply to delayed financing:
        Acra confirmation requested → Q-06. \[S: matrix and footnote\]


        STD-1.5 A loan qualifies either by a calculated DSCR (§5.32) or as No Ratio
        DSCR, where no ratio is calculated (§5.33). Both are set out in section 3.
        \[G §5.32–5.33, p. 3\]


        STD-1.6 “Borrowing entity income documentation not required.” Acra will not
        calculate a DTI for applicants who qualify using a DSCR; income or employment
        listed on an application is superfluous to the underwrite and may be left
        blank, and if represented, a DTI should not be calculated. \[S: Income Documentation;
        G §7.3, p. 5\]


        This section sets out how Acra defines the ratio, what rent may be used, what
        documents establish it, and the minimum ratios and caps that attach to particular
        situations. The rent provisions of §5.32 are quoted in full because the section
        contains two formulations that Acra is asked to reconcile.


        STD-3.1 “Acra calculates the DSCR by dividing (a) the lesser of (i) annual
        in-place rent or (ii) market rent (reference §14.14) by (b) the sum of annual
        principal, interest, real estate taxes, property insurance, and homeowner''s
        / condominium association fees (collectively, ‘PITIA’). Subordinate financing,
        if applicable, would also be included in the denominator for the sake of this
        calculation.” \[G §5.32, p. 3\]


        STD-3.2 “Acra calculates the DSCR utilizing the first payment due under the
        terms of the Note.” §7.5 defines Interest Only payments as “the amount sufficient
        to pay the accrued interest to the mortgage on a monthly basis at the time
        of origination”, while the §5.32 denominator lists “annual principal, interest
        …”. Which payment enters the DSCR denominator on an interest-only loan: Acra
        confirmation requested → Q-26. \[G §7.5, p. 13; §5.32, p. 3\]


        STD-3.3 The reference to subordinate financing in the denominator is a calculation
        rule; it does not itself establish that a subordinate lien is permitted. Whether
        and when subordinate financing is permitted: Acra confirmation requested →
        Q-18. \[G §5.32, p. 3\]


        STD-3.4 §14.14 (market rent), referenced in the formula, is not reproduced
        in the excerpt (Appendix B). \[G §5.32, p. 3\]'
  approval_refs: []
- rule_id: acra-standard.income_stability_sufficiency_analysis.verify_higher_actual_rent_evidence
  condition:
    kind: procedure
    purpose: Determine whether the documentation stated for actual rents exceeding
      market rents is present.
    steps:
    - 'Initial Document Review: Review the actual-rent and market-rent information,
      rental-income receipt evidence, and lease agreement(s).'
    - 'Eligibility Verification: Determine whether actual rents exceed market rents.'
    - 'Validation and Verification: If actual rents exceed market rents, verify two
      (2) consecutive months proof of rental income receipt and lease agreement(s)
      to continue at a minimum of three (3) months after closing. Do not count a Security
      Deposit towards receipt; rents cannot be prepaid.'
    - 'Final Determination: Record whether the stated evidence and lease conditions
      are met. The guidelines do not select between the formula using the lesser of
      annual in-place rent or market rent and the provision allowing use of the higher
      of actual or market rents.'
    checks:
    - If actual rents exceed market rents, two (2) consecutive months proof of rental
      income receipt is documented, lease agreement(s) continue at a minimum of three
      (3) months after closing, no Security Deposit is counted towards receipt, and
      rents are not prepaid.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Actual rents exceed market rents and all stated documentation and
        lease conditions are met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Actual rents exceed market rents and required proof or lease documentation
        is outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Actual rents exceed market rents and the stated receipt or lease
        conditions are not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Actual rents do not exceed market rents.
      carries_conditions: false
    evidence_types:
    - bank_statement
    - lease_agreement
    reads: []
    computable_checks: []
    missing_reads:
    - Actual rent amount
    - Market rent amount
    - Closing date
    - Rental-income receipt dates and amounts
    - Whether any receipt is a Security Deposit
    - Whether rents have been prepaid
    - Lease end date
  action: require_evidence
  priority: 100
  description: Verify the specified rental-income receipt and lease evidence when
    actual rents exceed market rents.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both
    provisions, as written
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-ACTUALRENT
      job_kind: verification
    ledger:
      clause: 'STD-3.5 Formula: the lesser of annual in-place rent or market rent
        (STD-3.1). \[G §5.32, p. 3\]


        STD-3.6 Note in the same section: “Acra may use the higher of actual or market
        rents. Where actual rents exceed market rents, then evidence of actual rents
        must be documented via two (2) consecutive months proof of rental income receipt
        and lease agreement(s) to continue at a minimum of three (3) months after
        closing. Note: Security Deposit does not count towards receipt, and the rents
        cannot be prepaid.” \[G §5.32, p. 3; repeated under Actual Rents, p. 5\]


        STD-3.7 This document does not select between STD-3.5 and STD-3.6. When market
        rent may be used if actual rent is lower, when higher actual rent may be used,
        and whether the stated documentation is sufficient or further approval is
        required: Acra confirmation requested → Q-01.


        STD-3.8 “If vacant property is being purchased, qualifying rents are taken
        from the 1007 or 1025 Appraisal report, as applicable, for qualifying income.”
        Rental income from the purchase of a vacant property requires a 1007 survey
        if it is the subject of an Acra loan. \[G §5.32, p. 3; §5.30–5.31, p. 4\]'
  approval_refs: []
- rule_id: acra-standard.income_stability_sufficiency_analysis.verify_rent_schedule
  condition:
    kind: procedure
    purpose: Verify the required Single-Family Comparable Rent Schedule or the stated
      short-term-rental replacement.
    steps:
    - 'Initial Document Review: Review the appraisal and rental-income evidence in
      the file.'
    - 'Eligibility Verification: Determine whether the property is single family on
      a DSCR qualifying file, the transaction is a lease-option purchase using excess
      monthly rent contributions for the required down payment, or proposed rental
      income is being used to qualify.'
    - 'Validation and Verification: For a single-family property, verify that a Single-Family
      Comparable Rent Schedule (FNMA Form 1007) is present. For a property occupied
      as a short-term rental, an STRpro or similar appraisal form may replace a 1007
      if signed by an appropriately licensed appraiser. A 1007 may be from the original
      appraiser or any state licensed appraiser.'
    - 'Final Determination: Record whether the applicable rent-schedule requirement
      is met.'
    checks:
    - A 1007 is present when required for a single-family DSCR qualifying file, a
      lease-option purchase using excess monthly rent contributions for the required
      down payment, or when proposed rental income is used to qualify, unless the
      stated short-term-rental replacement applies.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable rent-schedule requirement is met, including the stated
        short-term-rental replacement when applicable.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Required rent-schedule evidence or verification is outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Required rent-schedule evidence is not provided or does not meet
        the stated requirements.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: None of the stated circumstances requiring a rent schedule applies.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    reads:
    - SubjectProperty.property_type
    - SubjectProperty.occupancy_subtype
    computable_checks: []
    missing_reads:
    - Whether proposed rental income is being used to qualify
    - Whether lease-option purchase down-payment funds are generated from excess monthly
      rent contributions
    - Whether the property is occupied as a short-term rental
    - Appraiser licensing status
    - Appraiser identity, to establish whether the appraiser is the original appraiser
  action: require_evidence
  priority: 100
  description: Verify that required rent-schedule evidence is present for a single-family
    DSCR file or when proposed rental income is used to qualify.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.3 Rent schedules and rent
    evidence ¶1
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-SCHEDULE
      job_kind: verification
    ledger:
      clause: 'STD-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA
        Form 1007) for single family properties on (i) all DSCR qualifying files,
        (ii) lease-option purchase transactions where the down payment required in
        §3.45 is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. \[G §14.12, p. 4\]


        STD-3.10 A 1007 may be from the original appraiser or any state licensed appraiser.
        \[G §14.12, p. 4\]


        STD-3.11 Single family investment properties with excessive monthly rent payments
        reflected on the lease require documentation supporting that the monthly rent
        is typical for the area; acceptable documentation may include classified ads
        from local newspapers, a 1007 completed by the appraiser, or a market rent
        survey completed by a local real estate company or rental management company
        familiar with the market rents in the area. \[G §14.12, p. 4\]


        STD-3.12 Short-term rental, appraisal form: for properties occupied as a short-term
        rental, an STRpro or similar appraisal form is acceptable as replacement to
        a 1007 as long as it is signed by an appropriately licensed appraiser. \[G
        §14.13, p. 4\]


        STD-3.13 Short-term rental, actual rents: “Acra can accept short term rentals
        with 12-month ledgers from condotel management companies, property managers,
        AirBnB, VRBO, etcetera as documentation for actual rents.” How a 12-month
        ledger establishes qualifying rent, and how the receipt and lease conditions
        of STD-3.6 apply to short-term rentals: Acra confirmation requested → Q-02.
        \[G §5.32, p. 3; §14.13, p. 4\]


        STD-3.14 Short-term rental caps: “Properties qualifying with short-term rentals
        are limited to 75% & 70% LTV / CLTV for Purchase or Refinance transactions
        respectively”; the Summary states maximum CLTV 75% (purchase) and 70% (refinance
        — rate & term and cash-out), minimum FICO 640. \[G §5.32, p. 3; S: Occupancy
        Type\]'
