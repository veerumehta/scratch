- rule_id: acra-standard.property_tax_calculation.dscr_calculation
  condition:
    kind: procedure
    purpose: Calculate DSCR with annual real estate taxes included in the denominator.
    steps:
    - 'Step 1 - Initial Document Review: Gather the data needed for the DSCR calculation:
      annual in-place rent, market rent, the annual denominator amounts, and the first
      payment due under the terms of the Note. Identify whether the loan is interest-only.'
    - 'Step 2 - Eligibility Verification: Use the lesser of annual in-place rent or
      market rent as the numerator. Include annual principal, interest, real estate
      taxes, property insurance, and homeowner''s / condominium association fees in
      the denominator; include subordinate financing if applicable.'
    - 'Step 3 - Validation and Verification: Divide the numerator by the denominator.
      If the loan is interest-only, obtain Acra confirmation of which payment enters
      the denominator. Apply the market rent reference §14.14 only when its applicable
      method is available; it is not reproduced in the excerpt.'
    - 'Step 4 - Final Determination: Record the DSCR only when the required amounts
      and applicable calculation basis are available. Do not treat the subordinate-financing
      calculation rule as establishing that subordinate financing is permitted.'
    checks:
    - The numerator is the lesser of annual in-place rent or market rent.
    - The denominator includes annual principal, interest, real estate taxes, property
      insurance, and homeowner's / condominium association fees.
    - Subordinate financing is included in the denominator if applicable.
    - The DSCR is the numerator divided by the denominator.
    - The first payment due under the terms of the Note is used, subject to Acra confirmation
      of the payment basis for an interest-only loan.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every step is met and every check holds, with the applicable market
        rent method and, for an interest-only loan, Acra confirmation available.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The calculation is subject to obtaining data needed for the formula,
        the applicable §14.14 market rent method, or Acra confirmation of the denominator
        payment basis for an interest-only loan.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A step is not met or a check does not hold, including when the calculation
        omits annual real estate taxes from the denominator.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads:
    - MortgageLoanInformation.is_interest_only
    computable_checks: []
    missing_reads:
    - Annual in-place rent.
    - Market rent and the applicable §14.14 method.
    - Annual principal.
    - Annual interest.
    - Annual real estate taxes.
    - Annual property insurance.
    - Annual homeowner's / condominium association fees.
    - Subordinate financing amount, if applicable.
    - The first payment due under the terms of the Note.
    - Acra confirmation of which payment enters the denominator for an interest-only
      loan, if applicable.
  action: require_evidence
  priority: 100
  description: Calculate DSCR using the lesser of annual in-place rent or market rent
    as the numerator and the specified annual payment and expense amounts as the denominator.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Taxes
      assistant:
      - Underwriter
      mnemonic: TAX-DSCR
      job_kind: determination
    ledger:
      clause: 'STD-3.1 “Acra calculates the DSCR by dividing (a) the lesser of (i)
        annual in-place rent or (ii) market rent (reference §14.14) by (b) the sum
        of annual principal, interest, real estate taxes, property insurance, and
        homeowner''s / condominium association fees (collectively, ‘PITIA’). Subordinate
        financing, if applicable, would also be included in the denominator for the
        sake of this calculation.” \[G §5.32, p. 3\]


        STD-3.2 “Acra calculates the DSCR utilizing the first payment due under the
        terms of the Note.” §7.5 defines Interest Only payments as “the amount sufficient
        to pay the accrued interest to the mortgage on a monthly basis at the time
        of origination”, while the §5.32 denominator lists “annual principal, interest
        …”. Which payment enters the DSCR denominator on an interest-only loan: Acra
        confirmation requested → Q-26. \[G §7.5, p. 13; §5.32, p. 3\]


        STD-3.3 The reference to subordinate financing in the denominator is a calculation
        rule; it does not itself establish that a subordinate lien is permitted. Whether
        and when subordinate financing is permitted: Acra confirmation requested →
        Q-18. \[G §5.32, p. 3\]


        STD-3.4 §14.14 (market rent), referenced in the formula, is not reproduced
        in the excerpt (Appendix B). \[G §5.32, p. 3\]'
  approval_refs: []
- rule_id: acra-standard.title_review.additional_trust_documentation
  condition:
    kind: procedure
    purpose: Determine whether any additional supporting documentation Legal conditions
      for has been provided.
    steps:
    - 'Initial Document Review: Review the trust file and any conditions from Legal.'
    - 'Eligibility Verification: Determine whether Legal has exercised its right to
      condition for additional supporting documentation.'
    - 'Validation and Verification: If Legal has conditioned for additional supporting
      documentation, obtain and review the specified supporting documentation.'
    - 'Final Determination: Record whether all additional documentation conditions
      have been cleared or no additional documentation was conditioned for.'
    checks:
    - If Legal has conditioned for additional supporting documentation, the specified
      supporting documentation has been provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Legal has not conditioned for additional supporting documentation,
        or all documentation Legal conditioned for has been provided.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Legal has conditioned for additional supporting documentation and
        the documentation remains to be provided.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Legal has conditioned for additional supporting documentation and
        the specified documentation has not been provided or does not satisfy the
        condition.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Title is not vested in an inter vivos revocable trust.
      carries_conditions: false
    evidence_types: []
    reads:
    - Borrower.entity_type
    computable_checks: []
    missing_reads:
    - Whether Legal has conditioned for additional supporting documentation and, if
      so, the specified documentation.
  action: require_evidence
  priority: 100
  description: Address any additional trust supporting documentation required by Legal
    in its sole discretion.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.4 Revocable living trusts
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Title
      assistant:
      - Underwriter
      mnemonic: TTL-TRUSTSUPPORT
      job_kind: condition
    ledger:
      clause: 'STD-6.13 Title vesting in an inter vivos revocable trust is permitted
        when all of the following requirements are followed. \[G §3.12, pp. 9–10\]


        - A complete, legible copy of the Trust, or a Certification of Trust stating:
        the existence and date of the Trust; the Trustor(s) and the current Trustee(s);
        the powers of the Trustee; whether the Trust is revocable and, if revocable,
        who holds the right to revoke; the names and number of the Trustees required
        to sign on behalf of the Trust; the Trust identification number (a Social
        Security number or an IRS-issued Tax Identification Number); how title to
        the Trust assets should be taken; and a statement that the Trust has not been
        revoked, modified, or amended in any manner.


        - The Trust must be valid under the laws of the state in which it is established.


        - The Trust must be revocable, meaning it can be changed or canceled at any
        time for any reason during a Trustor''s lifetime. Irrevocable trust is not
        permitted.


        - The Trust must be established by one or more natural persons, solely or
        jointly (Grantor, Trustor, or Settlor), and must become effective during the
        lifetime of the person(s) establishing it.


        - The primary beneficiary of the Trust must be the individual(s) establishing
        the Trust.


        - Written exception by Acra Senior Management must be obtained if the Trustor(s)
        and Trustee(s) are not the same.


        - The Trust must specify that the Trustee has the power to hold title and
        mortgage the property; that the beneficiary does not need to grant written
        consent for the Trust to borrow money, or that such consent has been granted
        in writing for purposes of the mortgage; that there is no unusual risk or
        impairment to the lender''s rights; and that holding title in the Trust does
        not diminish the lender''s rights as a creditor.


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
  approval_refs: []
