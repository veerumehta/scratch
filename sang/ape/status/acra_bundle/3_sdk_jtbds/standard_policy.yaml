      to a requested waiver.'
    - 'Step 3 - Validation and Verification: Verify each requirement: maximum loan
      amount $1.5M; maximum CLTV 80%; minimum FICO 700; mortgage history no worse
      than 0x30x24; Foreign National ineligible.'
    - 'Step 4 - Final Determination: Record whether the waiver requirements are met.
      Separately note that interaction with impound requirements is referred for Acra
      confirmation → Q-15.'
