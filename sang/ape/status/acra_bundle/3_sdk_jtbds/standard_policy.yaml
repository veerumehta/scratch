- rule_id: acra-standard.asset_assessment.rent_loss_insurance_reserves
  condition:
    kind: procedure
    purpose: Determine whether the stated reserve requirement is met when required
      rent loss insurance cannot be obtained.
    steps:
    - 'Initial Document Review: Review the rent loss insurance requirement, evidence
      of coverage obtained or not obtained, and reserves documentation.'
    - 'Eligibility Verification: Determine whether rent loss insurance is required
      but cannot be obtained.'
    - 'Validation and Verification: Verify Two (2) months reserves for every one (1)
      month of coverage not provided.'
    - 'Final Determination: Pass only if the stated reserves are verified; determine
      whether substituted reserves are additional only as directed by Acra confirmation.'
    checks:
    - When rent loss insurance is required but cannot be obtained, reserves are Two
      (2) months for every one (1) month of coverage not provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The required rent loss insurance cannot be obtained and reserves
        of Two (2) months for every one (1) month of coverage not provided are verified.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The coverage gap or corresponding reserves remain to be verified;
        whether substituted reserves are additional is subject to Acra confirmation
        → Q-07.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Rent loss insurance is required but cannot be obtained and the stated
        reserves are not verified.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Rent loss insurance is not required or can be obtained.
      carries_conditions: false
