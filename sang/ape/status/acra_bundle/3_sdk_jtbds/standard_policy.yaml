      mnemonic: FN-FNAGENT
      job_kind: verification
    ledger:
      clause: 'STD-5.11 Each of the following must be met: a copy of current Passport,
        Visa, or ITIN; all loans closed with a title and closing agent approved and
        / or vetted by Acra; Power of Attorney acceptable provided it conforms to
        Acra requirements and is acceptable to the title company; executed W-8 (BEN)
        IRS form. \[G §3.10, p. 7\]


        STD-5.12 Documents signed outside of the U.S. may be notarized by a U.S. embassy
