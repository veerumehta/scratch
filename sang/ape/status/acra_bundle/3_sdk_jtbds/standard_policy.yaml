- rule_id: acra-standard.loan_program_eligibility.first_time_homebuyer_conditions
  condition:
    kind: procedure
    purpose: Determine whether a first-time homebuyer meets the program's stated DSCR
      conditions.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan_application, credit_report,
      and supporting loan records for all applicants'' homeownership history and the
      loan terms.'
    - 'Step 2 - Eligibility Verification: Apply the definition that all Applicants
      have never previously owned a home (real property).'
    - 'Step 3 - Validation and Verification: Verify minimum 700 FICO, maximum 70%
      CLTV, minimum DSCR of 1.150, maximum loan amount of $1,000,000, full amortization
      with no interest-only programs, impounds, and minimum six months reserves.'
    - 'Step 4 - Final Determination: Determine whether the first-time homebuyer definition
      and all applicable DSCR conditions are met.'
    checks:
    - All Applicants have never previously owned a home (real property).
    - FICO is at least 700.
    - CLTV does not exceed 70%.
    - DSCR is at least 1.150.
    - Loan amount does not exceed $1,000,000.
    - The loan is fully amortizing and is not interest-only.
    - Impounds are required.
    - Reserves are at least six months.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The first-time homebuyer definition and every stated DSCR condition
        are met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The borrower meets the definition, but evidence or a stated condition
        remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The first-time homebuyer definition or any stated DSCR condition
        is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The applicants do not meet the definition of a first-time homebuyer.
      carries_conditions: false
    evidence_types:
    - loan_application
    - credit_report
    - bank_statement
    reads:
    - Borrower.is_first_time_homebuyer
    - CreditReport.representative_score
    - LoanCore.cltv_percent
    - LoanCore.total_loan_amount_usd
    - MortgageLoanInformation.is_interest_only
