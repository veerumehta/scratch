- rule_id: acra-standard.loan_program_eligibility.eligible_property_type
  condition:
    kind: procedure
    purpose: Determine whether the property type is eligible and whether its stated
      CLTV cap is met.
    steps:
    - 'Step 1 - Initial Document Review: Review the appraisal_report and loan_application
      for property type, units, location, purpose, and CLTV.'
    - 'Step 2 - Eligibility Verification: Confirm the property type is SFR, Townhome,
      PUD, Warrantable Condo, Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units,
      or Manufactured.'
    - 'Step 3 - Validation and Verification: Apply the printed caps: Non-Warrantable
      Condo 80% purchase / 75% refinance and minimum DSCR 1.0; Condotel / PUDtel 75%
      purchase / 70% refinance rate & term / 65% refinance cash-out and minimum DSCR
      1.0; 2-4 Unit maximum CLTV 80%; Manufactured Home 65% purchase / 60% refinance.
      Apply the Florida -5% CLTV adjustment for Non-Warrantable Condo and Condotel
      / PUDtel. Apply rural / unique property maximum CLTV 80% purchase / 75% refinance
      rate & term / 70% refinance cash-out, minimum FICO 700, and minimum DSCR 1.00.
      Above 80.00% LTV, only SFR, Warrantable Condos outside of Florida, Townhome
      and PUD are eligible.'
    - 'Step 4 - Final Determination: Determine whether the property type is eligible
      and every applicable printed condition is met.'
    checks:
    - The property type is among the published eligible property types.
    - The applicable printed property-type CLTV cap is met.
    - For a Non-Warrantable Condo or Condotel / PUDtel, the applicable minimum DSCR
      is met.
    - For rural / unique property, the minimum FICO and minimum DSCR are met and the
      applicable CLTV cap is met.
    - If LTV is above 80.00%, the property is SFR, a Warrantable Condo outside of
      Florida, Townhome, or PUD.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is an eligible type and every applicable printed property-type
        requirement is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Evidence needed to establish property type, rural / unique status,
        DSCR, FICO, or transaction purpose remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property type is not eligible or an applicable printed property-type
        requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    - loan_application
    reads:
    - SubjectProperty.property_type
    - SubjectProperty.number_of_units
    - SubjectProperty.state
    - SubjectProperty.is_rural
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    - CreditReport.representative_score
    computable_checks:
    - 0
    - 1
    - 4
    missing_reads:
    - Appraisal evidence establishing the property type and, if applicable, rural
      / unique characteristics.
    - DSCR result for applicable property-type minimums.
    - FICO and transaction-purpose classification for applicable property-type limits.
  action: require_evidence
