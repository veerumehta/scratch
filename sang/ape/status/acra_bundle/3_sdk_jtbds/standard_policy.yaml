- rule_id: acra-standard.loan_program_eligibility.entity_borrower_eligibility
  condition:
    kind: procedure
    purpose: Determine whether an entity borrower and its entity structure meet the
      stated entity eligibility requirements.
    steps:
    - 'Step 1 - Initial Document Review: Review entity_documents and the loan_application
      for entity type, formation and base, purpose, assets, ownership, and title-holding
      entities.'
    - 'Step 2 - Eligibility Verification: Verify that the entity is a permitted type,
      US formed and based, and not a foreign-owned entity; verify that an entity borrower
      is an SPE engaged in owning and operating residential investment or rental properties
      and has no assets other than residential investment or rental properties.'
    - 'Step 3 - Validation and Verification: Verify that all entities holding direct
      ownership of the subject property are borrowing entities; exclude Cooperatives,
      Irrevocable Trusts, Land Trusts, IRAs, Non-Profit, and Joint Ventures; verify
      that nesting is limited to one (1) wholly-owned subsidiary owned by individual(s).'
    - 'Step 4 - Final Determination: Determine whether the entity borrower and structure
      meet the stated requirements.'
    checks:
    - The entity is an allowed entity type and is US formed and based, and is not
      foreign owned.
    - The entity borrower meets the stated SPE description and is not a series LLC.
    - Every entity holding direct ownership of the subject property is a borrowing
      entity.
    - The structure is not a prohibited entity type and does not exceed the stated
      nesting limit.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every stated entity eligibility and structure requirement is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Entity documents or evidence needed to establish a stated entity
        requirement remain outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The entity type, formation, SPE status, title-holding structure,
        or nesting structure does not meet a stated requirement.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    - title_commitment
    - loan_application
    reads:
    - Borrower.entity_type
    - Borrower.is_entity_borrower_1
    - Borrower.entity_documents_complete
    computable_checks: []
    missing_reads:
    - Entity formation, base, ownership, entity type, assets, business activities,
      and nesting structure.
    - Evidence identifying every direct owner of the subject property.
  action: require_evidence
  priority: 100
  description: Verify the stated entity-form, formation, and ownership-structure requirements.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.1 Entity eligibility and
    guarantees ¶1
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.1 Entity eligibility and
    guarantees ¶2
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Eligibility
      assistant:
      - Underwriter
      mnemonic: BOR-ENTITY
      job_kind: verification
    ledger:
      clause: 'STD-6.1 Business Entities are eligible for financing on business purpose
        transactions (investment properties exclusively). \[G §3.12, p. 7\]


        STD-6.2 Acra will lend to, and require that title to the collateral be held,
        either (i) directly by an individual person(s) or (ii) by an entity acceptable
        to Acra in its sole discretion. \[G §3.12, p. 7\]


        STD-6.3 Acra requires all individuals with direct or indirect ownership ≥
        20% to provide a recourse guarantee (Acra approved, or Exhibit 7) in the case
        of an entity borrower. All recourse is joint and several in the case of multiple
        guarantors. \[G §3.12, p. 7\]


        STD-6.4 An entity borrower must be a single purpose entity (SPE): “an entity
        with no assets other than residential investment or rental properties; engaged
        in the business of owning and operating residential investment or rental properties.”
        Series limited liability companies are not allowed. \[G §3.12, p. 7\]


        STD-6.5 All entities that will hold direct ownership of the subject property
        and will be on title as a direct owner are required to be a borrowing entity.
        \[G §3.12, p. 7\]


        STD-6.6 Changes to the operating agreement or bylaws with the intent of changing
        ownership percentages to circumvent required personal guarantors will not
        be considered. “Lookback to changes cannot occur within 30 days prior to an
        Application Date or throughout the application process as these changes will
        not be recognized by Acra Lending.” \[G §3.12, p. 7\]


        STD-6.7 Entity / guarantor types allowed: Domestic Corporations (C and S Corp);
        single purpose Limited Liability Companies (LLC), excluding series LLC; Limited
        Liability Partnership (LLP); Limited Liability Limited Partnership (LLLP);
        General Partnership (GP); Limited Partnership (LP); and Sole Proprietorship.
        “In all events, the Borrower must be a US formed and based Entity, foreign
        entities (i.e.: entities formed or based outside the US) or foreign owned
        entities are not allowed.” \[G §3.12, p. 8\]


        STD-6.8 Not allowed: Cooperatives, Irrevocable Trusts, Land Trusts, IRAs,
        Non-Profit, and Joint Ventures. “Business entity nesting is limited to only
        one (1) wholly-owned subsidiary that in turn must be owned by individual(s);
        multiple nesting or ownership by multiple entities, trusts, etcetera are not
        acceptable.” An illustration of the permitted structure: Acra confirmation
        requested → Q-22. \[G §3.12, p. 8\]


        STD-6.9 Acra requires at least one guarantor to have prior homeownership experience.
        At least one (1) borrower / guarantor on the loan must attest on the application
        that they are not a first-time homebuyer; if prior home ownership is not evident
        within the loan file, the underwriter reserves the right to condition for
        supporting documentation. See Q-09. \[G §3.12, p. 7\]'
  approval_refs: []
