- rule_id: acra-standard.credit_review_analysis.credit_score_count_requirements
  condition:
    kind: procedure
    purpose: 'Verify the applicable credit score-count requirement: 3 repositories,
      or the stated alternatives for applicants with 2 or fewer scores.'
