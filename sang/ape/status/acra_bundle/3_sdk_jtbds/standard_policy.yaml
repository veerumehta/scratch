        | Manufactured Home | 65% | 60% | 60% | — |


        STD-8.2 Above 80.00% LTV only SFR, Warrantable Condos outside of Florida,
        Townhome and PUD are eligible (STD-3.16). \[S: Income Documentation\]


        STD-8.3 Rural / unique property: maximum CLTV 80% (purchase), 75% (refinance
        — rate & term), 70% (refinance — cash-out); minimum FICO 700; minimum DSCR
        1.00. “If marketing time is excessive or property exhibits unusual, inadequate
        or peculiar functionality, LTV may be further reduced.” \[S: Subject Property
        Location\]


        STD-8.4 Declining market: “-5% CLTV property/borrower full profile” (STD-1.14).
