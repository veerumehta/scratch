- rule_id: acra-standard.identification_requirements.foreign_national_program_eligibility
  condition:
    kind: procedure
    purpose: Verify the Foreign National Program eligibility requirements in STD-5.1
      through STD-5.3.
    steps:
    - 'Initial Document Review: Review the loan application and supporting information
      for citizenship type, place of residence, authorization to live or work in the
      U.S., and transaction purpose.'
    - 'Eligibility Verification: For a Foreign National, verify that the transaction
      is business purpose only (i.e. investment property), that the borrower is a
      Non-Resident Alien not authorized to live or work in the U.S., and that the
      borrower resides outside of the U.S.'
    - 'Validation and Verification: For an ITIN holder relying on the Foreign National
      Program, verify that the borrower resides outside of the U.S. For a true Foreign
      National, account for the stated allowance for periodic U.S. visits, limited
      personal use or investment property, and ownership of a U.S.-based business
      entity, while confirming residence outside the U.S.'
    - 'Final Determination: Record whether the applicable Foreign National Program
      eligibility requirements are met.'
    checks:
    - A Foreign National’s transaction is business purpose only (i.e. investment property).
    - A Foreign National is a Non-Resident Alien not authorized to live or work in
      the U.S. and resides outside of the U.S.
    - An ITIN holder relying on the Foreign National Program resides outside of the
      U.S.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The requirements applicable to the borrower’s citizenship type are
        met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Required residence or authorization information has not yet been
        obtained or verified.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable Foreign National Program eligibility requirement is
        not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is neither a Foreign National nor an ITIN holder seeking
        eligibility under the Foreign National Program.
      carries_conditions: false
    evidence_types:
    - loan_application
    reads:
    - Borrower.citizenship_status
    - LoanCore.loan_purpose
    computable_checks: []
    missing_reads:
    - Borrower’s residence location
    - Whether the borrower is authorized to live in the U.S.
