rules:
- rule_id: acra-standard.appraisal_review.actual_rent_evidence
  condition:
    kind: procedure
    purpose: Verify the specified evidence of actual rent receipt and continuing lease
      term when actual rents exceed market rents.
    steps:
    - 'Step 1 - Initial Document Review: Review the rent evidence and lease agreements
      for actual rents, market rents, receipt history, and lease term.'
    - 'Step 2 - Eligibility Verification: Determine whether actual rents exceed market
      rents.'
    - 'Step 3 - Validation and Verification: If actual rents exceed market rents,
      verify documentation of two (2) consecutive months proof of rental income receipt
      and lease agreement(s) to continue at a minimum of three (3) months after closing.
      Verify that security deposit does not count towards receipt and that rents are
      not prepaid.'
    - 'Step 4 - Final Determination: Record whether the stated actual-rent evidence
      and lease conditions are met. Do not resolve whether STD-3.5 or STD-3.6 governs.'
    checks:
    - When actual rents exceed market rents, evidence documents two (2) consecutive
      months proof of rental income receipt and lease agreement(s) to continue at
      a minimum of three (3) months after closing; security deposit is not counted
      towards receipt, and rents are not prepaid.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: When actual rents exceed market rents, all stated evidence and lease
        conditions are met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Actual rents exceed market rents and the required evidence or lease
        conditions remain to be obtained or cleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Actual rents exceed market rents and the stated evidence or lease
        conditions are not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Actual rents do not exceed market rents.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    - bank_statement
    - rent_roll
    reads: []
    computable_checks: []
    missing_reads:
    - Actual rent and market rent amounts.
    - The dates and amounts of rental income receipts and whether they represent two
      (2) consecutive months.
    - Whether any receipt is a security deposit or prepaid rent.
    - The lease end date and closing date.
    - Which of STD-3.5 and STD-3.6 governs qualifying rent, and whether the stated
      evidence is sufficient or further approval is required.
  action: require_evidence
  priority: 100
  description: Review rent and lease evidence for the stated requirements when actual
    rents exceed market rents, without deciding which rent rule governs qualification.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both
    provisions, as written
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-ACTUALRENT
      job_kind: condition
    ledger:
      clause: 'STD-3.5 Formula: the lesser of annual in-place rent or market rent
        (STD-3.1). \[G §5.32, p. 3\]


        STD-3.6 Note in the same section: “Acra may use the higher of actual or market
        rents. Where actual rents exceed market rents, then evidence of actual rents
        must be documented via two (2) consecutive months proof of rental income receipt
        and lease agreement(s) to continue at a minimum of three (3) months after
        closing. Note: Security Deposit does not count towards receipt, and the rents
        cannot be prepaid.” \[G §5.32, p. 3; repeated under Actual Rents, p. 5\]


        STD-3.7 This document does not select between STD-3.5 and STD-3.6. When market
        rent may be used if actual rent is lower, when higher actual rent may be used,
        and whether the stated documentation is sufficient or further approval is
        required: Acra confirmation requested → Q-01.


        STD-3.8 “If vacant property is being purchased, qualifying rents are taken
        from the 1007 or 1025 Appraisal report, as applicable, for qualifying income.”
        Rental income from the purchase of a vacant property requires a 1007 survey
        if it is the subject of an Acra loan. \[G §5.32, p. 3; §5.30–5.31, p. 4\]'
  approval_refs: []
- rule_id: acra-standard.appraisal_review.excessive_lease_rent_support
  condition:
    kind: procedure
    purpose: Determine whether documentation supports that excessive monthly rent
      reflected on the lease is typical for the area.
    steps:
    - 'Step 1 - Initial Document Review: Review the lease for monthly rent and review
      any documentation submitted to support typical rent for the area.'
    - 'Step 2 - Eligibility Verification: Determine whether the property is a single-family
      investment property and whether the lease reflects excessive monthly rent payments.'
    - 'Step 3 - Validation and Verification: Verify that documentation supporting
      that the monthly rent is typical for the area is provided. Acceptable documentation
      may include classified ads from local newspapers, a Form 1007 completed by the
      appraiser, or a market rent survey completed by a local real estate company
      or rental management company familiar with market rents in the area.'
    - 'Step 4 - Final Determination: Record whether the stated rent-support requirement
      is met.'
    checks:
    - If a single-family investment property's lease reflects excessive monthly rent
      payments, documentation supporting that the monthly rent is typical for the
      area is provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: If the stated trigger applies, documentation supporting that the
        monthly rent is typical for the area is provided.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The stated trigger applies and documentation supporting that the
        monthly rent is typical for the area is not provided.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not a single-family investment property, or its lease
        does not reflect excessive monthly rent payments.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    - appraisal_report
    reads:
    - SubjectProperty.property_type
    missing_reads:
    - Whether the property is an investment property.
    - Whether monthly rent payments reflected on the lease are excessive.
    - Whether any market rent survey provider is a local real estate company or rental
      management company familiar with market rents in the area.
  action: require_evidence
  priority: 100
  description: Review the lease and supporting evidence to determine whether excessive
    monthly rent on a single-family investment property is supported as typical for
    the area.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.3 Rent schedules and rent
    evidence ¶1
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-RENTSUPPORT
      job_kind: verification
    ledger:
      clause: 'STD-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA
        Form 1007) for single family properties on (i) all DSCR qualifying files,
        (ii) lease-option purchase transactions where the down payment required in
        §3.45 is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. \[G §14.12, p. 4\]


        STD-3.10 A 1007 may be from the original appraiser or any state licensed appraiser.
        \[G §14.12, p. 4\]


        STD-3.11 Single family investment properties with excessive monthly rent payments
        reflected on the lease require documentation supporting that the monthly rent
        is typical for the area; acceptable documentation may include classified ads
        from local newspapers, a 1007 completed by the appraiser, or a market rent
        survey completed by a local real estate company or rental management company
        familiar with the market rents in the area. \[G §14.12, p. 4\]


        STD-3.12 Short-term rental, appraisal form: for properties occupied as a short-term
        rental, an STRpro or similar appraisal form is acceptable as replacement to
        a 1007 as long as it is signed by an appropriately licensed appraiser. \[G
        §14.13, p. 4\]


        STD-3.13 Short-term rental, actual rents: “Acra can accept short term rentals
        with 12-month ledgers from condotel management companies, property managers,
        AirBnB, VRBO, etcetera as documentation for actual rents.” How a 12-month
        ledger establishes qualifying rent, and how the receipt and lease conditions
        of STD-3.6 apply to short-term rentals: Acra confirmation requested → Q-02.
        \[G §5.32, p. 3; §14.13, p. 4\]


        STD-3.14 Short-term rental caps: “Properties qualifying with short-term rentals
        are limited to 75% & 70% LTV / CLTV for Purchase or Refinance transactions
        respectively”; the Summary states maximum CLTV 75% (purchase) and 70% (refinance
        — rate & term and cash-out), minimum FICO 640. \[G §5.32, p. 3; S: Occupancy
        Type\]'
  approval_refs: []
- rule_id: acra-standard.appraisal_review.listed_property_appraisal_limits
  condition:
    kind: procedure
    purpose: Determine whether a loan on a property listed for sale in the last six
      months meets the stated appraisal-based maximum LTV/CLTV and related loan characteristics.
    steps:
    - 'Step 1 - Initial Document Review: Review the appraisal report and listing history
      for appraised value, the last date listed, and the lowest recent listing price.'
    - 'Step 2 - Eligibility Verification: Determine whether the property has been
      listed for sale in the last six months, measured from the last date of being
      listed to the Application Date.'
    - 'Step 3 - Validation and Verification: If the property meets the listing-period
      test, verify that the loan meets the stated characteristics: the property is
      not in default or otherwise delinquent on lien(s); for investment properties,
      the subject is occupied by a tenant and is not vacant; the loan qualifies as
      either ≥ 1.0 DSCR or 43% maximum DTI; a prepayment penalty of at least three
      (3) years is present unless the property is in a state that does not allow prepayment
      penalties; twenty-four (24) months of reserves are present, with cash-in-hand
      considered if otherwise consistent with the Guide; the term is fully amortizing
      and not interest only; maximum LTV / CLTV is 65% based on the lesser of appraised
      value or lowest recent listing price; no subordinate financing is present; and
      impounds are present.'
    - 'Step 4 - Final Determination: Record whether the listing-period test and all
      applicable stated loan characteristics are met.'
    checks:
    - The property has been listed for sale in the last six months, measured from
      the last date of being listed to the Application Date.
    - For a property meeting the listing-period test, the property is not in default
      or otherwise delinquent on lien(s).
    - For an investment property meeting the listing-period test, the subject is occupied
      by a tenant and is not vacant.
    - For a property meeting the listing-period test, the loan qualifies as either
      ≥ 1.0 DSCR or 43% maximum DTI.
    - For a property meeting the listing-period test, a prepayment penalty of at least
      three (3) years is present unless the property is in a state that does not allow
      prepayment penalties.
    - For a property meeting the listing-period test, twenty-four (24) months of reserves
      are present, and cash-in-hand is considered only if otherwise consistent with
      the Guide.
    - For a property meeting the listing-period test, the loan has a fully amortizing
      term and is not interest only.
    - For a property meeting the listing-period test, maximum LTV / CLTV is 65% based
      on the lesser of appraised value or lowest recent listing price.
    - For a property meeting the listing-period test, no subordinate financing is
      present.
    - For a property meeting the listing-period test, impounds are present.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The listing-period test is met and every applicable listed-property
        loan characteristic is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The listing-period test is met and any applicable listed-property
        loan characteristic is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property has not been listed for sale in the last six months
        under the stated measurement.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    - listing_history
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.is_listed_for_sale
    - SubjectProperty.is_vacant
    - SubjectProperty.occupancy_subtype
    - SubjectProperty.appraised_value_usd
    - LoanCore.cltv_percent
    - LoanCore.is_interest_only_10_40
    - MortgageLoanInformation.is_interest_only
    - SubjectProperty.state
    - RatioSet.reserves_months
    - LoanCore.prepayment_penalty_structure
    computable_checks:
    - 0
    - 2
    - 6
    - 7
    missing_reads:
    - The last date of being listed and the Application Date.
    - Whether the property is in default or otherwise delinquent on lien(s).
    - Whether the loan qualifies as either ≥ 1.0 DSCR or 43% maximum DTI.
    - Prepayment penalty duration and whether the property is in a state that does
      not allow prepayment penalties.
    - Whether reserves meet twenty-four (24) months and whether cash-in-hand is otherwise
      consistent with the Guide.
    - Whether the loan term is fully amortizing.
    - Whether subordinate financing is present.
    - Whether impounds are present.
    - The lowest recent listing price and the LTV / CLTV calculated using the lesser
      of that price or appraised value.
  action: require_evidence
  priority: 100
  description: Review the listing period, appraisal value, and transaction against
    the stated requirements for a property listed for sale in the last six months.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.3 Properties listed for
    sale (§11.5)
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-LISTEDPROPERTY
      job_kind: limit
    ledger:
      clause: 'STD-8.8 A property is considered listed for sale under §11.5 if it
        has been listed for sale in the last six months, measured from (a) the last
        date of being listed to (b) the Application Date. \[G §11.5, p. 12\]


        STD-8.9 Loans on such properties will be considered under the following characteristics:
        the property is not in default or otherwise delinquent on lien(s); for investment
        properties, the subject must be occupied by a tenant and may not be vacant;
        the loan must qualify as either (a) ≥ 1.0 DSCR or (b) 43% maximum DTI (Q-14);
        a prepayment penalty of at least three (3) years is required unless the property
        is in a state that does not allow prepayment penalties; twenty-four (24) months
        of reserves are required, and cash-in-hand may be considered if otherwise
        consistent with the Guide; the loan must have a fully amortizing term, interest
        only is not available; the maximum LTV / CLTV is 65% based on the lesser of
        (a) appraised value or (b) lowest recent listing price; no subordinate financing
        is allowed; impounds are required. \[G §11.5, pp. 11–12\]'
  approval_refs: []
- rule_id: acra-standard.appraisal_review.property_type_appraisal_caps
  condition:
    kind: procedure
    purpose: Determine whether the property type and transaction meet the printed
      CLTV limits and eligibility restriction.
    steps:
    - 'Step 1 - Initial Document Review: Review the appraisal report for property
      type and any property-specific classification relevant to the printed caps.'
    - 'Step 2 - Eligibility Verification: Identify the property type, transaction
      purpose, and whether the property is in Florida or LTV is above 80.00%.'
    - 'Step 3 - Validation and Verification: Verify the applicable printed cap: Non-Warrantable
      Condo — 80% purchase, 75% refinance R/T, 75% refinance C/O, with -5% CLTV for
      Florida properties and Min DSCR: 1.0; Condotel / PUDtel — 75% purchase, 70%
      refinance R/T, 65% refinance C/O, with -5% CLTV for Florida properties and Min
      DSCR: 1.0; 2-4 Unit — Max CLTV: 80%; Manufactured Home — 65% purchase, 60% refinance
      R/T, 60% refinance C/O. Verify that above 80.00% LTV only SFR, Warrantable Condos
      outside of Florida, Townhome and PUD are eligible.'
    - 'Step 4 - Final Determination: Record whether the applicable printed cap and
      above-80.00% LTV eligibility restriction are met.'
    checks:
    - 'For a Non-Warrantable Condo, CLTV does not exceed 80% for purchase, 75% for
      refinance R/T, or 75% for refinance C/O, with -5% CLTV for Florida properties;
      Min DSCR: 1.0.'
    - 'For a Condotel / PUDtel, CLTV does not exceed 75% for purchase, 70% for refinance
      R/T, or 65% for refinance C/O, with -5% CLTV for Florida properties; Min DSCR:
      1.0.'
    - 'For a 2-4 Unit property, CLTV does not exceed Max CLTV: 80%.'
    - For a Manufactured Home, CLTV does not exceed 65% for purchase, 60% for refinance
      R/T, or 60% for refinance C/O.
    - Above 80.00% LTV, the property is only SFR, Warrantable Condo outside of Florida,
      Townhome or PUD.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable property-type cap, its printed conditions, and the
        above-80.00% LTV eligibility restriction are met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable property-type cap or printed condition is not met,
        or a property above 80.00% LTV is not one of the eligible property types.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: No listed property-type cap or above-80.00% LTV restriction applies.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    reads:
    - SubjectProperty.property_type
    - SubjectProperty.state
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    - 1
    - 2
    - 3
    - 4
    missing_reads:
    - DSCR for a Non-Warrantable Condo or Condotel / PUDtel.
    - Whether a Warrantable Condo is outside of Florida.
    - The property type classification where it is not stated in the case fields or
      appraisal report.
  action: require_evidence
  priority: 100
  description: Review property type, transaction purpose, location, and CLTV against
    the stated property-type caps and above-80.00% LTV eligibility restriction.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types
    and caps
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-PROPERTYCAPS
      job_kind: limit
    ledger:
      clause: 'STD-8.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo,
        Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units, Manufactured. Restrictions
        as printed: \[S: Subject Property Type\]


        | **Property type** | **Purchase** | **Refi R/T** | **Refi C/O** | **Conditions
        as printed** |

        |----|----|----|----|----|

        | Non-Warrantable Condo | 80% | 75% | 75% | “-5% CLTV for Florida properties,
        Min DSCR: 1.0” |

        | Condotel / PUDtel | 75% | 70% | 65% | “-5% CLTV for Florida properties Min
        DSCR: 1.0” |

        | 2-4 Unit | 80% | 80% | 80% | Printed as “Max CLTV: 80%” with no purpose
        split |

        | Manufactured Home | 65% | 60% | 60% | — |


        STD-8.2 Above 80.00% LTV only SFR, Warrantable Condos outside of Florida,
        Townhome and PUD are eligible (STD-3.16). \[S: Income Documentation\]


        STD-8.3 Rural / unique property: maximum CLTV 80% (purchase), 75% (refinance
        — rate & term), 70% (refinance — cash-out); minimum FICO 700; minimum DSCR
        1.00. “If marketing time is excessive or property exhibits unusual, inadequate
        or peculiar functionality, LTV may be further reduced.” \[S: Subject Property
        Location\]


        STD-8.4 Declining market: “-5% CLTV property/borrower full profile” (STD-1.14).
        \[S: Subject Property Location\]'
  approval_refs: []
- rule_id: acra-standard.appraisal_review.required_rent_schedule
  condition:
    kind: procedure
    purpose: Determine whether the required Form 1007 has been provided for a DSCR
      transaction or an applicable single-family transaction.
    steps:
    - 'Step 1 - Initial Document Review: Review the appraisal report for a Form 1007
      and identify the property type and transaction information.'
    - 'Step 2 - Eligibility Verification: Determine whether the transaction is a DSCR
      transaction or a single-family transaction that meets one of the stated Form
      1007 triggers.'
    - 'Step 3 - Validation and Verification: Verify that a required Form 1007 is provided.
      If a Form 1007 is provided, verify that it is from the original appraiser or
      any state licensed appraiser.'
    - 'Step 4 - Final Determination: Record whether the applicable Form 1007 requirement
      is met.'
    checks:
    - A Form 1007 is provided for every DSCR transaction.
    - For a single-family property, a Form 1007 is provided if the file is a DSCR
      qualifying file, the transaction is a lease-option purchase where the required
      down payment is generated from excess monthly rent contributions, or proposed
      rental income is being used to qualify.
    - A provided Form 1007 is from the original appraiser or any state licensed appraiser.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable Form 1007 requirement is met, including the stated
        appraiser requirement when a Form 1007 is provided.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A required Form 1007 is not provided, or a provided Form 1007 is
        not from the original appraiser or any state licensed appraiser.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The transaction does not meet a stated Form 1007 trigger.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    reads:
    - SubjectProperty.property_type
    - LoanCore.dscr_qualification_method
    missing_reads:
    - Whether the transaction is a DSCR transaction.
    - Whether the file is a DSCR qualifying file.
    - Whether a lease-option purchase down payment is generated from excess monthly
      rent contributions.
    - Whether proposed rental income is being used to qualify.
    - The appraiser's licensing status, if not stated in the appraisal report.
  action: require_evidence
  priority: 100
  description: Review the transaction and appraisal evidence to determine whether
    a Form 1007 is required and whether the submitted Form 1007 meets the stated appraiser
    requirement.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.1 Occupancy, purpose and
    qualification ¶2
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.3 Rent schedules and rent
    evidence ¶1
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Collateral
      assistant:
      - Underwriter
      mnemonic: PRE-RENTSCHEDULE
      job_kind: verification
    ledger:
      clause: 'STD-1.7 “A 1007 will always be required on DSCR transactions – for
        avoidance of doubt, even on No Ratio DSCR”. Whether a Form 1025 satisfies
        this for a 2-4 unit property: Acra confirmation requested → Q-08. \[G §5.32,
        p. 3; §14.12, p. 4\]


        STD-1.8 All borrowers purchasing or refinancing a one- to four-family investment
        property must execute a One- to Four-Family Rider with the loan documents
        and provide rent loss insurance coverage per §23.40 (STD-8.11 to 8.14). \[G
        §3.41, p. 11\]


        STD-1.9 Only the subject property, principal residence and second homes are
        required to be listed on the application or Schedule of Real Estate Owned.
        \[G §5.32, p. 3; §4.15, p. 5\]


        STD-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA Form
        1007) for single family properties on (i) all DSCR qualifying files, (ii)
        lease-option purchase transactions where the down payment required in §3.45
        is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. \[G §14.12, p. 4\]


        STD-3.10 A 1007 may be from the original appraiser or any state licensed appraiser.
        \[G §14.12, p. 4\]


        STD-3.11 Single family investment properties with excessive monthly rent payments
        reflected on the lease require documentation supporting that the monthly rent
        is typical for the area; acceptable documentation may include classified ads
        from local newspapers, a 1007 completed by the appraiser, or a market rent
        survey completed by a local real estate company or rental management company
        familiar with the market rents in the area. \[G §14.12, p. 4\]


        STD-3.12 Short-term rental, appraisal form: for properties occupied as a short-term
        rental, an STRpro or similar appraisal form is acceptable as replacement to
        a 1007 as long as it is signed by an appropriately licensed appraiser. \[G
        §14.13, p. 4\]


        STD-3.13 Short-term rental, actual rents: “Acra can accept short term rentals
        with 12-month ledgers from condotel management companies, property managers,
        AirBnB, VRBO, etcetera as documentation for actual rents.” How a 12-month
        ledger establishes qualifying rent, and how the receipt and lease conditions
        of STD-3.6 apply to short-term rentals: Acra confirmation requested → Q-02.
        \[G §5.32, p. 3; §14.13, p. 4\]


        STD-3.14 Short-term rental caps: “Properties qualifying with short-term rentals
        are limited to 75% & 70% LTV / CLTV for Purchase or Refinance transactions
        respectively”; the Summary states maximum CLTV 75% (purchase) and 70% (refinance
        — rate & term and cash-out), minimum FICO 640. \[G §5.32, p. 3; S: Occupancy
        Type\]'
  approval_refs: []
- rule_id: acra-standard.appraisal_review.rural_or_unique_property_limits
  condition:
    kind: procedure
    purpose: Determine whether a rural or unique property meets the stated maximum
      CLTV and minimum FICO and DSCR requirements, and identify when marketing time
      or functionality may require a further LTV reduction.
    steps:
    - 'Step 1 - Initial Document Review: Review the appraisal report for rural or
      unique property characteristics, marketing time, and functionality.'
    - 'Step 2 - Eligibility Verification: Determine whether the property is rural
      or unique and identify the transaction purpose.'
    - 'Step 3 - Validation and Verification: Verify the applicable maximum CLTV, minimum
      FICO 700, and minimum DSCR 1.00. If marketing time is excessive or the property
      exhibits unusual, inadequate or peculiar functionality, determine whether LTV
      may be further reduced.'
    - 'Step 4 - Final Determination: Record whether the applicable stated limits are
      met and whether a further LTV reduction is required.'
    checks:
    - For a rural or unique property, CLTV does not exceed 80% for purchase, 75% for
      refinance — rate & term, or 70% for refinance — cash-out, as applicable.
    - For a rural or unique property, FICO is at least 700.
    - For a rural or unique property, DSCR is at least 1.00.
    - If marketing time is excessive or the property exhibits unusual, inadequate
