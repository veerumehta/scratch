- rule_id: acra-standard.loan_program_eligibility.itin_limits.python
  condition:
    kind: python
    source: "import rules_lib\n\ndef check(ctx):\n    amount = ctx['LoanCore.total_loan_amount_usd']\n\
      \    fico = ctx['CreditReport.representative_score']\n    cltv = ctx['LoanCore.cltv_percent']\n\
      \    purpose = ctx['LoanCore.loan_purpose']\n\n    missing = rules_lib.gaps(amount=amount,\
      \ fico=fico, cltv=cltv, purpose=purpose)\n    if missing:\n        return rules_lib.unknown(*missing)\n\
      \n    if amount > 1000000 or fico < 640:\n        return False\n\n    limits\
      \ = rules_lib.band(\n        fico,\n        [(659, (60, 60)), (699, (65, 60)),\
      \ (700, (70, 65))],\n    )\n    # The printed “FICO 700” tier is not extended\
      \ to higher scores here;\n    # that application is left for Acra confirmation.\n\
      \    if limits is None:\n        return True\n\n    if rules_lib.same(purpose,\
      \ 'purchase'):\n        purpose_index = 0\n    elif rules_lib.same(purpose,\
      \ 'refinance', 'rate & term', 'rate and term', 'r/t', 'cash-out', 'cash out'):\n\
      \        purpose_index = 1\n    else:\n        return rules_lib.unknown('LoanCore.loan_purpose\
      \ (unrecognized purpose)')\n\n    return cltv <= limits[purpose_index]\n"
