    - The borrower is a Business Entity.
    - The transaction is a business purpose transaction on investment properties exclusively.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The borrower is a Business Entity and the transaction is a business
        purpose transaction on investment properties exclusively.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The borrower is a Business Entity, but the transaction is not a business
        purpose transaction on investment properties exclusively.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not a Business Entity.
      carries_conditions: false
