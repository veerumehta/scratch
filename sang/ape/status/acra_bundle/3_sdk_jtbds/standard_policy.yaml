- rule_id: acra-standard.insurance_coverage_sufficiency_policy_assessment.rent_loss_insurance_applicability
  condition:
    kind: procedure
    purpose: Determine whether six (6) months' rent loss insurance is required for
      the subject property under the stated property, LTV, and rent-qualification
      conditions.
    steps:
    - 'Step 1 - Initial Document Review: Review the case information for the subject
      property''s number of units, occupancy subtype, CLTV, and DSCR qualification
      method.'
    - 'Step 2 - Eligibility Verification: Establish whether the property is a one-
      to four-unit, non-owner-occupied income property; establish whether LTV is >
      70% and subject property rents are used to qualify. The stated requirement includes
      No Ratio DSCR.'
    - 'Step 3 - Validation and Verification: Check whether the loan has ≤ 70% CLTV.
      If LTV is at or below 70% while CLTV is above 70%, preserve the stated unresolved
      case for Acra confirmation.'
    - 'Step 4 - Final Determination: Record whether the rent loss insurance requirement
      applies, does not apply, or cannot be determined without Acra confirmation or
      missing trigger information.'
    checks:
    - The subject property has one to four units.
    - The subject property is non-owner occupied.
    - The subject property is an income property.
    - The subject property's LTV is > 70%.
    - Subject property rents are used to qualify.
    - The loan has ≤ 70% CLTV.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property and qualification conditions for the stated requirement
        are established, and the LTV/CLTV information does not present the stated
        unresolved overlap.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The trigger information is incomplete, or LTV is at or below 70%
        while CLTV is above 70%; establish the missing information or obtain the requested
        Acra confirmation before determining applicability.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: There is no case for this outcome.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The stated property and qualification conditions for the rent loss
        insurance requirement are not met, or the loan has ≤ 70% CLTV and the stated
        LTV/CLTV overlap does not apply.
      carries_conditions: false
    evidence_types: []
    reads:
    - SubjectProperty.number_of_units
    - SubjectProperty.occupancy_subtype
    - LoanCore.cltv_percent
    - LoanCore.dscr_qualification_method
    computable_checks:
    - 0
    - 5
    missing_reads:
    - Subject property's LTV
    - Whether the subject property is an income property
    - Whether subject property rents are used to qualify
  action: require_evidence
  priority: 100
  description: Determine whether the stated rent loss insurance requirement applies
    to the subject property and identify the stated CLTV/LTV overlap that requires
    confirmation.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.5 Rent loss insurance (§23.40)
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.5 No Ratio DSCR
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Insurance
      assistant:
      - Underwriter
      mnemonic: RLI-RENTLOSSAPPLICAB
      job_kind: determination
    ledger:
      clause: 'STD-8.11 Rent loss insurance covers rental losses that are incurred
        during the period that a property is being rehabilitated following a casualty.
        \[G §23.40, p. 13\]


        STD-8.12 Six (6) months'' rent loss insurance is required on one- to four-unit
        non-owner occupied income properties with LTV \> 70% and when subject property
        rents are used to qualify (includes No Ratio DSCR). \[G §23.40, p. 13\]


        STD-8.13 “Loans with ≤ 70% CLTV are not required to carry rent loss insurance.”
        The requirement is stated in LTV and the exemption in CLTV; the case of LTV
        at or below 70% with CLTV above 70%: Acra confirmation requested → Q-11. \[G
        §23.40, p. 13\]


        STD-8.14 When rent loss insurance is required but cannot be obtained, the
        borrower may substitute two (2) months reserves for every one (1) month of
        rent loss coverage not provided. \[G §23.40, p. 13\]


