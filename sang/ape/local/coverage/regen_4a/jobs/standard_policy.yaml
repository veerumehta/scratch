  - rule_id: acra-standard.income_stability_sufficiency_analysis.short_term_rental_limits
    condition:
      kind: procedure
      purpose: Apply the stated short-term rental CLTV caps and minimum FICO requirement for purchase
        and refinance transactions.
      steps:
      - 'Initial Document Review: Review the credit report and the transaction information in the case.'
      - 'Eligibility Verification: Determine whether the property qualifies with short-term rentals and
        whether the transaction is a purchase or refinance.'
      - 'Validation and Verification: For a purchase, verify CLTV does not exceed 75%; for a refinance,
        verify CLTV does not exceed 70%. Verify minimum FICO 640.'
      - 'Final Determination: Record whether the applicable CLTV cap and minimum FICO are met.'
      checks:
      - For a short-term rental purchase, CLTV does not exceed 75% and FICO is at least 640.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The applicable short-term rental CLTV cap and minimum FICO are met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The applicable short-term rental CLTV cap or minimum FICO is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property does not qualify with short-term rentals.
        carries_conditions: false
      evidence_types:
      - credit_report
      reads:
      - SubjectProperty.occupancy_subtype
