  - rule_id: acra-standard.identification_requirements_borrower_identity_and_status.foreign_account_funds_verification
    condition:
      kind: procedure
      purpose: Verify the foreign-account funds and documentation requirements stated for Foreign Nationals.
      steps:
      - 'Initial Document Review: Obtain the two most recent statements for the account holding the funds
        and review the funds’ location and currency.'
      - 'Eligibility Verification: Verify the funds’ U.S. Dollar equivalency using the current exchange
        rate via www.xe.com or the Wall Street Journal conversion table.'
      - 'Validation and Verification: Verify that sufficient funds to close are on deposit with the Escrow
        / Closing Agent at least three (3) business days (including Saturdays for this calculation) prior
        to any closing date; verify minimum 60 days seasoning; and, for funds held in a foreign bank /
        currency, verify repatriation at minimum three (3) business days prior to Closing. If funds are
        not seasoned a minimum of sixty (60) days, review the required letter of explanation and information
        to comprise a sixty (60) day chain of funds.'
      - 'Final Determination: Record whether the applicable funds, timing, and account-statement requirements
        are verified.'
      checks:
      - Foreign-account assets are verified in U.S. Dollar equivalency at the current exchange rate via
        www.xe.com or the Wall Street Journal conversion table.
      - Sufficient funds to close are on deposit with the Escrow / Closing Agent at least three (3) business
        days (including Saturdays for this calculation) prior to any closing date.
      - A copy of the two (2) most recent statements of the account is provided.
      - Funds are seasoned a minimum of sixty (60) days, or, if not, a letter of explanation and information
        to comprise a sixty (60) day chain of funds are provided.
      - Funds held in a foreign bank / currency are repatriated at minimum three (3) business days prior
        to Closing.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable funds, timing, and account-statement check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Any applicable funds, timing, or account-statement check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not a Foreign National or the assets are not held in foreign accounts.
        carries_conditions: false
      evidence_types:
      - bank_statement
      reads:
      - Borrower.citizenship_status
      computable_checks: []
      missing_reads:
      - Current exchange rate and converted U.S. Dollar equivalency
      - Closing date and date sufficient funds were deposited with the Escrow / Closing Agent
      - Two most recent account statements
      - Funds seasoning period and, if under sixty (60) days, letter of explanation and sixty (60) day
        chain of funds
      - Date foreign bank / currency funds were repatriated
    action: require_evidence
    priority: 100
    description: Verify foreign-account funds in U.S. Dollar equivalency and confirm the required closing
      deposit timing and account statements.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign accounts
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
