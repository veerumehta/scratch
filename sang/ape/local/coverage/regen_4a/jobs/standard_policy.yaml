  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.required_entity_guarantors
    condition:
      kind: procedure
      purpose: Determine whether each individual meeting the stated ownership threshold has provided the
        required recourse guarantee.
      steps:
      - 'Step 1 - Initial Document Review: Review entity_documents and the loan file for direct and indirect
        ownership interests and recourse guarantees.'
      - 'Step 2 - Eligibility Verification: Identify all individuals with direct or indirect ownership
        ≥ 20% of the entity borrower.'
      - 'Step 3 - Validation and Verification: Verify that each identified individual provided an Acra
