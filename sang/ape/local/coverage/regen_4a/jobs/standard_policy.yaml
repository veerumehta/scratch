        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#9.2 Reserves by trigger, as stated
        job_kind: verification
      ledger:
        clause: 'STD-9.6 The sources state reserves only for the situations below, and state the payment
          basis only where shown. The base requirement where no trigger applies, the payment basis where
          only “months” is stated, permitted sources, whether overlapping triggers are cumulative, and
          whether reserves substituted for rent loss insurance are additional: Acra confirmation requested
          → Q-07. \[S; G\]


          | **Trigger** | **Reserves as printed** | **Source** |

          |----|----|----|

          | LTV \> 80.00% | 6 months PITIA reserves | S: Income Documentation |

          | FICO \< 620 | 12 Months | S: Credit Requirements |

          | First-time homebuyer | Minimum six months reserves (“Requires 6mos Reserves”) | G §3.13; S:
          Restrictions |

          | Vacant property — rate & term refinance | Minimum six months reserves | G §10.17; S: Occupancy
          Type |

          | Vacant property — cash-out refinance | 6 months reserves | S: Occupancy Type |

          | Property listed for sale within six months | Twenty-four (24) months of reserves; cash-in-hand
          may be considered if otherwise consistent with the Guide | G §11.5 |

