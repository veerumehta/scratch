  - rule_id: acra-standard.appraisal_review_property_eligibility.vacant_cash_out_refinance
    condition:
      kind: procedure
      purpose: Determine whether a vacant property's cash-out refinance meets the conditions stated in
        STD-8.7.
      steps:
      - 'Initial Document Review: Review vacancy status, loan purpose, loan amount, CLTV, representative
        credit score, DSCR, prepayment penalty, interest-only status, escrow status, reserves, and ownership
        months.'
      - 'Eligibility Verification: Apply this job to a vacant property''s cash-out refinance and verify
        the printed score, DSCR, prepayment penalty, interest-only, impounds, reserves, CLTV, and ownership
        conditions.'
      - 'Validation and Verification: Obtain Acra confirmation for loans of $1,500,000 or more and for
        how the 15 months of ownership are measured.'
      - 'Final Determination: Record whether the printed conditions are met and whether requested confirmations
        remain outstanding.'
      checks:
      - For a vacant property's cash-out refinance, representative FICO score is at least 700.
      - For a vacant property's cash-out refinance, DSCR is at least 1.15.
