  - rule_id: acra-standard.credit_review_analysis_credit.housing_history_documentation
    condition:
      kind: procedure
      purpose: Verify the required documentation of mortgage or rental history, including the stated DSCR-loan
        property scope.
      steps:
      - 'Step 1 - Initial Document Review: Review reported mortgages and available housing-history documents
        for properties the borrower owns and / or rents over the last twelve (12) months.'
      - 'Step 2 - Eligibility Verification: Consider all reported mortgages on credit. Where mortgages
        are not reported, determine whether the file documents history on the applicant''s primary residence(s),
        any secondary residence(s), and the subject property. For DSCR loans, apply the stated documentation
        scope: subject property, principal residence, and second home (if any) of the borrower and / or
        guarantor(s); additional properties need not be documented unless file documents suggest a major
        credit event has occurred.'
      - 'Step 3 - Validation and Verification: For DSCR loans, verify payment history for the primary
        residence, subject property, and second homes, if applicable; assess any additional-property documentation
        when the file suggests a major credit event.'
      - 'Step 4 - Final Determination: Record whether the documentation required by the applicable scope
        is present.'
      checks:
      - Required housing-history documentation for the applicable loan and property scope is present.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The required housing-history documentation for the applicable scope is present.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Required housing-history documentation is not present.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - credit_report
      - loan_application
      - lease_agreement
      - rent_roll
      - bank_statement
      reads:
      - LoanCore.dscr_qualification_method
      - CreditReport.housing_history_rating
      - SubjectProperty.has_current_lease
      computable_checks: []
      missing_reads:
      - reported and unreported mortgages
      - properties owned and / or rented over the last twelve (12) months
      - housing-history documents for required residences and subject property
      - whether documents in the file suggest a major credit event
    action: require_evidence
    priority: 100
    description: Review required housing-history records for the properties and borrowers identified by
      the guidelines.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#7.2 Mortgage / rental rating and payment history
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: credit
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#7.2 Mortgage / rental rating and payment
            history
        job_kind: verification
      ledger:
        clause: 'STD-7.6 The mortgage / rental rating for determining mortgage pricing is determined by
          evaluating the ratings for properties the borrower owns and / or rents over the last twelve
          (12) months. All reported mortgages on credit should be considered; where the applicant has
          mortgages that are not reported, the file should contain documentation to evaluate history on
          the applicant''s primary residence(s), any secondary residence(s), and the subject property.
          \[G §4.15, p. 5\]


          STD-7.7 DSCR loans only require documentation on the subject property, principal residence,
          and second home (if any) of the borrower and / or guarantor(s). Additional properties do not
          require housing history to be documented unless documents in the file suggest a major credit
          event has occurred, for example a foreclosure listing the borrower (individually or as guarantor)
          on the credit report. For DSCR loans, the payment history is required for the primary residence,
          subject property, and second homes, if applicable. \[G §4.15, p. 5; §6.7, p. 6\]


          STD-7.8 Loans that have matured are rated based on the maturity date of the loan; any extensions
          of the maturity date must be in writing. \[G §4.15, p. 5\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#7.2 Mortgage / rental rating
            and payment history
          heading: ''
          text: 'STD-7.6 The mortgage / rental rating for determining mortgage pricing is determined by
