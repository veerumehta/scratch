        \ rate and term'):\n        cltv_cap = 75\n    elif rules_lib.same(loan_purpose, 'refi c/o', 'refinance\
        \ cash-out'):\n        cltv_cap = 70\n    else:\n        return rules_lib.unknown('LoanCore.loan_purpose')\n\
        \n    return cltv_percent <= cltv_cap and representative_score >= 700"
