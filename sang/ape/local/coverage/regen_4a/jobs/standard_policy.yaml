          STD-4.2 Permanent Resident must have an unexpired PRA ID and SSA card / SSA-89. \[S: Borrower
          Citizenship\]


          STD-4.3 Non-Permanent Resident must have proof of legal residency, which may include an unexpired
          employment authorization document (EAD) or valid visa. Limit printed as “Max Loan Amount: \$1.5M:
          Max CLTV 80%” — whether this is two independent limits or one conditional limit: Acra confirmation
          requested → Q-21. \[S: Borrower Citizenship\]


          STD-4.4 Foreign National: “Borrowers whose Primary Residence is not located in the United States
          of America.” Maximum CLTV 70% (purchase) and 65% (refinance — rate & term and cash-out); “Price
