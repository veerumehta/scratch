  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.revocable_trust_title_vesting
    condition:
      kind: procedure
      purpose: Determine whether title vesting in an inter vivos revocable trust is permitted under the
        stated requirements.
      steps:
      - 'Step 1 - Initial Document Review: Review the trust document or Certification of Trust and the
        loan file for the trust’s terms, trustors, trustees, beneficiaries, and any Acra Senior Management
        written exception.'
      - 'Step 2 - Eligibility Verification: Determine whether the trust is inter vivos and revocable and
        whether the stated requirements for its establishment, beneficiaries, trustees, and title vesting
        are met.'
      - 'Step 3 - Validation and Verification: Verify the required trust information and provisions, validity
        under the laws of the state in which it is established, and any written exception required when
        the Trustor(s) and Trustee(s) are not the same. Review any additional supporting documentation
        conditioned for by Legal.'
      - 'Step 4 - Final Determination: Determine whether title vesting in the trust meets all stated requirements.'
      checks:
      - A complete, legible copy of the Trust or a Certification of Trust states the existence and date
        of the Trust; the Trustor(s) and current Trustee(s); the powers of the Trustee; whether the Trust
        is revocable and, if revocable, who holds the right to revoke; the names and number of Trustees
        required to sign; the Trust identification number (a Social Security number or an IRS-issued Tax
        Identification Number); how title to Trust assets should be taken; and that the Trust has not
        been revoked, modified, or amended in any manner.
      - The Trust is valid under the laws of the state in which it is established.
      - The Trust is revocable, meaning it can be changed or canceled at any time for any reason during
        a Trustor's lifetime.
      - The Trust is established by one or more natural persons, solely or jointly (Grantor, Trustor,
        or Settlor), and becomes effective during the lifetime of the person(s) establishing it.
      - The primary beneficiary of the Trust is the individual(s) establishing the Trust.
      - Written exception by Acra Senior Management is obtained if the Trustor(s) and Trustee(s) are not
        the same.
      - The Trust specifies that the Trustee has the power to hold title and mortgage the property; that
        the beneficiary does not need to grant written consent for the Trust to borrow money, or that
        such consent has been granted in writing for purposes of the mortgage; that there is no unusual
        risk or impairment to the lender's rights; and that holding title in the Trust does not diminish
        the lender's rights as a creditor.
      - Any additional supporting documentation conditioned for by Legal is provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable trust check holds and no required additional supporting documentation
          remains outstanding.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: A required trust provision, written exception, or additional supporting documentation
          remains to be provided or cleared.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable trust check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Title is not vested in an inter vivos revocable trust.
        carries_conditions: false
      evidence_types:
      - entity_documents
      - title_commitment
      reads: []
      computable_checks: []
      missing_reads:
      - The complete Trust or Certification of Trust and all information and provisions required by the
        checks
      - The law of the state in which the Trust is established and evidence of compliance with it
      - Whether Trustor(s) and Trustee(s) are the same
      - Acra Senior Management's written exception, if required
      - Whether Legal has conditioned for additional supporting documentation
    action: require_evidence
