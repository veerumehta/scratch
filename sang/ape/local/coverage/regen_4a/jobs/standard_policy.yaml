            ¶1
        job_kind: verification
      ledger:
        clause: '3.3 Rent schedules and rent evidence

          STD-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA Form 1007) for single
          family properties on (i) all DSCR qualifying files, (ii) lease-option purchase transactions
          where the down payment required in §3.45 is generated from excess monthly rent contributions,
          or (iii) when proposed rental income is being used to qualify. \[G §14.12, p. 4\]


          STD-3.10 A 1007 may be from the original appraiser or any state licensed appraiser. \[G §14.12,
          p. 4\]


          STD-3.11 Single family investment properties with excessive monthly rent payments reflected
          on the lease require documentation supporting that the monthly rent is typical for the area;
          acceptable documentation may include classified ads from local newspapers, a 1007 completed
          by the appraiser, or a market rent survey completed by a local real estate company or rental
          management company familiar with the market rents in the area. \[G §14.12, p. 4\]


          STD-3.12 Short-term rental, appraisal form: for properties occupied as a short-term rental,
          an STRpro or similar appraisal form is acceptable as replacement to a 1007 as long as it is
          signed by an appropriately licensed appraiser. \[G §14.13, p. 4\]


          STD-3.13 Short-term rental, actual rents: “Acra can accept short term rentals with 12-month
