  - rule_id: acra-standard.appraisal_review_property_eligibility.declining_market_cltv_reduction
    condition:
      kind: procedure
      purpose: Apply the declining market treatment stated in STD-1.14 and STD-8.4 without deciding how
        it combines with other caps absent Acra confirmation.
      steps:
      - 'Initial Document Review: Review the property and borrower profile for declining-market applicability.'
      - 'Eligibility Verification: Determine whether the property is in a declining market.'
      - 'Validation and Verification: If applicable, apply the stated -5% CLTV property/borrower full
        profile treatment and request Acra confirmation on how the reduction combines with other caps.'
      - 'Final Determination: Record the declining-market review and whether the cap-combination question
        has been confirmed.'
      checks:
      - If the property is in a declining market, apply the stated -5% CLTV property/borrower full profile
        treatment.
      - If the property is in a declining market, obtain Acra confirmation on how the reduction combines
        with other caps.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is not in a declining market, or the stated treatment has been applied
          and Acra has confirmed how it combines with other caps.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property is in a declining market and Acra confirmation on how the reduction combines
          with other caps is pending.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is in a declining market and the stated -5% CLTV property/borrower full
          profile treatment is not applied.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types: []
      reads: []
      computable_checks: []
      missing_reads:
      - Whether the property is in a declining market; the full property/borrower profile; Acra confirmation
        on how the reduction combines with other caps.
    action: require_evidence
    priority: 100
    description: Review the full property and borrower profile for the stated declining-market CLTV reduction
      and obtain Acra confirmation on how it combines with other caps.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.3 Location
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types and caps
