- policy_id: acra-standard
  version: 1.0.0
  name: Acra Standard DSCR (jobs)
  description: Acra Standard DSCR (jobs)
  policy_type: institutional
  effective_date: '2026-10-20T20:38:30.086482Z'
  status: active
  rules:
  - rule_id: acra-standard.appraisal_review_property_eligibility.above_80_percent_ltv_property_types
    condition:
      kind: procedure
      purpose: Determine whether a loan above 80.00% LTV has an eligible property type under STD-8.2,
        including the stated Florida restriction for Warrantable Condos.
      steps:
      - 'Initial Document Review: Review the loan LTV, property type, and property state.'
      - 'Eligibility Verification: If LTV is above 80.00%, verify that the property type is SFR, Warrantable
        Condo outside of Florida, Townhome, or PUD.'
      - 'Validation and Verification: Confirm the LTV and the property type and state used for the eligibility
        decision.'
      - 'Final Determination: Record whether the property type satisfies STD-8.2 for a loan above 80.00%
        LTV.'
      checks:
      - If LTV is above 80.00%, the property type is SFR, Townhome, PUD, or Warrantable Condo outside
        of Florida.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: LTV is not above 80.00%, or LTV is above 80.00% and the property type is SFR, Townhome,
          PUD, or Warrantable Condo outside of Florida.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: LTV is above 80.00% and the property type is not SFR, Townhome, PUD, or Warrantable
          Condo outside of Florida.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types: []
      reads:
      - SubjectProperty.property_type
      - SubjectProperty.state
      computable_checks: []
      missing_reads:
      - LTV; the available case field is CLTV, while STD-8.2 states LTV.
    action: require_evidence
    priority: 100
    description: Verify that a loan above 80.00% LTV is for a property type permitted by STD-8.2.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types and caps
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: 'Appraisal Review: property eligibility'
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types and caps
        job_kind: limit
      ledger:
        clause: 'STD-8.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo, Non-Warrantable
          Condo, Condotel / PUDtel, 2-4 Units, Manufactured. Restrictions as printed: \[S: Subject Property
          Type\]


          | **Property type** | **Purchase** | **Refi R/T** | **Refi C/O** | **Conditions as printed**
          |

          |----|----|----|----|----|

          | Non-Warrantable Condo | 80% | 75% | 75% | “-5% CLTV for Florida properties, Min DSCR: 1.0”
          |

          | Condotel / PUDtel | 75% | 70% | 65% | “-5% CLTV for Florida properties Min DSCR: 1.0” |

          | 2-4 Unit | 80% | 80% | 80% | Printed as “Max CLTV: 80%” with no purpose split |

          | Manufactured Home | 65% | 60% | 60% | — |


          STD-8.2 Above 80.00% LTV only SFR, Warrantable Condos outside of Florida, Townhome and PUD are
          eligible (STD-3.16). \[S: Income Documentation\]


          STD-8.3 Rural / unique property: maximum CLTV 80% (purchase), 75% (refinance — rate & term),
          70% (refinance — cash-out); minimum FICO 700; minimum DSCR 1.00. “If marketing time is excessive
          or property exhibits unusual, inadequate or peculiar functionality, LTV may be further reduced.”
          \[S: Subject Property Location\]


          STD-8.4 Declining market: “-5% CLTV property/borrower full profile” (STD-1.14). \[S: Subject
          Property Location\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types and
            caps
          heading: ''
          text: 'STD-8.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo, Non-Warrantable
