  - rule_id: acra-standard.income_stability_sufficiency_analysis.dscr_calculation
    condition:
      kind: procedure
      purpose: Apply the stated DSCR calculation formula without resolving the conflicting qualifying-rent
        provisions in the source.
      steps:
      - 'Initial Document Review: Review the file for the rent and payment information needed to calculate
        DSCR.'
      - 'Eligibility Verification: Determine whether the file qualifies using a calculated DSCR rather
        than No Ratio DSCR.'
      - 'Validation and Verification: Calculate the DSCR using the stated denominator and identify the
        applicable qualifying-rent basis; the source does not select between its lesser-of formula and
        its higher-of actual-or-market-rent note.'
      - 'Final Determination: Record the calculated DSCR only where the qualifying-rent basis has been
        resolved.'
      checks:
      - The DSCR calculation uses the applicable qualifying rent divided by annual PITIA, including subordinate
        financing if applicable, using the first payment due under the Note.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The applicable qualifying-rent basis is resolved and the DSCR is calculated using the
          stated formula.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The DSCR is not calculated using the applicable qualifying rent and stated denominator.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The file qualifies using No Ratio DSCR.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      - lease_agreement
      - rent_roll
      - bank_statement
      reads:
      - LoanCore.dscr_qualification_method
      computable_checks: []
      missing_reads:
      - Annual in-place rent
      - Market rent
      - Annual principal
      - Annual interest based on the first payment due under the Note
      - Annual real estate taxes
      - Annual property insurance
      - Annual homeowner's / condominium association fees
      - Subordinate financing payment, if applicable
      - Resolution of the source's conflicting qualifying-rent provisions (Q-01)
