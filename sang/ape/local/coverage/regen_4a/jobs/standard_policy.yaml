  - rule_id: acra-standard.identification_requirements_borrower_identity_and_status.foreign_national_credit_reference
    condition:
      kind: procedure
      purpose: Verify a Foreign National borrower’s credit-reference documentation against the alternatives
        stated in the guidelines.
      steps:
      - 'Initial Document Review: Review the borrower’s U.S. credit report and trade-line details, international
        credit report, original credit reference letter, or bank statement documenting a foreign financial
        banking relationship.'
      - 'Eligibility Verification: Determine whether at least one of the specified alternatives is provided.'
      - 'Validation and Verification: For the U.S. credit report alternative, verify at least two (2)
        trade lines and a minimum age of two (2) years for one trade line. For the bank-statement alternative,
        verify the foreign financial banking relationship for the past 60 days.'
      - 'Final Determination: Record whether at least one credit-reference alternative is verified.'
      checks:
      - 'At least one specified credit-reference alternative is provided: a U.S. credit report with at
        least two (2) trade lines with minimum age of two (2) years for one trade line; or an international
        credit report; or an original credit reference letter from an internationally known financial
        institution; or a bank statement documenting a foreign financial banking relationship for the
        past 60 days.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: At least one specified credit-reference alternative is verified.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: None of the specified credit-reference alternatives is verified.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not a Foreign National Program borrower.
        carries_conditions: false
      evidence_types:
      - credit_report
      - bank_statement
      reads:
      - Borrower.citizenship_status
      computable_checks: []
      missing_reads:
      - International credit report, or original credit reference letter and whether its institution is
        internationally known, if either alternative is used
      - Trade-line count and age details if the U.S. credit report alternative is used
      - Evidence of the foreign financial banking relationship for the past 60 days if the bank-statement
        alternative is used
    action: require_evidence
    priority: 100
    description: Verify that at least one of the specified credit-reference alternatives is provided.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.3 Credit references (AML / OFAC)
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
