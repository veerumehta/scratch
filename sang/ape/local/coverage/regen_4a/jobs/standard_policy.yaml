  - rule_id: acra-standard.asset_assessment_assets_and_funds_to_close.funds_to_close_seasoning_trigger
    condition:
      kind: procedure
      purpose: Determine whether funds-to-close seasoning verification is required under STD-9.2.
      steps:
      - 'Step 1 - Initial Document Review: Review the loan application and available transaction information
        to identify the transaction type and funds to close.'
      - 'Step 2 - Eligibility Verification: For consumer transactions, assess whether CLTV is over 70%.
        For business purpose loans, assess whether funds to close are over $50,000 and CLTV is over 70%.'
      - 'Step 3 - Validation and Verification: Resolve whether the transaction is a consumer transaction
        or a business purpose loan and verify the funds-to-close amount where applicable. Whether any
        loan on this program is a consumer transaction is subject to Acra confirmation requested → Q-27.'
      - 'Step 4 - Final Determination: Determine whether the seasoning verification requirement is triggered.'
      checks:
      - Seasoning verification is required when the loan is a consumer transaction with CLTV over 70%,
        or a business purpose loan with funds to close over $50,000 and CLTV over 70%.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The trigger is determined correctly and, if triggered, the required seasoning verification
          is completed.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The trigger is determined incorrectly or, if triggered, the required seasoning verification
          is not completed.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The transaction does not meet either stated trigger.
        carries_conditions: false
      evidence_types:
      - loan_application
      - bank_statement
      reads:
      - LoanCore.cltv_percent
      - LoanCore.loan_purpose
      missing_reads:
      - Whether the transaction is a consumer transaction or a business purpose loan
      - Amount of funds to close
