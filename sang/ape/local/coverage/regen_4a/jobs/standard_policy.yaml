      ledger:
        clause: 'STD-8.11 Rent loss insurance covers rental losses that are incurred during the period
          that a property is being rehabilitated following a casualty. \[G §23.40, p. 13\]


          STD-8.12 Six (6) months'' rent loss insurance is required on one- to four-unit non-owner occupied
          income properties with LTV \> 70% and when subject property rents are used to qualify (includes
          No Ratio DSCR). \[G §23.40, p. 13\]


          STD-8.13 “Loans with ≤ 70% CLTV are not required to carry rent loss insurance.” The requirement
          is stated in LTV and the exemption in CLTV; the case of LTV at or below 70% with CLTV above
