  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.guarantor_homeownership_experience
    condition:
      kind: procedure
      purpose: Determine whether the required prior homeownership experience attestation is present and
        whether supporting documentation is required.
      steps:
      - 'Step 1 - Initial Document Review: Review the loan_application and loan file for a borrower or
        guarantor attestation and evidence of prior homeownership.'
      - 'Step 2 - Eligibility Verification: Determine whether at least one borrower / guarantor attests
        on the application that they are not a first-time homebuyer.'
      - 'Step 3 - Validation and Verification: If prior home ownership is not evident within the loan
        file, determine whether the underwriter conditions for supporting documentation and verify that
        any conditioned documentation is provided.'
      - 'Step 4 - Final Determination: Determine whether the attestation requirement is met and any condition
        for supporting documentation is cleared.'
      checks:
      - At least one borrower / guarantor on the loan attests on the application that they are not a first-time
        homebuyer.
      - If prior home ownership is not evident within the loan file, supporting documentation conditioned
        for by the underwriter is provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The application attestation is present and any supporting documentation conditioned
          for by the underwriter is provided.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The required attestation or supporting documentation conditioned for by the underwriter
          remains to be obtained or cleared.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The required application attestation is absent, or conditioned supporting documentation
          is not provided.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity borrower.
        carries_conditions: false
      evidence_types:
      - loan_application
      reads:
      - Borrower.is_first_time_homebuyer
      computable_checks: []
      missing_reads:
      - Identity of the borrowers and guarantors and their application attestations
      - Evidence of prior home ownership in the loan file
      - Whether the underwriter has conditioned for supporting documentation and, if so, that documentation
