        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign accounts
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign accounts
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign accounts
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign accounts
        job_kind: verification
      ledger:
        clause: 'STD-5.6 Assets held / foreign accounts must be verified in U.S. Dollar equivalency at
          the current exchange rate via www.xe.com or the Wall Street Journal conversion table. \[G §3.10,
          p. 6\]


          STD-5.7 Sufficient funds to close must be on deposit with the Escrow / Closing Agent at least
          three (3) business days (including Saturdays for this calculation) prior to any closing date.
          \[G §3.10, p. 6\]


          STD-5.8 A copy of the two (2) most recent statements of that account is required. If the funds
          are not seasoned a minimum of sixty (60) days, a letter of explanation is required along with
          the information to comprise a sixty (60) day chain of funds. Bank statements in any language
          other than English must be translated into English. \[G §3.10, p. 6\]


          STD-5.9 Per §8.4, Foreign Nationals, regardless of LTV / CLTV, need to document a minimum of
          60 days seasoning, and funds held in a foreign bank / currency must be repatriated at minimum
          three (3) business days prior to Closing (STD-9.5). \[G §8.4, p. 12\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign accounts
          heading: ''
          text: 'STD-5.6 Assets held / foreign accounts must be verified in U.S. Dollar equivalency at
