  - rule_id: acra-standard.credit_review_analysis_credit.rental_payment_evidence
    condition:
      kind: procedure
      purpose: For a tenant occupied property, require the stated rental-payment documentation when the
        Applicant has had forbearance or mortgage lates within the last 12-months.
      steps:
      - 'Step 1 - Initial Document Review: Review available credit and rental-payment evidence for forbearance
        or mortgage lates within the last 12-months and whether the property is tenant occupied.'
      - 'Step 2 - Eligibility Verification: If the stated trigger applies, determine whether documentation
        is present for either timely receipt for the prior two (2) months rental payments or 12-months
        of subject''s payment in reserve, which may be from transaction''s cash-in-hand.'
      - 'Step 3 - Validation and Verification: Verify the submitted documentation supports at least one
        of those alternatives.'
      - 'Step 4 - Final Determination: Record whether the applicable documentation requirement is met;
        do not resolve whether “Applicant” includes guarantors of an entity borrower, which is unresolved
        in the source.'
      checks:
      - If the trigger applies, documentation establishes either timely receipt for the prior two (2)
        months rental payments or 12-months of subject's payment in reserve, which may be from transaction's
        cash-in-hand.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The trigger applies and the documentation establishes either stated alternative.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The trigger applies and neither stated documentation alternative is established.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The trigger does not apply.
        carries_conditions: false
      evidence_types:
      - credit_report
      - lease_agreement
      - rent_roll
      - bank_statement
      reads:
      - SubjectProperty.has_current_lease
      computable_checks: []
      missing_reads:
