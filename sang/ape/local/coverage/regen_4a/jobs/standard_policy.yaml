            events, as printed
        job_kind: limit
      ledger:
        clause: 'STD-7.9 Mortgage history restrictions. The labels are Acra''s; their definitions and
          how seasoning is measured: Acra confirmation requested → Q-05. In the three tables below, where
          the Summary prints a single figure without a purpose split (“Max CLTV: 65%”), it is shown in
          both columns. \[S: Housing History & PCEs\]


          | **Printed label** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T, Refi C/O** |

          |----|----|----|

          | 1x30x12 | 80% | 75% |

          | 0x60x12 | 75% | 70% |

          | 0x90x12 | 65% | 65% |

          | 0x120x12 | Ineligible | Ineligible |


          STD-7.10 Bankruptcy & foreclosure restrictions. \[S: Housing History & PCEs\]


          | **Seasoning as printed** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T, Refi C/O** |

          |----|----|----|

          | ≥ 36 Mo | No Restrictions | No Restrictions |

          | 24-35 Mo | 80% | 75% |

          | 12-23 Mo | 65% | 65% |

          | \< 12 Mo | Ineligible | Ineligible |


          STD-7.11 Short sale, deed-in-lieu & modification restrictions; and, printed beneath them, “FB
          Taken ≤6 Mos: Case-by-case” (meaning and timing → Q-05). \[S: Housing History & PCEs\]


          | **Seasoning as printed** | **Max CLTV — Purchase** | **Max CLTV — Refi R/T, Refi C/O** |

          |----|----|----|

