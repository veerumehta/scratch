  - rule_id: acra-standard.insurance_coverage_sufficiency_policy_assessment.rent_loss_coverage_or_reserve_substitute
    condition:
      kind: procedure
      purpose: For a case in which the rent loss insurance requirement applies, determine whether the
        borrower provides six (6) months' rent loss insurance or the permitted reserves substitute for
        coverage not provided.
      steps:
      - 'Initial Document Review: Review the hazard insurance declarations for rent loss insurance coverage
        and the available reserve information.'
      - 'Eligibility Verification: Confirm that the Rent Loss Insurance Requirement job establishes that
        §23.40 applies; otherwise this job does not apply.'
      - 'Validation and Verification: Verify the months of rent loss insurance provided and, if rent loss
        insurance cannot be obtained, verify reserves of two (2) months for every one (1) month of rent
        loss coverage not provided.'
      - 'Final Determination: Record whether the six-month coverage requirement or the permitted reserve
        substitute is met.'
      checks:
      - The borrower has six (6) months' rent loss insurance, or, when rent loss insurance cannot be obtained,
        reserves equal to two (2) months for every one (1) month of rent loss coverage not provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Six (6) months' rent loss insurance is provided, or, when rent loss insurance cannot
          be obtained, reserves meet the stated substitution amount for each month of coverage not provided.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Neither the required rent loss insurance nor the permitted reserve substitute is provided.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The Rent Loss Insurance Requirement job establishes that the requirement does not apply.
        carries_conditions: false
      evidence_types:
      - hazard_insurance
      - bank_statement
      reads:
      - RatioSet.reserves_months
      computable_checks: []
      missing_reads:
      - Months of rent loss insurance coverage provided
      - Whether rent loss insurance cannot be obtained
    action: require_evidence
    priority: 100
    description: Verify the required rent loss coverage or, when it cannot be obtained, the permitted
      reserve substitute.
    citations:
