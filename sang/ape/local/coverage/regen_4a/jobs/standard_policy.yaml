  - rule_id: acra-standard.identification_requirements_borrower_identity_and_status.foreign_national_financial_position_review
    condition:
      kind: procedure
      purpose: Apply the required scrutiny to a Foreign National applicant’s post-close financial position
        and exchange-rate risk mitigation ability.
      steps:
      - 'Initial Document Review: Review available information concerning the applicant’s financial position
        after closing and exchange-rate exposure.'
      - 'Eligibility Verification: Assess the post-close financial position and ability to mitigate exchange-rate
        fluctuations.'
      - 'Validation and Verification: Evaluate the available support for that assessment.'
      - 'Final Determination: Record the review judgment.'
      checks:
      - The applicant has been reviewed with scrutiny toward a post-close financial position and the ability
        to mitigate exchange rate fluctuations.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The required scrutiny has been applied and the reviewer records that the review is
          met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The required scrutiny has not been applied.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an applicant under the Foreign National Program.
        carries_conditions: false
      evidence_types:
      - bank_statement
      reads:
      - Borrower.citizenship_status
      computable_checks: []
      missing_reads:
      - Information supporting the applicant’s post-close financial position and ability to mitigate exchange-rate
        fluctuations
    action: require_evidence
    priority: 100
    description: Review the applicant’s post-close financial position and ability to mitigate exchange-rate
      fluctuations.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.1 Eligibility
    on_violation: fail
    replaces: []
