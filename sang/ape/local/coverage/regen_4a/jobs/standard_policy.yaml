  - rule_id: acra-standard.appraisal_review_property_eligibility.listed_for_sale_within_six_months
    condition:
      kind: procedure
      purpose: Determine the named fact that a property is considered listed for sale under §11.5 when
        it has been listed in the last six months, measured from the last date listed to the Application
        Date.
      steps:
      - 'Initial Document Review: Review the case information for whether the property was listed for
        sale in the last six months.'
      - 'Eligibility Verification: Apply the §11.5 measurement: from the last date of being listed to
        the Application Date.'
      - 'Validation and Verification: Confirm the listed-for-sale status used for this determination.'
      - 'Final Determination: Record whether the property is considered listed for sale under §11.5.'
      checks:
      - SubjectProperty.listed_for_sale_last_6_months is true, measured from the last date of being listed
        to the Application Date.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is not considered listed for sale under §11.5.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is considered listed for sale under §11.5.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - listing_history
      reads:
      - SubjectProperty.listed_for_sale_last_6_months
      computable_checks:
      - 0
      missing_reads:
      - The last date the property was listed for sale and the Application Date, if needed to validate
        the case field.
    action: require_evidence
    priority: 100
    description: Determine whether the property meets the guideline's listed-for-sale timing definition.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.3 Properties listed for sale (§11.5)
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: 'Appraisal Review: property eligibility'
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.3 Properties listed for sale (§11.5)
        job_kind: determination
      ledger:
        clause: 'STD-8.8 A property is considered listed for sale under §11.5 if it has been listed for
          sale in the last six months, measured from (a) the last date of being listed to (b) the Application
          Date. \[G §11.5, p. 12\]


          STD-8.9 Loans on such properties will be considered under the following characteristics: the
          property is not in default or otherwise delinquent on lien(s); for investment properties, the
          subject must be occupied by a tenant and may not be vacant; the loan must qualify as either
          (a) ≥ 1.0 DSCR or (b) 43% maximum DTI (Q-14); a prepayment penalty of at least three (3) years
          is required unless the property is in a state that does not allow prepayment penalties; twenty-four
          (24) months of reserves are required, and cash-in-hand may be considered if otherwise consistent
          with the Guide; the loan must have a fully amortizing term, interest only is not available;
          the maximum LTV / CLTV is 65% based on the lesser of (a) appraised value or (b) lowest recent
          listing price; no subordinate financing is allowed; impounds are required. \[G §11.5, pp. 11–12\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.3 Properties listed for sale
            (§11.5)
          heading: ''
          text: 'STD-8.8 A property is considered listed for sale under §11.5 if it has been listed for
            sale in the last six months, measured from (a) the last date of being listed to (b) the Application
            Date. \[G §11.5, p. 12\]


            STD-8.9 Loans on such properties will be considered under the following characteristics: the
