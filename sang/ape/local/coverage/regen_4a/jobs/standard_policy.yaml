  - rule_id: acra-standard.identification_requirements_borrower_identity_and_status.foreign_national_documents_signed_outside_the_u_s
    condition:
      kind: procedure
      purpose: Verify that documents signed outside the U.S. follow the applicable acknowledgment route
        stated in the guidelines.
      steps:
      - 'Initial Document Review: Determine whether any documents are signed outside of the U.S.; review
        the place of signing and the applicable acknowledgment documents.'
      - 'Eligibility Verification: For documents notarized by a U.S. embassy or consular official, verify
        the certificate of acknowledgement includes the embassy or consular seal and is acceptable to
        the title company. For documents signed in a country that is party to the Hague Convention Treaty
        Abolishing the Requirement of Legalization for Foreign Public Documents, review the authorized
        notary public acknowledgment and English apostille attached to the executed documents.'
      - 'Validation and Verification: Verify title company acceptance for the applicable route.'
      - 'Final Determination: Record whether the applicable signing requirements are met.'
      checks:
      - If documents are signed outside of the U.S. and notarized by a U.S. embassy or consular official,
        the certificate of acknowledgement includes the embassy or consular seal and is acceptable to
        the title company.
      - If documents are signed in a country that is party to the Hague Convention Treaty Abolishing the
        Requirement of Legalization for Foreign Public Documents, the certificate of acknowledgment is
        completed and signed by an authorized notary public, authentication by apostille in English is
        attached to the executed documents, and the title company accepts it.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: No documents are signed outside of the U.S., or the applicable stated acknowledgment
          requirements are met.
