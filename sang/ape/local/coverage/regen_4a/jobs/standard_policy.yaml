  - rule_id: acra-standard.income_stability_sufficiency_analysis.vacant_property_qualifying_rent
    condition:
      kind: procedure
      purpose: Verify the stated source of qualifying rents for a vacant property being purchased.
      steps:
      - 'Initial Document Review: Review the appraisal report for a Form 1007 or Form 1025, as applicable.'
      - 'Eligibility Verification: Determine whether the property is vacant and being purchased.'
      - 'Validation and Verification: Verify that qualifying rents are taken from the applicable appraisal
        rent schedule and that a 1007 survey is provided if the property is the subject of an Acra loan.'
      - 'Final Determination: Record whether the stated vacant-property rent documentation is provided;
        do not treat Form 1025 sufficiency as resolved by this source.'
      checks:
      - For a vacant property being purchased, qualifying rents are taken from the applicable 1007 or
        1025 appraisal report, and a 1007 survey is provided if the property is the subject of an Acra
        loan.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The stated qualifying-rent documentation is provided, subject to the unresolved Form
          1025 question where applicable.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The stated qualifying-rent documentation is not provided.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property is not vacant and being purchased.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.is_vacant
      - LoanCore.loan_purpose
      computable_checks: []
      missing_reads:
      - Whether the appraisal report contains a 1007 survey
      - Whether qualifying rents are taken from the appraisal rent schedule
      - Whether Form 1025 satisfies the requirement for a 2-4 unit property (Q-08)
