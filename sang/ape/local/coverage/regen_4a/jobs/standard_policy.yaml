  - rule_id: acra-standard.income_stability_sufficiency_analysis.excessive_lease_rent_support
    condition:
      kind: procedure
      purpose: Verify that a single-family investment property's excessive monthly lease rent is supported
        as typical for the area.
      steps:
      - 'Initial Document Review: Review the lease agreement and any submitted local rent-support documentation.'
      - 'Eligibility Verification: Determine whether the property is a single-family investment property
        with excessive monthly rent payments reflected on the lease.'
      - 'Validation and Verification: Verify documentation supports that the monthly rent is typical for
        the area. Acceptable documentation may include classified ads from local newspapers, a 1007 completed
        by the appraiser, or a market rent survey completed by a local real estate company or rental management
        company familiar with market rents in the area.'
      - 'Final Determination: Record whether the rent is supported as typical for the area.'
      checks:
      - For a single-family investment property with excessive monthly rent payments reflected on the
        lease, documentation supports that the monthly rent is typical for the area.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The excessive monthly rent is documented as typical for the area.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The excessive monthly rent is not documented as typical for the area.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property is not a single-family investment property with excessive monthly rent
          payments reflected on the lease.
        carries_conditions: false
      evidence_types:
      - lease_agreement
      - appraisal_report
      reads:
      - SubjectProperty.property_type
      computable_checks: []
      missing_reads:
      - Whether monthly lease rent is excessive for the area
      - Whether the submitted market rent survey is completed by a local real estate company or rental
        management company familiar with market rents in the area
    action: require_evidence
    priority: 100
    description: Verify that documentation supports monthly lease rent that is excessive for the area.
