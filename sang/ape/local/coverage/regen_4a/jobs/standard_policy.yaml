  - rule_id: acra-standard.insurance_coverage_sufficiency_policy_assessment.rent_loss_insurance_requirement
    condition:
      kind: procedure
      purpose: Establish whether the six-month rent loss insurance requirement applies, including the
        stated CLTV exemption and the LTV/CLTV case referred to Acra confirmation Q-11.
      steps:
      - 'Initial Document Review: Review the loan application and available lease agreement or rent roll
        for the property and rental information relevant to the requirement.'
      - 'Eligibility Verification: Determine whether the property is a one- to four-unit non-owner occupied
        income property, whether subject property rents are used to qualify (including No Ratio DSCR),
        and whether LTV is > 70%.'
      - 'Validation and Verification: Check CLTV against the stated ≤ 70% exemption. If LTV is at or below
        70% and CLTV is above 70%, note that Acra confirmation is requested → Q-11.'
      - 'Final Determination: Record whether the six-month requirement applies, the CLTV exemption applies,
        or the Q-11 case requires Acra confirmation.'
      checks:
      - Rent loss insurance is required under §23.40 after applying the one- to four-unit non-owner occupied
        income property, LTV > 70%, rents-used-to-qualify, and CLTV-exemption terms.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The stated applicability criteria establish that six (6) months' rent loss insurance
          is required, and the ≤ 70% CLTV exemption does not apply.
