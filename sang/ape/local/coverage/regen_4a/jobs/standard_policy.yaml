        verdict: violated
        criterion: Documents are signed outside of the U.S. and the applicable stated acknowledgment requirements
          are not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The loan is not a Foreign National Program loan.
        carries_conditions: false
      evidence_types: []
      reads:
      - Borrower.citizenship_status
      computable_checks: []
      missing_reads:
      - Whether documents are signed outside the U.S. and the place of signing
      - Applicable certificate of acknowledgement, embassy or consular seal, authorized notary public
        signature, and apostille in English
      - Title company acceptance
