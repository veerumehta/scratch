  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.entity_documentation
    condition:
      kind: procedure
      purpose: Determine whether the required entity documentation has been provided and meets the stated
        requirements.
      steps:
      - 'Step 1 - Initial Document Review: Obtain and review the applicable entity_documents. Do not accept
        borrower letters stating that required documents are not required, available, or excused from
        providing them.'
      - 'Step 2 - Eligibility Verification: Identify which stated documentation requirements apply to
        the entity type and transaction, including any alternative documentation expressly stated for
        unavailable stock certificates or stock ledgers.'
      - 'Step 3 - Validation and Verification: Verify that the required formation documents and amendments,
        governing documents and amendments, ownership evidence, applicable stock records or alternatives,
        name-matching or explanation, good-standing or equivalent certificate, applicable foreign qualification,
        EIN/TIN evidence or submitted exception request, and unanimous written consent or board resolution
        are present and meet their stated requirements. Review any required Power of Attorney for a personal
        guarantee and any additional supporting documentation requested by Legal.'
      - 'Step 4 - Final Determination: Determine whether the applicable required entity documentation
        is complete and meets the stated requirements; refer any EIN exception request for review by Acra''s
        Legal Department.'
      checks:
      - The complete, legible Certificate of Formation / Articles of Organization and all amendments thereto
        are provided.
      - The complete, legible Operating Agreement for LLCs and Partnerships, or Bylaws for corporations,
        including all referenced exhibits and amendments, states whether the entity is member or manager
        managed, contains authorization to borrow money and enter into contracts for mortgage assets,
        and designates signers; any conflict with formation documents is addressed with any additional
        information required.
      - 'Documentation evidencing all ownership interests is provided: for LLCs and Partnerships, the
        Operating Agreement identifies or attaches as an exhibit all persons by name with their ownership
        interest, or membership interest certificates / units in compliance with the Operating Agreement
        are provided.'
      - For S or C Corporations, shareholder / stockholder certificates that comply with the Bylaws, if
        any, or the corporation's stock ledger when certificates are lost or unavailable, account for
        all outstanding shares noted in the Certificate of Formation / Articles of Organization, including
        those held by the corporation; when stock certificates are lost, destroyed, mutilated, or otherwise
        unavailable, an Affidavit of Lost Stock Certificate is provided.
      - For S-corporations or Partnerships where both stock certificate and stock ledger are unavailable,
        the most recent preceding tax year's K-1 statement for all members with 20% or more interest and
        a CPA or Tax Preparer letter affirming current ownership interest are provided; if the preceding
        year's taxes have not been filed, the letter includes a statement to that effect.
      - Names on entity documents match identification, or a letter of explanation addresses any discrepancy.
      - A Certificate of Good Standing or equivalent document valid within ninety (90) days of the closing
        date is provided.
      - A Certificate of Foreign Qualification or other qualification to operate in the state where business
        is conducted is provided if the entity is formed in a state other than where business is performed
        or where the property is located.
      - IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or Employer Identification Number
        (EIN) issuance letter is provided, or an EIN exception request with a letter of explanation stating
        the applicable grounds is submitted for review by Acra's Legal Department.
      - A Unanimous Written Consent / Board Resolution signed by all members regardless of their percentage
        of interest authorizes the transaction with Acra Lending and identifies who is authorized to sign
        the loan documents on behalf of and to bind the entity; it is not used to designate a signor on
        a personal guarantee.
      - A Power of Attorney is utilized by the principal to designate an attorney in fact to execute a
        personal guarantee when required.
      - Any additional supporting documentation conditioned for by Legal is provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable documentation check holds and no required additional supporting documentation
          remains outstanding.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: A required document or additional supporting documentation remains to be provided or
          cleared, or an EIN exception request remains under review.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A required document or required content is absent or does not meet the stated requirements,
          or a borrower letter is offered in place of required documents.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity.
        carries_conditions: false
      evidence_types:
      - entity_documents
      reads:
      - Borrower.entity_type
      - Borrower.entity_documents_complete
      computable_checks: []
      missing_reads:
      - Applicable entity type and required document alternatives
      - The entity documents and all amendments, exhibits, ownership records, and identification used
        to verify names
      - Closing date and certificate validity date
      - Formation state, state where business is conducted, and property state
      - EIN exception request and its letter of explanation, if requested
      - Whether Legal has conditioned for additional supporting documentation
      - Whether a Power of Attorney is required for a personal guarantee
    action: require_evidence
    priority: 100
    description: Review the required entity documents and verify their required contents, validity, and
      consistency.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.2 Entity documentation ¶1
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.2 Entity documentation ¶2
    on_violation: fail
