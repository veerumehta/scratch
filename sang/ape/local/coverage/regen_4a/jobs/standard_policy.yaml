  - rule_id: acra-standard.appraisal_review_property_eligibility.property_type_cltv_caps
    condition:
      kind: procedure
      purpose: Determine whether the subject property meets the STD-8.1 CLTV limits and printed minimum
        DSCR conditions applicable to Non-Warrantable Condo, Condotel / PUDtel, 2-4 Unit, or Manufactured
        Home.
      steps:
      - 'Initial Document Review: Review the property type, loan purpose, CLTV, state, and DSCR information
        available for the case.'
      - 'Eligibility Verification: Identify the applicable STD-8.1 row and transaction purpose; do not
        apply this job when the property type is not one of the types covered by the printed caps.'
      - 'Validation and Verification: Compare CLTV with the applicable printed cap. For Non-Warrantable
        Condo and Condotel / PUDtel in Florida, apply the printed -5% CLTV condition. For those two property
        types, verify the printed Min DSCR: 1.0 condition.'
      - 'Final Determination: Record whether every applicable printed cap and minimum DSCR condition is
        met.'
      checks:
      - For a Non-Warrantable Condo, CLTV does not exceed 80% for Purchase, 75% for Refi R/T, or 75% for
        Refi C/O; for Florida properties, apply the printed -5% CLTV condition.
      - For a Condotel / PUDtel, CLTV does not exceed 75% for Purchase, 70% for Refi R/T, or 65% for Refi
        C/O; for Florida properties, apply the printed -5% CLTV condition.
      - For a 2-4 Unit property, CLTV does not exceed 80%.
      - For a Manufactured Home, CLTV does not exceed 65% for Purchase, 60% for Refi R/T, or 60% for Refi
        C/O.
      - For a Non-Warrantable Condo or Condotel / PUDtel, DSCR is at least 1.0.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property type is covered by this job and every applicable printed CLTV cap and
          minimum DSCR condition is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property type is covered by this job and an applicable printed CLTV cap or minimum
          DSCR condition is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property type is not Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units, or Manufactured.
        carries_conditions: false
      evidence_types: []
      reads:
      - SubjectProperty.property_type
      - LoanCore.loan_purpose
      - LoanCore.cltv_percent
      - SubjectProperty.state
      computable_checks:
      - 0
      - 1
      - 2
      - 3
      missing_reads:
      - The DSCR ratio for a Non-Warrantable Condo or Condotel / PUDtel.
