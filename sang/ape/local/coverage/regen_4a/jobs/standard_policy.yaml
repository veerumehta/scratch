  - rule_id: acra-standard.appraisal_review_property_eligibility.listed_property_conditions
    condition:
      kind: procedure
      purpose: Determine whether a property considered listed for sale under §11.5 meets the stated loan
        and property conditions.
      steps:
      - 'Initial Document Review: Review the listed-for-sale determination, lien status, occupancy, qualification,
        prepayment penalty, reserves, amortization, value, subordinate financing, and impounds information.'
      - 'Eligibility Verification: Apply the conditions in STD-8.9 to a property considered listed for
        sale under §11.5.'
      - 'Validation and Verification: Verify each applicable condition, including the 65% maximum based
        on the lesser of appraised value or lowest recent listing price, and the state exception for prepayment
        penalties.'
      - 'Final Determination: Record whether all applicable STD-8.9 conditions are met.'
      checks:
      - The property is not in default or otherwise delinquent on lien(s).
      - For an investment property, the subject is occupied by a tenant and is not vacant.
      - The loan qualifies as either at least 1.0 DSCR or 43% maximum DTI (Q-14).
      - A prepayment penalty of at least three (3) years is in place unless the property is in a state
        that does not allow prepayment penalties.
      - Reserves are 24 months; cash-in-hand may be considered if otherwise consistent with the Guide.
      - The loan has a fully amortizing term and is not interest only.
      - Maximum LTV / CLTV is 65% based on the lesser of appraised value or lowest recent listing price.
      - No subordinate financing is allowed.
      - Impounds are in place.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is considered listed for sale under §11.5 and every applicable STD-8.9
          condition is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
