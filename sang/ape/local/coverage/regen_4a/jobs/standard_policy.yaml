  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.entity_eligibility
    condition:
      kind: procedure
      purpose: Determine whether the proposed entity borrower meets the stated entity eligibility requirements.
      steps:
      - 'Step 1 - Initial Document Review: Review entity_documents and the loan application for the entity’s
        form, formation and ownership structure, and business purpose.'
      - 'Step 2 - Eligibility Verification: Determine whether the entity is an allowed entity type; whether
        it is US formed and based and not foreign owned; whether it is a prohibited entity type or structure;
        and whether any nesting complies with the stated limit.'
      - 'Step 3 - Validation and Verification: Verify the entity’s form, formation, ownership, and business
        purpose against the reviewed records. Confirm that the transaction is business purpose and for
        investment properties exclusively.'
      - 'Step 4 - Final Determination: Determine whether the proposed entity borrower meets all applicable
        entity eligibility requirements.'
      checks:
      - The entity is one of the allowed entity types, and an LLC is not a series LLC.
      - The entity is US formed and based, and is not a foreign owned entity.
      - The entity is not a Cooperative, Irrevocable Trust, Land Trust, IRA, Non-Profit, or Joint Venture.
      - Business entity nesting is limited to only one (1) wholly-owned subsidiary that in turn is owned
        by individual(s); there is no multiple nesting or ownership by multiple entities, trusts, etcetera.
      - The transaction is a business purpose transaction for investment properties exclusively.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The entity meets every applicable entity eligibility requirement in the checks.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The entity does not meet an applicable entity eligibility requirement.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity.
        carries_conditions: false
      evidence_types:
      - entity_documents
      - loan_application
      reads:
      - Borrower.entity_type
      - LoanCore.loan_purpose
      computable_checks: []
      missing_reads:
      - Entity formation and jurisdiction records
      - Entity ownership and nesting structure
      - Information establishing whether the entity is foreign owned
      - Loan purpose and evidence that the property is for investment exclusively
    action: require_evidence
    priority: 100
    description: Determine whether the proposed borrowing entity is eligible under the entity-form, ownership-structure,
      and business-purpose requirements.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.1 Entity eligibility and guarantees ¶1
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.1 Entity eligibility and guarantees ¶2
