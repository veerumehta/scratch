        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.3 Credit references (AML / OFAC)
        job_kind: verification
      ledger:
        clause: 'STD-5.10 One of the following is required: a U.S. credit report with at least two (2)
