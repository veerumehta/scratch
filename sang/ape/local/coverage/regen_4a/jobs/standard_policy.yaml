  - rule_id: acra-standard.asset_assessment_assets_and_funds_to_close.listed_property_reserves
    condition:
      kind: procedure
      purpose: Determine whether the reserve requirement for a property listed for sale within six months
        is met.
      steps:
      - 'Step 1 - Initial Document Review: Review available documentation of reserves and listing history.'
      - 'Step 2 - Eligibility Verification: Determine whether the property was listed for sale within
        six months.'
      - 'Step 3 - Validation and Verification: If the trigger applies, verify twenty-four (24) months
        of reserves. Cash-in-hand may be considered if otherwise consistent with the Guide.'
      - 'Step 4 - Final Determination: Determine whether the stated reserve requirement is met when triggered.'
      checks:
      - If the property was listed for sale within six months, twenty-four (24) months of reserves are
        held.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: If the property was listed for sale within six months, the check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: If the property was listed for sale within six months, the check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property was not listed for sale within six months.
        carries_conditions: false
      evidence_types:
      - bank_statement
      - listing_history
      reads:
      - SubjectProperty.listed_for_sale_last_6_months
      missing_reads:
      - Evidence and amount of reserves meeting the twenty-four (24) months requirement
      - Whether cash-in-hand is otherwise consistent with the Guide, if offered
    action: require_evidence
    priority: 100
    description: Verify the stated twenty-four (24) months of reserves requirement for a property listed
      for sale within six months.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#9.2 Reserves by trigger, as stated
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
