  - rule_id: acra-standard.income_stability_sufficiency_analysis.actual_rent_evidence
    condition:
      kind: procedure
      purpose: Verify the specified documentation for actual rents that exceed market rents, without deciding
        which qualifying-rent formulation governs.
      steps:
      - 'Initial Document Review: Review the lease agreement and proof of rental income receipt.'
      - 'Eligibility Verification: Determine whether actual rents exceed market rents and actual rents
        are being used.'
      - 'Validation and Verification: Verify proof of rental income receipt for two (2) consecutive months
        and lease agreement(s) to continue at a minimum of three (3) months after closing. Verify that
        the rents are not prepaid and that a Security Deposit is not counted as receipt.'
      - 'Final Determination: Record whether the stated evidence and rent conditions are met.'
      checks:
      - If actual rents exceed market rents and actual rents are used, two (2) consecutive months proof
        of rental income receipt and lease agreement(s) continuing at a minimum of three (3) months after
        closing are documented, Security Deposit is not counted towards receipt, and rents are not prepaid.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Where this provision applies, all stated evidence and rent conditions are met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Where this provision applies, any stated evidence or rent condition is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Actual rents do not exceed market rents, or actual rents are not being used.
        carries_conditions: false
      evidence_types:
      - lease_agreement
      - bank_statement
      reads: []
      computable_checks: []
      missing_reads:
      - Whether actual rents exceed market rents
      - Whether actual rents are being used
      - Whether the lease agreement(s) continue at a minimum of three (3) months after closing
      - Whether rent is prepaid
      - Whether any amount counted as receipt is a Security Deposit
    action: require_evidence
    priority: 100
    description: Verify the stated supporting evidence when actual rents exceed market rents and actual
      rents are used.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both provisions, as written
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: Income
        assistant:
        - Underwriter
        mnemonic: DSCR-ACTUAL
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both provisions,
            as written
        job_kind: verification
      ledger:
        clause: 'STD-3.5 Formula: the lesser of annual in-place rent or market rent (STD-3.1). \[G §5.32,
          p. 3\]


          STD-3.6 Note in the same section: “Acra may use the higher of actual or market rents. Where
          actual rents exceed market rents, then evidence of actual rents must be documented via two (2)
          consecutive months proof of rental income receipt and lease agreement(s) to continue at a minimum
          of three (3) months after closing. Note: Security Deposit does not count towards receipt, and
          the rents cannot be prepaid.” \[G §5.32, p. 3; repeated under Actual Rents, p. 5\]


          STD-3.7 This document does not select between STD-3.5 and STD-3.6. When market rent may be used
          if actual rent is lower, when higher actual rent may be used, and whether the stated documentation
          is sufficient or further approval is required: Acra confirmation requested → Q-01.


          STD-3.8 “If vacant property is being purchased, qualifying rents are taken from the 1007 or
          1025 Appraisal report, as applicable, for qualifying income.” Rental income from the purchase
          of a vacant property requires a 1007 survey if it is the subject of an Acra loan. \[G §5.32,
          p. 3; §5.30–5.31, p. 4\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both provisions,
            as written
