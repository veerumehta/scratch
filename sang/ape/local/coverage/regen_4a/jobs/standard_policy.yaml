        where allowable.
      - For a vacant property's cash-out refinance, the loan is not interest-only.
      - For a vacant property's cash-out refinance, impounds are in place.
      - For a vacant property's cash-out refinance, reserves are at least 6 months.
      - For a vacant property's cash-out refinance with a loan amount under $1,500,000, CLTV does not
        exceed 60%; obtain Acra confirmation for loans of $1,500,000 or more.
      - For a vacant property's cash-out refinance, ownership is at least 15 months; obtain Acra confirmation
        on how the 15 months are measured.
