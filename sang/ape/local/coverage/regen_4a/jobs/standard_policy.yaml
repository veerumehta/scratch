        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.1 Eligibility
        job_kind: judgment
      ledger:
        clause: 'STD-5.1 Foreign Nationals are eligible for financing on business purpose transactions
          only (i.e. investment properties). \[G §3.10, p. 6\]


          STD-5.2 Eligible under the Foreign National Program are Non-Resident Aliens who are not authorized
          to live or work in the U.S. “A true Foreign National may periodically visit the U.S. for various
          reasons including vacation and / or business, may purchase property for limited personal use
          or investment, or may own a U.S based business entity, but they must reside outside of the U.S.”
          \[G §3.10, p. 6\]


          STD-5.3 Borrowers who are holders of Individual Tax Identification Numbers (ITIN) are eligible
          for this program if they reside outside of the U.S. \[G §3.10, p. 6\]


          STD-5.4 “Due to market exchange rates, applicants are to be reviewed with scrutiny toward a
          post-close financial position and their ability to mitigate exchange rate fluctuations.” \[G
          §3.10, p. 6\]


          STD-5.5 “See 3.10 for OFAC restrictions and state specific exclusions” — not reproduced (Appendix
          B). \[G §3.10, p. 7\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.1 Eligibility
