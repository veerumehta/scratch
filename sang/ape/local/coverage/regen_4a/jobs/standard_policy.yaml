            a minimum of three (3) months after closing. Note: Security Deposit does not count towards
            receipt, and the rents cannot be prepaid.” \[G §5.32, p. 3; repeated under Actual Rents, p.
            5\]


            STD-3.7 This document does not select between STD-3.5 and STD-3.6. When market rent may be
            used if actual rent is lower, when higher actual rent may be used, and whether the stated
            documentation is sufficient or further approval is required: Acra confirmation requested →
            Q-01.


            STD-3.8 “If vacant property is being purchased, qualifying rents are taken from the 1007 or
            1025 Appraisal report, as applicable, for qualifying income.” Rental income from the purchase
            of a vacant property requires a 1007 survey if it is the subject of an Acra loan. \[G §5.32,
            p. 3; §5.30–5.31, p. 4\]'
