  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.entity_due_diligence
    condition:
      kind: procedure
      purpose: Determine whether the stated entity borrower and guarantor due diligence and background
        review requirements have been met.
      steps:
      - 'Step 1 - Initial Document Review: Review the loan file for borrower / guarantor due diligence
        and background review records.'
      - 'Step 2 - Eligibility Verification: Identify the entity, recourse guarantors, and every party
        that owns 20% or more of the entity directly or indirectly or has managing control.'
      - 'Step 3 - Validation and Verification: Verify that borrower / guarantor due diligence is current
        as of the date of any loan approval or draw. Review the background checks ordered for the applicable
        Key Principals and Entities, including criminal history, OFAC searches, litigation, judgment,
        and lien searches, as applicable to the review performed.'
      - 'Step 4 - Final Determination: Determine whether the stated due diligence and background review
        requirements have been met.'
      checks:
      - Borrower / Guarantor Due Diligence is current as of the date of any loan approval or draw.
      - The background review covers the entity, recourse guarantor(s), and any party (individual or entity)
        that owns 20% or more of the entity directly or indirectly or has managing control.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Both checks hold.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Required current due diligence or background review remains to be obtained or completed.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity.
        carries_conditions: false
      evidence_types:
      - entity_documents
      reads:
      - Borrower.entity_type
      computable_checks: []
      missing_reads:
      - Date of loan approval or draw and the applicable due diligence currency schedule
      - Current borrower / guarantor due diligence records
      - Identity and ownership or managing-control information for applicable Key Principals and Entities
      - Background review records and searches performed
    action: require_evidence
    priority: 100
    description: Verify that borrower and guarantor due diligence is current as of loan approval or draw
      and that the applicable key principals and entities are subject to background review.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.3 Due diligence and background checks
