  - rule_id: acra-standard.appraisal_review_property_eligibility.mixed_use_property_conditions
    condition:
      kind: procedure
      purpose: Determine whether a mixed-use property satisfies the minimum DSCR stated in STD-8.10 and
        whether the other §10.7 conditions can be verified.
      steps:
      - 'Initial Document Review: Review the mixed-use property indicator and DSCR information; obtain
        the requirements of §10.7, which is not reproduced in the excerpt.'
      - 'Eligibility Verification: Apply this job to a mixed-use property; note that Acra may approve
        mixed-use properties under the conditions outlined in §10.7, which also holds all restrictions
        regarding Adult Care / Assisted Living Facilities.'
      - 'Validation and Verification: Verify minimum DSCR ratio of 1.2 and verify the applicable §10.7
        conditions when available.'
      - 'Final Determination: Record whether the minimum DSCR and applicable §10.7 conditions are verified.'
      checks:
      - For a mixed-use property, DSCR is at least 1.2.
      - The applicable conditions outlined in §10.7, including all restrictions regarding Adult Care /
        Assisted Living Facilities, are met.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is mixed use, minimum DSCR ratio of 1.2 is met, and applicable §10.7 conditions
          are verified as met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property is mixed use and §10.7 conditions or the DSCR ratio are not available
          for verification.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is mixed use and the minimum DSCR ratio of 1.2 or an applicable §10.7
          condition is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: SubjectProperty.is_mixed_use is false.
        carries_conditions: false
      evidence_types: []
      reads:
      - SubjectProperty.is_mixed_use
      computable_checks: []
      missing_reads:
