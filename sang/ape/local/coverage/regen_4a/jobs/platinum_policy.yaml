  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_ltv_and_cltv_limit
    condition:
      kind: procedure
      purpose: Determine whether the listed-property maximum LTV / CLTV of 65% is met using the required
        lesser value.
      steps:
      - 'Initial Document Review: Review the appraisal_report and listing_history for appraised value
        and lowest recent listing price.'
      - 'Eligibility Verification: Apply the 65% maximum LTV / CLTV based on the lesser of appraised value
        or lowest recent listing price.'
      - 'Validation and Verification: Verify the loan amount, CLTV, appraised value, and lowest recent
        listing price used in the comparison.'
      - 'Final Determination: Determine whether the maximum is met for a property covered by the Listed-for-Sale
        Determination.'
      checks:
      - LTV / CLTV is no greater than 65% when based on the lesser of appraised value or lowest recent
        listing price.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is not listed for sale under the Listed-for-Sale Determination, or the
          check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property is listed for sale and the lowest recent listing price or the corresponding
          LTV / CLTV calculation is outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is listed for sale and the check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      - listing_history
      - loan_application
      reads:
      - LoanCore.cltv_percent
      - LoanCore.total_loan_amount_usd
      - SubjectProperty.appraised_value_usd
      missing_reads:
      - LTV
      - Lowest recent listing price
