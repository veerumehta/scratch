            Limited Liability Companies (LLC), excluding series LLC; Limited Liability Partnership (LLP);
            Limited Liability Limited Partnership (LLLP); General Partnership (GP); Limited Partnership
            (LP); and Sole Proprietorship. “In all events, the Borrower must be a US formed and based
            Entity, foreign entities (i.e.: entities formed or based outside the US) or foreign owned
            entities are not allowed.” \[G §3.12, p. 8\]'
