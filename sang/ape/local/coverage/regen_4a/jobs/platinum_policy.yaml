  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_investment_property_occupancy
    condition:
      kind: procedure
      purpose: Determine whether a listed investment property is occupied by a tenant and is not vacant.
      steps:
      - 'Initial Document Review: Review the lease_agreement or rent_roll and appraisal_report for tenant
        occupancy and vacancy.'
      - 'Eligibility Verification: For investment properties covered by PLAT-7.8, require the subject
        to be occupied by a tenant and not vacant.'
      - 'Validation and Verification: Verify SubjectProperty.occupancy_subtype, SubjectProperty.has_current_lease,
        and SubjectProperty.is_vacant against the reviewed evidence.'
      - 'Final Determination: Determine whether both requirements are met for a property covered by the
        Listed-for-Sale Determination.'
      checks:
      - If the listed property is an investment property, the subject is occupied by a tenant.
      - If the listed property is an investment property, the subject is not vacant.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is not an investment property, or both checks hold.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is an investment property and either check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property is not listed for sale under the Listed-for-Sale Determination.
        carries_conditions: false
      evidence_types:
      - lease_agreement
      - rent_roll
      - appraisal_report
      reads:
      - SubjectProperty.occupancy_subtype
      - SubjectProperty.has_current_lease
      - SubjectProperty.is_vacant
      computable_checks:
      - 1
