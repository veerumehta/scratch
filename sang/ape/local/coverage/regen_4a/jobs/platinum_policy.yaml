          Warrantable Condo, Max CLTV: 75.00%”. \[P: Subject Property Requirements\]


          PLAT-7.2 “Rural Properties, Condotels, Non-Warrantable Condos ineligible”; “Short-Term Rentals
          (STR) ineligible”. \[P: Subject Property Requirements\]


          | **Feature** | **Status in the Platinum Summary** | **Where stated** |

          |----|----|----|

