  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_reserves
    condition:
      kind: procedure
      purpose: Determine whether twenty-four (24) months of reserves are required and documented for a
        listed-for-sale property.
      steps:
      - 'Initial Document Review: Review the reserve evidence and any cash-in-hand consideration in the
        loan file.'
      - 'Eligibility Verification: Apply the requirement for twenty-four (24) months of reserves; cash-in-hand
        may be considered if otherwise consistent with the Guide.'
      - 'Validation and Verification: Verify LoanCore and reserve evidence for the reserves-months amount.'
      - 'Final Determination: Determine whether the twenty-four-month requirement is met for a property
        covered by the Listed-for-Sale Determination.'
      checks:
      - Reserves are at least twenty-four (24) months, with cash-in-hand considered only if otherwise
        consistent with the Guide.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is not listed for sale under the Listed-for-Sale Determination, or the
          check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property is listed for sale and reserve evidence or the Guide-consistency determination
          for cash-in-hand is outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is listed for sale and the check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - bank_statement
      - loan_application
      reads:
      - RatioSet.reserves_months
      missing_reads:
      - Reserve evidence
      - Whether cash-in-hand is otherwise consistent with the Guide
