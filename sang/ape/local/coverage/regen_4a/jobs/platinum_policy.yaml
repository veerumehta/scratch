  - rule_id: acra-platinum.credit_review_analysis_credit.decisioning_credit_score_selection
    condition:
      kind: procedure
      purpose: Determine the decisioning credit score used for the loan.
      steps:
      - 'Step 1 - Initial Document Review: Review the credit report and, for a loan closing in the name
        of an entity, the entity and loan application documents for borrower or guarantor scores, ownership
        percentages, and wage-earner information.'
      - 'Step 2 - Eligibility Verification: For an individual loan, identify the Primary Wage Earner.
        For an entity loan, identify the personal guarantors and their ownership percentages.'
      - 'Step 3 - Validation and Verification: Apply PLAT-6.1: use the Primary Wage Earner middle score
        for an individual loan; for an entity loan, use the highest middle score of the personal guarantors
        if ownership percentages are equal, or the individual with the highest concentration of ownership
        if ownership percentages differ. Do not select a score using a rule not stated in the source where
        the selection is unresolved.'
      - 'Step 4 - Final Determination: Record the decisioning credit score if the source specifies how
        it is selected; otherwise record that Acra confirmation is required under Q-05.'
      checks:
      - The decisioning credit score is selected according to the applicable selection rule stated in
        PLAT-6.1.
      - If the file has one or two scores, no score, no income documentation identifying the Primary Wage
        Earner, or two or more guarantors with an equal largest ownership interest where ownership is
        not equal across all guarantors, the unresolved score-selection issue is identified.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The decisioning credit score is selected according to a selection rule stated in PLAT-6.1.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The decisioning credit score is not selected according to a selection rule stated in
          PLAT-6.1.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - credit_report
      - entity_documents
      - loan_application
      reads:
      - Borrower.entity_type
      - Borrower.is_entity_borrower_1
      - CreditReport.score_count
      - CreditReport.representative_score
      computable_checks: []
      missing_reads:
      - Personal guarantor middle scores; ownership percentages; identification of the Primary Wage Earner;
