  - rule_id: acra-platinum.asset_assessment_assets_and_funds_to_close.funds_to_close_seasoning_verification
    condition:
      kind: procedure
      purpose: Verify seasoning of funds to close for the consumer and business-purpose loan cases specified
        by the source.
      steps:
      - 'Step 1 - Initial Document Review: Review the transaction classification, CLTV, funds to close,
        and documentation for the funds to close.'
      - 'Step 2 - Eligibility Verification: Determine whether the loan is a consumer transaction or a
        business purpose loan and apply the stated seasoning-verification trigger.'
      - 'Step 3 - Validation and Verification: Where the trigger applies, verify seasoning of the funds
        to close using the applicable evidence. Do not infer a domestic seasoning period beyond the 30-days
        documentation minimum stated for all transactions.'
      - 'Step 4 - Final Determination: Record whether the required seasoning verification has been completed.'
      checks:
      - For a consumer transaction with CLTV over 70%, seasoning of funds to close is verified.
      - For a business purpose loan with funds to close over $50,000 and CLTV over 70%, seasoning of funds
        to close is verified.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The applicable seasoning-verification trigger is met and seasoning of funds to close
          is verified, or neither trigger is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
