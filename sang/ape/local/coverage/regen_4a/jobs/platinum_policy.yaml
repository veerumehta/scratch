          - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying rent, as printed
            in the Platinum Summary
          - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The ratio
          - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.3 Minimum ratio
        job_kind: limit
      ledger:
        clause: '1.1 Occupancy, purpose and qualification

          PLAT-1.7 The program is offered through two channels with different minimum ratios: Correspondent
          ≥ 1.2, Wholesale ≥ 1.0 (PLAT-3.7). Matrix footnote 3 also restricts Correspondent pricing (PLAT-2.3).
          \[P: Minimum DSCR; matrix footnote 3\]


          PLAT-1.8 Every loan must meet the applicable channel minimum DSCR. The Platinum Summary lists
          no No Ratio option and no allowance for a ratio below 1.0; a ratio below the channel minimum
          does not meet the published requirement. Whether No Ratio or sub-1.0 qualification exists on
          this program in any form: Acra confirmation requested → Q-12. \[P: Minimum DSCR\]


          PLAT-1.9 Acra will not calculate a DTI for applicants who qualify using a DSCR; income or employment
          listed on an application is superfluous to the underwrite and may be left blank, and if represented,
          a DTI should not be calculated. The Standard Summary''s statement that borrowing-entity income
          documentation is not required does not appear in the Platinum Summary; whether it applies: Acra
          confirmation requested → Q-13. \[G §7.3, p. 5\]


          PLAT-1.10 “A 1007 will always be required on DSCR transactions”; the Platinum Summary refers
          to market rent “as established on the 1007 or 1025”. Whether a Form 1025 alone satisfies the
          requirement for a two-unit property: Acra confirmation requested → Q-04. \[G §5.32, p. 3; §14.12,
          p. 4; P: Income Documentation\]


          PLAT-1.11 All borrowers purchasing or refinancing a one- to four-family investment property
          must execute a One- to Four-Family Rider with the loan documents and provide rent loss insurance
          coverage per §23.40 (PLAT-7.9 to 7.12). \[G §3.41, p. 11\]


          PLAT-1.12 Only the subject property, principal residence and second homes are required to be
          listed on the application or Schedule of Real Estate Owned. \[G §5.32, p. 3; §4.15, p. 5\]


          PLAT-3.1 “When calculating the DSCR, Acra will use the greater of the market rent as established
          on the 1007 or 1025, or actual rent. When using actual rent, the actual rent must be documented
          via evidence of 2 months’ proof of receipts and the lease must be in place for at least 3 months
          after the loan closing. This applies to long-term rents only and is not appropriate for short-term
          rentals.” \[P: Income Documentation & Debt Ratio Requirements\]


          PLAT-3.2 §5.32 of the excerpt states the general formula as “the lesser of (i) annual in-place
          rent or (ii) market rent”, then notes that “Acra may use the higher of actual or market rents”
          subject to “two (2) consecutive months proof of rental income receipt”, a lease continuing at
          least three months after closing, and: “Security Deposit does not count towards receipt, and
          the rents cannot be prepaid.” The Platinum Summary''s statement (PLAT-3.1) is program-specific;
          the excerpt''s general formula is reproduced here. Which governs Platinum Select and how they
          relate, whether “2 months’ proof of receipts” means consecutive months, and whether the security-deposit
          and prepaid-rent conditions apply: Acra confirmation requested → Q-03. \[G §5.32, p. 3\]


          PLAT-3.3 Short-term rentals are ineligible for the program (PLAT-7.2); the Seller''s Guide provisions
          on short-term rental income and appraisal forms are not restated (Appendix B). \[P: Subject
          Property Requirements\]


          PLAT-3.4 Denominator, per §5.32: “the sum of annual principal, interest, real estate taxes,
          property insurance, and homeowner''s / condominium association fees (collectively, ‘PITIA’).
          Subordinate financing, if applicable, would also be included in the denominator for the sake
          of this calculation.” \[G §5.32, p. 3\]


          PLAT-3.5 “Acra calculates the DSCR utilizing the first payment due under the terms of the Note.”
          §7.5 defines Interest Only payments as “the amount sufficient to pay the accrued interest to
          the mortgage on a monthly basis at the time of origination”, while the §5.32 denominator lists
          “annual principal, interest …”. Which payment enters the DSCR denominator on an interest-only
          loan: Acra confirmation requested → Q-21. \[G §7.5, p. 13; §5.32, p. 3\]


          PLAT-3.6 The reference to subordinate financing in the denominator is a calculation rule; it
          does not itself establish that a subordinate lien is permitted. The Platinum Summary does not
          address subordinate financing or restate the Standard Summary''s HELOC calculation: Acra confirmation
          requested → Q-15. \[G §5.32, p. 3\]


          PLAT-3.7 Minimum Debt Service Coverage Ratio: Correspondent ≥ 1.2; Wholesale ≥ 1.0. \[P: Minimum
          DSCR\]


          PLAT-3.8 Property listed for sale within six months (§11.5): the excerpt requires “≥1.0 DSCR”;
          on this program the channel minimum applies — Wholesale 1.0, Correspondent 1.2 (PLAT-7.8). \[G
          §11.5, p. 11; P: Minimum DSCR\]'
