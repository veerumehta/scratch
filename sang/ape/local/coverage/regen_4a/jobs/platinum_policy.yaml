  - rule_id: acra-platinum.income_stability_sufficiency_analysis_dscr_income.determine_dscr_qualification
    condition:
      kind: procedure
      purpose: Determine whether the loan meets the applicable minimum DSCR for its channel.
      steps:
      - 'Step 1 - Initial Document Review: Review available rent evidence and payment information relevant
        to the DSCR calculation.'
      - 'Step 2 - Eligibility Verification: Identify the loan channel and verify that the file is being
        qualified using DSCR.'
      - 'Step 3 - Validation and Verification: Determine qualifying rent using the greater of market rent
        established on the 1007 or 1025, or actual rent. Calculate the denominator using annual PITIA
        and, if applicable, subordinate financing; use the first payment due under the terms of the Note.'
      - 'Step 4 - Final Determination: Compare the calculated DSCR with the applicable channel minimum:
        Correspondent ≥ 1.2; Wholesale ≥ 1.0.'
      checks:
      - 'The DSCR, calculated using the stated qualifying-rent and denominator rules, meets the applicable
        channel minimum: Correspondent ≥ 1.2 or Wholesale ≥ 1.0.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The calculated DSCR meets the applicable channel minimum.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The calculated DSCR does not meet the applicable channel minimum, including a ratio
          below 1.0 or no ratio.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The loan is not being qualified using DSCR.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      - lease_agreement
      - rent_roll
      - bank_statement
      reads:
      - LoanCore.channel
      - LoanCore.dscr_qualification_method
      - MortgageLoanInformation.is_interest_only
      computable_checks: []
      missing_reads:
      - Market rent established on the 1007 or 1025
      - Actual rent, if used
      - Annual principal, interest, real estate taxes, property insurance, and homeowner's / condominium
        association fees
      - Subordinate financing amount, if applicable
      - First payment due under the terms of the Note
      - Which payment enters the denominator on an interest-only loan
    action: require_evidence
    priority: 100
    description: Calculate DSCR from qualifying rent and the stated payment components, then apply the
      minimum for the loan channel.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy, purpose and qualification
      ¶2
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying rent, as printed in
      the Platinum Summary
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The ratio
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.3 Minimum ratio
    on_violation: fail
    replaces: []
