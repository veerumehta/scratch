          - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#Loan amount ≤ \$2,000,000
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2.2 Matrix footnotes, quoted
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#Loan amount ≤ \$2,000,000
        job_kind: limit
      ledger:
        clause: 'PLAT-2.1 The rows below are Acra''s. Each row is a minimum-FICO threshold: a score at
          or above the threshold and below the next higher threshold takes that row. No row is printed
          below 700. \[P: Loan Amount, FICO, CLTV Requirements\]


          | **Min FICO** | **Purchase** | **Rate & Term** | **Cash-Out** |

          |--------------|--------------|-----------------|--------------|

          | 730          | 80%          | 80%             | 75%          |

          | 721          | 80%          | 80%             | 65%          |

          | 700          | 80%          | 80%             | 55%          |


          <table>

          <colgroup>

          <col style="width: 100%" />

          </colgroup>

          <tbody>

          <tr>

          <td><p><strong>THE PRINTED 721 THRESHOLD AND A SCORE OF 720</strong></p>

          <p>Read literally, a decisioning score of 720 falls in the 700 row (cash-out maximum 55%), sits
          outside the Correspondent restriction printed for “700-719 FICO” (footnote 3), and takes the
          3.25 ARM margin printed for “720-759”. This document does not normalize 721 to 720. Whether
          the 721 threshold is intended, and how 720 is treated on each of the three points: Acra confirmation
          requested → Q-01.</p></td>

          </tr>

          </tbody>

          </table>


          PLAT-2.2 Footnote 1, whose marker is printed on the Cash-Out column heading: “When LTV \> 65%
          Max Cash-in-Hand: \$1,000,000 for loans ≥ \$1,500,000, \$500,000 for loans \< \$1,500,000.”
          Footnote 2, whose marker appears nowhere in the matrix: “When LTV ≤ 65%, unlimited cash-in-hand
          allowed.” The footnotes are stated in LTV while the matrix is labelled CLTV: Acra confirmation
          requested → Q-16. \[P: matrix footnotes 1–2\]


          PLAT-2.3 Footnote 3, whose marker also appears nowhere in the matrix: “Correspondent Pricing
          limited to 60% CLTV for 700-719 FICO”. For a Correspondent cash-out at 700-719 the matrix already
          prints 55%; the 60% footnote does not raise that figure. How the two limits apply together by
          purpose: Acra confirmation requested → Q-01. \[P: matrix footnote 3\]


          PLAT-2.4 Footnote \*: “Delayed financing is capped at \$1.5MM” (PLAT-1.4, Q-02). \[P: matrix
          footnote\]'
        clause_parts:
        - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2.1 Matrix as printed
            — Loan Amount, FICO, CLTV Requirements
          heading: ''
          text: 'PLAT-2.1 The rows below are Acra''s. Each row is a minimum-FICO threshold: a score at
