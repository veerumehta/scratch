  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.entity_form_and_jurisdiction_eligibility
    condition:
      kind: procedure
      purpose: Determine whether the entity borrower meets the stated entity-type and jurisdiction requirements.
      steps:
      - 'Initial Document Review: Review the entity documents for the entity''s legal form, place of formation,
        and place of business; review the loan application for foreign ownership information.'
      - 'Eligibility Verification: Verify that the entity is a Domestic Corporation (C and S Corp), a
        single purpose Limited Liability Company (LLC) excluding series LLC, Limited Liability Partnership
        (LLP), Limited Liability Limited Partnership (LLLP), General Partnership (GP), Limited Partnership
        (LP), or Sole Proprietorship. Verify that it is US formed and based and is not a foreign owned
        entity. Verify that it is not a Cooperative, Irrevocable Trust, Land Trust, IRA, Non-Profit, or
        Joint Venture.'
      - 'Validation and Verification: Compare the entity''s stated legal form and jurisdiction information
        across the reviewed documents; resolve discrepancies using supporting entity documents.'
      - 'Final Determination: Record whether the entity satisfies the permitted-form and US-formed-and-based
        requirements.'
      checks:
      - The entity is one of the stated allowed entity types and is not a series LLC.
      - The entity is US formed and based and is not a foreign entity or foreign owned entity.
      - The entity is not a Cooperative, Irrevocable Trust, Land Trust, IRA, Non-Profit, or Joint Venture.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The entity satisfies every stated entity-type and jurisdiction requirement.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The entity fails any stated entity-type or jurisdiction requirement.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity borrower.
        carries_conditions: false
      evidence_types:
      - entity_documents
      - loan_application
      reads:
      - Borrower.entity_type
      - Borrower.is_entity_borrower_1
      computable_checks: []
      missing_reads:
      - The entity's legal form, formation jurisdiction, business location, and ownership information
        as evidenced by the entity documents and loan application.
