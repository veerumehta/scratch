  - rule_id: acra-platinum.insurance_coverage_sufficiency_policy_assessment.rent_loss_insurance_applicability
    condition:
      kind: procedure
      purpose: 'Determine the named fact: rent loss insurance is required for the subject property.'
      steps:
      - 'Initial Document Review: Review the case information for the subject property''s number of units
        and occupancy subtype.'
      - 'Eligibility Verification: Determine whether the property is a one- to four-unit, non-owner occupied
        income property, whether its LTV is greater than 70%, and whether subject property rents are used
        to qualify.'
      - 'Validation and Verification: Apply the CLTV exemption: loans with ≤ 70% CLTV are not required
        to carry rent loss insurance. Identify the stated case of LTV at or below 70% with CLTV above
        70%.'
      - 'Final Determination: Determine whether rent loss insurance is required; for LTV at or below 70%
        with CLTV above 70%, record that Acra confirmation is requested under Q-10.'
      checks:
      - The subject property has one to four units.
      - The subject property is non-owner occupied.
      - The subject property is an income property.
      - The subject property LTV is greater than 70%.
      - Subject property rents are used to qualify.
      - The loan has ≤ 70% CLTV.
      - The subject property LTV is at or below 70% and the loan has CLTV above 70%.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is a one- to four-unit, non-owner occupied income property, its LTV is
          greater than 70%, subject property rents are used to qualify, and the CLTV exemption does not
          apply.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The subject property LTV is at or below 70% and the loan has CLTV above 70%; Acra confirmation
          is requested under Q-10.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: There is no case for this outcome.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The rent loss insurance requirement does not apply, including when the loan has ≤ 70%
          CLTV, or when the stated property, LTV, or rent-use criteria are not met.
