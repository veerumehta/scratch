  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.revocable_living_trust_title_vesting
    condition:
      kind: procedure
      purpose: Determine whether title may be vested in the proposed inter vivos revocable trust under
        the stated requirements.
      steps:
      - 'Initial Document Review: Review the title commitment and a complete, legible copy of the Trust
        or Certification of Trust. Review any written Acra Senior Management exception and supporting
        trust documents.'
      - 'Eligibility Verification: Verify that the Trust or Certification of Trust states the existence
        and date of the Trust; Trustor(s) and current Trustee(s); Trustee powers; whether the Trust is
        revocable and, if so, who holds the right to revoke; the names and number of Trustees required
        to sign; the Trust identification number (a Social Security number or an IRS-issued Tax Identification
        Number); how title to Trust assets should be taken; and that the Trust has not been revoked, modified,
        or amended in any manner. Verify that the Trust is valid under the laws of the state in which
        it is established; is revocable and may be changed or canceled at any time for any reason during
        a Trustor''s lifetime; is established by one or more natural persons solely or jointly and becomes
        effective during their lifetime; and has as its primary beneficiary the individual(s) establishing
        the Trust.'
      - 'Validation and Verification: Verify that written exception by Acra Senior Management is obtained
        if the Trustor(s) and Trustee(s) are not the same. Verify that the Trust specifies the Trustee''s
        power to hold title and mortgage the property; that the beneficiary need not grant written consent
        for the Trust to borrow money, or that such consent has been granted in writing for purposes of
        the mortgage; that there is no unusual risk or impairment to the lender''s rights; and that holding
        title in the Trust does not diminish the lender''s rights as a creditor. Review any additional
        supporting documentation required by Legal.'
      - 'Final Determination: Record whether every stated trust-title requirement is met; do not approve
        title vesting in an irrevocable trust.'
      checks:
      - A complete, legible Trust or Certification of Trust contains every stated required Trust detail.
      - The Trust is valid under the laws of the state in which it is established, is revocable as defined,
        is established by one or more natural persons and becomes effective during their lifetime, and
        has as its primary beneficiary the individual(s) establishing the Trust.
      - Written exception by Acra Senior Management is obtained if the Trustor(s) and Trustee(s) are not
        the same.
      - The Trust specifies the required Trustee powers, beneficiary consent provision, absence of unusual
        risk or impairment to lender rights, and preservation of the lender's rights as a creditor.
      - The Trust is not irrevocable.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every stated requirement for title vesting in the inter vivos revocable trust is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: A required written exception by Acra Senior Management or additional supporting documentation
          required by Legal remains outstanding and must be cleared.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A stated trust-title requirement is not met, or the Trust is irrevocable.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Title is not proposed to vest in an inter vivos revocable trust.
        carries_conditions: false
      evidence_types:
      - title_commitment
      - entity_documents
      reads:
      - Borrower.entity_type
      - Borrower.is_entity_borrower_1
      computable_checks: []
      missing_reads:
      - The Trust or Certification of Trust contents, state-law validity, Trustor and Trustee identities,
        revocability, beneficiaries, Trust powers and terms, any written Acra Senior Management exception,
        and any additional supporting documentation required by Legal.
    action: require_evidence
    priority: 100
    description: Verify that title vesting in an inter vivos revocable trust meets each stated trust,
      trustee, beneficiary, and lender-protection requirement.
    citations:
