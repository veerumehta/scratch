        verdict: violated
        criterion: A stated seasoning-verification trigger is met and seasoning of funds to close is not
          verified.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Neither stated seasoning-verification trigger is met.
        carries_conditions: false
      evidence_types:
      - bank_statement
      reads:
      - LoanCore.cltv_percent
      computable_checks: []
      missing_reads:
      - Whether the transaction is a consumer transaction
      - Whether the loan is a business purpose loan
