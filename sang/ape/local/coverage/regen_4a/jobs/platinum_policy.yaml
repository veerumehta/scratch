  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.current_due_diligence_and_background_review
    condition:
      kind: procedure
      purpose: Determine whether required due diligence and background review are current and cover the
        specified parties.
      steps:
      - 'Initial Document Review: Review the loan approval or draw date and the borrower / guarantor due-diligence
        records and background-check results in the loan file.'
      - 'Eligibility Verification: Verify that borrower / guarantor due diligence is current as of the
        date of any loan approval or draw. Identify the entity, recourse guarantor(s), and any party (individual
        or entity) that owns 20% or more of the entity directly or indirectly or has managing control.'
      - 'Validation and Verification: Review the due-diligence coverage for the identified parties. Acra
        may order background checks from Checkpoint, LexisNexis or another comparable provider, including
        criminal history, OFAC searches, litigation, judgment, and lien searches.'
      - 'Final Determination: Record whether due diligence is current and whether the background review
        covers the stated parties, as applicable.'
      checks:
      - Borrower / Guarantor Due Diligence is current as of the date of any loan approval or draw.
      - The background review covers the entity, recourse guarantor(s), and any party (individual or entity)
        that owns 20% or more of the entity directly or indirectly or has managing control.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Due diligence is current as of the applicable approval or draw date and the background
          review covers the stated parties.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Due diligence is not current as of the applicable approval or draw date, or the required
          parties are not covered by the background review.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity borrower.
        carries_conditions: false
      evidence_types:
      - entity_documents
      - loan_application
      reads:
      - Borrower.entity_type
      - Borrower.is_entity_borrower_1
      computable_checks: []
      missing_reads:
      - The approval or draw date, due-diligence date, identity of the entity and guarantors, ownership
        and managing-control information, and background-check results.
    action: require_evidence
    priority: 100
    description: Verify that borrower and guarantor due diligence is current as of approval or draw and
      that the applicable key principals and entities are reviewed.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.3 Due diligence and background checks
