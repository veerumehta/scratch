  - rule_id: acra-platinum.appraisal_review_property_eligibility.declining_market_cltv_reduction
    condition:
      kind: procedure
      purpose: Address the stated -5% CLTV reduction for a declining market and the requested Acra confirmation
        about combining it with other caps.
      steps:
      - 'Initial Document Review: Review the appraisal_report for the market assessment and the loan file
        for CLTV limits that may also apply.'
      - 'Eligibility Verification: Identify whether the property is in a declining market and note the
        stated -5% CLTV property/borrower full profile reduction.'
      - 'Validation and Verification: Request Acra confirmation of how the reduction combines with other
        caps, as directed by PLAT-1.17.'
      - 'Final Determination: Apply the reduction only with the requested confirmation on its combination
        with other caps.'
      checks:
      - For a declining-market property, the stated -5% CLTV property/borrower full profile reduction
        is addressed.
      - Acra confirmation is obtained on how the reduction combines with other caps.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is not in a declining market, or both checks hold.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property is in a declining market and the required Acra confirmation remains outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The stated reduction is not addressed or the confirmed combination with other caps
          is not applied.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.appraised_value_usd
      - LoanCore.cltv_percent
      missing_reads:
      - Whether the property is in a declining market
      - Acra confirmation on how the reduction combines with other caps
    action: require_evidence
    priority: 100
    description: Apply the stated declining-market CLTV reduction and obtain confirmation on how it combines
      with other caps.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.3 Location
