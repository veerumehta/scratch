        \ purpose=purpose, channel=channel)\n    if missing:\n        return rules_lib.unknown(*missing)\n\
        \n    if score >= 730:\n        purchase_max, rate_term_max, cash_out_max = 80, 80, 75\n    elif\
        \ score >= 721:\n        purchase_max, rate_term_max, cash_out_max = 80, 80, 65\n    else:\n \
        \       purchase_max, rate_term_max, cash_out_max = 80, 80, 55\n\n    if rules_lib.same(purpose,\
        \ 'purchase'):\n        purpose_max = purchase_max\n    elif rules_lib.same(purpose, 'rate & term'):\n\
        \        purpose_max = rate_term_max\n    elif rules_lib.same(purpose, 'cash-out'):\n        purpose_max\
        \ = cash_out_max\n    else:\n        return rules_lib.unknown('loan_purpose')\n\n    meets_matrix\
        \ = cltv <= purpose_max\n    correspondent_limit_applies = (\n        rules_lib.same(channel,\
        \ 'Correspondent Pricing') and 700 <= score <= 719\n    )\n    return meets_matrix and (not correspondent_limit_applies\
        \ or cltv <= 60)"
