          - A complete, legible copy of the Trust, or a Certification of Trust stating: the existence
          and date of the Trust; the Trustor(s) and the current Trustee(s); the powers of the Trustee;
          whether the Trust is revocable and, if revocable, who holds the right to revoke; the names and
          number of the Trustees required to sign on behalf of the Trust; the Trust identification number
          (a Social Security number or an IRS-issued Tax Identification Number); how title to the Trust
          assets should be taken; and a statement that the Trust has not been revoked, modified, or amended
          in any manner.


          - The Trust must be valid under the laws of the state in which it is established.


          - The Trust must be revocable, meaning it can be changed or canceled at any time for any reason
          during a Trustor''s lifetime. Irrevocable trust is not permitted.


          - The Trust must be established by one or more natural persons, solely or jointly (Grantor,
          Trustor, or Settlor), and must become effective during the lifetime of the person(s) establishing
          it.


          - The primary beneficiary of the Trust must be the individual(s) establishing the Trust.


          - Written exception by Acra Senior Management must be obtained if the Trustor(s) and Trustee(s)
          are not the same.


          - The Trust must specify that the Trustee has the power to hold title and mortgage the property;
          that the beneficiary does not need to grant written consent for the Trust to borrow money, or
          that such consent has been granted in writing for purposes of the mortgage; that there is no
          unusual risk or impairment to the lender''s rights; and that holding title in the Trust does
          not diminish the lender''s rights as a creditor.


