  rules:
  - rule_id: acra-platinum.appraisal_review_property_eligibility.condo_and_two_unit_cltv_limit
    condition:
      kind: procedure
      purpose: Determine whether a Warrantable Condo or Two-Units property meets the stated maximum CLTV.
      steps:
      - 'Initial Document Review: Review the appraisal_report for the property type and the loan file
        for CLTV.'
      - 'Eligibility Verification: Apply the PLAT-7.1 maximum CLTV of 75.00% to Warrantable Condo and
        Two-Units properties.'
      - 'Validation and Verification: Compare SubjectProperty.property_type and LoanCore.cltv_percent
        with the stated property-type limit.'
      - 'Final Determination: Determine whether the stated limit is met when the property is a Warrantable
        Condo or Two-Units.'
      checks:
      - If SubjectProperty.property_type is Warrantable Condo or Two-Units, LoanCore.cltv_percent is no
        greater than 75.00%.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The check holds, or the property is neither a Warrantable Condo nor Two-Units.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.property_type
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      missing_reads: []
    action: require_evidence
    priority: 100
    description: Apply the stated maximum CLTV to Warrantable Condo and Two-Units properties.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1 Property types, as printed
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: 'Appraisal Review: property eligibility'
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1 Property types, as printed
        job_kind: limit
