  - rule_id: acra-platinum.loan_program_eligibility.fico_and_cltv_matrix
    condition:
      kind: procedure
      purpose: Determine whether the loan meets the applicable printed FICO and CLTV limits.
      steps:
      - 'Initial Document Review: Review the credit report and loan application for representative score,
        loan purpose, channel, and CLTV.'
      - 'Eligibility Verification: Apply the matrix printed for loan amounts ≤ $2,000,000: at 730, Purchase
        80%, Rate & Term 80%, Cash-Out 75%; at 721, Purchase 80%, Rate & Term 80%, Cash-Out 65%; at 700,
        Purchase 80%, Rate & Term 80%, Cash-Out 55%. For Correspondent Pricing at 700-719 FICO, also apply
        the printed 60% CLTV limit; it does not raise a lower matrix limit.'
      - 'Validation and Verification: Verify the score, purpose, channel, and CLTV against the credit
        report, application, and case information. For a score of exactly 720, obtain Acra confirmation
        on its treatment rather than assigning a matrix row.'
      - 'Final Determination: Record whether the applicable limits are met or whether Acra confirmation
        is required for a score of exactly 720.'
      checks:
      - For a score covered by a printed matrix row, CLTV does not exceed the row's maximum for the loan
        purpose.
      - For Correspondent Pricing with a score of 700-719, CLTV is ≤ 60%.
      - For a score of exactly 720, Acra confirmation on its treatment has been obtained.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The applicable matrix check and, when applicable, the Correspondent check hold; if
          the score is exactly 720, Acra confirmation has been obtained and its treatment is satisfied.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The score is exactly 720 and Acra confirmation on its treatment is pending.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable CLTV limit is exceeded, or Acra's confirmed treatment of a score of exactly
          720 is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - loan_application
      - appraisal_report
      - credit_report
      reads:
      - CreditReport.representative_score
      - LoanCore.loan_purpose
      - LoanCore.channel
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      - 1
      missing_reads:
      - Acra confirmation on whether the printed 721 threshold is intended and how a score of 720 is treated.
    action: require_evidence
    priority: 100
    description: Apply the printed FICO and purpose-specific CLTV matrix, including the Correspondent
      restriction where applicable.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2.1 Matrix as printed — Loan Amount,
      FICO, CLTV Requirements
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#Loan amount ≤ \$2,000,000
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#2.2 Matrix footnotes, quoted
