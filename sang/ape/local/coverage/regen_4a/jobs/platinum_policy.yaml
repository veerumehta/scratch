        which cases it covers, or whether “Applicant” includes guarantors of an entity borrower; Acra
        confirmation is requested under Q-17.'
      - 'Step 4 - Final Determination: Record whether the applicable documentation alternative is present
        and identify any unresolved applicability question.'
      checks:
      - If the property is tenant occupied and the Applicant has had forbearance or mortgage lates within
