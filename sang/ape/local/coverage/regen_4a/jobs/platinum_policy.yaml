          heading: 5.1 Entity eligibility and guarantees
          text: 'PLAT-5.1 Business Entities are eligible for financing on business purpose transactions
            (investment properties exclusively). \[G §3.12, p. 7\]


            PLAT-5.2 Acra will lend to, and require that title to the collateral be held, either (i) directly
            by an individual person(s) or (ii) by an entity acceptable to Acra in its sole discretion.
            \[G §3.12, p. 7\]


            PLAT-5.3 Acra requires all individuals with direct or indirect ownership ≥ 20% to provide
            a recourse guarantee (Acra approved, or Exhibit 7) in the case of an entity borrower. All
            recourse is joint and several in the case of multiple guarantors. \[G §3.12, p. 7\]


            PLAT-5.4 An entity borrower must be a single purpose entity (SPE): “an entity with no assets
            other than residential investment or rental properties; engaged in the business of owning
            and operating residential investment or rental properties.” Series limited liability companies
            are not allowed. \[G §3.12, p. 7\]


            PLAT-5.5 All entities that will hold direct ownership of the subject property and will be
            on title as a direct owner are required to be a borrowing entity. \[G §3.12, p. 7\]


            PLAT-5.6 Changes to the operating agreement or bylaws with the intent of changing ownership
            percentages to circumvent required personal guarantors will not be considered. “Lookback to
            changes cannot occur within 30 days prior to an Application Date or throughout the application
            process as these changes will not be recognized by Acra Lending.” \[G §3.12, p. 7\]


