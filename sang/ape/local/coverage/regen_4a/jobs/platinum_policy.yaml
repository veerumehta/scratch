  - rule_id: acra-platinum.loan_program_eligibility.non_owner_occupied_property
    condition:
      kind: procedure
      purpose: Determine whether the property meets the program's occupancy requirement and the stated
        investment-property description.
      steps:
      - 'Initial Document Review: Review the loan application and lease agreement for occupancy and lease
        information.'
      - 'Eligibility Verification: Verify that the property is Non-Owner Occupied and, when applying the
        stated investment-property description, is leased and occupied as a principal year-round residence
        by individuals other than the owner.'
      - 'Validation and Verification: Compare the occupancy information in the documents with the case
        information; resolve any discrepancy before determining eligibility.'
      - 'Final Determination: Record whether the non-owner-occupied requirement is met.'
      checks:
      - The property is Non-Owner Occupied.
      - The dwelling is leased and occupied as a principal year-round residence to individuals other than
        the owner.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Both checks hold.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Either check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - loan_application
      - lease_agreement
      reads:
      - SubjectProperty.occupancy_subtype
      - SubjectProperty.has_current_lease
      computable_checks: []
      missing_reads:
      - Evidence that the dwelling is occupied as a principal year-round residence by individuals other
        than the owner.
