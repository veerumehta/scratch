  - rule_id: acra-platinum.credit_review_analysis_credit.mortgage_and_rental_rating_review
    condition:
      kind: procedure
      purpose: Determine the mortgage / rental rating for mortgage pricing using the required history
        scope.
      steps:
      - 'Step 1 - Initial Document Review: Review credit-report mortgage information and available documentation
        for properties the borrower owns and / or rents over the last twelve (12) months.'
      - 'Step 2 - Eligibility Verification: Identify all reported mortgages and any mortgages not reported
        on credit; identify the applicant''s primary residence(s), secondary residence(s), and subject
        property as applicable.'
      - 'Step 3 - Validation and Verification: Consider all reported mortgages. For mortgages not reported,
        verify that the file contains documentation to evaluate history on the applicant''s primary residence(s),
        any secondary residence(s), and the subject property.'
      - 'Step 4 - Final Determination: Determine the mortgage / rental rating for mortgage pricing by
        evaluating the applicable ratings for properties the borrower owns and / or rents over the last
        twelve (12) months.'
      checks:
      - All reported mortgages on credit are considered in evaluating the mortgage / rental rating.
      - For any mortgage not reported on credit, the file contains documentation to evaluate history on
        the applicant's primary residence(s), any secondary residence(s), and the subject property.
      - The mortgage / rental rating for mortgage pricing is determined by evaluating ratings for properties
        the borrower owns and / or rents over the last twelve (12) months.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: All applicable reported mortgages are considered, required documentation for unreported
          mortgages is in the file, and the rating is determined using the stated twelve (12)-month property
          scope.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable reported mortgage is not considered, required documentation for an unreported
          mortgage is absent, or the rating is not determined using the stated twelve (12)-month property
          scope.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - credit_report
      - lease_agreement
      - rent_roll
      - bank_statement
      reads:
      - SubjectProperty.has_current_lease
      - SubjectProperty.ownership_months
      computable_checks: []
      missing_reads:
      - Property-by-property ownership or rental status and ratings for the last twelve (12) months; any
        mortgage history not reported on credit and documentation needed to evaluate it.
