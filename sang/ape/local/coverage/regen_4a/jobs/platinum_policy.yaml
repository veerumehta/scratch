  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_prepayment_penalty.python
    condition:
      kind: python
      source: "import re\nimport rules_lib\n\ndef check(ctx):\n    penalty = ctx['LoanCore.prepayment_penalty_structure']\n\
        \    state = ctx['SubjectProperty.state']\n\n    if rules_lib.same(state, 'does not allow prepayment\
        \ penalties'):\n        return True\n\n    years = None\n    if rules_lib.known(penalty) and isinstance(penalty,\
        \ str):\n        match = re.search(r'(?<!\\d)(\\d+(?:\\.\\d+)?)\\s*(?:years?|yrs?)\\b', penalty,\
        \ re.IGNORECASE)\n        if match:\n            years = float(match.group(1))\n\n    if years\
        \ is not None and years >= 3:\n        return True\n    if years is not None and rules_lib.same(state,\
        \ 'allows prepayment penalties'):\n        return False\n\n    missing = rules_lib.gaps(prepayment_penalty_structure=penalty,\
        \ state=state)\n    if missing:\n        return rules_lib.unknown(*missing)\n    return rules_lib.unknown('state-law\
        \ exception or prepayment-penalty term')"
      entrypoint: check
      reads:
      - LoanCore.prepayment_penalty_structure
      - SubjectProperty.state
      derived_from: acra-platinum.appraisal_review_property_eligibility.listed_property_prepayment_penalty
      cases:
      - context:
          LoanCore.prepayment_penalty_structure: 3 years
          SubjectProperty.state: unspecified
        expected: satisfied
      - context:
          LoanCore.prepayment_penalty_structure: 2 years
          SubjectProperty.state: allows prepayment penalties
        expected: violated
      - context:
          LoanCore.prepayment_penalty_structure: 2 years
          SubjectProperty.state: does not allow prepayment penalties
        expected: satisfied
      lib_version: 1.1.0
    action: require_evidence
