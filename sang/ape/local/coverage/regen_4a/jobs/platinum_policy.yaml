  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_for_sale_determination
    condition:
      kind: procedure
      purpose: Determine whether the property has been listed for sale in the last six months, measured
        from the last date of being listed to the Application Date.
      steps:
      - 'Initial Document Review: Review the listing_history for the last date the property was listed
        and the Application Date.'
      - 'Eligibility Verification: Apply the six-month measurement stated in PLAT-7.6.'
      - 'Validation and Verification: Verify the listing dates against SubjectProperty.listed_for_sale_last_6_months.'
      - 'Final Determination: Determine whether the property meets the stated listed-for-sale test; if
        it does, review the separate listed-property requirements.'
      checks:
      - The last date of being listed is within the last six months measured to the Application Date.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property meets the stated six-month listed-for-sale test.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The listing dates do not establish that the property meets the stated six-month listed-for-sale
          test.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property was not listed for sale in the last six months.
        carries_conditions: false
      evidence_types:
      - listing_history
      reads:
      - SubjectProperty.listed_for_sale_last_6_months
      missing_reads:
      - Last date of being listed
      - Application Date
    action: require_evidence
    priority: 100
    description: Determine whether the property meets the stated six-month listed-for-sale test.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.3 Properties listed for sale (§11.5)
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: 'Appraisal Review: property eligibility'
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.3 Properties listed for sale
            (§11.5)
        job_kind: determination
      ledger:
        clause: 'PLAT-7.6 A property is considered listed for sale under §11.5 if it has been listed for
          sale in the last six months, measured from (a) the last date of being listed to (b) the Application
          Date. \[G §11.5, p. 12\]


          PLAT-7.7 Whether §11.5 applies to Platinum Select unchanged is part of Q-13; it is restated
          here because the Platinum Summary does not exclude it. \[G §11.5\]


          PLAT-7.8 Loans on such properties will be considered under the following characteristics: the
          property is not in default or otherwise delinquent on lien(s); for investment properties, the
          subject must be occupied by a tenant and may not be vacant; the loan must qualify as either
          (a) ≥ 1.0 DSCR or (b) 43% maximum DTI — on this program the channel minimum DSCR applies, Wholesale
          1.0 and Correspondent 1.2 (PLAT-3.8), and the DTI alternative is Q-14; a prepayment penalty
          of at least three (3) years is required unless the property is in a state that does not allow
          prepayment penalties; twenty-four (24) months of reserves are required, and cash-in-hand may
          be considered if otherwise consistent with the Guide; the loan must have a fully amortizing
          term, interest only is not available; the maximum LTV / CLTV is 65% based on the lesser of (a)
          appraised value or (b) lowest recent listing price; no subordinate financing is allowed; impounds
          are required. \[G §11.5, pp. 11–12\]'
        clause_parts:
        - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.3 Properties listed
            for sale (§11.5)
          heading: ''
          text: 'PLAT-7.6 A property is considered listed for sale under §11.5 if it has been listed for
            sale in the last six months, measured from (a) the last date of being listed to (b) the Application
            Date. \[G §11.5, p. 12\]


            PLAT-7.7 Whether §11.5 applies to Platinum Select unchanged is part of Q-13; it is restated
            here because the Platinum Summary does not exclude it. \[G §11.5\]


            PLAT-7.8 Loans on such properties will be considered under the following characteristics:
            the property is not in default or otherwise delinquent on lien(s); for investment properties,
            the subject must be occupied by a tenant and may not be vacant; the loan must qualify as either
            (a) ≥ 1.0 DSCR or (b) 43% maximum DTI — on this program the channel minimum DSCR applies,
            Wholesale 1.0 and Correspondent 1.2 (PLAT-3.8), and the DTI alternative is Q-14; a prepayment
            penalty of at least three (3) years is required unless the property is in a state that does
            not allow prepayment penalties; twenty-four (24) months of reserves are required, and cash-in-hand
            may be considered if otherwise consistent with the Guide; the loan must have a fully amortizing
            term, interest only is not available; the maximum LTV / CLTV is 65% based on the lesser of
            (a) appraised value or (b) lowest recent listing price; no subordinate financing is allowed;
            impounds are required. \[G §11.5, pp. 11–12\]'
