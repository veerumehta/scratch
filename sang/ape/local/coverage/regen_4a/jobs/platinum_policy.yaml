  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_qualification
    condition:
      kind: procedure
      purpose: Determine whether the loan qualifies as either ≥ 1.0 DSCR or 43% maximum DTI, taking account
        of the stated channel minimum DSCR and the unresolved DTI alternative question.
      steps:
      - 'Initial Document Review: Review the loan qualification evidence and the applicable channel information.'
      - 'Eligibility Verification: Apply the stated alternative of ≥ 1.0 DSCR or 43% maximum DTI; the
        source states that the channel minimum DSCR applies, Wholesale 1.0 and Correspondent 1.2, and
        identifies the DTI alternative as Q-14.'
      - 'Validation and Verification: Verify LoanCore.channel and LoanCore.dscr_qualification_method and
        review the data supporting the applicable qualification method.'
      - 'Final Determination: Determine whether the listed-property qualification requirement is met,
        without resolving the DTI alternative beyond the source text.'
      checks:
      - The loan qualifies as either ≥ 1.0 DSCR, subject to the stated channel minimum DSCR (Wholesale
        1.0 and Correspondent 1.2), or 43% maximum DTI, subject to the unresolved Q-14 DTI alternative.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The listed-property qualification requirement is established under the applicable stated
          alternative.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The loan relies on the DTI alternative and the Q-14 issue remains unresolved, or required
          qualification data is outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The applicable qualification data establishes that neither stated alternative is met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property is not listed for sale under the Listed-for-Sale Determination.
        carries_conditions: false
      evidence_types:
      - loan_application
      - appraisal_report
      - lease_agreement
      - rent_roll
      reads:
      - LoanCore.channel
      - LoanCore.dscr_qualification_method
      - RatioSet.total_monthly_income_usd
      - RatioSet.total_monthly_obligation_usd
      missing_reads:
      - DSCR value
      - DTI value
      - Resolution of Q-14 on the DTI alternative
