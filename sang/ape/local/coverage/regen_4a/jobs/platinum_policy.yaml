  - rule_id: acra-platinum.loan_program_eligibility.listed_for_sale_prepayment_minimum
    condition:
      kind: procedure
      purpose: Determine whether the listed-for-sale minimum penalty term is met, subject to the stated
        unresolved state-restriction interaction.
      steps:
      - 'Initial Document Review: Review listing history, loan application, and property-state information.'
      - 'Eligibility Verification: If the property was listed for sale within six months, check for a
        prepayment penalty of at least three (3) years unless the property is in a state that does not
        allow prepayment penalties.'
      - 'Validation and Verification: Verify the listing period, penalty term, and applicable state restriction.
        Obtain Acra confirmation on how a state restriction interacts with the three-year minimum.'
      - 'Final Determination: Record whether the requirement is met or Acra confirmation remains pending.'
      checks:
      - If the property was listed for sale within six months, the prepayment penalty is at least three
        (3) years unless the property is in a state that does not allow prepayment penalties.
      - Where a state restriction applies, its interaction with the three-year minimum has been confirmed
        by Acra.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property was not listed for sale within six months, or the applicable requirement
          is met and any applicable state-restriction interaction has been confirmed by Acra.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property was listed for sale within six months and Acra confirmation on an applicable
          state-restriction interaction is pending.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property was listed for sale within six months and the applicable minimum penalty
          term is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property was not listed for sale within six months.
        carries_conditions: false
      evidence_types:
      - loan_application
      - listing_history
      reads:
      - SubjectProperty.listed_for_sale_last_6_months
      - SubjectProperty.state
      - LoanCore.prepayment_penalty_structure
      computable_checks: []
      missing_reads:
      - Whether the property was listed for sale within six months, if not established by the case field;
        whether the state does not allow prepayment penalties; Acra confirmation on how a state restriction
        interacts with the three-year minimum.
