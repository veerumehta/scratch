  - rule_id: acra-platinum.credit_review_analysis_credit.dscr_housing_history_documentation_scope
    condition:
      kind: procedure
      purpose: Determine whether required DSCR housing history is documented for the specified properties.
      steps:
      - 'Step 1 - Initial Document Review: Review available credit reports and housing-history documentation
        for the borrower and / or guarantor(s).'
      - 'Step 2 - Eligibility Verification: Identify the subject property, primary residence, second homes
        if applicable, additional properties, and any documents suggesting a major credit event on an
        additional property.'
      - 'Step 3 - Validation and Verification: Verify payment history documentation for the primary residence,
        subject property, and second homes, if applicable. Do not require housing history for additional
        properties unless documents in the file suggest a major credit event has occurred.'
      - 'Step 4 - Final Determination: Record whether the required DSCR housing history is documented
        for the properties within the stated scope.'
      checks:
      - Payment history is documented for the primary residence, subject property, and second homes, if
        applicable.
      - Housing history for an additional property is required only when documents in the file suggest
        a major credit event has occurred; where that trigger applies, the history is documented.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Required payment history is documented for the primary residence, subject property,
          and second homes if applicable, and any additional-property history required by the stated major-credit-event
          trigger is documented.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Required payment history is not documented, or additional-property history is missing
          where documents suggest a major credit event has occurred.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - credit_report
      - lease_agreement
      - rent_roll
      - bank_statement
      reads:
      - LoanCore.dscr_qualification_method
      - SubjectProperty.has_current_lease
      - SubjectProperty.is_vacant
      computable_checks: []
      missing_reads:
      - Property-by-property identification of the borrower and / or guarantor(s)' primary residence,
        subject property, second homes, and additional properties; payment history documentation; any
        documents indicating a major credit event.
    action: require_evidence
    priority: 100
    description: Verify DSCR housing-history documentation for the subject property, principal residence,
      and second home if any, and apply the stated exception for additional properties.
    citations:
