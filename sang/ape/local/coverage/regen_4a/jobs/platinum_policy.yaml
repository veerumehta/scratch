  - rule_id: acra-platinum.appraisal_review_property_eligibility.eligible_property_location
    condition:
      kind: procedure
      purpose: Determine whether the property is in South Dakota (SD) or a U.S. Territory (U.S. Terrs.),
        which the summary lists as ineligible locations for non-owner-occupied properties.
      steps:
      - 'Initial Document Review: Review the appraisal_report for the subject property location and occupancy.'
      - 'Eligibility Verification: Check the location against the locations listed in PLAT-7.4 for non-owner-occupied
        properties.'
      - 'Validation and Verification: Verify SubjectProperty.state and SubjectProperty.occupancy_subtype.'
      - 'Final Determination: Determine whether the stated location exclusion applies.'
      checks:
      - If SubjectProperty.occupancy_subtype is non-owner-occupied, SubjectProperty.state is not SD or
        a U.S. Territory.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.state
      - SubjectProperty.occupancy_subtype
      computable_checks:
      - 0
      missing_reads: []
    action: require_evidence
    priority: 100
    description: Determine whether the property is in a location listed as ineligible for non-owner-occupied
