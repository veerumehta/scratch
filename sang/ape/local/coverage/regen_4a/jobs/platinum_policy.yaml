  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.required_entity_documentation
    condition:
      kind: procedure
      purpose: Determine whether the required entity documentation is provided and meets the stated requirements.
      steps:
      - 'Initial Document Review: Obtain and review the complete, legible Certificate of Formation / Articles
        of Organization and all amendments; the applicable complete Operating Agreement with all referenced
        exhibits or Bylaws and all amendments; ownership-interest evidence; and any applicable stock certificates,
        stock ledger, Affidavit of Lost Stock Certificate, K-1 statements, and CPA or Tax Preparer letter.
        Also review the Certificate of Good Standing or equivalent, any required Certificate of Foreign
        Qualification or other qualification, IRS Form SS4 or TIN or EIN issuance letter, and the Unanimous
        Written Consent / Board Resolution.'
      - 'Eligibility Verification: Verify that the Operating Agreement or Bylaws states whether the entity
        is member or manager managed, contains authorization to borrow money and enter into contracts
        for mortgage assets, and designates signers. Verify that ownership interests are evidenced as
        required: LLCs and Partnerships identify all persons by name with their ownership interest or
        provide membership interest certificates / units in compliance with the Operating Agreement; S
        or C Corporations provide compliant shareholder / stockholder certificates or, if unavailable,
        a stock ledger accounting for all outstanding shares noted in the formation documents, including
        those held by the corporation. If stock certificates are lost, destroyed, mutilated, or otherwise
        unavailable, verify an Affidavit of Lost Stock Certificate. For S-corporations or Partnerships
        where both stock certificate and stock ledger are unavailable, verify the most recent preceding
        tax year''s K-1 statement for all members with 20% or more interest and a letter from the CPA
        or Tax Preparer affirming current ownership interest, with a statement to that effect if the preceding
        year''s taxes have not been filed.'
      - 'Validation and Verification: Verify that entity-document names match the identification, or that
        a letter of explanation addresses any discrepancy; that the Certificate of Good Standing or equivalent
        is valid within ninety (90) days of the closing date; and that a Certificate of Foreign Qualification
        or other qualification to operate in the state where business is being conducted is provided if
        the entity is formed in a state other than where business is performed or where the property is
        located. Verify that the Unanimous Written Consent / Board Resolution is signed by all members
        regardless of their percentage of interest, authorizes the transaction with Acra Lending, and
        identifies who is authorized to sign the loan documents on behalf of and to bind the entity. Verify
        that it is not used to designate a signor on a personal guarantee. Review any required Power of
        Attorney for execution of a personal guarantee by an attorney in fact. Do not accept borrower
        letters stating that required documents are not required, available, or excused from providing
        them. Additional information may be required if formation documents and the Operating Agreement
        or Bylaws conflict.'
      - 'Final Determination: Record whether each applicable required document and requirement is satisfied.
        Refer any EIN exception request for review by Acra''s Legal Department with a letter of explanation
        stating the applicable grounds; note that Legal reserves the right to condition for additional
        supporting documentation as determined in its sole discretion.'
      checks:
      - The required Certificate of Formation / Articles of Organization and all amendments are complete
        and legible.
      - The applicable Operating Agreement or Bylaws, including all referenced exhibits and amendments,
        is complete and legible and contains the required management, borrowing, contract, and signer
        provisions.
      - The required ownership-interest evidence is provided and complies with the applicable entity-type
        requirements.
      - The entity-document names match the identification, or a letter of explanation addresses any discrepancy.
      - A Certificate of Good Standing or equivalent is valid within ninety (90) days of the closing date.
      - If the entity is formed in a state other than where business is performed or where the property
        is located, a Certificate of Foreign Qualification or other qualification to operate in the state
        where business is being conducted is provided.
      - The IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or Employer Identification Number
        (EIN) issuance letter is provided, or an EIN exception request is submitted for review by Acra's
        Legal Department with a letter of explanation stating the applicable grounds.
      - A Unanimous Written Consent / Board Resolution signed by all members regardless of their percentage
        of interest authorizes the transaction with Acra Lending and identifies who is authorized to sign
        and bind the entity for the loan documents; it is not used to designate a signor on a personal
        guarantee.
      - A Power of Attorney is utilized by the principal to designate an attorney in fact to execute a
        personal guarantee when applicable.
      - Borrower letters stating that required documents are not required, available, or excused from
        providing them are not accepted.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable required entity-document requirement is satisfied.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Acra's Legal Department conditions for additional supporting documentation, or an applicable
          required document or review remains outstanding subject to a condition that must be cleared.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable required entity-document requirement is not met, or a required document
          is excused by a borrower letter.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity borrower.
        carries_conditions: false
      evidence_types:
      - entity_documents
      - loan_application
      reads:
      - Borrower.entity_type
      - Borrower.is_entity_borrower_1
      - Borrower.entity_documents_complete
      computable_checks: []
      missing_reads:
      - The applicable entity type; the complete entity formation and governance documents and amendments;
        ownership records; identification; closing date; formation and business locations; tax-identification
        documentation; member signatures and resolutions; any guarantee power of attorney; and any EIN
        exception request.
