  - rule_id: acra-platinum.appraisal_review_property_eligibility.property_type_eligibility
    condition:
      kind: procedure
      purpose: Determine whether the property is one of the expressly eligible types and is not an expressly
        ineligible type.
      steps:
      - 'Initial Document Review: Review the appraisal_report for the reported property type and any indication
        that the property is rural or a short-term rental.'
      - 'Eligibility Verification: Compare the reported property type with the expressly eligible and
        expressly ineligible types in PLAT-7.1 and PLAT-7.2.'
      - 'Validation and Verification: Verify the property type against SubjectProperty.property_type and
        verify rural status against SubjectProperty.is_rural.'
      - 'Final Determination: Determine whether the property type is expressly eligible and no express
        ineligibility applies. Do not resolve property types the source says are not addressed.'
      checks:
      - SubjectProperty.property_type is SFR, Townhome, PUD, Warrantable Condo, or Two-Units.
      - SubjectProperty.is_rural is false.
      - SubjectProperty.property_type is not Condotel, Non-Warrantable Condo, or Short-Term Rental.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.property_type
      - SubjectProperty.is_rural
      computable_checks:
      - 0
      - 1
      - 2
      missing_reads: []
