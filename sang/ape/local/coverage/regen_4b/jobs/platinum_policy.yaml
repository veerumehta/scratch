      that it is leased and occupied as a principal year-round residence by individuals
      other than the owner.'
    - 'Validation and Verification: Confirm the occupancy information against the
      case record and the lease or rent documentation.'
    - 'Final Determination: Record whether the property meets the occupancy requirements.'
    checks:
    - The property is non-owner occupied.
    - The dwelling is leased and occupied as a principal year-round residence by individuals
      other than the owner.
    - The property is not vacant.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every occupancy check holds.
      carries_conditions: false
