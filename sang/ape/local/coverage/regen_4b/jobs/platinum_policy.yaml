rules:
- rule_id: acra-platinum.appraisal_review_property_eligibility.declining_market_cltv_reduction
  condition:
    kind: procedure
    purpose: Address the stated -5% CLTV reduction for a declining market and the
      requested Acra confirmation about combining it with other caps.
    steps:
    - 'Initial Document Review: Review the property and borrower full profile for
      declining-market information.'
    - 'Eligibility Verification: Determine whether the -5% CLTV reduction applies.'
    - 'Validation and Verification: Obtain Acra confirmation on how the reduction
      combines with other caps.'
    - 'Final Determination: Record the applicable reduction and the confirmed treatment
      of other caps.'
    checks:
    - If the property is in a declining market, the -5% CLTV reduction is applied
      using Acra's confirmed treatment of how it combines with other caps.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not in a declining market, or the -5% CLTV reduction
        is applied using Acra's confirmed treatment of how it combines with other
        caps.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Applicability of the -5% CLTV reduction or Acra's confirmation on
        how it combines with other caps remains unresolved.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is in a declining market and the -5% CLTV reduction
        is not applied using Acra's confirmed treatment of how it combines with other
        caps.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    reads:
    - LoanCore.cltv_percent
    - SubjectProperty.appraised_value_usd
    missing_reads:
    - Whether the subject property is in a declining market
    - Acra confirmation on how the -5% CLTV reduction combines with other caps
  action: require_evidence
  priority: 100
  description: Apply the stated declining-market CLTV reduction and obtain clarification
    on how it combines with other caps.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.3 Location
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1 Property types,
    as printed
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: 'Appraisal Review: property eligibility'
      assistant:
      - Underwriter
      check_units:
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.3 Location
        - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1 Property
          types, as printed
      job_kind: condition
    ledger:
      clause: 'PLAT-1.16 Under the heading “Ineligible State: Non-Owner Occupied”
        the Summary lists “SD, U.S. Terrs.” \[P: Subject Property Location Requirements\]


        PLAT-1.17 Declining market: “-5% CLTV property/borrower full profile”. How
        this reduction combines with other caps: Acra confirmation requested → Q-08.
        \[P: Subject Property Location Requirements\]


        PLAT-7.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo, Two-Units.
        “Two-Units, Warrantable Condo, Max CLTV: 75.00%”. \[P: Subject Property Requirements\]


        PLAT-7.2 “Rural Properties, Condotels, Non-Warrantable Condos ineligible”;
        “Short-Term Rentals (STR) ineligible”. \[P: Subject Property Requirements\]


        | **Feature** | **Status in the Platinum Summary** | **Where stated** |

        |----|----|----|

        | SFR, Townhome, PUD | Expressly eligible | PLAT-7.1 |

        | Warrantable Condo | Expressly eligible; maximum CLTV 75.00% | PLAT-7.1 |

        | Two-Units | Expressly eligible; maximum CLTV 75.00% | PLAT-7.1 |

        | Rural Properties | Expressly ineligible | PLAT-7.2 |

        | Condotels | Expressly ineligible | PLAT-7.2 |

        | Non-Warrantable Condos | Expressly ineligible | PLAT-7.2 |

        | Short-Term Rentals | Expressly ineligible | PLAT-7.2 |

        | Three- and four-unit properties | Not addressed — Q-07 | — |

        | Manufactured homes | Not addressed — Q-07 | — |

        | Mixed use; Adult Care / Assisted Living (§10.7) | Not addressed — Q-07 |
        — |

        | PUDtel | Not addressed — Q-07 | — |


        PLAT-7.3 Declining market: “-5% CLTV property/borrower full profile” (PLAT-1.17).
        \[P: Subject Property Location Requirements\]


        PLAT-7.4 Ineligible locations: SD, U.S. Terrs. (PLAT-1.16). \[P: Subject Property
        Location Requirements\]'
      clause_parts:
      - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.3
          Location
        heading: ''
        text: 'PLAT-1.16 Under the heading “Ineligible State: Non-Owner Occupied”
          the Summary lists “SD, U.S. Terrs.” \[P: Subject Property Location Requirements\]


          PLAT-1.17 Declining market: “-5% CLTV property/borrower full profile”. How
          this reduction combines with other caps: Acra confirmation requested → Q-08.
          \[P: Subject Property Location Requirements\]'
      - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1
          Property types, as printed
        heading: ''
        text: 'PLAT-7.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo,
          Two-Units. “Two-Units, Warrantable Condo, Max CLTV: 75.00%”. \[P: Subject
          Property Requirements\]


          PLAT-7.2 “Rural Properties, Condotels, Non-Warrantable Condos ineligible”;
          “Short-Term Rentals (STR) ineligible”. \[P: Subject Property Requirements\]


          | **Feature** | **Status in the Platinum Summary** | **Where stated** |

          |----|----|----|

          | SFR, Townhome, PUD | Expressly eligible | PLAT-7.1 |

          | Warrantable Condo | Expressly eligible; maximum CLTV 75.00% | PLAT-7.1
          |

          | Two-Units | Expressly eligible; maximum CLTV 75.00% | PLAT-7.1 |

          | Rural Properties | Expressly ineligible | PLAT-7.2 |

          | Condotels | Expressly ineligible | PLAT-7.2 |

          | Non-Warrantable Condos | Expressly ineligible | PLAT-7.2 |

          | Short-Term Rentals | Expressly ineligible | PLAT-7.2 |

          | Three- and four-unit properties | Not addressed — Q-07 | — |

          | Manufactured homes | Not addressed — Q-07 | — |

          | Mixed use; Adult Care / Assisted Living (§10.7) | Not addressed — Q-07
          | — |

          | PUDtel | Not addressed — Q-07 | — |


          PLAT-7.3 Declining market: “-5% CLTV property/borrower full profile” (PLAT-1.17).
          \[P: Subject Property Location Requirements\]


          PLAT-7.4 Ineligible locations: SD, U.S. Terrs. (PLAT-1.16). \[P: Subject
          Property Location Requirements\]'
  approval_refs: []
- rule_id: acra-platinum.appraisal_review_property_eligibility.expressly_eligible_property_type
  condition:
    kind: procedure
    purpose: 'Determine whether the property type is expressly eligible: SFR, Townhome,
      PUD, Warrantable Condo, or Two-Units.'
    steps:
    - 'Initial Document Review: Review the subject property type recorded for the
      case.'
    - 'Eligibility Verification: Compare the property type with SFR, Townhome, PUD,
      Warrantable Condo, and Two-Units.'
    - 'Validation and Verification: Confirm the case property type used for the comparison.'
    - 'Final Determination: Record whether the property type is expressly eligible;
      do not treat types identified as not addressed as expressly eligible.'
    checks:
    - SubjectProperty.property_type is SFR, Townhome, PUD, Warrantable Condo, or Two-Units.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property type is one of the expressly eligible types.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: 'The property type is one of the types identified as not addressed:
        three- and four-unit properties, manufactured homes, mixed use, Adult Care
        / Assisted Living (§10.7), or PUDtel; the source does not establish eligibility
        for these types.'
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property type is not one of the expressly eligible types and
        is not identified as a type not addressed.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads:
    - SubjectProperty.property_type
    computable_checks:
    - 0
    missing_reads: []
  action: require_evidence
  priority: 100
  description: Classify the subject property against the property types expressly
    eligible in the guidelines.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1 Property types,
    as printed
