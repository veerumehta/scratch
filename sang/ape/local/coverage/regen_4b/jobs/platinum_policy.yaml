- rule_id: acra-platinum.loan_program_eligibility.eligible_product_and_interest_only_restrictions
  condition:
    kind: procedure
    purpose: Determine whether the product and any interest-only feature meet the
      stated program requirements.
    steps:
    - 'Initial Document Review: Review the loan application for product type, ARM
      terms, and interest-only terms.'
    - 'Eligibility Verification: Verify that the product is 30 Yr Fixed, 5 Yr ARM,
      30 Yr Fixed Interest-Only, or 5 Yr ARM Interest-Only. For an ARM, verify Index
      1 Yr CMT, Caps 2/2/6, and the stated margin by FICO. For interest-only, verify
      the 5 Yr Term and the maximum CLTV of 75.00%.'
    - 'Validation and Verification: Confirm the product and terms against the loan
      application and case record; verify that interest-only is not used on a property
      listed for sale.'
    - 'Final Determination: Record whether the product and applicable restrictions
      are met.'
    checks:
    - The product is 30 Yr Fixed, 5 Yr ARM, 30 Yr Fixed Interest-Only, or 5 Yr ARM
      Interest-Only.
    - If the product is an ARM, its index is 1 Yr CMT and its caps are 2/2/6.
    - If the product is an ARM, its margin is 3.00 for FICO 760+, 3.25 for FICO 720-759,
      or 3.50 for FICO 700-719.
    - If the loan is interest-only, it has a 5 Yr Term and CLTV is no more than 75.00%.
    - If the loan is interest-only, the property is not listed for sale.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable product and interest-only check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable product or interest-only check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - loan_application
    reads:
    - CreditReport.representative_score
    - LoanCore.cltv_percent
    - MortgageLoanInformation.is_interest_only
    - SubjectProperty.is_listed_for_sale
    computable_checks:
    - 3
    - 4
    missing_reads:
    - Product type, ARM index, ARM caps, ARM margin, and interest-only term, if not
      established in the case record.
    - Acra confirmation regarding whether a minimum loan amount or minimum FICO applies
      to interest-only loans.
  action: require_evidence
  priority: 100
  description: Verify that the product is listed as eligible and that interest-only
    restrictions are met.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.1 Eligible products
    and ARM terms
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.2 Interest-only
