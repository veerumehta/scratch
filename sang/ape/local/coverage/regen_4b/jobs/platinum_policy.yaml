      covers the applicable Key Principals and Entities. Acra may order background
      checks from Checkpoint, LexisNexis or another comparable provider, including
      criminal history, OFAC searches, litigation, judgment, and lien searches.'
    - 'Final Determination: Record whether the due diligence is current and the required
      review subjects are identified.'
