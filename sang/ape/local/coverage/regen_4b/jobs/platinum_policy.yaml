- rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_qualification
  condition:
    kind: procedure
    purpose: Determine whether a listed-for-sale loan qualifies as either ≥ 1.0 DSCR
      or 43% maximum DTI, applying the stated channel minimum DSCR and identifying
      the DTI alternative as Q-14.
    steps:
    - 'Initial Document Review: For a property considered listed for sale, review
      the qualification method and available DSCR or DTI data.'
    - 'Eligibility Verification: Check the applicable channel minimum DSCR: Wholesale
      1.0 and Correspondent 1.2; the stated alternative is 43% maximum DTI.'
    - 'Validation and Verification: Verify qualification data and obtain resolution
      of Q-14 before relying on the DTI alternative.'
    - 'Final Determination: Record whether the loan qualifies through an applicable,
      verified alternative.'
    checks:
    - The loan qualifies as either ≥ 1.0 DSCR, subject to the applicable channel minimum
      DSCR of Wholesale 1.0 or Correspondent 1.2, or 43% maximum DTI under a resolved
      DTI alternative.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The loan meets the applicable DSCR qualification, or it meets the
        43% maximum DTI alternative after Q-14 is resolved.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The loan's qualification is unresolved because the DTI alternative
        is identified as Q-14, or required DSCR or DTI data is unavailable.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The loan does not meet an applicable, resolved qualification alternative.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not considered listed for sale under §11.5.
      carries_conditions: false
    evidence_types:
    - loan_application
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - LoanCore.channel
    - LoanCore.dscr_qualification_method
    missing_reads:
    - The loan's DSCR
    - The loan's DTI
    - Resolution of Q-14 on the DTI alternative
