      \        property_type=property_type,\n        interest_only=interest_only,\n\
      \        listed=listed,\n        fico=fico,\n        purpose=purpose,\n    )\n\
      \    if missing:\n        return rules_lib.unknown(*missing)\n\n    caps = []\n\
      \    if amount < 350000 or amount > 1500000:\n        caps.append(75.00)\n \
