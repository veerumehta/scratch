          PLAT-1.12 Only the subject property, principal residence and second homes
          are required to be listed on the application or Schedule of Real Estate
          Owned. \[G §5.32, p. 3; §4.15, p. 5\]'
      - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.3
          Minimum ratio
        heading: ''
        text: 'PLAT-3.7 Minimum Debt Service Coverage Ratio: Correspondent ≥ 1.2;
          Wholesale ≥ 1.0. \[P: Minimum DSCR\]


          PLAT-3.8 Property listed for sale within six months (§11.5): the excerpt
