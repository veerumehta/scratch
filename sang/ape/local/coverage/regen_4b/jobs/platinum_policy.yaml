- rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.ownership_change_lookback
  condition:
    kind: procedure
    purpose: Determine whether ownership changes are recognized for required personal-guarantor
      purposes.
    steps:
    - 'Initial Document Review: Review operating agreements or bylaws, amendments,
      and available application-date information for ownership-percentage changes.'
    - 'Eligibility Verification: Identify changes intended to change ownership percentages
      to circumvent required personal guarantors.'
    - 'Validation and Verification: Verify whether such changes occurred within 30
      days prior to an Application Date or throughout the application process. Do
      not recognize those changes.'
    - 'Final Determination: Record whether ownership changes are recognized for determining
      required personal guarantors.'
    checks:
    - No operating agreement or bylaw change intended to change ownership percentages
      to circumvent required personal guarantors and made within 30 days prior to
      an Application Date or throughout the application process is recognized.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The ownership changes are handled in accordance with the stated lookback
        and application-process rule.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The requirement is met subject to conditions that must be cleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A change that must not be recognized is relied upon to circumvent
        required personal guarantors.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower or there were no relevant
        ownership changes.
      carries_conditions: false
