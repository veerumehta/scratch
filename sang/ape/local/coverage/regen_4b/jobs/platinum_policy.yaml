- rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.entity_documentation
  condition:
    kind: procedure
    purpose: Verify that the required entity documents are provided and meet the stated
      content and validity requirements.
    steps:
    - 'Initial Document Review: Obtain and review a complete, legible Certificate
      of Formation / Articles of Organization and all amendments. Review the complete
      Operating Agreement for LLCs and Partnerships, or Bylaws for corporations, with
      all referenced exhibits and amendments. Verify it states whether the entity
      is member or manager managed, contains authorization to borrow money and enter
      into contracts for mortgage assets, and designates signers. Review all documentation
      evidencing ownership interests. For S or C Corporations, review compliant shareholder
      / stockholder certificates or, if lost or unavailable, the stock ledger; if
      stock certificates are lost, destroyed, mutilated, or otherwise unavailable,
      review an Affidavit of Lost Stock Certificate. For S-corporations or Partnerships
      where both stock certificate and stock ledger are unavailable, review the most
      recent preceding tax year''s K-1 statement for all members with 20% or more
      interest and a CPA or Tax Preparer letter affirming current ownership interest,
      with a statement to that effect if the preceding year''s taxes have not been
      filed.'
    - 'Eligibility Verification: Verify that names on entity documents match the identification
      or, if they do not match exactly, that a letter of explanation addresses the
      discrepancy. Verify a Certificate of Good Standing or equivalent document is
      valid within ninety (90) days of the closing date. If the entity is formed in
      a state other than where business is being conducted or where the property is
      located, verify a Certificate of Foreign Qualification or other qualification
      to operate in the applicable state. Verify IRS Form SS4 or a Federal Taxpayer
      Identification Number (TIN) or Employer Identification Number (EIN) issuance
      letter. An EIN exception request may be submitted for review by Acra''s Legal
      Department with a letter of explanation stating the applicable grounds. Review
      a Unanimous Written Consent / Board Resolution signed by all members regardless
      of their percentage of interest, authorizing the transaction with Acra Lending
      and identifying who is authorized to sign the loan documents on behalf of and
      to bind the entity. Verify any Power of Attorney utilized to designate an attorney
      in fact to execute a personal guarantee meets the stated reference to §23.5(C).'
    - 'Validation and Verification: Do not accept a borrower letter stating that a
      required document is not required, available, or excused. Refer conflicts between
      formation documents and the Operating Agreement or Bylaws for additional information.
      Note that a Unanimous Written Consent / Board Resolution cannot be used to designate
      a signor on a personal guarantee. Address additional supporting documentation
      if Legal conditions for it in its sole discretion.'
    - 'Final Determination: Record whether the required entity documentation is complete
      and meets the stated requirements, including any additional supporting documentation
      condition.'
    checks:
    - The required entity documents are provided, complete, legible where required,
      and meet the stated content, ownership, signature, and validity requirements;
      no borrower letter is used to excuse a required document.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All required entity documentation is provided and meets the stated
        requirements, with no outstanding condition.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Required documentation or additional supporting documentation remains
        to be obtained or cleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A required document is absent or does not meet the stated requirements,
        and the deficiency is not cleared.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_documents_complete
    - Borrower.entity_type
    - Borrower.is_entity_borrower_1
