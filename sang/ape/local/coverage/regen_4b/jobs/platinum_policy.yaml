- rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.business_purpose_eligibility
  condition:
    kind: procedure
    purpose: Establish whether the business-purpose and investment-property eligibility
      requirement for business entities is met.
    steps:
    - 'Initial Document Review: Review the loan application and available property
      information for the transaction purpose and property use.'
    - 'Eligibility Verification: Determine whether the transaction is a business purpose
      transaction and the properties are investment properties exclusively.'
    - 'Validation and Verification: Resolve any discrepancy in the application or
      property information using the available loan file.'
    - 'Final Determination: Record whether the requirement is met.'
