- rule_id: acra-platinum.appraisal_review_property_eligibility.listed_for_sale_status
  condition:
    kind: procedure
    purpose: 'Apply the stated §11.5 definition: listed for sale in the last six months,
      measured from the last date listed to the Application Date.'
    steps:
    - 'Initial Document Review: Review the listing history and the case''s listed-for-sale
      status.'
    - 'Eligibility Verification: Apply the six-month period measured from the last
      date listed to the Application Date.'
    - 'Validation and Verification: Verify the listing dates against the case status.'
    - 'Final Determination: Record whether the property is considered listed for sale
      under §11.5.'
    checks:
    - SubjectProperty.listed_for_sale_last_6_months accurately indicates whether the
      property was listed for sale during the six months measured from the last date
      listed to the Application Date.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The case status accurately reflects whether the property was listed
        for sale during the stated six-month period.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The case status does not accurately reflect whether the property
        was listed for sale during the stated six-month period.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - listing_history
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    computable_checks:
    - 0
    missing_reads:
    - Last date the property was listed for sale
    - Application Date
  action: require_evidence
  priority: 100
  description: Determine whether the property was listed for sale within the stated
    six-month period.
  citations:
