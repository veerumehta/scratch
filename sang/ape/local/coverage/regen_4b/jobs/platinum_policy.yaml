- rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_prepayment_penalty
  condition:
    kind: procedure
    purpose: Determine whether a listed-for-sale loan has a prepayment penalty of
      at least three (3) years, unless the property is in a state that does not allow
      prepayment penalties.
    steps:
    - 'Initial Document Review: For a property considered listed for sale, review
      the prepayment penalty structure and the property''s state.'
    - 'Eligibility Verification: Check for a prepayment penalty of at least three
      (3) years, unless the property is in a state that does not allow prepayment
      penalties.'
    - 'Validation and Verification: Verify the penalty structure and whether the property''s
      state does not allow prepayment penalties.'
    - 'Final Determination: Record whether the stated requirement or exception applies.'
    checks:
    - The loan has a prepayment penalty of at least three (3) years, or the property
      is in a state that does not allow prepayment penalties.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The loan has a prepayment penalty of at least three (3) years, or
        the property is in a state that does not allow prepayment penalties.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
