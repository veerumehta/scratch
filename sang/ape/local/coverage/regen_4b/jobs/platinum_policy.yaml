- rule_id: acra-platinum.loan_program_eligibility.published_cltv_caps
  condition:
    kind: procedure
    purpose: Determine whether the loan meets the stated CLTV caps for the applicable
      loan amount, property type, interest-only term, or listing history.
    steps:
    - 'Initial Document Review: Review the loan application and appraisal report for
      loan amount, purpose, property type, interest-only status, and CLTV.'
    - 'Eligibility Verification: Identify applicable published caps: 75.00% for a
      loan amount < $350,000 or > $1,500,000; 75.00% for Warrantable Condo, Two-Units,
      or Interest-Only (5 Yr Term); and 65% for a property listed for sale within
      six months. For FICO 730 and above, also identify the published matrix cap by
      loan purpose.'
    - 'Validation and Verification: Confirm each applicable input against the case
      record and supporting documents, and compare the CLTV with the applicable cap.'
    - 'Final Determination: Record whether the CLTV meets every applicable cap stated
      in this job.'
    checks:
    - If the loan amount is < $350,000 or > $1,500,000, CLTV is no more than 75.00%.
    - If the property is a Warrantable Condo or Two-Units, CLTV is no more than 75.00%.
    - If the loan is Interest-Only (5 Yr Term), CLTV is no more than 75.00%.
    - If the property was listed for sale within six months, CLTV is no more than
      65%.
    - If FICO is 730 and above, CLTV is no more than 80% for Purchase, 80% for Rate
      & Term, or 75% for Cash-Out.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable check stated in this job holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable check stated in this job does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - loan_application
    - appraisal_report
    reads:
    - LoanCore.total_loan_amount_usd
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    - CreditReport.representative_score
    - SubjectProperty.property_type
    - MortgageLoanInformation.is_interest_only
    - SubjectProperty.listed_for_sale_last_6_months
    computable_checks:
    - 0
    - 1
    - 2
