- rule_id: acra-platinum.income_stability_sufficiency_analysis.cash_out_current_lease
  condition:
    kind: procedure
    purpose: Establish that the current lease requirement is met for a cash-out refinance.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan purpose and available lease
      documentation.'
    - 'Step 2 - Eligibility Verification: Determine whether the transaction is a cash-out
      refinance.'
    - 'Step 3 - Validation and Verification: For a cash-out refinance, verify that
      the provided lease is current.'
    - 'Step 4 - Final Determination: Determine whether the current lease requirement
      is met.'
    checks:
    - If the loan purpose is cash-out refinance, a current lease agreement is provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The transaction is a cash-out refinance and a current lease agreement
        is provided.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The transaction is a cash-out refinance and a current lease agreement
        is not provided.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The transaction is not a cash-out refinance.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    reads:
    - LoanCore.loan_purpose
    - SubjectProperty.has_current_lease
    computable_checks: []
    missing_reads: []
  action: require_evidence
  priority: 100
  description: For a cash-out refinance, verify that a current lease agreement is
    provided.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.4 Rent schedules
    and rent evidence
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-LEASE
      check_units:
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.4 Rent schedules
          and rent evidence
      job_kind: verification
    ledger:
      clause: 'PLAT-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA
        Form 1007) for single family properties on (i) all DSCR qualifying files,
        (ii) lease-option purchase transactions where the down payment required in
        §3.45 is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. A 1007 may be from the original appraiser
        or any state licensed appraiser. \[G §14.12, p. 4\]


        PLAT-3.10 Single family investment properties with excessive monthly rent
        payments reflected on the lease require documentation supporting that the
        monthly rent is typical for the area; acceptable documentation may include
        classified ads from local newspapers, a 1007 completed by the appraiser, or
        a market rent survey completed by a local real estate company or rental management
        company familiar with the market rents in the area. \[G §14.12, p. 4\]


        PLAT-3.11 Cash-out refinance: current lease agreement required (PLAT-1.5).
        \[P: Loan Purpose Requirements\]'
      clause_parts:
      - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.4
          Rent schedules and rent evidence
