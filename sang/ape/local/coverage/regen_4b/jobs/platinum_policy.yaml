- rule_id: acra-platinum.credit_review_analysis_credit.correspondent_cltv_at_scores_700_to_719
  condition:
    kind: procedure
    purpose: Determine whether the loan meets the Correspondent pricing CLTV limit
      applicable to decisioning scores 700-719.
    steps:
    - 'Initial Document Review: Review the credit information and loan channel and
      CLTV data.'
    - 'Eligibility Verification: Apply this limit only to Correspondent loans with
      a decisioning score from 700 through 719; the stated CLTV limit is 60%.'
    - 'Validation and Verification: Compare the loan’s CLTV with 60% when this limit
      applies.'
    - 'Final Determination: Record whether the applicable CLTV limit is met, or that
      this limit does not apply.'
    checks:
    - If the loan is Correspondent and the decisioning score is from 700 through 719,
      CLTV is no greater than 60%.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The limit applies and CLTV is no greater than 60%, or the limit does
        not apply.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The limit applies and CLTV is greater than 60%.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The loan is not Correspondent or its decisioning score is outside
        700-719.
      carries_conditions: false
    evidence_types:
    - credit_report
    - loan_application
    reads:
    - LoanCore.channel
    - LoanCore.cltv_percent
    - CreditReport.representative_score
    computable_checks:
    - 0
    missing_reads: []
  action: require_evidence
  priority: 100
  description: For Correspondent loans with a decisioning score from 700 through 719,
    verify the stated 60% CLTV limit.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.1 Decisioning
    score and tradelines
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: credit
      assistant:
      - Underwriter
      check_units:
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.1 Decisioning
          score and tradelines
      job_kind: limit
    ledger:
      clause: 'PLAT-6.1 “Decisioning Credit Score: Primary Wage Earner middle score.
        For loans that close in the name of an entity, use the highest middle score
        of the personal guarantors, presuming equal percentages of ownership. If ownership
        percentages differ, use the individual with the highest concentration of ownership.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.2 Minimum decisioning score 700 (no matrix row below 700, PLAT-2.1);
        Correspondent pricing limited to 60% CLTV for 700-719 (PLAT-2.3). \[P: matrix;
        footnote 3\]


        PLAT-6.3 “Tradelines: Applicants with scores from 3 repositories are deemed
        to be acceptable with no tradeline overlay. 2 tradelines & 24 month history
        or 3 tradelines & 12 month history for applicants with 2 or fewer scores.”
        \[P: Borrower Credit History Requirements\]


        PLAT-6.4 Applicants with one score are within “2 or fewer scores” for the
        tradeline requirement above. The Platinum Summary does not state how the decisioning
        score is set with one score or with two scores, whether any no-score pathway
        exists, or how “Primary Wage Earner” is identified on a file with no income
        documentation. The Standard Summary''s one-or-no-score provision is not restated
        here: Acra confirmation requested → Q-05. \[P: Borrower Credit History Requirements\]


        PLAT-6.5 Where two or more guarantors hold an equal largest ownership interest
        and ownership is not equal across all guarantors, PLAT-6.1 does not say whose
        score is used: Acra confirmation requested → Q-05. \[P: Borrower Credit History
        Requirements\]'
      clause_parts:
