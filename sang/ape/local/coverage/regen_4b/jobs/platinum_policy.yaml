      investment properties exclusively.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The business entity financing is for a business purpose transaction
        involving investment properties exclusively.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The requirement is met subject to conditions that must be cleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The transaction is not a business purpose transaction involving investment
        properties exclusively.
      carries_conditions: false
