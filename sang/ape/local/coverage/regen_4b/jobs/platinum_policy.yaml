- rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.revocable_living_trust_title_vesting
  condition:
    kind: procedure
    purpose: Determine whether title vesting in an inter vivos revocable trust meets
      all stated requirements.
    steps:
    - 'Initial Document Review: Review the title commitment and a complete, legible
      copy of the Trust or a Certification of Trust. Verify that the Certification
      states the existence and date of the Trust; the Trustor(s) and current Trustee(s);
      the powers of the Trustee; whether the Trust is revocable and, if revocable,
      who holds the right to revoke; the names and number of Trustees required to
      sign on behalf of the Trust; the Trust identification number (a Social Security
      number or an IRS-issued Tax Identification Number); how title to the Trust assets
      should be taken; and that the Trust has not been revoked, modified, or amended
      in any manner.'
    - 'Eligibility Verification: Verify that the Trust is valid under the laws of
      the state in which it is established; is revocable and can be changed or canceled
      at any time for any reason during a Trustor''s lifetime; is established by one
      or more natural persons, solely or jointly, and becomes effective during their
      lifetime; and has the individual(s) establishing it as its primary beneficiary.'
    - 'Validation and Verification: Verify that written exception by Acra Senior Management
      is obtained if the Trustor(s) and Trustee(s) are not the same. Verify that the
      Trust specifies the Trustee''s power to hold title and mortgage the property;
      that the beneficiary does not need to grant written consent for the Trust to
      borrow money, or that such consent has been granted in writing for purposes
      of the mortgage; that there is no unusual risk or impairment to the lender''s
      rights; and that holding title in the Trust does not diminish the lender''s
      rights as a creditor. Address additional supporting documentation if Legal conditions
      for it in its sole discretion.'
    - 'Final Determination: Record whether every stated trust-title requirement is
      met and whether any additional supporting documentation condition remains.'
    checks:
    - The inter vivos revocable Trust meets all stated documentation, validity, revocability,
      establishment, beneficiary, exception, power, consent, risk, and lender-rights
      requirements.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every stated trust-title requirement is met, with no outstanding
        condition.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The requirements are met subject to any required written exception
        or additional supporting documentation condition being obtained or cleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A stated trust-title requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Title is not vested in an inter vivos revocable trust.
      carries_conditions: false
    evidence_types:
    - title_commitment
    - entity_documents
    reads:
    - Borrower.entity_documents_complete
    computable_checks: []
    missing_reads:
    - Whether title is vested in an inter vivos revocable trust
    - Trust or Certification of Trust and its required statements
    - State-law validity
    - Trust revocability and right to revoke
    - Trustor(s), Trustee(s), and primary beneficiary
    - Trust effective date and establishment by natural person(s)
    - Written exception by Acra Senior Management, if required
    - Trustee powers, beneficiary consent provisions, lender-rights provisions, and
      any additional supporting documentation conditioned for by Legal
  action: require_evidence
  priority: 100
  description: Verify each stated condition for title vesting in an inter vivos revocable
    trust, including trust documentation, validity, revocability, parties, powers,
    and any required written exception.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.4 Revocable living
    trusts
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Compliance and Closing
      assistant:
      - Underwriter
      check_units:
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.4 Revocable
          living trusts
      job_kind: verification
    ledger:
      clause: 'PLAT-5.13 Title vesting in an inter vivos revocable trust is permitted
        when all of the following requirements are followed. \[G §3.12, pp. 9–10\]


        - A complete, legible copy of the Trust, or a Certification of Trust stating:
        the existence and date of the Trust; the Trustor(s) and the current Trustee(s);
        the powers of the Trustee; whether the Trust is revocable and, if revocable,
        who holds the right to revoke; the names and number of the Trustees required
        to sign on behalf of the Trust; the Trust identification number (a Social
        Security number or an IRS-issued Tax Identification Number); how title to
        the Trust assets should be taken; and a statement that the Trust has not been
        revoked, modified, or amended in any manner.


        - The Trust must be valid under the laws of the state in which it is established.


        - The Trust must be revocable, meaning it can be changed or canceled at any
        time for any reason during a Trustor''s lifetime. Irrevocable trust is not
        permitted.


        - The Trust must be established by one or more natural persons, solely or
        jointly (Grantor, Trustor, or Settlor), and must become effective during the
        lifetime of the person(s) establishing it.


        - The primary beneficiary of the Trust must be the individual(s) establishing
        the Trust.


        - Written exception by Acra Senior Management must be obtained if the Trustor(s)
        and Trustee(s) are not the same.


        - The Trust must specify that the Trustee has the power to hold title and
        mortgage the property; that the beneficiary does not need to grant written
        consent for the Trust to borrow money, or that such consent has been granted
        in writing for purposes of the mortgage; that there is no unusual risk or
        impairment to the lender''s rights; and that holding title in the Trust does
        not diminish the lender''s rights as a creditor.


        - Legal reserves the right to condition for additional supporting documentation
        as determined in its sole discretion.'
      clause_parts:
      - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.4
