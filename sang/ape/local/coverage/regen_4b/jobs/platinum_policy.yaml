    - status: PASS
      verdict: satisfied
      criterion: A stated trigger applies and seasoning of funds to close is verified.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A stated trigger applies and seasoning of funds to close is not verified.
      carries_conditions: false
    - status: NOT_APPLICABLE
