- rule_id: acra-platinum.asset_assessment_assets_and_funds_to_close.reserves_for_cltv_over_75_00
  condition:
    kind: procedure
    purpose: Determine whether the reserves requirement for CLTV over 75.00% is met.
    steps:
    - 'Initial Document Review: Review bank statements or other available documentation
      for reserves.'
    - 'Eligibility Verification: Determine whether CLTV is over 75.00%.'
    - 'Validation and Verification: When CLTV is over 75.00%, verify that reserves
      meet the stated six-month requirement.'
    - 'Final Determination: Record whether the reserves requirement is met, or that
      it does not apply.'
    checks:
    - If LoanCore.cltv_percent is over 75.00%, RatioSet.reserves_months is at least
      6.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: CLTV is over 75.00% and at least 6 months of reserves are verified.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: CLTV is over 75.00% and at least 6 months of reserves are not verified.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: CLTV is 75.00% or below.
      carries_conditions: false
    evidence_types:
    - bank_statement
    reads:
    - LoanCore.cltv_percent
    - RatioSet.reserves_months
    computable_checks:
    - 0
    missing_reads:
    - The payment basis for the reserves requirement
  action: require_evidence
  priority: 100
  description: Verify the stated six-month reserves requirement when CLTV is over
    75.00%.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#8.2 Reserves by
    trigger, as stated
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: 'Asset Assessment: assets and funds to close'
      assistant:
      - Underwriter
      check_units:
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#8.2 Reserves
          by trigger, as stated
      job_kind: limit
    ledger:
      clause: 'PLAT-8.7 The sources state reserves only for the situations below and
        state the payment basis in none of them. The base requirement at CLTV of 75.00%
        or below, the payment basis (including on an interest-only loan), permitted
        sources, whether overlapping triggers are cumulative, and whether reserves
        substituted for rent loss insurance are additional: Acra confirmation requested
        → Q-08. \[P; G\]


        | **Trigger** | **Reserves as printed** | **Source** |

        |----|----|----|

        | CLTV \> 75.00% | “6-months Reserves required for CLTV \> 75.00%” | P: Reserve
        Requirements |

        | Property listed for sale within six months | Twenty-four (24) months of
        reserves; cash-in-hand may be considered if otherwise consistent with the
        Guide | G §11.5 |

        | Forbearance or mortgage lates in the last 12 months, tenant-occupied subject,
        without timely receipt of the prior two months'' rent (relationship to 0x30x12:
        PLAT-3.12, Q-17) | 12 months of the subject''s payment in reserve, which may
        be from the transaction''s cash-in-hand | G §5.32 |

        | Rent loss insurance required but cannot be obtained | Two (2) months reserves
        for every one (1) month of coverage not provided | G §23.40 |'
