          \[P: Borrower Credit History Requirements\]


          PLAT-6.4 Applicants with one score are within “2 or fewer scores” for the
          tradeline requirement above. The Platinum Summary does not state how the
          decisioning score is set with one score or with two scores, whether any
          no-score pathway exists, or how “Primary Wage Earner” is identified on a
          file with no income documentation. The Standard Summary''s one-or-no-score
