- rule_id: acra-platinum.income_stability_sufficiency_analysis.dscr_channel_minimum
  condition:
    kind: procedure
    purpose: Determine whether the loan meets the minimum DSCR applicable to its channel.
    steps:
    - 'Step 1 - Initial Document Review: Review the established qualifying rent and
      the records needed to establish annual PITIA.'
    - 'Step 2 - Eligibility Verification: Identify the loan channel and the corresponding
      minimum DSCR.'
    - 'Step 3 - Validation and Verification: Calculate DSCR using qualifying rent
      and annual PITIA, including subordinate financing if applicable.'
    - 'Step 4 - Final Determination: Compare the calculated DSCR with the minimum
      for the loan channel.'
    checks:
    - 'The calculated DSCR meets the applicable channel minimum: Correspondent ≥ 1.2
      or Wholesale ≥ 1.0.'
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Calculated DSCR is at least 1.2 for Correspondent or at least 1.0
        for Wholesale.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Calculated DSCR is below the applicable channel minimum, or the applicable
        minimum is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case is not a DSCR transaction.
      carries_conditions: false
    evidence_types: []
    reads:
    - LoanCore.channel
    - LoanCore.dscr_qualification_method
    computable_checks: []
    missing_reads:
    - Qualifying rent
    - Annual principal
    - Annual interest
    - Annual real estate taxes
    - Annual property insurance
    - Annual homeowner's / condominium association fees
    - Subordinate financing amount, if applicable
    - Calculated DSCR
  action: require_evidence
  priority: 100
  description: Calculate DSCR using qualifying rent and annual PITIA, then compare
    it with the minimum for the loan channel.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy, purpose
    and qualification ¶2
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.3 Minimum ratio
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-MINIMUM
      check_units:
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy,
          purpose and qualification ¶2
        - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.3 Minimum
          ratio
      job_kind: limit
    ledger:
      clause: '1.1 Occupancy, purpose and qualification

        PLAT-1.7 The program is offered through two channels with different minimum
        ratios: Correspondent ≥ 1.2, Wholesale ≥ 1.0 (PLAT-3.7). Matrix footnote 3
        also restricts Correspondent pricing (PLAT-2.3). \[P: Minimum DSCR; matrix
        footnote 3\]


        PLAT-1.8 Every loan must meet the applicable channel minimum DSCR. The Platinum
        Summary lists no No Ratio option and no allowance for a ratio below 1.0; a
        ratio below the channel minimum does not meet the published requirement. Whether
        No Ratio or sub-1.0 qualification exists on this program in any form: Acra
        confirmation requested → Q-12. \[P: Minimum DSCR\]


        PLAT-1.9 Acra will not calculate a DTI for applicants who qualify using a
        DSCR; income or employment listed on an application is superfluous to the
        underwrite and may be left blank, and if represented, a DTI should not be
        calculated. The Standard Summary''s statement that borrowing-entity income
        documentation is not required does not appear in the Platinum Summary; whether
        it applies: Acra confirmation requested → Q-13. \[G §7.3, p. 5\]


        PLAT-1.10 “A 1007 will always be required on DSCR transactions”; the Platinum
        Summary refers to market rent “as established on the 1007 or 1025”. Whether
        a Form 1025 alone satisfies the requirement for a two-unit property: Acra
        confirmation requested → Q-04. \[G §5.32, p. 3; §14.12, p. 4; P: Income Documentation\]


        PLAT-1.11 All borrowers purchasing or refinancing a one- to four-family investment
        property must execute a One- to Four-Family Rider with the loan documents
        and provide rent loss insurance coverage per §23.40 (PLAT-7.9 to 7.12). \[G
        §3.41, p. 11\]


        PLAT-1.12 Only the subject property, principal residence and second homes
        are required to be listed on the application or Schedule of Real Estate Owned.
        \[G §5.32, p. 3; §4.15, p. 5\]


        PLAT-3.7 Minimum Debt Service Coverage Ratio: Correspondent ≥ 1.2; Wholesale
        ≥ 1.0. \[P: Minimum DSCR\]


        PLAT-3.8 Property listed for sale within six months (§11.5): the excerpt requires
        “≥1.0 DSCR”; on this program the channel minimum applies — Wholesale 1.0,
        Correspondent 1.2 (PLAT-7.8). \[G §11.5, p. 11; P: Minimum DSCR\]'
      clause_parts:
      - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1
          Occupancy, purpose and qualification ¶2
        heading: 1.1 Occupancy, purpose and qualification
        text: 'PLAT-1.7 The program is offered through two channels with different
          minimum ratios: Correspondent ≥ 1.2, Wholesale ≥ 1.0 (PLAT-3.7). Matrix
          footnote 3 also restricts Correspondent pricing (PLAT-2.3). \[P: Minimum
          DSCR; matrix footnote 3\]


          PLAT-1.8 Every loan must meet the applicable channel minimum DSCR. The Platinum
          Summary lists no No Ratio option and no allowance for a ratio below 1.0;
          a ratio below the channel minimum does not meet the published requirement.
