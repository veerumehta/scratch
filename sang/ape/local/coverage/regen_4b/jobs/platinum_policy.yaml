- rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.guarantor_homeownership_experience
  condition:
    kind: procedure
    purpose: Establish whether the stated guarantor homeownership-experience and application-attestation
      requirements are met.
    steps:
    - 'Initial Document Review: Review the application and loan file for borrower
      or guarantor attestations and evidence of prior homeownership.'
    - 'Eligibility Verification: Verify that at least one guarantor has prior homeownership
      experience and that at least one (1) borrower / guarantor on the loan attests
      on the application that they are not a first-time homebuyer.'
    - 'Validation and Verification: If prior home ownership is not evident within
      the loan file, determine whether supporting documentation is required by the
      underwriter.'
    - 'Final Determination: Record whether the experience and attestation requirements
      are met and whether any supporting documentation condition remains.'
    checks:
    - At least one guarantor has prior homeownership experience, and at least one
      (1) borrower / guarantor on the loan attests on the application that they are
      not a first-time homebuyer.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Both the prior-homeownership and application-attestation requirements
        are met, and no supporting documentation condition remains.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The requirements are met subject to any supporting documentation
        condition imposed by the underwriter being cleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: At least one required homeownership or attestation requirement is
        not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - loan_application
    - entity_documents
    reads:
    - Borrower.is_first_time_homebuyer
    - Borrower.is_entity_borrower_1
    computable_checks: []
    missing_reads:
    - Identity of guarantors
    - Prior homeownership experience
    - Application attestation by a borrower or guarantor
    - Whether prior home ownership is evident within the loan file
