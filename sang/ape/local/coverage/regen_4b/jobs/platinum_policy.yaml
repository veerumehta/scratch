    - entity_documents
    - loan_application
    reads:
    - Borrower.entity_documents_complete
    - Borrower.is_entity_borrower_1
    computable_checks: []
    missing_reads:
    - Purpose of ownership-percentage changes
    - Dates of the changes
    - Application Date
    - Whether a change occurred throughout the application process
  action: require_evidence
  priority: 100
  description: Verify that operating agreement or bylaw changes intended to circumvent
    required personal guarantors are not relied upon when made within the stated lookback
    period or during the application process.
