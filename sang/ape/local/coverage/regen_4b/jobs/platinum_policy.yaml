- rule_id: acra-platinum.asset_assessment_assets_and_funds_to_close.seasoning_verification_for_funds_to_close
  condition:
    kind: procedure
    purpose: Apply the stated seasoning-verification triggers for consumer and business
      purpose transactions.
    steps:
    - 'Initial Document Review: Review the transaction documentation and bank statements
      for transaction classification and funds to close.'
    - 'Eligibility Verification: Determine whether the loan is a consumer transaction
      with CLTV over 70%, or a business purpose loan with funds to close over $50,000
      and CLTV over 70%.'
    - 'Validation and Verification: When either stated trigger applies, verify the
      seasoning of funds to close from the available account documentation. Do not
      impose a seasoning period beyond what the source states.'
    - 'Final Determination: Record whether required seasoning verification is completed,
      or that neither stated trigger applies.'
    checks:
    - When the transaction is a consumer transaction with CLTV over 70%, or a business
      purpose loan with funds to close over $50,000 and CLTV over 70%, seasoning of
      funds to close is verified.
