- rule_id: acra-platinum.income_stability_sufficiency_analysis.qualifying_rent
  condition:
    kind: procedure
    purpose: Determine the rent used to calculate DSCR.
    steps:
    - 'Step 1 - Initial Document Review: Review the available appraisal rent schedule,
      lease, and rental-receipt evidence.'
    - 'Step 2 - Eligibility Verification: Confirm whether actual rent is being used
      and whether the rental is long-term.'
    - 'Step 3 - Validation and Verification: Establish market rent from Form 1007
      or 1025 and actual rent from the available evidence; when actual rent is used,
      verify the receipt and lease-duration requirements.'
    - 'Step 4 - Final Determination: Determine qualifying rent as the greater of market
      rent or actual rent, subject to the stated actual-rent requirements.'
    checks:
    - Qualifying rent is the greater of market rent established on Form 1007 or 1025,
      or actual rent.
    - When actual rent is used, it is documented via evidence of 2 months’ proof of
      receipts.
    - When actual rent is used, the lease is in place for at least 3 months after
      the loan closing.
    - Actual rent is used only for long-term rents and is not used for short-term
      rentals.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Qualifying rent is established as the greater of market rent or actual
        rent, and every applicable actual-rent requirement holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Qualifying rent cannot be established as required, or an applicable
        actual-rent requirement does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The case is not a DSCR transaction.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    - lease_agreement
    - bank_statement
    reads:
    - LoanCore.dscr_qualification_method
    computable_checks: []
    missing_reads:
    - Market rent amount established on Form 1007 or 1025
    - Actual rent amount
    - Whether actual rent is used
    - Rental-receipt amounts and dates sufficient to establish 2 months’ proof of
      receipts
    - Loan closing date
    - Lease end date
    - Rental term/type
  action: require_evidence
  priority: 100
  description: Determine qualifying rent using the greater of market rent established
    on Form 1007 or 1025, or actual rent, applying the stated actual-rent evidence
    and lease-duration requirements.
