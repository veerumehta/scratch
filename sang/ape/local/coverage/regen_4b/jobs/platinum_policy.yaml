          a Form 1025 alone satisfies the requirement for a two-unit property: Acra
          confirmation requested → Q-04. \[G §5.32, p. 3; §14.12, p. 4; P: Income
          Documentation\]


          PLAT-1.11 All borrowers purchasing or refinancing a one- to four-family
          investment property must execute a One- to Four-Family Rider with the loan
          documents and provide rent loss insurance coverage per §23.40 (PLAT-7.9
