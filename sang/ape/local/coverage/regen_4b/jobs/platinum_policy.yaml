- rule_id: acra-platinum.insurance_coverage_sufficiency_policy_assessment.rent_loss_insurance_sufficiency
  condition:
    kind: procedure
    purpose: Determine whether the required rent loss protection is provided through
      six (6) months' coverage or the allowed reserve substitution.
    steps:
    - 'Step 1 - Initial Document Review: Review the hazard insurance declarations
      and bank statement for evidence of rent loss coverage and reserves.'
    - 'Step 2 - Eligibility Verification: Confirm that the Rent Loss Insurance Requirement
      determination applies to the case; if it does not apply, this job is not applicable.'
    - 'Step 3 - Validation and Verification: Verify that the insurance covers rental
      losses incurred during the period the property is being rehabilitated following
      a casualty. If required coverage cannot be obtained, verify the months of coverage
      not provided and the available reserves against the substitution requirement
      of two (2) months reserves for every one (1) month of rent loss coverage not
      provided.'
    - 'Step 4 - Final Determination: Determine whether six (6) months'' rent loss
      insurance is provided or, when it cannot be obtained, the required reserve substitution
      is met.'
    checks:
    - The Rent Loss Insurance Requirement determination applies to the case.
    - The rent loss insurance covers rental losses incurred during the period the
      property is being rehabilitated following a casualty.
    - Six (6) months' rent loss insurance is provided.
    - When required rent loss insurance cannot be obtained, reserves equal two (2)
