- rule_id: acra-platinum.insurance_coverage_sufficiency_policy_assessment.rent_loss_insurance_requirement
  condition:
    kind: procedure
    purpose: Determine whether rent loss insurance is required for the subject property.
    steps:
    - 'Step 1 - Initial Document Review: Review the loan application, lease agreement,
      and rent roll for information relevant to property occupancy, income-property
      status, and whether subject property rents are used to qualify.'
    - 'Step 2 - Eligibility Verification: Establish whether the subject property is
      a one- to four-unit, non-owner occupied income property and whether subject
      property rents are used to qualify.'
    - 'Step 3 - Validation and Verification: Verify the loan-to-value (LTV) and compare
      it with 70%; compare the case-field CLTV with 70%. If LTV is at or below 70%
      while CLTV is above 70%, request Acra confirmation.'
    - 'Step 4 - Final Determination: Determine whether rent loss insurance is required,
      applying the stated requirement and CLTV exemption, and leave the determination
      pending Acra confirmation for the stated LTV/CLTV case.'
    checks:
    - The subject property is a one- to four-unit, non-owner occupied income property.
    - The subject property's LTV is greater than 70%.
    - Subject property rents are used to qualify.
    - LoanCore.cltv_percent is at or below 70%.
    - The subject property's LTV is at or below 70% and LoanCore.cltv_percent is above
      70%.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property conditions, LTV, rent-use condition, and CLTV treatment
        establish that rent loss insurance is required.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: LTV is at or below 70% and CLTV is above 70%; Acra confirmation has
        been requested and the determination remains pending.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: There is no case for this outcome.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The policy conditions requiring rent loss insurance do not apply,
        including when CLTV is at or below 70%.
      carries_conditions: false
    evidence_types:
    - loan_application
    - lease_agreement
    - rent_roll
    reads:
    - SubjectProperty.number_of_units
    - SubjectProperty.occupancy_subtype
    - LoanCore.cltv_percent
    computable_checks:
    - 3
    missing_reads:
    - The subject property's loan-to-value (LTV).
    - Whether the subject property is an income property.
    - Whether subject property rents are used to qualify.
    - Acra's confirmation for a case with LTV at or below 70% and CLTV above 70%.
  action: require_evidence
  priority: 100
  description: Determine whether the subject property meets the policy conditions
    requiring rent loss insurance, including the stated CLTV exemption and the case
    requiring Acra confirmation.
  citations:
  - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.4 Rent loss insurance
    (§23.40)
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Insurance
      assistant:
      - Underwriter
      mnemonic: RLI-RENTLOSS
      check_units:
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.4 Rent loss
          insurance (§23.40)
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.4 Rent loss
          insurance (§23.40)
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.4 Rent loss
          insurance (§23.40)
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.4 Rent loss
          insurance (§23.40)
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.4 Rent loss
          insurance (§23.40)
      job_kind: determination
    ledger:
      clause: 'PLAT-7.9 Rent loss insurance covers rental losses that are incurred
        during the period that a property is being rehabilitated following a casualty.
        \[G §23.40, p. 13\]


        PLAT-7.10 Six (6) months'' rent loss insurance is required on one- to four-unit
        non-owner occupied income properties with LTV \> 70% and when subject property
        rents are used to qualify. \[G §23.40, p. 13\]


        PLAT-7.11 “Loans with ≤ 70% CLTV are not required to carry rent loss insurance.”
        The requirement is stated in LTV and the exemption in CLTV; the case of LTV
