- rule_id: acra-platinum.loan_program_eligibility.prepayment_penalty_structure
  condition:
    kind: procedure
    purpose: Determine whether the selected prepayment penalty structure is listed
      as available in the source.
    steps:
    - 'Initial Document Review: Review the loan application for the selected prepayment
      penalty structure.'
    - 'Eligibility Verification: Compare the selected structure with the structures
      printed for 5 Year, 3 Year, 2 Year, 1 Year, or No Prepay.'
    - 'Validation and Verification: Confirm the selected structure against the loan
      application and case record.'
    - 'Final Determination: Record whether the selected structure is listed.'
    checks:
    - The selected structure is 5 Year 5% Fixed (5% / 5% / 5% / 5% / 5%), 5 Year Sequential
      Stepdown (5% / 4% / 3% / 2% / 1%), 3 Year 5% Fixed (5% / 5% / 5%), 3 Year 3%
      Fixed (3% / 3% / 3%), 2 Year 3% Fixed (3% / 3%), 1 Year 3% Fixed (3%), or No
      Prepay.
