  condition:
    kind: python
    source: "import rules_lib\n\n\ndef check(ctx):\n    amount = ctx['LoanCore.total_loan_amount_usd']\n\
      \    cltv = ctx['LoanCore.cltv_percent']\n    property_type = ctx['SubjectProperty.property_type']\n\
      \    interest_only = rules_lib.flag(ctx['MortgageLoanInformation.is_interest_only'])\n\
