      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.1 Eligible
          products and ARM terms
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.1 Eligible
          products and ARM terms
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.2 Interest-only
      - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.2 Interest-only
      job_kind: verification
    ledger:
      clause: 'PLAT-9.1 Eligible product types: 30 Yr Fixed, 5 Yr ARM, 30 Yr Fixed
        Interest-Only, 5 Yr ARM Interest-Only. \[P: Product Requirements\]


        PLAT-9.2 ARM requirements: Index 1 Yr CMT; Caps 2/2/6; Margin 3.00 (FICO 760+),
        3.25 (FICO 720-759), 3.50 (FICO 700-719). \[P: ARM Requirements\]


        PLAT-9.3 “Interest-Only (5 Yr Term), Max CLTV: 75.00%”. \[P: Product Requirements
        — Restrictions\]


        PLAT-9.4 No minimum loan amount or minimum FICO is printed for interest-only
        loans on Platinum Select: Acra confirmation requested → Q-09. \[P: Product
        Requirements\]


        PLAT-9.5 Interest-only is not available on a property listed for sale (PLAT-7.8).
        \[G §11.5, p. 11\]


        PLAT-9.6 Interest Only payments are calculated as the amount sufficient to
        pay the accrued interest on the mortgage monthly at the time of origination,
        usually for a set term at the beginning of the repayment term; after that
        term the payments are recast to a fully amortized payment for the balance
        of the term ending at maturity. Acra calculates the DSCR using the first payment
        due under the Note (PLAT-3.5; which payment enters the denominator on an interest-only
        loan is Q-21). The excerpt''s DTI calculation for interest-only loans is a
        DTI-program provision — Q-14. \[G §7.5, p. 13\]'
      clause_parts:
      - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#9.1
          Eligible products and ARM terms
        heading: ''
        text: 'PLAT-9.1 Eligible product types: 30 Yr Fixed, 5 Yr ARM, 30 Yr Fixed
          Interest-Only, 5 Yr ARM Interest-Only. \[P: Product Requirements\]


