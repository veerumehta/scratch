- rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.entity_form_eligibility
  condition:
    kind: procedure
    purpose: Determine whether the entity form and structure meet the stated eligibility
      requirements.
    steps:
    - 'Initial Document Review: Review entity documents identifying the entity type,
      formation and place of business, ownership, and any parent or subsidiary entities.'
    - 'Eligibility Verification: Verify that the entity is a US formed and based Entity
      and is not a foreign entity or foreign owned entity.'
    - 'Validation and Verification: Verify that the entity type is a Domestic Corporation
      (C and S Corp), single purpose Limited Liability Company (LLC), excluding series
      LLC, Limited Liability Partnership (LLP), Limited Liability Limited Partnership
      (LLLP), General Partnership (GP), Limited Partnership (LP), or Sole Proprietorship;
      verify that it is not a Cooperative, Irrevocable Trust, Land Trust, IRA, Non-Profit,
      or Joint Venture.'
    - 'Final Determination: Verify that any business entity nesting is limited to
      only one (1) wholly-owned subsidiary that in turn is owned by individual(s),
      with no multiple nesting or ownership by multiple entities, trusts, etcetera;
      record whether the entity form and structure are eligible.'
    checks:
    - The entity is US formed and based and is not a foreign entity or foreign owned
      entity.
    - The entity type is allowed and is not a type listed as not allowed.
    - Business entity nesting, if any, is limited to only one (1) wholly-owned subsidiary
      owned by individual(s), with no multiple nesting or ownership by multiple entities,
      trusts, etcetera.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The entity satisfies every applicable entity form and structure check.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The entity fails an applicable entity form or structure check.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_type
    missing_reads:
    - Entity formation jurisdiction and where it is based
    - Whether the entity is foreign owned
    - Entity legal form, including whether an LLC is a series LLC
    - Whether the entity type is listed as not allowed
    - Complete ownership and nesting structure, including owners of any subsidiary
