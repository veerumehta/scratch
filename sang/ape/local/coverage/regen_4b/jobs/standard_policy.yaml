      criterion: A loan amount exactly $1,000,000 or $2,000,000 requires Acra confirmation
        that has been requested but not obtained.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is vacant, the transaction is a rate and term refinance,
        and any applicable requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
