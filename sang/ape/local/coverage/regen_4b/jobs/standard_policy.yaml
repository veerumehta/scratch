- rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.direct_title_borrower_eligibility
  condition:
    kind: procedure
    purpose: Determine whether the borrowing and title arrangement meets the stated
      entity and title requirements.
    steps:
    - 'Initial Document Review: Review the title commitment and entity documents to
      identify the proposed title holder or holders and whether each is an individual
      or an entity.'
    - 'Eligibility Verification: Confirm that title is to be held directly by an individual
      person or by an entity acceptable to Acra in its sole discretion; for an entity
      borrower, confirm the transaction is business purpose and the property is exclusively
      an investment property.'
    - 'Validation and Verification: Confirm that every entity that will hold direct
      ownership of the subject property and be on title as a direct owner is a borrowing
      entity.'
    - 'Final Determination: Record whether the proposed title and borrowing arrangement
      satisfies these requirements.'
    checks:
    - The collateral title is held directly by an individual person or by an entity
      acceptable to Acra in its sole discretion.
    - The transaction is business purpose and the property is exclusively an investment
      property when the borrower is a business entity.
    - Every entity holding direct ownership of the subject property as a direct owner
      on title is a borrowing entity.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The proposed title and borrowing arrangement meets every applicable
        check.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The title or borrowing arrangement fails an applicable check.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - title_commitment
    - entity_documents
    reads: []
    computable_checks: []
    missing_reads:
    - Proposed title holders and each holder's legal status as an individual or entity
    - Whether Acra accepts an entity title holder
    - Whether the transaction is business purpose and the property is exclusively
      an investment property
    - All direct owners on title and which of them are borrowing entities
  action: require_evidence
  priority: 100
  description: Verify that collateral title is held by an individual or an entity
    acceptable to Acra, and that every entity holding direct title is a borrowing
    entity.
