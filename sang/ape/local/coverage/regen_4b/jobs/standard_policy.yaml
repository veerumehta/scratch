          and other requirement. Requires 1007; however, DSCR is not calculated.”
          The Summary''s No Ratio caps and minimum FICO are STD-3.17. \[G §5.33, p.
          3; S: Income Documentation\]


          STD-3.20 “Proof of actual rents is not required. Property may be short-term
          rental or long-term rental (appropriate pricing applies).” \[G §5.33, p.
          3\]


          STD-3.21 Whether No Ratio is available where another condition carries its
          own minimum DSCR (STD-3.16 and the table above): Acra confirmation requested
