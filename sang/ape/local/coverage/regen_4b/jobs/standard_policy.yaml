- rule_id: acra-standard.income_stability_sufficiency_analysis.low_dscr_and_no_ratio_cltv_limit
  condition:
    kind: procedure
    purpose: Determine whether CLTV is within the stated maximum for DSCR below 1.0
      or No Ratio DSCR.
    steps:
    - 'Step 1 - Initial Document Review: Review available loan and DSCR information.'
    - 'Step 2 - Eligibility Verification: Determine whether DSCR is below 1.0 or the
      file is No Ratio DSCR, and whether the transaction is a purchase or refinance,
      including refinance purpose.'
    - 'Step 3 - Validation and Verification: Compare CLTV with the stated maximum:
      75% for purchase, 70% for refinance — rate & term, and 65% for refinance — cash-out.'
    - 'Step 4 - Final Determination: Determine whether CLTV is within the applicable
      stated maximum.'
    checks:
    - For DSCR below 1.0 or No Ratio DSCR on a purchase, CLTV is no more than 75%.
    - For DSCR below 1.0 or No Ratio DSCR on a refinance — rate & term, CLTV is no
      more than 70%.
    - For DSCR below 1.0 or No Ratio DSCR on a refinance — cash-out, CLTV is no more
      than 65%.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable CLTV check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable CLTV check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: DSCR is not below 1.0 and the file is not No Ratio DSCR.
      carries_conditions: false
    evidence_types: []
    reads:
    - LoanCore.cltv_percent
    - LoanCore.loan_purpose
    - LoanCore.dscr_qualification_method
    computable_checks: []
    missing_reads:
    - The DSCR result, or whether the file is No Ratio DSCR.
    - Whether the transaction is a purchase, refinance — rate & term, or refinance
      — cash-out.
