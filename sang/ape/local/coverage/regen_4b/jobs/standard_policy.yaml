- rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.entity_and_guarantor_due_diligence
  condition:
    kind: procedure
    purpose: Determine whether the required due diligence review is current and covers
      the stated parties.
    steps:
    - 'Initial Document Review: Review the available due diligence and background-check
      records and the date of loan approval or draw.'
    - 'Eligibility Verification: Identify the entity, recourse guarantors, and each
      party that owns 20% or more of the entity directly or indirectly or has managing
      control; for individual borrowers, identify all such individuals.'
    - 'Validation and Verification: Verify that borrower / guarantor due diligence
      is current as of the date of any loan approval or draw. Review any background
      checks Acra orders, which may be from Checkpoint, LexisNexis or another comparable
      provider and may include criminal history, OFAC searches, litigation, judgment,
      and lien searches.'
    - 'Final Determination: Record whether due diligence is current and covers the
      applicable Key Principals and Entities.'
    checks:
    - Borrower / Guarantor Due Diligence is current as of the date of any loan approval
      or draw.
    - For an entity borrower, due diligence covers the entity, recourse guarantors,
      and any party (individual or entity) that owns 20% or more of the entity directly
      or indirectly or has managing control.
    - For an individual borrower, due diligence covers all such individuals.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Due diligence is current and covers every applicable party specified
        by the guidelines.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Due diligence is not current or does not cover every applicable party
        specified by the guidelines.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_type
    missing_reads:
    - Date of any loan approval or draw and the date and currency of due diligence
    - Entity, recourse guarantors, ownership parties meeting the stated threshold,
      and parties with managing control
    - For an individual borrower, all individuals subject to due diligence
    - Due diligence records and any ordered background checks
