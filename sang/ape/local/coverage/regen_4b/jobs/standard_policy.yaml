- rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.required_entity_documents
  condition:
    kind: procedure
    purpose: Determine whether the required entity documentation has been provided
      and meets the stated requirements.
    steps:
    - 'Initial Document Review: Review the entity documents provided, including formation
      documents and amendments; the Operating Agreement or Bylaws and referenced exhibits;
      ownership evidence; applicable stock certificates, stock ledger, Affidavit of
      Lost Stock Certificate, K-1 statements and CPA or Tax Preparer letter; identification;
      good-standing and qualification documents; EIN or TIN evidence; unanimous written
      consent or board resolution; and any required Power of Attorney.'
    - 'Eligibility Verification: Verify that the formation documents and amendments
      and the applicable Operating Agreement or Bylaws are complete and legible, include
      all referenced exhibits, address management, borrowing and contracting authorization,
      and identify authorized signers. Verify that ownership interests are evidenced
      as required, and that corporate share evidence accounts for all outstanding
      shares, including those held by the corporation.'
    - 'Validation and Verification: Verify that entity names match identification
      or that a letter of explanation addresses any discrepancy; that the Certificate
      of Good Standing or equivalent is valid within ninety (90) days of the closing
      date; that any required qualification to operate in the applicable state is
      provided; and that IRS Form SS4 or Federal Taxpayer Identification Number (TIN)
      or Employer Identification Number (EIN) issuance letter is provided. Verify
      the required unanimous written consent or board resolution is signed by all
      members regardless of their percentage of interest, authorizes the transaction
      with Acra Lending, and identifies who is authorized to sign and bind the entity.
      Verify that any Power of Attorney used to designate an attorney in fact to execute
      a personal guarantee is utilized by the principal. Do not accept borrower letters
      stating that required documents are not required, available, or excused.'
    - 'Final Determination: Record whether all applicable required documents have
      been provided and meet the stated requirements; note that Legal reserves the
      right to condition for additional supporting documentation as determined in
      its sole discretion.'
    checks:
    - The complete, legible Certificate of Formation / Articles of Organization and
      all amendments thereto are provided.
    - The complete, legible Operating Agreement for LLCs and Partnerships, or Bylaws
      for corporations, with all referenced exhibits and amendments, is provided and
      states whether the entity is member or manager managed, contains authorization
      to borrow money and enter into contracts for mortgage assets, and designates
      signers.
    - All required documentation evidencing ownership interests is provided, including
      the applicable ownership names and interests or membership interest certificates
      / units in compliance with the Operating Agreement.
    - For S or C Corporations, required shareholder / stockholder certificates or,
      if stock certificates are lost or unavailable, the stock ledger is provided
      and accounts for all outstanding shares noted in the Certificate of Formation
      / Articles of Organization, including those held by the corporation; an Affidavit
      of Lost Stock Certificate is provided if stock certificates are lost, destroyed,
      mutilated, or otherwise unavailable.
    - For S-corporations or Partnerships where both stock certificate and stock ledger
      are unavailable, the most recent preceding tax year's K-1 statement for all
      members with 20% or more interest and a letter from the CPA or Tax Preparer
      affirming current ownership interest are provided, with a statement to that
      effect if the preceding year's taxes have not been filed.
    - Names on the entity documents match the identification or a letter of explanation
      addresses the discrepancy.
    - A Certificate of Good Standing or equivalent document valid within ninety (90)
      days of the closing date is provided.
    - A Certificate of Foreign Qualification or other qualification to operate in
      the state where business is being conducted is provided if the entity is formed
      in a state other than where business is performed or where the property is located.
    - IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or Employer Identification
      Number (EIN) issuance letter is provided, unless an EIN exception request is
      submitted for review by Acra's Legal Department with a letter of explanation
      stating the applicable grounds.
    - A Unanimous Written Consent / Board Resolution signed by all members regardless
      of their percentage of interest authorizes the transaction with Acra Lending
      and identifies who is authorized to sign the loan documents on behalf of and
      to bind the entity.
    - Any Power of Attorney used to designate an attorney in fact to execute a personal
      guarantee is utilized by the principal.
    - No borrower letter is relied on to claim a required document is not required,
      available, or excused.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable required-document check is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Legal has conditioned for additional supporting documentation under
        its sole discretion, and the condition remains to be cleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable required-document check is not met, or a borrower letter
        is relied on in place of a required document.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_documents_complete
    missing_reads:
    - The entity documents and amendments, including their completeness, legibility,
      required contents, signatures, and referenced exhibits
    - Entity identification and any letter of explanation
    - Closing date and good-standing document validity date
    - Entity formation state, business state, and property state
    - Entity tax identification documentation and any EIN exception request and letter
      of explanation
    - Ownership evidence and, when applicable, stock records, K-1 statements, and
      CPA or Tax Preparer letter
    - Whether any Power of Attorney is used for a personal guarantee and whether the
      principal utilized it
