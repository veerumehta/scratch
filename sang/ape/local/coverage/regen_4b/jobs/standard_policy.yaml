- rule_id: acra-standard.identification_requirements_borrower_identity_and_status.foreign_national_credit_references
  condition:
    kind: procedure
    purpose: Verify one of the credit-reference alternatives required for a Foreign
      National borrower.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit-reference materials provided
      for the Foreign National borrower.'
    - 'Step 2 - Eligibility Verification: Verify at least one alternative: a U.S.
      credit report with at least two (2) trade lines with minimum age of two (2)
      years for one trade line; an international credit report; an original credit
      reference letter from an internationally known financial institution; or a bank
      statement documenting a foreign financial banking relationship for the past
      60 days.'
    - 'Step 3 - Validation and Verification: For a credit reference letter, confirm
      it is original and from an internationally known financial institution. The
      letter does not need to include details or payment histories of debt obligations
      located outside of the U.S.'
    - 'Step 4 - Final Determination: Record whether at least one permitted alternative
      is verified.'
    checks:
    - At least one permitted credit-reference alternative is provided and verified.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: At least one permitted credit-reference alternative is provided and
        verified.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: No alternative has yet been sufficiently documented or verified.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The reviewed materials establish that none of the permitted alternatives
        is met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not a Foreign National subject to this requirement.
      carries_conditions: false
    evidence_types:
    - credit_report
    - bank_statement
    reads:
    - Borrower.citizenship_status
    - CreditReport.tradelines_meet_requirement
    missing_reads:
    - Whether a U.S. credit report has at least two (2) trade lines and whether one
      trade line has a minimum age of two (2) years; whether an international credit
      report is provided; whether a credit reference letter is original and from an
      internationally known financial institution; or whether a bank statement documents
      a foreign financial banking relationship for the past 60 days.
