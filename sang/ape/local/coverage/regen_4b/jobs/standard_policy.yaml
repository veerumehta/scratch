- rule_id: acra-standard.identification_requirements_borrower_identity_and_status.foreign_national_closing_documents
  condition:
    kind: procedure
    purpose: Verify the required identity copy, approved title and closing agent,
      applicable Power of Attorney acceptability, and executed W-8 (BEN) IRS form.
    steps:
    - 'Step 1 - Initial Document Review: Review a copy of current Passport, Visa,
      or ITIN; the title and closing agent information; any Power of Attorney; and
      the W-8 (BEN) IRS form.'
    - 'Step 2 - Eligibility Verification: Verify that all loans close with a title
      and closing agent approved and / or vetted by Acra. Where a Power of Attorney
      is used, verify that it conforms to Acra requirements and is acceptable to the
      title company. Verify that the W-8 (BEN) IRS form is executed.'
    - 'Step 3 - Validation and Verification: Validate the document currency, agent
      approval and / or vetting, applicable Power of Attorney acceptability, and execution
      of the W-8 (BEN) IRS form.'
    - 'Step 4 - Final Determination: Record whether each applicable closing-document
      requirement is met.'
    checks:
    - A copy of current Passport, Visa, or ITIN is provided.
    - The loan closes with a title and closing agent approved and / or vetted by Acra.
    - If a Power of Attorney is used, it conforms to Acra requirements and is acceptable
      to the title company.
    - An executed W-8 (BEN) IRS form is provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All applicable Foreign National closing-document requirements are
        met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required document, approval, or applicable Power of Attorney confirmation
        remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable Foreign National closing-document requirement is not
        met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not a Foreign National subject to these closing-document
        requirements.
      carries_conditions: false
    evidence_types:
    - title_agent_verification
    reads:
    - Borrower.citizenship_status
    missing_reads:
    - Copy of current Passport, Visa, or ITIN and its current status; Acra approval
