- rule_id: acra-standard.credit_review_analysis_credit.mortgage_history_cltv_limit
  condition:
    kind: procedure
    purpose: Determine whether CLTV is within the printed limit for the applicable
      mortgage-history label and loan purpose.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit report for the printed
      mortgage-history label and the case record for loan purpose and CLTV.'
    - 'Step 2 - Eligibility Verification: Identify the applicable printed label and
      whether the loan purpose is Purchase or Refi R/T, Refi C/O.'
    - 'Step 3 - Validation and Verification: Apply the printed maximum CLTV for the
      applicable label and purpose: 1x30x12, 0x60x12, 0x90x12, or 0x120x12.'
    - 'Step 4 - Final Determination: Determine whether the loan meets the applicable
      maximum CLTV restriction.'
    checks:
    - For 1x30x12, CLTV does not exceed 80% for Purchase or 75% for Refi R/T, Refi
      C/O.
    - For 0x60x12, CLTV does not exceed 75% for Purchase or 70% for Refi R/T, Refi
      C/O.
    - For 0x90x12, CLTV does not exceed 65% for Purchase or 65% for Refi R/T, Refi
      C/O.
    - For 0x120x12, the case is not eligible.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable mortgage-history label’s printed maximum CLTV is met,
        and the label is not 0x120x12.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable maximum CLTV is exceeded, or the mortgage-history
        label is 0x120x12.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - credit_report
    reads:
    - CreditReport.housing_history_rating
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    - 1
    - 2
    - 3
    missing_reads: []
  action: require_evidence
  priority: 100
  description: Apply the printed mortgage-history label and corresponding CLTV limit
    for the loan purpose.
