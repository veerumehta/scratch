- rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.guarantor_homeownership_experience
  condition:
    kind: procedure
    purpose: Determine whether the entity loan meets the prior homeownership experience
      requirement.
    steps:
    - 'Initial Document Review: Review the application and loan file for the borrower
      or guarantor''s homeownership attestation and evidence of prior homeownership.'
    - 'Eligibility Verification: Verify that at least one guarantor has prior homeownership
      experience and that at least one (1) borrower / guarantor on the loan attests
      on the application that they are not a first-time homebuyer.'
    - 'Validation and Verification: If prior home ownership is not evident within
      the loan file, determine whether supporting documentation is required by the
      underwriter and review it if conditioned for.'
    - 'Final Determination: Record whether the attestation and prior homeownership
      experience requirements are met, including any supporting documentation condition.'
    checks:
    - At least one guarantor has prior homeownership experience.
    - At least one (1) borrower / guarantor on the loan attests on the application
      that they are not a first-time homebuyer.
    - If prior home ownership is not evident within the loan file, any supporting
      documentation conditioned for by the underwriter is provided and supports prior
      home ownership.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The attestation and prior homeownership experience requirements are
        met, including any supporting documentation condition.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Supporting documentation for prior home ownership has been conditioned
        for and remains to be provided.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The required attestation or prior homeownership experience requirement
        is not met, or conditioned supporting documentation does not support prior
        home ownership.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - loan_application
    - entity_documents
    reads:
    - Borrower.is_first_time_homebuyer
    missing_reads:
    - Which borrowers or guarantors have prior homeownership experience
    - Whether prior home ownership is evident within the loan file and any supporting
