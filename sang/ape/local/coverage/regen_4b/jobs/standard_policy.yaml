- rule_id: acra-standard.identification_requirements_borrower_identity_and_status.foreign_account_funds_verification
  condition:
    kind: procedure
    purpose: Verify foreign-account funds and the stated documentation and timing
      conditions for funds to close.
    steps:
    - 'Step 1 - Initial Document Review: For assets held / foreign accounts, obtain
      a copy of the two (2) most recent statements of that account. Review any required
      letter of explanation, sixty (60) day chain of funds, and English translations.'
    - 'Step 2 - Eligibility Verification: Verify funds in U.S. Dollar equivalency
      at the current exchange rate via www.xe.com or the Wall Street Journal conversion
      table. Verify a minimum of 60 days seasoning regardless of LTV / CLTV. If funds
      are not seasoned a minimum of sixty (60) days, require a letter of explanation
      along with information to comprise a sixty (60) day chain of funds. Verify that
      sufficient funds to close are on deposit with the Escrow / Closing Agent at
      least three (3) business days (including Saturdays for this calculation) prior
      to any closing date, and that funds held in a foreign bank / currency are repatriated
      at minimum three (3) business days prior to Closing.'
    - 'Step 3 - Validation and Verification: Translate into English bank statements
      in any language other than English. Validate the exchange-rate conversion, statements,
      seasoning, chain of funds if required, deposit timing, and repatriation timing.'
    - 'Step 4 - Final Determination: Record whether the foreign-account funds meet
      the stated verification, documentation, and timing requirements.'
    checks:
    - Foreign-account assets are verified in U.S. Dollar equivalency at the current
      exchange rate via www.xe.com or the Wall Street Journal conversion table.
    - A copy of the two (2) most recent statements of the account is provided.
    - Funds are documented with a minimum of 60 days seasoning, regardless of LTV
      / CLTV; if funds are not seasoned a minimum of sixty (60) days, a letter of
      explanation and information to comprise a sixty (60) day chain of funds are
      provided.
    - Sufficient funds to close are on deposit with the Escrow / Closing Agent at
      least three (3) business days (including Saturdays for this calculation) prior
      to any closing date.
    - Funds held in a foreign bank / currency are repatriated at minimum three (3)
      business days prior to Closing.
    - Bank statements in any language other than English are translated into English.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: All applicable foreign-account verification, documentation, seasoning,
        deposit, repatriation, and translation requirements are met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required statement, conversion, translation, seasoning record,
        chain of funds, deposit, or repatriation item remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable foreign-account requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The applicant has no assets held / foreign accounts subject to these
        requirements.
      carries_conditions: false
    evidence_types:
    - bank_statement
    reads:
    - Borrower.citizenship_status
    missing_reads:
    - Current exchange rate and the resulting U.S. Dollar equivalency; the two most
      recent account statements; seasoning duration; if seasoning is less than sixty
      (60) days, the letter of explanation and information comprising the sixty (60)
      day chain of funds; funds-on-deposit date, closing date, and sufficiency of
      funds to close; repatriation date; statement language and English translation
      where needed.
  action: require_evidence
  priority: 100
  description: Verify foreign-account funds in U.S. Dollar equivalency and review
    the required account statements, seasoning, transfer timing, and translations.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.2 Assets held in foreign
    accounts
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
