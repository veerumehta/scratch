- rule_id: acra-standard.identification_requirements_borrower_identity_and_status.foreign_national_exchange_rate_review
  condition:
    kind: procedure
    purpose: Complete the required scrutiny of post-close financial position and ability
      to mitigate exchange rate fluctuations.
    steps:
    - 'Step 1 - Initial Document Review: Review information relevant to the applicant’s
      post-close financial position and exchange rate exposure.'
    - 'Step 2 - Eligibility Verification: Review with scrutiny the applicant’s post-close
      financial position and ability to mitigate exchange rate fluctuations.'
    - 'Step 3 - Validation and Verification: Validate the information used in that
      review and record the assessment.'
    - 'Step 4 - Final Determination: Record whether the required review has been completed
      and its conclusion.'
    checks:
    - The applicant has been reviewed with scrutiny toward a post-close financial
      position and the ability to mitigate exchange rate fluctuations.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The required scrutiny has been completed and the review establishes
        the applicant’s ability to mitigate exchange rate fluctuations.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The review or information needed to assess post-close financial position
        or ability to mitigate exchange rate fluctuations remains incomplete.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The completed review does not establish the applicant’s ability to
        mitigate exchange rate fluctuations.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not a Foreign National Program applicant.
      carries_conditions: false
    evidence_types: []
    reads:
    - Borrower.citizenship_status
    missing_reads:
    - Post-close financial position information and information supporting the applicant’s
      ability to mitigate exchange rate fluctuations.
