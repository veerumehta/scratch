- rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.single_purpose_entity
  condition:
    kind: procedure
    purpose: Determine whether the entity borrower satisfies the stated SPE requirement.
    steps:
    - 'Initial Document Review: Review the entity documents for the entity''s assets
      and business activities and identify its legal form.'
    - 'Eligibility Verification: Verify that the entity has no assets other than residential
      investment or rental properties.'
    - 'Validation and Verification: Verify that the entity is engaged in the business
      of owning and operating residential investment or rental properties and is not
      a series limited liability company.'
    - 'Final Determination: Record whether the entity satisfies the single purpose
      entity requirement.'
    checks:
    - The entity has no assets other than residential investment or rental properties.
    - The entity is engaged in the business of owning and operating residential investment
      or rental properties.
    - The entity is not a series limited liability company.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The entity satisfies every single purpose entity check.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The entity fails a single purpose entity check.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads:
    - Borrower.entity_type
    missing_reads:
    - The entity's assets
    - The entity's business activities
    - Whether the entity is a series limited liability company
  action: require_evidence
  priority: 100
  description: Verify that an entity borrower is a single purpose entity as defined
    by the guidelines and is not a series limited liability company.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#6.1 Entity eligibility and
    guarantees ¶1
