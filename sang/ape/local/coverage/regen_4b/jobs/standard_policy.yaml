    - 'Step 1 - Initial Document Review: Review the appraisal_report and any short-term
      rental ledger.'
    - 'Step 2 - Eligibility Verification: Determine whether the property is occupied
      as a short-term rental and whether actual rents are being documented.'
    - 'Step 3 - Validation and Verification: If the appraisal form is used as a replacement
      to a 1007, verify that an STRpro or similar appraisal form is signed by an appropriately
      licensed appraiser. If a ledger is provided as documentation for actual rents,
      verify that it covers 12-months and is from a condotel management company, property
      manager, AirBnB, VRBO, etcetera.'
    - 'Step 4 - Final Determination: Determine whether the applicable stated short-term
      rental documentation is present. Do not infer how a 12-month ledger establishes
      qualifying rent or how the receipt and lease conditions apply.'
    checks:
    - If an STRpro or similar appraisal form is used as a replacement to a 1007, it
      is signed by an appropriately licensed appraiser.
    - If a ledger is provided as documentation for actual rents, it covers 12-months
      and is from a condotel management company, property manager, AirBnB, VRBO, etcetera.
