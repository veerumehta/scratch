- rule_id: acra-standard.insurance_coverage_sufficiency_policy_assessment.rent_loss_requirement_applicability
  condition:
    kind: procedure
    purpose: Determine whether six (6) months' rent loss insurance is required for
      the subject property.
    steps:
    - 'Initial Document Review: Review the loan application and lease agreement or
      rent roll for the property’s occupancy and income-property status and whether
      subject property rents are used to qualify.'
    - 'Eligibility Verification: Establish whether the property is one- to four-unit,
      non-owner occupied, and an income property, and whether subject property rents
      are used to qualify.'
    - 'Validation and Verification: Verify whether LTV is > 70% and compare the case’s
      CLTV with the stated ≤ 70% exemption. For LTV at or below 70% with CLTV above
      70%, request Acra confirmation (Q-11).'
    - 'Final Determination: Record whether the six-month requirement applies, does
      not apply, or requires Acra confirmation under Q-11.'
    checks:
    - The subject is a one- to four-unit non-owner occupied income property.
    - Subject property rents are used to qualify.
    - LTV is > 70%.
    - CLTV is ≤ 70%.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property and rent-use criteria are met, LTV is > 70%, and CLTV
        is not ≤ 70%; six (6) months' rent loss insurance is required.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: LTV is at or below 70% and CLTV is above 70%; Acra confirmation is
        requested (Q-11).
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A required property, rent-use, or LTV condition is not established.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not a one- to four-unit non-owner occupied income
        property, or subject property rents are not used to qualify, or CLTV is ≤
        70%.
      carries_conditions: false
    evidence_types:
    - loan_application
    - lease_agreement
    - rent_roll
    reads:
    - LoanCore.cltv_percent
    computable_checks:
    - 3
    missing_reads:
    - Property unit count
    - Property owner-occupancy status
    - Whether the property is an income property
    - Whether subject property rents are used to qualify
    - LTV
