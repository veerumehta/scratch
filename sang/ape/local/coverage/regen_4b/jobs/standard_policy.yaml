- rule_id: acra-standard.appraisal_review_property_eligibility.listed_property_loan_conditions.python
  condition:
    kind: python
    source: "import rules_lib\n\ndef check(ctx):\n    listed_raw = ctx['SubjectProperty.listed_for_sale_last_6_months']\n\
      \    missing = rules_lib.gaps(listed=listed_raw)\n    if missing:\n        return\
      \ rules_lib.unknown(*missing)\n    listed = rules_lib.flag(listed_raw)\n   \
      \ if listed is None:\n        return rules_lib.unknown('listed_for_sale_last_6_months')\n\
      \    if not listed:\n        return True\n\n    occupancy_subtype = ctx['SubjectProperty.occupancy_subtype']\n\
      \    reserves_months = ctx['RatioSet.reserves_months']\n    interest_only_raw\
      \ = ctx['MortgageLoanInformation.is_interest_only']\n    missing = rules_lib.gaps(\n\
      \        occupancy_subtype=occupancy_subtype,\n        reserves_months=reserves_months,\n\
      \        interest_only=interest_only_raw,\n    )\n    if missing:\n        return\
      \ rules_lib.unknown(*missing)\n\n    interest_only = rules_lib.flag(interest_only_raw)\n\
      \    if interest_only is None:\n        return rules_lib.unknown('interest_only')\n\
      \n    investment_property = rules_lib.same(\n        occupancy_subtype, 'investment',\
      \ 'investment property'\n    )\n    if investment_property:\n        lease_raw\
      \ = ctx['SubjectProperty.has_current_lease']\n        vacant_raw = ctx['SubjectProperty.is_vacant']\n\
      \        missing = rules_lib.gaps(has_current_lease=lease_raw, is_vacant=vacant_raw)\n\
      \        if missing:\n            return rules_lib.unknown(*missing)\n     \
      \   has_current_lease = rules_lib.flag(lease_raw)\n        is_vacant = rules_lib.flag(vacant_raw)\n\
      \        if has_current_lease is None:\n            return rules_lib.unknown('has_current_lease')\n\
      \        if is_vacant is None:\n            return rules_lib.unknown('is_vacant')\n\
      \        if not has_current_lease or is_vacant:\n            return False\n\n\
      \    try:\n        reserves_sufficient = reserves_months >= 24\n    except (TypeError,\
      \ ValueError):\n        return rules_lib.unknown('reserves_months')\n\n    return\
      \ reserves_sufficient and not interest_only\n"
