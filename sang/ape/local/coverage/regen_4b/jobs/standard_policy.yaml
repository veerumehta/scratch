- rule_id: acra-standard.income_stability_sufficiency_analysis.actual_rent_documentation
  condition:
    kind: procedure
    purpose: Determine whether the stated documentation requirements for actual rents
      exceeding market rents are met, without resolving which rent controls qualification.
    steps:
    - 'Step 1 - Initial Document Review: Review the lease_agreement and bank_statement
      for lease terms and rental income receipt.'
    - 'Step 2 - Eligibility Verification: Determine whether actual rents exceed market
      rents.'
    - 'Step 3 - Validation and Verification: Verify two (2) consecutive months proof
      of rental income receipt and lease agreement(s) to continue at a minimum of
      three (3) months after closing. Verify that the rents are not prepaid and that
      security deposits are not counted towards receipt.'
    - 'Step 4 - Final Determination: Determine whether the stated documentation and
      receipt conditions are met.'
    checks:
    - When actual rents exceed market rents, two (2) consecutive months proof of rental
      income receipt and lease agreement(s) to continue at a minimum of three (3)
      months after closing are documented, rents are not prepaid, and security deposits
      are not counted towards receipt.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Actual rents do not exceed market rents.
      carries_conditions: false
    evidence_types:
    - lease_agreement
    - bank_statement
    reads: []
    computable_checks: []
    missing_reads:
    - Whether actual rents exceed market rents.
    - Whether rental receipts are prepaid.
    - The dates and amounts of rental income receipts and the lease end date.
  action: require_evidence
  priority: 100
  description: Verify the stated evidence of actual rents when actual rents exceed
    market rents.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both
    provisions, as written
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-ACTUALRENT
      check_units:
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent
          — both provisions, as written
      job_kind: verification
    ledger:
      clause: 'STD-3.5 Formula: the lesser of annual in-place rent or market rent
        (STD-3.1). \[G §5.32, p. 3\]


        STD-3.6 Note in the same section: “Acra may use the higher of actual or market
        rents. Where actual rents exceed market rents, then evidence of actual rents
        must be documented via two (2) consecutive months proof of rental income receipt
        and lease agreement(s) to continue at a minimum of three (3) months after
        closing. Note: Security Deposit does not count towards receipt, and the rents
        cannot be prepaid.” \[G §5.32, p. 3; repeated under Actual Rents, p. 5\]


        STD-3.7 This document does not select between STD-3.5 and STD-3.6. When market
        rent may be used if actual rent is lower, when higher actual rent may be used,
        and whether the stated documentation is sufficient or further approval is
        required: Acra confirmation requested → Q-01.


        STD-3.8 “If vacant property is being purchased, qualifying rents are taken
        from the 1007 or 1025 Appraisal report, as applicable, for qualifying income.”
        Rental income from the purchase of a vacant property requires a 1007 survey
        if it is the subject of an Acra loan. \[G §5.32, p. 3; §5.30–5.31, p. 4\]'
