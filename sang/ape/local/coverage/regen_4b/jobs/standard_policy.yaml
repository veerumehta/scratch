      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.3 First-time homebuyers
      job_kind: limit
    ledger:
      clause: 'STD-4.9 “Acra defines a First Time Home Buyers (‘FTHB’) as an application
        where all Applicants have never previously owned a home (real property).”
        \[G §3.13, p. 10\]


        STD-4.10 DSCR: Acra allows first-time homebuyers under all of the following:
        minimum 700 FICO score; maximum 70% CLTV; minimum DSCR of 1.150; maximum loan
        amount of \$1,000,000; full amortization required, no interest-only programs;
        impounds required; minimum six months reserves. The Summary states the same
        conditions: “Minimum 700 FICO: Max 70% CLTV: DSCR ≥ 1.15: Loan amt ≤ \$1MM:
        NO I/O: Must Impound: Requires 6mos Reserves”. \[G §3.13, p. 10; S: Restrictions\]


        STD-4.11 “Where a FTHB is purchasing an Investment property and the loan is
        qualifying via DTI program, the maximum DTI will be 43.0%.” Noted as a DTI-program
        provision — Q-14. \[G §3.13, p. 10\]


        STD-4.12 §3.12 separately requires at least one guarantor with prior homeownership
        experience where the borrower is an entity (STD-6.9). How that requirement
        and the first-time-homebuyer allowance interact: Acra confirmation requested
        → Q-09.'
      clause_parts:
      - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.3 First-time
          homebuyers
        heading: ''
