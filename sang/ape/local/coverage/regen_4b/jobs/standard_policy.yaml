- rule_id: acra-standard.income_stability_sufficiency_analysis.no_ratio_dscr_documentation
  condition:
    kind: procedure
    purpose: Determine whether a No Ratio DSCR file has a 1007 and whether the file
      is treated without calculating DSCR or requiring proof of actual rents.
    steps:
    - 'Step 1 - Initial Document Review: Review the appraisal_report for a Form 1007
      and review any actual-rent evidence submitted.'
    - 'Step 2 - Eligibility Verification: Determine whether the file qualifies as
      No Ratio DSCR.'
    - 'Step 3 - Validation and Verification: Verify a 1007 is provided. Do not require
      proof of actual rents and do not calculate DSCR for No Ratio DSCR.'
    - 'Step 4 - Final Determination: Determine whether the 1007 is provided and the
      stated No Ratio treatment is followed.'
    checks:
    - A 1007 is provided for the No Ratio DSCR file.
    - DSCR is not calculated for the No Ratio DSCR file.
    - Proof of actual rents is not required for the No Ratio DSCR file.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Each check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The file is not No Ratio DSCR.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    reads:
    - LoanCore.dscr_qualification_method
    computable_checks: []
    missing_reads:
    - Whether the file qualifies as No Ratio DSCR.
    - Applicable program-matrix maximum LTV / CLTV based on FICO and other requirements.
