- rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.revocable_trust_title_vesting
  condition:
    kind: procedure
    purpose: Determine whether title may be vested in the inter vivos revocable trust
      under the stated requirements.
    steps:
    - 'Initial Document Review: Review the trust or Certification of Trust, title
      commitment, and any written exception by Acra Senior Management.'
    - 'Eligibility Verification: Verify that the Trust is valid under the laws of
      the state in which it is established; is revocable during a Trustor''s lifetime;
      is established by one or more natural persons and became effective during their
      lifetime; and has the individual(s) establishing the Trust as its primary beneficiary.'
    - 'Validation and Verification: Verify that the Trust or Certification of Trust
      provides all listed trust information; that the Trustee has power to hold title
      and mortgage the property; that beneficiary written consent is not required
      or has been granted in writing for the mortgage; and that there is no unusual
      risk or impairment to the lender''s rights and title in the Trust does not diminish
      the lender''s rights as a creditor. Verify that written exception by Acra Senior
      Management is obtained if the Trustor(s) and Trustee(s) are not the same. Do
      not treat an irrevocable trust as permitted.'
    - 'Final Determination: Record whether each trust vesting requirement is met;
      note that Legal reserves the right to condition for additional supporting documentation
      as determined in its sole discretion.'
    checks:
    - A complete, legible copy of the Trust or a Certification of Trust states the
      existence and date of the Trust; Trustor(s) and current Trustee(s); Trustee
      powers; whether the Trust is revocable and, if revocable, who holds the right
      to revoke; required signing Trustees; the Trust identification number; how title
      to Trust assets should be taken; and that the Trust has not been revoked, modified,
      or amended in any manner.
    - The Trust is valid under the laws of the state in which it is established and
      is revocable, meaning it can be changed or canceled at any time for any reason
      during a Trustor's lifetime.
    - The Trust is established by one or more natural persons, solely or jointly,
      and becomes effective during the lifetime of the person(s) establishing it;
      the primary beneficiary is the individual(s) establishing the Trust.
    - Written exception by Acra Senior Management is obtained if the Trustor(s) and
      Trustee(s) are not the same.
    - The Trust specifies that the Trustee has the power to hold title and mortgage
      the property; that beneficiary written consent is not needed or has been granted
      in writing for the mortgage; that there is no unusual risk or impairment to
      the lender's rights; and that holding title in the Trust does not diminish the
      lender's rights as a creditor.
    - The Trust is not an irrevocable trust.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every applicable trust vesting check is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: Legal has conditioned for additional supporting documentation under
        its sole discretion, and the condition remains to be cleared.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable trust vesting check is not met, including if the Trust
        is irrevocable.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Title is not vested in an inter vivos revocable trust.
      carries_conditions: false
    evidence_types:
    - entity_documents
    - title_commitment
    reads: []
    computable_checks: []
    missing_reads:
    - The Trust or Certification of Trust and whether it contains all required information
    - The governing state's law and whether the Trust is valid under it
    - Whether the Trust is revocable and who holds the right to revoke
    - Trustor(s), Trustee(s), establishment date, effectiveness, and primary beneficiary
    - Any written exception by Acra Senior Management
    - Trust terms on holding title, mortgaging the property, beneficiary consent,
      lender rights, and creditor rights
  action: require_evidence
  priority: 100
  description: Verify that title vesting in an inter vivos revocable trust meets each
    stated trust, documentation, and exception requirement.
