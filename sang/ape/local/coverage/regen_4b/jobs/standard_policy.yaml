- rule_id: acra-standard.credit_review_analysis_credit.bankruptcy_and_foreclosure_cltv_limit.python
  condition:
    kind: python
    source: "import rules_lib\n\ndef check(ctx):\n    has_event = ctx['Borrower.has_bankruptcy_or_foreclosure']\n\
      \    seasoning = ctx['Borrower.months_since_bankruptcy_or_foreclosure']\n  \
      \  cltv = ctx['LoanCore.cltv_percent']\n    purpose = ctx['LoanCore.loan_purpose']\n\
      \n    missing = rules_lib.gaps(\n        has_bankruptcy_or_foreclosure=has_event,\n\
      \        months_since_bankruptcy_or_foreclosure=seasoning,\n        cltv_percent=cltv,\n\
      \        loan_purpose=purpose,\n    )\n    if missing:\n        return rules_lib.unknown(*missing)\n\
      \n    has_event = rules_lib.flag(has_event)\n    if has_event is None:\n   \
      \     return rules_lib.unknown('has_bankruptcy_or_foreclosure')\n    if not\
      \ has_event:\n        return True\n\n    is_purchase = rules_lib.same(purpose,\
      \ 'Purchase')\n    is_refi = rules_lib.same(purpose, 'Refi R/T', 'Refi C/O')\n\
      \    if not is_purchase and not is_refi:\n        return rules_lib.unknown('loan_purpose')\n\
      \n    if seasoning < 12:\n        return False\n    if seasoning >= 36:\n  \
      \      return True\n\n    if 24 <= seasoning <= 35:\n        maximum = 80 if\
      \ is_purchase else 75\n    elif 12 <= seasoning <= 23:\n        maximum = 65\n\
      \    else:\n        return rules_lib.unknown('months_since_bankruptcy_or_foreclosure')\n\
      \n    within_limit = rules_lib.band(cltv, [(maximum, True)], above=False)\n\
      \    if within_limit is None:\n        return rules_lib.unknown('cltv_percent')\n\
      \    return within_limit"
    entrypoint: check
    reads:
    - Borrower.has_bankruptcy_or_foreclosure
    - Borrower.months_since_bankruptcy_or_foreclosure
    - LoanCore.cltv_percent
    - LoanCore.loan_purpose
