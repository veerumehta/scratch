- rule_id: acra-standard.appraisal_review_property_eligibility.condotel_or_pudtel_cltv
  condition:
    kind: procedure
    purpose: Check the Condotel / PUDtel CLTV limit applicable to the transaction.
    steps:
    - 'Initial Document Review: Review property type, transaction purpose, state,
      and CLTV.'
    - 'Eligibility Verification: Apply the Condotel / PUDtel cap for the transaction
      purpose and the printed Florida reduction where applicable.'
    - 'Validation and Verification: Compare the recorded CLTV with the applicable
      cap.'
    - 'Final Determination: Record whether the applicable Condotel / PUDtel CLTV limit
      is met.'
    checks:
    - If the property is Condotel / PUDtel, CLTV does not exceed 75% for Purchase,
      70% for Refi R/T, or 65% for Refi C/O, with -5% CLTV for Florida properties.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not Condotel / PUDtel, or the applicable CLTV cap,
        including the printed Florida reduction where applicable, is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is Condotel / PUDtel and the applicable CLTV cap, including
        the printed Florida reduction where applicable, is exceeded.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads:
    - SubjectProperty.property_type
    - LoanCore.loan_purpose
    - SubjectProperty.state
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    missing_reads: []
  action: require_evidence
  priority: 100
  description: Apply the Condotel / PUDtel CLTV caps and Florida reduction by transaction
    purpose.
  citations:
