      mortgages are not reported, identify the applicant’s primary residence(s), any
      secondary residence(s), and the subject property for history documentation.'
    - 'Step 3 - Validation and Verification: For DSCR loans, verify documentation
      of the subject property, principal residence, and second home (if any); additional
      properties do not require housing history documentation unless documents in
      the file suggest a major credit event has occurred. Evaluate payment history
      for the primary residence, subject property, and second homes, if applicable.
      Rate matured loans based on maturity date; verify in writing any extension of
      maturity date.'
    - 'Step 4 - Final Determination: Evaluate the ratings for properties the borrower
      owns and/or rents over the last twelve (12) months and determine whether the
      required history has been documented and evaluated.'
