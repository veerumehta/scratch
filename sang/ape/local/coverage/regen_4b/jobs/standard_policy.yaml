- rule_id: acra-standard.credit_review_analysis_credit.bankruptcy_and_foreclosure_cltv_limit
  condition:
    kind: procedure
    purpose: Determine whether a borrower with bankruptcy or foreclosure meets the
      printed seasoning-based maximum CLTV restriction.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit report and case record
      for bankruptcy or foreclosure, seasoning, loan purpose, and CLTV.'
    - 'Step 2 - Eligibility Verification: Determine whether the borrower has bankruptcy
      or foreclosure and identify the seasoning as printed.'
    - 'Step 3 - Validation and Verification: Apply the printed maximum CLTV for the
      applicable seasoning and purpose: ≥ 36 Mo, 24-35 Mo, 12-23 Mo, or < 12 Mo.'
    - 'Step 4 - Final Determination: Determine whether the applicable restriction
      is met.'
    checks:
    - If seasoning is ≥ 36 Mo, there are No Restrictions.
    - If seasoning is 24-35 Mo, CLTV does not exceed 80% for Purchase or 75% for Refi
      R/T, Refi C/O.
    - If seasoning is 12-23 Mo, CLTV does not exceed 65% for Purchase or 65% for Refi
      R/T, Refi C/O.
    - If seasoning is < 12 Mo, the case is Ineligible.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The borrower has no bankruptcy or foreclosure, or the applicable
        printed seasoning restriction is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The borrower has bankruptcy or foreclosure and exceeds the applicable
        maximum CLTV, or seasoning is < 12 Mo.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - credit_report
    reads:
    - Borrower.has_bankruptcy_or_foreclosure
    - Borrower.months_since_bankruptcy_or_foreclosure
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    - 1
    - 2
    - 3
