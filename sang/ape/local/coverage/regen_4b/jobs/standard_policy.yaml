  condition:
    kind: procedure
    purpose: Determine whether the stated STD-9.5 requirements for foreign funds and
      Foreign Nationals are met.
    steps:
    - 'Initial Document Review: Review available evidence about the location and currency
      of funds, seasoning, and any transfer to the closing account.'
    - 'Eligibility Verification: Establish whether funds are held in a foreign bank
      / currency and whether the borrower is a Foreign National; note that the source
      requests confirmation about the scope of the repatriation requirement and applicable
      evidence.'
    - 'Validation and Verification: For Foreign Nationals, verify a minimum of 60
      days seasoning regardless of LTV / CLTV. Verify that foreign bank / currency
      funds are repatriated at minimum three (3) business days prior to Closing, subject
      to the source''s unresolved scope question.'
    - 'Final Determination: Determine whether the applicable stated requirements are
      documented.'
    checks:
    - Foreign Nationals document a minimum of 60 days seasoning, regardless of LTV
      / CLTV.
    - Funds held in a foreign bank / currency are repatriated at minimum three (3)
      business days prior to Closing, where the repatriation requirement applies.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable seasoning and repatriation requirements are met and
        documented.
      carries_conditions: false
