          3. \[G §5.32–5.33, p. 3\]


          STD-1.6 “Borrowing entity income documentation not required.” Acra will
          not calculate a DTI for applicants who qualify using a DSCR; income or employment
          listed on an application is superfluous to the underwrite and may be left
          blank, and if represented, a DTI should not be calculated. \[S: Income Documentation;
          G §7.3, p. 5\]'
