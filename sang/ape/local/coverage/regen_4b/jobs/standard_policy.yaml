- rule_id: acra-standard.loan_program_eligibility.prepayment_penalty_structure
  condition:
    kind: procedure
    purpose: Determine whether the selected prepayment penalty structure matches a
      structure printed in the guidelines.
    steps:
    - 'Initial Document Review: Review the loan application for the selected prepayment
      penalty structure.'
    - 'Eligibility Verification: Identify the selected term and compare its structure
      with the structures printed for that term.'
    - 'Validation and Verification: Verify the selected structure against the published
      list.'
    - 'Final Determination: Record whether the selected structure is listed.'
    checks:
    - 'The selected structure is one of the structures printed for its term: 5 Year
      5% Fixed (5% / 5% / 5% / 5% / 5%) or Sequential Stepdown (5% / 4% / 3% / 2%
      / 1%); 4 Year 5% Fixed (5% / 5% / 5% / 5%) or 3% Fixed (3% / 3% / 3% / 3%);
      3 Year 5% Fixed (5% / 5% / 5%) or 3% Fixed (3% / 3% / 3%); 2 Year 3% Fixed (3%
      / 3%); 1 Year 3% Fixed (3%); or No Prepay.'
