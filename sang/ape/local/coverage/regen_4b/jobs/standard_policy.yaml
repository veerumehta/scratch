- rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.ownership_change_review
  condition:
    kind: procedure
    purpose: Determine whether ownership changes are subject to the guideline's non-recognition
      rule.
    steps:
    - 'Initial Document Review: Review the current and prior operating agreements
      or bylaws and the available records of ownership changes.'
    - 'Eligibility Verification: Identify any change to the operating agreement or
      bylaws intended to change ownership percentages to circumvent required personal
      guarantors.'
    - 'Validation and Verification: For any such change, determine whether it occurred
      within 30 days prior to an Application Date or throughout the application process.'
    - 'Final Determination: Do not recognize a change that falls within the stated
      period; record the result of the review.'
    checks:
    - A change to the operating agreement or bylaws intended to change ownership percentages
      to circumvent required personal guarantors is not recognized if it occurred
      within 30 days prior to an Application Date or throughout the application process.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: There is no applicable change that must not be recognized, or any
        such change is not recognized.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A change covered by the non-recognition rule is recognized.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an entity borrower.
      carries_conditions: false
    evidence_types:
    - entity_documents
    reads: []
    computable_checks: []
    missing_reads:
    - Operating agreement or bylaw changes, their intent, and their effective dates
    - Application Date and application-process dates
