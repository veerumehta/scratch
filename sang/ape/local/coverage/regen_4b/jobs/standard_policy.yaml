- rule_id: acra-standard.asset_assessment_assets_and_funds_to_close.reserves_for_fico_below_620
  condition:
    kind: procedure
    purpose: Determine whether the reserve requirement for the FICO trigger in STD-9.6
      is met.
    steps:
    - 'Initial Document Review: Review the credit report and available evidence of
      reserves.'
