        → Q-17. \[S: Income Documentation\]


        STD-3.17 DSCR \< 1.0 or No Ratio: maximum CLTV 75% (purchase), 70% (refinance
        — rate & term), 65% (refinance — cash-out); minimum FICO 640. \[S: Income
        Documentation\]


        STD-3.18 “The minimum rental income required is outlined in the Program Matrix.”
