      clause: 'STD-10.3 Interest Only, 5 Yr / 30 Year Fixed or 5/1 and 7/1 ARM: minimum
        loan ≥ \$250K; minimum 640 credit score. \[S: Product Requirements\]


        STD-10.4 Interest Only, 10 Yr / 40 Year Term: minimum loan ≥ \$250K; minimum
        640 credit score; maximum 80% LTV / CLTV; maximum \$3M loan amount. \[S: Product
        Requirements\]


        STD-10.5 Interest-only is not available to first-time homebuyers (STD-4.10),
