- rule_id: acra-standard.identification_requirements_borrower_identity_and_status.documents_signed_outside_the_u_s
  condition:
    kind: procedure
    purpose: Verify the acknowledgment and authentication requirements applicable
      to documents signed outside of the U.S.
    steps:
    - 'Step 1 - Initial Document Review: Identify documents signed outside of the
      U.S. and review the notarization and acknowledgment materials.'
    - 'Step 2 - Eligibility Verification: Verify one applicable route: notarization
      by a U.S. embassy or consular official, with a certificate of acknowledgement
      including the embassy or consular seal and acceptable to the title company;
      or, for documents signed in a country that is party to the Hague Convention
      Treaty Abolishing the Requirement of Legalization for Foreign Public Documents,
      a certificate of acknowledgment completed and signed by an authorized notary
      public plus authentication by apostille in English, attached to the executed
      documents, with title company acceptance.'
    - 'Step 3 - Validation and Verification: Validate the applicable acknowledgment,
      seal or apostille, attachment to the executed documents where required, and
      title company acceptance.'
    - 'Step 4 - Final Determination: Record whether the applicable signing and acknowledgment
      requirements are met.'
    checks:
    - Each document signed outside of the U.S. meets one applicable stated notarization
      route and the title company acceptance condition.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable route is documented and the title company accepts
        the documents.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A required acknowledgment, authentication, attachment, or title company
        acceptance remains outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable route or title company acceptance requirement is not
        met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: No document was signed outside of the U.S.
      carries_conditions: false
    evidence_types: []
    reads:
    - Borrower.citizenship_status
    missing_reads:
    - Whether a document was signed outside of the U.S.; the signing country’s Hague
      Convention status; acknowledgment, seal, authorized notary, and apostille details
      as applicable; whether the apostille is in English and attached to the executed
      documents; title company acceptance.
  action: require_evidence
  priority: 100
  description: Verify that documents signed outside the U.S. use a stated notarization
    route and meet the title company acceptance condition.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#5.4 Closing documents
  on_violation: fail
  replaces: []
