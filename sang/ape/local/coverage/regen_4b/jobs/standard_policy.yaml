- rule_id: acra-standard.asset_assessment_assets_and_funds_to_close.first_time_homebuyer_reserves
  condition:
    kind: procedure
    purpose: Determine whether the reserve requirement for the first-time homebuyer
      trigger in STD-9.6 is met.
    steps:
    - 'Initial Document Review: Review the loan application and evidence of reserves.'
    - 'Eligibility Verification: Establish whether the borrower is a first-time homebuyer.'
    - 'Validation and Verification: If the trigger applies, verify minimum six months
      reserves.'
    - 'Final Determination: Determine whether the applicable reserve requirement is
      met.'
    checks:
    - Borrower is a first-time homebuyer.
    - If the borrower is a first-time homebuyer, reserves are at least six months.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The borrower is not a first-time homebuyer, or at least six months
        reserves are verified.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The borrower is a first-time homebuyer and at least six months reserves
        are not verified.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
