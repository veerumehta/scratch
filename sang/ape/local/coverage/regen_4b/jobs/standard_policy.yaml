- rule_id: acra-standard.appraisal_review_property_eligibility.listed_property_loan_conditions
  condition:
    kind: procedure
    purpose: Determine whether a loan on a property listed for sale meets the characteristics
      stated in §11.5.
    steps:
    - 'Initial Document Review: Review listed status, lien payment status, occupancy,
      qualification, prepayment penalty, reserves, amortization, value and listing
      price, subordinate financing, and impounds.'
    - 'Eligibility Verification: Apply each §11.5 characteristic to a property considered
      listed for sale.'
    - 'Validation and Verification: Verify each condition, including the lesser-of
      value basis for the 65% maximum LTV / CLTV.'
    - 'Final Determination: Record whether all applicable §11.5 conditions are met.'
    checks:
    - If the property is considered listed for sale, the property is not in default
      or otherwise delinquent on lien(s).
    - If the property is considered listed for sale and is an investment property,
      the subject is occupied by a tenant and is not vacant.
    - If the property is considered listed for sale, the loan qualifies as either
      at least 1.0 DSCR or 43% maximum DTI.
    - If the property is considered listed for sale, the prepayment penalty is at
      least three years unless the property is in a state that does not allow prepayment
      penalties.
    - If the property is considered listed for sale, reserves are 24 months; cash-in-hand
      may be considered if otherwise consistent with the Guide.
    - If the property is considered listed for sale, the loan has a fully amortizing
      term and is not interest only.
    - If the property is considered listed for sale, maximum LTV / CLTV is 65% based
      on the lesser of appraised value or lowest recent listing price.
    - If the property is considered listed for sale, there is no subordinate financing.
    - If the property is considered listed for sale, impounds are in place.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not considered listed for sale, or every applicable
        §11.5 condition is met.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is considered listed for sale and any applicable §11.5
        condition is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    - listing_history
    - hazard_insurance
    reads:
    - SubjectProperty.listed_for_sale_last_6_months
    - SubjectProperty.occupancy_subtype
    - SubjectProperty.is_vacant
    - LoanCore.is_interest_only_10_40
    - MortgageLoanInformation.is_interest_only
    - RatioSet.reserves_months
    - LoanCore.cltv_percent
    - SubjectProperty.appraised_value_usd
    - LoanCore.is_escrow_waived
    - SubjectProperty.state
    computable_checks:
    - 1
    - 4
    - 5
    missing_reads:
    - Whether any lien(s) are in default or otherwise delinquent
    - Whether the subject is an investment property and is occupied by a tenant
    - Qualifying DSCR or DTI calculation
    - Prepayment penalty term and whether the property's state allows prepayment penalties
    - Whether cash-in-hand is consistent with the Guide, if relied on
    - Appraised value and lowest recent listing price used to establish the lesser
      value
    - Whether subordinate financing exists
    - Impound status
  action: require_evidence
  priority: 100
  description: Check the stated loan conditions for a property listed for sale under
    §11.5.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.3 Properties listed for
