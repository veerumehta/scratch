        | “FICO 660 to 699”        | 65%          | 60%                              |

        | “FICO 640 to 659”        | 60%          | 60%                              |'
      clause_parts:
      - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.1 Citizenship
