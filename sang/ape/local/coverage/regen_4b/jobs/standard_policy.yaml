- rule_id: acra-standard.appraisal_review_property_eligibility.vacant_cash_out_refinance
  condition:
    kind: procedure
    purpose: Determine whether a vacant property cash-out refinance meets the conditions
      stated in the Summary.
    steps:
    - 'Initial Document Review: Review vacancy, transaction purpose, score, loan amount,
      CLTV, DSCR, prepayment penalty, interest-only status, impounds, reserves, and
      ownership duration.'
    - 'Eligibility Verification: Apply the stated vacant-property cash-out refinance
      conditions.'
    - 'Validation and Verification: Verify each stated condition and request Acra
      confirmation for loans of $1,500,000 or more and for how the 15 months of ownership
      are measured.'
    - 'Final Determination: Record whether the stated conditions are met and whether
      confirmation remains outstanding.'
    checks:
    - If the property is vacant and the transaction is a cash-out refinance, the minimum
      FICO score is 700.
    - If the property is vacant and the transaction is a cash-out refinance, DSCR
      is at least 1.15.
    - If the property is vacant and the transaction is a cash-out refinance, the prepayment
      penalty is at least three years where allowable.
    - If the property is vacant and the transaction is a cash-out refinance, no interest-only
      program is used.
    - If the property is vacant and the transaction is a cash-out refinance, impounds
      are in place.
    - If the property is vacant and the transaction is a cash-out refinance, reserves
      are at least six months.
    - If the property is vacant and the transaction is a cash-out refinance with a
      loan amount under $1,500,000, CLTV is no more than 60%.
    - If the property is vacant and the transaction is a cash-out refinance, ownership
      is at least 15 months.
    - If the property is vacant and the transaction is a cash-out refinance with a
      loan amount of $1,500,000 or more, Acra confirmation is obtained.
    - If the property is vacant and the transaction is a cash-out refinance, Acra
      confirmation is obtained on how the 15 months of ownership are measured.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not vacant or the transaction is not a cash-out refinance,
        or every applicable stated condition is met and required Acra confirmation
        is obtained.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The loan amount is $1,500,000 or more, or confirmation on how the
        15 months of ownership are measured is outstanding.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is vacant, the transaction is a cash-out refinance,
        and any applicable stated condition is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not vacant or the transaction is not a cash-out refinance.
      carries_conditions: false
    evidence_types: []
    reads:
    - SubjectProperty.is_vacant
    - LoanCore.loan_purpose
    - CreditReport.representative_score
    - LoanCore.total_loan_amount_usd
    - LoanCore.cltv_percent
    - MortgageLoanInformation.is_interest_only
    - LoanCore.is_interest_only_10_40
    - LoanCore.is_escrow_waived
    - LoanCore.prepayment_penalty_structure
    - RatioSet.reserves_months
    - SubjectProperty.ownership_months
    computable_checks:
    - 3
    - 5
    - 6
    missing_reads:
    - FICO score evidence
    - DSCR calculation and qualifying DSCR value
    - Prepayment penalty term and whether it is allowable
    - Impound status
    - Reserves calculation
    - Ownership duration and the basis for measuring it
    - Acra confirmation for loans of $1,500,000 or more
    - Acra confirmation on how the 15 months of ownership are measured
