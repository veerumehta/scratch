- rule_id: acra-standard.loan_program_eligibility.investment_occupancy
  condition:
    kind: procedure
    purpose: Determine whether the property is investment property, which is the only
      occupancy type allowed.
    steps:
    - 'Initial Document Review: Review the loan application and any lease agreement
      for the subject property''s occupancy and lease details.'
    - 'Eligibility Verification: Determine whether the property is non-owner occupied
      and is a one- to four-unit residential dwelling, a unit in a condominium complex,
      or a unit in a PUD.'
    - 'Validation and Verification: Verify that the dwelling is leased and occupied
      as a principal year-round residence by individuals other than the owner.'
    - 'Final Determination: Record whether the subject property meets the definition
      of investment property.'
    checks:
    - The property is non-owner occupied.
    - The property is a one- to four-unit residential dwelling, or a unit in a condominium
      complex or a PUD.
    - The dwelling is leased and occupied as a principal year-round residence by individuals
      other than the owner.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every step is met and every check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A step is not met or a check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The job does not apply to this case.
      carries_conditions: false
    evidence_types:
    - loan_application
    - lease_agreement
    reads:
    - SubjectProperty.occupancy_subtype
    - SubjectProperty.number_of_units
    - SubjectProperty.property_type
    - SubjectProperty.has_current_lease
    computable_checks: []
    missing_reads:
    - Whether the owner occupies the dwelling
    - Whether the dwelling is occupied as a principal year-round residence
    - Whether the occupants are individuals other than the owner
    - Whether the property is a unit in a condominium complex or a PUD
  action: require_evidence
  priority: 100
  description: Determine whether the subject property satisfies the program's investment-property
    occupancy requirement.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.1 Occupancy, purpose and
    qualification ¶1
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Eligibility
      assistant:
      - Underwriter
      mnemonic: LPE-OCCUPANCY
      check_units:
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.1 Occupancy, purpose
          and qualification ¶1
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.1 Occupancy, purpose
          and qualification ¶1
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.1 Occupancy, purpose
          and qualification ¶1
      job_kind: determination
    ledger:
      clause: '1.1 Occupancy, purpose and qualification

        STD-1.1 Occupancy is investment property (non-owner occupied) only. \[S: Occupancy
        Type\]


        STD-1.2 An investment property is “a one- to four-unit residential dwelling
        or a unit in a condominium complex or a PUD owned by an individual who does
        not occupy the dwelling. The dwelling is leased and occupied as a principal
        year-round residence to individuals other than the owner.” \[G §3.41, p. 11\]


        STD-1.3 The Program Summary is listed as “Business Purpose DSCR” on Acra''s
        rate-sheet page. “Where the borrower is qualifying utilizing the subject property''s
        actual or market cashflow under a business purpose transaction, borrower must
        execute with loan docs a Business Purpose Attestation (Exhibit 8) or other
        similar attestation approved by Acra.” The excerpt''s §8.4 also refers to
        consumer transactions (STD-9.2); whether every loan on this program is a business-purpose
        transaction: Acra confirmation requested → Q-27. \[G §5.32, p. 3; acralending.com/ratesheets\]


        STD-1.4 The matrix columns are Purchase, Rate & Term and Cash-Out. Delayed
        financing is addressed only by the matrix footnote “Delayed financing is capped
        at \$1.5MM”. Which column and which cash-in-hand rule apply to delayed financing:
        Acra confirmation requested → Q-06. \[S: matrix and footnote\]


        STD-1.5 A loan qualifies either by a calculated DSCR (§5.32) or as No Ratio
        DSCR, where no ratio is calculated (§5.33). Both are set out in section 3.
        \[G §5.32–5.33, p. 3\]


        STD-1.6 “Borrowing entity income documentation not required.” Acra will not
        calculate a DTI for applicants who qualify using a DSCR; income or employment
        listed on an application is superfluous to the underwrite and may be left
        blank, and if represented, a DTI should not be calculated. \[S: Income Documentation;
        G §7.3, p. 5\]'
      clause_parts:
