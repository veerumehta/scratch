- rule_id: acra-standard.income_stability_sufficiency_analysis.rural_or_unique_property_dscr_minimum
  condition:
    kind: procedure
    purpose: Determine whether the stated minimum DSCR of 1.00 is met for a rural
      or unique property.
    steps:
    - 'Step 1 - Initial Document Review: Review available property and DSCR information.'
    - 'Step 2 - Eligibility Verification: Determine whether the property is rural
      or unique.'
    - 'Step 3 - Validation and Verification: Compare DSCR with the stated minimum
      of 1.00.'
    - 'Step 4 - Final Determination: Determine whether the stated minimum DSCR is
      met.'
    checks:
    - For a rural or unique property, DSCR is at least 1.00.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is neither rural nor unique.
      carries_conditions: false
    evidence_types: []
    reads:
    - SubjectProperty.is_rural
    - SubjectProperty.property_type
    computable_checks: []
    missing_reads:
    - Whether the property is unique.
    - The calculated DSCR.
