        Location\]


        STD-8.4 Declining market: “-5% CLTV property/borrower full profile” (STD-1.14).
        \[S: Subject Property Location\]'
      clause_parts:
      - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.3 Location
        heading: ''
