rules:
- rule_id: acra-standard.appraisal_review_property_eligibility.2_4_unit_cltv
  condition:
    kind: procedure
    purpose: Check the maximum CLTV for a 2-4 Unit property.
    steps:
    - 'Initial Document Review: Review property type and CLTV.'
    - 'Eligibility Verification: Apply the printed Max CLTV: 80% for a 2-4 Unit property.'
    - 'Validation and Verification: Compare the recorded CLTV with 80%.'
    - 'Final Determination: Record whether the maximum CLTV is met.'
    checks:
    - If SubjectProperty.property_type is 2-4 Units, LoanCore.cltv_percent is no more
      than 80%.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not 2-4 Units, or CLTV is no more than 80%.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is 2-4 Units and CLTV is more than 80%.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads:
    - SubjectProperty.property_type
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    missing_reads: []
  action: require_evidence
  priority: 100
  description: Apply the printed maximum CLTV for a 2-4 Unit property.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types
    and caps
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: 'Appraisal Review: property eligibility'
      assistant:
      - Underwriter
      check_units:
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property
          types and caps
      job_kind: limit
    ledger:
      clause: 'STD-8.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo,
        Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units, Manufactured. Restrictions
        as printed: \[S: Subject Property Type\]


        | **Property type** | **Purchase** | **Refi R/T** | **Refi C/O** | **Conditions
        as printed** |

        |----|----|----|----|----|

        | Non-Warrantable Condo | 80% | 75% | 75% | “-5% CLTV for Florida properties,
        Min DSCR: 1.0” |

        | Condotel / PUDtel | 75% | 70% | 65% | “-5% CLTV for Florida properties Min
        DSCR: 1.0” |

        | 2-4 Unit | 80% | 80% | 80% | Printed as “Max CLTV: 80%” with no purpose
        split |

        | Manufactured Home | 65% | 60% | 60% | — |


        STD-8.2 Above 80.00% LTV only SFR, Warrantable Condos outside of Florida,
        Townhome and PUD are eligible (STD-3.16). \[S: Income Documentation\]


        STD-8.3 Rural / unique property: maximum CLTV 80% (purchase), 75% (refinance
        — rate & term), 70% (refinance — cash-out); minimum FICO 700; minimum DSCR
        1.00. “If marketing time is excessive or property exhibits unusual, inadequate
        or peculiar functionality, LTV may be further reduced.” \[S: Subject Property
        Location\]


        STD-8.4 Declining market: “-5% CLTV property/borrower full profile” (STD-1.14).
        \[S: Subject Property Location\]'
      clause_parts:
      - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible
          property types and caps
        heading: ''
        text: 'STD-8.1 Eligible property types: SFR, Townhome, PUD, Warrantable Condo,
          Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units, Manufactured. Restrictions
          as printed: \[S: Subject Property Type\]


          | **Property type** | **Purchase** | **Refi R/T** | **Refi C/O** | **Conditions
          as printed** |

          |----|----|----|----|----|

          | Non-Warrantable Condo | 80% | 75% | 75% | “-5% CLTV for Florida properties,
          Min DSCR: 1.0” |

          | Condotel / PUDtel | 75% | 70% | 65% | “-5% CLTV for Florida properties
          Min DSCR: 1.0” |

          | 2-4 Unit | 80% | 80% | 80% | Printed as “Max CLTV: 80%” with no purpose
          split |

          | Manufactured Home | 65% | 60% | 60% | — |


          STD-8.2 Above 80.00% LTV only SFR, Warrantable Condos outside of Florida,
          Townhome and PUD are eligible (STD-3.16). \[S: Income Documentation\]


          STD-8.3 Rural / unique property: maximum CLTV 80% (purchase), 75% (refinance
          — rate & term), 70% (refinance — cash-out); minimum FICO 700; minimum DSCR
          1.00. “If marketing time is excessive or property exhibits unusual, inadequate
          or peculiar functionality, LTV may be further reduced.” \[S: Subject Property
          Location\]


          STD-8.4 Declining market: “-5% CLTV property/borrower full profile” (STD-1.14).
          \[S: Subject Property Location\]'
  approval_refs: []
- rule_id: acra-standard.appraisal_review_property_eligibility.above_80_00_ltv_type_eligibility
  condition:
    kind: procedure
    purpose: Determine whether a loan above 80.00% LTV has a property type permitted
      by the policy.
    steps:
    - 'Initial Document Review: Review the subject property''s type and the loan''s
      CLTV percentage.'
    - 'Eligibility Verification: Apply the property-type restriction for LTV above
      80.00%.'
    - 'Validation and Verification: Compare the recorded type and CLTV with the restriction.'
    - 'Final Determination: Record whether the property type is permitted above 80.00%
      LTV.'
    checks:
    - If LoanCore.cltv_percent is above 80.00%, SubjectProperty.property_type is SFR,
      Warrantable Condo outside of Florida, Townhome, or PUD.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The loan is not above 80.00% LTV, or the property type is SFR, Warrantable
        Condo outside of Florida, Townhome, or PUD.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The loan is above 80.00% LTV and the property type is not SFR, Warrantable
        Condo outside of Florida, Townhome, or PUD.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads:
    - LoanCore.cltv_percent
    - SubjectProperty.property_type
    - SubjectProperty.state
    computable_checks:
    - 0
    missing_reads: []
  action: require_evidence
  priority: 100
  description: Check the property types permitted when LTV is above 80.00%.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types
    and caps
