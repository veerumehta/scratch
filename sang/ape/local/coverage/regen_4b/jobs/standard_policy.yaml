- rule_id: acra-standard.credit_review_analysis_credit.scores_and_tradelines
  condition:
    kind: procedure
    purpose: Determine whether the applicant meets the stated score and tradeline
      requirements and, where applicable, the stated overlay.
    steps:
    - 'Step 1 - Initial Document Review: Review the credit report for reported score
      count, tradelines, and credit history.'
    - 'Step 2 - Eligibility Verification: Determine whether the applicant has scores
      from 3 repositories, 2 or fewer scores, or 1 or No Score / Deficient Tradelines.'
    - 'Step 3 - Validation and Verification: For 2 or fewer scores, verify either
      2 tradelines & 24 month history, or 3 tradelines & 12 month history. For 1 or
      No Score / Deficient Tradelines, verify each of the three entries as printed:
      Max 65% LTV/CLTV; DSCR Ratio ≥ 1.1; 24mos 0x30 housing history.'
    - 'Step 4 - Final Determination: Determine whether the applicable score and tradeline
      requirements are met.'
    checks:
    - If the applicant has scores from 3 repositories, the score-count requirement
      is met with no tradeline overlay.
    - If the applicant has 2 or fewer scores, the applicant has either 2 tradelines
      & 24 month history, or 3 tradelines & 12 month history.
    - If the applicant has 1 or No Score / Deficient Tradelines, CLTV does not exceed
      65%.
    - If the applicant has 1 or No Score / Deficient Tradelines, DSCR Ratio is ≥ 1.1.
    - If the applicant has 1 or No Score / Deficient Tradelines, the applicant has
      24mos 0x30 housing history.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable score and tradeline requirements are met, including
        all applicable entries for 1 or No Score / Deficient Tradelines.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable score or tradeline requirement is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types:
    - credit_report
    reads:
    - CreditReport.score_count
    - CreditReport.tradelines_meet_requirement
    - LoanCore.cltv_percent
    computable_checks:
    - 0
