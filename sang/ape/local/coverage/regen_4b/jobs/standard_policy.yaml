    - If the property is vacant and the transaction is a rate and term refinance,
      impounds are in place.
    - If the property is vacant and the transaction is a rate and term refinance,
      reserves are at least six months.
    - If the property is vacant and the transaction is a rate and term refinance with
      a loan amount exactly $1,000,000 or $2,000,000, Acra confirmation is obtained.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not vacant or the transaction is not a rate and term
        refinance, or every applicable requirement is met and any required Acra confirmation
        is obtained.
      carries_conditions: false
