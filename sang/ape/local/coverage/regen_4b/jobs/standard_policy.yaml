- rule_id: acra-standard.income_stability_sufficiency_analysis.dscr_calculation
  condition:
    kind: procedure
    purpose: Determine the DSCR using the lesser of annual in-place rent or market
      rent over annual PITIA, including subordinate financing in the denominator.
    steps:
    - 'Step 1 - Initial Document Review: Review the appraisal_report and lease_agreement
      for market rent and in-place rent information, and review available loan information
      for PITIA and subordinate financing.'
    - 'Step 2 - Eligibility Verification: Determine whether DSCR is to be calculated;
      No Ratio DSCR does not calculate a DSCR.'
    - 'Step 3 - Validation and Verification: Use the lesser of annual in-place rent
      or market rent as the numerator. Use annual principal, interest, real estate
      taxes, property insurance, homeowner''s / condominium association fees, and
      subordinate financing, if applicable, as the denominator. Use the first payment
      due under the Note.'
    - 'Step 4 - Final Determination: Calculate and record the DSCR. Do not resolve
      the interest-only payment question or the rent-selection conflict beyond the
      stated formula.'
    checks:
    - The calculated DSCR equals the lesser of annual in-place rent or market rent
      divided by annual PITIA, including subordinate financing, if applicable, using
      the first payment due under the Note.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The DSCR is calculated using the stated formula and first payment
        due under the Note.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The DSCR is not calculated using the stated formula or first payment
        due under the Note.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The file qualifies as No Ratio DSCR, for which DSCR is not calculated.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    - lease_agreement
    reads:
    - LoanCore.dscr_qualification_method
    computable_checks: []
    missing_reads:
    - Annual in-place rent.
    - Market rent.
    - Annual principal, interest, real estate taxes, property insurance, homeowner's
      / condominium association fees, and any subordinate financing.
    - The first payment due under the Note.
    - For interest-only loans, Acra confirmation of which payment enters the denominator
      (Q-26).
    - Acra confirmation on when market rent may be used if actual rent is lower and
      when higher actual rent may be used (Q-01).
  action: require_evidence
  priority: 100
  description: Calculate the DSCR using the stated rent and PITIA formula.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both
    provisions, as written
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.5 No Ratio DSCR
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-RATIO
      check_units:
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
        - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent
          — both provisions, as written
        - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.5 No Ratio DSCR
      job_kind: determination
    ledger:
      clause: 'STD-3.1 “Acra calculates the DSCR by dividing (a) the lesser of (i)
        annual in-place rent or (ii) market rent (reference §14.14) by (b) the sum
        of annual principal, interest, real estate taxes, property insurance, and
        homeowner''s / condominium association fees (collectively, ‘PITIA’). Subordinate
        financing, if applicable, would also be included in the denominator for the
        sake of this calculation.” \[G §5.32, p. 3\]


        STD-3.2 “Acra calculates the DSCR utilizing the first payment due under the
        terms of the Note.” §7.5 defines Interest Only payments as “the amount sufficient
        to pay the accrued interest to the mortgage on a monthly basis at the time
        of origination”, while the §5.32 denominator lists “annual principal, interest
        …”. Which payment enters the DSCR denominator on an interest-only loan: Acra
        confirmation requested → Q-26. \[G §7.5, p. 13; §5.32, p. 3\]


        STD-3.3 The reference to subordinate financing in the denominator is a calculation
        rule; it does not itself establish that a subordinate lien is permitted. Whether
        and when subordinate financing is permitted: Acra confirmation requested →
        Q-18. \[G §5.32, p. 3\]


        STD-3.4 §14.14 (market rent), referenced in the formula, is not reproduced
        in the excerpt (Appendix B). \[G §5.32, p. 3\]


        STD-3.5 Formula: the lesser of annual in-place rent or market rent (STD-3.1).
        \[G §5.32, p. 3\]


        STD-3.6 Note in the same section: “Acra may use the higher of actual or market
        rents. Where actual rents exceed market rents, then evidence of actual rents
        must be documented via two (2) consecutive months proof of rental income receipt
        and lease agreement(s) to continue at a minimum of three (3) months after
        closing. Note: Security Deposit does not count towards receipt, and the rents
        cannot be prepaid.” \[G §5.32, p. 3; repeated under Actual Rents, p. 5\]


        STD-3.7 This document does not select between STD-3.5 and STD-3.6. When market
        rent may be used if actual rent is lower, when higher actual rent may be used,
        and whether the stated documentation is sufficient or further approval is
        required: Acra confirmation requested → Q-01.


        STD-3.8 “If vacant property is being purchased, qualifying rents are taken
        from the 1007 or 1025 Appraisal report, as applicable, for qualifying income.”
        Rental income from the purchase of a vacant property requires a 1007 survey
        if it is the subject of an Acra loan. \[G §5.32, p. 3; §5.30–5.31, p. 4\]


        STD-3.19 “File can qualify without calculating a DSCR Ratio to a maximum LTV
        / CLTV as described on the appropriate program matrix depending on FICO and
        other requirement. Requires 1007; however, DSCR is not calculated.” The Summary''s
        No Ratio caps and minimum FICO are STD-3.17. \[G §5.33, p. 3; S: Income Documentation\]


        STD-3.20 “Proof of actual rents is not required. Property may be short-term
        rental or long-term rental (appropriate pricing applies).” \[G §5.33, p. 3\]


        STD-3.21 Whether No Ratio is available where another condition carries its
        own minimum DSCR (STD-3.16 and the table above): Acra confirmation requested
        → Q-13. Whether the short-term-rental caps apply to a No Ratio file: Acra
        confirmation requested → Q-02.


        STD-3.22 Rent loss insurance applies to No Ratio DSCR (STD-8.12). \[G §23.40,
        p. 13\]'
      clause_parts:
      - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
        heading: ''
        text: 'STD-3.1 “Acra calculates the DSCR by dividing (a) the lesser of (i)
          annual in-place rent or (ii) market rent (reference §14.14) by (b) the sum
          of annual principal, interest, real estate taxes, property insurance, and
          homeowner''s / condominium association fees (collectively, ‘PITIA’). Subordinate
          financing, if applicable, would also be included in the denominator for
          the sake of this calculation.” \[G §5.32, p. 3\]


          STD-3.2 “Acra calculates the DSCR utilizing the first payment due under
          the terms of the Note.” §7.5 defines Interest Only payments as “the amount
          sufficient to pay the accrued interest to the mortgage on a monthly basis
          at the time of origination”, while the §5.32 denominator lists “annual principal,
          interest …”. Which payment enters the DSCR denominator on an interest-only
          loan: Acra confirmation requested → Q-26. \[G §7.5, p. 13; §5.32, p. 3\]


          STD-3.3 The reference to subordinate financing in the denominator is a calculation
          rule; it does not itself establish that a subordinate lien is permitted.
          Whether and when subordinate financing is permitted: Acra confirmation requested
          → Q-18. \[G §5.32, p. 3\]


          STD-3.4 §14.14 (market rent), referenced in the formula, is not reproduced
          in the excerpt (Appendix B). \[G §5.32, p. 3\]'
      - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying
          rent — both provisions, as written
        heading: ''
        text: 'STD-3.5 Formula: the lesser of annual in-place rent or market rent
          (STD-3.1). \[G §5.32, p. 3\]


          STD-3.6 Note in the same section: “Acra may use the higher of actual or
          market rents. Where actual rents exceed market rents, then evidence of actual
          rents must be documented via two (2) consecutive months proof of rental
          income receipt and lease agreement(s) to continue at a minimum of three
          (3) months after closing. Note: Security Deposit does not count towards
          receipt, and the rents cannot be prepaid.” \[G §5.32, p. 3; repeated under
