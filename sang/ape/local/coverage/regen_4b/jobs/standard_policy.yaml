- rule_id: acra-standard.identification_requirements_borrower_identity_and_status.itin_limits_and_clarification
  condition:
    kind: procedure
    purpose: Apply the stated ITIN limits without resolving the source’s unanswered
      eligibility and FICO-tier questions by assumption.
    steps:
    - 'Step 1 - Initial Document Review: For an ITIN borrower, review loan amount,
      FICO, transaction purpose, and CLTV.'
    - 'Step 2 - Eligibility Verification: Apply maximum loan amount $1.0M and minimum
      FICO 640. Apply the printed CLTV tiers: “FICO 700” — 70% purchase and 65% refinance
      — R/T and cash-out; “FICO 660 to 699” — 65% purchase and 60% refinance — R/T
      and cash-out; “FICO 640 to 659” — 60% purchase and 60% refinance — R/T and cash-out.'
    - 'Step 3 - Validation and Verification: Obtain Acra confirmation under Q-03 on
      whether a US-resident ITIN holder is eligible and whether the tier printed “FICO
      700” means 700 and above. Do not assume an answer to either question.'
    - 'Step 4 - Final Determination: Record the applicable stated limits and whether
      the requested clarifications have been obtained.'
    checks:
    - The ITIN loan amount is no more than $1.0M.
    - The ITIN borrower’s FICO is at least 640.
    - The applicable printed ITIN CLTV tier is met, without treating “FICO 700” as
      700 and above unless Acra confirms that interpretation.
    - Acra confirmation under Q-03 has resolved whether a US-resident ITIN holder
      is eligible.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The ITIN limits applicable under the confirmed interpretation are
        met and the required Q-03 eligibility clarification has been obtained.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The borrower is an ITIN holder and Q-03 clarification is outstanding,
        or an applicable tier or eligibility fact remains unresolved.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: An applicable stated ITIN loan amount, minimum FICO, or CLTV limit
        is not met.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not an ITIN holder.
      carries_conditions: false
    evidence_types: []
    reads:
    - Borrower.citizenship_status
    - LoanCore.total_loan_amount_usd
    - CreditReport.representative_score
    - LoanCore.loan_purpose
    - LoanCore.cltv_percent
    computable_checks:
    - 0
    - 1
    missing_reads:
    - Acra confirmation under Q-03; the transaction purpose and applicable printed
      FICO tier; confirmation whether “FICO 700” means 700 and above.
