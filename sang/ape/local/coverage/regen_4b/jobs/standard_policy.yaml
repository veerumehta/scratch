- rule_id: acra-standard.insurance_coverage_sufficiency_policy_assessment.rent_loss_reserve_substitution
  condition:
    kind: procedure
    purpose: Determine whether reserves meet the permitted substitution amount for
      rent loss coverage not provided.
    steps:
    - 'Initial Document Review: Review the hazard insurance declarations for rent
      loss coverage provided and any coverage that cannot be obtained.'
    - 'Eligibility Verification: Confirm that rent loss insurance is required and
      cannot be obtained.'
    - 'Validation and Verification: Determine the months of rent loss coverage not
      provided and compare available reserves with two (2) months of reserves for
      every one (1) month of rent loss coverage not provided.'
    - 'Final Determination: Record whether the borrower’s reserves meet the permitted
      substitution amount.'
    checks:
    - Reserves are at least two (2) months for every one (1) month of required rent
      loss coverage not provided.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Required rent loss insurance cannot be obtained and reserves meet
        two (2) months for every one (1) month of rent loss coverage not provided.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: Required rent loss insurance cannot be obtained and reserves do not
        meet two (2) months for every one (1) month of rent loss coverage not provided.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: Rent loss insurance is not required or the required rent loss insurance
        can be obtained.
      carries_conditions: false
    evidence_types:
    - hazard_insurance
    reads:
    - RatioSet.reserves_months
    missing_reads:
    - Whether required rent loss insurance cannot be obtained
    - Months of rent loss coverage provided
    - Months of rent loss coverage not provided
