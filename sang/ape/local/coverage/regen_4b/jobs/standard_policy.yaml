- rule_id: acra-standard.loan_program_eligibility.state_prepayment_restrictions
  condition:
    kind: procedure
    purpose: Determine whether a printed state restriction applies to the case and
      identify the restriction as printed.
    steps:
    - 'Initial Document Review: Review the loan application for state, entity or individual
      closing status, loan amount, interest rate, transaction type, and number of
      residential units.'
    - 'Eligibility Verification: Compare the case with the restriction printed for
      the applicable state.'
    - 'Validation and Verification: Verify any applicable restriction using the case
      facts; do not interpret the term BUY-OUT.'
    - 'Final Determination: Record whether a printed restriction applies and whether
      Acra confirmation is needed to determine the effect of BUY-OUT.'
    checks:
    - For the applicable state, the case meets the printed state restriction's stated
      state, transaction, borrower/entity, unit-count, loan-amount, and interest-rate
      conditions.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Every step is met and no applicable restriction requires BUY-OUT,
        or the case facts do not meet a printed restriction.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: A printed restriction applies and Acra confirmation is needed to
        determine what BUY-OUT requires.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: A step is not met or the case does not comply with an applicable
        restriction as confirmed by Acra.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The subject property's state is not listed in the printed state restrictions.
      carries_conditions: false
    evidence_types:
    - loan_application
    reads:
    - SubjectProperty.state
    - Borrower.entity_type
    - Borrower.is_entity_borrower_1
    - LoanCore.total_loan_amount_usd
    - LoanCore.note_rate_percent
    - LoanCore.loan_purpose
    - SubjectProperty.number_of_units
    - LoanCore.prepayment_penalty_structure
    computable_checks: []
    missing_reads:
    - Meaning of BUY-OUT
    - Whether BUY-OUT is required in the case under the applicable state restriction
