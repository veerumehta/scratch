- rule_id: acra-standard.identification_requirements_borrower_identity_and_status.borrower_citizenship_type
  condition:
    kind: procedure
    purpose: Determine whether the borrower’s citizenship status is one of the eligible
      types.
    steps:
    - 'Step 1 - Initial Document Review: Read the recorded borrower citizenship status.'
    - 'Step 2 - Eligibility Verification: Compare the status with the eligible types:
      US Citizen, Permanent Resident, Non-Permanent Resident, Foreign National, ITIN.'
    - 'Step 3 - Validation and Verification: Confirm that the recorded status is one
      of those types.'
    - 'Step 4 - Final Determination: Record whether the borrower has an eligible citizenship
      type.'
    checks:
    - Borrower.citizenship_status is one of US Citizen, Permanent Resident, Non-Permanent
      Resident, Foreign National, or ITIN.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: Borrower.citizenship_status is one of the five eligible types.
      carries_conditions: false
