- rule_id: acra-standard.appraisal_review_property_eligibility.condotel_or_pudtel_minimum_dscr
  condition:
    kind: procedure
    purpose: Verify the stated minimum DSCR for a Condotel / PUDtel.
    steps:
    - 'Initial Document Review: Review the subject property''s type and the loan''s
      DSCR calculation.'
    - 'Eligibility Verification: Apply the minimum DSCR of 1.0 to a Condotel / PUDtel.'
    - 'Validation and Verification: Verify the DSCR calculation and compare it with
      1.0.'
    - 'Final Determination: Record whether the minimum DSCR is met.'
    checks:
    - If the property is Condotel / PUDtel, DSCR is at least 1.0.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not Condotel / PUDtel, or DSCR is at least 1.0.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is Condotel / PUDtel and DSCR is below 1.0.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
    evidence_types: []
    reads:
    - SubjectProperty.property_type
    computable_checks: []
    missing_reads:
    - DSCR calculation and qualifying DSCR value
  action: require_evidence
  priority: 100
  description: Check the minimum DSCR requirement for a Condotel / PUDtel.
  citations:
