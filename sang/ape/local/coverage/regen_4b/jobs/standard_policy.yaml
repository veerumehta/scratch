- rule_id: acra-standard.income_stability_sufficiency_analysis.short_term_rental_cltv_limits
  condition:
    kind: procedure
    purpose: Determine whether a short-term rental transaction is within the stated
      maximum CLTV.
    steps:
    - 'Step 1 - Initial Document Review: Review available loan and occupancy information.'
    - 'Step 2 - Eligibility Verification: Determine whether the property qualifies
      with short-term rentals and whether the transaction is a purchase or refinance.'
    - 'Step 3 - Validation and Verification: Compare CLTV with the stated maximum:
      75% for Purchase or 70% for Refinance transactions.'
    - 'Step 4 - Final Determination: Determine whether CLTV is within the applicable
      stated maximum. Do not determine whether these caps apply to a No Ratio file;
      Acra confirmation is requested (Q-02).'
    checks:
    - For a short-term rental Purchase, CLTV is no more than 75%.
    - For a short-term rental Refinance, CLTV is no more than 70%.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The applicable CLTV check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The applicable CLTV check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property does not qualify with short-term rentals.
      carries_conditions: false
    evidence_types: []
    reads:
    - SubjectProperty.occupancy_subtype
    - LoanCore.cltv_percent
    - LoanCore.loan_purpose
    computable_checks: []
    missing_reads:
    - Whether the property qualifies with short-term rentals.
    - Whether the transaction is a Purchase or Refinance.
    - Acra confirmation on whether short-term-rental caps apply to a No Ratio file
      (Q-02).
  action: require_evidence
  priority: 100
  description: Verify the stated maximum CLTV for a short-term rental transaction.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.3 Rent schedules and rent
    evidence ¶1
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Income
      assistant:
      - Underwriter
      mnemonic: DSCR-STRLIMIT
      check_units:
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.3 Rent schedules
          and rent evidence ¶1
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.3 Rent schedules
          and rent evidence ¶1
      job_kind: limit
    ledger:
      clause: '3.3 Rent schedules and rent evidence

        STD-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA Form
        1007) for single family properties on (i) all DSCR qualifying files, (ii)
        lease-option purchase transactions where the down payment required in §3.45
        is generated from excess monthly rent contributions, or (iii) when proposed
        rental income is being used to qualify. \[G §14.12, p. 4\]


        STD-3.10 A 1007 may be from the original appraiser or any state licensed appraiser.
        \[G §14.12, p. 4\]


        STD-3.11 Single family investment properties with excessive monthly rent payments
        reflected on the lease require documentation supporting that the monthly rent
        is typical for the area; acceptable documentation may include classified ads
        from local newspapers, a 1007 completed by the appraiser, or a market rent
        survey completed by a local real estate company or rental management company
        familiar with the market rents in the area. \[G §14.12, p. 4\]


        STD-3.12 Short-term rental, appraisal form: for properties occupied as a short-term
        rental, an STRpro or similar appraisal form is acceptable as replacement to
        a 1007 as long as it is signed by an appropriately licensed appraiser. \[G
        §14.13, p. 4\]


        STD-3.13 Short-term rental, actual rents: “Acra can accept short term rentals
        with 12-month ledgers from condotel management companies, property managers,
        AirBnB, VRBO, etcetera as documentation for actual rents.” How a 12-month
        ledger establishes qualifying rent, and how the receipt and lease conditions
        of STD-3.6 apply to short-term rentals: Acra confirmation requested → Q-02.
        \[G §5.32, p. 3; §14.13, p. 4\]


        STD-3.14 Short-term rental caps: “Properties qualifying with short-term rentals
        are limited to 75% & 70% LTV / CLTV for Purchase or Refinance transactions
        respectively”; the Summary states maximum CLTV 75% (purchase) and 70% (refinance
        — rate & term and cash-out), minimum FICO 640. \[G §5.32, p. 3; S: Occupancy
        Type\]'
      clause_parts:
      - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.3 Rent schedules
          and rent evidence ¶1
        heading: 3.3 Rent schedules and rent evidence
        text: 'STD-3.9 Acra requires the Single-Family Comparable Rent Schedule (FNMA
          Form 1007) for single family properties on (i) all DSCR qualifying files,
          (ii) lease-option purchase transactions where the down payment required
          in §3.45 is generated from excess monthly rent contributions, or (iii) when
