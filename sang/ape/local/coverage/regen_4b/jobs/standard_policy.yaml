- rule_id: acra-standard.appraisal_review_property_eligibility.declining_market_cltv_reduction
  condition:
    kind: procedure
    purpose: Review the declining-market CLTV reduction and the requested confirmation
      about combining it with other caps.
    steps:
    - 'Initial Document Review: Review the property and borrower profile and information
      establishing whether the property is in a declining market.'
    - 'Eligibility Verification: Apply the stated -5% CLTV property/borrower full
      profile reduction when the property is in a declining market.'
    - 'Validation and Verification: Request Acra confirmation on how the reduction
      combines with other caps.'
    - 'Final Determination: Record the applicable reduction and whether the requested
      confirmation has been obtained.'
    checks:
    - If the property is in a declining market, the -5% CLTV property/borrower full
      profile reduction is applied.
    - If the property is in a declining market, Acra confirmation is obtained on how
      the reduction combines with other caps.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The property is not in a declining market, or the reduction is applied
        and Acra confirmation on its combination with other caps is obtained.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: The property is in a declining market and Acra confirmation on how
        the reduction combines with other caps is requested but not yet obtained.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The property is in a declining market and the stated reduction is
        not applied.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The property is not in a declining market.
      carries_conditions: false
    evidence_types:
    - appraisal_report
    reads: []
    computable_checks: []
    missing_reads:
    - Information establishing whether the property is in a declining market
    - Property/borrower full profile
    - Acra confirmation on how the reduction combines with other caps
  action: require_evidence
  priority: 100
  description: Apply the stated declining-market CLTV reduction and obtain Acra confirmation
    on how it combines with other caps.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.3 Location
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types
    and caps
  on_violation: fail
  replaces: []
