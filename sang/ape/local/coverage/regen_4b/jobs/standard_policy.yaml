- rule_id: acra-standard.loan_program_eligibility.first_time_homebuyer_requirements
  condition:
    kind: procedure
    purpose: Determine whether a first-time homebuyer loan meets Acra's stated DSCR
      restrictions.
    steps:
    - 'Initial Document Review: Review the loan application, credit report, and underwriting
      records for the first-time homebuyer loan terms and qualification data.'
    - 'Eligibility Verification: For a DSCR first-time homebuyer loan, identify the
      stated FICO, CLTV, DSCR, loan amount, amortization, impound, and reserves requirements.'
    - 'Validation and Verification: Verify each requirement against the loan terms
      and supporting records.'
    - 'Final Determination: Record whether all applicable first-time homebuyer requirements
      are met.'
    checks:
    - The FICO score is at least 700.
    - The CLTV is no more than 70%.
    - The DSCR is at least 1.150.
    - The loan amount is no more than $1,000,000.
    - The loan is fully amortizing.
    - The loan is not an interest-only program.
    - Impounds are required.
    - Reserves are at least six months.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The borrower is a first-time homebuyer qualifying under DSCR, every
        step is met, and every check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The borrower is a first-time homebuyer qualifying under DSCR and
        a step is not met or a check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The borrower is not a first-time homebuyer or the loan is not qualifying
        under DSCR.
      carries_conditions: false
    evidence_types:
    - loan_application
    - credit_report
    - bank_statement
    reads:
    - Borrower.is_first_time_homebuyer
    - LoanCore.dscr_qualification_method
    - CreditReport.representative_score
    - LoanCore.cltv_percent
    - LoanCore.total_loan_amount_usd
    - MortgageLoanInformation.is_interest_only
    - LoanCore.is_escrow_waived
    - RatioSet.reserves_months
    computable_checks:
    - 0
    - 1
    - 3
    - 5
    - 7
    missing_reads:
    - DSCR value
    - Whether the loan is fully amortizing
    - Whether impounds are required
  action: require_evidence
  priority: 100
  description: Verify each published DSCR condition that applies to a first-time homebuyer.
  citations:
  - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.3 First-time homebuyers
  on_violation: fail
  replaces: []
  domain_extensions:
    jtbd:
      source: NEW
      section_type: Eligibility
      assistant:
      - Underwriter
      mnemonic: BOR-FTHBRESTRICTIONS
      check_units:
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.3 First-time homebuyers
      - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#4.3 First-time homebuyers
