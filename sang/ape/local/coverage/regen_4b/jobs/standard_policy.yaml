- rule_id: acra-standard.loan_program_eligibility.interest_only_exclusions
  condition:
    kind: procedure
    purpose: Apply the stated restrictions on interest-only availability.
    steps:
    - 'Initial Document Review: Review the loan application for interest-only status,
      first-time homebuyer status, property vacancy, loan purpose, and listing status.'
    - 'Eligibility Verification: Identify whether any stated interest-only exclusion
      applies.'
    - 'Validation and Verification: Verify first-time homebuyer status, whether the
      refinance is of a vacant property, and whether the property is listed for sale.'
    - 'Final Determination: Record whether the interest-only loan is barred by a stated
      exclusion.'
    checks:
    - An interest-only loan is not made to a first-time homebuyer.
    - An interest-only loan is not a refinance of a vacant property.
    - An interest-only loan is not on a property listed for sale.
    outcomes:
    - status: PASS
      verdict: satisfied
      criterion: The loan is interest-only, every step is met, and every check holds.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: The loan is interest-only and an exclusion check does not hold.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: The loan is not interest-only.
      carries_conditions: false
    evidence_types:
    - loan_application
    - listing_history
    reads:
    - MortgageLoanInformation.is_interest_only
    - Borrower.is_first_time_homebuyer
    - SubjectProperty.is_vacant
    - LoanCore.loan_purpose
    - SubjectProperty.is_listed_for_sale
    computable_checks:
    - 0
    - 1
    - 2
    missing_reads: []
