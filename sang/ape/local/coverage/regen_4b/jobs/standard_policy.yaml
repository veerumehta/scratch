    - status: PASS
      verdict: satisfied
      criterion: FICO is not below 620, or at least 12 Months of reserves are verified.
      carries_conditions: false
    - status: CONDITIONAL
      verdict: satisfied
      criterion: There is no case for this outcome.
      carries_conditions: true
    - status: FAIL
      verdict: violated
      criterion: FICO is below 620 and at least 12 Months of reserves are not verified.
      carries_conditions: false
    - status: NOT_APPLICABLE
      verdict: not_applicable
      criterion: There is no case for this outcome.
      carries_conditions: false
