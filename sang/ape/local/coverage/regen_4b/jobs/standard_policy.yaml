      requirements in §10.17.'
    - 'Validation and Verification: Verify each requirement and request Acra confirmation
      for a loan amount exactly $1,000,000 or $2,000,000.'
    - 'Final Determination: Record whether the requirements are met and whether confirmation
      remains outstanding.'
    checks:
    - If the property is vacant and the transaction is a rate and term refinance,
      the minimum FICO score is 700.
    - If the property is vacant and the transaction is a rate and term refinance,
      a loan amount under $1,000,000 has a maximum 70% CLTV.
    - If the property is vacant and the transaction is a rate and term refinance,
      a loan amount under $2,000,000 has a maximum 65% CLTV.
