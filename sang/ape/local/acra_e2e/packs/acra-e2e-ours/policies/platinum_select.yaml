            on credit should be considered; where the applicant has mortgages that
            are not reported, the file should contain documentation to evaluate history
            on the applicant''s primary residence(s), any secondary residence(s),
            and the subject property. \[G §4.15, p. 5\]


            PLAT-6.11 DSCR loans only require documentation on the subject property,
            principal residence, and second home (if any) of the borrower and / or
            guarantor(s). Additional properties do not require housing history to
            be documented unless documents in the file suggest a major credit event
            has occurred, for example a foreclosure listing the borrower (individually
            or as guarantor) on the credit report. For DSCR loans, the payment history
            is required for the primary residence, subject property, and second homes,
            if applicable. \[G §4.15, p. 5; §6.7, p. 6\]


            PLAT-6.12 Loans that have matured are rated based on the maturity date
            of the loan; any extensions of the maturity date must be in writing. \[G
