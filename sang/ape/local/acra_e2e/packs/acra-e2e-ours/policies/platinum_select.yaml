  - rule_id: acra-platinum.appraisal_review_property_eligibility.ineligible_state
    condition:
      kind: procedure
      purpose: Determine whether the subject property is in SD or a U.S. territory.
      steps:
      - 'Step 1 - Initial Document Review: Review the appraisal report for the subject
        property''s location.'
      - 'Step 2 - Eligibility Verification: Compare the property state with the ineligible
        locations listed for non-owner-occupied properties.'
      - 'Step 3 - Validation and Verification: Verify the state recorded for the subject
        property.'
      - 'Step 4 - Final Determination: Determine whether the property is in SD or
        a U.S. territory.'
      checks:
      - SubjectProperty.state is not SD or a U.S. territory.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The subject property is not in SD or a U.S. territory.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The subject property is in SD or a U.S. territory.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.state
      computable_checks:
      - 0
      missing_reads: []
    action: require_evidence
    priority: 100
    description: Check whether the subject property's state is an ineligible location
      for non-owner-occupied properties.
