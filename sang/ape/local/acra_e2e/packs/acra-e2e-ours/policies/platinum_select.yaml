  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.required_entity_guarantors
    condition:
      kind: procedure
      purpose: Determine whether the required individuals provide the required recourse
        guarantees for an entity borrower.
      steps:
      - 'Initial Document Review: Review entity ownership documents and the loan file
        for direct and indirect ownership interests and submitted guarantees.'
      - 'Eligibility Verification: Identify all individuals with direct or indirect
        ownership ≥ 20% of the entity borrower.'
      - 'Validation and Verification: Verify that each identified individual provides
        an Acra approved recourse guarantee or Exhibit 7; where there are multiple
        guarantors, verify that all recourse is joint and several.'
      - 'Final Determination: Record whether every required guarantee is present and
        meets the stated requirements.'
      checks:
      - All individuals with direct or indirect ownership ≥ 20% provide a recourse
        guarantee (Acra approved, or Exhibit 7).
      - All recourse is joint and several where there are multiple guarantors.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every required guarantor provides the required recourse guarantee,
          and recourse is joint and several when there are multiple guarantors.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A required recourse guarantee is absent or does not meet the stated
          requirement.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no entity borrower.
        carries_conditions: false
      evidence_types:
      - entity_documents
      - loan_application
      reads:
      - Borrower.entity_type
      computable_checks: []
      missing_reads:
      - Each individual’s direct and indirect ownership percentage.
      - The identity and number of guarantors.
      - Whether each submitted guarantee is Acra approved or Exhibit 7.
      - Whether the guarantees provide joint and several recourse when there are multiple
        guarantors.
    action: require_evidence
    priority: 100
    description: Identify each individual with direct or indirect ownership of at
      least 20% and verify the required recourse guarantee and joint-and-several recourse.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity eligibility
      and guarantees ¶1
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: 'Compliance and Closing: the borrowing entity and title'
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity
            eligibility and guarantees ¶1
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity
            eligibility and guarantees ¶1
        job_kind: verification
      ledger:
        clause: '5.1 Entity eligibility and guarantees

          PLAT-5.1 Business Entities are eligible for financing on business purpose
          transactions (investment properties exclusively). \[G §3.12, p. 7\]


          PLAT-5.2 Acra will lend to, and require that title to the collateral be
          held, either (i) directly by an individual person(s) or (ii) by an entity
          acceptable to Acra in its sole discretion. \[G §3.12, p. 7\]


          PLAT-5.3 Acra requires all individuals with direct or indirect ownership
          ≥ 20% to provide a recourse guarantee (Acra approved, or Exhibit 7) in the
          case of an entity borrower. All recourse is joint and several in the case
          of multiple guarantors. \[G §3.12, p. 7\]


          PLAT-5.4 An entity borrower must be a single purpose entity (SPE): “an entity
          with no assets other than residential investment or rental properties; engaged
          in the business of owning and operating residential investment or rental
          properties.” Series limited liability companies are not allowed. \[G §3.12,
          p. 7\]


          PLAT-5.5 All entities that will hold direct ownership of the subject property
          and will be on title as a direct owner are required to be a borrowing entity.
          \[G §3.12, p. 7\]


          PLAT-5.6 Changes to the operating agreement or bylaws with the intent of
          changing ownership percentages to circumvent required personal guarantors
          will not be considered. “Lookback to changes cannot occur within 30 days
          prior to an Application Date or throughout the application process as these
          changes will not be recognized by Acra Lending.” \[G §3.12, p. 7\]


          PLAT-5.7 Entity / guarantor types allowed: Domestic Corporations (C and
          S Corp); single purpose Limited Liability Companies (LLC), excluding series
          LLC; Limited Liability Partnership (LLP); Limited Liability Limited Partnership
          (LLLP); General Partnership (GP); Limited Partnership (LP); and Sole Proprietorship.
          “In all events, the Borrower must be a US formed and based Entity, foreign
          entities (i.e.: entities formed or based outside the US) or foreign owned
          entities are not allowed.” \[G §3.12, p. 8\]'
        clause_parts:
        - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1
