      kind: procedure
      purpose: Verify reserves equal to two (2) months for every one (1) month of
        rent loss insurance coverage not provided.
      steps:
      - 'Initial Document Review: Review hazard insurance documentation and available
        documentation of assets and reserves.'
      - 'Eligibility Verification: Determine whether rent loss insurance is required
        but cannot be obtained.'
      - 'Validation and Verification: If rent loss insurance is required but cannot
        be obtained, verify two (2) months reserves for every one (1) month of coverage
        not provided.'
      - 'Final Determination: Record whether the stated reserve requirement is met;
        do not assume a payment basis or a coverage period not established by the
        evidence.'
      checks:
      - Rent loss insurance is required but cannot be obtained.
      - When rent loss insurance is required but cannot be obtained, reserves are
        verified at two (2) months for every one (1) month of coverage not provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Rent loss insurance is required but cannot be obtained, and reserves
          are verified at two (2) months for every one (1) month of coverage not provided.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Rent loss insurance is required but cannot be obtained, and the
          stated reserve amount is not verified.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Rent loss insurance is not required or can be obtained.
        carries_conditions: false
      evidence_types:
      - hazard_insurance
      - bank_statement
      reads: []
      computable_checks: []
      missing_reads:
      - Whether rent loss insurance is required but cannot be obtained.
      - Number of months of coverage not provided.
      - Evidence of reserves and the payment basis for calculating reserves.
    action: require_evidence
    priority: 100
    description: Apply the stated reserve requirement when required rent loss insurance
      cannot be obtained.
