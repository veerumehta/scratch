  - rule_id: acra-platinum.appraisal_review_property_eligibility.property_type_status
    condition:
      kind: procedure
      purpose: Determine the policy status of the subject property type without assuming
        that a feature not addressed is either eligible or ineligible.
      steps:
      - 'Step 1 - Initial Document Review: Review the appraisal report for the subject
        property''s type and features.'
      - 'Step 2 - Eligibility Verification: Compare the reported type and features
        with the expressly eligible and expressly ineligible types in PLAT-7.1 and
        PLAT-7.2.'
      - 'Step 3 - Validation and Verification: Identify whether the property type
        is expressly eligible, expressly ineligible, or not addressed in the Platinum
        Summary.'
      - 'Step 4 - Final Determination: Record the applicable status; for features
        not addressed, refer the question as Q-07 rather than assuming either status.'
      checks:
      - The subject property type is classified as expressly eligible, expressly ineligible,
        or not addressed in the Platinum Summary.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: 'The property type is expressly eligible: SFR, Townhome, PUD, Warrantable
          Condo, or Two-Units.'
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property type or feature is not addressed in the Platinum Summary
          and is referred as Q-07 rather than assumed either way.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: 'The property type is expressly ineligible: Rural Properties, Condotels,
          Non-Warrantable Condos, or Short-Term Rentals.'
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.property_type
      - SubjectProperty.is_mixed_use
      - SubjectProperty.number_of_units
      - SubjectProperty.is_rural
