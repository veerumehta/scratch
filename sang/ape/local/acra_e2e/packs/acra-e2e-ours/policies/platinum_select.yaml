        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#8.2 Reserves
            by trigger, as stated
        job_kind: limit
      ledger:
        clause: 'PLAT-8.7 The sources state reserves only for the situations below
          and state the payment basis in none of them. The base requirement at CLTV
          of 75.00% or below, the payment basis (including on an interest-only loan),
          permitted sources, whether overlapping triggers are cumulative, and whether
          reserves substituted for rent loss insurance are additional: Acra confirmation
          requested → Q-08. \[P; G\]


          | **Trigger** | **Reserves as printed** | **Source** |

          |----|----|----|

          | CLTV \> 75.00% | “6-months Reserves required for CLTV \> 75.00%” | P:
