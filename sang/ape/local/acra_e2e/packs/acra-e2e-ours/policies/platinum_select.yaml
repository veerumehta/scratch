  - rule_id: acra-platinum.identification_requirements.application_non_fthb_attestation
    condition:
      kind: procedure
      purpose: Verify the application attestation requirement stated in PLAT-4.5 and
        attributed there to §3.12 and PLAT-5.9. Whether it applies to individual borrowers
        as well as entities is part of Q-13.
      steps:
      - 'Initial Document Review: Review the loan application for a borrower or guarantor
        attestation concerning first-time-homebuyer status.'
      - 'Eligibility Verification: Identify whether at least one borrower or guarantor
        is required to provide the stated attestation; applicability to individual
        borrowers as well as entities is part of Q-13.'
      - 'Validation and Verification: Verify that at least one borrower / guarantor
        attests on the application that they are not a first-time homebuyer.'
      - 'Final Determination: Determine whether the application attestation requirement
        is met.'
      checks:
      - At least one borrower / guarantor attests on the application that they are
        not a first-time homebuyer.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: At least one borrower / guarantor attests on the application that
          they are not a first-time homebuyer.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: No borrower / guarantor attests on the application that they are
          not a first-time homebuyer.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - loan_application
      reads:
      - Borrower.is_first_time_homebuyer
      computable_checks: []
      missing_reads: []
