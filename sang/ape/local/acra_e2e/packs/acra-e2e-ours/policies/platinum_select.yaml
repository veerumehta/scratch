  - rule_id: acra-platinum.asset_assessment_assets_and_funds_to_close.high_cltv_reserves
    condition:
      kind: procedure
      purpose: Verify the stated six-month reserves requirement for loans with CLTV
        over 75.00%.
      steps:
      - 'Initial Document Review: Review available documentation of assets and reserves.'
      - 'Eligibility Verification: Determine whether CLTV is over 75.00%.'
      - 'Validation and Verification: If CLTV is over 75.00%, verify six-months reserves.
        Do not assume a payment basis, which is not stated.'
      - 'Final Determination: Record whether the stated reserve requirement is met,
        noting that the source does not state the payment basis.'
      checks:
      - CLTV is over 75.00%.
      - When CLTV is over 75.00%, six-months reserves are verified.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: CLTV is over 75.00% and six-months reserves are verified.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: CLTV is over 75.00% and six-months reserves are not verified.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: CLTV is 75.00% or below.
        carries_conditions: false
      evidence_types:
      - bank_statement
      reads:
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      missing_reads:
      - Evidence of reserves.
      - Payment basis for calculating reserves.
    action: require_evidence
    priority: 100
    description: Apply the stated reserve requirement when CLTV is over 75.00%.
