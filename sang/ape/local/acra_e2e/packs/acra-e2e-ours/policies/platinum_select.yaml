  - rule_id: acra-platinum.credit_review_analysis_credit.decisioning_score
    condition:
      kind: procedure
      purpose: Establish the decisioning credit score used for the credit requirements.
      steps:
      - 'Initial Document Review: Review the credit report and, for a loan closing
        in the name of an entity, the entity documents and loan application for the
        personal guarantors and ownership information.'
      - 'Eligibility Verification: For a non-entity loan, identify the Primary Wage
        Earner middle score. For an entity loan, use the highest middle score of the
        personal guarantors when ownership percentages are equal; if ownership percentages
        differ, use the individual with the highest concentration of ownership.'
      - 'Validation and Verification: Verify the score and, where applicable, ownership
        information against the reviewed documents. Do not assume a decisioning-score
        rule for one or two scores, no-score cases, or equal largest ownership interests
        where ownership is not equal across all guarantors; those matters are identified
        as requiring Acra confirmation.'
      - 'Final Determination: Record the decisioning score only when the applicable
        selection rule establishes it; otherwise record that the score cannot be determined
        under the stated rule and that confirmation is requested.'
