  - rule_id: acra-platinum.asset_assessment_assets_and_funds_to_close.funds_seasoning_verification_trigger
    condition:
      kind: procedure
      purpose: Determine whether the loan meets a stated trigger requiring verification
        of seasoning of funds to close.
      steps:
      - 'Initial Document Review: Review the transaction information and funds-to-close
        documentation available.'
      - 'Eligibility Verification: Determine whether CLTV is over 70% and whether
        the transaction is a consumer transaction, or is a business purpose loan with
        funds to close over $50,000.'
      - 'Validation and Verification: If a stated trigger applies, verify seasoning
        of funds to close using the applicable source-of-funds documentation.'
      - 'Final Determination: Record whether seasoning verification is required and,
        when required, whether it is verified. Do not assign a consumer-transaction
        classification from the source, which leaves that question open.'
      checks:
      - CLTV is over 70% and the loan is a consumer transaction, or the loan is a
        business purpose loan with funds to close over $50,000 and CLTV is over 70%.
      - When the stated trigger applies, seasoning of funds to close is verified.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: A stated trigger applies and seasoning of funds to close is verified.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A stated trigger applies and seasoning of funds to close is not
          verified.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Neither stated trigger applies.
        carries_conditions: false
      evidence_types:
      - bank_statement
      reads:
      - LoanCore.cltv_percent
      - LoanCore.loan_purpose
      computable_checks: []
      missing_reads:
      - Whether the loan is a consumer transaction.
      - Funds-to-close amount.
      - Evidence establishing seasoning of funds to close.
