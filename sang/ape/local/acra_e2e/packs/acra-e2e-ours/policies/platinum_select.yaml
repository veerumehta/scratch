  - rule_id: acra-platinum.loan_program_eligibility.listed_for_sale_prepayment_term
    condition:
      kind: procedure
      purpose: Verify the stated minimum prepayment penalty term when the property
        was listed for sale within six months.
      steps:
      - 'Initial Document Review: Review listing history, the loan application, and
        the subject property state for the listing period, selected prepayment penalty
        term, and state.'
      - 'Eligibility Verification: For a property listed for sale within six months,
        require a prepayment penalty of at least three (3) years unless the property
        is in a state that does not allow prepayment penalties.'
      - 'Validation and Verification: Verify the listing period, selected term, and
        any applicable state restriction from the source evidence. Do not resolve
        an interaction between the state restriction and the minimum term beyond the
        source wording.'
      - 'Final Determination: Record whether the stated minimum term applies and is
        met, subject to the printed state exception.'
      checks:
      - If SubjectProperty.listed_for_sale_last_6_months is true and the property
        is not in a state that does not allow prepayment penalties, the prepayment
        penalty term is at least three (3) years.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property was not listed for sale within six months, or the
          applicable minimum term is met under the stated exception.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property was listed for sale within six months, the state exception
          does not apply, and the prepayment penalty term is less than three (3) years.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property was not listed for sale within six months.
        carries_conditions: false
      evidence_types:
      - listing_history
      - loan_application
      reads:
      - SubjectProperty.listed_for_sale_last_6_months
      - SubjectProperty.state
      - LoanCore.prepayment_penalty_structure
      missing_reads:
      - The selected prepayment penalty term
      - Whether the property is in a state that does not allow prepayment penalties
      - How a state restriction interacts with the three-year minimum
    action: require_evidence
    priority: 100
    description: Apply the minimum three-year prepayment penalty term for a property
      listed for sale within six months, subject to the printed state exception.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#10.1 Structures
