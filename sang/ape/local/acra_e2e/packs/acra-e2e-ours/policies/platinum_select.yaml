          heading: 5.2 Entity documentation
          text: 'PLAT-5.10 The documents below are required, without exception, and
            borrower letters stating that they are not required, available, or excused
            from providing such documents are not acceptable. \[G §3.12, pp. 8–9\]


            - Complete, legible copy of the Certificate of Formation / Articles of
            Organization and all amendments thereto.


            - Complete (with all referenced exhibits), legible copy of the Operating
            Agreement for LLCs and Partnerships, or Bylaws for corporations, and all
            amendments, that states whether the entity is member or manager managed,
            contains authorization to borrow money and enter into contracts for mortgage
            assets, and designates signers. Additional information may be required
            if the formation documents and the Operating Agreement or Bylaws conflict.


            - All documentation evidencing ownership interests: for LLCs and Partnerships,
            the Operating Agreement must identify, or attach as an exhibit, all persons
            by name with their ownership interest, or provide copies of the membership
            interest certificates / units in compliance with the Operating Agreement.


            - For S or C Corporations: shareholder / stockholder certificates that
            comply with the Bylaws, if any, or, if stock certificates are lost or
            unavailable, the corporation''s stock ledger. The certificate or ledger
            must account for all outstanding shares noted in the Certificate of Formation
            / Articles of Organization, including those held by the corporation. If
            stock certificates are lost, destroyed, mutilated, or otherwise unavailable,
            an Affidavit of Lost Stock Certificate is required.


