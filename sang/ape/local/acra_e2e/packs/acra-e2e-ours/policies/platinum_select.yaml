  - rule_id: acra-platinum.insurance_coverage_sufficiency_policy_assessment.rent_loss_insurance_applicability
    condition:
      kind: procedure
      purpose: Determine whether rent loss insurance is required for the subject property.
      steps:
      - 'Step 1 - Initial Document Review: Review the available case information for
        the subject property''s unit count, occupancy, and whether its rents are used
        to qualify.'
      - 'Step 2 - Eligibility Verification: Determine whether the property is a one-
        to four-unit non-owner occupied income property, whether subject property
        rents are used to qualify, and whether LTV exceeds 70%.'
      - 'Step 3 - Validation and Verification: Apply the stated exemption for loans
        with ≤ 70% CLTV. If LTV is at or below 70% and CLTV is above 70%, request
        Acra confirmation (Q-10).'
      - 'Step 4 - Final Determination: Record whether rent loss insurance is required,
        not required, or awaiting Acra confirmation for the specified LTV/CLTV case.'
      checks:
      - The subject property has one to four units.
      - The subject property is non-owner occupied.
      - Subject property rents are used to qualify.
      - The loan's LTV is greater than 70%.
      - The loan's CLTV is ≤ 70%.
      - For a loan with LTV at or below 70% and CLTV above 70%, Acra confirmation
        has been obtained.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property and loan meet the stated conditions for rent loss
          insurance, and the CLTV exemption does not apply.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: LTV is at or below 70% and CLTV is above 70%; Acra confirmation
          (Q-10) has been requested but is not yet obtained.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: There is no case for this outcome.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The stated conditions for rent loss insurance are not met, or the
          loan has ≤ 70% CLTV and the specified LTV/CLTV case does not require Acra
          confirmation.
        carries_conditions: false
      evidence_types: []
      reads:
      - SubjectProperty.number_of_units
      - SubjectProperty.occupancy_subtype
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      - 1
      - 4
      missing_reads:
      - Whether subject property rents are used to qualify
      - The loan's LTV
      - Acra confirmation for the case with LTV at or below 70% and CLTV above 70%
    action: require_evidence
    priority: 100
    description: Determine whether the subject property meets the stated conditions
      for rent loss insurance, applying the CLTV exemption and flagging the specified
      LTV/CLTV case for Acra confirmation.
