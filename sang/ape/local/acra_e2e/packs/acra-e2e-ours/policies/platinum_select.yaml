  - rule_id: acra-platinum.unassigned_provisions.no_ratio_or_sub_1_0_dscr_treatment
    condition:
      kind: procedure
      purpose: The Platinum Summary states channel minimum DSCRs but does not address
        No Ratio DSCR or ratios below those minimums; the treatment is an open question.
      steps:
      - 'Initial Document Review: Review the loan’s DSCR qualification method, channel,
        and available rental-income and debt-service information.'
      - 'Eligibility Verification: Identify whether the case involves No Ratio DSCR
        or a DSCR below the stated channel minimum.'
      - 'Validation and Verification: Do not import the Standard Summary rule or treat
        the feature as prohibited; mark the Platinum Select treatment as requiring
        confirmation.'
      - 'Final Determination: Refer the open treatment for confirmation; do not determine
        eligibility from the unanswered question.'
      checks:
      - The case involves No Ratio DSCR or a DSCR below the stated channel minimum.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The case involves No Ratio DSCR or a DSCR below the stated channel
          minimum, and the Platinum Select treatment remains subject to confirmation.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: There is no case for this outcome.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The case does not involve No Ratio DSCR or a DSCR below the stated
          channel minimum.
        carries_conditions: false
      evidence_types: []
      reads:
      - LoanCore.dscr_qualification_method
      - LoanCore.channel
      missing_reads:
      - The calculated DSCR and the qualifying rental-income and debt-service data
        needed to establish it.
