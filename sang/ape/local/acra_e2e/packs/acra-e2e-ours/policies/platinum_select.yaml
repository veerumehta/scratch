  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.entity_borrower_eligibility
    condition:
      kind: procedure
      purpose: Determine whether the borrowing entity is eligible for financing and
        may hold title under the stated entity eligibility rules.
      steps:
      - 'Initial Document Review: Review the loan application and entity documents
        to identify the borrower, the entity’s formation and business location, the
        transaction purpose, the entity type, and any ownership nesting.'
      - 'Eligibility Verification: Determine whether the transaction is business purpose
        and the property is exclusively an investment property; whether the borrower
        is a US formed and based Entity; and whether the entity type is allowed. Check
        for disallowed entity types and whether any subsidiary structure exceeds one
        wholly-owned subsidiary owned by individual(s).'
      - 'Validation and Verification: Verify the entity type, formation and business
        location, transaction purpose, and ownership structure against the reviewed
        documents. Determine whether the entity is acceptable to Acra in its sole
        discretion.'
      - 'Final Determination: Record whether the proposed borrowing entity satisfies
        the applicable entity eligibility requirements.'
      checks:
      - The transaction is business purpose and the property is exclusively an investment
        property.
      - The borrower is a US formed and based Entity, and is not a foreign entity
        or foreign owned entity.
      - The entity type is one of the allowed types and is not a disallowed type.
      - Business entity nesting is limited to only one (1) wholly-owned subsidiary
        that in turn is owned by individual(s), with no multiple nesting or ownership
        by multiple entities, trusts, etcetera.
      - The entity is acceptable to Acra in its sole discretion.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every entity eligibility check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An entity eligibility check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - loan_application
      - entity_documents
      reads:
      - Borrower.entity_type
      - LoanCore.loan_purpose
      computable_checks: []
      missing_reads:
      - Transaction purpose and whether the property is exclusively an investment
        property.
      - Whether the entity is US formed and based, or is foreign formed, foreign based,
        or foreign owned.
      - The entity’s precise legal type, including whether an LLC is a series LLC.
      - The entity ownership chain, including whether a subsidiary is wholly-owned
        and owned by individual(s), and whether any other entities or trusts own it.
      - Acra’s determination whether the entity is acceptable in its sole discretion.
    action: require_evidence
    priority: 100
    description: Determine whether the proposed borrowing entity is eligible under
      the entity-type, formation, transaction-purpose, and ownership-structure requirements.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity eligibility
      and guarantees ¶1
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.1 Entity eligibility
      and guarantees ¶2
