  - rule_id: acra-platinum.loan_program_eligibility.matrix_fico_and_cltv
    condition:
      kind: procedure
      purpose: Apply the printed FICO and CLTV matrix to the loan purpose and verify
        the applicable maximum CLTV.
      steps:
      - 'Initial Document Review: Review the credit report and loan application for
        the representative score, loan purpose, and CLTV.'
      - 'Eligibility Verification: Apply the printed matrix: at 730 and above, Purchase
        80%, Rate & Term 80%, Cash-Out 75%; at 721–729, Purchase 80%, Rate & Term
        80%, Cash-Out 65%; at 700–720, Purchase 80%, Rate & Term 80%, Cash-Out 55%.
        No row is printed below 700.'
      - 'Validation and Verification: Verify the recorded score, purpose, and CLTV
        against the source evidence and the applicable printed matrix row.'
      - 'Final Determination: Record whether the score has a printed row and the CLTV
        does not exceed its applicable matrix maximum.'
      checks:
      - CreditReport.representative_score is at least 700.
      - For Purchase, Rate & Term Refinance, or Cash-Out Refinance with a representative
        score of at least 700, LoanCore.cltv_percent does not exceed the maximum in
        the applicable printed FICO row and loan-purpose column.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The representative score is at least 700 and the CLTV does not
          exceed the applicable printed matrix maximum.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
