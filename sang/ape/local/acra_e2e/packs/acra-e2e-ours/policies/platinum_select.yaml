        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#4. Borrower
            eligibility
        job_kind: verification
        mapped_reads:
        - text: The loan application and its borrower / guarantor first-time-homebuyer
            attestation.
          field: Borrower.is_first_time_homebuyer
          how: judged
      ledger:
        clause: 'The Platinum Summary lists two eligible citizenship types and excludes
          first-time homebuyers. Borrowing entities, guarantors and trusts follow
          the Seller''s Guide excerpt and are in section 5.


          PLAT-4.1 Eligible borrower citizenship types: US Citizen, Permanent Resident.
          \[P: Borrower Citizenship Requirements\]


          PLAT-4.2 Permanent Resident must have an unexpired PRA ID and SSA card /
          SSA-89. \[P: Borrower Citizenship Requirements\]


          PLAT-4.3 Non-permanent residents, foreign nationals and ITIN borrowers are
          not among the listed eligible types. The Seller''s Guide foreign-national
