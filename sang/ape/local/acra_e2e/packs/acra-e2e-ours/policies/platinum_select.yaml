  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.entity_ownership_change_recognition
    condition:
      kind: procedure
      purpose: Determine whether a change to an operating agreement or bylaws is excluded
        from consideration under the stated timing rule.
      steps:
      - 'Initial Document Review: Review the operating agreement or bylaws and amendments
        for changes to ownership percentages.'
      - 'Eligibility Verification: Determine whether a change was made with the intent
        of changing ownership percentages to circumvent required personal guarantors.'
      - 'Validation and Verification: Compare the effective date of any such change
        with the Application Date and the application process.'
      - 'Final Determination: Do not recognize a change made with that intent within
        30 days prior to an Application Date or throughout the application process.'
      checks:
      - A change to the operating agreement or bylaws made with the intent of changing
        ownership percentages to circumvent required personal guarantors is not recognized
        if made within 30 days prior to an Application Date or throughout the application
        process.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: No ownership-percentage change subject to the timing rule is recognized,
          or no such change was made within the stated period.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A change made with the stated intent within 30 days prior to an
          Application Date or throughout the application process is recognized.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no entity borrower.
        carries_conditions: false
      evidence_types:
      - entity_documents
      reads:
      - Borrower.entity_type
      computable_checks: []
      missing_reads:
