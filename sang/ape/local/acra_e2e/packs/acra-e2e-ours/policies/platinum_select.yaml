  - rule_id: acra-platinum.income_stability_sufficiency_analysis.calculate_dscr
    condition:
      kind: procedure
      purpose: Establish the DSCR using the program's stated qualifying rent, denominator,
        and payment basis.
      steps:
      - 'Step 1 - Initial Document Review: Review the Form 1007 or 1025 for market
        rent and any lease and rent-receipt evidence for actual rent being considered.'
      - 'Step 2 - Eligibility Verification: Identify the market rent and actual rent
        amounts applicable to the calculation; actual rent must meet the program''s
        stated documentation and lease-duration requirements and is for long-term
        rents only.'
      - 'Step 3 - Validation and Verification: Calculate qualifying rent as the greater
        of market rent as established on the 1007 or 1025, or actual rent. Calculate
        the denominator using annual PITIA and subordinate financing, if applicable,
        and use the first payment due under the terms of the Note.'
      - 'Step 4 - Final Determination: Record the resulting DSCR.'
      checks:
      - Qualifying rent is the greater of market rent as established on the 1007 or
        1025, or actual rent.
      - The denominator is the sum of annual principal, interest, real estate taxes,
        property insurance, homeowner's / condominium association fees (PITIA), and
        subordinate financing, if applicable.
      - The DSCR utilizes the first payment due under the terms of the Note.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every check holds and the DSCR is calculated.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A check does not hold or the DSCR cannot be calculated using the
          stated requirements.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      - lease_agreement
      - bank_statement
      reads: []
      computable_checks: []
      missing_reads:
      - Market rent established on the 1007 or 1025
      - Actual rent amount, if used
      - Annual principal, interest, real estate taxes, property insurance, and homeowner's
        / condominium association fees
      - Subordinate financing amount, if applicable
      - The first payment due under the terms of the Note
      - Calculated DSCR
    action: require_evidence
    priority: 100
    description: Calculate DSCR using the qualifying-rent and denominator rules stated
      for the program.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying
      rent, as printed in the Platinum Summary
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The ratio
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: Income
        assistant:
        - Underwriter
        mnemonic: DSCR-DSCRCALCULATION
        check_units:
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1 Qualifying
            rent, as printed in the Platinum Summary
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The
            ratio
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.2 The
            ratio
        job_kind: limit
      ledger:
        clause: 'PLAT-3.1 “When calculating the DSCR, Acra will use the greater of
          the market rent as established on the 1007 or 1025, or actual rent. When
          using actual rent, the actual rent must be documented via evidence of 2
          months’ proof of receipts and the lease must be in place for at least 3
          months after the loan closing. This applies to long-term rents only and
          is not appropriate for short-term rentals.” \[P: Income Documentation &
          Debt Ratio Requirements\]


          PLAT-3.2 §5.32 of the excerpt states the general formula as “the lesser
          of (i) annual in-place rent or (ii) market rent”, then notes that “Acra
          may use the higher of actual or market rents” subject to “two (2) consecutive
          months proof of rental income receipt”, a lease continuing at least three
          months after closing, and: “Security Deposit does not count towards receipt,
          and the rents cannot be prepaid.” The Platinum Summary''s statement (PLAT-3.1)
          is program-specific; the excerpt''s general formula is reproduced here.
          Which governs Platinum Select and how they relate, whether “2 months’ proof
          of receipts” means consecutive months, and whether the security-deposit
          and prepaid-rent conditions apply: Acra confirmation requested → Q-03. \[G
          §5.32, p. 3\]


          PLAT-3.3 Short-term rentals are ineligible for the program (PLAT-7.2); the
          Seller''s Guide provisions on short-term rental income and appraisal forms
          are not restated (Appendix B). \[P: Subject Property Requirements\]


          PLAT-3.4 Denominator, per §5.32: “the sum of annual principal, interest,
          real estate taxes, property insurance, and homeowner''s / condominium association
          fees (collectively, ‘PITIA’). Subordinate financing, if applicable, would
          also be included in the denominator for the sake of this calculation.” \[G
          §5.32, p. 3\]


          PLAT-3.5 “Acra calculates the DSCR utilizing the first payment due under
          the terms of the Note.” §7.5 defines Interest Only payments as “the amount
          sufficient to pay the accrued interest to the mortgage on a monthly basis
          at the time of origination”, while the §5.32 denominator lists “annual principal,
          interest …”. Which payment enters the DSCR denominator on an interest-only
          loan: Acra confirmation requested → Q-21. \[G §7.5, p. 13; §5.32, p. 3\]


          PLAT-3.6 The reference to subordinate financing in the denominator is a
          calculation rule; it does not itself establish that a subordinate lien is
          permitted. The Platinum Summary does not address subordinate financing or
          restate the Standard Summary''s HELOC calculation: Acra confirmation requested
          → Q-15. \[G §5.32, p. 3\]'
        clause_parts:
        - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#3.1
            Qualifying rent, as printed in the Platinum Summary
          heading: ''
          text: 'PLAT-3.1 “When calculating the DSCR, Acra will use the greater of
