  - rule_id: acra-platinum.loan_program_eligibility.non_owner_occupied_status
    condition:
      kind: procedure
      purpose: Determine the named fact of whether the property is non-owner occupied
        and leased and occupied as a principal year-round residence by individuals
        other than the owner.
      steps:
      - 'Initial Document Review: Review the loan application and any lease agreement
        or rent roll for the subject property’s occupancy and lease information.'
      - 'Eligibility Verification: Determine whether the property is non-owner occupied.'
      - 'Validation and Verification: Verify from the occupancy and lease evidence
        whether the dwelling is leased and occupied as a principal year-round residence
        by individuals other than the owner.'
      - 'Final Determination: Record whether the property meets the non-owner-occupied
        requirement.'
      checks:
      - SubjectProperty.occupancy_subtype indicates non-owner occupancy.
      - The dwelling is leased and occupied as a principal year-round residence by
        individuals other than the owner.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is non-owner occupied and is leased and occupied as
          a principal year-round residence by individuals other than the owner.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is owner occupied, or it is not leased and occupied
          as a principal year-round residence by individuals other than the owner.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - loan_application
      - lease_agreement
      - rent_roll
      reads:
      - SubjectProperty.occupancy_subtype
      computable_checks:
      - 0
      missing_reads:
      - Whether the dwelling is occupied as a principal year-round residence by individuals
        other than the owner
