          treatment remains subject to confirmation.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: There is no case for this outcome.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The applicant has more than one credit score.
        carries_conditions: false
      evidence_types: []
      reads:
      - CreditReport.score_count
      computable_checks:
      - 0
