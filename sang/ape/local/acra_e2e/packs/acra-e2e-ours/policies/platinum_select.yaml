  - rule_id: acra-platinum.loan_program_eligibility.cash_out_current_lease
    condition:
      kind: procedure
      purpose: Verify the required current lease agreement for a Cash-Out Refinance.
      steps:
      - 'Initial Document Review: Review the loan application for the loan purpose
        and review the current lease agreement for the subject property.'
      - 'Eligibility Verification: Apply this requirement to a Cash-Out Refinance.'
      - 'Validation and Verification: Verify that a current lease agreement is present
        for the subject property.'
      - 'Final Determination: Record whether the Cash-Out Refinance has a current
        lease agreement.'
      checks:
      - If LoanCore.loan_purpose is Cash-Out Refinance, a current lease agreement
        is present for the subject property.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The loan is not a Cash-Out Refinance, or it is a Cash-Out Refinance
          with a current lease agreement.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The loan is a Cash-Out Refinance and a current lease agreement
          is not present.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The loan purpose is not Cash-Out Refinance.
        carries_conditions: false
      evidence_types:
      - loan_application
      - lease_agreement
      reads:
      - LoanCore.loan_purpose
      - SubjectProperty.has_current_lease
      missing_reads:
      - Whether the lease agreement is current
    action: require_evidence
    priority: 100
    description: Verify that a Cash-Out Refinance has a current lease agreement.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy,
      purpose and qualification ¶1
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: Eligibility
        assistant:
        - Underwriter
        mnemonic: LPE-LEASE
        check_units:
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1 Occupancy,
            purpose and qualification ¶1
        job_kind: verification
      ledger:
        clause: '1.1 Occupancy, purpose and qualification

          PLAT-1.1 Occupancy: Non-Owner Occupied. \[P: Occupancy Requirements\]


          PLAT-1.2 An investment property is “a one- to four-unit residential dwelling
          or a unit in a condominium complex or a PUD owned by an individual who does
          not occupy the dwelling. The dwelling is leased and occupied as a principal
          year-round residence to individuals other than the owner.” The property
          types the Platinum Summary lists as eligible are at PLAT-7.1; types it does
          not list are set out in the table at 7.1 and asked in Q-07. \[G §3.41, p.
          11; P: Subject Property Requirements\]


          PLAT-1.3 The Program Summary is listed as “Business Purpose DSCR Platinum”
          on Acra''s rate-sheet page. “Where the borrower is qualifying utilizing
          the subject property''s actual or market cashflow under a business purpose
          transaction, borrower must execute with loan docs a Business Purpose Attestation
          (Exhibit 8) or other similar attestation approved by Acra.” The excerpt''s
          §8.4 also refers to consumer transactions (PLAT-8.2); whether every loan
          on this program is a business-purpose transaction: Acra confirmation requested
          → Q-22. \[G §5.32, p. 3; acralending.com/ratesheets\]


          PLAT-1.4 Eligible loan purpose types: Purchase, Rate & Term Refinance, Cash-Out
          Refinance, Delayed Financing. The matrix footnote states “Delayed financing
          is capped at \$1.5MM”; which matrix column and which cash-in-hand rule apply
          to delayed financing: Acra confirmation requested → Q-02. \[P: Loan Purpose
          Requirements; matrix footnote\]


          PLAT-1.5 “Debt Service Coverage Ratio (DSCR) Cash-Out Refinance Transactions
          requires current lease agreement”. \[P: Loan Purpose Requirements\]


          PLAT-1.6 “Vacant properties ineligible”. The Seller''s Guide provisions
          on vacant purchases and §10.17 vacant refinances therefore do not apply
          (Appendix B). \[P: Loan Purpose Requirements\]'
        clause_parts:
        - citation: Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.1
