  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_amortization
    condition:
      kind: procedure
      purpose: Check the listed-property loan term requirement.
      steps:
      - 'Step 1 - Initial Document Review: For a property listed for sale in the last
        six months, review the loan terms.'
      - 'Step 2 - Eligibility Verification: Check that the loan has a fully amortizing
        term; interest only is not available.'
      - 'Step 3 - Validation and Verification: Verify whether the loan is interest
        only and whether its term is fully amortizing.'
      - 'Step 4 - Final Determination: Record whether the loan meets the requirement.'
      checks:
      - The loan has a fully amortizing term and is not interest only.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The loan has a fully amortizing term and is not interest only.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The loan is interest only or does not have a fully amortizing term.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property was not listed for sale in the last six months.
        carries_conditions: false
      evidence_types:
      - loan_application
      reads:
      - SubjectProperty.listed_for_sale_last_6_months
      - MortgageLoanInformation.is_interest_only
      - LoanCore.is_interest_only_10_40
      computable_checks:
      - 0
      missing_reads:
      - Whether the loan term is fully amortizing
    action: require_evidence
    priority: 100
