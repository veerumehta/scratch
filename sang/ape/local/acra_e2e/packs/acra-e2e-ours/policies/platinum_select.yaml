  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_maximum_ltv_cltv
    condition:
      kind: procedure
      purpose: Verify the listed-property maximum LTV / CLTV of 65% using the required
        lesser value.
      steps:
      - 'Step 1 - Initial Document Review: For a property listed for sale in the last
        six months, review the appraisal and listing history.'
      - 'Step 2 - Eligibility Verification: Apply the maximum LTV / CLTV of 65% based
        on the lesser of (a) appraised value or (b) lowest recent listing price.'
      - 'Step 3 - Validation and Verification: Verify the appraised value, lowest
        recent listing price, loan amount, and resulting LTV / CLTV.'
      - 'Step 4 - Final Determination: Record whether the maximum is met using the
        required lesser value.'
      checks:
      - The LTV / CLTV is no more than 65% based on the lesser of the appraised value
        or the lowest recent listing price.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The LTV / CLTV is no more than 65% based on the lesser of the appraised
          value or the lowest recent listing price.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The LTV / CLTV exceeds 65% based on the lesser of the appraised
          value or the lowest recent listing price.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property was not listed for sale in the last six months.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      - listing_history
      reads:
      - SubjectProperty.listed_for_sale_last_6_months
      - SubjectProperty.appraised_value_usd
      - LoanCore.total_loan_amount_usd
      - LoanCore.cltv_percent
      missing_reads:
      - Lowest recent listing price
      - LTV / CLTV calculated using the lesser of the appraised value or lowest recent
        listing price
