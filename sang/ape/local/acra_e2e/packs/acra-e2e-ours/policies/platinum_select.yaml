  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_qualification
    condition:
      kind: procedure
      purpose: Apply the listed-property loan qualification requirement, including
        the program channel minimum DSCR and the unresolved DTI alternative.
      steps:
      - 'Step 1 - Initial Document Review: For a property listed for sale in the last
        six months, review the loan''s qualification information and channel.'
      - 'Step 2 - Eligibility Verification: Check qualification by either ≥ 1.0 DSCR,
        using the channel minimum DSCR of Wholesale 1.0 and Correspondent 1.2, or
        the 43% maximum DTI alternative identified as Q-14.'
      - 'Step 3 - Validation and Verification: Verify the applicable DSCR or DTI calculation
        and the channel-specific minimum from the loan records.'
      - 'Step 4 - Final Determination: Record whether one of the stated qualification
        alternatives is met; refer the DTI alternative as Q-14.'
      checks:
      - The loan qualifies as either (a) ≥ 1.0 DSCR, subject to the channel minimum
        DSCR of Wholesale 1.0 and Correspondent 1.2, or (b) 43% maximum DTI, with
        the DTI alternative identified as Q-14.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The loan qualifies under either stated alternative.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
