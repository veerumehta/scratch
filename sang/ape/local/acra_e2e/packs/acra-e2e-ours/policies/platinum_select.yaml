  - rule_id: acra-platinum.income_stability_sufficiency_analysis.support_excessive_lease_rent
    condition:
      kind: procedure
      purpose: Establish that the required support for excessive monthly rent reflected
        on the lease is provided.
      steps:
      - 'Step 1 - Initial Document Review: Review the lease agreement for monthly
        rent and the appraisal report, if provided, for a Form 1007.'
      - 'Step 2 - Eligibility Verification: Determine whether this is a single-family
        investment property with excessive monthly rent payments reflected on the
        lease.'
      - 'Step 3 - Validation and Verification: If the condition applies, verify documentation
        supporting that the monthly rent is typical for the area. Acceptable documentation
        may include classified ads from local newspapers, a 1007 completed by the
        appraiser, or a market rent survey completed by a local real estate company
        or rental management company familiar with the market rents in the area.'
      - 'Step 4 - Final Determination: Record whether the required supporting documentation
        is provided when the condition applies.'
      checks:
      - For a single-family investment property with excessive monthly rent payments
        reflected on the lease, documentation supports that the monthly rent is typical
        for the area.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The check holds, including because the stated condition does not
          apply.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The stated condition applies and the required supporting documentation
          is not provided.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - lease_agreement
      - appraisal_report
      reads:
      - SubjectProperty.property_type
      - SubjectProperty.occupancy_subtype
      computable_checks: []
      missing_reads:
      - Whether monthly rent reflected on the lease is excessive for the area
      - Documentation supporting that the monthly rent is typical for the area
