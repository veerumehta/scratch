  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.borrower_and_guarantor_due_diligence
    condition:
      kind: procedure
      purpose: Determine whether the required due diligence is current and covers
        the Key Principals and Entities identified by the guideline.
      steps:
      - 'Initial Document Review: Review the loan file for borrower and guarantor
        due diligence and its date, and identify the entity, recourse guarantors,
        owners, and parties with managing control.'
      - 'Eligibility Verification: For an entity borrower, identify the entity, recourse
        guarantors, and any party (individual or entity) that owns 20% or more of
        the entity directly or indirectly or has managing control. For an individual
        borrower, identify all such individuals.'
      - 'Validation and Verification: Verify that due diligence is current as of the
        date of any loan approval or draw. Review any background checks ordered by
        Acra, which may be from Checkpoint, LexisNexis or another comparable provider
        and may include criminal history, OFAC searches, litigation, judgment, and
        lien searches.'
      - 'Final Determination: Record whether due diligence is current and whether
        the required parties have been identified for review.'
      checks:
      - Borrower / Guarantor Due Diligence is current as of the date of any loan approval
        or draw.
      - For an entity borrower, the entity, recourse guarantor(s), and any party (individual
        or entity) that owns 20% or more of the entity directly or indirectly or has
        managing control are included in the identified review population.
      - For an individual borrower, all such individuals are included in the identified
        review population.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Due diligence is current as of the date of any loan approval or
          draw, and the applicable review population is identified.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Due diligence is not current or the applicable review population
          is not identified.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no borrower or guarantor due diligence required for the
          case.
        carries_conditions: false
      evidence_types:
      - entity_documents
      - loan_application
      reads:
      - Borrower.entity_type
      computable_checks: []
      missing_reads:
      - The date of any loan approval or draw and the date and contents of borrower
        and guarantor due diligence.
      - The identity of the entity, recourse guarantors, direct and indirect owners
        and their ownership percentages, and parties with managing control.
      - For an individual borrower, the identities of all such individuals.
      - Which background checks Acra ordered and their results, if any.
    action: require_evidence
    priority: 100
    description: Verify that required borrower and guarantor due diligence is current
      as of loan approval or draw and identify the parties subject to review.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.3 Due diligence
      and background checks
    on_violation: fail
    replaces: []
    domain_extensions:
