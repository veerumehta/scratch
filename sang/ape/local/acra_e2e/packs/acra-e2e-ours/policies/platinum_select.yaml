  - rule_id: acra-platinum.credit_review_analysis_credit.mortgage_and_rental_history_documentation
    condition:
      kind: procedure
      purpose: Determine whether the file contains the history documentation required
        for mortgage/rental rating and DSCR payment history.
      steps:
      - 'Initial Document Review: Review all reported mortgages on credit and the
        file''s documentation of mortgage and rental payment history over the last
        twelve (12) months.'
      - 'Eligibility Verification: For DSCR loans, require documentation for the subject
        property, the borrower''s and/or guarantor''s primary residence, and second
        home(s), if any. Additional properties do not require housing history to be
        documented unless documents in the file suggest a major credit event has occurred.
        For mortgages not reported on credit, the file should contain documentation
        to evaluate history on the applicant''s primary residence(s), any secondary
        residence(s), and the subject property.'
      - 'Validation and Verification: Verify that the required property histories
        are documented and that the history can be evaluated. For a matured loan,
        use its maturity date for rating; verify that any extension of the maturity
        date is in writing.'
      - 'Final Determination: Record whether the required history is documented and
        evaluable, and whether any applicable maturity-date extension is in writing.'
      checks:
      - The required mortgage and rental histories are documented for evaluation,
        and any extension of a matured loan's maturity date is in writing.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The required mortgage and rental histories are documented for evaluation,
          and any extension of a matured loan's maturity date is in writing.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Required mortgage or rental history documentation is absent or
          cannot be evaluated, or an applicable maturity-date extension is not in
          writing.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - credit_report
      - loan_application
      - lease_agreement
      - rent_roll
      - bank_statement
      reads:
      - LoanCore.dscr_qualification_method
      computable_checks: []
      missing_reads:
      - Which properties are the borrower's and/or guarantor's primary residence(s),
        secondary residence(s), and second home(s); whether a loan has matured and
        its maturity date; whether any maturity-date extension exists and is in writing;
        whether file documents suggest a major credit event.
    action: require_evidence
    priority: 100
    description: Review the required mortgage and rental history documentation for
      the properties specified for DSCR loans.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.3 Mortgage /
      rental rating and payment history
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: credit
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#6.3 Mortgage
            / rental rating and payment history
        job_kind: verification
      ledger:
        clause: 'PLAT-6.10 The mortgage / rental rating for determining mortgage pricing
          is determined by evaluating the ratings for properties the borrower owns
          and / or rents over the last twelve (12) months. All reported mortgages
          on credit should be considered; where the applicant has mortgages that are
          not reported, the file should contain documentation to evaluate history
          on the applicant''s primary residence(s), any secondary residence(s), and
          the subject property. \[G §4.15, p. 5\]


          PLAT-6.11 DSCR loans only require documentation on the subject property,
          principal residence, and second home (if any) of the borrower and / or guarantor(s).
          Additional properties do not require housing history to be documented unless
          documents in the file suggest a major credit event has occurred, for example
          a foreclosure listing the borrower (individually or as guarantor) on the
          credit report. For DSCR loans, the payment history is required for the primary
          residence, subject property, and second homes, if applicable. \[G §4.15,
          p. 5; §6.7, p. 6\]


          PLAT-6.12 Loans that have matured are rated based on the maturity date of
          the loan; any extensions of the maturity date must be in writing. \[G §4.15,
          p. 5\]'
