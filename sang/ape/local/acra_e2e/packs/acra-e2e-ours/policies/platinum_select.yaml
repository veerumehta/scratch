  - rule_id: acra-platinum.loan_program_eligibility.correspondent_fico_cltv_cap
    condition:
      kind: procedure
      purpose: Verify the Correspondent CLTV restriction for loans with a score from
        700 through 719.
      steps:
      - 'Initial Document Review: Review the loan application and credit report for
        channel, representative score, and CLTV.'
      - 'Eligibility Verification: Apply the 60% CLTV restriction when the channel
        is Correspondent and the score is 700-719 FICO.'
      - 'Validation and Verification: Verify the recorded channel, score, and CLTV
        against the source evidence.'
      - 'Final Determination: Record whether the applicable Correspondent restriction
        is met.'
      checks:
      - If LoanCore.channel is Correspondent and CreditReport.representative_score
        is from 700 through 719, LoanCore.cltv_percent is no more than 60%.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The channel is not Correspondent, or the score is not from 700
          through 719, or the CLTV is no more than 60%.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The channel is Correspondent, the score is from 700 through 719,
          and the CLTV is greater than 60%.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The channel is not Correspondent or the score is not from 700 through
          719.
        carries_conditions: false
      evidence_types:
      - loan_application
      - credit_report
      reads:
      - LoanCore.channel
      - CreditReport.representative_score
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      missing_reads: []
    action: require_evidence
    priority: 100
    description: Apply the Correspondent 700-719 FICO 60% CLTV restriction.
