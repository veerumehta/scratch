  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.revocable_living_trust_title_vesting
    condition:
      kind: procedure
      purpose: Determine whether title may vest in the proposed inter vivos revocable
        trust under the stated requirements.
      steps:
      - 'Initial Document Review: Review the title commitment and the complete, legible
        Trust or Certification of Trust, and identify the Trustors, Trustees, beneficiaries,
        and trust terms.'
      - 'Eligibility Verification: Verify that the Trust is valid under the laws of
        the state in which it is established; is revocable; is established by one
        or more natural persons and becomes effective during their lifetime; and has
        the individual(s) establishing the Trust as primary beneficiary.'
      - 'Validation and Verification: Verify that the Trust or Certification of Trust
        contains every stated required item. Verify the Trustee’s authority and the
        provisions concerning beneficiary consent, lender risk, and creditor rights.
        If the Trustors and Trustees are not the same, obtain written exception by
        Acra Senior Management.'
      - 'Final Determination: Record whether all applicable trust requirements are
        met; do not treat an irrevocable trust as permitted.'
      checks:
      - A complete, legible copy of the Trust or a Certification of Trust stating
        all required trust information is present.
      - The Trust is valid under the laws of the state in which it is established.
      - The Trust is revocable and can be changed or canceled at any time for any
        reason during a Trustor's lifetime.
      - The Trust is established by one or more natural persons, solely or jointly,
        and becomes effective during the lifetime of the person(s) establishing it.
      - The primary beneficiary of the Trust is the individual(s) establishing the
        Trust.
      - Written exception by Acra Senior Management is obtained if the Trustor(s)
        and Trustee(s) are not the same.
      - The Trust specifies the Trustee’s power to hold title and mortgage the property;
        that the beneficiary does not need to grant written consent for the Trust
        to borrow money, or that such consent has been granted in writing for purposes
        of the mortgage; that there is no unusual risk or impairment to the lender's
        rights; and that holding title in the Trust does not diminish the lender's
        rights as a creditor.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable trust requirement holds, including any required
          written exception.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The Trustor(s) and Trustee(s) are not the same, and the requirements
          are met subject to obtaining written exception by Acra Senior Management.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable trust requirement does not hold, including where
          the Trust is irrevocable.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Title is not proposed to vest in an inter vivos revocable trust.
        carries_conditions: false
      evidence_types:
      - title_commitment
      - entity_documents
      reads:
      - Borrower.entity_type
      computable_checks: []
      missing_reads:
      - 'The complete Trust or Certification of Trust and its required statements:
        existence and date; Trustor(s) and current Trustee(s); Trustee powers; revocability
        and the person holding the right to revoke; required signing Trustees; trust
        identification number; how title to Trust assets should be taken; and confirmation
        that the Trust has not been revoked, modified, or amended.'
      - The state where the Trust is established and whether it is valid under that
        state’s laws.
      - Whether the Trust can be changed or canceled at any time for any reason during
        a Trustor's lifetime.
      - Whether the Trust was established by natural person(s) and became effective
        during their lifetime.
      - The primary beneficiary or beneficiaries of the Trust.
      - Whether Trustor(s) and Trustee(s) are the same and, if not, whether Acra Senior
        Management provided written exception.
      - The Trust provisions concerning title, mortgage authority, beneficiary consent,
        unusual risk or impairment, and the lender’s creditor rights.
      - Whether Legal requires additional supporting documentation in its sole discretion.
    action: require_evidence
    priority: 100
    description: Verify that title vesting in an inter vivos revocable trust meets
      the stated trust, trustee, beneficiary, and lender-rights requirements.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.4 Revocable
      living trusts
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
