  - rule_id: acra-platinum.unassigned_provisions.reserves_where_no_trigger_applies
    condition:
      kind: procedure
      purpose: The Platinum Summary does not state a reserve requirement where no
        listed trigger applies; whether a base requirement exists is an open question.
      steps:
      - 'Initial Document Review: Review the CLTV and the information relevant to
        stated reserve triggers.'
      - 'Eligibility Verification: Determine whether any stated reserve trigger applies
        and whether the case is at CLTV of 75.00% or below.'
      - 'Validation and Verification: Do not infer a base reserve requirement or import
        a rule; mark the requirement where no trigger applies as requiring confirmation.'
      - 'Final Determination: Refer the open requirement for confirmation; do not
        determine compliance from the unanswered question.'
      checks:
      - The case is at CLTV of 75.00% or below and no stated reserve trigger applies.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: No stated reserve trigger applies, and whether a base reserve requirement
          applies remains subject to confirmation.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: There is no case for this outcome.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: A stated reserve trigger applies.
        carries_conditions: false
      evidence_types: []
      reads:
      - LoanCore.cltv_percent
      - RatioSet.reserves_months
      missing_reads:
      - The information needed to establish whether any stated reserve trigger applies.
