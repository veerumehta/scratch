  - rule_id: acra-platinum.compliance_and_closing_the_borrowing_entity_and_title.required_entity_documentation
    condition:
      kind: procedure
      purpose: Determine whether the entity file contains the required documentation
        without relying on borrower letters excusing or waiving any required document.
      steps:
      - 'Initial Document Review: Obtain and review the complete, legible formation
        documents and amendments; the applicable operating agreement or bylaws and
        amendments with referenced exhibits; ownership evidence; and the other entity
        documents required for this entity type and transaction.'
      - 'Eligibility Verification: Confirm the operating agreement or bylaws states
        whether the entity is member or manager managed, authorizes borrowing money
        and entering into contracts for mortgage assets, and designates signers. Confirm
        ownership documentation identifies all persons and interests or provides compliant
        membership interest evidence. For corporations, review the required shareholder
        or stockholder certificates or stock ledger, including the required accounting
        of outstanding shares and any required Affidavit of Lost Stock Certificate.
        For S-corporations or Partnerships where both stock certificate and stock
        ledger are unavailable, review the specified K-1 statements and CPA or Tax
        Preparer letter.'
      - 'Validation and Verification: Verify that entity-document names match identification,
        or review a letter of explanation addressing discrepancies; review a Certificate
        of Good Standing or equivalent valid within ninety (90) days of closing; review
        any required foreign qualification; review the IRS Form SS4 or TIN or EIN
        issuance letter, or an EIN exception request and letter of explanation submitted
        for Acra Legal Department review; and review the required Unanimous Written
        Consent / Board Resolution. If a Power of Attorney is used to designate an
        attorney in fact to execute a personal guarantee, review it for the stated
        purpose. Do not accept borrower letters stating required documents are not
        required, available, or excused.'
      - 'Final Determination: Record whether each applicable required document and
        stated document content is present. Refer conflicts between formation documents
        and the Operating Agreement or Bylaws for additional information, and refer
        any additional-supporting-documentation requirement to Legal as applicable.'
      checks:
      - The complete, legible Certificate of Formation / Articles of Organization
        and all amendments thereto are present.
      - The complete Operating Agreement for LLCs and Partnerships, or Bylaws for
        corporations, with all referenced exhibits and amendments, is present and
        contains the required management, borrowing, mortgage-asset contract, and
        signer provisions.
      - The documentation evidencing ownership interests meets the stated requirements
        for the entity type.
      - For an S or C Corporation, the required shareholder / stockholder certificates
        or stock ledger is present and accounts for all outstanding shares noted in
        the Certificate of Formation / Articles of Organization, including those held
        by the corporation; an Affidavit of Lost Stock Certificate is present when
        required.
      - For an S-corporation or Partnership where both stock certificate and stock
        ledger are unavailable, the required most recent preceding tax year's K-1
        statement for all members with 20% or more interest and the required CPA or
        Tax Preparer letter are present, including the stated alternative if the preceding
        year's taxes have not been filed.
      - Names on the entity documents match the identification, or a letter of explanation
        addresses any discrepancy.
      - A Certificate of Good Standing or equivalent document valid within ninety
        (90) days of the closing date is present.
      - A Certificate of Foreign Qualification or other qualification to operate in
        the relevant state is present if the entity is formed in a state other than
        where business is conducted or the property is located.
      - The entity’s IRS Form SS4 or Federal Taxpayer Identification Number (TIN)
        or Employer Identification Number (EIN) issuance letter is present, or an
        EIN exception request with a letter of explanation stating the applicable
        grounds is submitted for Acra's Legal Department review.
      - A Unanimous Written Consent / Board Resolution signed by all members regardless
        of their percentage of interest authorizes the transaction with Acra Lending
        and identifies who is authorized to sign the loan documents on behalf of and
        to bind the entity.
      - Any Power of Attorney used to designate an attorney in fact to execute a personal
        guarantee is utilized by the principal for that purpose.
      - Borrower letters stating that required documents are not required, available,
        or excused are not accepted in place of the required documents.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable required entity document and document-content
          check holds, and no borrower letter is accepted as an excuse for a required
          document.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The file remains subject to additional supporting documentation
          as determined in Legal’s sole discretion.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable required document or document-content check does
          not hold, or a borrower letter is accepted in place of a required document.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no entity borrower.
        carries_conditions: false
      evidence_types:
      - entity_documents
      - loan_application
      reads:
      - Borrower.entity_type
      - Borrower.entity_documents_complete
      - Borrower.is_entity_borrower_1
      computable_checks: []
      missing_reads:
      - The complete applicable Operating Agreement or Bylaws, referenced exhibits,
        amendments, and required contents.
      - Ownership-interest documents and, when applicable, share certificates, stock
        ledger, Affidavit of Lost Stock Certificate, K-1 statements, and CPA or Tax
        Preparer letter.
      - Identification for comparison with names on entity documents and any letter
        of explanation.
      - The Certificate of Good Standing or equivalent and its validity relative to
        the closing date.
      - The entity’s formation state, state of business, property state, and any required
        qualification document.
      - The entity’s SS4, TIN or EIN issuance letter, or EIN exception request and
        letter of explanation.
      - The Unanimous Written Consent / Board Resolution and its signers and contents.
      - Any Power of Attorney used for a personal guarantee.
      - Whether formation documents conflict with the Operating Agreement or Bylaws,
        and any additional documentation Legal requires.
    action: require_evidence
    priority: 100
    description: Review the required entity documentation and verify that the required
      contents, signatures, validity, and identifying information are present.
