  - rule_id: acra-platinum.asset_assessment_assets_and_funds_to_close.rent_receipt_and_mortgage_history_reserves
    condition:
      kind: procedure
      purpose: Verify the stated 12 months of the subject's payment in reserve when
        the specified conditions apply.
      steps:
      - 'Initial Document Review: Review available rent, occupancy, mortgage-payment-history,
        and reserve documentation.'
      - 'Eligibility Verification: Determine whether the property is tenant-occupied,
        there is forbearance or mortgage lates in the last 12 months, and the prior
        two months'' rent was not received timely.'
      - 'Validation and Verification: If all stated conditions apply, verify 12 months
        of the subject''s payment in reserve; the reserve may be from the transaction''s
        cash-in-hand.'
      - 'Final Determination: Record whether the stated reserve requirement is met.
        Do not infer a relationship to 0x30x12 beyond the source''s stated reference.'
      checks:
      - The property is tenant-occupied, there is forbearance or mortgage lates in
        the last 12 months, and the prior two months' rent was not received timely.
      - When all stated conditions apply, 12 months of the subject's payment are verified
        in reserve.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: All stated conditions apply and 12 months of the subject's payment
          are verified in reserve.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: All stated conditions apply and 12 months of the subject's payment
          are not verified in reserve.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: At least one of the stated conditions does not apply.
        carries_conditions: false
      evidence_types:
      - lease_agreement
      - rent_roll
      - bank_statement
      - credit_report
      reads:
      - SubjectProperty.occupancy_subtype
      - SubjectProperty.has_current_lease
      - CreditReport.mortgage_0x30x24
      computable_checks: []
      missing_reads:
      - Whether there was forbearance or a mortgage late in the last 12 months.
      - Whether the prior two months' rent was received timely.
      - Evidence of reserves.
      - The subject's payment amount and the payment basis for calculating reserves.
