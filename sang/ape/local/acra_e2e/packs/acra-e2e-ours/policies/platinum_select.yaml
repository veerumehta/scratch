  rules:
  - rule_id: acra-platinum.appraisal_review_property_eligibility.declining_market_cltv_reduction
    condition:
      kind: procedure
      purpose: Apply the declining-market CLTV reduction and preserve the stated open
        question about how it combines with other caps.
      steps:
      - 'Step 1 - Initial Document Review: Review the appraisal report for the property''s
        market trend and review other applicable CLTV caps.'
      - 'Step 2 - Eligibility Verification: If the market is declining, apply the
        stated -5% CLTV property/borrower full profile reduction.'
      - 'Step 3 - Validation and Verification: Verify the declining-market finding
        and request Acra confirmation of how the reduction combines with other caps.'
      - 'Step 4 - Final Determination: Record the reduction and keep the cap combination
        subject to Acra confirmation.'
      checks:
      - If the market is declining, the -5% CLTV property/borrower full profile reduction
        is applied, and how it combines with other caps is referred for Acra confirmation.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The market is not declining, or the -5% CLTV property/borrower
          full profile reduction is applied and the combination with other caps is
          confirmed by Acra.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The market is declining and Acra confirmation of how the reduction
          combines with other caps is pending.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The market is declining and the -5% CLTV property/borrower full
          profile reduction is not applied.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - LoanCore.cltv_percent
      missing_reads:
      - Whether the market is declining
      - Acra confirmation of how the reduction combines with other caps
    action: require_evidence
    priority: 100
    description: Identify a declining market and apply the stated -5% CLTV reduction,
      referring the combination with other caps for Acra confirmation.
    citations:
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#1.3 Location
    - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#7.1 Property types,
      as printed
    on_violation: fail
    replaces: []
    domain_extensions:
