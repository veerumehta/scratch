        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.3 Due
            diligence and background checks
        - - Acra_DSCR_Platinum_Select_Consolidated_Guidelines_v1_0 1.docx#5.3 Due
            diligence and background checks
        job_kind: verification
      ledger:
        clause: 'PLAT-5.11 Borrower / Guarantor Due Diligence as described above is
          required to be current as of the date of any loan approval or draw. \[G
          §3.12, p. 9\]


          PLAT-5.12 Acra reviews the background of the Key Principals and Entities:
