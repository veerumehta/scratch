  - rule_id: acra-platinum.appraisal_review_property_eligibility.listed_property_prepayment_penalty.python
    condition:
      kind: python
      source: "import re\nimport rules_lib\n\n\ndef check(ctx):\n    listed = rules_lib.flag(ctx['SubjectProperty.listed_for_sale_last_6_months'])\n\
        \    missing = rules_lib.gaps(listed=listed)\n    if missing:\n        return\
        \ rules_lib.unknown(*missing)\n    if listed is False:\n        return True\n\
        \n    penalty = ctx['LoanCore.prepayment_penalty_structure']\n    missing\
        \ = rules_lib.gaps(penalty=penalty)\n    if missing:\n        return rules_lib.unknown(*missing)\n\
        \n    if not isinstance(penalty, str):\n        return rules_lib.unknown('prepayment_penalty_duration')\n\
        \n    match = re.search(r'(\\d+(?:\\.\\d+)?)\\s*(years?|yrs?|months?|mos?)\\\
        b', penalty, re.IGNORECASE)\n    if match is None:\n        return rules_lib.unknown('prepayment_penalty_duration')\n\
        \n    duration = float(match.group(1))\n    unit = rules_lib.norm(match.group(2))\n\
        \    if unit in ('year', 'years', 'yr', 'yrs'):\n        return duration >=\
        \ 3\n    if unit in ('month', 'months', 'mo', 'mos'):\n        return duration\
        \ >= 36\n    return rules_lib.unknown('prepayment_penalty_duration')"
