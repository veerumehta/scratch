  - rule_id: acra-platinum.insurance_coverage_sufficiency_policy_assessment.rent_loss_reserve_substitution
    condition:
      kind: procedure
      purpose: Determine whether the permitted reserve substitution is sufficient
        when required rent loss insurance cannot be obtained.
      steps:
      - 'Step 1 - Initial Document Review: Review the hazard insurance declarations
        for rent loss coverage provided and the coverage period not provided.'
      - 'Step 2 - Eligibility Verification: Apply this review only when rent loss
        insurance is required and cannot be obtained.'
      - 'Step 3 - Validation and Verification: Compare reserves to the required substitution
        of two months of reserves for every one month of rent loss coverage not provided.'
      - 'Step 4 - Final Determination: Record whether the reserves meet the substitution
        amount, are awaiting the information needed to assess it, or are insufficient.'
      checks:
      - Required rent loss insurance cannot be obtained.
      - Reserves are at least two months for every one month of rent loss coverage
        not provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Required rent loss insurance cannot be obtained and reserves meet
          the two-months-for-every-one-month substitution.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Required rent loss insurance cannot be obtained, but whether reserves
          meet the substitution is awaiting the information needed to assess it.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Required rent loss insurance cannot be obtained and reserves do
          not meet the substitution.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Rent loss insurance is not required, or the required rent loss
          insurance has been obtained.
        carries_conditions: false
      evidence_types:
      - hazard_insurance
      reads:
      - RatioSet.reserves_months
      computable_checks: []
      missing_reads:
      - Whether required rent loss insurance cannot be obtained
      - The number of months of rent loss coverage not provided
