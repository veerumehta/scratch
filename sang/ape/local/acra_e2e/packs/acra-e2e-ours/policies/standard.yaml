        Primary Residence is not located in the United States of America and the STD-5.2
        description of a Non-Resident Alien not authorized to live or work in the
        U.S. who must reside outside the U.S.'
      - 'Validation and Verification: Resolve whether the borrower meets those stated
        facts; do not treat periodic U.S. visits, limited personal use or investment,
        or ownership of a U.S.-based business entity as disqualifying by themselves.'
      - 'Final Determination: Record whether the borrower meets the stated Foreign
        National residence and authorization description.'
      checks:
      - The borrower resides outside the U.S., has a Primary Residence not located
        in the United States of America, and is not authorized to live or work in
        the U.S.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The borrower meets the stated residence and authorization description.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Residence or authorization facts remain unverified.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The borrower does not meet the stated residence and authorization
          description.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not being reviewed as a Foreign National.
