      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The application is a First Time Home Buyers DSCR application and
          a step is not met or a check does not hold.
