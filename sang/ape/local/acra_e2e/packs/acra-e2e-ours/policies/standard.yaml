  - rule_id: acra-standard.appraisal_review_property_eligibility.vacant_property_cash_out_refinance
    condition:
      kind: procedure
      purpose: Determine whether a vacant-property cash-out refinance meets the requirements
        stated in STD-8.7 and the Summary.
      steps:
      - 'Step 1 - Initial Document Review: Review property, credit, loan, ownership,
        prepayment-penalty, impound, and reserve records.'
      - 'Step 2 - Eligibility Verification: Apply the stated score, DSCR, prepayment
        penalty, interest-only, impound, reserves, CLTV, and ownership requirements.'
      - 'Step 3 - Validation and Verification: Request Acra confirmation for loans
        of $1,500,000 or more and for how the 15 months are measured, as directed
        to Q-10.'
      - 'Step 4 - Final Determination: Record whether the applicable requirements
        are met and any confirmation remains outstanding.'
      checks:
      - Minimum 700 FICO.
      - DSCR ≥ 1.15.
      - ≥ 3-year PPP (where allowable).
      - No interest only.
      - Impounds required.
      - 6 months reserves.
      - “Max CLTV 60% for loan amounts under $1,500,000”; loans of $1,500,000 or more
        require Acra confirmation (Q-10).
      - Requires ≥15 months ownership; how the 15 months are measured requires Acra
        confirmation (Q-10).
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is vacant, the transaction is cash-out refinance,
          and all applicable requirements are met, including any required confirmation.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property is vacant and the transaction is cash-out refinance,
          but required information or Acra confirmation remains outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is vacant and the transaction is cash-out refinance,
          and an applicable requirement is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property is not vacant or the transaction is not cash-out refinance.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      - credit_report
      - hazard_insurance
