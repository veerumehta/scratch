        verdict: violated
        criterion: The loan closes with a title and closing agent not approved and
          / or vetted by Acra.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not a Foreign National.
        carries_conditions: false
      evidence_types:
      - title_agent_verification
