          of multiple guarantors. \[G §3.12, p. 7\]


          STD-6.4 An entity borrower must be a single purpose entity (SPE): “an entity
          with no assets other than residential investment or rental properties; engaged
          in the business of owning and operating residential investment or rental
          properties.” Series limited liability companies are not allowed. \[G §3.12,
          p. 7\]


          STD-6.5 All entities that will hold direct ownership of the subject property
          and will be on title as a direct owner are required to be a borrowing entity.
          \[G §3.12, p. 7\]


          STD-6.6 Changes to the operating agreement or bylaws with the intent of
          changing ownership percentages to circumvent required personal guarantors
          will not be considered. “Lookback to changes cannot occur within 30 days
          prior to an Application Date or throughout the application process as these
          changes will not be recognized by Acra Lending.” \[G §3.12, p. 7\]


          STD-6.7 Entity / guarantor types allowed: Domestic Corporations (C and S
          Corp); single purpose Limited Liability Companies (LLC), excluding series
          LLC; Limited Liability Partnership (LLP); Limited Liability Limited Partnership
          (LLLP); General Partnership (GP); Limited Partnership (LP); and Sole Proprietorship.
          “In all events, the Borrower must be a US formed and based Entity, foreign
          entities (i.e.: entities formed or based outside the US) or foreign owned
          entities are not allowed.” \[G §3.12, p. 8\]'
