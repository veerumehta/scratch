  - rule_id: acra-standard.credit_review_analysis_credit.mortgage_and_rental_rating_review
    condition:
      kind: procedure
      purpose: Verify the required evaluation of mortgage and rental ratings for mortgage
        pricing.
      steps:
      - 'Initial Document Review: Review credit reports and file documentation for
        properties the borrower owns and/or rents over the last twelve (12) months.'
      - 'Eligibility Verification: Identify all reported mortgages and identify mortgages
        that are not reported.'
      - 'Validation and Verification: Consider all reported mortgages. Where the applicant
        has mortgages that are not reported, verify that the file contains documentation
        to evaluate history on the applicant''s primary residence(s), any secondary
        residence(s), and the subject property. Evaluate the ratings for properties
        the borrower owns and/or rents over the last twelve (12) months.'
      - 'Final Determination: Confirm that the rating used for determining mortgage
        pricing reflects the required evaluation.'
      checks:
      - The mortgage / rental rating for determining mortgage pricing is determined
        by evaluating ratings for properties the borrower owns and/or rents over the
        last twelve (12) months, considering all reported mortgages and, where mortgages
        are not reported, the specified property-history documentation.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The required evaluation and, where applicable, documentation are
          established.
        carries_conditions: false
      - status: CONDITIONAL
