  - rule_id: acra-standard.identification_requirements.foreign_national_residence_status
    condition:
      kind: procedure
      purpose: Determine whether the Foreign National borrower resides outside the
        U.S. and is not authorized to live or work in the U.S.
      steps:
      - 'Initial Document Review: Review available information about the borrower''s
        primary residence and authorization to live or work in the U.S.'
