  - rule_id: acra-standard.appraisal_review_property_eligibility.condotel_or_pudtel_caps
    condition:
      kind: procedure
      purpose: Determine whether a Condotel / PUDtel meets the applicable STD-8.1
        limits and printed conditions.
      steps:
      - 'Step 1 - Initial Document Review: Review the appraisal_report for property
        type and location, and review loan records for loan purpose and CLTV.'
      - 'Step 2 - Eligibility Verification: Identify the purchase, Refi R/T, or Refi
        C/O cap and the Florida condition printed in STD-8.1.'
      - 'Step 3 - Validation and Verification: Verify CLTV, loan purpose, state, and
        minimum DSCR information.'
      - 'Step 4 - Final Determination: Record whether the applicable cap and conditions
        are met.'
      checks:
      - 'For a Condotel / PUDtel, CLTV does not exceed 75% for Purchase, 70% for Refi
        R/T, or 65% for Refi C/O; for Florida properties, apply “-5% CLTV” and “Min
        DSCR: 1.0”.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The subject is a Condotel / PUDtel and the applicable cap and conditions
          are met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The subject is a Condotel / PUDtel and confirmation or missing
          information is needed to establish the applicable cap or condition.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The subject is a Condotel / PUDtel and the applicable cap or condition
          is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The subject property is not a Condotel / PUDtel.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.property_type
      - SubjectProperty.state
      - LoanCore.loan_purpose
      - LoanCore.cltv_percent
      missing_reads:
      - Whether loan purpose is Purchase, Refi R/T, or Refi C/O; minimum DSCR; how
        the Florida “-5% CLTV” applies.
    action: require_evidence
    priority: 100
    description: Apply the printed CLTV caps and minimum DSCR condition for a Condotel
      / PUDtel.
    citations:
