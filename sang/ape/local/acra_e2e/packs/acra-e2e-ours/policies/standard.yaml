  - rule_id: acra-standard.loan_program_eligibility.prepayment_penalty_minimum_terms
    condition:
      kind: procedure
      purpose: Apply the minimum terms stated for the specified transactions, subject
        to the printed qualifications.
      steps:
      - 'Initial Document Review: Review the loan application for loan purpose, vacancy,
        listing status, state, and prepayment penalty term.'
      - 'Eligibility Verification: Determine whether the transaction is a vacant-property
        rate & term refinance, vacant-property cash-out refinance, or involves a property
        listed for sale.'
      - 'Validation and Verification: Verify at least two years for vacant-property
        rate & term refinance and at least three years for vacant-property cash-out
        refinance, each “where allowable”; verify at least three years for a property
        listed for sale unless the property is located in a state that does not allow
        prepayment penalties. Do not resolve the stated Acra-confirmation question
        about how a state restriction interacts with these minimums.'
      - 'Final Determination: Record compliance with an applicable minimum or identify
        that Acra confirmation is required for the state interaction.'
      checks:
      - If the transaction is a vacant-property rate & term refinance where allowable,
        the prepayment penalty term is at least two years.
      - If the transaction is a vacant-property cash-out refinance where allowable,
        the prepayment penalty term is at least three years.
      - If the property is listed for sale and is not in a state that does not allow
        prepayment penalties, the prepayment penalty term is at least three years.
      - If a state restriction applies to an applicable minimum, Acra confirmation
        is obtained on how the restriction interacts with that minimum.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable step is met and every check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: An applicable minimum's interaction with a state restriction is
          pending Acra confirmation.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A step is not met or an applicable minimum-term check does not
          hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: None of the specified transaction or property-listing cases applies.
        carries_conditions: false
      evidence_types:
      - loan_application
      - listing_history
      reads:
      - LoanCore.loan_purpose
      - SubjectProperty.is_vacant
      - SubjectProperty.is_listed_for_sale
      - SubjectProperty.state
      - LoanCore.prepayment_penalty_structure
      computable_checks:
