  - rule_id: acra-standard.identification_requirements.foreign_national_credit_reference
    condition:
      kind: procedure
      purpose: Verify that a Foreign National provides one accepted credit-reference
        alternative.
      steps:
      - 'Initial Document Review: Review the available U.S. credit report, international
        credit report, original international financial institution credit reference
        letter, and bank statement evidence.'
