      - 'Eligibility Verification: Apply this job only when the application is a First
        Time Home Buyers application and the loan qualifies by DSCR.'
      - 'Validation and Verification: Verify minimum 700 FICO, maximum 70% CLTV, minimum
        DSCR of 1.150, maximum loan amount of $1,000,000, full amortization with no
        interest-only programs, impounds, and minimum six months reserves.'
      - 'Final Determination: Record whether every stated first-time-homebuyer DSCR
        condition is met.'
