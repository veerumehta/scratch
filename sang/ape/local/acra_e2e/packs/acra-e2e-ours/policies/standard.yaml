        at least two (2) trade lines and a minimum age of two (2) years for one trade
        line. For the other alternatives, verify that the document is an international
        credit report, an original credit reference letter from an internationally
        known financial institution, or a bank statement documenting a foreign financial
        banking relationship for the past 60 days.'
      - 'Final Determination: Record whether at least one alternative is verified.'
      checks:
      - 'At least one STD-5.10 credit-reference alternative is verified: a U.S. credit
        report with at least two (2) trade lines and minimum age of two (2) years
        for one trade line; an international credit report; an original credit reference
        letter from an internationally known financial institution; or a bank statement
        documenting a foreign financial banking relationship for the past 60 days.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: At least one STD-5.10 credit-reference alternative is verified.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Evidence needed to verify at least one alternative remains outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: None of the STD-5.10 credit-reference alternatives is verified.
        carries_conditions: false
      - status: NOT_APPLICABLE
