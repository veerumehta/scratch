  - rule_id: acra-standard.credit_review_analysis_credit.dscr_housing_history_documentation_scope
    condition:
      kind: procedure
      purpose: Confirm the housing-history documentation scope stated for DSCR loans.
      steps:
      - 'Initial Document Review: Review the file for housing-history documentation
        and any documents suggesting a major credit event.'
      - 'Eligibility Verification: Establish whether the loan is a DSCR loan and identify
        the borrower''s and/or guarantors'' subject property, principal residence,
        second home (if any), and additional properties.'
      - 'Validation and Verification: Verify payment history documentation for the
        primary residence, subject property, and second homes, if applicable. Do not
        require documentation for additional properties unless documents in the file
        suggest a major credit event has occurred.'
      - 'Final Determination: Confirm that the DSCR housing-history documentation
        scope is met.'
      checks:
      - For a DSCR loan, payment history is documented for the primary residence,
        subject property, and second homes, if applicable; additional properties are
        documented only if documents in the file suggest a major credit event has
        occurred.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The loan is a DSCR loan and the stated documentation scope is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The loan is a DSCR loan and the stated documentation scope is not
          met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The loan is not a DSCR loan.
        carries_conditions: false
      evidence_types:
      - credit_report
      - lease_agreement
      - rent_roll
      - bank_statement
      reads: []
      computable_checks: []
      missing_reads:
      - whether the loan is a DSCR loan
      - the primary residence, subject property, and any second homes of the borrower
        and/or guarantors
      - whether documents in the file suggest a major credit event has occurred
      - whether payment history documentation is present for each required property
    action: require_evidence
    priority: 100
    description: Verify the required housing-history documentation for a DSCR loan
      and apply the stated scope for additional properties.
    citations:
