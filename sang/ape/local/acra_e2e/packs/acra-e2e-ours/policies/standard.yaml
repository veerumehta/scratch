  - rule_id: acra-standard.credit_review_analysis_credit.bankruptcy_and_foreclosure_cltv_limits
    condition:
      kind: procedure
      purpose: Determine whether CLTV meets the printed bankruptcy and foreclosure
        restriction for the applicable seasoning and purpose.
      steps:
      - 'Initial Document Review: Review the credit report and file for bankruptcy
        or foreclosure history and its seasoning.'
      - 'Eligibility Verification: Establish whether the borrower has had bankruptcy
        or foreclosure and identify the applicable loan purpose.'
      - 'Validation and Verification: Apply the printed limits: ≥ 36 Mo—No Restrictions
        for both purposes; 24-35 Mo—80% Purchase, 75% Refi R/T, Refi C/O; 12-23 Mo—65%
        for both; < 12 Mo—Ineligible for both.'
      - 'Final Determination: Determine whether the applicable printed restriction
        is met.'
      checks:
      - For the applicable printed seasoning and loan-purpose column, CLTV does not
        exceed the listed maximum; < 12 Mo is Ineligible.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The applicable printed restriction is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The applicable printed maximum is exceeded or the applicable seasoning
          is Ineligible.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower has not had bankruptcy or foreclosure.
        carries_conditions: false
      evidence_types:
      - credit_report
      reads:
      - Borrower.has_bankruptcy_or_foreclosure
      - Borrower.months_since_bankruptcy_or_foreclosure
      - LoanCore.loan_purpose
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      missing_reads:
      - the applicable seasoning as printed
      - whether the reported event is bankruptcy or foreclosure
