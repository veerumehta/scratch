policies:
- policy_id: DSCR_STANDARD
  version: 1.0.0
  name: standard (our extraction)
  description: Our jobs and the code written from them, standard
  policy_type: institutional
  pack_id: acra-e2e-ours
  jurisdiction: US
  effective_date: '2026-08-17T00:00:00Z'
  status: draft
  scope: product
  overlay_id: standard
  rules:
  - rule_id: acra-standard.appraisal_review_property_eligibility.2_4_unit_cltv_cap
    condition:
      kind: procedure
      purpose: Determine whether a 2-4 Unit property meets the STD-8.1 maximum CLTV.
      steps:
      - 'Step 1 - Initial Document Review: Review the appraisal_report for property
        type and loan records for CLTV.'
      - 'Step 2 - Eligibility Verification: Apply the printed “Max CLTV: 80%” without
        a purpose split.'
      - 'Step 3 - Validation and Verification: Verify property type and CLTV in the
        case record.'
      - 'Step 4 - Final Determination: Record whether CLTV is within the printed maximum.'
      checks:
      - For a 2-4 Unit property, CLTV does not exceed 80%.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The subject is a 2-4 Unit property and CLTV does not exceed 80%.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The subject is a 2-4 Unit property and CLTV exceeds 80%.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The subject property is not a 2-4 Unit property.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.property_type
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      missing_reads: []
    action: require_evidence
    priority: 100
    description: Apply the printed maximum CLTV for a 2-4 Unit property.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types
      and caps
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: property eligibility
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property
            types and caps
        job_kind: limit
      ledger:
        clause: 'STD-8.1 Eligible property types: SFR, Townhome, PUD, Warrantable
          Condo, Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units, Manufactured.
          Restrictions as printed: \[S: Subject Property Type\]


          | **Property type** | **Purchase** | **Refi R/T** | **Refi C/O** | **Conditions
          as printed** |

          |----|----|----|----|----|

          | Non-Warrantable Condo | 80% | 75% | 75% | “-5% CLTV for Florida properties,
          Min DSCR: 1.0” |

          | Condotel / PUDtel | 75% | 70% | 65% | “-5% CLTV for Florida properties
          Min DSCR: 1.0” |

          | 2-4 Unit | 80% | 80% | 80% | Printed as “Max CLTV: 80%” with no purpose
          split |

          | Manufactured Home | 65% | 60% | 60% | — |


          STD-8.2 Above 80.00% LTV only SFR, Warrantable Condos outside of Florida,
          Townhome and PUD are eligible (STD-3.16). \[S: Income Documentation\]


          STD-8.3 Rural / unique property: maximum CLTV 80% (purchase), 75% (refinance
          — rate & term), 70% (refinance — cash-out); minimum FICO 700; minimum DSCR
          1.00. “If marketing time is excessive or property exhibits unusual, inadequate
          or peculiar functionality, LTV may be further reduced.” \[S: Subject Property
          Location\]


          STD-8.4 Declining market: “-5% CLTV property/borrower full profile” (STD-1.14).
          \[S: Subject Property Location\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible
            property types and caps
          heading: ''
          text: 'STD-8.1 Eligible property types: SFR, Townhome, PUD, Warrantable
            Condo, Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units, Manufactured.
            Restrictions as printed: \[S: Subject Property Type\]


            | **Property type** | **Purchase** | **Refi R/T** | **Refi C/O** | **Conditions
            as printed** |

            |----|----|----|----|----|

            | Non-Warrantable Condo | 80% | 75% | 75% | “-5% CLTV for Florida properties,
            Min DSCR: 1.0” |

            | Condotel / PUDtel | 75% | 70% | 65% | “-5% CLTV for Florida properties
            Min DSCR: 1.0” |

            | 2-4 Unit | 80% | 80% | 80% | Printed as “Max CLTV: 80%” with no purpose
            split |

            | Manufactured Home | 65% | 60% | 60% | — |


            STD-8.2 Above 80.00% LTV only SFR, Warrantable Condos outside of Florida,
            Townhome and PUD are eligible (STD-3.16). \[S: Income Documentation\]


            STD-8.3 Rural / unique property: maximum CLTV 80% (purchase), 75% (refinance
            — rate & term), 70% (refinance — cash-out); minimum FICO 700; minimum
            DSCR 1.00. “If marketing time is excessive or property exhibits unusual,
            inadequate or peculiar functionality, LTV may be further reduced.” \[S:
            Subject Property Location\]


            STD-8.4 Declining market: “-5% CLTV property/borrower full profile” (STD-1.14).
            \[S: Subject Property Location\]'
    approval_refs: []
  - rule_id: acra-standard.appraisal_review_property_eligibility.above_80_00_ltv_property_type
    condition:
      kind: procedure
      purpose: Determine whether a property with LTV above 80.00% is one of the types
        permitted by STD-8.2.
      steps:
      - 'Step 1 - Initial Document Review: Review the appraisal_report for property
        type and appraised value, and review loan records for LTV.'
      - 'Step 2 - Eligibility Verification: Apply the STD-8.2 restriction if LTV is
        above 80.00%.'
      - 'Step 3 - Validation and Verification: Verify the loan''s LTV and property
        type in the case record.'
      - 'Step 4 - Final Determination: Record whether the property type meets the
        restriction.'
      checks:
      - If LTV is above 80.00%, the property type is SFR, Warrantable Condo outside
        of Florida, Townhome, or PUD.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The restriction applies and the property type meets it, or LTV
          is not above 80.00%.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: LTV is above 80.00% and the property type does not meet the restriction.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.property_type
      - SubjectProperty.state
      - SubjectProperty.appraised_value_usd
      missing_reads:
      - LTV; whether the property is a Warrantable Condo; whether the property is
        outside of Florida.
    action: require_evidence
    priority: 100
    description: Apply the stated property-type restriction when LTV is above 80.00%.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#8.1 Eligible property types
      and caps
