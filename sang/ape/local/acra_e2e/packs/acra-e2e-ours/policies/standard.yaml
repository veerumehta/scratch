  - rule_id: acra-standard.income_stability_sufficiency_analysis.apply_short_term_rental_limits
    condition:
      kind: procedure
      purpose: Determine whether a short-term-rental purchase or refinance meets the
        stated CLTV and FICO limits.
      steps:
      - 'Initial Document Review: Review the loan_application and credit_report for
        transaction and credit information.'
      - 'Eligibility Verification: Determine whether the property qualifies with short-term
        rentals and whether the transaction is a purchase or refinance.'
      - 'Validation and Verification: Compare CLTV with the applicable maximum and
        compare FICO with the minimum.'
      - 'Final Determination: Record whether all applicable short-term rental limits
        are met.'
      checks:
      - For a purchase qualifying with short-term rentals, CLTV is no more than 75%.
      - For a refinance qualifying with short-term rentals, CLTV is no more than 70%.
      - For a transaction qualifying with short-term rentals, FICO is at least 640.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable CLTV and FICO limit is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable CLTV or FICO limit is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
