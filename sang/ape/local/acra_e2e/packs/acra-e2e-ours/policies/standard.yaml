  - rule_id: acra-standard.income_stability_sufficiency_analysis.apply_dscr_below_one_or_no_ratio_limits
    condition:
      kind: procedure
      purpose: Determine whether a DSCR below 1.0 or No Ratio transaction meets the
        applicable CLTV and FICO limits.
      steps:
      - 'Initial Document Review: Review the loan_application and credit_report for
        transaction and credit information.'
      - 'Eligibility Verification: Determine whether DSCR is below 1.0 or the file
        is No Ratio, and identify purchase, rate & term refinance, or cash-out refinance.'
      - 'Validation and Verification: Compare CLTV with the applicable maximum and
        FICO with the minimum.'
      - 'Final Determination: Record whether all applicable limits are met.'
      checks:
      - For DSCR below 1.0 or No Ratio, purchase CLTV is no more than 75%.
      - For DSCR below 1.0 or No Ratio, refinance — rate & term CLTV is no more than
        70%.
      - For DSCR below 1.0 or No Ratio, refinance — cash-out CLTV is no more than
        65%.
      - For DSCR below 1.0 or No Ratio, FICO is at least 640.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable CLTV and FICO limit is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable CLTV or FICO limit is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: DSCR is not below 1.0 and the file is not No Ratio.
        carries_conditions: false
      evidence_types:
      - loan_application
      - credit_report
      reads:
      - LoanCore.cltv_percent
      - LoanCore.loan_purpose
      - CreditReport.representative_score
      - LoanCore.dscr_qualification_method
      computable_checks:
      - 0
      - 1
      - 2
      - 3
      missing_reads:
      - Calculated DSCR
      - Whether the file is No Ratio
      - FICO
    action: require_evidence
    priority: 100
    description: Apply the stated CLTV and minimum FICO limits when DSCR is below
      1.0 or the file is No Ratio.
    citations:
