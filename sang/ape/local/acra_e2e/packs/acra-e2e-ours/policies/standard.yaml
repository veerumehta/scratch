      - loan_application
      - credit_report
      reads:
      - LoanCore.cltv_percent
      - LoanCore.loan_purpose
      - CreditReport.representative_score
      computable_checks:
      - 0
      - 1
      - 2
      missing_reads:
      - Whether the property qualifies with short-term rentals
      - Whether the transaction is a purchase or refinance
      - FICO
