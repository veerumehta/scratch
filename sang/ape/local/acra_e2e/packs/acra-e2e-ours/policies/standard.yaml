        certificate of acknowledgement includes the embassy or consular seal and is
        acceptable to the title company. For the Hague Convention route, verify an
        authorized notary public completed and signed the certificate of acknowledgment,
        authentication by apostille in English is attached to the executed documents,
        and the title company accepts it.'
