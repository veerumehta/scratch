  - rule_id: acra-standard.loan_program_eligibility.investment_property_fico_and_cltv_matrix
    condition:
      kind: procedure
      purpose: Determine the published matrix CLTV limit for the loan's loan-amount
        tier, representative FICO, and transaction column.
      steps:
      - 'Initial Document Review: Review the loan application and credit_report for
        loan amount, loan purpose, and representative FICO.'
      - 'Eligibility Verification: Select the printed loan-amount tier, minimum-FICO
        row, and Purchase, Rate & Term, or Cash-Out column that apply.'
      - 'Validation and Verification: Compare the proposed CLTV with the selected
        matrix value; treat NA as NA. For loans of $1,500,000 or less with a score
        below 600, note that no row is printed and the document requests Acra confirmation
        on eligibility.'
      - 'Final Determination: Record whether the published matrix value permits the
        proposed CLTV, or whether Acra confirmation is required because no row is
        printed.'
      checks:
      - Where the matrix prints a value for the loan amount, representative FICO,
        and loan purpose, the proposed CLTV does not exceed that value.
      - For loans of $1,500,000 or less with a score below 600, Acra confirmation
        is obtained because no row is printed and eligibility is not stated.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every step is met and every check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The loan amount is $1,500,000 or less and the applicable score
          is below 600, pending Acra confirmation of eligibility.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A step is not met, the proposed CLTV exceeds a printed matrix value,
          or the applicable matrix entry is NA.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - loan_application
      - credit_report
      reads:
      - LoanCore.total_loan_amount_usd
      - CreditReport.representative_score
      - LoanCore.loan_purpose
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      missing_reads:
      - Acra confirmation of eligibility for loans of $1,500,000 or less with a score
        below 600
