        and 60% refinance — R/T and cash-out; “FICO 640 to 659” — 60% purchase and
        60% refinance — R/T and cash-out. Do not interpret whether “FICO 700” means
        700 and above; obtain Acra confirmation.'
      - 'Final Determination: Apply the tier only as confirmed by Acra.'
      checks:
      - Acra confirmation resolves whether the printed “FICO 700” tier means 700 and
        above before that tier is applied.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Acra confirmation resolves the “FICO 700” tier interpretation,
          and the applicable printed CLTV maximum is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Acra confirmation about the “FICO 700” tier is outstanding; do
          not interpret that tier.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: After the applicable tier is confirmed, the ITIN loan exceeds its
          printed CLTV maximum.
