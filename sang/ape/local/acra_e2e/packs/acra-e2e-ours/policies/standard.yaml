        route and its stated requirements are met.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: No documents are signed outside the U.S., or the applicable STD-5.12
          route and its stated requirements are verified.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The signing location or an applicable acknowledgment, authentication,
