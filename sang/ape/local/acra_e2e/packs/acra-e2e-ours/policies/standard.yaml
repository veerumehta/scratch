  - rule_id: acra-standard.income_stability_sufficiency_analysis.apply_scenario_specific_minimum_dscr
    condition:
      kind: procedure
      purpose: Determine whether the loan meets the minimum DSCR and reserve requirements
        stated for the applicable program scenarios.
      steps:
      - 'Initial Document Review: Review the loan_application, appraisal_report, and
        credit_report for transaction, property, and credit information.'
      - 'Eligibility Verification: Identify each applicable scenario listed in the
        checks, including any scenario requiring data not held in the case fields.'
      - 'Validation and Verification: Compare DSCR with each applicable minimum and
        verify the stated reserves requirement when LTV is above 80.00%.'
      - 'Final Determination: Record whether every applicable minimum DSCR and reserve
        requirement is met. Do not resolve the stated Q-14 alternatives by assumption.'
      checks:
      - If LTV is above 80.00%, DSCR is at least 1.20.
      - If LTV is above 80.00%, reserves are at least 6 months PITIA.
      - If loan amount is over $2,000,000, DSCR is at least 1.0.
      - If there is 1 or no score / deficient tradelines, DSCR is at least 1.1.
      - If the property is rural / unique, DSCR is at least 1.00.
      - If the property is a non-warrantable condo; condotel / PUDtel, DSCR is at
        least 1.0.
      - If the borrower is a first-time homebuyer, DSCR is at least 1.150.
      - For a vacant property, rate & term refinance, DSCR is at least 1.000; the
        stated “OR Maximum 40.0% DTI” alternative is not resolved here.
      - For a vacant property, cash-out refinance, DSCR is at least 1.15.
