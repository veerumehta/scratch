      source: "import rules_lib\n\n\ndef check(ctx):\n    method = ctx['LoanCore.dscr_qualification_method']\n\
        \    missing = rules_lib.gaps(method=method)\n    if missing:\n        return\
        \ rules_lib.unknown(*missing)\n\n    applies = rules_lib.same(method, 'No\
        \ Ratio', 'DSCR below 1.0', 'DSCR < 1.0')\n    if not applies:\n        return\
        \ True\n\n    purpose = ctx['LoanCore.loan_purpose']\n    missing = rules_lib.gaps(purpose=purpose)\n\
        \    if missing:\n        return rules_lib.unknown(*missing)\n\n    if rules_lib.same(purpose,\
        \ 'purchase'):\n        cltv_limit = 75\n    elif rules_lib.same(purpose,\
        \ 'refinance rate & term', 'rate & term refinance'):\n        cltv_limit =\
        \ 70\n    elif rules_lib.same(purpose, 'refinance cash-out', 'cash-out refinance'):\n\
        \        cltv_limit = 65\n    else:\n        return True\n\n    cltv_raw =\
        \ ctx['LoanCore.cltv_percent']\n    score = ctx['CreditReport.representative_score']\n\
        \    missing = rules_lib.gaps(cltv=cltv_raw, fico=score)\n    if missing:\n\
        \        return rules_lib.unknown(*missing)\n\n    cltv = rules_lib.percent(cltv_raw,\
        \ 'percent')\n    if cltv is None:\n        return rules_lib.unknown('cltv')\n\
        \n    return cltv <= cltv_limit and score >= 640"
