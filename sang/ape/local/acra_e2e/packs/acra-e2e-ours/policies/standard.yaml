  - rule_id: acra-standard.identification_requirements.itin_maximum_cltv.python
    condition:
      kind: python
      source: "import rules_lib\n\n\ndef check(ctx):\n    citizenship = ctx['Borrower.citizenship_status']\n\
        \    missing = rules_lib.gaps(citizenship=citizenship)\n    if missing:\n\
        \        return rules_lib.unknown(*missing)\n    if not rules_lib.same(citizenship,\
        \ 'ITIN'):\n        return True\n\n    score = ctx['CreditReport.representative_score']\n\
        \    cltv = ctx['LoanCore.cltv_percent']\n    loan_purpose = ctx['LoanCore.loan_purpose']\n\
        \    missing = rules_lib.gaps(score=score, cltv=cltv, loan_purpose=loan_purpose)\n\
        \    if missing:\n        return rules_lib.unknown(*missing)\n\n    purchase\
        \ = rules_lib.same(loan_purpose, 'purchase')\n    refinance = rules_lib.same(loan_purpose,\
        \ 'refinance', 'R/T', 'rate & term', 'cash-out')\n    if not purchase and\
        \ not refinance:\n        return rules_lib.unknown('loan_purpose')\n\n   \
        \ below_minimum = rules_lib.band(score, [(639, True)], above=False)\n    if\
        \ below_minimum is None:\n        return rules_lib.unknown('score')\n    if\
        \ below_minimum:\n        return False\n\n    tier_cap = rules_lib.band(score,\
        \ [(659, 60), (699, 65)], above=None)\n    if tier_cap is None:\n        return\
        \ rules_lib.unknown('Acra confirmation on whether the printed FICO 700 tier\
        \ means 700 and above')\n\n    cap = tier_cap if purchase and tier_cap ==\
        \ 65 else 60\n    cltv_value = rules_lib.percent(cltv, 'percent')\n    if\
