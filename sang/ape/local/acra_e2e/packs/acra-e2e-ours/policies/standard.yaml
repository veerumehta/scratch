  - rule_id: acra-standard.asset_assessment_assets_and_funds_to_close.borrower_contribution_with_gift_funds
    condition:
      kind: procedure
      purpose: Determine whether the applicant contributes a minimum of 10% of the
        purchase price from their own sourced and seasoned funds when gift funds are
        used.
      steps:
      - 'Step 1 - Initial Document Review: Review bank_statement and the loan_application
        for gift funds and the applicant''s own funds contributed to the transaction.'
      - 'Step 2 - Eligibility Verification: If gift funds are used, identify the applicant''s
        own sourced and seasoned funds and the purchase price.'
      - 'Step 3 - Validation and Verification: Verify the applicant''s own sourced
        and seasoned contribution is at least 10% of the purchase price.'
      - 'Step 4 - Final Determination: Determine whether the required own-funds contribution
        is established, or whether the job does not apply because gift funds are not
        used.'
      checks:
      - If gift funds are used, the applicant contributes own sourced and seasoned
        funds of at least 10% of the purchase price.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Gift funds are used and the applicant's own sourced and seasoned
          funds are at least 10% of the purchase price.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Gift funds are used and the applicant's own sourced and seasoned
          funds are less than 10% of the purchase price, or their source or seasoning
          is not established.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Gift funds are not used.
        carries_conditions: false
      evidence_types:
      - bank_statement
      - loan_application
      reads: []
      computable_checks: []
      missing_reads:
      - Whether gift funds are used
      - Amount of applicant's own funds contributed
      - Source and seasoning of applicant's own funds
      - Purchase price
