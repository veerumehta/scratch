  - rule_id: acra-standard.identification_requirements.foreign_funds_seasoning
    condition:
      kind: procedure
      purpose: Verify the seasoning requirement and any applicable supporting documentation.
      steps:
      - 'Initial Document Review: Review account statements and the available funds
        history.'
