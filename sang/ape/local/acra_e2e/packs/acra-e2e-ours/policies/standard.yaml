  - rule_id: acra-standard.appraisal_review_property_eligibility.ineligible_state
    condition:
      kind: procedure
      purpose: Establish whether the subject property is located in SD, which STD-1.13
        identifies as ineligible.
      steps:
      - 'Step 1 - Initial Document Review: Review the appraisal_report for the subject
        property location.'
      - 'Step 2 - Eligibility Verification: Identify the subject property''s state.'
      - 'Step 3 - Validation and Verification: Verify the state against the case record.'
      - 'Step 4 - Final Determination: Record whether the subject property is in SD.'
      checks:
      - SubjectProperty.state is SD.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The check holds; the subject property is in SD.
        carries_conditions: false
      - status: CONDITIONAL
