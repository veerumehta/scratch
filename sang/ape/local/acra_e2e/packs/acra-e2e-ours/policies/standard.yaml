  - rule_id: acra-standard.income_stability_sufficiency_analysis.calculate_dscr
    condition:
      kind: procedure
      purpose: Determine the DSCR for the loan using the stated formula and payment
        basis.
      steps:
      - 'Initial Document Review: Review the appraisal_report and any lease_agreement,
        bank_statement, hazard_insurance, and hoa_questionnaire available for the
        rent and PITIA information.'
      - 'Eligibility Verification: Identify annual in-place rent, market rent, and
        the first payment due under the Note; include subordinate financing, if applicable,
        in the denominator.'
      - 'Validation and Verification: Calculate annual PITIA as annual principal,
        interest, real estate taxes, property insurance, and homeowner''s / condominium
        association fees; use the lesser of annual in-place rent or market rent as
        the numerator.'
      - 'Final Determination: Divide the qualifying annual rent by annual PITIA and
        record the resulting DSCR. Do not resolve the stated interest-only payment
        question by assumption.'
      checks:
      - The numerator is the lesser of annual in-place rent or market rent.
      - The denominator is the sum of annual principal, interest, real estate taxes,
        property insurance, homeowner's / condominium association fees, and subordinate
        financing if applicable.
      - The DSCR uses the first payment due under the terms of the Note.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every step is met and every check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A step is not met or a check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      - lease_agreement
      - bank_statement
      - hazard_insurance
      - hoa_questionnaire
      reads: []
      computable_checks: []
      missing_reads:
      - Annual in-place rent
      - Market rent
      - Annual principal
      - Annual interest
      - Annual real estate taxes
      - Annual property insurance
      - Annual homeowner's / condominium association fees
      - Subordinate financing amount, if applicable
      - First payment due under the Note
      - Which payment enters the denominator for an interest-only loan
    action: require_evidence
    priority: 100
    description: Calculate the DSCR using the qualifying-rent and PITIA rules stated
      in the guidelines.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent — both
      provisions, as written
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: Income
        assistant:
        - Underwriter
        mnemonic: DSCR-RATIO
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
          - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying rent
            — both provisions, as written
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
        job_kind: determination
      ledger:
        clause: 'STD-3.1 “Acra calculates the DSCR by dividing (a) the lesser of (i)
          annual in-place rent or (ii) market rent (reference §14.14) by (b) the sum
          of annual principal, interest, real estate taxes, property insurance, and
          homeowner''s / condominium association fees (collectively, ‘PITIA’). Subordinate
          financing, if applicable, would also be included in the denominator for
          the sake of this calculation.” \[G §5.32, p. 3\]


          STD-3.2 “Acra calculates the DSCR utilizing the first payment due under
          the terms of the Note.” §7.5 defines Interest Only payments as “the amount
          sufficient to pay the accrued interest to the mortgage on a monthly basis
          at the time of origination”, while the §5.32 denominator lists “annual principal,
          interest …”. Which payment enters the DSCR denominator on an interest-only
          loan: Acra confirmation requested → Q-26. \[G §7.5, p. 13; §5.32, p. 3\]


          STD-3.3 The reference to subordinate financing in the denominator is a calculation
          rule; it does not itself establish that a subordinate lien is permitted.
          Whether and when subordinate financing is permitted: Acra confirmation requested
          → Q-18. \[G §5.32, p. 3\]


          STD-3.4 §14.14 (market rent), referenced in the formula, is not reproduced
          in the excerpt (Appendix B). \[G §5.32, p. 3\]


          STD-3.5 Formula: the lesser of annual in-place rent or market rent (STD-3.1).
          \[G §5.32, p. 3\]


          STD-3.6 Note in the same section: “Acra may use the higher of actual or
          market rents. Where actual rents exceed market rents, then evidence of actual
          rents must be documented via two (2) consecutive months proof of rental
          income receipt and lease agreement(s) to continue at a minimum of three
          (3) months after closing. Note: Security Deposit does not count towards
          receipt, and the rents cannot be prepaid.” \[G §5.32, p. 3; repeated under
          Actual Rents, p. 5\]


          STD-3.7 This document does not select between STD-3.5 and STD-3.6. When
          market rent may be used if actual rent is lower, when higher actual rent
          may be used, and whether the stated documentation is sufficient or further
          approval is required: Acra confirmation requested → Q-01.


          STD-3.8 “If vacant property is being purchased, qualifying rents are taken
          from the 1007 or 1025 Appraisal report, as applicable, for qualifying income.”
          Rental income from the purchase of a vacant property requires a 1007 survey
          if it is the subject of an Acra loan. \[G §5.32, p. 3; §5.30–5.31, p. 4\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.1 The ratio
          heading: ''
          text: 'STD-3.1 “Acra calculates the DSCR by dividing (a) the lesser of (i)
