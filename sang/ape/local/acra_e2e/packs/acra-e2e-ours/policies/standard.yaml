  - rule_id: acra-standard.insurance_coverage_sufficiency_policy_assessment.rent_loss_insurance_applicability
    condition:
      kind: procedure
      purpose: Determine whether six (6) months' rent loss insurance is required for
        the subject property.
      steps:
      - 'Initial Document Review: Review the available case information for the subject
        property''s occupancy, unit count, and qualification method.'
      - 'Eligibility Verification: Determine whether the subject property is a one-
        to four-unit non-owner occupied income property and whether subject property
        rents are used to qualify; include No Ratio DSCR when assessing rent use.'
      - 'Validation and Verification: Determine whether LTV is > 70% and whether CLTV
        is ≤ 70%. If LTV is at or below 70% while CLTV is above 70%, request Acra
        confirmation.'
      - 'Final Determination: Record whether the six (6) months'' rent loss insurance
        requirement applies, does not apply, or awaits the requested Acra confirmation.'
      checks:
      - The subject property is non-owner occupied.
      - The subject property is an income property.
      - The subject property has one to four units.
      - Subject property rents are used to qualify, including No Ratio DSCR.
      - LTV is > 70%.
      - CLTV is ≤ 70%.
      - LTV is at or below 70% while CLTV is above 70%.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The requirement's applicability is determined from the stated property,
          rent-use, LTV, and CLTV criteria, with no unresolved LTV/CLTV case.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: LTV is at or below 70% and CLTV is above 70%; Acra confirmation
          has been requested and must be obtained to resolve the applicability.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The available information establishes that the requirement applies,
          but the applicability determination has not been made.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property or qualification circumstances do not meet the stated
          conditions for the rent loss insurance requirement, or the CLTV exemption
          applies.
        carries_conditions: false
      evidence_types: []
      reads:
      - SubjectProperty.occupancy_subtype
      - SubjectProperty.number_of_units
      - LoanCore.dscr_qualification_method
      - LoanCore.cltv_percent
      computable_checks:
      - 5
      missing_reads:
      - Whether the subject property is an income property
      - Whether subject property rents are used to qualify
      - LTV
      - Acra confirmation for the case where LTV is at or below 70% and CLTV is above
        70%
