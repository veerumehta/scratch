  - rule_id: acra-standard.appraisal_review_property_eligibility.declining_market_reduction
    condition:
      kind: procedure
      purpose: Determine how the stated declining-market reduction applies to the
        property and borrower full profile and whether confirmation is needed for
        its combination with other caps.
      steps:
      - 'Step 1 - Initial Document Review: Review the appraisal_report and other applicable
        property and borrower information for declining-market status.'
      - 'Step 2 - Eligibility Verification: Apply “-5% CLTV property/borrower full
        profile”.'
      - 'Step 3 - Validation and Verification: Request Acra confirmation on how this
        reduction combines with other caps, as directed to Q-07.'
      - 'Step 4 - Final Determination: Record the reduction and the confirmation result.'
      checks:
      - For a declining market, “-5% CLTV property/borrower full profile” is applied.
      - Acra confirmation is obtained on how the reduction combines with other caps.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is in a declining market, the stated reduction is
          applied, and the combination with other caps is confirmed.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property is in a declining market and Acra confirmation or
          information needed to apply the reduction remains outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is in a declining market and the stated reduction
          is not applied or the confirmed combined cap is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property is not in a declining market.
        carries_conditions: false
      evidence_types:
      - appraisal_report
      reads:
      - SubjectProperty.appraised_value_usd
      - LoanCore.cltv_percent
      missing_reads:
      - Whether the market is declining; property/borrower full profile; Acra confirmation
        on combination with other caps (Q-07).
    action: require_evidence
    priority: 100
    description: Apply the stated declining-market CLTV reduction and obtain confirmation
      on its combination with other caps.
    citations:
    - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.3 Location
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        source: NEW
        section_type: property eligibility
        assistant:
        - Underwriter
        check_units:
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.3 Location
        - - Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.3 Location
        job_kind: limit
      ledger:
        clause: 'STD-1.13 Ineligible state: SD. \[S: Subject Property Location\]


          STD-1.14 Declining market: “-5% CLTV property/borrower full profile”. How
          this reduction combines with other caps: Acra confirmation requested → Q-07.
          \[S: Subject Property Location\]'
        clause_parts:
        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#1.3 Location
          heading: ''
          text: 'STD-1.13 Ineligible state: SD. \[S: Subject Property Location\]


