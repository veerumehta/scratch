  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.entity_documentation
    condition:
      kind: procedure
      purpose: Determine whether the entity has provided the required documentation
        without relying on borrower letters excusing missing documents.
      steps:
      - 'Step 1 - Initial Document Review: Obtain and review the entity_documents,
        including formation documents and amendments, the applicable Operating Agreement
        or Bylaws and amendments, ownership evidence, and all other documents required
        by STD-6.10.'
      - 'Step 2 - Eligibility Verification: Verify that the entity has provided the
        complete, legible documents applicable to its legal form, including the required
        ownership evidence and any applicable corporation or tax-year ownership evidence.'
      - 'Step 3 - Validation and Verification: Verify name matching or a letter of
        explanation; the good-standing validity period; any required foreign qualification;
        the entity’s SS4, TIN, or EIN issuance letter or a submitted exception request;
        unanimous written consent or board resolution; and any required power of attorney.
        Do not accept a borrower letter stating required documents are not required,
        available, or excused.'
      - 'Step 4 - Final Determination: Record whether all applicable required documents
        and contents are present; refer any additional supporting-documentation condition
        to Legal as stated.'
      checks:
      - A complete, legible Certificate of Formation or Articles of Organization and
        all amendments is provided.
      - For an LLC or Partnership, a complete, legible Operating Agreement with all
        referenced exhibits and amendments is provided; for a corporation, complete,
        legible Bylaws with all referenced exhibits and amendments are provided.
      - The Operating Agreement or Bylaws states whether the entity is member or manager
        managed, contains authorization to borrow money and enter into contracts for
        mortgage assets, and designates signers.
      - All documentation evidencing ownership interests is provided; for LLCs and
        Partnerships, the Operating Agreement identifies or attaches all persons by
        name with their ownership interest, or membership interest certificates or
        units compliant with the Operating Agreement are provided.
      - For an S or C Corporation, compliant shareholder or stockholder certificates
        are provided, if any, or the stock ledger is provided if certificates are
        lost or unavailable; the certificate or ledger accounts for all outstanding
        shares noted in the formation documents, including those held by the corporation;
        and an Affidavit of Lost Stock Certificate is provided if stock certificates
        are lost, destroyed, mutilated, or otherwise unavailable.
      - For an S-corporation or Partnership where both stock certificate and stock
        ledger are unavailable, the most recent preceding tax year's K-1 statement
        for all members with 20% or more interest and a letter from the CPA or Tax
        Preparer affirming current ownership interest are provided; if the preceding
        year's taxes have not been filed, the letter includes a statement to that
        effect.
      - Names on the entity documents match the identification, or a letter of explanation
        addresses any discrepancy.
      - A Certificate of Good Standing or equivalent document valid within ninety
        (90) days of the closing date is provided.
      - If the entity is formed in a state other than where business is conducted
        or where the property is located, a Certificate of Foreign Qualification or
        other qualification to operate in the applicable state is provided.
      - The entity’s IRS Form SS4, Federal Taxpayer Identification Number (TIN), or
        Employer Identification Number (EIN) issuance letter is provided, or an EIN
        exception request is submitted for review by Acra's Legal Department with
        a letter of explanation stating the applicable grounds.
      - A Unanimous Written Consent or Board Resolution signed by all members regardless
        of their percentage of interest authorizes the transaction with Acra Lending
        and identifies who is authorized to sign the loan documents on behalf of and
        to bind the entity.
      - A Power of Attorney is utilized by the principal to designate an attorney
        in fact to execute a personal guarantee when required for that purpose.
      - A borrower letter is not used to state that required entity documents are
        not required, available, or excused.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable check holds and all required documents are provided.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Legal has conditioned for additional supporting documentation and
          it remains to be provided.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable required document or content is missing or deficient,
          a borrower letter is relied on to excuse a required document, or conditioned
          documentation is not provided.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity borrower.
        carries_conditions: false
      evidence_types:
      - entity_documents
      reads:
      - Borrower.entity_documents_complete
      missing_reads:
      - entity legal form
      - formation documents and all amendments
      - Operating Agreement or Bylaws, referenced exhibits, and amendments
      - entity management structure, borrowing and contracting authority, and designated
        signers
      - ownership interests and supporting ownership records
      - applicable corporation stock records and any Affidavit of Lost Stock Certificate
      - availability of stock certificates and stock ledger; preceding tax-year filing
        status; K-1 statements; CPA or Tax Preparer letter
      - identification names and entity document names
      - closing date and Certificate of Good Standing or equivalent validity date
      - formation state, business state, and property state
      - entity tax identification documentation or EIN exception request and grounds
      - all-member consent or board resolution and authorized signers
      - principal, attorney in fact, and applicable Power of Attorney
      - any additional supporting documentation required by Legal
