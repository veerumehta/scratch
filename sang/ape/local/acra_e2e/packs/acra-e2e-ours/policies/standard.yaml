  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.revocable_living_trust_vesting
    condition:
      kind: procedure
      purpose: Determine whether title vesting in the trust meets the stated conditions.
      steps:
      - 'Step 1 - Initial Document Review: Review the title commitment and the complete
        trust or Certification of Trust, together with any supporting documentation
        and written exception.'
      - 'Step 2 - Eligibility Verification: Verify the trust document contents, trust
        validity and revocability, trustors, beneficiaries, trustee powers, and any
        required written exception.'
      - 'Step 3 - Validation and Verification: Verify the required provisions concerning
        title, mortgage authority, beneficiary consent, lender rights, and whether
        the trust has been revoked, modified, or amended; identify any additional
        documentation Legal requires.'
      - 'Step 4 - Final Determination: Record whether every applicable trust condition
        is met and whether any required written exception or conditioned supporting
        documentation remains outstanding.'
      checks:
      - A complete, legible copy of the Trust or a Certification of Trust is provided,
        stating the Trust’s existence and date; Trustor(s) and current Trustee(s);
        Trustee powers; whether the Trust is revocable and, if so, who holds the right
        to revoke; names and number of Trustees required to sign; Trust identification
        number (a Social Security number or an IRS-issued Tax Identification Number);
        how title to Trust assets should be taken; and that the Trust has not been
        revoked, modified, or amended in any manner.
      - The Trust is valid under the laws of the state in which it is established.
      - The Trust is revocable, meaning it can be changed or canceled at any time
        for any reason during a Trustor's lifetime; it is not irrevocable.
      - The Trust is established by one or more natural persons, solely or jointly
        (Grantor, Trustor, or Settlor), and becomes effective during the lifetime
        of the person(s) establishing it.
      - The primary beneficiary of the Trust is the individual(s) establishing the
        Trust.
      - If the Trustor(s) and Trustee(s) are not the same, written exception by Acra
        Senior Management is obtained.
      - The Trust specifies that the Trustee has the power to hold title and mortgage
        the property; that the beneficiary does not need to grant written consent
        for the Trust to borrow money, or that such consent has been granted in writing
        for purposes of the mortgage; that there is no unusual risk or impairment
        to the lender's rights; and that holding title in the Trust does not diminish
        the lender's rights as a creditor.
      - Any additional supporting documentation for which Legal conditions is provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every applicable check holds and all required supporting documentation
          is provided.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: A required written exception or additional supporting documentation
          has been conditioned for and remains to be obtained or provided.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: An applicable trust check does not hold or a required condition
          is not cleared.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: Title is not vested in an inter vivos revocable trust.
        carries_conditions: false
      evidence_types:
      - title_commitment
      - entity_documents
      reads: []
      computable_checks: []
      missing_reads:
      - trust document or Certification of Trust and all required contents
      - state where the Trust is established and evidence of validity under that state’s
        laws
      - revocability and right to revoke
      - Trustor(s), Trustee(s), and beneficiary identities
      - Trustee powers and required signing number
      - Trust identification number and title-taking instructions
      - Trust effective date and Trustor lifetime status
      - written Acra Senior Management exception if Trustor(s) and Trustee(s) differ
      - required trust provisions on title, mortgage authority, beneficiary consent,
        unusual risk, and lender creditor rights
      - any additional supporting documentation required by Legal
    action: require_evidence
    priority: 100
    description: Verify each stated requirement for permitted title vesting in an
      inter vivos revocable trust, including any required Acra Senior Management exception.
