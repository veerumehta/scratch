        seasoning requirement regardless of LTV / CLTV.'
      - 'Validation and Verification: If funds are not seasoned a minimum of sixty
        (60) days, verify a letter of explanation and information to comprise a sixty
        (60) day chain of funds.'
      - 'Final Determination: Record whether the seasoning requirement and any applicable
        supporting documentation are verified.'
      checks:
      - Foreign National funds are seasoned a minimum of 60 days, or, if not seasoned
        a minimum of sixty (60) days, a letter of explanation and information to comprise
        a sixty (60) day chain of funds are provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The minimum 60 days seasoning is verified, or the applicable letter
          of explanation and sixty (60) day chain of funds are provided.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Seasoning or applicable supporting documentation remains unverified
          or outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The minimum 60 days seasoning is not met and the applicable letter
          of explanation or sixty (60) day chain of funds is not provided.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
