  - rule_id: acra-standard.asset_assessment_assets_and_funds_to_close.foreign_funds_repatriation
    condition:
      kind: procedure
      purpose: Determine whether funds held in a foreign bank or currency are repatriated
        at minimum three (3) business days prior to Closing.
      steps:
      - 'Step 1 - Initial Document Review: Review bank_statement and closing records
        for funds held in a foreign bank or currency and their transfer to the closing
        account.'
      - 'Step 2 - Eligibility Verification: Determine whether funds to close are held
        in a foreign bank or currency.'
      - 'Step 3 - Validation and Verification: If funds are held in a foreign bank
        or currency, verify they are repatriated at minimum three (3) business days
        prior to Closing.'
      - 'Step 4 - Final Determination: Determine whether the repatriation timing requirement
        is met, or whether the job does not apply.'
      checks:
      - If funds to close are held in a foreign bank or currency, they are repatriated
        at minimum three (3) business days prior to Closing.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Funds held in a foreign bank or currency are repatriated at minimum
          three (3) business days prior to Closing.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: Funds held in a foreign bank or currency are not repatriated at
          minimum three (3) business days prior to Closing.
        carries_conditions: false
