  - rule_id: acra-standard.loan_program_eligibility.investment_property_status
    condition:
      kind: procedure
      purpose: Establish whether the property is eligible as an investment property
        under STD-1.1 and STD-1.2.
      steps:
      - 'Initial Document Review: Review the loan application and lease_agreement
        for the subject property''s occupancy and lease information.'
      - 'Eligibility Verification: Determine whether the property is a one- to four-unit
        residential dwelling or a unit in a condominium complex or a PUD.'
      - 'Validation and Verification: Verify that the dwelling is leased and occupied
        as a principal year-round residence to individuals other than the owner, and
        that the owner does not occupy it.'
      - 'Final Determination: Record whether the subject property meets the investment-property
        definition.'
      checks:
      - The property is a one- to four-unit residential dwelling or a unit in a condominium
        complex or a PUD.
      - The dwelling is not occupied by its owner.
      - The dwelling is leased and occupied as a principal year-round residence to
        individuals other than the owner.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: Every step is met and every check holds.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: A step is not met or a check does not hold.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - loan_application
      - lease_agreement
      - rent_roll
      reads:
      - SubjectProperty.property_type
      - SubjectProperty.number_of_units
      - SubjectProperty.occupancy_subtype
      - SubjectProperty.has_current_lease
      computable_checks: []
      missing_reads:
      - Whether the owner occupies the dwelling
      - Whether the dwelling is occupied as a principal year-round residence by individuals
        other than the owner
