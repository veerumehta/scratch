  - rule_id: acra-standard.credit_review_analysis_credit.mortgage_history_cltv_limits
    condition:
      kind: procedure
      purpose: Determine whether CLTV meets the mortgage history restriction printed
        for the applicable label and purpose.
      steps:
      - 'Initial Document Review: Review the credit report for the mortgage-history
        label.'
      - 'Eligibility Verification: Identify the applicable loan purpose and printed
        mortgage-history label. The labels are Acra''s; their definitions and how
        seasoning is measured are identified as Acra confirmation requested → Q-05.'
      - 'Validation and Verification: Apply the printed limits: 1x30x12—80% Purchase,
        75% Refi R/T, Refi C/O; 0x60x12—75% Purchase, 70% Refi R/T, Refi C/O; 0x90x12—65%
        for both; 0x120x12—Ineligible for both. Where the Summary prints a single
        figure without a purpose split (“Max CLTV: 65%”), it is shown in both columns.'
      - 'Final Determination: Determine whether the applicable printed limit is met.'
      checks:
      - For the applicable printed mortgage-history label and loan-purpose column,
        CLTV does not exceed the listed maximum; 0x120x12 is Ineligible.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The applicable printed CLTV maximum is met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The applicable printed CLTV maximum is exceeded or the applicable
          label is Ineligible.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: There is no case for this outcome.
        carries_conditions: false
      evidence_types:
      - credit_report
      reads:
      - CreditReport.housing_history_rating
      - LoanCore.loan_purpose
      - LoanCore.cltv_percent
      computable_checks:
      - 0
      missing_reads:
      - the applicable printed mortgage-history label
      - the loan-purpose column applicable to the printed table
      - the definitions of Acra's labels and how seasoning is measured (Acra confirmation
        requested → Q-05)
