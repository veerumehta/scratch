        requirement are met.'
      checks:
      - A loan that has matured is rated based on its maturity date, and any extension
        of the maturity date is in writing.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The loan has matured and is rated based on its maturity date, with
          any extension in writing, or the loan has not matured.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: There is no case for this outcome.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The loan has matured and is not rated based on its maturity date,
          or an extension of the maturity date is not in writing.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The loan has not matured.
        carries_conditions: false
      evidence_types: []
      reads: []
      computable_checks: []
      missing_reads:
      - whether the loan has matured
      - the loan's maturity date
      - whether an extension exists
      - whether any extension is in writing
      - the rating based on the maturity date
