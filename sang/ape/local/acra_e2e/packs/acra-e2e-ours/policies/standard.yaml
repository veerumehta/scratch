      - Whether the transaction is cash-out refinance; FICO; DSCR; whether prepayment
        penalties are allowable; PPP term; impounds; reserves; confirmation for loan
        amount of $1,500,000 or more; ownership months and confirmation on how the
        15 months are measured.
