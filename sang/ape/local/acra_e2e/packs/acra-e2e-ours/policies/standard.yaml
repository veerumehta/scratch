        - citation: Acra_DSCR_Standard_Consolidated_Guidelines_v1_0.docx#3.2 Qualifying
            rent — both provisions, as written
          heading: ''
          text: 'STD-3.5 Formula: the lesser of annual in-place rent or market rent
            (STD-3.1). \[G §5.32, p. 3\]


            STD-3.6 Note in the same section: “Acra may use the higher of actual or
            market rents. Where actual rents exceed market rents, then evidence of
            actual rents must be documented via two (2) consecutive months proof of
            rental income receipt and lease agreement(s) to continue at a minimum
            of three (3) months after closing. Note: Security Deposit does not count
            towards receipt, and the rents cannot be prepaid.” \[G §5.32, p. 3; repeated
            under Actual Rents, p. 5\]


