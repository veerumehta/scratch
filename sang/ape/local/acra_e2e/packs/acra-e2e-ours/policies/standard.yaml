  - rule_id: acra-standard.compliance_and_closing_the_borrowing_entity_and_title.guarantor_homeownership_experience
    condition:
      kind: procedure
      purpose: Determine whether the required prior-homeownership experience is attested
        and supported as required.
      steps:
      - 'Step 1 - Initial Document Review: Review the loan application for the borrower
        or guarantor attestation and review the loan file for evidence of prior homeownership.'
      - 'Step 2 - Eligibility Verification: Verify that at least one borrower or guarantor
        attests on the application that they are not a first-time homebuyer.'
      - 'Step 3 - Validation and Verification: If prior homeownership is not evident
        within the loan file, condition for supporting documentation and verify that
        it is provided.'
      - 'Step 4 - Final Determination: Record whether the attestation is present and
        whether required supporting documentation has been provided.'
      checks:
      - At least one borrower or guarantor on the loan attests on the application
        that they are not a first-time homebuyer.
      - If prior homeownership is not evident within the loan file, supporting documentation
        required by the underwriter is provided.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The attestation check holds and, if supporting documentation was
          conditioned for, that documentation is provided.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: Supporting documentation has been conditioned for because prior
          homeownership is not evident within the loan file and remains to be provided.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The attestation check does not hold, or conditioned supporting
          documentation is not provided.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The borrower is not an entity borrower and no guarantor homeownership
          experience is required under this provision.
        carries_conditions: false
      evidence_types:
      - loan_application
      reads:
      - Borrower.is_first_time_homebuyer
      missing_reads:
      - identity of borrower or guarantor making the attestation
      - application attestation
      - evidence of prior homeownership in the loan file
      - supporting documentation if conditioned
