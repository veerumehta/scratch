  - rule_id: acra-standard.appraisal_review_property_eligibility.listed_property_eligibility_conditions
    condition:
      kind: procedure
      purpose: Determine whether a property considered listed for sale meets the stated
        lien, occupancy, qualification, prepayment, reserves, amortization, LTV/CLTV,
        subordinate-financing, and impound requirements.
      steps:
      - 'Step 1 - Initial Document Review: Review listing_history, appraisal_report,
        credit and loan records, and documents establishing lien status, occupancy,
        prepayment penalty, reserves, subordinate financing, and impounds.'
      - 'Step 2 - Eligibility Verification: Verify each applicable STD-8.9 condition,
        including the lesser-of value basis for the 65% maximum LTV / CLTV.'
      - 'Step 3 - Validation and Verification: Verify qualification by ≥ 1.0 DSCR
        or 43% maximum DTI, and verify the property''s state for the prepayment-penalty
        exception.'
      - 'Step 4 - Final Determination: Record whether all applicable listed-property
        conditions are met.'
      checks:
      - The property is not in default or otherwise delinquent on lien(s).
      - For investment properties, the subject is occupied by a tenant and is not
        vacant.
      - The loan qualifies as either ≥ 1.0 DSCR or 43% maximum DTI (Q-14).
      - A prepayment penalty of at least three (3) years is required unless the property
        is in a state that does not allow prepayment penalties.
      - Twenty-four (24) months of reserves are required; cash-in-hand may be considered
        if otherwise consistent with the Guide.
      - The loan has a fully amortizing term; interest only is not available.
      - Maximum LTV / CLTV is 65% based on the lesser of appraised value or lowest
        recent listing price.
      - No subordinate financing is allowed.
      - Impounds are required.
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: The property is considered listed for sale and all applicable STD-8.9
          conditions are met.
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: The property is considered listed for sale and a required document,
          information item, or determination remains outstanding.
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: The property is considered listed for sale and an applicable STD-8.9
          condition is not met.
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: The property is not considered listed for sale under §11.5.
        carries_conditions: false
      evidence_types:
      - listing_history
      - appraisal_report
      - lease_agreement
      - rent_roll
      - credit_report
      - hazard_insurance
      - title_commitment
      - bank_statement
      reads:
      - SubjectProperty.listed_for_sale_last_6_months
      - SubjectProperty.is_vacant
      - SubjectProperty.occupancy_subtype
      - SubjectProperty.appraised_value_usd
      - SubjectProperty.state
      - LoanCore.cltv_percent
      - MortgageLoanInformation.is_interest_only
      - LoanCore.prepayment_penalty_structure
      - RatioSet.reserves_months
      missing_reads:
      - Lien default or delinquency status; whether the property is an investment
        property and tenant occupied; DSCR or DTI; whether the state allows prepayment
        penalties; prepayment-penalty term; reserves and whether cash-in-hand is consistent
        with the Guide; amortization; lowest recent listing price; subordinate financing;
        impounds.
