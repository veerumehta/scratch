          (DSCR-PITIA)'
        source_text: '# DSCR Ratio Calculation - Base Version


          ## Purpose

          This JTBD computes the DSCR on files that qualify by a calculated ratio (LPE-QUAL-METHOD). Acra
          calculates the DSCR by dividing (a) qualifying rent — the lesser of annual in-place rent or
          market rent, subject to the higher-of note (DSCR-QUALRENT) — by (b) the sum of annual principal,
          interest, real estate taxes, property insurance and association fees (PITIA), including subordinate
          financing where applicable, utilizing the first payment due under the terms of the Note. Interest-only
          denominators are tested in DSCR-IO-DENOM (Q-26).


          ## Reference Documents

          ### Loan and Income Documents

          - Note: first payment due and amortization type

          - Form 1007 / 1025 and Lease(s): qualifying rent (DSCR-QUALRENT)

          - Tax certificate, hazard policy, HOA statement, subordinate lien statement: PITIA components
          (DSCR-PITIA)


          ## Steps


          ### Step 1 - Initial Document Review

          - Note states the first payment due and whether the loan is fully amortizing or interest-only.


          ### Step 2 - Eligibility Verification

          - Qualifying rent and PITIA figures are both present and dated consistently with the credit
          and appraisal documentation.


          ### Step 3 - Validation and Verification

          - DSCR = qualifying monthly rent ÷ monthly PITIA (first payment due under the Note), recorded
          to two decimals.


          ### Step 4 - Final Determination

          - Calculated ratio is passed to the minimum-ratio JTBDs (LFC-DSCR-FINAL and situation-specific
          minimums).


          ## Deterministic Validation Rules

          - Qualification method is calculated DSCR: TRUE = continue, FALSE = not applicable (No Ratio).

          - Denominator is the first payment due under the Note plus taxes, insurance, HOA and subordinate
          payment, not a hypothetical fully amortized payment: TRUE = correct, FALSE = recalculation required.

          - DSCR = RatioSet.total_monthly_income_usd ÷ RatioSet.total_monthly_obligation_usd is a positive
          number: TRUE = valid, FALSE = correction required.

          - Loan is interest-only: denominator basis tested separately under DSCR-IO-DENOM (Q-26).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

