  - rule_id: PPT-SUBFIN-HELOC.standard
    condition:
      kind: procedure
      purpose: 'This JTBD handles subordinate financing. The Summary states: ''For all Programs with allowable
        Subordinate/Secondary Financing: If Subordinate/Secondary Financing is a HELOC, CLTV will be calculated
        on the greater of the credit line limit or current credit line balance for eligibility.'' This
        is a calculation rule conditioned on subordinate financing being allowable; whether it is allowed
        on Standard DSCR, for which lien types and transactions, and with what leverage and payment rules,
        is open (Acra confirmation requested → Q-18). No subordinate financing is allowed on a property
        listed for sale (§11.5).'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Title and liabilities identify any subordinate lien on the subject.


        ### Step 2 - Eligibility Verification

        - Where the lien is a HELOC, CLTV is recomputed on the greater of the line limit or balance.


        ### Step 3 - Validation and Verification

        - Listed-for-sale status is checked (subordinate financing prohibited).


        ### Step 4 - Final Determination

        - No subordinate lien → not applicable; HELOC CLTV correct and Acra confirms eligibility → pass;
        listed property with subordinate financing → fail.'
      checks:
      - 'A Liability with is_subject_property_lien = TRUE and lien_position > 1 exists: TRUE = continue,
        FALSE = not applicable.'
      - 'Liability.liability_type = ''HELOC'': CLTV computed on MAX(Liability.credit_limit_usd, Liability.unpaid_balance_usd):
        TRUE = correct, FALSE = recalculation required.'
      - 'Subject listed for sale within six months and subordinate financing exists: TRUE = fail.'
      - 'Subordinate financing present on any other file: conditional (Q-18).'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
