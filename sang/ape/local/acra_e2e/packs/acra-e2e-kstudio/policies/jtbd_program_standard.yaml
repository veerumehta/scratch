        source_text: '# Foreign National — 60-Day Seasoning and Statement Requirements - Base Version


          ## Purpose

          This JTBD applies §3.10 and §8.4 for Foreign Nationals: a copy of the two most recent statements
          of the account is required; if the funds are not seasoned a minimum of sixty days, a letter
          of explanation is required along with the information to comprise a 60-day chain of funds; bank
          statements in any language other than English must be translated; Foreign Nationals, regardless
          of LTV / CLTV, need to document a minimum of 60 days seasoning. Repatriation timing is AFC-FOREIGN-REPAT.


          ## Reference Documents

          ### Asset Documents

          - Two most recent statements: for each account relied on

          - English translation: for non-English statements

          - Letter of explanation and chain-of-funds evidence: where funds are not 60 days seasoned


          ## Steps


          ### Step 1 - Initial Document Review

          - Two most recent statements for each relied-on account are on file, translated where needed.


          ### Step 2 - Eligibility Verification

          - Funds are seasoned 60 days, or an LOE with a 60-day chain of funds is provided.


          ### Step 3 - Validation and Verification

          - Seasoning applies regardless of LTV / CLTV.


          ### Step 4 - Final Determination

          - Documented seasoning passes; otherwise conditioned.


          ## Deterministic Validation Rules

          - Two most recent statements on file (English or translated) for each relied-on account: TRUE
          = pass, FALSE = fail.

          - Funds seasoned >= 60 days OR LOE with 60-day chain of funds on file: TRUE = pass, FALSE =
          fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Two statements per account, translated where needed, with 60-day seasoning or an LOE and chain
          of funds.


          ### Conditional

          Assign **Conditional** when:

          - Statements are on file but the LOE / chain of funds for unseasoned funds is pending.


          ### Fail

          Assign **Fail** when:

          - Statements are missing, untranslated, or funds are unseasoned without an LOE and chain.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No borrower is a Foreign National.'
