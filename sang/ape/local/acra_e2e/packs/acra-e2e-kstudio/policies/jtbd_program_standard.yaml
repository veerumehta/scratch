          - Consent / Resolution is missing, unsigned by all members, or used to designate a guarantee
          signer.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual (or a revocable trust of individuals) and no entity borrower
          is on the loan.'
