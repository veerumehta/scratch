          - Appraisal Report: value used for LTV


          ## Steps


          ### Step 1 - Initial Document Review

          - Cash to borrower, LTV / CLTV and loan amount are extracted from the CD and 1008.


          ### Step 2 - Eligibility Verification

          - LTV band is determined: > 65% (capped) or <= 65% (unlimited, subject to Q-17 scope).


          ### Step 3 - Validation and Verification

          - Cash-in-hand is compared with the cap for the loan-amount band ($1,000,000 at >= $1.5M; $500,000
          below $1.5M).


          ### Step 4 - Final Determination

          - Cash-in-hand within cap passes; excess fails; files relying on unlimited cash-in-hand outside
          Tier 3, or with subordinate financing, proceed subject to Q-17.


          ## Deterministic Validation Rules

          - LoanCore.loan_purpose = ''RefinanceCashOut'': TRUE = continue, FALSE = not applicable.

          - LoanCore.ltv_percent > 65 and LoanCore.total_loan_amount_usd >= 1,500,000: LoanCore.cash_out_amount_usd
          <= 1,000,000 → pass, else fail.

          - LoanCore.ltv_percent > 65 and LoanCore.total_loan_amount_usd < 1,500,000: LoanCore.cash_out_amount_usd
          <= 500,000 → pass, else fail.

          - LoanCore.ltv_percent <= 65: unlimited cash-in-hand; conditional (Q-17) when the loan is not
          in the $2,000,001-$3,000,000 tier or subordinate financing exists.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Cash-in-hand is within the applicable footnote cap for the LTV band and loan amount.


          ### Conditional

          Assign **Conditional** when:

          - Cash-in-hand exceeds the > 65% cap but LTV is 65% or less on a loan outside the tier carrying
          footnote 2''s marker, or the LTV / CLTV basis matters because subordinate financing exists;
          proceeds subject to Q-17.


          ### Fail

          Assign **Fail** when:

          - LTV exceeds 65% and cash-in-hand exceeds $1,000,000 (loan >= $1.5M) or $500,000 (loan < $1.5M).


          ### Not Applicable

          Assign **Not Applicable** when:

          - The transaction is not a cash-out refinance.'
        source_digest: 34b0564cbaf8bf17076438f9ee4b1ab7d50301da33dbb8fd83af8d797d46f63a
