          entity_type: Borrower
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Loan Records

          - Loan Application (1003): declaration of ownership interest in property in the last 3 years
          and REO

          - Credit Report / payment history: prior mortgages evidencing ownership'
        source_text: '# First-Time Homebuyer Determination - Base Version


          ## Purpose

          This JTBD applies §3.13: ''Acra defines a First Time Home Buyers (FTHB) as an application where
          all Applicants have never previously owned a home (real property).'' An FTHB application is
          eligible on DSCR subject to the conditions in LPE-FTHB-COND. The §3.12 requirement that an entity
          have a guarantor with prior homeownership is BET-FTHB-ATTEST (interaction: Q-09).


          ## Reference Documents

          ### Loan Records

          - Loan Application (1003): declaration of ownership interest in property in the last 3 years
          and REO

          - Credit Report / payment history: prior mortgages evidencing ownership


          ## Steps


          ### Step 1 - Initial Document Review

          - Each applicant''s 1003 declarations and REO are reviewed for prior ownership of real property.


          ### Step 2 - Eligibility Verification

          - Credit history is checked for prior mortgages.


          ### Step 3 - Validation and Verification

          - If no applicant has ever owned real property, the application is FTHB.


          ### Step 4 - Final Determination

          - FTHB status recorded; LPE-FTHB-COND applies when FTHB.


          ## Deterministic Validation Rules

          - For every Borrower, is_first_time_homebuyer = TRUE and no prior ownership is evidenced by
          REO or credit: TRUE = FTHB application, FALSE = not FTHB.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - FTHB status is determined from declarations, REO and credit for every applicant.


          ### Conditional

          Assign **Conditional** when:

          - An applicant''s declaration conflicts with credit evidence of a prior mortgage; explanation
          pending.


          ### Fail

          There is no case for this outcome.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: bfc2446eab3e213761c246b547f7190fdd1c24227f09082e3f1454f220231e58
        section: Identification Requirements
        mnemonic: BOR-FTHB-DEF
