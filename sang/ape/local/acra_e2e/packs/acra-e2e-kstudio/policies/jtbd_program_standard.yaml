          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months, DTI (not used
            for DSCR)'
        - name: AppraisalSummary
          entity_description: Appraisal form type, value, appraiser licence and effective date
        reference_documents: '### Property Documents

          - Appraisal Report: rural location, marketing time, functional utility, comparables

          - LOS transmittal (1008): purpose, CLTV, FICO, DSCR'
        source_text: '# Rural / Unique Property Overlay - Base Version


          ## Purpose

          This JTBD applies the Subject Property Location panel: rural / unique property → maximum CLTV
          80% (purchase), 75% (rate & term), 70% (cash-out); minimum FICO 700; minimum DSCR 1.00. ''If
          marketing time is excessive or property exhibits unusual, inadequate or peculiar functionality,
          LTV may be further reduced.''


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: rural location, marketing time, functional utility, comparables

          - LOS transmittal (1008): purpose, CLTV, FICO, DSCR


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal identifies the property as rural or unique (location, marketing time, functionality).


          ### Step 2 - Eligibility Verification

          - Cap, FICO 700 and DSCR 1.00 are applied.


          ### Step 3 - Validation and Verification

          - Excessive marketing time or peculiar functionality is noted for a possible further LTV reduction.


          ### Step 4 - Final Determination

          - Within cap with FICO and DSCR met passes; otherwise fails; further-reduction cases conditioned
          for underwriter judgement.


          ## Deterministic Validation Rules

          - Property is rural / unique per the appraisal: TRUE = continue, FALSE = not applicable.

          - LoanCore.cltv_percent <= 80 / 75 / 70 by purpose: TRUE = pass, FALSE = fail.

          - CreditReport.representative_score >= 700 and DSCR >= 1.00: TRUE = pass, FALSE = fail.

          - Marketing time excessive or functionality unusual: conditional (further LTV reduction at underwriter
          discretion).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Rural / unique loan meets the cap, FICO 700 and DSCR 1.00.


          ### Conditional

          Assign **Conditional** when:

          - The appraisal reports excessive marketing time or peculiar functionality; underwriter to determine
          a further LTV reduction.


          ### Fail

          Assign **Fail** when:

          - CLTV, FICO or DSCR fails the overlay.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The property is not rural / unique.'
        source_digest: b3ee5f671798ff04625c48acf13755c9b44689ff25383ccea7a313bfc05f4aa1
        section: Appraisal Review
        mnemonic: PRE-RURAL
    approval_refs: []
  - rule_id: PRE-DECLMKT.standard
    condition:
      kind: procedure
      purpose: 'This JTBD applies the Subject Property Location panel: declining market → ''-5% CLTV property/borrower
        full profile''. How the reduction combines with other caps and with the Florida −5% adjustment
        is open (Acra confirmation requested → Q-07) and is consolidated in LFC-CLTV-FINAL.'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Appraisal market-conditions section is read for a declining-market indication.


        ### Step 2 - Eligibility Verification

        - Applicable cap is reduced by 5 points.


        ### Step 3 - Validation and Verification

        - CLTV is compared with the reduced cap.


        ### Step 4 - Final Determination

        - Within reduced cap passes; otherwise fails; combination questions conditioned on Q-07.'
      checks:
      - 'Appraisal identifies a declining market: TRUE = continue, FALSE = not applicable.'
      - 'LoanCore.cltv_percent <= (applicable cap − 5): TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 4
    description: Confirms a 5-percentage-point CLTV reduction from the applicable cap is applied whenever
      the appraisal identifies the subject as located in a declining market.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 4
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: CLTV (Declining Market)
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: PRE_DECLMKT_LM1
          indicator_context: When the appraisal identifies a declining market, compare LoanCore.cltv_percent
            with the otherwise-applicable cap minus 5. Indicator is 'Pass' within; 'Fail' above; 'Not
            Applicable' when no declining market. Do not populate borrower_ids for this unified metric
            under any circumstance.
          description_template: CLTV {cltv_percent}% vs reduced cap {reduced_cap}% ({base_cap}% − 5)
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, condo / manufactured / mixed-use
            flags, address, taxes / HOA
        - name: AppraisalSummary
          entity_description: Appraisal form type, value, appraiser licence and effective date
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, LTV/CLTV, amortization, IO term, ARM
            terms, prepayment, escrow flag, dates'
        extraction_targets:
        - description: Declining-market indicator from the appraisal
          entity_type: AppraisalSummary
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Appraisal Report: neighborhood / market conditions: declining indicator

          - LOS transmittal (1008): CLTV'
        source_text: '# Declining Market CLTV Reduction - Base Version


          ## Purpose

          This JTBD applies the Subject Property Location panel: declining market → ''-5% CLTV property/borrower
          full profile''. How the reduction combines with other caps and with the Florida −5% adjustment
          is open (Acra confirmation requested → Q-07) and is consolidated in LFC-CLTV-FINAL.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: neighborhood / market conditions: declining indicator

          - LOS transmittal (1008): CLTV


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal market-conditions section is read for a declining-market indication.


          ### Step 2 - Eligibility Verification

          - Applicable cap is reduced by 5 points.


          ### Step 3 - Validation and Verification

          - CLTV is compared with the reduced cap.


          ### Step 4 - Final Determination

          - Within reduced cap passes; otherwise fails; combination questions conditioned on Q-07.


          ## Deterministic Validation Rules

          - Appraisal identifies a declining market: TRUE = continue, FALSE = not applicable.

          - LoanCore.cltv_percent <= (applicable cap − 5): TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - CLTV is within the cap reduced by 5 points.


          ### Conditional

          Assign **Conditional** when:

          - Outcome depends on how the −5% combines with other caps / the Florida adjustment (Q-07).


          ### Fail

          Assign **Fail** when:

          - CLTV exceeds the reduced cap.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The appraisal does not identify a declining market.'
        source_digest: ab3d4bd8331d35cf664507925b207ee586901190f7917a07d927509b0dd969af
        section: Appraisal Review
        mnemonic: PRE-DECLMKT
        also_as:
          platinum_select: PRE-DECLMKT
    approval_refs: []
