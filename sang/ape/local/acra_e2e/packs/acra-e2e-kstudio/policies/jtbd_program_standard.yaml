        source_text: '# Form 1007 Requirement Triggers - Base Version


          ## Purpose

          This JTBD applies §14.12: Acra requires the Single-Family Comparable Rent Schedule (FNMA Form
          1007) for single-family properties on (i) all DSCR qualifying files, (ii) lease-option purchase
          transactions where the down payment required in §3.45 (not reproduced) is generated from excess
          monthly rent contributions, or (iii) when proposed rental income is being used to qualify. A
          1007 may be from the original appraiser or any state-licensed appraiser. The general 1007 /
          1025 form rule is LPE-RENTFORM.


