          entity_description: '1003 L3: amortization, interest-only flag and term'
        reference_documents: '### Loan Documents

          - Note: IO payment, IO term, recast provision, note rate, maturity'
        source_text: '# Interest-Only Payment Calculation and Recast - Base Version


          ## Purpose

          This JTBD confirms the §7.5 mechanics: Interest Only payments are the amount sufficient to pay
          the accrued interest on the mortgage monthly at the time of origination, for a set term at the
          beginning of repayment; after that term payments recast to a fully amortized payment for the
          balance of the term ending at maturity. Which payment enters the DSCR denominator is DSCR-IO-DENOM
          (Q-26); the DTI calculation for IO loans is a DTI-program provision (Q-14).


          ## Reference Documents

          ### Loan Documents

          - Note: IO payment, IO term, recast provision, note rate, maturity


          ## Steps


          ### Step 1 - Initial Document Review

          - Note states the IO payment, IO term and recast provision.


          ### Step 2 - Eligibility Verification

          - IO payment = loan amount × note rate ÷ 12 at origination.


          ### Step 3 - Validation and Verification

          - Recast to a fully amortized payment over the remaining term is stated.


          ### Step 4 - Final Determination

          - Calculation and recast correct and the file proceeds; otherwise the Note is corrected.


          ## Deterministic Validation Rules

          - Note IO payment = LoanCore.total_loan_amount_usd × LoanCore.note_rate_percent ÷ 1200 (within
          rounding): TRUE = pass, FALSE = fail.

          - Note provides recast to a fully amortized payment after LoanCore.interest_only_period_months
          for the balance of the term: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - IO payment equals monthly accrued interest at origination and the recast provision is documented.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - IO payment is not accrued interest at origination, or no recast provision is documented.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is fully amortizing.'
