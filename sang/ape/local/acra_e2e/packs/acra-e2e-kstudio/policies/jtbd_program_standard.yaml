        source_text: '# Repatriation of Foreign-Held Funds - Base Version


          ## Purpose

          This JTBD applies §8.4: funds held in a foreign bank / currency will need to be repatriated
          at minimum three business days prior to Closing, and Foreign Nationals, regardless of LTV /
          CLTV, need to document a minimum of 60 days seasoning (FN-SEASON-60). Whether the repatriation
          requirement applies to any borrower holding funds abroad or only to foreign nationals, and what
          evidence and timing convention apply, is open (Acra confirmation requested → Q-12).


          ## Reference Documents

          ### Asset Documents

          - Foreign bank statements: foreign-held funds

          - Wire confirmation / US account statement: repatriation date

          - Closing Disclosure: closing date


          ## Steps


          ### Step 1 - Initial Document Review

          - Foreign-held accounts relied on for closing are identified.


          ### Step 2 - Eligibility Verification

          - Repatriation into a US account is evidenced with its date.


          ### Step 3 - Validation and Verification

          - Business days between repatriation and closing are at least three.


          ### Step 4 - Final Determination

          - Timely repatriation passes; late or undocumented fails; non-FN borrowers with foreign funds
          conditioned on Q-12.


          ## Deterministic Validation Rules

          - Relied-on funds held in a foreign bank / currency: TRUE = continue, FALSE = not applicable.

          - Repatriation into a US account documented >= 3 business days before LoanCore.expected_closing_date:
          TRUE = pass, FALSE = fail.

          - Borrower is not a Foreign National: conditional (Q-12 scope).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Foreign-held funds were repatriated at least three business days before closing.


          ### Conditional

          Assign **Conditional** when:

          - The borrower is not a Foreign National and the rule''s scope awaits Q-12.


          ### Fail

          Assign **Fail** when:

          - Foreign-held funds were not repatriated in time or evidence is missing.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No relied-on funds are held abroad.'
        source_digest: fd468273be8c21f1d9a4a34f74096deaf4b479ae170032d7d71c8d7916bab405
