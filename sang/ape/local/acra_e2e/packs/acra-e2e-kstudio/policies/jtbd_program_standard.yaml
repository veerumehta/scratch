  - rule_id: DSCR-QUALRENT.standard
    condition:
      kind: procedure
      purpose: 'This JTBD sets the DSCR numerator. §5.32 states the formula as the lesser of (i) annual
        in-place rent or (ii) market rent (§14.14, not reproduced), and in the same section notes that
        ''Acra may use the higher of actual or market rents'' where actual rents exceeding market are
        documented by two consecutive months of receipts and a lease continuing at least three months
        after closing (DSCR-ACTRENT-DOC). The consolidation does not select between the two: when market
        rent may be used if actual rent is lower, when higher actual rent may be used, and whether the
        stated documentation is sufficient is open (Acra confirmation requested → Q-01). On a vacant purchase,
        rents are taken from the 1007 / 1025 (DSCR-VACANT-RENT).'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Market rent (1007 / 1025) and in-place rent (lease) are extracted.


        ### Step 2 - Eligibility Verification

        - Base qualifying rent = lesser of in-place and market rent.


        ### Step 3 - Validation and Verification

        - Where the file uses the higher actual rent, the DSCR-ACTRENT-DOC evidence is confirmed and the
        Q-01 dependency flagged; where market rent is used above a lower actual rent, the file is flagged
        (Q-01).


        ### Step 4 - Final Determination

        - Qualifying rent is recorded for DSCR-CALC with the basis (lesser-of, higher-actual, market-on-vacant)
        and any Q-01 condition.'
      checks:
      - 'Qualifying rent = MIN(lease rent, 1007/1025 market rent): TRUE = base rule applied.'
      - 'File uses actual rent above market rent and DSCR-ACTRENT-DOC passes: TRUE = conditional (Q-01),
        FALSE = fail.'
      - 'File uses market rent while a lower actual rent exists: TRUE = conditional (Q-01).'
      - 'Vacant purchase: qualifying rent = 1007/1025 market rent (DSCR-VACANT-RENT).'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 4
    description: Determines the qualifying rent for the DSCR numerator by applying §5.32's formula (lesser
      of annual in-place rent or market rent) while identifying files that rely on the same section's
      note permitting the higher of actual or market rents, which Acra has been asked to reconcile.
    citations: []
    on_violation: fail
