        source_text: '# Listed-for-Sale Property Conditions - Base Version


          ## Purpose

          This JTBD applies §11.5 for a property listed for sale within six months: the property is not
          in default or otherwise delinquent on lien(s); for investment properties the subject must be
          tenant-occupied and not vacant; the loan must qualify as >= 1.0 DSCR (the 43% DTI alternative
          is a DTI-program provision, Q-14); a prepayment penalty of at least three years unless the property
          is in a state that does not allow prepayment penalties; twenty-four months of reserves, and
          cash-in-hand may be considered if otherwise consistent with the Guide; fully amortizing term,
          no interest-only; maximum LTV / CLTV 65% based on the lesser of appraised value or lowest recent
          listing price; no subordinate financing; impounds required.


          ## Reference Documents

          ### Loan and Property Records

          - MLS listing history: listing status and lowest recent listing price

          - Appraisal Report: appraised value

          - Title commitment / mortgage statements: lien status

          - Lease: tenant occupancy

          - DSCR calculation: ratio

          - Note / PPP rider: prepayment term, amortization

          - Bank statements / CD: 24 months reserves, cash-in-hand

          - Escrow setup: impounds


          ## Steps


          ### Step 1 - Initial Document Review

          - Subject is classified listed for sale (PRE-LISTDEF); lien status and lease are reviewed.


          ### Step 2 - Eligibility Verification

          - DSCR >= 1.0, reserves >= 24 months (cash-in-hand permitted), fully amortizing are verified.


          ### Step 3 - Validation and Verification

          - PPP >= 36 months (unless state-restricted), LTV / CLTV <= 65% on the lesser of appraised value
          or lowest recent listing price, no subordinate financing, impounds are verified.


          ### Step 4 - Final Determination

          - All nine conditions met passes; reserves shortfall conditioned; any other unmet condition
          fails.


          ## Deterministic Validation Rules

          - Subject lien(s) not in default or delinquent: TRUE = pass, FALSE = fail.

          - Subject tenant-occupied (lease on file, not vacant): TRUE = pass, FALSE = fail.

          - DSCR >= 1.0: TRUE = pass, FALSE = fail.

          - LoanCore.prepayment_penalty_term_months >= 36 unless the state prohibits penalties: TRUE =
          pass, FALSE = fail.

          - RatioSet.reserves_months >= 24 (cash-in-hand may count): TRUE = pass, FALSE = conditional
          / fail.

          - LoanCore.interest_only_period_months = 0: TRUE = pass, FALSE = fail.

          - LoanCore.ltv_percent and cltv_percent <= 65 computed on MIN(appraised value, lowest recent
          listing price): TRUE = pass, FALSE = fail.

          - No subordinate lien on the subject: TRUE = pass, FALSE = fail.

          - LoanCore.is_escrow_waived = FALSE and escrow established: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - All nine listed-for-sale conditions are met.


          ### Conditional

          Assign **Conditional** when:

          - Every condition is met except verified reserves, which are short of 24 months at underwriting;
          proceeds with a condition for additional asset documentation.


          ### Fail

          Assign **Fail** when:

          - Any listed-for-sale condition other than a curable reserves shortfall is unmet.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The subject is not classified listed for sale.'
