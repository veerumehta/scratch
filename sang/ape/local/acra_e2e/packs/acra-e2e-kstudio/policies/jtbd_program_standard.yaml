        source_text: '# Housing History Scope for DSCR Files - Base Version


          ## Purpose

          This JTBD applies §4.15 / §6.7: DSCR loans only require documentation on the subject property,
          principal residence, and second home (if any) of the borrower and / or guarantor(s); additional
          properties do not require housing history unless documents in the file suggest a major credit
          event has occurred (for example a foreclosure listing the borrower, individually or as guarantor,
          on the credit report).


          ## Reference Documents

          ### Credit Documentation

          - Credit Report: public records and foreclosure indications

          - Payment history for in-scope properties: subject, principal residence, second home


          ## Steps


          ### Step 1 - Initial Document Review

          - In-scope properties are identified for each borrower / guarantor.


          ### Step 2 - Eligibility Verification

          - History is documented for each in-scope property.


          ### Step 3 - Validation and Verification

          - Credit report is checked for indications of a major credit event on other properties; if present,
          those histories are obtained.


          ### Step 4 - Final Determination

          - Scope satisfied passes; missing in-scope history conditioned.


          ## Deterministic Validation Rules

          - Payment history on file for the subject, each principal residence and each second home of
          every borrower / guarantor: TRUE = pass, FALSE = fail.

          - Credit report suggests a major credit event on another property → its history obtained: TRUE
          = pass, FALSE = conditional.


