          - DSCR calculation (Form 1007 / lease): ratio

          - Bank statements / VOD: six months reserves

          - Escrow account setup: impounds established'
        source_text: '# First-Time Homebuyer Conditions - Base Version


          ## Purpose

          This JTBD applies Acra''s §3.13 allowance for first-time homebuyers on DSCR. Where all applicants
          have never previously owned real property (BOR-FTHB-DEF), the loan must meet all of: minimum
          700 FICO; maximum 70% CLTV; minimum DSCR 1.150; maximum loan amount $1,000,000; full amortization
          (no interest-only); impounds required; minimum six months reserves. The 43% DTI provision applies
          only under the DTI program (Q-14). How this allowance interacts with the §3.12 requirement that
          an entity have a guarantor with prior homeownership is open (Acra confirmation requested → Q-09).


          ## Reference Documents

          ### Credit and Loan Records

          - Credit Report: decisioning score

          - LOS transmittal (1008): CLTV, loan amount, amortization, escrow

          - Note: amortization type, IO term

          ### Income and Asset Documents

          - DSCR calculation (Form 1007 / lease): ratio

          - Bank statements / VOD: six months reserves

          - Escrow account setup: impounds established


          ## Steps


          ### Step 1 - Initial Document Review

          - File is identified as FTHB (all applicants never owned real property) and the seven §3.13
          conditions are listed.


          ### Step 2 - Eligibility Verification

          - FICO >= 700, CLTV <= 70%, loan amount <= $1,000,000 are checked against the credit report
          and 1008.


          ### Step 3 - Validation and Verification

          - DSCR >= 1.150, fully amortizing product, impounds established and six months reserves verified.


          ### Step 4 - Final Determination

          - All seven conditions met and the file proceeds; any unmet condition fails the file; entity-borrower
          files with no prior-ownership guarantor are conditioned on Q-09.


          ## Deterministic Validation Rules

          - CreditReport.representative_score >= 700: TRUE = pass, FALSE = fail.

          - LoanCore.cltv_percent <= 70: TRUE = pass, FALSE = fail.

          - Calculated DSCR (RatioSet.total_monthly_income_usd ÷ RatioSet.total_monthly_obligation_usd)
          >= 1.15: TRUE = pass, FALSE = fail.

          - LoanCore.total_loan_amount_usd <= 1,000,000: TRUE = pass, FALSE = fail.

          - LoanCore.interest_only_period_months = 0 (fully amortizing): TRUE = pass, FALSE = fail.

          - LoanCore.is_escrow_waived = FALSE (impounds required): TRUE = pass, FALSE = fail.

          - RatioSet.reserves_months >= 6: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The FTHB file meets all seven conditions: FICO >= 700, CLTV <= 70%, DSCR >= 1.15, loan <=
          $1MM, no IO, impounds, six months reserves.


          ### Conditional

          Assign **Conditional** when:

          - All conditions are met but the borrower is an entity none of whose guarantors has prior homeownership;
          proceeds subject to Acra''s Q-09 response.


          ### Fail

          Assign **Fail** when:

          - Any of the seven FTHB conditions is not met.


          ### Not Applicable

          Assign **Not Applicable** when:

          - At least one applicant has previously owned real property (not an FTHB application).'
        source_digest: fe9655f7c6d85a304b4736a8ad34c151ad0f3c30cf498d599f863cd05614eef7
