            match and all trust conditions are met; 'Fail' otherwise; 'Not Applicable' when no trust vesting.
            Do not populate borrower_ids for this unified metric under any circumstance.
          description_template: 'Trust: {trust_name} dated {trust_date}; revocable: {is_revocable}; trustor
            = trustee: {trustor_is_trustee}'
        entity_types:
        - name: TitleInformation
          entity_description: Vesting names, trust name / date, estate held
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
            dates
        extraction_targets:
        - description: Trust name, date and vesting
          entity_type: TitleInformation
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Trust Documents

          - Trust agreement or Certification of Trust: required statements

          - Title Commitment: vesting in the trust

          - Senior Management written exception: where trustor and trustee differ'
        source_text: '# Revocable Living Trust Vesting - Base Version


          ## Purpose

          This JTBD applies §3.12: title vesting in an inter vivos revocable trust is permitted when all
          of the following are met — a complete, legible copy of the Trust or a Certification of Trust
          stating the existence and date of the Trust, the Trustor(s) and current Trustee(s), the Trustee''s
          powers, whether the Trust is revocable and who holds the right to revoke, the names and number
          of Trustees required to sign, the Trust identification number (SSN or IRS TIN), how title should
          be taken, and that the Trust has not been revoked, modified or amended; the Trust is valid under
          the laws of its state; it is revocable (irrevocable trusts not permitted); it is established
          by one or more natural persons and effective during their lifetime; the primary beneficiary
          is the individual(s) establishing it; a written exception by Acra Senior Management is obtained
          if Trustor(s) and Trustee(s) differ; the Trust specifies the Trustee''s power to hold title
          and mortgage the property, that beneficiary consent is not needed or has been given in writing,
          that there is no unusual risk or impairment to the lender''s rights, and that holding title
          in the Trust does not diminish the lender''s rights as creditor. Legal may condition for additional
          documentation.


          ## Reference Documents

          ### Trust Documents

          - Trust agreement or Certification of Trust: required statements

          - Title Commitment: vesting in the trust

          - Senior Management written exception: where trustor and trustee differ


          ## Steps


          ### Step 1 - Initial Document Review

          - Trust or Certification of Trust is on file with every required statement.


          ### Step 2 - Eligibility Verification

          - Trust is revocable, valid under state law, established by natural persons, with those persons
          as primary beneficiaries.


          ### Step 3 - Validation and Verification

          - Trustee powers to hold title and mortgage, consent provisions and no-impairment statements
          are present; trustor / trustee mismatch has a Senior Management exception.


          ### Step 4 - Final Determination

          - All conditions met passes; missing statements conditioned; irrevocable or non-conforming trust
          fails.


          ## Deterministic Validation Rules

          - Complete trust or Certification of Trust with all required statements on file: TRUE = pass,
          FALSE = conditional.

          - Trust is revocable, valid under state law, established by natural persons effective in their
          lifetime, primary beneficiary = trustor(s): TRUE = pass, FALSE = fail.

          - Trustor(s) = Trustee(s), or written Senior Management exception on file: TRUE = pass, FALSE
          = fail.

          - Trust grants trustee power to hold title and mortgage, addresses beneficiary consent, and
          contains the no-impairment statements: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The revocable trust meets every §3.12 condition and TitleInformation.trust_name matches the
          trust document.


          ### Conditional

          Assign **Conditional** when:

          - The trust documentation lacks a required statement and a Certification of Trust or amendment
          is pending.


          ### Fail

          Assign **Fail** when:

          - The trust is irrevocable or fails a substantive condition, or trustor / trustee differ without
          an exception.


          ### Not Applicable

          Assign **Not Applicable** when:

          - Title does not vest in a trust.'
        source_digest: 9fa66548133e5d39ff4e5c2de0032587d60f3803882ec7b1b0bf55e3ad4d26af
        section: Compliance and Closing
        mnemonic: BET-REVTRUST
        also_as:
          platinum_select: BET-REVTRUST
