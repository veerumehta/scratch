        reference_documents: '### Credit Documentation

          - Credit Report: short sale, deed-in-lieu, modification, forbearance indications

          - Short sale settlement / deed-in-lieu / modification agreement / forbearance plan: event dates

          - Loan Application (1003): declarations and application date'
        source_text: '# Short Sale / Deed-in-Lieu / Modification Seasoning Caps - Base Version


          ## Purpose

          This JTBD applies the Short sale, deed-in-lieu & modification restrictions as printed: >= 24
          Mo → No Restrictions; 12-23 Mo → Max CLTV 80% purchase / 75% refinance; < 12 Mo → 75% / 70%.
          Printed beneath them: ''FB Taken <= 6 Mos: Case-by-case'' — the meaning of ''FB'' (forbearance)
          and the date from which six months are measured are open (Acra confirmation requested → Q-05),
          as are the seasoning start / end dates.


          ## Reference Documents

          ### Credit Documentation

          - Credit Report: short sale, deed-in-lieu, modification, forbearance indications

          - Short sale settlement / deed-in-lieu / modification agreement / forbearance plan: event dates

          - Loan Application (1003): declarations and application date


          ## Steps


          ### Step 1 - Initial Document Review

          - Short sale, DIL and modification events are identified with dates; any forbearance within
          six months is flagged.


          ### Step 2 - Eligibility Verification

          - Months from the event to the application date are counted.


          ### Step 3 - Validation and Verification

          - Seasoning maps to the tier cap; forbearance within six months is referred for case-by-case
          review.


          ### Step 4 - Final Determination

          - Within cap passes; above cap fails; forbearance <= 6 months and date-convention questions
          conditioned on Q-05.


          ## Deterministic Validation Rules

          - Borrower.has_preforeclosure_short_sale or Borrower.has_conveyed_title_in_lieu = TRUE, or a
          modification is reported: TRUE = continue, FALSE = not applicable.

          - months >= 24 → no restriction; 12-23 → cap 80 / 75; < 12 → cap 75 / 70.

          - LoanCore.cltv_percent <= tier cap: TRUE = pass, FALSE = fail.

          - Forbearance taken within 6 months: conditional (case-by-case; Q-05).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The short sale / DIL / modification seasoning tier cap is met.


          ### Conditional

          Assign **Conditional** when:

          - A forbearance was taken within six months (case-by-case) or the tier depends on the date convention
          (Q-05).


          ### Fail

          Assign **Fail** when:

          - CLTV exceeds the tier cap.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No short sale, deed-in-lieu, modification or recent forbearance is reported.'
        source_digest: 5d404e9dd9f5013dfa77dae9ef1e02529c9b786f04cac0deb5e26938cdf58d39
        section: Credit Review & Analysis
        mnemonic: CRD-SSDIL-SEASON
