        source_text: '# Foreign National Determination - Base Version


          ## Purpose

          This JTBD applies the Foreign National definition: ''Borrowers whose Primary Residence is not
          located in the United States of America''; eligible under the Foreign National Program are Non-Resident
          Aliens who are not authorized to live or work in the U.S. — a true Foreign National may periodically
          visit for vacation or business, purchase property for limited personal use or investment, or
          own a US-based business entity, but must reside outside the US. ITIN holders are eligible under
          the program if they reside outside the US (BOR-ITIN-DEF).


          ## Reference Documents

          ### Identification

          - Passport / visa: nationality and visitor status

          - Loan Application (1003): current / mailing address

          - Foreign bank statements, utility or tax evidence: primary residence outside the US


          ## Steps


          ### Step 1 - Initial Document Review

          - Passport, visa and 1003 addresses establish nationality and residence.


          ### Step 2 - Eligibility Verification

          - Borrower is a non-resident alien not authorized to live / work in the US and resides outside
          the US.


          ### Step 3 - Validation and Verification

          - Any indication of US residence or work authorization (EAD, US primary address) reclassifies
          the borrower (NPR or ITIN-resident, Q-03).


          ### Step 4 - Final Determination

          - Foreign National status recorded; FN program JTBDs (FN-*) apply.


          ## Deterministic Validation Rules

          - Borrower has no US citizenship / permanent residency and no EAD / work authorization: TRUE
          = continue, FALSE = not FN.

          - Borrower.current_address (primary residence) is outside the US: TRUE = Foreign National, FALSE
          = not FN (NPR or US-resident ITIN).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Borrower is a non-resident alien residing outside the US; Foreign National program applies.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          There is no case for this outcome.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower resides in the US or holds US work authorization (classified NPR / ITIN / citizen
          instead).'
        source_digest: 4bd3b4a670367e0abf664210b6dbd9c2797c22b4debf30050643599347b39a14
