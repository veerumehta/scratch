        ### Step 2 - Eligibility Verification

        - Borrower is a non-resident alien not authorized to live / work in the US and resides outside
        the US.


        ### Step 3 - Validation and Verification

        - Any indication of US residence or work authorization (EAD, US primary address) reclassifies
        the borrower (NPR or ITIN-resident, Q-03).


        ### Step 4 - Final Determination

        - Foreign National status recorded; FN program JTBDs (FN-*) apply.'
      checks:
      - 'Borrower has no US citizenship / permanent residency and no EAD / work authorization: TRUE =
        continue, FALSE = not FN.'
      - 'Borrower.current_address (primary residence) is outside the US: TRUE = Foreign National, FALSE
