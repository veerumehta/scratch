        source_text: '# Investment Property Definition - Base Version


          ## Purpose

          This JTBD applies Acra''s §3.41 definition of an investment property: a one- to four-unit residential
          dwelling or a unit in a condominium complex or PUD owned by an individual who does not occupy
          the dwelling, leased and occupied as a principal year-round residence by persons other than
          the owner. Short-term rental use is separately permitted on Standard DSCR with its own caps
          (DSCR-STR-CAPS).


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: dwelling type, unit count and use

          - Lease Agreement(s): tenancy as principal year-round residence

          - Condo / PUD Questionnaire: project type where applicable


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal identifies the dwelling as a 1-4 unit residential property, condominium unit or
          PUD unit.


          ### Step 2 - Eligibility Verification

          - Unit count is 1 to 4 and the property is residential (a mixed-use component is routed to PRE-MIXEDUSE).


          ### Step 3 - Validation and Verification

          - Lease(s) show the dwelling is leased to persons other than the owner as a principal year-round
          residence, or the property is a documented short-term rental.


          ### Step 4 - Final Determination

          - Subject meets the investment property definition and the file proceeds, or it does not (e.g.,
          5+ units, commercial, owner-occupied) and the loan is ineligible.


          ## Deterministic Validation Rules

          - SubjectProperty.number_of_units is between 1 and 4: TRUE = pass, FALSE = fail.

          - SubjectProperty.property_type is a residential type (SingleFamily, Townhouse, PUD, Condominium
          variants, TwoToFourUnit, ManufacturedHome) or MixedUse routed to PRE-MIXEDUSE: TRUE = pass,
          FALSE = fail.

          - Dwelling is leased to persons other than the owner (lease on file) or is a documented short-term
          rental or a permitted vacant purchase: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The subject is a 1-4 unit residential dwelling, condo or PUD unit, not owner-occupied, leased
          as a principal residence to others (or a permitted STR / vacant-purchase case).


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The subject has more than four units, is non-residential, or is occupied by the owner.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: ac0c50ad7b5f4abc50f11ea75ba25db824b6b16170d955591096fb8175e0d5e4
