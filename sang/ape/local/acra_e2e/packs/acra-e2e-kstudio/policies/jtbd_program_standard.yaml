        source_text: '# Schedule of REO Scope for DSCR Files - Base Version


          ## Purpose

          This JTBD confirms the Schedule of Real Estate Owned meets the DSCR-file scope: only the subject
          property, principal residence and second homes are required to be listed on the application
          or Schedule of REO (§5.32, §4.15). Other holdings need not be listed unless the file suggests
          a major credit event (CRD-HIST-SCOPE).


          ## Reference Documents

          ### Loan Origination Records

          - Loan Application (1003) — Schedule of REO: properties listed with use and status

          - Credit Report: mortgages reported that may identify unlisted required properties


          ## Steps


          ### Step 1 - Initial Document Review

          - Schedule of REO is extracted from the 1003 with each property''s use.


          ### Step 2 - Eligibility Verification

          - Subject property, each borrower''s / guarantor''s principal residence and any second home
          appear on the schedule.


          ### Step 3 - Validation and Verification

          - Mortgages reported on credit are reconciled to the schedule to detect an unlisted principal
          residence or second home.


          ### Step 4 - Final Determination

          - Required properties are all listed and the file proceeds, or the schedule is conditioned for
          the missing property.


          ## Deterministic Validation Rules

          - RealEstateOwned contains the subject (is_subject_property = TRUE), a PrimaryResidence and
          any SecondHome for each borrower / guarantor: TRUE = pass, FALSE = fail.

          - Every mortgage reported on credit maps to a listed property or is explained as not a principal
          residence / second home / subject: TRUE = pass, FALSE = conditional.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The subject, principal residence(s) and second home(s) are listed on the Schedule of REO.


          ### Conditional

          Assign **Conditional** when:

          - A reported mortgage does not map to a listed property and the borrower''s explanation is pending.


          ### Fail

          Assign **Fail** when:

          - The subject, a principal residence or a second home is omitted from the schedule.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 717fd5b2583ae8eab53225258a1bff1fb02c7c1f6cb0893cff9c7c480682d0f0
