    priority: 6
    description: Determines and records whether the loan qualifies by a calculated DSCR (§5.32) or as
      No Ratio DSCR (§5.33), since the two paths carry different documentation, caps and minimum-FICO
      rules that downstream JTBDs depend on.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 6
        section_type: Eligibility
        source: NEW
        assistant:
        - Underwriter
        notes: 'Ontology gap: no field records the DSCR qualification method (calculated vs No Ratio);
          it is read from the LOS program code / lock. Recommend LoanCore.dscr_qualification_method.'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, LTV/CLTV, amortization, IO term, ARM
            terms, prepayment, escrow flag, dates'
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months, DTI (not used
            for DSCR)'
        reference_documents: '### Loan Origination Records

          - LOS loan record: program / product code and qualification method

          - Lock Confirmation: registered program option (DSCR vs No Ratio)

          ### Income Documents

          - Form 1007 / 1025: required on both paths

          - Lease / rent evidence: present only where a ratio is calculated on actual rent'
        source_text: '# Qualification Method Determination (Calculated DSCR vs No Ratio) - Base Version


          ## Purpose

          This JTBD fixes the qualification path for the file. Under the Standard program a loan qualifies
          either by a calculated DSCR or as No Ratio DSCR, where no ratio is calculated. The path determines
          whether DSCR-CALC and the minimum-ratio JTBDs apply, and whether the No Ratio caps (75/70/65,
          minimum FICO 640) govern.


          ## Reference Documents

          ### Loan Origination Records

          - LOS loan record: program / product code and qualification method

          - Lock Confirmation: registered program option (DSCR vs No Ratio)

          ### Income Documents

          - Form 1007 / 1025: required on both paths

          - Lease / rent evidence: present only where a ratio is calculated on actual rent


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS record and lock confirmation identify the registered qualification method.


          ### Step 2 - Eligibility Verification

          - Method is one of the two the program offers: calculated DSCR or No Ratio DSCR.


          ### Step 3 - Validation and Verification

          - Registered method agrees with the file: a No Ratio file has a 1007 but no calculated ratio;
          a DSCR file has a calculated ratio recorded.


          ### Step 4 - Final Determination

          - Qualification method is recorded for downstream JTBDs (DSCR-CALC, DSCR-SUB1-NORATIO, DSCR-NORATIO-DOCS,
          LFC-DSCR-FINAL).


          ## Deterministic Validation Rules

          - Registered qualification method is ''Calculated DSCR'' or ''No Ratio DSCR'': TRUE = pass,
          FALSE = fail.

          - Registered method agrees with the file evidence (ratio calculated or not): TRUE = pass, FALSE
          = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The qualification method is registered as calculated DSCR or No Ratio and agrees with the
          file.


          ### Conditional

          Assign **Conditional** when:

          - The LOS shows a method but the lock confirmation is not yet in the file to corroborate it.


          ### Fail

          Assign **Fail** when:

          - The method is not registered, or the registration contradicts the file (e.g., No Ratio registered
          while a sub-1.0 ratio is being used to price).


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 76be34d0a0398505f685e413251e314eabc0551471d9cc759666cc4214432718
        section: Loan Program Eligibility
        mnemonic: LPE-QUAL-METHOD
