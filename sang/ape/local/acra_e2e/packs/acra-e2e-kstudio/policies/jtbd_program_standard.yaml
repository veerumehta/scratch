        source_text: '# Short-Term Rental Actual Rent Ledgers - Base Version


          ## Purpose

          This JTBD applies §5.32 / §14.13: ''Acra can accept short term rentals with 12-month ledgers
          from condotel management companies, property managers, AirBnB, VRBO, etcetera as documentation
          for actual rents.'' How a 12-month ledger establishes qualifying rent (annual total, average
          or other) and how the receipt and lease conditions apply to short-term rentals is open (Acra
          confirmation requested → Q-02). Under No Ratio, proof of actual rents is not required (DSCR-NORATIO-DOCS).


          ## Reference Documents

          ### Rent Documents

          - 12-month STR ledger: gross rental receipts by month from the platform or manager

          - STRpro / 1007: market rent for comparison


          ## Steps


          ### Step 1 - Initial Document Review

          - Subject is an STR qualifying on actual rents by calculated DSCR.


          ### Step 2 - Eligibility Verification

          - A 12-month ledger from an acceptable source is on file.


          ### Step 3 - Validation and Verification

          - Qualifying rent derived from the ledger (basis flagged for Q-02) is compared with market rent
          under DSCR-QUALRENT.


          ### Step 4 - Final Determination

          - Ledger on file → proceeds subject to Q-02; missing ledger → conditioned.


          ## Deterministic Validation Rules

          - STR subject qualifying on actual rent by calculated DSCR: TRUE = continue, FALSE = not applicable.

          - 12-month ledger from condotel manager / property manager / AirBnB / VRBO or similar is on
          file: TRUE = conditional (Q-02), FALSE = fail.


          ## Outcomes


          ### Pass

          There is no case for this outcome.


          ### Conditional

          Assign **Conditional** when:

          - A 12-month ledger is on file; the conversion to qualifying rent and the applicability of receipt
          / lease conditions await Acra''s Q-02 response.


          ### Fail

          Assign **Fail** when:

          - STR actual rent is used without a 12-month ledger.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The subject is not an STR, qualifies on market rent only, or is No Ratio.'
