        reference_documents: '### Asset, Loan and Property Records

          - Bank statements / VOD / Closing Disclosure: verified reserves and cash-in-hand

          - 1003: FTHB

          - Appraisal / lease: vacancy

          - MLS history: listing

          - Credit / payment history: forbearance or late'
        source_text: '# Reserves — Transaction-Driven Triggers - Base Version


          ## Purpose

          This JTBD applies the reserve triggers stated for particular transactions: first-time homebuyer
          → minimum six months (§3.13; ''Requires 6mos Reserves''); vacant property rate & term refinance
          → minimum six months (§10.17); vacant property cash-out refinance → 6 months; property listed
          for sale within six months → twenty-four months, and cash-in-hand may be considered if otherwise
          consistent with the Guide (§11.5); forbearance or mortgage lates in the last 12 months on a
          tenant-occupied subject without timely receipt of the prior two months'' rent → 12 months of
          the subject''s payment, which may be from cash-in-hand (§5.32). Overlap and payment basis are
          Q-07 (AFC-RESERVE-TOTAL).


          ## Reference Documents

          ### Asset, Loan and Property Records

          - Bank statements / VOD / Closing Disclosure: verified reserves and cash-in-hand

          - 1003: FTHB

          - Appraisal / lease: vacancy

          - MLS history: listing

          - Credit / payment history: forbearance or late


          ## Steps


          ### Step 1 - Initial Document Review

          - Transaction triggers present are identified.


          ### Step 2 - Eligibility Verification

          - Months required per trigger are recorded (6, 6, 24, 12).


          ### Step 3 - Validation and Verification

          - Verified reserves (cash-in-hand counted where permitted) are compared with each applicable
          trigger.


          ### Step 4 - Final Determination

          - Each applicable trigger met passes; shortfall fails; aggregation to AFC-RESERVE-TOTAL.


          ## Deterministic Validation Rules

          - FTHB: RatioSet.reserves_months >= 6.

          - Vacant refinance (R&T or cash-out): RatioSet.reserves_months >= 6.

          - Listed for sale: RatioSet.reserves_months (cash-in-hand may count) >= 24.

          - Forbearance / late without rent receipts: reserves (subject payment basis, cash-in-hand permitted)
          >= 12.

          - All applicable triggers met: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Every applicable transaction reserve trigger is met.


          ### Conditional

          Assign **Conditional** when:

          - Reserves are short of a trigger but curable before closing with additional documentation.


          ### Fail

          Assign **Fail** when:

          - A transaction reserve trigger is unmet.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No transaction reserve trigger applies.'
        source_digest: 04a162035b5741be40d052c69a7171279924097b0d26df0ab0fd9cde469fdecd
        section: Asset Assessment
        mnemonic: AFC-RESERVE-TXN
