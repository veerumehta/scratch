          - Note: IO payment, recast payment, IO term

          - Tax certificate, hazard policy, HOA statement, subordinate statement: other PITIA components

          - Form 1007 / lease: qualifying rent'
        source_text: '# DSCR Denominator on Interest-Only Loans - Base Version


          ## Purpose

          This JTBD fixes the payment entering the DSCR denominator on the interest-only products. Acra
          calculates the DSCR using the first payment due under the Note; §7.5 defines the interest-only
          payment as the amount sufficient to pay accrued interest monthly at origination; the §5.32 denominator
          lists ''annual principal, interest, real estate taxes, property insurance, and association fees''.
          Which payment enters the denominator on an interest-only loan is open (Acra confirmation requested
          → Q-26).


          ## Reference Documents

          ### Loan Documents

          - Note: IO payment, recast payment, IO term

          - Tax certificate, hazard policy, HOA statement, subordinate statement: other PITIA components

          - Form 1007 / lease: qualifying rent


          ## Steps


          ### Step 1 - Initial Document Review

          - Note confirms the loan is interest-only and states the first payment due and the recast P&I.


          ### Step 2 - Eligibility Verification

          - IO denominator = IO payment + taxes + insurance + HOA + subordinate; amortized denominator
          = recast P&I + same components.


          ### Step 3 - Validation and Verification

          - DSCR on both denominators is compared with the governing minimum (LFC-DSCR-FINAL).


          ### Step 4 - Final Determination

          - Meets minimum on both → pass; only on IO denominator → conditional (Q-26); fails on IO denominator
          → fail.


          ## Deterministic Validation Rules

          - LoanCore.interest_only_period_months > 0 and file is calculated DSCR: TRUE = continue, FALSE
          = not applicable.

          - RatioSet.total_monthly_obligation_usd = Note first payment (IO) + taxes + insurance + HOA
          + subordinate: TRUE = correct, FALSE = recalculation required.

          - DSCR_io >= governing minimum: TRUE = continue, FALSE = fail.

          - DSCR_amortized >= governing minimum: TRUE = pass, FALSE = conditional (Q-26).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The IO loan meets the governing minimum DSCR on both the IO and the fully amortized denominator.


          ### Conditional

          Assign **Conditional** when:

          - The IO loan meets the minimum only on the IO (first-payment-due) denominator; proceeds subject
          to Q-26.


          ### Fail

          Assign **Fail** when:

          - DSCR on the IO denominator is below the minimum, or the denominator was not built from the
          first payment due.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is fully amortizing or No Ratio.'
        source_digest: 15d5746f57a4bcb9489de208c6cd19d1afa887d299cd42ed27764c2f81153534
