        source_text: '# Non-Permanent Resident Loan Amount and CLTV Limit - Base Version


          ## Purpose

          This JTBD applies the NPR limit printed in the Borrower Citizenship panel: ''Max Loan Amount:
          $1.5M: Max CLTV 80%''. Whether this is two independent limits or one conditional limit (80%
          CLTV available only up to $1.5M) is open (Acra confirmation requested → Q-21). The consolidation
          tests both conservatively.


          ## Reference Documents

          ### Loan Records

          - LOS transmittal (1008): loan amount and CLTV

          - 1003 / identification: NPR status


          ## Steps


          ### Step 1 - Initial Document Review

          - Borrower is Non-Permanent Resident.


          ### Step 2 - Eligibility Verification

          - Loan amount is compared with $1,500,000 and CLTV with 80%.


          ### Step 3 - Validation and Verification

          - Both within limits passes; a loan above $1.5M or CLTV above 80% is flagged with the Q-21 reading.


          ### Step 4 - Final Determination

          - Result recorded; ambiguous cases conditioned on Q-21.


          ## Deterministic Validation Rules

          - Any borrower is NonPermanentResidentAlien: TRUE = continue, FALSE = not applicable.

          - LoanCore.total_loan_amount_usd <= 1,500,000 AND LoanCore.cltv_percent <= 80: TRUE = pass.

          - Loan amount > 1,500,000 with CLTV <= 80, or CLTV > 80 with loan <= 1,500,000: conditional
          (Q-21).

          - Both limits exceeded: fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - NPR loan is $1,500,000 or less with CLTV of 80% or less.


          ### Conditional

          Assign **Conditional** when:

          - One of the two printed limits is exceeded; the outcome depends on whether they are independent
          (Q-21).


          ### Fail

          Assign **Fail** when:

          - Both the $1.5M and the 80% CLTV limits are exceeded.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No borrower is a Non-Permanent Resident.'
        source_digest: a87b14eff93fdf166ec334b15565c2c198236700d8e46b71082a5ede0e0c5f18
        section: Identification Requirements
        mnemonic: BOR-NPR-LIMITS
