        source_text: '# Aggregate Reserve Requirement Determination - Base Version


          ## Purpose

          This JTBD consolidates the reserve triggers at §9.2 into one governing requirement. The sources
          state reserves only for those situations and state the payment basis only for the LTV > 80%
          trigger (PITIA); the base requirement where no trigger applies, the payment basis where only
          ''months'' is stated, permitted sources, whether overlapping triggers are cumulative, and whether
          reserves substituted for rent loss insurance are additional are open (Acra confirmation requested
          → Q-07). This JTBD applies the highest applicable trigger, adds the rent-loss substitution because
          it replaces a distinct coverage, and conditions any file whose outcome would change under a
          cumulative reading. Individual triggers are AFC-RESERVE-LTV80, AFC-RESERVE-FICO, AFC-RESERVE-TXN
          and RLI-RESERVE-SUB.


          ## Reference Documents

          ### Loan and Property Records

          - LOS transmittal (1008): LTV, FICO, PITIA, transaction flags

          - Rent loss policy / declination: coverage months

          ### Asset Documents

          - Bank statements / VOD: verified reserves after closing

          - Closing Disclosure: cash-in-hand where permitted


          ## Steps


          ### Step 1 - Initial Document Review

          - All applicable triggers are identified: LTV > 80%; FICO < 620; FTHB; vacant refinance; listed
          for sale; forbearance / late without receipts; rent loss unobtainable.


          ### Step 2 - Eligibility Verification

          - Months per trigger are recorded (6, 12, 6, 6, 24, 12, 2 per uncovered month).


          ### Step 3 - Validation and Verification

          - Governing requirement = highest trigger + rent-loss substitution; verified reserves (cash-in-hand
          only where permitted) compared.


          ### Step 4 - Final Determination

          - Reserves at or above the requirement pass; shortfall fails; files passing only under highest-applies
          conditioned on Q-07.


          ## Deterministic Validation Rules

          - At least one reserve trigger applies: TRUE = continue, FALSE = not applicable.

          - governing_months = MAX(applicable trigger months) + 2 × (rent loss months required but not
          obtained): computed.

          - RatioSet.reserves_months >= governing_months: TRUE = pass, FALSE = fail.

          - RatioSet.reserves_months >= SUM(applicable trigger months) + substitution: TRUE = pass under
          either reading, FALSE = conditional (Q-07).

          - Cash-in-hand counted only for the listed-for-sale or forbearance / late trigger: TRUE = correct,
          FALSE = recalculation required.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Verified reserves meet the governing requirement under both the highest-applies and the cumulative
          reading.


          ### Conditional

          Assign **Conditional** when:

          - Verified reserves meet the highest trigger plus substitution but not the cumulative sum; proceeds
          subject to Q-07.


          ### Fail

          Assign **Fail** when:

          - Verified reserves are below the highest applicable trigger plus the rent-loss substitution.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No reserve trigger applies.'
        source_digest: ae050003379c2c75e279f2f3e35dc8f9e4715f3c6ba6dee05bd7efc24dabdc54
