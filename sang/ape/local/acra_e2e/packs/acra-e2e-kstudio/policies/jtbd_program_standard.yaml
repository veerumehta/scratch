          types are US Citizen, Permanent Resident, Non-Permanent Resident, Foreign National and ITIN.
          The classification drives BOR-PRA-ID, BOR-NPR-ID / BOR-NPR-LIMITS, BOR-FN-DEF / BOR-FN-CAPS,
          BOR-ITIN-DEF / BOR-ITIN-CAPS and the FN program JTBDs.


          ## Reference Documents

          ### Identification

          - Loan Application (1003): citizenship / residency declaration

          - Government ID, PRA card, EAD / visa, passport, ITIN letter: status evidence


          ## Steps


          ### Step 1 - Initial Document Review

          - 1003 declarations and ID documents establish each party''s status.


          ### Step 2 - Eligibility Verification

          - Status maps to one of the five eligible types.


          ### Step 3 - Validation and Verification

          - Where a party is Foreign National or ITIN, residence outside the US is confirmed (BOR-FN-DEF
          / BOR-ITIN-DEF).


          ### Step 4 - Final Determination

          - Type recorded for each party; a party outside the five types is ineligible.


          ## Deterministic Validation Rules

          - Each Borrower has a citizenship classification in {USCitizen, PermanentResidentAlien, NonPermanentResidentAlien,
          ForeignNational, ITIN}: TRUE = pass, FALSE = fail.

          - Borrower.citizenship_status and Borrower.tax_id_type are consistent with the classification
          (ITIN → tax_id_type = ''ITIN''): TRUE = pass, FALSE = conditional.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Every borrower / guarantor is classified into an eligible type with consistent identification.


          ### Conditional

          Assign **Conditional** when:

          - A party''s status is declared but the identification to confirm it is pending.


          ### Fail

          Assign **Fail** when:

          - A party does not fall within any of the five eligible types.


          ### Not Applicable

          There is no case for this outcome.'
