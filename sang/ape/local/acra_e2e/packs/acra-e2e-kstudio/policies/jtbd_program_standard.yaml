            (base rule) or the documented higher actual rent (Q-01). Indicator is 'Pass' when the lesser-of
            rule is applied or market rent on a vacant purchase; 'Conditional' when the higher-of note
            or market-over-lower-actual is relied on; 'Fail' when the basis is undocumented. Do not populate
            borrower_ids for this unified metric under any circumstance.
          calculation_context: Present lease rent, market rent, the lesser, and the basis relied on; note
            Q-01 where the higher-of note applies.
          description_template: Lease ${gross_rental_income_usd} vs market ${market_rent_usd} → qualifying
            ${qualifying_rent} ({basis})
        entity_types:
        - name: RealEstateOwned
          entity_description: Schedule of REO incl. subject rental income, use and ownership
        - name: AppraisalSummary
          entity_description: Appraisal form type, value, appraiser licence and effective date
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months, DTI (not used
            for DSCR)'
        extraction_targets:
        - description: Qualifying gross rental income
          entity_type: RatioSet
          exclude_fields:
          - id
          - created_at
