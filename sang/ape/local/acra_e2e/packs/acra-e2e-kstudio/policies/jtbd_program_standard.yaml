          - 1003 / entity documents: individual vs entity borrower

          - Note: loan amount, interest rate, purpose'
        source_text: '# State-Specific Prepayment Restrictions - Base Version


          ## Purpose

          This JTBD applies the Prepayment Penalty Restrictions panel, as printed: ALASKA — BUY-OUT all
          Residential 1-4; ILLINOIS — (1) BUY-OUT all Residential 1-4 if to an ENTITY OR INDIVIDUAL and
          loan amount is <= $250,000, (2) BUY-OUT all Residential 1-4 if to an INDIVIDUAL and loan amount
          is > $250,000 and interest rate is > 8%; KANSAS — BUY-OUT all Residential 1-4; MARYLAND — BUY-OUT
          all loans; MICHIGAN — BUY-OUT all Residential 1-4; MINNESOTA — BUY-OUT all Residential 1-4;
          MISSISSIPPI — BUY-OUT or 5 year (STEP) for all Residential 1 unit, no restrictions on 2+ units;
          NEW JERSEY — BUY-OUT all loans closing in name of an INDIVIDUAL; NEW MEXICO — BUY-OUT all Residential
          1-4; OHIO — BUY-OUT all Residential 1-2; PENNSYLVANIA — BUY-OUT if to an INDIVIDUAL AND on Residential
          1-2 AND loan amount < $319,777; RHODE ISLAND — BUY-OUT if a PURCHASE transaction; VIRGINIA —
          BUY-OUT all Residential 1-4 closed in the name of an individual; VERMONT — BUY-OUT for loans
          < $1 Million. The Alaska row and the Mississippi wording changed between the 6.15.2026 and 8.17.2026
          Summaries (Q-23). What BUY-OUT requires is open (Acra confirmation requested → Q-24).


          ## Reference Documents

          ### Loan and Property Records

          - Note / Prepayment Penalty Rider: prepayment treatment

          - Appraisal / title: subject state and unit count

          - 1003 / entity documents: individual vs entity borrower

          - Note: loan amount, interest rate, purpose


          ## Steps


          ### Step 1 - Initial Document Review

          - Subject state is identified from the appraisal / title.


          ### Step 2 - Eligibility Verification

          - State is checked against the 14 restricted states.


          ### Step 3 - Validation and Verification

          - Where restricted, the state''s conditions (borrower type, loan amount, rate, units, purpose)
          are evaluated against the loan.


          ### Step 4 - Final Determination

          - Treatment on the Note complies (BUY-OUT applied where triggered, or MS 5-year step) and passes;
          otherwise fails; BUY-OUT meaning subject to Q-24.


          ## Deterministic Validation Rules

          - Subject state is one of the 14 restricted states: TRUE = continue, FALSE = not applicable.

          - State condition triggered for this loan (per the printed row) and Note carries a prepayment
          penalty other than a permitted alternative: TRUE = fail, FALSE = pass.

          - Compliance depends on the meaning of BUY-OUT: conditional (Q-24).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The subject state''s restriction is not triggered, or the Note applies the required BUY-OUT
          / permitted alternative.


          ### Conditional

          Assign **Conditional** when:

          - The restriction is triggered and the Note reflects a buy-out treatment whose sufficiency depends
          on Acra''s definition of BUY-OUT (Q-24).


          ### Fail

          Assign **Fail** when:

          - The restriction is triggered and the Note carries a prepayment penalty without the required
          treatment.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The subject state is not on the restriction table.'
