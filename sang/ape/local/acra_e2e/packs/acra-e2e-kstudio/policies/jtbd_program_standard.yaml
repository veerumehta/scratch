        source_text: '# Entity Ownership Evidence - Base Version


          ## Purpose

          This JTBD applies §3.12 ownership documentation: for LLCs and Partnerships, the Operating Agreement
          must identify, or attach as an exhibit, all persons by name with their ownership interest, or
          provide membership interest certificates / units; for S or C Corporations, shareholder / stockholder
