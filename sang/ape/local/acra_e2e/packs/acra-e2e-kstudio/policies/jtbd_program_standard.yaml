        source_text: '# Prohibited Entity Types and Nesting Limit - Base Version


          ## Purpose

          This JTBD applies §3.12: not allowed are Cooperatives, Irrevocable Trusts, Land Trusts, IRAs,
          Non-Profit, and Joint Ventures. ''Business entity nesting is limited to only one (1) wholly-owned
