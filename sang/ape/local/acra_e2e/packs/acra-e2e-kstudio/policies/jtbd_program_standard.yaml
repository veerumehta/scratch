    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 3
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: CLTV (Rural / Unique Cap)
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: PRE_RURAL_LM1
          indicator_context: When the appraisal identifies a rural / unique property, compare LoanCore.cltv_percent
            with 80 / 75 / 70 by purpose, CreditReport.representative_score with 700 and DSCR with 1.00.
            Indicator is 'Pass' within all; 'Fail' otherwise; 'Not Applicable' when not rural / unique.
            Do not populate borrower_ids for this unified metric under any circumstance.
          description_template: CLTV {cltv_percent}% (rural cap {rural_cap}%); FICO {representative_score};
            DSCR {dscr_value}
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, condo / manufactured / mixed-use
