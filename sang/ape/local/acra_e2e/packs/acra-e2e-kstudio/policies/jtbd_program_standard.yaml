          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, condo / manufactured / mixed-use
            flags, address, taxes / HOA
        reference_documents: '### Loan and Rent Records

          - LOS transmittal (1008): purpose, LTV / CLTV, FICO

          - STR ledger / STRpro: STR qualification'
        source_text: '# Short-Term Rental LTV / CLTV Caps and FICO Floor - Base Version


          ## Purpose

          This JTBD applies the STR caps: ''Properties qualifying with short-term rentals are limited
          to 75% & 70% LTV / CLTV for Purchase or Refinance transactions respectively''; the Summary states
          maximum CLTV 75% (purchase) and 70% (rate & term and cash-out) and minimum FICO 640. Whether
          the caps apply to a No Ratio file is part of Q-02.


          ## Reference Documents

          ### Loan and Rent Records

          - LOS transmittal (1008): purpose, LTV / CLTV, FICO

          - STR ledger / STRpro: STR qualification


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan is identified as qualifying with STR income.


          ### Step 2 - Eligibility Verification

          - Cap set: 75% purchase / 70% refinance; FICO floor 640.


          ### Step 3 - Validation and Verification

          - LTV / CLTV and decisioning score compared.


          ### Step 4 - Final Determination

          - Within caps passes; otherwise fails; No Ratio STR files conditioned on Q-02.


          ## Deterministic Validation Rules

          - Loan qualifies with STR income: TRUE = continue, FALSE = not applicable.

          - Purchase: LoanCore.ltv_percent and cltv_percent <= 75; refinance: <= 70: TRUE = pass, FALSE
          = fail.

          - CreditReport.representative_score >= 640: TRUE = pass, FALSE = fail.

          - File is No Ratio: conditional (Q-02c).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - STR loan is within 75% / 70% LTV-CLTV and FICO >= 640.


          ### Conditional

          Assign **Conditional** when:

          - The STR file is No Ratio; application of the caps awaits Q-02.


          ### Fail

          Assign **Fail** when:

          - LTV / CLTV exceeds the STR cap or FICO is below 640.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan does not qualify with STR income.'
        source_digest: a0273177479e9f7ff4a4e08dd57fe46f858164e08c896f2aa50960c346b1790d
