        source_text: '# Score Below Lowest Matrix Row - Base Version


          ## Purpose

          This JTBD handles scores for which the matrix prints no row. No row is printed below 600 for
          loans of $1,500,000 or less; the consolidation treats such loans as having no published matrix
          value and asks whether they are ineligible (Acra confirmation requested → Q-16). The separate
