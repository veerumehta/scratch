        source_text: '# Transaction-Specific Minimum Prepayment Terms - Base Version


          ## Purpose

          This JTBD applies the minimum prepayment terms stated for particular transactions: vacant-property
          rate & term refinance, at least two years; vacant-property cash-out refinance, at least three
          years (each ''where allowable''); property listed for sale, at least three years unless the
          property is in a state that does not allow prepayment penalties. How a state restriction interacts
          with these minimums is open (Acra confirmation requested → Q-24).


          ## Reference Documents

          ### Loan and Property Records

          - Note / Prepayment Penalty Rider: term

          - Appraisal / lease: vacancy on a refinance

          - MLS history: listing within six months

          - State restriction table (PPT-PPP-STATE): whether a penalty is allowable


          ## Steps


          ### Step 1 - Initial Document Review

          - Transaction type (vacant R&T, vacant cash-out, listed for sale) is identified.


          ### Step 2 - Eligibility Verification

          - Required minimum term is set: 24, 36 or 36 months.


          ### Step 3 - Validation and Verification

          - Note term is compared; state allowability is checked.


          ### Step 4 - Final Determination

          - Term meets the minimum and passes; short term fails; state-restricted files proceed subject
          to Q-24.


          ## Deterministic Validation Rules

          - Vacant R&T refinance: LoanCore.prepayment_penalty_term_months >= 24; vacant cash-out or listed
          for sale: >= 36: TRUE = pass, FALSE = fail.

          - Subject state restricts prepayment penalties (BUY-OUT) and the minimum cannot be met: conditional
          (Q-24).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The Note''s prepayment term meets the transaction minimum.


          ### Conditional

          Assign **Conditional** when:

          - The subject state removes the penalty (BUY-OUT) so the minimum cannot be applied; proceeds
          subject to Q-24.


          ### Fail

          Assign **Fail** when:

          - The prepayment term is below the transaction minimum in a state that allows penalties.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The transaction is not a vacant refinance or listed-for-sale property.'
        source_digest: 12ca3eaacd3d9ca107c8b031e14a7ef5446a47d159670e9d7897c0574e8208da
