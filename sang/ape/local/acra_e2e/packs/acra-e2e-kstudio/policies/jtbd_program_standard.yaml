        source_text: '# Foreign National — Notarization of Documents Signed Abroad - Base Version


          ## Purpose

          This JTBD applies §3.10: documents signed outside the U.S. may be notarized by a U.S. embassy
          or consular official; the certificate of acknowledgement must include the embassy or consular
          seal and be acceptable to the title company. For documents signed in a country party to the
          Hague Convention Abolishing the Requirement of Legalization for Foreign Public Documents, a
          certificate of acknowledgment completed and signed by an authorized notary public plus authentication
          by apostille in English, attached to the executed documents, with title company acceptance,
          is agreeable to Acra.


          ## Reference Documents

          ### Closing Documents

          - Executed loan documents signed abroad: signature location

          - Embassy / consular acknowledgment with seal, or notary acknowledgment with apostille in English:
          notarial certificate

          - Title company acceptance: confirmation


          ## Steps


          ### Step 1 - Initial Document Review

          - Signing location of each executed document is identified.


          ### Step 2 - Eligibility Verification

          - Documents signed abroad carry an embassy / consular acknowledgment with seal, or a notary
          acknowledgment with English apostille (Hague country).


          ### Step 3 - Validation and Verification

          - Title company has accepted the certificate.


          ### Step 4 - Final Determination

          - Compliant notarization passes; otherwise conditioned prior to funding.


          ## Deterministic Validation Rules

          - Document signed outside the U.S.: TRUE = continue, FALSE = not applicable.

          - Embassy / consular acknowledgment with seal OR (Hague country AND notary acknowledgment with
          apostille in English attached): TRUE = pass, FALSE = fail.

          - Title company acceptance documented: TRUE = pass, FALSE = conditional.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Documents signed abroad are notarized by an acceptable method and accepted by title.


          ### Conditional

          Assign **Conditional** when:

          - Notarization is compliant but title company acceptance is pending.


          ### Fail

          Assign **Fail** when:

          - Documents signed abroad lack an acceptable acknowledgment / apostille.


          ### Not Applicable

          Assign **Not Applicable** when:

          - All documents were signed in the U.S.'
