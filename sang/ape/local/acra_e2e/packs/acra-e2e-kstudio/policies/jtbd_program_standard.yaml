        source_text: '# Background Due Diligence on Key Principals and Entities - Base Version


          ## Purpose

          This JTBD applies §3.12: Borrower / Guarantor Due Diligence is required to be current as of
          the date of any loan approval or draw (the currency schedule is not reproduced; Q-25). Acra
          reviews the background of the Key Principals and Entities — for entity borrowers, the entity,
          the recourse guarantor(s) and any party owning 20% or more directly or indirectly or with managing
          control; for individual borrowers, all such individuals — and may order background checks from
          Checkpoint, LexisNexis or a comparable provider, including criminal history, OFAC, litigation,
          judgment and lien searches.


          ## Reference Documents

          ### Due Diligence

          - Background / OFAC / litigation / lien search report: for each Key Principal and Entity

          - Operating Agreement: 20%+ owners and managing control

          - Underwriting approval: approval date for currency


          ## Steps


          ### Step 1 - Initial Document Review

          - Key Principals and Entities are identified.


          ### Step 2 - Eligibility Verification

          - Searches are on file for each.


          ### Step 3 - Validation and Verification

          - Reports are current as of approval / draw and show no adverse result.


          ### Step 4 - Final Determination

          - Clear, current searches pass; adverse results fail; stale or missing searches conditioned.


          ## Deterministic Validation Rules

          - Background report on file for the entity, each guarantor and each 20%+ / managing-control
          party: TRUE = pass, FALSE = fail.

          - Reports current as of LoanCore approval date per Acra''s schedule (Q-25): TRUE = pass, FALSE
          = conditional.

          - CreditReport.ofac_alert = FALSE and no adverse criminal / litigation / judgment / lien finding:
          TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Current, clear background due diligence is on file for all Key Principals and Entities.


          ### Conditional

          Assign **Conditional** when:

          - Reports are on file but their currency depends on Acra''s unsupplied schedule (Q-25).


          ### Fail

          Assign **Fail** when:

          - An adverse finding exists or a required party was not screened.


          ### Not Applicable

          There is no case for this outcome.'
