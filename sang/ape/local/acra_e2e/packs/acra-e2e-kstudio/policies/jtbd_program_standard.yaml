      - 'RatioSet.reserves_months >= SUM(applicable trigger months) + substitution: TRUE = pass under
        either reading, FALSE = conditional (Q-07).'
      - 'Cash-in-hand counted only for the listed-for-sale or forbearance / late trigger: TRUE = correct,
        FALSE = recalculation required.'
