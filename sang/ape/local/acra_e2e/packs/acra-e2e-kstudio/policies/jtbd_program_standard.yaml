        source_text: '# Vacant Property Rate & Term Refinance Conditions - Base Version


          ## Purpose

          This JTBD applies §10.17 and the Occupancy Type panel for a rate & term refinance of a vacant
          property: minimum 700 FICO score; maximum $1,000,000 to maximum 70% CLTV; maximum $2,000,000
          to maximum 65% CLTV; minimum 1.000 DSCR (or maximum 40.0% DTI — a DTI-program provision, Q-14);
          minimum two-year prepayment penalty (where allowable); full amortization required, no interest-only;
          impounds required; minimum six months reserves. The Summary phrases the caps as ''Max CLTV 70%
          for loan amounts under $1,000,000 and 65% for loan amounts under $2,000,000''; treatment at
          exactly $1,000,000 and $2,000,000 is open (Acra confirmation requested → Q-10).


          ## Reference Documents

          ### Loan, Credit and Property Records

          - Appraisal: vacancy

          - LOS transmittal (1008): purpose, loan amount, CLTV, amortization, escrow

          - Credit Report: FICO

          - DSCR calculation: ratio

          - Note / PPP rider: prepayment term

          - Bank statements: six months reserves


          ## Steps


          ### Step 1 - Initial Document Review

          - Transaction is a rate & term refinance of a vacant subject.


          ### Step 2 - Eligibility Verification

          - FICO >= 700; CLTV <= 70% (loan <= $1M) or <= 65% (loan <= $2M); loan above $2M ineligible.


          ### Step 3 - Validation and Verification

          - DSCR >= 1.000; PPP >= 24 months where allowable; fully amortizing; impounds; reserves >= 6
          months.


          ### Step 4 - Final Determination

          - All conditions met passes; boundary amounts conditioned on Q-10; any unmet condition fails.


          ## Deterministic Validation Rules

          - Vacant subject and LoanCore.loan_purpose = ''RefinanceRateAndTerm'': TRUE = continue, FALSE
          = not applicable.

          - CreditReport.representative_score >= 700: TRUE = pass, FALSE = fail.

          - Loan <= 1,000,000 → cltv_percent <= 70; 1,000,000 < loan <= 2,000,000 → cltv_percent <= 65;
          loan > 2,000,000 → fail (exactly $1M / $2M: conditional Q-10).

          - DSCR >= 1.000: TRUE = pass, FALSE = fail.

          - LoanCore.prepayment_penalty_term_months >= 24 where allowable: TRUE = pass, FALSE = fail.

          - LoanCore.interest_only_period_months = 0, is_escrow_waived = FALSE, RatioSet.reserves_months
          >= 6: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - All §10.17 rate & term conditions are met.


          ### Conditional

          Assign **Conditional** when:

          - Loan amount is exactly $1,000,000 or $2,000,000 and the applicable cap depends on Q-10.


          ### Fail

          Assign **Fail** when:

          - Any §10.17 condition is unmet or the loan exceeds $2,000,000.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The transaction is not a rate & term refinance of a vacant property.'
