            = recast P&I + T + I + A + subordinate; DSCR under each = qualifying rent ÷ denominator.
          description_template: IO denominator ${io_denominator} (DSCR {dscr_io}); amortized ${amortized_denominator}
            (DSCR {dscr_amortized}); minimum {governing_min_dscr}
        entity_types:
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months, DTI (not used
            for DSCR)'
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, LTV/CLTV, amortization, IO term, ARM
            terms, prepayment, escrow flag, dates'
        - name: MortgageLoanInformation
          entity_description: '1003 L3: amortization, interest-only flag and term'
        extraction_targets:
        - description: IO and amortized DSCR denominators
          entity_type: RatioSet
