  - rule_id: LFC-CLTV-FINAL.standard
    condition:
      kind: procedure
      purpose: 'This JTBD produces one governing maximum CLTV. The Standard program publishes many caps,
        each tested in its own JTBD: matrix by tier / FICO / purpose; loan < $200,000 (80/75); DSCR <
        1.0 or No Ratio (75/70/65); short-term rental (75/70/70); Non-Permanent Resident (80); Foreign
        National (70/65/65); ITIN tiers (70/65, 65/60, 60/60); 1 or no score (65); mortgage history 1x30x12
        (80/75), 0x60x12 (75/70), 0x90x12 (65); bankruptcy / foreclosure 24-35 months (80/75), 12-23 months
        (65); short sale / DIL / modification 12-23 months (80/75), < 12 months (75/70); rural / unique
        (80/75/70); Non-Warrantable Condo (80/75/75); Condotel / PUDtel (75/70/65); 2-4 unit (80); Manufactured
        (65/60/60); FTHB (70); vacant rate & term (70 under $1M / 65 under $2M); vacant cash-out (60 under
        $1.5M); listed for sale (65 LTV/CLTV); escrow waiver (80); IO 10/40 (80 LTV/CLTV); LTV > 80% only
        with 1.20 DSCR and restricted types. Adjustments: declining market −5%; Florida Non-Warrantable
        Condo / Condotel / PUDtel −5%. The consolidation assumes the matrix sets the starting limit and
        each applicable condition can only lower it; how caps and the two −5% adjustments combine is open
        (Acra confirmation requested → Q-07).'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Every input needed for each published cap is gathered from the credit report, 1008, 1003, appraisal
        and property records.


        ### Step 2 - Eligibility Verification

        - Each cap is evaluated for applicability and its value for the loan''s purpose column recorded.


        ### Step 3 - Validation and Verification

        - Governing maximum = lowest applicable cap, less 5 points for a declining market and less 5 points
        for a Florida Non-Warrantable Condo / Condotel / PUDtel.


        ### Step 4 - Final Determination

        - Proposed CLTV at or below the governing maximum proceeds; above it the loan is restructured
        or declined; files whose result depends on the combination rule are conditioned on Q-07.'
      checks:
      - 'Every applicable cap has been evaluated and recorded: TRUE = consolidation complete, FALSE =
        incomplete.'
      - 'governing_max_cltv = MIN(applicable caps) − (5 if declining market) − (5 if Florida NW Condo
        / Condotel / PUDtel): computed and recorded.'
      - 'LoanCore.cltv_percent <= governing_max_cltv: TRUE = pass, FALSE = fail.'
      - 'Result would differ if adjustments were applied to the matrix cap only or if the two −5% adjustments
        did not stack: TRUE = conditional (Q-07).'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 20
    description: Determines the single governing maximum CLTV by taking the lowest of every applicable
      published cap (matrix, loan-size, ratio, citizenship, credit-event, property-type, transaction and
      product caps), then applying the declining-market and Florida 5-point reductions, and confirms the
      loan's CLTV does not exceed that result.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 20
        section_type: Eligibility
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Final Governing Maximum CLTV
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: LFC_CLTV_FINAL_LM1
          indicator_context: Derive governing_max_cltv as the minimum of every cap applicable to the loan
            (see the requirement text for the full list and values), less 5 when the appraisal identifies
            a declining market and less 5 for a Florida Non-Warrantable Condo / Condotel / PUDtel. Indicator
            is 'Pass' when LoanCore.cltv_percent <= governing_max_cltv; 'Fail' otherwise. Cross-verify
            each input against its source document; on mismatch use the document-extracted value. Do not
            populate borrower_ids for this unified metric under any circumstance.
          calculation_context: governing_max_cltv = MIN(matrix_cap, small_loan_cap, ratio_cap, str_cap,
            citizenship_cap, score_cap, housing_history_cap, credit_event_cap, property_type_cap, rural_cap,
            fthb_cap, vacant_cap, listed_cap, escrow_waiver_cap, io_1040_cap) − adjustments. List each
            applicable cap with its value in a table, then the adjustments, then the result and the comparison.
          description_template: 'CLTV: {cltv_percent}% (governing max {governing_max_cltv}% = lowest of
            {applicable_caps}{adjustments})'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, LTV/CLTV, amortization, IO term, ARM
            terms, prepayment, escrow flag, dates'
        - name: CreditReport
          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, condo / manufactured / mixed-use
            flags, address, taxes / HOA
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
            dates
        - name: AppraisalSummary
          entity_description: Appraisal form type, value, appraiser licence and effective date
        extraction_targets:
        - description: Governing maximum CLTV derived from all applicable caps
          entity_type: LoanCore
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: AUTO_APPROVE
        reference_documents: '### Credit and Loan Records

          - Credit Report: decisioning score, housing history, credit events

          - LOS transmittal (1008): purpose, loan amount, CLTV, product, escrow, qualification method

          ### Borrower and Property Documents

          - 1003 / identification: citizenship type, FTHB status

          - Appraisal Report: property type, units, rural / declining-market indicators, state

          - MLS history / title: listing status, vacancy, ownership period'
        source_text: '# Consolidated Maximum CLTV Determination - Base Version


          ## Purpose

          This JTBD produces one governing maximum CLTV. The Standard program publishes many caps, each
          tested in its own JTBD: matrix by tier / FICO / purpose; loan < $200,000 (80/75); DSCR < 1.0
          or No Ratio (75/70/65); short-term rental (75/70/70); Non-Permanent Resident (80); Foreign National
          (70/65/65); ITIN tiers (70/65, 65/60, 60/60); 1 or no score (65); mortgage history 1x30x12 (80/75),
          0x60x12 (75/70), 0x90x12 (65); bankruptcy / foreclosure 24-35 months (80/75), 12-23 months (65);
          short sale / DIL / modification 12-23 months (80/75), < 12 months (75/70); rural / unique (80/75/70);
          Non-Warrantable Condo (80/75/75); Condotel / PUDtel (75/70/65); 2-4 unit (80); Manufactured
          (65/60/60); FTHB (70); vacant rate & term (70 under $1M / 65 under $2M); vacant cash-out (60
          under $1.5M); listed for sale (65 LTV/CLTV); escrow waiver (80); IO 10/40 (80 LTV/CLTV); LTV
          > 80% only with 1.20 DSCR and restricted types. Adjustments: declining market −5%; Florida Non-Warrantable
          Condo / Condotel / PUDtel −5%. The consolidation assumes the matrix sets the starting limit
          and each applicable condition can only lower it; how caps and the two −5% adjustments combine
          is open (Acra confirmation requested → Q-07).


          ## Reference Documents

          ### Credit and Loan Records

          - Credit Report: decisioning score, housing history, credit events

          - LOS transmittal (1008): purpose, loan amount, CLTV, product, escrow, qualification method

          ### Borrower and Property Documents

          - 1003 / identification: citizenship type, FTHB status

          - Appraisal Report: property type, units, rural / declining-market indicators, state

          - MLS history / title: listing status, vacancy, ownership period


          ## Steps


          ### Step 1 - Initial Document Review

          - Every input needed for each published cap is gathered from the credit report, 1008, 1003,
          appraisal and property records.


          ### Step 2 - Eligibility Verification

          - Each cap is evaluated for applicability and its value for the loan''s purpose column recorded.


          ### Step 3 - Validation and Verification

          - Governing maximum = lowest applicable cap, less 5 points for a declining market and less 5
          points for a Florida Non-Warrantable Condo / Condotel / PUDtel.


          ### Step 4 - Final Determination

          - Proposed CLTV at or below the governing maximum proceeds; above it the loan is restructured
          or declined; files whose result depends on the combination rule are conditioned on Q-07.


          ## Deterministic Validation Rules

          - Every applicable cap has been evaluated and recorded: TRUE = consolidation complete, FALSE
          = incomplete.

          - governing_max_cltv = MIN(applicable caps) − (5 if declining market) − (5 if Florida NW Condo
          / Condotel / PUDtel): computed and recorded.

          - LoanCore.cltv_percent <= governing_max_cltv: TRUE = pass, FALSE = fail.

          - Result would differ if adjustments were applied to the matrix cap only or if the two −5% adjustments
          did not stack: TRUE = conditional (Q-07).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - All applicable caps are evaluated and CLTV is at or below the governing maximum under every
          reading of the combination rule.


          ### Conditional

          Assign **Conditional** when:

          - CLTV passes under lowest-cap-governs with stacked adjustments but would fail under another
          reading of how caps and adjustments combine; proceeds subject to Q-07.


          ### Fail

          Assign **Fail** when:

          - CLTV exceeds the governing maximum CLTV.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: b156a8517e1f175201e4b0085ce2ddc294b8197b3a310803b740baef627ed7ab
