        source_text: '# Loan Purpose Classification - Base Version


          ## Purpose

          This JTBD confirms the transaction purpose is one the Standard DSCR matrix prices: Purchase,
          Rate & Term or Cash-Out. Delayed financing is addressed only by the footnote ''Delayed financing
          is capped at $1.5MM''; which column and cash-in-hand rule govern it is open (Acra confirmation
          requested → Q-06) and is tested in LFC-DELAY-FIN.


          ## Reference Documents

          ### Loan Origination Records

          - Loan Application (1003): declared loan purpose and refinance type

          - LOS loan record: loan purpose of record

          ### Transaction Documents

          - Purchase Agreement: purchase transactions

          - Closing Disclosure / payoff statements: refinance proceeds and cash to borrower

          - Conveyance deed / prior settlement statement: prior all-cash acquisition for delayed financing


          ## Steps


          ### Step 1 - Initial Document Review

          - 1003 and LOS record state the loan purpose; supporting documents (purchase agreement or payoff
          / CD) are identified.


          ### Step 2 - Eligibility Verification

          - Purpose is one of Purchase, Rate & Term Refinance or Cash-Out Refinance, or a delayed-financing
          transaction supported by evidence of a prior all-cash purchase.


          ### Step 3 - Validation and Verification

          - Supporting documents agree with the declared purpose (cash to borrower at closing on a refinance
          classifies it as cash-out).


          ### Step 4 - Final Determination

          - Purpose column is fixed for downstream matrix and cap lookups, with delayed financing flagged
          for LFC-DELAY-FIN.


          ## Deterministic Validation Rules

          - LoanCore.loan_purpose is ''Purchase'', ''RefinanceRateAndTerm'' or ''RefinanceCashOut'' (delayed
          financing recorded as RefinanceCashOut with the LOS delayed-financing indicator): TRUE = pass,
          FALSE = fail.

          - Declared purpose agrees with the transaction documents (cash to borrower on a refinance implies
          cash-out): TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Loan purpose is Purchase, Rate & Term or Cash-Out (or delayed financing) and agrees with the
          transaction documents.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Loan purpose is Construction, Home Improvement or another type not on the matrix, or the declared
          purpose contradicts the transaction documents.


          ### Not Applicable

          There is no case for this outcome.'
