        reference_documents: '### Loan Origination Records

          - LOS loan record: business-purpose flag, occupancy, qualification method

          - Loan Application (1003): occupancy declaration and stated use of proceeds

          ### Closing Documents

          - Business Purpose Attestation (Exhibit 8): borrower''s certification of business purpose'
        source_text: '# Business-Purpose vs Consumer Transaction Classification - Base Version


          ## Purpose

          This JTBD records whether the loan is a business-purpose transaction. The Summary is listed
          as ''Business Purpose DSCR'' and §5.32 requires the attestation under a business purpose transaction,
          yet §8.4 sets a separate seasoning threshold for consumer transactions. Whether every Standard
          DSCR loan is business-purpose is an open point (Acra confirmation requested → Q-27). The classification
          recorded here is consumed by LPE-BIZPURPOSE and AFC-SEASON-THRESH.


          ## Reference Documents

          ### Loan Origination Records

          - LOS loan record: business-purpose flag, occupancy, qualification method

          - Loan Application (1003): occupancy declaration and stated use of proceeds

          ### Closing Documents

          - Business Purpose Attestation (Exhibit 8): borrower''s certification of business purpose


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS record and 1003 show the occupancy (Investment), the qualification method (DSCR / No Ratio)
          and any stated use of proceeds.


          ### Step 2 - Eligibility Verification

          - Transaction facts are consistent with business purpose: investment property, not owner-occupied,
          qualified on rental cash flow, proceeds not for personal, family or household use.


          ### Step 3 - Validation and Verification

          - A transaction the file classifies as consumer is flagged for Acra confirmation (Q-27) before
          consumer-specific rules (seasoning threshold) are applied.


          ### Step 4 - Final Determination

          - Classification is recorded as business-purpose (attestation required) or escalated as consumer
          pending Acra''s response.


          ## Deterministic Validation Rules

          - Occupancy is Investment and qualification is by DSCR or No Ratio: TRUE = business-purpose
          indicators present, FALSE = escalate.

          - Transaction classified business-purpose and Business Purpose Attestation executed: TRUE =
          pass.

          - Transaction classified consumer: TRUE = conditional (Q-27).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The transaction is classified business-purpose, the file facts support it, and the attestation
          is executed.


          ### Conditional

          Assign **Conditional** when:

          - The transaction is classified consumer; the file proceeds only on Acra''s confirmation that
          a consumer DSCR transaction is permitted and with the consumer seasoning threshold applied.


          ### Fail

          Assign **Fail** when:

          - The business-purpose classification contradicts the file (e.g., proceeds stated for personal
          use) or is business-purpose without an executed attestation.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 9a234ad4252710a55f8c1e4f31e2d700d61138be27212dd1b61e26d3c945375a
        section: Loan Program Eligibility
        mnemonic: LPE-BIZ-CONSUMER
        also_as:
          platinum_select: LPE-BIZ-CONSUMER
