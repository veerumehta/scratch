        source_text: '# Ownership-Change 30-Day Lookback - Base Version


          ## Purpose

          This JTBD applies §3.12: changes to the operating agreement or bylaws with the intent of changing
          ownership percentages to circumvent required personal guarantors will not be considered; ''Lookback
          to changes cannot occur within 30 days prior to an Application Date or throughout the application
          process as these changes will not be recognized by Acra Lending.''


          ## Reference Documents

          ### Entity Documents

          - Operating Agreement / Bylaws and amendments: dates of ownership changes

          - Loan Application: Application Date


          ## Steps


          ### Step 1 - Initial Document Review

          - Amendments changing ownership percentages are identified with their dates.


          ### Step 2 - Eligibility Verification

          - Any change within 30 days before the Application Date or after it is flagged.


          ### Step 3 - Validation and Verification

          - Guarantor population is determined on the pre-change ownership for flagged changes.


          ### Step 4 - Final Determination

          - No flagged change passes; flagged changes require guarantees from the pre-change 20%+ owners.


          ## Deterministic Validation Rules

          - No ownership change dated within 30 days before LoanCore.application_date or after it: TRUE
          = pass, FALSE = apply pre-change ownership to BET-GUAR-20PCT.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - No ownership change falls within the lookback.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - An ownership change within the lookback reduced a guarantor below 20% and that person has
          not guaranteed.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual (or a revocable trust of individuals) and no entity borrower
          is on the loan.'
