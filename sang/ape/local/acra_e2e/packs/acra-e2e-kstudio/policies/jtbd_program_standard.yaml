        source_text: '# Cash-in-Hand Limits - Base Version


          ## Purpose

          This JTBD applies the matrix footnotes: ''When LTV > 65% Max Cash-in-Hand: $1,000,000 for loans
          >= $1,500,000, $500,000 for loans < $1,500,000'' and ''When LTV <= 65%, unlimited cash-in-hand
