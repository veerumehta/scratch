        source_text: '# Tradeline Requirements by Score Count - Base Version


          ## Purpose

          This JTBD applies the Credit Requirements panel: applicants with scores from 3 repositories
          are acceptable with no tradeline overlay; applicants with 2 or fewer scores need 2 tradelines
          & 24 month history, or 3 tradelines & 12 month history. Applicants with one or no score, or
          deficient tradelines, are handled in CRD-ONENOSCORE.


          ## Reference Documents

          ### Credit Documentation

          - Tri-merge Credit Report: repository scores, tradelines and their history length


          ## Steps


          ### Step 1 - Initial Document Review

          - Number of repository scores is counted for each applicant.


          ### Step 2 - Eligibility Verification

          - Three scores: no overlay; two or fewer: tradeline test applies.


          ### Step 3 - Validation and Verification

          - Tradelines and history length are compared with 2 / 24 months or 3 / 12 months.


          ### Step 4 - Final Determination

          - Requirement met passes; deficient tradelines route to CRD-ONENOSCORE.


          ## Deterministic Validation Rules

          - COUNT(CreditReport.scores) = 3: TRUE = pass (no overlay).

          - COUNT(CreditReport.scores) <= 2: (CreditReport.total_trade_lines >= 2 with >= 24 months history)
          OR (>= 3 with >= 12 months): TRUE = pass, FALSE = deficient (CRD-ONENOSCORE).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Three repository scores, or two or fewer scores with the required tradeline depth.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Two or fewer scores and tradeline depth is deficient (apply the 1-or-no-score / deficient-tradeline
          overlay).


          ### Not Applicable

          There is no case for this outcome.'
