        source_text: '# Foreign National — OFAC and State Exclusions - Base Version


          ## Purpose

          This JTBD applies ''See 3.10 for OFAC restrictions and state specific exclusions''. The balance
          of §3.10 is not reproduced in the excerpt (Appendix B; Acra confirmation requested → Q-25).
          Until supplied, the file is screened against OFAC (BET-BGCHECK) and the subject state is recorded
          for comparison with Acra''s exclusion list.


          ## Reference Documents

          ### Compliance Documents

          - OFAC screening: borrower and entity

          - Acra §3.10 (balance): state exclusions — to be supplied

          - Appraisal / title: subject state


          ## Steps


          ### Step 1 - Initial Document Review

          - FN borrower and any entity are OFAC-screened.


          ### Step 2 - Eligibility Verification

          - Subject state is recorded.


          ### Step 3 - Validation and Verification

          - §3.10 state exclusions are applied once supplied by Acra.


          ### Step 4 - Final Determination

          - Clear OFAC and no confirmed exclusion passes; OFAC hit fails; exclusions pending conditioned
          (Q-25).


          ## Deterministic Validation Rules

          - CreditReport.ofac_alert = FALSE for all FN parties: TRUE = continue, FALSE = fail.

          - §3.10 state exclusions supplied and subject state not excluded: TRUE = pass, FALSE (not supplied)
          = conditional (Q-25).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - OFAC is clear and Acra''s supplied state exclusions do not cover the subject state.


          ### Conditional

          Assign **Conditional** when:

          - OFAC is clear but Acra has not supplied the §3.10 state exclusions (Q-25).


          ### Fail

          Assign **Fail** when:

          - An OFAC alert exists, or the subject state is on Acra''s exclusion list.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No borrower is a Foreign National.'
        source_digest: cd09f1be4ee8ec12d60d72711ac155e759db6014a5a24a82d03ff61d96a758a2
