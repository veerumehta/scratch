  status: active
  rules:
  - rule_id: PRE-TYPES.standard
    condition:
      kind: procedure
      purpose: 'This JTBD applies the Subject Property Type panel: eligible types are SFR, Townhome, PUD,
        Warrantable Condo, Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units and Manufactured. Type-specific
        caps and conditions are PRE-TYPE-CAPS; rural / unique properties are PRE-RURAL; mixed use is PRE-MIXEDUSE.'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Appraisal and questionnaire identify the property type.


        ### Step 2 - Eligibility Verification

        - Type maps to an eligible category.


        ### Step 3 - Validation and Verification

        - Restricted categories (NW condo, condotel / PUDtel, 2-4, manufactured) are flagged for PRE-TYPE-CAPS.


        ### Step 4 - Final Determination

        - Eligible type passes; a type outside the list (e.g., 5+ units, cooperative) fails.'
      checks:
      - 'SubjectProperty.property_type in {SingleFamily, Townhouse, PUD, Condominium, DetachedCondominium,
        HighRiseCondominium, TwoToFourUnit, ManufacturedHome / ManufacturedSingleWide / ManufacturedDoubleWide
        / ManufacturedMultiWide} (Condotel / PUDtel identified via CondoProject.transient_use_status):
        TRUE = pass, FALSE = fail.'
      - 'SubjectProperty.property_type = ''Cooperative'' or units > 4: TRUE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 1
    description: Confirms the subject property type is on Acra's eligible Standard DSCR list — SFR, Townhome,
      PUD, Warrantable Condo, Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units or Manufactured — and
      routes each restricted type to its cap and condition overlay.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 1
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Subject Property Type
          metric_key: SubjectProperty.property_type
          metric_mnemonic: PRE_TYPES_LM1
          indicator_context: Read SubjectProperty.property_type (and CondoProject.transient_use_status
            / condo_project_classification for condotel / non-warrantable identification). Indicator is
            'Pass' when the type is on the eligible list; 'Fail' otherwise. Cross-verify with the appraisal;
            on mismatch use the appraisal-extracted value. Do not populate borrower_ids for this unified
            metric under any circumstance.
          description_template: 'Type: {property_type}; condo classification: {condo_project_classification};
            transient use: {transient_use_status}'
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, condo / manufactured / mixed-use
            flags, address, taxes / HOA
        - name: CondoProject
          entity_description: Condo project warrantability, transient-use and classification
        extraction_targets:
        - description: Property type and condo classification from appraisal / questionnaire
          entity_type: SubjectProperty
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Appraisal Report: property type, units, manufactured / condo classification

          - Condo / PUD questionnaire: warrantability, transient use (condotel / PUDtel)'
        source_text: '# Eligible Property Types - Base Version


          ## Purpose

          This JTBD applies the Subject Property Type panel: eligible types are SFR, Townhome, PUD, Warrantable
          Condo, Non-Warrantable Condo, Condotel / PUDtel, 2-4 Units and Manufactured. Type-specific caps
          and conditions are PRE-TYPE-CAPS; rural / unique properties are PRE-RURAL; mixed use is PRE-MIXEDUSE.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: property type, units, manufactured / condo classification

          - Condo / PUD questionnaire: warrantability, transient use (condotel / PUDtel)


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal and questionnaire identify the property type.


          ### Step 2 - Eligibility Verification

          - Type maps to an eligible category.


          ### Step 3 - Validation and Verification

          - Restricted categories (NW condo, condotel / PUDtel, 2-4, manufactured) are flagged for PRE-TYPE-CAPS.


          ### Step 4 - Final Determination

          - Eligible type passes; a type outside the list (e.g., 5+ units, cooperative) fails.


          ## Deterministic Validation Rules

          - SubjectProperty.property_type in {SingleFamily, Townhouse, PUD, Condominium, DetachedCondominium,
          HighRiseCondominium, TwoToFourUnit, ManufacturedHome / ManufacturedSingleWide / ManufacturedDoubleWide
          / ManufacturedMultiWide} (Condotel / PUDtel identified via CondoProject.transient_use_status):
          TRUE = pass, FALSE = fail.

          - SubjectProperty.property_type = ''Cooperative'' or units > 4: TRUE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The property type is on the eligible list.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The property type is not on the eligible list (e.g., cooperative, 5+ units).


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 57d43f30285f2c402f4eeb924f71280b1b7cf15747c0d73983d7e393acdd8698
        section: Appraisal Review
        mnemonic: PRE-TYPES
        also_as:
          platinum_select: PRE-TYPES
    approval_refs: []
  - rule_id: PRE-TYPE-CAPS.standard
    condition:
      kind: procedure
      purpose: 'This JTBD applies the restrictions printed on the Subject Property Type panel: Non-Warrantable
        Condo — 80% purchase / 75% rate & term / 75% cash-out, ''-5% CLTV for Florida properties, Min
        DSCR: 1.0''; Condotel / PUDtel — 75% / 70% / 65%, ''-5% CLTV for Florida properties, Min DSCR:
        1.0''; 2-4 Unit — ''Max CLTV: 80%'' with no purpose split; Manufactured Home — 65% / 60% / 60%.
        The Florida −5% adjustment feeds LFC-CLTV-FINAL (Q-07) and the 1.0 minimum feeds LFC-DSCR-FINAL.'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Restricted property type and state are identified.


        ### Step 2 - Eligibility Verification

        - Cap for the purpose column is set, less 5 points in Florida for NW condo / condotel / PUDtel.


        ### Step 3 - Validation and Verification

        - CLTV and, where applicable, DSCR >= 1.0 are compared.


        ### Step 4 - Final Determination

        - Within cap with DSCR met passes; otherwise fails.'
      checks:
      - 'NW Condo: cap 80 / 75 / 75 (−5 in FL); DSCR >= 1.0.'
      - 'Condotel / PUDtel: cap 75 / 70 / 65 (−5 in FL); DSCR >= 1.0.'
      - 'TwoToFourUnit: cap 80 all purposes.'
      - 'Manufactured: cap 65 / 60 / 60.'
      - 'LoanCore.cltv_percent <= applicable cap and DSCR condition met: TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 2
    description: Applies the property-type caps and conditions printed for restricted types — Non-Warrantable
      Condo 80% / 75% / 75% with −5% CLTV in Florida and minimum DSCR 1.0; Condotel / PUDtel 75% / 70%
      / 65% with −5% in Florida and minimum DSCR 1.0; 2-4 Unit maximum CLTV 80%; Manufactured Home 65%
      / 60% / 60%.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 2
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: CLTV vs Property-Type Cap
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: PRE_TYPE_CAPS_LM1
          indicator_context: For a Non-Warrantable Condo, Condotel / PUDtel, 2-4 Unit or Manufactured
            subject, compare LoanCore.cltv_percent with the printed cap for LoanCore.loan_purpose, less
            5 for Florida NW condo / condotel / PUDtel, and confirm DSCR >= 1.0 where required. Indicator
            is 'Pass' within cap; 'Fail' otherwise; 'Not Applicable' for unrestricted types. Do not populate
            borrower_ids for this unified metric under any circumstance.
          description_template: CLTV {cltv_percent}% (cap {type_cap}% for {property_type}, {loan_purpose}{florida_adjustment})
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, condo / manufactured / mixed-use
            flags, address, taxes / HOA
        - name: CondoProject
          entity_description: Condo project warrantability, transient-use and classification
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, LTV/CLTV, amortization, IO term, ARM
            terms, prepayment, escrow flag, dates'
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months, DTI (not used
            for DSCR)'
        reference_documents: '### Property and Loan Records

          - Appraisal Report: property type and state

          - Condo questionnaire: warrantability, transient use

          - LOS transmittal (1008): purpose, CLTV, DSCR'
        source_text: '# Property-Type CLTV Caps and Conditions - Base Version


          ## Purpose

          This JTBD applies the restrictions printed on the Subject Property Type panel: Non-Warrantable
          Condo — 80% purchase / 75% rate & term / 75% cash-out, ''-5% CLTV for Florida properties, Min
          DSCR: 1.0''; Condotel / PUDtel — 75% / 70% / 65%, ''-5% CLTV for Florida properties, Min DSCR:
          1.0''; 2-4 Unit — ''Max CLTV: 80%'' with no purpose split; Manufactured Home — 65% / 60% / 60%.
          The Florida −5% adjustment feeds LFC-CLTV-FINAL (Q-07) and the 1.0 minimum feeds LFC-DSCR-FINAL.


          ## Reference Documents

          ### Property and Loan Records

          - Appraisal Report: property type and state

          - Condo questionnaire: warrantability, transient use

          - LOS transmittal (1008): purpose, CLTV, DSCR


          ## Steps


          ### Step 1 - Initial Document Review

          - Restricted property type and state are identified.


          ### Step 2 - Eligibility Verification

          - Cap for the purpose column is set, less 5 points in Florida for NW condo / condotel / PUDtel.


          ### Step 3 - Validation and Verification

          - CLTV and, where applicable, DSCR >= 1.0 are compared.


          ### Step 4 - Final Determination

          - Within cap with DSCR met passes; otherwise fails.


          ## Deterministic Validation Rules

          - NW Condo: cap 80 / 75 / 75 (−5 in FL); DSCR >= 1.0.

          - Condotel / PUDtel: cap 75 / 70 / 65 (−5 in FL); DSCR >= 1.0.

          - TwoToFourUnit: cap 80 all purposes.

          - Manufactured: cap 65 / 60 / 60.

          - LoanCore.cltv_percent <= applicable cap and DSCR condition met: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The restricted-type cap (with Florida adjustment) and DSCR condition are met.


          ### Conditional

          Assign **Conditional** when:

          - A No Ratio file on an NW condo / condotel / PUDtel relies on the 1.0 minimum being inapplicable
          (Q-13).


          ### Fail

          Assign **Fail** when:

          - CLTV exceeds the type cap or DSCR is below 1.0 where required.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The property is SFR, Townhome, PUD or Warrantable Condo (no type cap from this panel).'
        source_digest: 2c9ccc1b4659ccdfe81f030699fa232cf8137c137934d650f41f427f0875971e
        section: Appraisal Review
        mnemonic: PRE-TYPE-CAPS
    approval_refs: []
  - rule_id: PRE-RURAL.standard
