        yet §8.4 sets a separate seasoning threshold for consumer transactions. Whether every Standard
        DSCR loan is business-purpose is an open point (Acra confirmation requested → Q-27). The classification
        recorded here is consumed by LPE-BIZPURPOSE and AFC-SEASON-THRESH.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - LOS record and 1003 show the occupancy (Investment), the qualification method (DSCR / No Ratio)
        and any stated use of proceeds.


        ### Step 2 - Eligibility Verification

        - Transaction facts are consistent with business purpose: investment property, not owner-occupied,
        qualified on rental cash flow, proceeds not for personal, family or household use.


        ### Step 3 - Validation and Verification

