          Stock Certificate where certificates are lost, destroyed, mutilated or unavailable; for S-corporations
          or Partnerships where both certificate and ledger are unavailable, the most recent preceding
          tax year''s K-1 for all 20%+ members and a CPA / tax preparer letter affirming current ownership
          (with a statement if the prior year''s taxes are unfiled).


