            = total_loan_amount_usd × note_rate_percent ÷ 1200 and compare with the Note's IO payment.
            Indicator is 'Pass' within rounding; 'Fail' otherwise; 'Not Applicable' when fully amortizing.
            Do not populate borrower_ids for this unified metric under any circumstance.
          calculation_context: computed_io_payment = loan amount × note rate ÷ 12; compare to the Note.
          description_template: IO payment on Note ${note_io_payment} vs computed ${computed_io_payment}
            at {note_rate_percent}%
        entity_types:
