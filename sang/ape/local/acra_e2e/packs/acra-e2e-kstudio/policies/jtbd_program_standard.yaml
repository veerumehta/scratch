  - rule_id: AFC-RESERVE-TOTAL.standard
    condition:
      kind: procedure
      purpose: This JTBD consolidates the reserve triggers at §9.2 into one governing requirement. The
        sources state reserves only for those situations and state the payment basis only for the LTV
        > 80% trigger (PITIA); the base requirement where no trigger applies, the payment basis where
        only 'months' is stated, permitted sources, whether overlapping triggers are cumulative, and whether
        reserves substituted for rent loss insurance are additional are open (Acra confirmation requested
        → Q-07). This JTBD applies the highest applicable trigger, adds the rent-loss substitution because
        it replaces a distinct coverage, and conditions any file whose outcome would change under a cumulative
        reading. Individual triggers are AFC-RESERVE-LTV80, AFC-RESERVE-FICO, AFC-RESERVE-TXN and RLI-RESERVE-SUB.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - All applicable triggers are identified: LTV > 80%; FICO < 620; FTHB; vacant refinance; listed
        for sale; forbearance / late without receipts; rent loss unobtainable.


        ### Step 2 - Eligibility Verification

        - Months per trigger are recorded (6, 12, 6, 6, 24, 12, 2 per uncovered month).


        ### Step 3 - Validation and Verification

        - Governing requirement = highest trigger + rent-loss substitution; verified reserves (cash-in-hand
        only where permitted) compared.


        ### Step 4 - Final Determination

        - Reserves at or above the requirement pass; shortfall fails; files passing only under highest-applies
        conditioned on Q-07.'
