    domain_extensions:
      jtbd:
        sequence: 28
        section_type: Eligibility
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: HELOC Line Limit vs Balance (CLTV Basis)
          metric_key: Liability.credit_limit_usd
          metric_mnemonic: PPT_SUBFIN_HELOC_LM1
          indicator_context: For a subject-property Liability with liability_type = 'HELOC', take MAX(Liability.credit_limit_usd,
            Liability.unpaid_balance_usd) as the subordinate amount in LoanCore.cltv_percent. Indicator
            is 'Pass' when the recorded CLTV uses that amount; 'Fail' otherwise; 'Not Applicable' when
            no HELOC exists. Do not populate borrower_ids for this unified metric under any circumstance.
          calculation_context: cltv_basis = MAX(credit_limit_usd, unpaid_balance_usd); CLTV = (first lien
            + cltv_basis) ÷ value.
          description_template: HELOC limit ${credit_limit_usd} / balance ${unpaid_balance_usd}; CLTV
            basis ${cltv_basis_amount}
        entity_types:
        - name: Liability
          entity_description: Mortgage and rental obligations with payment history, lien position and
            subject-lien flags
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, LTV/CLTV, amortization, IO term, ARM
            terms, prepayment, escrow flag, dates'
        extraction_targets:
        - description: 'Subordinate lien on the subject: type, limit, balance, payment'
          entity_type: Liability
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Loan and Title Records

          - Title Commitment: existing junior liens

          - Subordinate lien statement / HELOC agreement: credit line limit and current balance

          - LOS transmittal (1008): CLTV as calculated'
        source_text: '# Subordinate Financing and HELOC CLTV Calculation - Base Version


          ## Purpose

          This JTBD handles subordinate financing. The Summary states: ''For all Programs with allowable
          Subordinate/Secondary Financing: If Subordinate/Secondary Financing is a HELOC, CLTV will be
          calculated on the greater of the credit line limit or current credit line balance for eligibility.''
          This is a calculation rule conditioned on subordinate financing being allowable; whether it
          is allowed on Standard DSCR, for which lien types and transactions, and with what leverage and
          payment rules, is open (Acra confirmation requested → Q-18). No subordinate financing is allowed
          on a property listed for sale (§11.5).


          ## Reference Documents

          ### Loan and Title Records

          - Title Commitment: existing junior liens

          - Subordinate lien statement / HELOC agreement: credit line limit and current balance

          - LOS transmittal (1008): CLTV as calculated


          ## Steps


          ### Step 1 - Initial Document Review

          - Title and liabilities identify any subordinate lien on the subject.


          ### Step 2 - Eligibility Verification

          - Where the lien is a HELOC, CLTV is recomputed on the greater of the line limit or balance.


          ### Step 3 - Validation and Verification

          - Listed-for-sale status is checked (subordinate financing prohibited).


          ### Step 4 - Final Determination

          - No subordinate lien → not applicable; HELOC CLTV correct and Acra confirms eligibility → pass;
          listed property with subordinate financing → fail.


          ## Deterministic Validation Rules

          - A Liability with is_subject_property_lien = TRUE and lien_position > 1 exists: TRUE = continue,
          FALSE = not applicable.

          - Liability.liability_type = ''HELOC'': CLTV computed on MAX(Liability.credit_limit_usd, Liability.unpaid_balance_usd):
          TRUE = correct, FALSE = recalculation required.

          - Subject listed for sale within six months and subordinate financing exists: TRUE = fail.

          - Subordinate financing present on any other file: conditional (Q-18).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Subordinate financing exists, HELOC CLTV is computed on the greater of limit or balance, and
          Acra has confirmed subordinate financing is permitted for the transaction.


          ### Conditional

          Assign **Conditional** when:

          - Subordinate financing exists and its eligibility on Standard DSCR awaits Acra''s Q-18 response.


          ### Fail

          Assign **Fail** when:

          - Subordinate financing exists on a listed-for-sale property, or the HELOC CLTV was computed
          on the balance when the limit is higher.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No subordinate lien exists on the subject property.'
        source_digest: 030a576148c9bf9aae1c28a890698ff7a9762e378256cf51bab838e32cf60d83
