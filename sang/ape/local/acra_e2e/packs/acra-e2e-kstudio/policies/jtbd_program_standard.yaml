        source_text: '# Decisioning Credit Score Determination - Base Version


          ## Purpose

          This JTBD sets the score used for the matrix, ARM margin and every FICO floor. The Standard
          Summary does not state which score is the decisioning score or how it is set for an entity borrower
          with several guarantors (Acra confirmation requested → Q-19). The only printed score rules are
          for one score (use actual to max 700) and no score (price as 700 tier). Pending Acra''s answer,
          the file records the convention applied and is conditioned where the choice changes the outcome.


          ## Reference Documents

          ### Credit Documentation

          - Tri-merge Credit Report for each borrower / guarantor: repository scores

          - Operating Agreement: ownership percentages for an entity borrower


          ## Steps


          ### Step 1 - Initial Document Review

          - Scores for every borrower / guarantor are extracted.


          ### Step 2 - Eligibility Verification

          - Convention applied (middle of three; lower of two; single score capped at 700) is recorded.


          ### Step 3 - Validation and Verification

          - For an entity, the guarantor whose score is used is identified with the basis.


          ### Step 4 - Final Determination

          - Score recorded; outcome-sensitive choices conditioned on Q-19.


          ## Deterministic Validation Rules

          - CreditReport.representative_score recorded for each party with the convention applied: TRUE
          = recorded.

          - Decisioning score selection would not change any pass / fail outcome under the alternative
          conventions: TRUE = pass, FALSE = conditional (Q-19).

          - One score: representative_score = MIN(actual, 700); no score: priced as 700 tier: TRUE = correct,
          FALSE = correction required.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A decisioning score is recorded and no outcome depends on the unstated convention.


          ### Conditional

          Assign **Conditional** when:

          - The decisioning score choice (which score, which guarantor) changes a matrix row, floor or
          margin outcome; awaits Q-19.


          ### Fail

          There is no case for this outcome.


          ### Not Applicable

          There is no case for this outcome.'
