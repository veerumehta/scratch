  - rule_id: BET-REVTRUST.standard
    condition:
      kind: procedure
      purpose: 'This JTBD applies §3.12: title vesting in an inter vivos revocable trust is permitted
        when all of the following are met — a complete, legible copy of the Trust or a Certification of
        Trust stating the existence and date of the Trust, the Trustor(s) and current Trustee(s), the
        Trustee''s powers, whether the Trust is revocable and who holds the right to revoke, the names
        and number of Trustees required to sign, the Trust identification number (SSN or IRS TIN), how
        title should be taken, and that the Trust has not been revoked, modified or amended; the Trust
        is valid under the laws of its state; it is revocable (irrevocable trusts not permitted); it is
        established by one or more natural persons and effective during their lifetime; the primary beneficiary
        is the individual(s) establishing it; a written exception by Acra Senior Management is obtained
        if Trustor(s) and Trustee(s) differ; the Trust specifies the Trustee''s power to hold title and
        mortgage the property, that beneficiary consent is not needed or has been given in writing, that
        there is no unusual risk or impairment to the lender''s rights, and that holding title in the
        Trust does not diminish the lender''s rights as creditor. Legal may condition for additional documentation.'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Trust or Certification of Trust is on file with every required statement.


        ### Step 2 - Eligibility Verification

        - Trust is revocable, valid under state law, established by natural persons, with those persons
        as primary beneficiaries.


        ### Step 3 - Validation and Verification

        - Trustee powers to hold title and mortgage, consent provisions and no-impairment statements are
        present; trustor / trustee mismatch has a Senior Management exception.


        ### Step 4 - Final Determination

        - All conditions met passes; missing statements conditioned; irrevocable or non-conforming trust
        fails.'
      checks:
      - 'Complete trust or Certification of Trust with all required statements on file: TRUE = pass, FALSE
        = conditional.'
      - 'Trust is revocable, valid under state law, established by natural persons effective in their
        lifetime, primary beneficiary = trustor(s): TRUE = pass, FALSE = fail.'
      - 'Trustor(s) = Trustee(s), or written Senior Management exception on file: TRUE = pass, FALSE =
        fail.'
      - 'Trust grants trustee power to hold title and mortgage, addresses beneficiary consent, and contains
        the no-impairment statements: TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 18
    description: Confirms title vesting in an inter vivos revocable trust meets all of Acra's conditions
      — a complete trust or Certification of Trust with the required statements, validity under state
