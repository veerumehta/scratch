          - CREATE
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Rent Documents

          - Form 1007 / 1025: market rent

          - Lease Agreement(s): in-place (actual) rent

          - Rent receipt evidence: where actual rent above market is used'
        source_text: '# Qualifying Rent Determination - Base Version


          ## Purpose

          This JTBD sets the DSCR numerator. §5.32 states the formula as the lesser of (i) annual in-place
          rent or (ii) market rent (§14.14, not reproduced), and in the same section notes that ''Acra
          may use the higher of actual or market rents'' where actual rents exceeding market are documented
          by two consecutive months of receipts and a lease continuing at least three months after closing
          (DSCR-ACTRENT-DOC). The consolidation does not select between the two: when market rent may
          be used if actual rent is lower, when higher actual rent may be used, and whether the stated
          documentation is sufficient is open (Acra confirmation requested → Q-01). On a vacant purchase,
          rents are taken from the 1007 / 1025 (DSCR-VACANT-RENT).


          ## Reference Documents

          ### Rent Documents

          - Form 1007 / 1025: market rent

          - Lease Agreement(s): in-place (actual) rent

          - Rent receipt evidence: where actual rent above market is used


          ## Steps


          ### Step 1 - Initial Document Review

          - Market rent (1007 / 1025) and in-place rent (lease) are extracted.


          ### Step 2 - Eligibility Verification

          - Base qualifying rent = lesser of in-place and market rent.


          ### Step 3 - Validation and Verification

          - Where the file uses the higher actual rent, the DSCR-ACTRENT-DOC evidence is confirmed and
          the Q-01 dependency flagged; where market rent is used above a lower actual rent, the file is
          flagged (Q-01).


          ### Step 4 - Final Determination

          - Qualifying rent is recorded for DSCR-CALC with the basis (lesser-of, higher-actual, market-on-vacant)
          and any Q-01 condition.


          ## Deterministic Validation Rules

          - Qualifying rent = MIN(lease rent, 1007/1025 market rent): TRUE = base rule applied.

          - File uses actual rent above market rent and DSCR-ACTRENT-DOC passes: TRUE = conditional (Q-01),
          FALSE = fail.

          - File uses market rent while a lower actual rent exists: TRUE = conditional (Q-01).

          - Vacant purchase: qualifying rent = 1007/1025 market rent (DSCR-VACANT-RENT).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Qualifying rent is the lesser of in-place and market rent, or market rent on a vacant purchase.


          ### Conditional

          Assign **Conditional** when:

          - The file relies on the higher-of note (actual above market with the required evidence) or
          on market rent above a lower actual rent; proceeds subject to Acra''s Q-01 response.


          ### Fail

          Assign **Fail** when:

          - Actual rent above market is used without the required receipt and lease evidence, or no rent
          basis is documented.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The file qualifies as No Ratio DSCR.'
        source_digest: c7f561c3a36f5c76f226098758ba689181378f43d02e0529064ca948535e3722
        section: Income Stability & Sufficiency Analysis
        mnemonic: DSCR-QUALRENT
