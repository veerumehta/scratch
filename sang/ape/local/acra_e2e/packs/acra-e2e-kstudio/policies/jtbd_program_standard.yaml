        source_text: '# Entity Authorization (Consent / Resolution) and POA for Guarantees - Base Version


          ## Purpose

          This JTBD applies §3.12: a Unanimous Written Consent / Board Resolution signed by all members
          regardless of their percentage of interest, (i) authorizing the transaction with Acra Lending
          and (ii) identifying who is authorized to sign the loan documents on behalf of and to bind the
          entity; it may be required by the Operating Agreement or Bylaws even where ownership is held
          by one individual; it cannot be used to designate a signor on a personal guarantee — a Power
          of Attorney must be used by the principal to designate an attorney-in-fact to execute a personal
          guarantee (§23.5(C), not reproduced; Q-25).


