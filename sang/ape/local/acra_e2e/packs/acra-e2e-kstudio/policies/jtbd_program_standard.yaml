        source_text: '# Investment Occupancy Confirmation - Base Version


          ## Purpose

          This JTBD confirms the loan is secured by a non-owner-occupied investment property. The Standard
          DSCR Program Summary lists Investment Property as the only occupancy type; a primary residence
          or second home cannot proceed on this program.


          ## Reference Documents

          ### Loan Origination Records

          - Loan Application (1003): occupancy declaration for the subject property

          - LOS loan record: occupancy type of record

          ### Property Documents

          - Appraisal Report: appraiser''s occupancy observation

          - Lease Agreement: tenant occupancy evidence, where in place


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application and LOS record show the declared occupancy of the subject property.


          ### Step 2 - Eligibility Verification

          - Declared occupancy is Investment (non-owner occupied); no borrower or guarantor intends to
          occupy the subject.


          ### Step 3 - Validation and Verification

          - Appraisal occupancy observation and any lease agree with the declared occupancy; a conflict
          (owner-occupied indication, borrower''s mailing address at the subject) is identified.


          ### Step 4 - Final Determination

          - Occupancy is confirmed as Investment and the file proceeds, or the subject is owner-occupied
          or a second home and the loan is ineligible for the program.


          ## Deterministic Validation Rules

          - SubjectProperty.occupancy_type = ''Investment'': TRUE = pass, FALSE = fail.

          - No borrower or guarantor declares intent to occupy the subject (Borrower.is_intent_to_occupy
          = FALSE for all): TRUE = pass, FALSE = fail.

          - Appraisal occupancy observation is consistent with tenant / investment use: TRUE = pass, FALSE
          = conditional pending explanation.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Occupancy is Investment on the application, the LOS and the appraisal, and no borrower intends
          to occupy.


          ### Conditional

          Assign **Conditional** when:

          - Occupancy is declared Investment but the appraisal or another file document suggests owner
          occupancy; a letter of explanation and supporting evidence are pending.


          ### Fail

          Assign **Fail** when:

          - Occupancy is Primary Residence or Second Home, or a borrower / guarantor intends to occupy
          the subject.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 57b2cad9ef2fc501c5167790c25af15194428539203abf15f9d9ca1a27a11de3
        section: Loan Program Eligibility
        mnemonic: LPE-OCCUPANCY
