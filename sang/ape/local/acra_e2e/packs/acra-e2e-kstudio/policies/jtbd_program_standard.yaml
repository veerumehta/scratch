        source_text: '# Mortgage History Tier CLTV Caps - Base Version


          ## Purpose

          This JTBD applies the Mortgage history restrictions as printed: 1x30x12 → Max CLTV 80% purchase
          / 75% refinance (rate & term and cash-out); 0x60x12 → 75% / 70%; 0x90x12 → 65% (printed without
          purpose split, applied to both); 0x120x12 → Ineligible. The labels are Acra''s; their definitions
          and how seasoning is measured are open (Acra confirmation requested → Q-05). The rating itself
          comes from CRD-MTG-RATING; the forbearance / late documentation overlay is DSCR-FORB-OVL.


          ## Reference Documents

          ### Credit Documentation

          - Credit Report / payment history: 12-month mortgage / rental rating (CRD-MTG-RATING)

          - LOS transmittal (1008): purpose and CLTV


          ## Steps


          ### Step 1 - Initial Document Review

          - Twelve-month mortgage / rental rating is taken from CRD-MTG-RATING.


          ### Step 2 - Eligibility Verification

          - Rating maps to a printed tier: 0x30x12 (no cap from this panel), 1x30x12, 0x60x12, 0x90x12,
          0x120x12.


          ### Step 3 - Validation and Verification

          - CLTV is compared with the tier cap for the purpose; 0x120x12 is ineligible.


          ### Step 4 - Final Determination

          - Within cap passes; above cap or 0x120x12 fails; label-definition dependence conditioned on
          Q-05.


          ## Deterministic Validation Rules

          - Worst 12-month rating: 0x30x12 → not applicable; 1x30x12 → cap 80 / 75; 0x60x12 → 75 / 70;
          0x90x12 → 65 / 65; 0x120x12 → fail.

          - LoanCore.cltv_percent <= tier cap for LoanCore.loan_purpose: TRUE = pass, FALSE = fail.

          - Tier assignment depends on the undefined label reading (e.g., two 30-day lates): conditional
          (Q-05).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The mortgage-history tier cap is met.


          ### Conditional

          Assign **Conditional** when:

          - Tier assignment depends on the meaning of a printed label (Q-05).


          ### Fail

          Assign **Fail** when:

          - CLTV exceeds the tier cap, or the history is 0x120x12.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The 12-month history is 0x30x12.'
        source_digest: b7153b0266a65c318f14d11fd3c8a4c332d874849a21ac3465a34a0a2d0e2b56
