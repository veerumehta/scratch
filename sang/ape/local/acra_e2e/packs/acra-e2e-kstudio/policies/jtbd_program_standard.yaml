        source_text: '# Guarantor Credit Review Scope - Base Version


          ## Purpose

          This JTBD defines the population of individuals whose credit is reviewed on an entity-borrower
          loan and confirms each program credit requirement is applied to every one of them. Acra requires
          all 20%+ owners to guarantee, reviews the background of the entity, its recourse guarantors
          and any 20%+ / managing-control party, and requires housing-history documentation for the ''borrower
          and / or guarantor(s)''. Whether ''Applicant'' in the forbearance / mortgage-late provision
          includes guarantors is open (Acra confirmation requested → Q-20); how the decisioning score
          is set among guarantors is Q-19.


          ## Reference Documents

          ### Entity and Credit Documents

          - Operating Agreement / ownership evidence: owners and percentages

          - Personal Guarantee(s): executed guarantors

          - Tri-merge Credit Report and 1003 for each guarantor: scores, tradelines, history, declarations


          ## Steps


          ### Step 1 - Initial Document Review

          - Every 20%+ direct or indirect owner is identified and reconciled with the executed guarantees.


          ### Step 2 - Eligibility Verification

          - A credit report and 1003 are on file for each guarantor.


          ### Step 3 - Validation and Verification

          - Each guarantor''s outcomes under CRD-TRADELINE / CRD-ONENOSCORE, CRD-MTG-RATING / CRD-MTGHIST-TIER,
          CRD-BKFC-SEASON, CRD-SSDIL-SEASON and the governing FICO are recorded.


          ### Step 4 - Final Determination

          - All guarantors evaluated and passing → pass; a missing or failing guarantor → fail; guarantor-only
          forbearance triggers → conditional (Q-20).


          ## Deterministic Validation Rules

          - Every 20%+ owner has executed a guarantee: TRUE = pass, FALSE = fail.

          - Every guarantor has a credit report and 1003 on file: TRUE = pass, FALSE = fail.

          - Every guarantor has recorded outcomes for the credit JTBDs and none is Fail: TRUE = pass,
          FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Every 20%+ owner is a guarantor with a credit report and passes each credit requirement.


          ### Conditional

          Assign **Conditional** when:

          - All guarantors pass, but a guarantor''s file relies on the forbearance / late alternative
          whose application to guarantors awaits Q-20.


          ### Fail

          Assign **Fail** when:

          - A 20%+ owner has not guaranteed, lacks a credit report, was not evaluated, or fails a credit
          requirement.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual (or a revocable trust of individuals) and no entity borrower
          is on the loan.'
        source_digest: b6ec32e0f61d403438589278a90e9c9e7bae82e839b07541861ec8a30cd94a6e
        section: Credit Review & Analysis
        mnemonic: CRD-GUAR-SCOPE
