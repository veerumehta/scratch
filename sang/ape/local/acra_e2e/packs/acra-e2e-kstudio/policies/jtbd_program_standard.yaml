        source_text: '# Business Purpose Attestation - Base Version


          ## Purpose

          This JTBD confirms execution of the Business Purpose Attestation required by §5.32 where the
          borrower qualifies using the subject property''s actual or market cash flow under a business
          purpose transaction. The Program Summary is listed as ''Business Purpose DSCR''; whether every
          loan on the program is business-purpose is an open point (Acra confirmation requested → Q-27),
          handled in LPE-BIZ-CONSUMER.


          ## Reference Documents

          ### Closing Documents

          - Business Purpose Attestation (Exhibit 8) or Acra-approved equivalent: borrower''s certification
          that the loan is for business purposes

          - Note / Closing package: confirms the attestation is executed with the loan documents

          ### Loan Origination Records

          - LOS loan record: qualification method (DSCR / No Ratio) and business-purpose classification


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS record confirms the loan qualifies on the subject''s cash flow (calculated DSCR or No
          Ratio) as a business-purpose transaction.


          ### Step 2 - Eligibility Verification

          - Attestation form is Exhibit 8 or a form Acra has approved as similar.


          ### Step 3 - Validation and Verification

          - Attestation is executed by every borrower / authorized entity signer and dated with the loan
          documents.


          ### Step 4 - Final Determination

          - Executed attestation is in the closing package and the file proceeds, or it is missing / unsigned
          and the file is conditioned prior to docs.


          ## Deterministic Validation Rules

          - Loan is classified business-purpose and qualifies on subject cash flow: TRUE = attestation
          required, FALSE = not applicable.

          - Business Purpose Attestation (Exhibit 8 or Acra-approved equivalent) is executed by all required
          signers with the loan documents: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The executed Business Purpose Attestation is in the closing package, signed by all required
          parties.


          ### Conditional

          Assign **Conditional** when:

          - The attestation is prepared but not yet executed because loan documents have not been signed;
          the file proceeds subject to execution at closing.


          ### Fail

          Assign **Fail** when:

          - The loan is business-purpose and no attestation, or an unsigned / non-approved form, is in
          the file at closing.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The transaction is classified consumer-purpose (LPE-BIZ-CONSUMER) and Acra has confirmed no
          attestation is required.'
        source_digest: ac7100da2ad76102b25776a88d298a5f8ee89219dbb24394faafc92f824eb00e
