      reads: []
      missing_reads: []
    action: require_evidence
    priority: 19
    description: Confirms the loan is underwritten to the controlling Acra sources for the Standard program
      — the DSCR Program Summary dated 8.17.2026 (which supersedes the 6.15.2026 V1.1 copy) and the Seller's
      Guide excerpt dated August 28, 2026 — applies the four version differences correctly, and records
      any Acra confirmation-register responses applied.
