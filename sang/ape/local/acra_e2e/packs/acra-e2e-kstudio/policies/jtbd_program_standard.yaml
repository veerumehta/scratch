            'Conditional' when all are TRUE (Q-09); 'Fail' when no attestation. Do not populate borrower_ids
            for this unified metric under any circumstance.
          description_template: 'Guarantors with prior ownership: {prior_owner_count}; attestation on
            file: {attestation_on_file}'
        entity_types:
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
            dates
        - name: RealEstateOwned
          entity_description: Schedule of REO incl. subject rental income, use and ownership
        extraction_targets:
        - description: First-time-homebuyer flag and prior ownership evidence
          entity_type: Borrower
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Application and Credit

          - Loan Application (1003): non-FTHB attestation and declarations

          - Credit Report / payment history / REO: evidence of prior ownership'
        source_text: '# Guarantor Prior Homeownership and Non-FTHB Attestation - Base Version


          ## Purpose

          This JTBD applies §3.12: Acra requires at least one guarantor to have prior homeownership experience;
          at least one borrower / guarantor on the loan must attest on the application that they are not
          a first-time homebuyer; if prior home ownership is not evident within the loan file, the underwriter
          may condition for supporting documentation. How this interacts with the §3.13 FTHB allowance
          (LPE-FTHB-COND) — whether it applies only to entities and whether an entity whose guarantors
          never owned real property may qualify — is open (Acra confirmation requested → Q-09).


          ## Reference Documents

          ### Application and Credit

          - Loan Application (1003): non-FTHB attestation and declarations

          - Credit Report / payment history / REO: evidence of prior ownership


          ## Steps


          ### Step 1 - Initial Document Review

          - Guarantors'' declarations and credit / REO are reviewed for prior ownership.


          ### Step 2 - Eligibility Verification

          - At least one guarantor has prior homeownership.


          ### Step 3 - Validation and Verification

          - At least one borrower / guarantor attests to not being a FTHB.


          ### Step 4 - Final Determination

          - Both met passes; missing evidence conditioned; entity with no prior-owner guarantor conditioned
          on Q-09.


          ## Deterministic Validation Rules

          - At least one guarantor has documented prior ownership of real property: TRUE = pass, FALSE
          = conditional (Q-09).

          - At least one borrower / guarantor attests non-FTHB on the application: TRUE = pass, FALSE
          = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A guarantor has prior ownership and the non-FTHB attestation is on the application.


          ### Conditional

          Assign **Conditional** when:

          - No guarantor has prior ownership (FTHB entity); proceeds only on Acra''s Q-09 response and
          the §3.13 conditions.


          ### Fail

          Assign **Fail** when:

          - No non-FTHB attestation is on the application.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual (or a revocable trust of individuals) and no entity borrower
          is on the loan.'
        source_digest: 5ba3e69e54f0d8305b916de8ec5733a08557eeb025fe536e0a5fa4a8418c9151
        section: Compliance and Closing
        mnemonic: BET-FTHB-ATTEST
        also_as:
          platinum_select: BET-FTHB-ATTEST
