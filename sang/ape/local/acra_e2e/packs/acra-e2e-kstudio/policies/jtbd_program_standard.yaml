        source_text: '# Entity EIN Documentation - Base Version


          ## Purpose

          This JTBD applies §3.12: IRS Form SS4 or Federal Taxpayer Identification Number (TIN) or Employer
          Identification Number (EIN) issuance letter for the entity; EIN exception requests may be submitted
          for review by Acra''s Legal Department with a letter of explanation stating the applicable grounds.


          ## Reference Documents

          ### Entity Documents

          - IRS Form SS-4 or EIN issuance letter: entity EIN

          - EIN exception request and LOE: where submitted to Acra Legal


          ## Steps


          ### Step 1 - Initial Document Review

          - File is checked for SS-4 / EIN letter.


          ### Step 2 - Eligibility Verification

          - EIN matches the entity name.


          ### Step 3 - Validation and Verification

          - Where absent, an exception request with LOE is submitted to Acra Legal.


          ### Step 4 - Final Determination

          - EIN documented passes; exception pending conditions; neither fails.


          ## Deterministic Validation Rules

          - SS-4 or EIN issuance letter on file matching the entity: TRUE = pass, FALSE = continue.

          - EIN exception request with LOE submitted to Acra Legal: TRUE = conditional, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The EIN is documented by SS-4 / issuance letter.


          ### Conditional

          Assign **Conditional** when:

          - An EIN exception request is pending with Acra Legal.


          ### Fail

          Assign **Fail** when:

          - No EIN documentation and no exception request.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual (or a revocable trust of individuals) and no entity borrower
          is on the loan.'
        source_digest: 9941fc246a17dc7fd84aec5cb4cf0f3b239e26a3a5a5306dd1d38bba6370ac08
