        source_text: '# Delayed Financing Cap - Base Version


          ## Purpose

          This JTBD applies the footnote ''Delayed financing is capped at $1.5MM''. Delayed financing
          is otherwise addressed only by that footnote; which matrix column governs it and which cash-in-hand
          rule applies is open (Acra confirmation requested → Q-06). Note that the footnote was added
