        source_text: '# Forbearance / Mortgage Late Documentation Overlay - Base Version


          ## Purpose

          This JTBD applies §5.32: ''If the Applicant has had forbearance or mortgage lates within the
          last 12-months, Tenant occupied properties will require documentation of (i) timely receipt
          for the prior two (2) months rental payments or (ii) 12-months of subject''s payment in reserve,
          which may be from transaction''s cash-in-hand.'' Whether ''Applicant'' includes the guarantors
          of an entity borrower is open (Acra confirmation requested → Q-20). The CLTV consequences of
          the late itself are CRD-MTGHIST-TIER.


          ## Reference Documents

          ### Credit and Rent Documents

          - Credit Report / payment history: forbearance or mortgage late within 12 months

          - Forbearance plan agreement: if any

          - Rent receipt evidence: prior two months'' rent received timely

          - Bank statements / Closing Disclosure: 12 months of subject payment in reserve or cash-in-hand


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit and payment history show whether any applicant (or guarantor, Q-20) had forbearance
          or a mortgage late in the last 12 months.


          ### Step 2 - Eligibility Verification

          - Subject is tenant-occupied.


          ### Step 3 - Validation and Verification

          - Either two months of timely rent receipts or 12 months of subject PITIA in reserve (cash-in-hand
          permitted) is documented.


          ### Step 4 - Final Determination

          - Alternative documented → pass; neither → fail; guarantor-only trigger → conditional (Q-20).


          ## Deterministic Validation Rules

          - Any applicant had forbearance or a mortgage late within 12 months: TRUE = continue, FALSE
          = not applicable.

          - Timely receipt of the prior two months'' rent is documented OR RatioSet.reserves_months (subject
          payment basis, incl. cash-in-hand) >= 12: TRUE = pass, FALSE = fail.

          - Trigger arises only from a guarantor of an entity borrower: conditional (Q-20).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The overlay is triggered and two months of timely rent receipts or 12 months of subject payment
          reserves are documented.


          ### Conditional

          Assign **Conditional** when:

          - The trigger arises only from a guarantor and Acra''s Q-20 response is pending.


          ### Fail

          Assign **Fail** when:

          - The overlay is triggered and neither alternative is documented.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No applicant had forbearance or a mortgage late within 12 months.'
