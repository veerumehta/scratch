        source_text: '# Mortgage / Rental Rating and Payment History - Base Version


          ## Purpose

          This JTBD applies §4.15: the mortgage / rental rating for determining mortgage pricing is determined
          by evaluating the ratings for properties the borrower owns and / or rents over the last twelve
          months; all reported mortgages on credit should be considered; where the applicant has mortgages
          that are not reported, the file should contain documentation to evaluate history on the applicant''s
          primary residence(s), any secondary residence(s), and the subject property. The CLTV consequence
          of the rating is CRD-MTGHIST-TIER.


          ## Reference Documents

          ### Credit Documentation

          - Credit Report: reported mortgages and rental tradelines

          - VOM / VOR / mortgage statements: unreported mortgages and rent history

          - Schedule of REO: owned and rented properties


          ## Steps


          ### Step 1 - Initial Document Review

          - Owned and rented properties are listed from the REO and 1003.


          ### Step 2 - Eligibility Verification

          - Reported mortgage / rental tradelines are evaluated for the trailing 12 months.


          ### Step 3 - Validation and Verification

          - Unreported mortgages on the primary, secondary and subject properties are documented (VOM
          / statements).


          ### Step 4 - Final Determination

          - Rating (e.g., 0x30x12, 1x30x12, 0x60x12) is recorded for pricing and CRD-MTGHIST-TIER.


          ## Deterministic Validation Rules

          - Every mortgage / rental obligation on the primary residence(s), second residence(s) and subject
          has 12 months of history in the file (reported or documented): TRUE = complete, FALSE = conditional.

          - Rating computed from Liability.late_30/60/90/120_days_count over the trailing 12 months: recorded.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Twelve-month history is complete for all in-scope properties and the rating is recorded.


          ### Conditional

          Assign **Conditional** when:

          - History on an unreported mortgage / rental is pending.


          ### Fail

          There is no case for this outcome.


          ### Not Applicable

