    domain_extensions:
      jtbd:
        sequence: 3
        section_type: Insurance
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: CLTV (Rent Loss Exemption)
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: RLI_CLTV_EXEMPT_LM1
          indicator_context: Read LoanCore.cltv_percent and ltv_percent. Indicator is 'Pass' (exempt)
            when cltv_percent <= 70; 'Conditional' when ltv_percent <= 70 < cltv_percent (Q-11); 'Not
            Applicable' when ltv_percent > 70. Do not populate borrower_ids for this unified metric under
            any circumstance.
          description_template: CLTV {cltv_percent}% / LTV {ltv_percent}% (exempt at CLTV <= 70%)
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, LTV/CLTV, amortization, IO term, ARM
            terms, prepayment, escrow flag, dates'
        reference_documents: '### Loan Records

          - LOS transmittal (1008): LTV and CLTV'
        source_text: '# Rent Loss Insurance CLTV Exemption - Base Version


          ## Purpose

          This JTBD applies §23.40: ''Loans with <= 70% CLTV are not required to carry rent loss insurance.''
          The requirement is stated in LTV and the exemption in CLTV; whether coverage is required when
          LTV is at or below 70% but CLTV exceeds 70% is open (Acra confirmation requested → Q-11).


          ## Reference Documents

          ### Loan Records

          - LOS transmittal (1008): LTV and CLTV


          ## Steps


          ### Step 1 - Initial Document Review

          - LTV and CLTV are extracted.


          ### Step 2 - Eligibility Verification

          - CLTV <= 70% → exempt.


          ### Step 3 - Validation and Verification

          - LTV <= 70% with CLTV > 70% → flagged (Q-11).


          ### Step 4 - Final Determination

          - Exempt passes as not required; mismatch case conditioned.


          ## Deterministic Validation Rules

          - LoanCore.cltv_percent <= 70: TRUE = exempt (pass).

          - LoanCore.ltv_percent <= 70 and cltv_percent > 70: conditional (Q-11).

          - LoanCore.ltv_percent > 70: not applicable (RLI-LTV-TRIGGER governs).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - CLTV is 70% or less; rent loss insurance is not required.


          ### Conditional

          Assign **Conditional** when:

          - LTV is at or below 70% but CLTV exceeds 70%; requirement depends on Q-11.


          ### Fail

          There is no case for this outcome.


          ### Not Applicable

          Assign **Not Applicable** when:

          - LTV exceeds 70% (coverage required under RLI-LTV-TRIGGER).'
        source_digest: 7ada6fd68b2be1193d2f125d0df4feb4081aaf1889254143da3380d3063efd59
        section: Insurance Coverage Sufficiency & Policy Assessment
        mnemonic: RLI-CLTV-EXEMPT
        also_as:
          platinum_select: RLI-CLTV-EXEMPT
