  - rule_id: PPT-IO-PMTCALC.standard
    condition:
      kind: procedure
      purpose: 'This JTBD confirms the §7.5 mechanics: Interest Only payments are the amount sufficient
        to pay the accrued interest on the mortgage monthly at the time of origination, for a set term
        at the beginning of repayment; after that term payments recast to a fully amortized payment for
        the balance of the term ending at maturity. Which payment enters the DSCR denominator is DSCR-IO-DENOM
        (Q-26); the DTI calculation for IO loans is a DTI-program provision (Q-14).'
