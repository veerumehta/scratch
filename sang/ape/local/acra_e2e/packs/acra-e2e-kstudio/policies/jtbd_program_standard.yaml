          metric_key: RatioSet.reserves_months
          metric_mnemonic: RLI_RESERVE_SUB_LM1
          indicator_context: When rent loss coverage is required but only {coverage_months} of 6 months
            could be obtained, compare RatioSet.reserves_months with 2 × (6 − coverage_months). Indicator
            is 'Pass' when reserves meet the substitute requirement; 'Fail' otherwise; 'Not Applicable'
