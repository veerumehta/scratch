        source_text: '# LTV Above 80% Overlay - Base Version


          ## Purpose

          This JTBD applies the Income Documentation panel: LTV > 80.00% requires a minimum DSCR of 1.20
          and 6 months PITIA reserves, and is limited to SFR, Warrantable Condos outside of Florida, Townhome
          and PUD. The rule is stated in LTV where the matrix is labelled CLTV (Acra confirmation requested
          → Q-17). Only the <= $1,500,000 tier prints 85% purchase caps that can exceed 80%.


          ## Reference Documents

          ### Loan and Property Records

          - LOS transmittal (1008): LTV, CLTV, DSCR, reserves

          - Appraisal Report: property type, condo project and state

          - Bank statements / VOD: six months PITIA reserves


          ## Steps


          ### Step 1 - Initial Document Review

          - LTV is compared with 80.00%.


          ### Step 2 - Eligibility Verification

          - Above 80%: property is SFR, Warrantable Condo outside Florida, Townhome or PUD.


          ### Step 3 - Validation and Verification

          - DSCR >= 1.20 and reserves >= 6 months PITIA are verified.


          ### Step 4 - Final Determination

          - All conditions met passes; otherwise fails; CLTV-above-80-with-LTV-below cases conditioned
          on Q-17.


          ## Deterministic Validation Rules

          - LoanCore.ltv_percent > 80: TRUE = continue, FALSE = not applicable (conditional Q-17 where
          cltv_percent > 80 but ltv_percent <= 80).

          - SubjectProperty.property_type in {SingleFamily, Townhouse, PUD} or a warrantable Condominium
          not in Florida: TRUE = pass, FALSE = fail.

          - DSCR >= 1.20: TRUE = pass, FALSE = fail.

          - RatioSet.reserves_months >= 6 (PITIA basis): TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - LTV exceeds 80% on an eligible property type with DSCR >= 1.20 and six months PITIA reserves.


          ### Conditional

          Assign **Conditional** when:

          - CLTV exceeds 80% while LTV does not; application of the overlay awaits Q-17.


          ### Fail

          Assign **Fail** when:

          - LTV exceeds 80% on an ineligible property type, or DSCR < 1.20, or reserves < 6 months.


          ### Not Applicable

          Assign **Not Applicable** when:

          - LTV is 80% or less.'
