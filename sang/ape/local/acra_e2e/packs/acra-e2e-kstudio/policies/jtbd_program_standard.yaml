        source_text: '# Actual Rent Above Market — Documentation - Base Version


          ## Purpose

          This JTBD applies the §5.32 note: where actual rents exceed market rents, evidence of actual
          rents must be documented via two consecutive months'' proof of rental income receipt and lease
          agreement(s) continuing at least three months after closing; security deposit does not count
          towards receipt and rents cannot be prepaid. Whether this documentation is sufficient or further
          approval is required is part of Q-01. Short-term rental ledgers are handled in DSCR-STR-LEDGER.


          ## Reference Documents

          ### Rent Documentation

          - Lease Agreement(s): monthly rent, start and expiration dates

          - Rent receipts / cancelled checks / bank statements: two consecutive months of receipt

          - Closing Disclosure: scheduled closing date for the three-month test


          ## Steps


          ### Step 1 - Initial Document Review

          - Lease(s) and two consecutive months of receipt evidence are in the file.


          ### Step 2 - Eligibility Verification

          - Receipt amounts match the lease rent and are not a security deposit or prepaid lump sum.


          ### Step 3 - Validation and Verification

          - Lease expiration is at least three months after the scheduled closing date.


          ### Step 4 - Final Determination

          - Both conditions met → actual rent may be used subject to Q-01; otherwise qualifying rent falls
          back to the lesser-of rule.


          ## Deterministic Validation Rules

          - Two consecutive months of receipts matching the lease rent are documented: TRUE = pass, FALSE
          = fail.

          - Receipts are not solely a security deposit or prepaid rent: TRUE = pass, FALSE = fail.

          - Lease expiration >= LoanCore.expected_closing_date + 3 months: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Two consecutive months of receipts and a lease running at least three months past closing
          are documented, excluding deposits and prepaid rent.


          ### Conditional

          Assign **Conditional** when:

          - One of the two conditions is documented and the other is pending evidence.


          ### Fail

          Assign **Fail** when:

          - Receipts or lease continuance are missing, or the receipt evidence is only a security deposit
          / prepaid rent.


          ### Not Applicable

          Assign **Not Applicable** when:

          - Actual rent does not exceed market rent, or the file is No Ratio.'
        source_digest: f1b09591022a07b621b083f1fceed46e59ec256f0f2241aa352d2ca22bee2a4d
        section: Income Stability & Sufficiency Analysis
