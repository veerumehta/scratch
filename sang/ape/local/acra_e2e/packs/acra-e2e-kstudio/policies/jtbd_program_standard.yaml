    action: require_evidence
    priority: 17
    description: Determines the DSCR denominator on an interest-only loan by applying Acra's rule that
      the DSCR uses the first payment due under the Note — the interest-only payment plus taxes, insurance,
      association fees and any subordinate payment — while computing the fully amortized alternative pending
      Acra's confirmation.
