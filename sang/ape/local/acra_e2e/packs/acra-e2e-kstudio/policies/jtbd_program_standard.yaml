        ### Step 1 - Initial Document Review

        - Subject state is read from the appraisal / title.


        ### Step 2 - Eligibility Verification

        - State is compared with SD.


        ### Step 3 - Validation and Verification

        - AK / ND subjects are flagged for the version question (Q-23).


        ### Step 4 - Final Determination

        - Not SD passes; SD fails; AK / ND conditioned.'
      checks:
      - 'Subject state = SD: TRUE = fail.'
      - 'Subject state in {AK, ND}: TRUE = conditional (Q-23).'
      - 'Otherwise: pass.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 5
    description: Confirms the subject property is not located in South Dakota, the only ineligible state
      under the 8.17.2026 Standard Summary, noting the earlier 6.15.2026 copy also excluded Alaska and
      North Dakota.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 5
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        notes: Subject state is not path-addressable as a metric (SubjectProperty.address is a $ref);
          the state test is document-driven from the appraisal / title.
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, condo / manufactured / mixed-use
            flags, address, taxes / HOA
        reference_documents: '### Property Documents

          - Appraisal Report / title commitment: subject state'
        source_text: '# Ineligible Location (SD) - Base Version


          ## Purpose

          This JTBD applies the Subject Property Location panel: ineligible state SD. The 6.15.2026 V1.1
          Summary listed AK, ND and SD; the published 8.17.2026 version lists SD only (Q-23). A loan on
          an Alaska or North Dakota property therefore depends on which version governs.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report / title commitment: subject state


          ## Steps


          ### Step 1 - Initial Document Review

          - Subject state is read from the appraisal / title.


          ### Step 2 - Eligibility Verification

