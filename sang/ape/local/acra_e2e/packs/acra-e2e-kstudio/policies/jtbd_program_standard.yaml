          indicator_context: Read RatioSet.dti_percent. Indicator is 'Pass' when it is null or is recorded
            for information only and not used in the decision; 'Fail' when the underwriting decision cites
            a DTI threshold for a DSCR-qualified borrower. Do not populate borrower_ids for this unified
            metric under any circumstance.
          description_template: 'DTI: {dti_percent} (not a decisioning factor on DSCR / No Ratio files)'
        entity_types:
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months, DTI (not used
            for DSCR)'
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, LTV/CLTV, amortization, IO term, ARM
            terms, prepayment, escrow flag, dates'
        reference_documents: '### Loan Origination Records

          - Loan Application (1003): income / employment sections may be blank

          - LOS transmittal (1008): ratios recorded'
        source_text: '# No DTI / No Income Documentation for DSCR Applicants - Base Version


          ## Purpose

          This JTBD confirms the file is not underwritten on income. ''Borrowing entity income documentation
          not required''; Acra will not calculate a DTI for applicants who qualify using a DSCR — income
          or employment on the application is superfluous, may be left blank, and if represented a DTI
          should not be calculated. DTI-program alternatives that appear in the excerpt (40% / 43%) are
          DTI-program provisions (Q-14).


          ## Reference Documents

          ### Loan Origination Records

          - Loan Application (1003): income / employment sections may be blank

          - LOS transmittal (1008): ratios recorded


          ## Steps


          ### Step 1 - Initial Document Review

          - 1003 and 1008 are reviewed for income, employment and DTI entries.


          ### Step 2 - Eligibility Verification

          - No DTI is used as a decisioning factor; any income shown is treated as superfluous.


          ### Step 3 - Validation and Verification

          - No income or employment documentation has been conditioned for the entity borrower or DSCR
          applicant.


          ### Step 4 - Final Determination

          - File is confirmed as DSCR-qualified without DTI, or a DTI-based decision is removed and the
          file re-decisioned.


          ## Deterministic Validation Rules

          - No DTI value is used in the approval decision (RatioSet.dti_percent may be null): TRUE = pass,
          FALSE = fail.

          - No income / employment documentation condition is outstanding for the DSCR applicant or entity:
          TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The approval relies on DSCR / No Ratio only; no DTI is decisioned and no income documentation
          is required.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - A DTI was calculated and used to approve or decline, or income documentation was required
          of the DSCR applicant.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 3aaa8bf63459b424adae30cb5e07b4c80c4cdd6d2be6134b49e9a3f63f70f50a
        section: Loan Program Eligibility
