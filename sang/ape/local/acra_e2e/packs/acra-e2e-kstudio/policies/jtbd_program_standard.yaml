        source_text: '# Investment Property Matrix Lookup (Loan Amount / FICO / CLTV) - Base Version


          ## Purpose

          This JTBD performs the Investment Property matrix lookup. Three tiers are printed. Loan amount
          <= $1,500,000: 780+/760/740/720 → 85 / 80 / 80; 700 → 80 / 80 / 75; 680 and 660 → 80 / 75 /
          75; 640 → 75 / 70 / 70; 620 → 65 / 65 / 65; 600 → 60 / 60 / 60 (Purchase / Rate & Term / Cash-Out).
          Loan amount $1,500,001-$2,000,000: 720+ → 75 / 75 / 75; 700 and 680 → 75 / 70 / 70; 660 → 75
          / 70 / 65; 640 → 75 / 65 / 65; 620 → 65 / NA / NA; below 620 → NA. Loan amount $2,000,001-$3,000,000:
          700+ → 70 / 70 / 65; below 700 → NA. Each row is a minimum-FICO threshold: a score at or above
          the threshold and below the next higher threshold takes that row. ''NA'' is Acra''s entry meaning
          no value is offered.


          ## Reference Documents

          ### Credit Documentation

          - Credit Report: decisioning FICO score (CRD-DECSCORE)

          ### Loan Origination Records

          - LOS transmittal (1008): loan amount, purpose and proposed CLTV


          ## Steps


          ### Step 1 - Initial Document Review

          - Decisioning score, loan amount and purpose column are extracted.


          ### Step 2 - Eligibility Verification

          - Loan-amount tier is selected (<= $1.5M; $1,500,001-$2M; $2,000,001-$3M) and the FICO row within
          it.


          ### Step 3 - Validation and Verification

          - Matrix cell for the purpose column is read; an ''NA'' cell means the loan has no published
          matrix value; a score below the lowest printed row is routed to LFC-FICO-FLOOR.


          ### Step 4 - Final Determination

          - Matrix cap is recorded for LFC-CLTV-FINAL and the proposed CLTV compared: pass at or below
          the cap; fail above it or where the cell is NA.


          ## Deterministic Validation Rules

          - Loan-amount tier selected from LoanCore.total_loan_amount_usd: <= 1,500,000 → Tier 1; 1,500,001-2,000,000
          → Tier 2; 2,000,001-3,000,000 → Tier 3.

          - FICO row = highest printed threshold <= CreditReport.representative_score within the tier;
          no row (score below lowest threshold) → route to LFC-FICO-FLOOR.

          - Matrix cell for LoanCore.loan_purpose is a percentage (not NA): TRUE = continue, FALSE = fail.

          - LoanCore.cltv_percent <= matrix cell value: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A matrix value exists for the tier / FICO row / purpose and the proposed CLTV is at or below
          it.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The matrix cell is NA, or the proposed CLTV exceeds the matrix value.


          ### Not Applicable

          There is no case for this outcome.'
