          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Form 1007 Single-Family Comparable Rent Schedule: market rent for 1-unit subjects

          - Form 1025 Small Residential Income Property Appraisal: market rent for 2-4 unit subjects

          - Appraiser licence: state licence of the appraiser completing the schedule'
        source_text: '# Rent Schedule Form Requirement (1007 / 1025) - Base Version


          ## Purpose

          This JTBD confirms the rent schedule required on all DSCR transactions: ''A 1007 will always
          be required on DSCR transactions – for avoidance of doubt, even on No Ratio DSCR''. The excerpt
          also refers to ''the 1007 or 1025 Appraisal report, as applicable''; whether a Form 1025 alone
          satisfies the requirement for a 2-4 unit property is open (Acra confirmation requested → Q-08).
          A 1007 may be from the original appraiser or any state-licensed appraiser.


          ## Reference Documents

          ### Property Documents

          - Form 1007 Single-Family Comparable Rent Schedule: market rent for 1-unit subjects

          - Form 1025 Small Residential Income Property Appraisal: market rent for 2-4 unit subjects

          - Appraiser licence: state licence of the appraiser completing the schedule


          ## Steps


          ### Step 1 - Initial Document Review

          - File is checked for a Form 1007 (1-unit) or Form 1025 (2-4 unit) rent schedule.


          ### Step 2 - Eligibility Verification

          - Schedule is signed by a state-licensed appraiser (original appraiser or another licensed appraiser).


          ### Step 3 - Validation and Verification

          - For a 2-4 unit subject relying on a 1025 without a 1007, the Q-08 dependency is flagged.


          ### Step 4 - Final Determination

          - Rent schedule requirement is satisfied and the file proceeds; missing schedule conditions
          the file; 1025-only 2-4 unit files proceed subject to Acra.


          ## Deterministic Validation Rules

          - A Form 1007 (1 unit) or Form 1025 (2-4 units) is in the file: TRUE = continue, FALSE = fail.

          - Schedule is completed by a state-licensed appraiser: TRUE = pass, FALSE = fail.

          - Subject is 2-4 units and only a 1025 is on file: TRUE = conditional (Q-08).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A 1007 (or 1007 with 1025) from a state-licensed appraiser is on file, including on No Ratio
          files.


          ### Conditional

          Assign **Conditional** when:

          - The subject is 2-4 units and the file relies on a Form 1025 alone; proceeds subject to Acra''s
          Q-08 response.


          ### Fail

          Assign **Fail** when:

          - No rent schedule is on file, or the schedule is not from a state-licensed appraiser.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 654747f1cc306c7bc8cbb670d22900594f5ff1ae7b707ded460778fa814c3f1a
