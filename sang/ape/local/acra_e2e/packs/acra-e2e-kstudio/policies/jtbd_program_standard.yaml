        source_text: '# Governing Source Version Control - Base Version


          ## Purpose

          This JTBD confirms every requirement applied to the file was taken from the controlling sources.
          The consolidation follows the DSCR Program Summary published 8.17.2026 (listed as ''Business
          Purpose DSCR'' under Wholesale Loans), which supersedes the 6.15.2026 V1.1 copy first supplied,
          and the Seller''s Guide excerpt of August 28, 2026; program matrices control where cited and
          the full Seller''s Guide controls over the excerpt. Four differences exist between the Summary
          versions: delayed financing (no cap → capped at $1.5MM); ineligible states (AK, ND, SD → SD);
          Alaska prepayment (no row → BUY-OUT all Residential 1-4); Mississippi prepayment (single-unit
          options 5 Yr step / 3x3 / 2x3 / 1x3 → BUY-OUT or 5 year step for 1 unit, no restrictions on
          2+ units). Which version governs is open (Acra confirmation requested → Q-23); unsupplied Seller''s
          Guide sections are Q-25.


          ## Reference Documents

          ### Acra Program Sources

          - DSCR Program Summary: version date

          - Seller''s Guide excerpt: version date

          - Acra confirmation-register responses (Q-01 to Q-27): if received

          ### Loan Records

          - Lock confirmation / LOS: application and lock dates

          - Underwriting approval: source version cited


          ## Steps


          ### Step 1 - Initial Document Review

          - Source versions cited on the approval are identified with the loan''s application / lock dates.


          ### Step 2 - Eligibility Verification

          - Summary version is 8.17.2026 or a later Acra-published version; excerpt is August 28, 2026
          or later.


          ### Step 3 - Validation and Verification

          - The four version differences (delayed financing cap, AK / ND eligibility, AK and MS prepayment)
          are applied per the governing version; any received Acra responses are applied.


          ### Step 4 - Final Determination

          - File confirmed to governing versions with responses applied; otherwise conditioned for re-underwriting.


          ## Deterministic Validation Rules

          - Program Summary version applied is 8.17.2026 or a later Acra-confirmed governing version:
          TRUE = pass, FALSE = fail.

          - Seller''s Guide excerpt version is August 28, 2026 or later: TRUE = pass, FALSE = fail.

          - Version-sensitive items (delayed financing, AK / ND, AK and MS prepayment) applied per the
          governing version: TRUE = pass, FALSE = fail.

          - Every received Acra confirmation-register response has been applied: TRUE = pass, FALSE =
          conditional.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The file is underwritten to the governing versions with Acra responses applied.


          ### Conditional

          Assign **Conditional** when:

          - The file relies on a requirement marked ''Acra confirmation requested'' whose response is
          outstanding, or which version governs (Q-23) is unconfirmed on a version-sensitive item.


          ### Fail

          Assign **Fail** when:

          - The file was underwritten to the superseded 6.15.2026 Summary on a version-sensitive item,
          or contradicts a received Acra response.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 2e3aa7e0e8d0160126f6d06006c89fc211fc376f18e5dad05bdd54966fe60404
        section: Compliance and Closing
        mnemonic: CMP-SRC-VERSION
        also_as:
          platinum_select: CMP-SRC-VERSION
