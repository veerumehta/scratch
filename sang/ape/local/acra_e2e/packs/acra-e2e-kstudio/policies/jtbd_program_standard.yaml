        source_text: '# Consolidated Minimum DSCR Determination - Base Version


          ## Purpose

          This JTBD produces one governing minimum ratio from the situation-specific minimums collected
          at §3.18: LTV above 80.00% → 1.20; loan amount over $2,000,000 → 1.0; 1 or no score / deficient
          tradelines → 1.1; rural / unique property → 1.00; non-warrantable condo, condotel / PUDtel →
