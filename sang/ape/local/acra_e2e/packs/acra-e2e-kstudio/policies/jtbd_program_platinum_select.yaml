          ineligibility rule to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - LOS Borrower.is_first_time_homebuyer = FALSE for every borrower on the loan: TRUE = pass,
          FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

