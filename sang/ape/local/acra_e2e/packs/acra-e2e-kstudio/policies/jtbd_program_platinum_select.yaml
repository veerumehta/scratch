        source_text: '# Entity Good Standing and Foreign Qualification - Base Version


          ## Purpose

          This JTBD confirms that the entity borrower''s good-standing status is current within the required
          window and that foreign qualification is documented where the entity operates outside its state
          of formation.


          ## Reference Documents

          ### Entity Status Documents

          - Certificate of Good Standing (or equivalent): entity''s active status as of a date near closing

          - Certificate of Foreign Qualification (or equivalent): entity''s authorization to operate in
          a state other than its state of formation

          - Certificate of Formation / Articles of Organization: entity''s state of formation

          - Loan Application (1003): state where business is conducted and property location


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for a Certificate of Good Standing or equivalent document for the entity
          borrower.

          - Entity''s state of formation is compared to the state where business is conducted and the
          subject property''s state.


          ### Step 2 - Eligibility Verification

          - Certificate of Good Standing date is within ninety (90) days of the closing date.


          ### Step 3 - Validation and Verification

          - Where the entity is formed in a state other than the state where business is conducted or
          the property is located, a Certificate of Foreign Qualification or other qualification document
          for that state is present in the file.


          ### Step 4 - Final Determination

          - Good standing and, where applicable, foreign qualification requirements are satisfied and
          the file proceeds, or a gap is identified and the file is conditioned.


          ## Deterministic Validation Rules

          - Certificate of Good Standing (or equivalent) is present and dated within 90 days of the closing
          date: TRUE = pass, FALSE = fail.

          - Where the entity''s state of formation differs from the state of business or property location,
          a Certificate of Foreign Qualification for that state is present in the file: TRUE = pass, FALSE
          = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A Certificate of Good Standing dated within 90 days of closing is on file, and a Certificate
          of Foreign Qualification is on file whenever the entity operates outside its state of formation.


          ### Conditional

          Assign **Conditional** when:

          - A Certificate of Good Standing is on file but is dated more than 90 days from closing; the
          file may proceed with a condition to obtain an updated certificate prior to closing.


          ### Fail

          Assign **Fail** when:

          - No Certificate of Good Standing is present, or the entity operates outside its state of formation
          and no Certificate of Foreign Qualification is present.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is being made to an individual borrower rather than an entity borrower.'
        source_digest: 3a2acaa3dbd86add383ea0edf47e1a43aeb35fd5dcd69dc21dd038c805292c2d
        section: Compliance and Closing
        mnemonic: BET-GOODSTAND
