        source_text: '# Single-Family Rent Schedule (Form 1007) Requirement - Base Version


          ## Purpose

          This JTBD confirms that a Single-Family Comparable Rent Schedule (Form 1007), prepared by the
          original appraiser or any state-licensed appraiser, is on file wherever it is required for a
          single-family Platinum Select DSCR transaction.


          ## Reference Documents

          ### Appraisal Documentation

          - Single-Family Comparable Rent Schedule (Form 1007): provides the market rent used to qualify
          the loan.

          - Appraiser license record: confirms the preparer holds a valid state appraiser license.


          ## Steps


          ### Step 1 - Initial Document Review

          - AppraisalSummary record shows a form_type value for the rent schedule document on file.


          ### Step 2 - Eligibility Verification

          - Subject property is single-family, and the transaction is a DSCR-qualifying file, a lease-option
          purchase funded from excess monthly rent contributions, or a file where proposed rental income
          is used to qualify, each of which triggers the Form 1007 requirement.


          ### Step 3 - Validation and Verification

          - AppraisalSummary.form_type reflects the Single-Family Comparable Rent Schedule (Form 1007).

          - AppraisalSummary.appraiser_license_number and appraiser_license_state are populated, confirming
          the preparer is a state-licensed appraiser.


          ### Step 4 - Final Determination

          - Presence of a properly completed Form 1007 from a licensed appraiser is compared against the
          triggering condition to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - Subject property is single-family AND (file is DSCR-qualifying OR is a lease-option purchase
          funded from excess rent contributions OR proposed rental income is used to qualify): TRUE =
          Form 1007 is required, FALSE = not required.

          - Where required: AppraisalSummary.form_type = Form 1007 AND appraiser_license_number is populated:
          TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The Form 1007 requirement is triggered and a Form 1007 completed by a state-licensed appraiser
          is on file.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The Form 1007 requirement is triggered and no Form 1007 is on file, or the appraiser license
          fields are missing.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The subject property is not single-family, or none of the triggering conditions (DSCR-qualifying
          file, lease-option purchase funded from excess rent, or proposed rental income used to qualify)
          is present.'
        source_digest: 6868214346b5f4c081ca96fa386c71ab56dfa7ff3400dc3fc844711f7aba90f9
