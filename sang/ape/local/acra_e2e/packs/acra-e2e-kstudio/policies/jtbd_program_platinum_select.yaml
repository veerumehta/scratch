        ### Step 4 - Final Determination

        - Applicable reserve requirement is satisfied only when documented reserves or eligible cash-in-hand
        funds meet or exceed the months required by the specific trigger identified for the transaction.'
      checks:
      - 'Property Listing History shows the subject property listed for sale within the last six months
        and documented reserves are at least 24 months: TRUE = pass, FALSE = fail.'
      - 'Credit Report shows forbearance or mortgage lates within the last 12 months without timely receipt
