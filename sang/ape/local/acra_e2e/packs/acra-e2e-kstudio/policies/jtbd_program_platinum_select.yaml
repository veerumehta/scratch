        source_text: '# Title-Holding Party Eligibility - Base Version


          ## Purpose

          Validate that the proposed manner of holding title to the subject property matches an option
          Acra permits — direct individual ownership or an entity Acra has accepted.


          ## Reference Documents

          ### Title and Entity Documents

          - Title Commitment: states the proposed vesting for the subject property

          - Certificate of Formation / Articles of Organization: identifies the entity type proposed to
          hold title, when applicable

          - Underwriting Decision: records Acra''s acceptance of the entity as a permitted title holder


          ## Steps


          ### Step 1 - Initial Document Review

          - Title Commitment states the proposed vesting for the subject property.


          ### Step 2 - Eligibility Verification

          - Proposed vesting is either one or more natural persons directly, or an entity type submitted
          for Acra''s review.


          ### Step 3 - Validation and Verification

          - When vesting is proposed in an entity, the entity''s formation documents match the entity
          type and name shown on the Title Commitment.

          - Underwriting Decision documents Acra''s acceptance of the named entity as a title holder.


          ### Step 4 - Final Determination

          - Title vesting is approved when it is direct individual ownership or an entity accepted by
          Acra; vesting in an entity not reviewed or not accepted is not approved.


          ## Deterministic Validation Rules

          - Title Commitment vesting names one or more natural persons directly: TRUE = vesting permitted
          on this basis, FALSE = evaluate entity vesting condition.

          - Title Commitment vesting names an entity that the Underwriting Decision records as accepted
          by Acra: TRUE = vesting permitted, FALSE = vesting not permitted.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Title Commitment vesting is direct individual ownership or an entity accepted by Acra per
          the Underwriting Decision record.


          ### Conditional

          Assign **Conditional** when:

          - Title Commitment vesting names an entity whose acceptance by Acra is still pending the underwriting
          decision.


          ### Fail

          Assign **Fail** when:

          - Title Commitment vesting names an entity that Acra has reviewed and not accepted.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 62b0bfd767a1cc7f8860dedd23ccdb759b7c5691fca60a1c8cafcdb635f2a7c3
