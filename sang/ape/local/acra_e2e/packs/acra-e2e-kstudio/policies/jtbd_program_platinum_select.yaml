  - rule_id: AFC-UNACCEPT-SRC.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD confirms that the funds used to close and the reserves counted toward any trigger
        do not derive from a source Acra's Seller's Guide designates as unacceptable. The Platinum Summary's
        Reserve Requirements panel refers to "guidelines for unacceptable source of funds"; the governing
        Seller's Guide provision is not reproduced in the consolidation (Appendix B.3), so this JTBD applies
        the Seller's Guide list and conditions any question of interpretation for Acra (Acra confirmation
        requested → Q-20).
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Every account or asset relied on for funds to close or reserves is identified on the asset documentation
        and tied to the Closing Disclosure.


        ### Step 2 - Eligibility Verification

        - Each relied-on asset is classified by source; any source appearing on the Seller''s Guide unacceptable
        list (for example unsecured borrowed funds, cash on hand, undocumented large deposits, or contributions
        from an interested party outside a permitted gift) is flagged.


        ### Step 3 - Validation and Verification

        - Large or irregular deposits within the documentation period are sourced with supporting evidence,
        and gift funds are reconciled with the borrower''s own 10% contribution.


        ### Step 4 - Final Determination

        - Funds to close and counted reserves are confirmed to derive only from acceptable, documented
        sources, or the unacceptable or unsourced funds are excluded and the file is re-tested for sufficiency.'
      checks:
      - 'Every relied-on asset has a documented source not on the Seller''s Guide unacceptable list: TRUE
        = pass, FALSE = fail.'
      - 'Every large or irregular deposit within the documentation period is sourced: TRUE = pass, FALSE
        = conditional.'
      - 'After excluding unacceptable or unsourced funds, verified funds still cover funds to close plus
        required reserves: TRUE = pass, FALSE = fail.'
      outcomes:
