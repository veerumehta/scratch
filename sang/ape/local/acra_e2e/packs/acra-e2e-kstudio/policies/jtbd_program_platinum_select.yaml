        reference_documents: '### Loan Terms and Listing Documents

          - Note: confirms whether the loan is an interest-only product

          - Listing Agreement / MLS Listing History: documents whether the subject property has been listed
          for sale in the last six months'
        source_text: '# Interest-Only Listed-for-Sale Restriction - Base Version


          ## Purpose

          Validate that interest-only loan products are not used on transactions involving a subject property
          listed for sale within the last six months.


          ## Reference Documents

          ### Loan Terms and Listing Documents

          - Note: confirms whether the loan is an interest-only product

          - Listing Agreement / MLS Listing History: documents whether the subject property has been listed
          for sale in the last six months


          ## Steps


          ### Step 1 - Initial Document Review

          - Listing Agreement or MLS Listing History is reviewed to determine whether the subject property
          has been listed for sale within the last six months, measured to the Application Date.


          ### Step 2 - Eligibility Verification

          - Note is reviewed to confirm whether the loan product is interest-only.


          ### Step 3 - Validation and Verification

          - Listed-for-sale status and interest-only product status are cross-checked against each other.


          ### Step 4 - Final Determination

          - Loan is approved on this point only when it is not both interest-only and secured by a property
          listed for sale within the last six months.


          ## Deterministic Validation Rules

          - Subject property has been listed for sale within six months of the Application Date, per the
          Listing Agreement or MLS Listing History: TRUE = interest-only product is not available for
          this loan, FALSE = the listed-for-sale restriction does not apply.

          - Note states the loan product is interest-only: TRUE = evaluate the loan against the listed-for-sale
          restriction, FALSE = restriction does not apply to this loan.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Loan is fully amortizing, or the subject property has not been listed for sale within six
          months of the Application Date.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Loan is interest-only and the subject property has been listed for sale within six months
          of the Application Date.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 1fc40225c8b5340f2d878d65b90e88d00b3bdcda1b92df4553d39b2917f817c9
