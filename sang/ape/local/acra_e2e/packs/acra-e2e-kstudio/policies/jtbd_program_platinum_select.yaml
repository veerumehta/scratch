        source_text: '# Loan Amount, FICO and CLTV Matrix - Base Version


          ## Purpose

          This JTBD confirms that a delayed-financing transaction stays within Acra''s published $1,500,000
          loan amount cap, the one matrix-footnote condition Acra states specifically for delayed financing.


          ## Reference Documents

          ### Loan Origination System (LOS)

          - LOS loan record: provides the refinance type and the base loan amount for the transaction.


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS loan record identifies the transaction''s refinance type as Delayed Financing.


          ### Step 2 - Eligibility Verification

          - LOS loan record shows a base loan amount to be tested against the delayed-financing cap.


          ### Step 3 - Validation and Verification

          - LOS base loan amount for the delayed-financing transaction does not exceed $1,500,000.


          ### Step 4 - Final Determination

          - LOS base loan amount is compared against the $1,500,000 delayed-financing cap to reach a pass/fail
          determination.


          ## Deterministic Validation Rules

          - LOS refinance type = Delayed Financing AND base loan amount <= $1,500,000: TRUE = pass, FALSE
          = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The transaction is delayed financing and the base loan amount is at or below $1,500,000.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The transaction is delayed financing and the base loan amount exceeds $1,500,000.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The transaction''s refinance type is not Delayed Financing.'
        source_digest: 25a48516f977f09c873790ab36339cbbb628e13dc2dcc5881b4ca05cd521ab28
        section: Loan Program Eligibility
        mnemonic: LFC-DELAY-FIN
        also_as:
          standard: LFC-DELAY-FIN
