        reference_documents: '### Attestation and Application Documents

          - Business Purpose Attestation (Exhibit 8) or Acra-approved equivalent attestation: borrower/guarantor
          certification of business-purpose intent

          - Loan Application (1003): stated loan purpose and borrowing entity/individual details

          - LOS: system of record for attestation receipt and closing document tracking'
        source_text: '# Business Purpose Attestation - Base Version


          ## Purpose

          This JTBD confirms that the loan file contains a properly executed business-purpose attestation
          whenever the borrower is qualifying on the subject property''s cash flow under the Platinum
          Select DSCR program.


          ## Reference Documents

          ### Attestation and Application Documents

          - Business Purpose Attestation (Exhibit 8) or Acra-approved equivalent attestation: borrower/guarantor
          certification of business-purpose intent

          - Loan Application (1003): stated loan purpose and borrowing entity/individual details

          - LOS: system of record for attestation receipt and closing document tracking


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for the presence of an executed Business Purpose Attestation (Exhibit
          8) or an Acra-approved equivalent form.


          ### Step 2 - Eligibility Verification

          - Loan qualification method recorded in LOS shows the borrower qualifying on the subject property''s
          actual or market cash flow (DSCR), triggering the attestation requirement.


          ### Step 3 - Validation and Verification

          - Attestation is signed by every borrower and guarantor identified on the loan.

          - Attestation date is on or before the scheduled closing date.


          ### Step 4 - Final Determination

          - Business-purpose attestation requirement is satisfied and the file proceeds to closing, or
          the requirement is unmet and the file is conditioned for the missing or incomplete attestation.


          ## Deterministic Validation Rules

          - An executed Business Purpose Attestation (Exhibit 8) or Acra-approved equivalent is present
          in the loan file: TRUE = pass, FALSE = fail.

          - The attestation bears the signature of every borrower and guarantor on the loan: TRUE = pass,
          FALSE = fail.

          - The attestation date is on or before the closing date: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The attestation is present, signed by all borrowers and guarantors, and dated on or before
          closing.


          ### Conditional

          Assign **Conditional** when:

          - The attestation form is on file but is missing the signature of one guarantor; the file may
          proceed with a prior-to-closing condition to obtain the missing signature.


          ### Fail

          Assign **Fail** when:

          - No Business Purpose Attestation or Acra-approved equivalent is present in the file at closing.


          ### Not Applicable

          There is no case for this outcome — every Platinum Select DSCR loan qualifying on subject-property
          cash flow requires the attestation.'
        source_digest: 7d51320bb53aab1870202182dd4e236df272a990c2020e1cb8d51fe60dd8c999
