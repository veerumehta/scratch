          - Closing Disclosure: states the scheduled closing date used to test lease continuance'
        source_text: '# Actual Rent Documentation Sufficiency - Base Version


          ## Purpose

          Validate that documentation is sufficient to support use of actual (in-place) rent, rather than
          market rent, when qualifying DSCR income.


          ## Reference Documents

          ### Rent Documentation

          - Lease Agreement: states monthly rent, start date, and expiration date

          - Rent Receipts / Canceled Checks / Bank Statements: evidence of rent receipt for the most recent
          months

          - Closing Disclosure: states the scheduled closing date used to test lease continuance


          ## Steps


          ### Step 1 - Initial Document Review

          - Lease Agreement is present in the file and states a monthly rent amount, start date, and expiration
          date.

          - Rent receipt evidence (bank statement, canceled check, or landlord ledger) is present in the
          file for the two most recent months prior to application.


          ### Step 2 - Eligibility Verification

          - Rent receipt evidence documents at least two months of actual payments as recorded in the
          file.

          - Lease Agreement expiration date is at least three months after the scheduled closing date
          on the Closing Disclosure.


          ### Step 3 - Validation and Verification

          - Rent receipt amounts match the monthly rent amount stated on the Lease Agreement.

          - Rent receipt evidence does not consist solely of a security deposit or a prepaid rent lump
          sum (§5.32: "Security Deposit does not count towards receipt, and the rents cannot be prepaid").

          - The two months of receipts are the two most recent consecutive months where available; whether
          consecutive months are mandatory on Platinum Select, and whether the security-deposit / prepaid-rent
          conditions of §5.32 apply, is open (Acra confirmation requested → Q-03).


          ### Step 4 - Final Determination

          - Actual rent is approved as a qualifying income source only when both the two-month receipt
          evidence and the three-month post-closing lease continuance conditions are documented and internally
          consistent.


          ## Deterministic Validation Rules

          - Lease Agreement expiration date is on or after the scheduled closing date plus 3 months: TRUE
          = lease continuance condition met, FALSE = lease continuance condition not met.

          - Rent receipt evidence documents at least 2 months of payments matching the Lease Agreement
          rent amount: TRUE = receipt condition met, FALSE = receipt condition not met.

          - Rent receipt evidence consists only of a security deposit or a prepaid rent lump sum: TRUE
          = receipt evidence is not acceptable, FALSE = receipt evidence may be acceptable.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Both the two-month rent receipt condition and the three-month post-closing lease continuance
          condition are documented, and receipt amounts match the Lease Agreement rent.


          ### Conditional

          Assign **Conditional** when:

          - One of the two conditions (two-month receipts or three-month post-closing lease term) is documented
          and the other is pending additional evidence.


          ### Fail

          Assign **Fail** when:

          - Neither the receipt evidence nor the lease continuance condition is documented, or the receipt
          evidence relies only on a security deposit or prepaid rent.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan file qualifies DSCR income using only Form 1007/1025 market rent and does not rely
          on actual rent.'
        source_digest: 80493811315226fa6c64e44a9f54a7a80eff8ee03630ff5296cf438b62c5defd
        section: Income Stability & Sufficiency Analysis
        mnemonic: DSCR-ACTRENT-DOC
        also_as:
          standard: DSCR-ACTRENT-DOC
