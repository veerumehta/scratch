        source_text: '# Reserves by CLTV Trigger - Base Version


          ## Purpose

          Verify that the borrower has documented reserves meeting the 6-month requirement triggered when
          CLTV exceeds 75%.


          ## Reference Documents

          ### Asset Documents

          - Bank Statements / Investment Account Statements: source of eligible liquid reserve funds

          - Closing Disclosure: states the transaction''s CLTV


          ## Steps


          ### Step 1 - Initial Document Review

          - Closing Disclosure states the transaction''s CLTV.

          - Bank Statements or Investment Account Statements are present showing eligible liquid reserve
          funds.


          ### Step 2 - Eligibility Verification

          - CLTV is compared to the 75% threshold to determine whether the reserve requirement is triggered.


          ### Step 3 - Validation and Verification

          - Eligible reserve funds documented in Bank Statements or Investment Account Statements are
          divided by the applicable monthly payment to calculate the number of months of reserves on hand.


          ### Step 4 - Final Determination

          - Reserve requirement is satisfied only when CLTV is 75% or below, or when CLTV exceeds 75%
          and at least 6 months of reserves are documented.


          ## Deterministic Validation Rules

          - CLTV exceeds 75% and documented reserves are at least 6 months: TRUE = pass, FALSE = fail.

          - CLTV is 75% or below: TRUE = this reserve trigger does not apply (pass), FALSE = the 6-month
          reserve trigger applies.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - CLTV is 75% or below, or CLTV exceeds 75% and at least 6 months of reserves are documented.


          ### Conditional

          Assign **Conditional** when:

          - CLTV exceeds 75% and reserve documentation is on file but does not yet clearly establish 6
          months of reserves.


          ### Fail

          Assign **Fail** when:

          - CLTV exceeds 75% and documented reserves are less than 6 months.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 692bc9a0b7781657fb91e434bf1efea08a2c2547313fb9c031faf8e9e43a3e89
