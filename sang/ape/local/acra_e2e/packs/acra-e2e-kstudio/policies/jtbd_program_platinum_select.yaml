  - rule_id: BET-NAME-MATCH.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD confirms that names on the entity borrower's documents match the identification
        of the individuals and the entity as it will appear on the Note, Deed of Trust and personal guarantees.
        Acra requires that names on the entity documents match the identification; if they do not match
        exactly, a letter of explanation is required to address the discrepancy. Applies to every entity
        borrower and to any trust vesting title.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Entity name is extracted from each entity document and the individual names are extracted from
        the Operating Agreement / Bylaws, ownership evidence and Consent / Resolution.


        ### Step 2 - Eligibility Verification

        - Entity name is identical (including suffix such as LLC, Inc., LP) across the formation document,
        Good Standing certificate, EIN letter, Consent / Resolution and the loan documents.


        ### Step 3 - Validation and Verification

        - Each individual name on the entity documents is compared with the name on that individual''s
