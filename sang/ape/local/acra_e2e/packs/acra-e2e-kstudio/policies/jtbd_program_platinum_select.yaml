        source_text: '# Entity Authorization and Guarantee Power of Attorney - Base Version


          ## Purpose

          This JTBD confirms that the entity borrower''s transaction authorization is properly documented
          and that any use of a Power of Attorney to execute a personal guarantee is documented separately
          from the entity''s authorization instrument.


          ## Reference Documents

          ### Authorization Documents

          - Unanimous Written Consent / Board Resolution: authorization of the transaction and identification
          of authorized signers for the entity

          - Power of Attorney: designation of an attorney-in-fact to execute a personal guarantee on behalf
          of a guarantor


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for a Unanimous Written Consent or Board Resolution signed by all members,
          regardless of ownership percentage.


          ### Step 2 - Eligibility Verification

          - The Consent/Resolution authorizes the transaction with Acra Lending and identifies who is
          authorized to sign the loan documents on behalf of and to bind the entity.


          ### Step 3 - Validation and Verification

          - Where a guarantor''s personal guarantee is executed by an attorney-in-fact, a Power of Attorney
          designating that attorney-in-fact is present in the file, separate from the entity''s Consent/Resolution.

          - The Consent/Resolution is not used, by itself, to designate a signor on a personal guarantee.


          ### Step 4 - Final Determination

          - Authorization and, where applicable, Power of Attorney requirements are satisfied and the
          file proceeds, or a gap is identified and the file is conditioned.


          ## Deterministic Validation Rules

          - A Unanimous Written Consent or Board Resolution, signed by all members, authorizing the transaction
          and identifying authorized signers is present in the file: TRUE = pass, FALSE = fail.

          - Where a personal guarantee is executed by an attorney-in-fact, a Power of Attorney designating
          that attorney-in-fact is present and is a document separate from the Consent/Resolution: TRUE
          = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A properly signed Consent/Resolution authorizing the transaction and identifying signers is
          on file, and any guarantee signed by an attorney-in-fact is supported by a separate Power of
          Attorney.


          ### Conditional

          Assign **Conditional** when:

          - The Consent/Resolution is on file but is missing one member''s signature; the file may proceed
          with a condition to obtain the missing signature prior to closing.


          ### Fail

          Assign **Fail** when:

          - No Consent/Resolution is present, or a personal guarantee is executed by an attorney-in-fact
          without a supporting Power of Attorney, or the Consent/Resolution is used to designate a guarantee
          signor.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is being made to an individual borrower rather than an entity borrower, and no guarantee
          is executed by an attorney-in-fact.'
        source_digest: d2cc54535aaf42c5071ab5130668af36048e517f39020b37d2e56c93abbee1de
