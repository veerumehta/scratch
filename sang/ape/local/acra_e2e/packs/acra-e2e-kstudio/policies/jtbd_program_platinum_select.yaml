        reference_documents: '### Rent Documentation

          - Form 1007 (Single-Family Comparable Rent Schedule): source of market rent for single-family
          properties

          - Form 1025 (Small Residential Income Property Appraisal): source of market rent for two-unit
          properties

          - Lease Agreement: source of actual in-place rent amount and lease term

          - Rent Receipts / Bank Statements: evidence of actual rent receipt'
        source_text: '# Qualifying Rent Determination - Base Version


          ## Purpose

          Determine the qualifying gross rental income used in the DSCR numerator by selecting between
          market rent and documented actual rent for the subject property.


          ## Reference Documents

          ### Rent Documentation

          - Form 1007 (Single-Family Comparable Rent Schedule): source of market rent for single-family
          properties

          - Form 1025 (Small Residential Income Property Appraisal): source of market rent for two-unit
          properties

          - Lease Agreement: source of actual in-place rent amount and lease term

          - Rent Receipts / Bank Statements: evidence of actual rent receipt


          ## Steps


          ### Step 1 - Initial Document Review

          - Form 1007 or Form 1025 is present in the file and states a market rent value for the subject
          property.

          - Lease Agreement, when actual rent is being used, states the monthly rent amount and lease
          start and expiration dates.

          - Evidence of rent receipt (bank statement or canceled checks) covering the months claimed as
          actual rent is present in the file.


          ### Step 2 - Eligibility Verification

          - Subject property rental use documented in the file is long-term rather than short-term or
          nightly rental.

          - Lease Agreement expiration date extends at least 3 months beyond the scheduled loan closing
          date.

          - Rent receipt evidence documents at least 2 months of actual rent payments.


          ### Step 3 - Validation and Verification

          - Market rent value from Form 1007/1025 is compared against the documented actual rent amount
          from the Lease Agreement.

          - The higher of the two values is identified as the candidate qualifying rent figure.

          - Actual rent is used only when the 2-month receipt evidence and the 3-month post-closing lease
          continuance conditions are both independently satisfied.


          ### Step 4 - Final Determination

          - Qualifying gross rental income is set to the greater of market rent (Form 1007/1025) or documented
          actual rent, subject to the actual-rent documentation conditions being fully met.


          ## Deterministic Validation Rules

          - Form 1007 or Form 1025 is present with a stated market rent value: TRUE = market rent figure
          available for the greater-of comparison, FALSE = only actual rent may be considered if fully
          documented.

          - Lease Agreement expiration date is at least 3 months after the scheduled closing date: TRUE
          = actual rent may be considered, FALSE = actual rent is not eligible for use.

          - Rent receipt evidence documents at least 2 months of actual payments: TRUE = actual rent may
          be considered, FALSE = actual rent is not eligible for use.

          - Subject property rental use documented in the file is long-term: TRUE = rent income qualifies
          under this rule, FALSE = income is not eligible for DSCR qualification under this rule.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A market rent value is present on Form 1007/1025 and the greater of market rent or a fully-documented
          actual rent (2 months of receipts, lease extending 3+ months past closing) is used as the qualifying
          rent.


          ### Conditional

          Assign **Conditional** when:

          - Actual rent is higher than market rent but only one of the two actual-rent documentation conditions
          (2-month receipts or 3-month post-closing lease term) is currently on file, pending the missing
          evidence.


          ### Fail

          Assign **Fail** when:

          - No Form 1007/1025 market rent value and no fully-documented actual rent are present in the
          file.

          - The subject property''s rental income is short-term or nightly rental income presented as
          the qualifying rent source.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: d629eb1aeee863acd00b2549a4a91b92b85517c1a31bfe14274a1e9108446af4
