    replaces: []
    domain_extensions:
      jtbd:
        sequence: 4
        section_type: Credit
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Housing History Documentation Scope
          metric_key: RealEstateOwned.property_use
          metric_mnemonic: CRD_HISTSCOPE_LM1
          indicator_context: Use RealEstateOwned.property_use to identify whether a property is the subject
            property, principal residence, or second home, which determines whether payment history documentation
            is required under the DSCR housing-history scoping rule. Indicator is 'Pass' when required
            documentation is present for each in-scope property; 'Fail' when missing. Do not populate
            borrower_ids for this unified metric under any circumstance.
          description_template: 'Property use: {property_use} (documentation required: {documentation_required})'
        entity_types:
        - name: Liability
          entity_description: Mortgage and rental obligations with payment history and subject-lien flags
        - name: RealEstateOwned
          entity_description: Schedule of REO incl. subject rental income and property use
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
            dates
        reference_documents: '### Real Estate Owned Records

          - Schedule of Real Estate Owned / RealEstateOwned records: identify each property''s use (subject
          property, principal residence, second home, or other investment property).

          ### Credit Documentation

          - Credit Report: identifies whether a major credit event (such as a foreclosure) is reported
          against any owned property.

          ### Payment History Documentation

          - Mortgage statement or Verification of Mortgage (VOM): evidences payment history for in-scope
          properties not reported on the Credit Report.'
        source_text: '# DSCR Housing-History Documentation Scope - Base Version


          ## Purpose

          This JTBD confirms that housing-history documentation for a DSCR loan file is limited to the
          subject property, the borrower''s principal residence, and any second home, and that other owned
          properties are excluded from the scope unless a major credit event is reported against them.


          ## Reference Documents

          ### Real Estate Owned Records

          - Schedule of Real Estate Owned / RealEstateOwned records: identify each property''s use (subject
          property, principal residence, second home, or other investment property).

          ### Credit Documentation

          - Credit Report: identifies whether a major credit event (such as a foreclosure) is reported
          against any owned property.

          ### Payment History Documentation

          - Mortgage statement or Verification of Mortgage (VOM): evidences payment history for in-scope
          properties not reported on the Credit Report.


          ## Steps


          ### Step 1 - Initial Document Review

          - RealEstateOwned records identify which property is the subject property, which is the borrower''s
          principal residence, and which (if any) is a second home.


          ### Step 2 - Eligibility Verification

          - Housing-history documentation scope is limited to the subject property, principal residence,
          and second home(s); other owned properties are excluded from the scope unless the Credit Report
          reports a major credit event tied to one of them.


          ### Step 3 - Validation and Verification

          - Payment history documentation (Credit Report tradeline or mortgage statement / VOM) is present
          for the subject property, principal residence, and each second home.


          ### Step 4 - Final Determination

          - Presence of required payment-history documentation for in-scope properties, and treatment
          of any major-credit-event flag on an out-of-scope property, are used together to reach a pass/fail
          determination.


          ## Deterministic Validation Rules

          - RealEstateOwned.property_use identifies a record as subject property, principal residence,
          or second home: TRUE = payment history documentation is required for that property.

          - Credit Report reports a foreclosure or other major credit event tied to an out-of-scope owned
          property: TRUE = housing-history documentation is also required for that property, FALSE = not
          required.

          - Required payment history documentation is present for each in-scope property: TRUE = pass,
          FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Payment history documentation is present for the subject property, principal residence, and
          second home(s), and no unaddressed major-credit-event flag exists on an out-of-scope property.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Payment history documentation is missing for the subject property, principal residence, or
          a second home, or a major-credit-event flag on an out-of-scope property is left undocumented.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 616b73a06b5a256827f722b27e7c031ec4297c6ff46b2edcbac147a288fafeb7
        section: Credit Review & Analysis
        mnemonic: CRD-HIST-SCOPE
        also_as:
          standard: CRD-HIST-SCOPE
