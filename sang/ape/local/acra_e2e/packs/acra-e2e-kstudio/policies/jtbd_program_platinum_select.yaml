        source_text: '# Revocable Living Trust Vesting Conditions - Base Version


          ## Purpose

          This JTBD confirms that title vesting in an inter vivos revocable trust satisfies every condition
          Acra requires before the trust may hold title to the subject property.


          ## Reference Documents

          ### Trust Documents

          - Trust Agreement or Certification of Trust: existence and date of the trust, Trustor(s), Trustee(s),
          Trustee powers, revocability, Trustee signing requirements, tax identification number, and vesting
          instructions

          - Title Commitment: proposed vesting of title in the trust


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for a complete, legible copy of the Trust or a Certification of Trust
          containing the elements Acra requires.


          ### Step 2 - Eligibility Verification

          - Trust is confirmed valid under the laws of the state in which it is established and is revocable,
          with the right to revoke held during the Trustor''s lifetime.

          - Trust was established by one or more natural persons and became effective during the lifetime
          of the person(s) establishing it.


          ### Step 3 - Validation and Verification

          - Primary beneficiary of the trust is the individual(s) who established it.

          - Where the Trustor(s) and Trustee(s) are not the same person(s), a written exception from Acra
          Senior Management is present in the file.

          - Trust document specifies the Trustee''s power to hold title and mortgage the property, addresses
          beneficiary consent for borrowing, and states that holding title in the trust does not diminish
          the lender''s rights as a creditor.


          ### Step 4 - Final Determination

          - All revocable living trust conditions are satisfied and title may vest in the trust, or a
          condition is unmet and the file is conditioned or the vesting structure is declined.


          ## Deterministic Validation Rules

          - The trust is valid under the laws of its state of establishment and is revocable during the
          Trustor''s lifetime: TRUE = pass, FALSE = fail.

          - The trust was established by one or more natural persons, effective during their lifetime,
          with the Trustor(s) as primary beneficiary: TRUE = pass, FALSE = fail.

          - Where Trustor(s) and Trustee(s) differ, a written exception from Acra Senior Management is
          present in the file: TRUE = pass, FALSE = fail.

          - The trust document specifies the Trustee''s power to hold title and mortgage the property
          and states that vesting in the trust does not diminish the lender''s creditor rights: TRUE =
          pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The trust is valid, revocable, established by natural persons with the Trustor(s) as primary
          beneficiary, and the Trustee-powers and lender-protection language are present; any Trustor/Trustee
          mismatch has a written Senior Management exception on file.


          ### Conditional

          Assign **Conditional** when:

          - The Trust document or Certification of Trust is on file but is missing the tax identification
          number element; the file may proceed with a condition to obtain the missing element prior to
          closing.


          ### Fail

          Assign **Fail** when:

          - The trust is irrevocable, is not valid under its state''s law, was not established by a natural
          person effective during their lifetime, or the Trustor(s)/Trustee(s) mismatch lacks a written
          Senior Management exception.


          ### Not Applicable

          Assign **Not Applicable** when:

          - Title is not vesting in a trust for this loan.'
        source_digest: bc287492f9b78feb44a4807c0fa90e19170a312c3b723d8ba17493152c1ab8e0
        section: Compliance and Closing
        mnemonic: BET-REVTRUST
        also_as:
          standard: BET-REVTRUST
