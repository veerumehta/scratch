        source_text: '# First-Time Homebuyer Ineligibility Screening - Base Version


          ## Purpose

          Determine whether any borrower on the application meets the First-Time Homebuyer definition
          and exclude the file from this program when the definition is met.


          ## Reference Documents

          ### Ownership History Documents

          - Loan Application (1003): states each borrower''s prior property ownership history

          - Credit Report: shows prior mortgage tradelines evidencing prior home ownership

          - Public Property Records: evidence of a borrower''s prior ownership interest in real property


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application ownership history section is completed for each borrower and guarantor.


          ### Step 2 - Eligibility Verification

          - Credit Report and public property records are reviewed for evidence of any borrower having
          previously owned real property.


          ### Step 3 - Validation and Verification

          - Loan Application declaration of prior home ownership for each borrower is cross-checked against
          the Credit Report''s mortgage tradeline history and public property records.


          ### Step 4 - Final Determination

          - Application is classified as a First-Time Homebuyer application, and therefore ineligible,
          only when all borrowers on the application have never previously owned real property.


          ## Deterministic Validation Rules

          - All borrowers on the Loan Application have never previously owned real property per the ownership
          history section, Credit Report, and public property records: TRUE = application meets the First-Time
          Homebuyer definition and is ineligible, FALSE = application does not meet the First-Time Homebuyer
          definition.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - At least one borrower has documented prior ownership of real property, so the application
          does not meet the First-Time Homebuyer definition.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - All borrowers on the application have never previously owned real property, meeting Acra''s
          First-Time Homebuyer definition.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: eb47d9c027f428aff08533dc320f831898b05cdc2aa86b44c0177371b54fe929
