        - Underwriter
        loan_metrics:
        - label: Housing History (0x30x12) Late Payment Count
          metric_key: CreditReport.total_accounts_with_late
          metric_mnemonic: CRD_HOUSHIST_LM1
          indicator_context: Compare CreditReport.total_accounts_with_late, restricted to mortgage/rental
            tradelines within the most recent 12 months, against the program's 0x30x12 standard. Indicator
            is 'Pass' when the count of 30-day-or-greater late housing payments in the most recent 12
            months is zero; 'Fail' otherwise. Do not populate borrower_ids for this unified metric under
            any circumstance.
          description_template: '30-Day Late Housing Payments (12 mo): {total_accounts_with_late}'
        entity_types:
        - name: Liability
          entity_description: Mortgage and rental obligations with payment history and subject-lien flags
        - name: CreditReport
