    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 6
        section_type: Eligibility
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Loan Amount Band for CLTV Step-Down
          metric_key: LoanCore.base_loan_amount_usd
          metric_mnemonic: LFC_AMTSTEPDN_LM1
          indicator_context: Evaluate LoanCore.base_loan_amount_usd to determine whether it is below $350,000
            or above $1,500,000, which triggers a 75.00% maximum on LoanCore.cltv_percent. Indicator is
            'Pass' when the step-down applies and cltv_percent <= 75.00%, or when the loan amount is within
            the $350,000-$1,500,000 band; 'Fail' when the step-down applies and cltv_percent exceeds 75.00%.
            Do not populate borrower_ids for this unified metric under any circumstance.
          description_template: 'Loan amount: {base_loan_amount_usd} (step-down band: below $350,000 or
            above $1,500,000); CLTV: {cltv_percent}% (cap: 75.00%)'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        reference_documents: '### Loan Origination System (LOS)

          - LOS loan record: provides the base loan amount and the proposed CLTV for the transaction.'
        source_text: '# Loan Amount, FICO and CLTV Matrix - Base Version


          ## Purpose

          This JTBD determines whether a Platinum Select DSCR loan''s base loan amount falls outside the
          $350,000-$1,500,000 band that carries the standard matrix cap, and if so, applies the reduced
          75.00% maximum CLTV that governs loans below $350,000 or above $1,500,000.


          ## Reference Documents

          ### Loan Origination System (LOS)

          - LOS loan record: provides the base loan amount and the proposed CLTV for the transaction.


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS loan record shows a base loan amount for the transaction.


          ### Step 2 - Eligibility Verification

          - Base loan amount is classified as below $350,000, above $1,500,000, or within the $350,000-$1,500,000
          band.


          ### Step 3 - Validation and Verification

          - Where base loan amount is below $350,000 or above $1,500,000, LOS proposed CLTV does not exceed
          75.00%.


          ### Step 4 - Final Determination

          - LOS proposed CLTV is compared against 75.00% for loans outside the $350,000-$1,500,000 band
          to reach a pass/fail determination; loans within the band are evaluated instead under the standard
          FICO/purpose matrix cap.


          ## Deterministic Validation Rules

          - Base loan amount < $350,000 OR base loan amount > $1,500,000: TRUE = the 75.00% CLTV step-down
          cap applies, FALSE = the standard matrix cap applies instead.

          - Where the step-down cap applies: LOS proposed CLTV percent <= 75.00% is TRUE = pass, FALSE
          = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Base loan amount is below $350,000 or above $1,500,000, and proposed CLTV is at or below 75.00%.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Base loan amount is below $350,000 or above $1,500,000, and proposed CLTV exceeds 75.00%.


          ### Not Applicable

          Assign **Not Applicable** when:

          - Base loan amount is within the $350,000-$1,500,000 band, since the loan-amount step-down cap
          does not apply and the standard FICO/purpose matrix cap governs instead.'
        source_digest: bb62e3dd24142006092e2251ec6d3fbb0797ac040f014b94349960e855f904dd
        section: Loan Program Eligibility
        mnemonic: LFC-AMT-STEPDN
