  - rule_id: CRD-DECSCORE.platinum_select
    condition:
      kind: procedure
      purpose: Establish the single decisioning credit score used for underwriting and pricing by identifying
        the correct borrower or guarantor score per the program's methodology.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Credit Report is present for each individual borrower and, for entity loans, each personal guarantor.

        - Loan Application identifies which individual is the Primary Wage Earner, or lists each guarantor
        for an entity-borrower loan.


        ### Step 2 - Eligibility Verification

        - Middle score is calculated for the Primary Wage Earner on an individual-borrower loan, or for
        each guarantor on an entity-borrower loan.


        ### Step 3 - Validation and Verification

        - For entity loans, guarantor ownership percentages from the Operating Agreement or Bylaws are
        compared to determine whether ownership is equal or unequal across guarantors.

        - Applicable guarantor score is selected: the highest middle score among guarantors with equal
        ownership, or the middle score of the guarantor with the highest ownership concentration when
        ownership is unequal.


        ### Step 4 - Final Determination

        - Decisioning score is finalized as the Primary Wage Earner''s middle score on an individual-borrower
        loan, or the guarantor score selected per the ownership-based rule on an entity-borrower loan.'
      checks:
      - 'Loan is an individual-borrower loan and the Primary Wage Earner''s middle score is used as the
        decisioning score: TRUE = pass, FALSE = fail.'
      - 'Loan is an entity-borrower loan with equal guarantor ownership percentages and the highest middle
        score among those guarantors is used as the decisioning score: TRUE = pass, FALSE = fail.'
      - 'Loan is an entity-borrower loan with unequal guarantor ownership percentages and the middle score
        of the guarantor with the highest ownership concentration is used as the decisioning score: TRUE
        = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
