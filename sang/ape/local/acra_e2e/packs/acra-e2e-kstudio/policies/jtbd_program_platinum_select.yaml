          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Appraisal Report (Form 1007/1025): property type, unit count, and occupancy observation

          - Current Lease Agreement: tenant identity and residential lease term for the subject property


          ### Loan Origination Records

          - LOS: system of record for the subject property type and unit count

          - Loan Application (1003): borrower''s declared relationship to the subject property'
        source_text: '# Investment Property Definition - Base Version


          ## Purpose

          This JTBD verifies that the subject property''s physical characteristics and lease arrangement
          meet Acra''s defined investment property standard as a precondition for Platinum Select DSCR
          eligibility.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report (Form 1007/1025): property type, unit count, and occupancy observation

          - Current Lease Agreement: tenant identity and residential lease term for the subject property


          ### Loan Origination Records

          - LOS: system of record for the subject property type and unit count

          - Loan Application (1003): borrower''s declared relationship to the subject property


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal report identifies the subject property''s type and number of units.

          - Current lease agreement for the subject property is present in the loan file.


          ### Step 2 - Eligibility Verification

          - SubjectProperty.number_of_units is between 1 and 4, or SubjectProperty.is_condo or SubjectProperty.is_pud
          is TRUE.

          - SubjectProperty.property_type is a form recognized as eligible investment property under the
          program.


          ### Step 3 - Validation and Verification

          - Lease agreement names a tenant who is not the borrower or guarantor on the loan.

          - Lease agreement term reflects a year-round residential tenancy rather than a short-term or
          nightly rental structure.


          ### Step 4 - Final Determination

          - Subject property is confirmed to meet the investment property definition and the file proceeds,
          or the definition is not met and the file is declined or routed for property-eligibility review.


          ## Deterministic Validation Rules

          - SubjectProperty.number_of_units is between 1 and 4, or SubjectProperty.is_condo is TRUE, or
          SubjectProperty.is_pud is TRUE: TRUE = pass, FALSE = fail.

          - Lease agreement identifies a tenant distinct from every borrower and guarantor on the loan:
          TRUE = pass, FALSE = fail.

          - Lease term structure reflects a year-round residential tenancy, not a short-term/nightly rental:
          TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The subject property is a 1-4 unit dwelling or condo/PUD unit, leased to a non-owner tenant
          on a year-round residential lease.


          ### Conditional

          Assign **Conditional** when:

          - The property meets the unit-count/type criteria but the executed lease agreement is not yet
          in the file; the file may proceed with a condition to provide the executed lease prior to closing.


          ### Fail

          Assign **Fail** when:

          - The property is owner-occupied, is leased on a short-term/transient basis, or exceeds four
          units without qualifying as a condominium or PUD unit.


          ### Not Applicable

          There is no case for this outcome — the investment property definition applies to every Platinum
          Select DSCR loan.'
        source_digest: b6b0135858f1311e9e734d1c94946a1b9ae89d5aefbd7e6177a8705cf3d4e4df
