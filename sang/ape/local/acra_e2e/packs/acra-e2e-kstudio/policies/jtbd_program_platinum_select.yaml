        source_text: '# Listed-for-Sale Property Definition - Base Version


          ## Purpose

          This JTBD determines whether the subject property meets Acra''s definition of a property listed
          for sale, which triggers the additional underwriting conditions Acra requires for such properties.


          ## Reference Documents

          ### Property Listing Documents

          - MLS Listing History Report: dates the subject property was listed for sale

          - Seller/Borrower Disclosure: borrower-provided listing history for the subject property


          ### Loan Origination Records

          - LOS: system of record for the Application Date


          ## Steps


          ### Step 1 - Initial Document Review

          - MLS listing history report or seller/borrower disclosure for the subject property is reviewed
          for any listing activity.


          ### Step 2 - Eligibility Verification

          - Last date the subject property was listed for sale, if any, is identified from the listing
          history.


          ### Step 3 - Validation and Verification

          - Elapsed time between the last listing date and the LOS Application Date is calculated and
          compared to a six-month window.


          ### Step 4 - Final Determination

          - Subject property is classified as listed for sale (if listed within six months of the Application
          Date) or not listed for sale, and this classification is recorded to drive the applicable underwriting
          conditions.


          ## Deterministic Validation Rules

          - Elapsed time between the last date the subject property was listed for sale and the LOS Application
          Date is six months or less: TRUE = classified as listed for sale, FALSE = not classified as
          listed for sale.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Listing history is reviewed and a definitive listed-for-sale classification (listed within
          six months, or not listed within six months) is made and recorded in the file.


          ### Conditional

          Assign **Conditional** when:

          - MLS listing history is incomplete or unavailable at the time of underwriting; the file may
          proceed with a condition to obtain a complete listing history report prior to closing.


          ### Fail

          Assign **Fail** when:

          - No listing history review is performed and no listed-for-sale classification is recorded in
          the file.


          ### Not Applicable

          There is no case for this outcome — the listed-for-sale determination is made on every Platinum
          Select DSCR loan.'
        source_digest: 89cfe94ba731aa93ed3e64f933ed22e12a9ccf3e50d0c43238f9bc280697eff5
