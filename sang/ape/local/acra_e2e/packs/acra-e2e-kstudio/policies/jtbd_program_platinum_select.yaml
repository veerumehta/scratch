        source_text: '# Borrowing Entity On-Title Requirement - Base Version


          ## Purpose

          Ensure that all entities holding direct ownership of, and appearing on title to, the subject
          property are named as borrowing entities on the loan.


          ## Reference Documents

          ### Title and Entity Documents

          - Title Commitment: identifies all parties that will hold direct ownership and title to the
          subject property

          - Loan Application: identifies all named borrowing entities on the loan

          - Certificate of Formation: identifies each entity named on title


          ## Steps


          ### Step 1 - Initial Document Review

          - Title Commitment lists every party that will directly own and appear on title to the subject
          property.


          ### Step 2 - Eligibility Verification

          - Each entity listed on the Title Commitment as a direct title owner is compared against the
          entities named as borrowers on the Loan Application.


          ### Step 3 - Validation and Verification

          - Any entity appearing on the Title Commitment as a direct owner that is not also named as a
          borrowing entity on the Loan Application is identified as a discrepancy.


          ### Step 4 - Final Determination

          - Loan is approved on this point only when every direct-ownership entity shown on the Title
          Commitment is also named as a borrowing entity on the Loan Application.


          ## Deterministic Validation Rules

          - Every entity listed on the Title Commitment as a direct title owner is also named as a borrowing
          entity on the Loan Application: TRUE = requirement satisfied, FALSE = requirement not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - All entities holding direct ownership and title to the subject property are named as borrowing
          entities on the Loan Application.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - An entity holding direct ownership or title to the subject property is not named as a borrowing
          entity on the Loan Application.


          ### Not Applicable

          Assign **Not Applicable** when:

          - Title to the subject property will be held directly by an individual and no entity holds direct
          ownership.'
