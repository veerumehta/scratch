        source_text: '# Reserves by Listed-for-Sale, Forbearance, and Rent-Loss Triggers - Base Version


          ## Purpose

          Verify that the borrower has documented reserves meeting the applicable requirement for the
          listed-for-sale, forbearance/mortgage-lates, or rent-loss-insurance-waiver triggers.


          ## Reference Documents

          ### Asset and Property Documents

          - Bank Statements / Investment Account Statements: source of eligible reserve or cash-in-hand
          funds

          - Property Listing History: evidences whether the subject property was listed for sale within
          the last six months

          - Credit Report: evidences forbearance or mortgage lates within the last 12 months

          - Rent Loss Insurance Quote / Declination: evidences whether rent loss insurance coverage was
          obtained


          ## Steps


          ### Step 1 - Initial Document Review

          - Property Listing History, Credit Report, and Rent Loss Insurance Quote/Declination are reviewed
          to identify which, if any, of the three reserve triggers apply to the transaction.


          ### Step 2 - Eligibility Verification

          - Applicable reserve amount is identified per trigger: 24 months of reserves for a property
          listed for sale within the last six months; 12 months of the subject''s payment in reserve for
          forbearance or mortgage lates within the last 12 months without timely rent receipt; or 2 months
          of reserves for every 1 month of rent loss coverage not obtained.


          ### Step 3 - Validation and Verification

          - Bank Statements or Investment Account Statements documenting eligible reserve or cash-in-hand
          funds are compared against the applicable trigger''s required months of reserves.


          ### Step 4 - Final Determination

          - Applicable reserve requirement is satisfied only when documented reserves or eligible cash-in-hand
          funds meet or exceed the months required by the specific trigger identified for the transaction.


          ## Deterministic Validation Rules

          - Property Listing History shows the subject property listed for sale within the last six months
          and documented reserves are at least 24 months: TRUE = pass, FALSE = fail.

          - Credit Report shows forbearance or mortgage lates within the last 12 months without timely
          receipt of the prior two months'' rent, and documented reserves are at least 12 months of the
          subject''s payment: TRUE = pass, FALSE = fail.

          - Rent loss insurance coverage is required but not obtained, and documented reserves are at
          least 2 months for every 1 month of coverage not provided: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - None of the three triggers apply, or the applicable trigger''s required months of reserves
          are fully documented.


          ### Conditional

          Assign **Conditional** when:

          - A trigger is identified but reserve documentation on file does not yet clearly establish the
          required number of months.


          ### Fail

          Assign **Fail** when:

          - A trigger is identified and documented reserves are less than the number of months required
          for that trigger.


          ### Not Applicable

          Assign **Not Applicable** when:

          - None of the three triggers (listed for sale, forbearance/lates, rent loss insurance waiver)
          apply to the transaction.'
        source_digest: 7147b6c8452f34c91571905f5a993e20e66e12e0756057c62b65b91da5bbf40a
        section: Asset Assessment
        mnemonic: AFC-RESERVE-OTHER
