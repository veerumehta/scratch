          its associated dates.

          ### Loan Origination System (LOS)

          - LOS application record: provides borrower bankruptcy, foreclosure, and short-sale / deed-in-lieu
          disclosures and the application date.'
        source_text: '# Previous Credit Event 48-Month Seasoning - Base Version


          ## Purpose

          This JTBD confirms that any previous credit event reported for a Platinum Select DSCR applicant
          or guarantor meets Acra''s published 48-month seasoning requirement, measured from the event
          date to the application date.


          ## Reference Documents

          ### Credit Documentation

          - Credit Report: shows any reported bankruptcy, foreclosure, short sale, or deed-in-lieu and
          its associated dates.

          ### Loan Origination System (LOS)

          - LOS application record: provides borrower bankruptcy, foreclosure, and short-sale / deed-in-lieu
          disclosures and the application date.


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS application record and Credit Report show whether the borrower or guarantor has a disclosed
          or reported bankruptcy, foreclosure, short sale, or deed-in-lieu.


          ### Step 2 - Eligibility Verification

          - Where a previous credit event is disclosed or reported, the event date (bankruptcy discharge
          date, foreclosure date, or short sale / deed-in-lieu completion date) is identified as the seasoning
          start point.


          ### Step 3 - Validation and Verification

          - Elapsed time from the identified event date to the LOS application date is at least 48 months.


          ### Step 4 - Final Determination

          - 48-month seasoning is compared against the presence and date of any reported previous credit
          event to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - Borrower.has_declared_bankruptcy = TRUE: months elapsed between Borrower.bankruptcy_discharge_date
          and LoanCore.application_date >= 48 is TRUE = pass, FALSE = fail.

          - Borrower.has_property_foreclosed = TRUE: months elapsed between Borrower.foreclosure_date
          and LoanCore.application_date >= 48 is TRUE = pass, FALSE = fail.

          - Borrower.has_preforeclosure_short_sale = TRUE OR Borrower.has_conveyed_title_in_lieu = TRUE:
          months elapsed between the reported event completion date and LoanCore.application_date >= 48
          is TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A previous credit event is reported and at least 48 months have elapsed between the event
          date and the application date.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - A previous credit event is reported and fewer than 48 months have elapsed between the event
          date and the application date.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No bankruptcy, foreclosure, short sale, or deed-in-lieu is disclosed or reported for the borrower
          or guarantor.'
