          default_extraction_mode: ASK_USER
        reference_documents: '### Loan and Property Documents

          - Note: states the principal and interest payment amount

          - Tax Certification / Tax Bill: states the monthly or annual real estate tax amount

          - Hazard Insurance Policy: states the annual or monthly property insurance premium

          - HOA / Condo Association Statement: states the monthly association fee, when applicable

          - Subordinate Financing Note, when applicable: states the subordinate lien monthly payment'
        source_text: '# PITIA Denominator Determination - Base Version


          ## Purpose

          Establish and verify the components comprising the DSCR denominator (PITIA) so that qualifying
          rent can be compared against a complete monthly housing expense figure.


          ## Reference Documents

          ### Loan and Property Documents

          - Note: states the principal and interest payment amount

          - Tax Certification / Tax Bill: states the monthly or annual real estate tax amount

          - Hazard Insurance Policy: states the annual or monthly property insurance premium

          - HOA / Condo Association Statement: states the monthly association fee, when applicable

          - Subordinate Financing Note, when applicable: states the subordinate lien monthly payment


          ## Steps


          ### Step 1 - Initial Document Review

          - Note states the first-lien principal and interest payment amount.

          - Tax Certification or Tax Bill states the monthly real estate tax amount.

          - Hazard Insurance Policy states the monthly property insurance premium amount.

          - HOA / Condo Association Statement states the monthly association fee amount, when the subject
          property is a condo or PUD.


          ### Step 2 - Eligibility Verification

          - Subordinate Financing Note, when a subordinate lien exists on the subject property, states
          a monthly payment amount to be included in the denominator.

          - Each PITIA component (principal, interest, taxes, insurance, association fees) has a stated
          dollar amount in the file, or is confirmed not applicable for the subject property.


          ### Step 3 - Validation and Verification

          - Sum of principal, interest, taxes, insurance, association fees, and applicable subordinate
          financing payment is calculated and recorded as the DSCR denominator.

          - Denominator total is cross-checked against the loan''s recorded proposed housing expense figure
          for consistency.


          ### Step 4 - Final Determination

          - DSCR denominator is finalized as the sum of principal, interest, real estate taxes, property
          insurance, association fees, and subordinate financing (if applicable); an incomplete component
          set returns the file for additional documentation.


          ## Deterministic Validation Rules

          - Principal and interest amount is present on the Note: TRUE = component included in the denominator,
          FALSE = denominator is incomplete.

          - Real estate tax amount is present on the Tax Certification or Tax Bill: TRUE = component included,
          FALSE = denominator is incomplete.

          - Property insurance premium is present on the Hazard Insurance Policy: TRUE = component included,
          FALSE = denominator is incomplete.

          - HOA or association fee is present when the subject property is a condo or PUD: TRUE = component
          included, FALSE = denominator is incomplete.

          - Subordinate financing payment is included in the denominator when a subordinate lien exists
          on the subject property: TRUE = component included, FALSE = denominator understates PITIA.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - All applicable PITIA components (principal, interest, taxes, insurance, association fees,
          and subordinate financing if present) are documented and summed into the denominator.


          ### Conditional

          Assign **Conditional** when:

          - One or more PITIA components lack a stated dollar amount in the file and are pending verification
          (for example, an HOA statement not yet obtained for a condo).


          ### Fail

          Assign **Fail** when:

          - A required PITIA component is confirmed missing and cannot be sourced from any document in
          the file.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 9cd5e51d64b089c7e0ec015def567c324885213e421b5dd2ee023d5484e6d328
