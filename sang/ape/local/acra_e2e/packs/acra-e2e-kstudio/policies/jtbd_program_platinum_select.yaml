policies:
- policy_id: JTBD_PROGRAM_PLATINUM_SELECT
  version: 1.0.0
  name: platinum_select overlay
  description: platinum_select overlay
  policy_type: institutional
  effective_date: '2026-10-27T16:15:58.014136Z'
  status: active
  rules:
  - rule_id: PRE-CONDO-CLTV.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD confirms that the loan's combined loan-to-value ratio does not exceed the 75.00%
        cap Acra publishes specifically for Warrantable Condo and Two-Unit subject properties, which may
        be lower than the base FICO/purpose matrix cap.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Appraisal report confirms whether the subject property is a Warrantable Condo or a Two-Unit
        dwelling.


        ### Step 2 - Eligibility Verification

        - LOS-recorded CLTV for the loan is retrieved for comparison against the property-type overlay
        cap.


        ### Step 3 - Validation and Verification

        - Where the property is a Warrantable Condo or Two-Unit dwelling, the loan''s CLTV is compared
        against the lower of the property-type overlay cap (75.00%) and the otherwise-applicable FICO/purpose
        matrix cap.


        ### Step 4 - Final Determination

        - Loan''s CLTV is confirmed within the applicable cap and the file proceeds, or the CLTV exceeds
        the cap and the loan is restructured or declined.'
      checks:
      - 'Where SubjectProperty is a Warrantable Condo or a Two-Unit dwelling, LoanCore.cltv_percent is
        75.00% or less: TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 1
    description: Confirms the loan's CLTV does not exceed 75.00% when the subject property is a Warrantable
      Condo or a Two-Unit dwelling, per the Platinum Select property-type CLTV overlay.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 1
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: CLTV Percent (Condo/Two-Unit Overlay)
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: PRE_CONDOCLTV_LM1
          indicator_context: Compare LoanCore.cltv_percent against the 75.00% cap applicable to Warrantable
            Condo and Two-Unit subject properties. Indicator is 'Pass' when cltv_percent <= 75.00% for
            a Warrantable Condo or Two-Unit property, or the property is not subject to this overlay;
            'Fail' when cltv_percent exceeds 75.00% for such a property. Cross-verify with the appraisal
            report for property type; on mismatch use the appraisal-extracted value. Do not populate borrower_ids
            for this unified metric under any circumstance.
          description_template: 'CLTV: {cltv_percent}% (limit: 75.00% for Warrantable Condo/Two-Unit)'
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: CondoProject
          entity_description: Condo project warrantability and classification
        extraction_targets:
        - description: Property type, unit count and condo classification from the appraisal
          entity_type: SubjectProperty
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Appraisal Report: subject property type and unit count confirming Warrantable Condo or Two-Unit
          status


          ### Loan Origination Records

          - LOS: system of record for the loan''s CLTV and the FICO/purpose matrix cap otherwise applicable'
        source_text: '# Warrantable Condo and Two-Unit CLTV Overlay - Base Version


          ## Purpose

          This JTBD confirms that the loan''s combined loan-to-value ratio does not exceed the 75.00%
          cap Acra publishes specifically for Warrantable Condo and Two-Unit subject properties, which
          may be lower than the base FICO/purpose matrix cap.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: subject property type and unit count confirming Warrantable Condo or Two-Unit
          status


          ### Loan Origination Records

          - LOS: system of record for the loan''s CLTV and the FICO/purpose matrix cap otherwise applicable


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal report confirms whether the subject property is a Warrantable Condo or a Two-Unit
          dwelling.


          ### Step 2 - Eligibility Verification

          - LOS-recorded CLTV for the loan is retrieved for comparison against the property-type overlay
          cap.


          ### Step 3 - Validation and Verification

          - Where the property is a Warrantable Condo or Two-Unit dwelling, the loan''s CLTV is compared
          against the lower of the property-type overlay cap (75.00%) and the otherwise-applicable FICO/purpose
          matrix cap.


          ### Step 4 - Final Determination

          - Loan''s CLTV is confirmed within the applicable cap and the file proceeds, or the CLTV exceeds
          the cap and the loan is restructured or declined.


          ## Deterministic Validation Rules

          - Where SubjectProperty is a Warrantable Condo or a Two-Unit dwelling, LoanCore.cltv_percent
          is 75.00% or less: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The subject property is a Warrantable Condo or Two-Unit dwelling and LoanCore.cltv_percent
          is 75.00% or less.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The subject property is a Warrantable Condo or Two-Unit dwelling and LoanCore.cltv_percent
          exceeds 75.00%.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The subject property is not a Warrantable Condo and not a Two-Unit dwelling.'
        source_digest: 7c033318d7d0baad12b1e8d93f759710f6d165a48e3b68aee4869492eb13626d
        section: Appraisal Review
        mnemonic: PRE-CONDO-CLTV
    approval_refs: []
  - rule_id: PRE-DECLMKT.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD confirms that the declining-market CLTV reduction Acra publishes is correctly
        applied to the loan's maximum allowable CLTV whenever the subject property is located in a market
        the appraisal identifies as declining.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Appraisal report''s neighborhood or market-condition section is reviewed for a declining-market
        designation for the subject property''s area.


        ### Step 2 - Eligibility Verification

        - Base maximum CLTV otherwise applicable to the loan (from the FICO/purpose matrix and any other
        property-type overlay) is identified.


        ### Step 3 - Validation and Verification

        - Where a declining market is designated, the base maximum CLTV is reduced by 5 percentage points,
        and the loan''s proposed CLTV is compared against the resulting adjusted cap.


        ### Step 4 - Final Determination

        - Loan''s CLTV is confirmed within the declining-market-adjusted cap (or the unadjusted cap, if
        no declining market applies) and the file proceeds, or the cap is exceeded and the loan is restructured
        or declined.'
      checks:
      - 'Where the appraisal report designates the subject property''s market as declining, the applicable
        maximum CLTV used for comparison is the base matrix cap reduced by 5 percentage points: TRUE =
        pass, FALSE = fail.'
      - 'LoanCore.cltv_percent does not exceed the applicable maximum CLTV (adjusted for a declining market
        where designated): TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 2
    description: Confirms a 5-percentage-point CLTV reduction from the applicable matrix cap is applied
      whenever the subject property is located in a declining market, per the Platinum Select location
      overlay.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 2
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: CLTV Percent (Declining Market Overlay)
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: PRE_DECLMKT_LM1
          indicator_context: Compare LoanCore.cltv_percent against the base matrix CLTV cap reduced by
            5 percentage points when the appraisal designates a declining market. Indicator is 'Pass'
            when cltv_percent is within the adjusted cap, or no declining market is designated and cltv_percent
            is within the unadjusted cap; 'Fail' otherwise. Cross-verify declining-market designation
            with the appraisal report. Do not populate borrower_ids for this unified metric under any
            circumstance.
          description_template: 'CLTV: {cltv_percent}% (declining market adjustment: -5% from matrix cap)'
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        - name: AppraisalSummary
          entity_description: Appraisal form type, value, appraiser licence and effective date
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        extraction_targets:
        - description: Declining-market indicator and effective date from the appraisal neighborhood section
          entity_type: AppraisalSummary
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Appraisal Report: neighborhood/market condition analysis, including any declining-market designation


          ### Loan Origination Records

          - LOS: system of record for the loan''s proposed CLTV and the base FICO/purpose matrix cap'
        source_text: '# Declining Market CLTV Adjustment - Base Version


          ## Purpose

          This JTBD confirms that the declining-market CLTV reduction Acra publishes is correctly applied
          to the loan''s maximum allowable CLTV whenever the subject property is located in a market the
          appraisal identifies as declining.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: neighborhood/market condition analysis, including any declining-market designation


          ### Loan Origination Records

          - LOS: system of record for the loan''s proposed CLTV and the base FICO/purpose matrix cap


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal report''s neighborhood or market-condition section is reviewed for a declining-market
          designation for the subject property''s area.


          ### Step 2 - Eligibility Verification

          - Base maximum CLTV otherwise applicable to the loan (from the FICO/purpose matrix and any other
          property-type overlay) is identified.


          ### Step 3 - Validation and Verification

          - Where a declining market is designated, the base maximum CLTV is reduced by 5 percentage points,
          and the loan''s proposed CLTV is compared against the resulting adjusted cap.


          ### Step 4 - Final Determination

          - Loan''s CLTV is confirmed within the declining-market-adjusted cap (or the unadjusted cap,
          if no declining market applies) and the file proceeds, or the cap is exceeded and the loan is
          restructured or declined.


          ## Deterministic Validation Rules

          - Where the appraisal report designates the subject property''s market as declining, the applicable
          maximum CLTV used for comparison is the base matrix cap reduced by 5 percentage points: TRUE
          = pass, FALSE = fail.

          - LoanCore.cltv_percent does not exceed the applicable maximum CLTV (adjusted for a declining
          market where designated): TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The declining-market 5-point reduction is correctly applied when designated, and LoanCore.cltv_percent
          is within the resulting adjusted cap.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The appraisal designates a declining market and LoanCore.cltv_percent exceeds the base matrix
          cap reduced by 5 percentage points.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The appraisal report does not designate the subject property''s market as declining.'
        source_digest: 085a0465b4f69ea73d19f0645e879ce242443da6b51bdb88f5083e31d387c6fd
        section: Appraisal Review
        mnemonic: PRE-DECLMKT
        also_as:
          standard: PRE-DECLMKT
    approval_refs: []
  - rule_id: PRE-INELIG-TYP.platinum_select
    condition:
      kind: procedure
      purpose: 'This JTBD determines whether the subject property exhibits any of the characteristics
        Acra expressly excludes from the Platinum Select DSCR program: rural classification, condotel
        structure, non-warrantable condo status, or short-term rental use.'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Appraisal report''s location/neighborhood section and property description are reviewed for
        rural classification and condo project characteristics.

        - Lease agreement, if any, is reviewed for tenancy term length.


        ### Step 2 - Eligibility Verification

        - Appraisal report does not classify the subject property or its neighborhood as rural.

        - SubjectProperty.condo_project_classification, if applicable, does not indicate Condotel or Non-Warrantable
        status.


        ### Step 3 - Validation and Verification

        - Lease or rental-use documentation does not reflect short-term or transient (nightly or weekly)
        rental use of the subject property.


        ### Step 4 - Final Determination

        - Subject property is confirmed free of every ineligible characteristic and the file proceeds,
        or an ineligible characteristic is identified and the loan is declined.'
      checks:
      - 'Appraisal report does not classify the subject property as Rural: TRUE = pass, FALSE = fail.'
      - 'SubjectProperty.condo_project_classification, where applicable, does not indicate Condotel or
        Non-Warrantable: TRUE = pass, FALSE = fail.'
      - 'Lease or rental-use documentation does not reflect short-term/transient rental use: TRUE = pass,
        FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 3
    description: Confirms the subject property is not a Rural Property, Condotel, Non-Warrantable Condo,
      or Short-Term Rental, each of which is expressly ineligible for the Platinum Select DSCR program.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 3
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Condo Project Classification
          metric_key: SubjectProperty.condo_project_classification
          metric_mnemonic: PRE_CONDOCLS_LM1
          indicator_context: Check SubjectProperty.condo_project_classification, when the property is
            a condominium, against the Platinum Select ineligible values (Condotel, Non-Warrantable).
            Indicator is 'Pass' when the classification is not Condotel or Non-Warrantable, or the property
            is not a condo; 'Fail' when it is Condotel or Non-Warrantable. Cross-verify with condo project
            documentation; on mismatch use the project-documentation value. Do not populate borrower_ids
            for this unified metric under any circumstance.
          description_template: 'Condo Classification: {condo_project_classification} (ineligible: Condotel,
            Non-Warrantable)'
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        - name: CondoProject
          entity_description: Condo project warrantability and classification
        extraction_targets:
        - description: Property type, rural / condotel / non-warrantable indicators from appraisal and
            questionnaire
          entity_type: SubjectProperty
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Appraisal Report: rural/urban classification and condo project characteristics

          - Condo Project Documentation (questionnaire, HOA certification): condotel or non-warrantable
          status when the property is a condominium


          ### Rental Use Documents

          - Current Lease Agreement: tenancy term length and use

          - Short-Term Rental Listing/Licensing Records, if applicable: evidence of nightly or weekly
          rental activity'
        source_text: '# Ineligible Property Types - Base Version


          ## Purpose

          This JTBD determines whether the subject property exhibits any of the characteristics Acra expressly
          excludes from the Platinum Select DSCR program: rural classification, condotel structure, non-warrantable
          condo status, or short-term rental use.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: rural/urban classification and condo project characteristics

          - Condo Project Documentation (questionnaire, HOA certification): condotel or non-warrantable
          status when the property is a condominium


          ### Rental Use Documents

          - Current Lease Agreement: tenancy term length and use

          - Short-Term Rental Listing/Licensing Records, if applicable: evidence of nightly or weekly
          rental activity


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal report''s location/neighborhood section and property description are reviewed for
          rural classification and condo project characteristics.

          - Lease agreement, if any, is reviewed for tenancy term length.


          ### Step 2 - Eligibility Verification

          - Appraisal report does not classify the subject property or its neighborhood as rural.

          - SubjectProperty.condo_project_classification, if applicable, does not indicate Condotel or
          Non-Warrantable status.


          ### Step 3 - Validation and Verification

          - Lease or rental-use documentation does not reflect short-term or transient (nightly or weekly)
          rental use of the subject property.


          ### Step 4 - Final Determination

          - Subject property is confirmed free of every ineligible characteristic and the file proceeds,
          or an ineligible characteristic is identified and the loan is declined.


          ## Deterministic Validation Rules

          - Appraisal report does not classify the subject property as Rural: TRUE = pass, FALSE = fail.

          - SubjectProperty.condo_project_classification, where applicable, does not indicate Condotel
          or Non-Warrantable: TRUE = pass, FALSE = fail.

          - Lease or rental-use documentation does not reflect short-term/transient rental use: TRUE =
          pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The appraisal shows no rural classification, the condo project (if any) is not Condotel or
          Non-Warrantable, and no short-term rental use is documented.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The subject property is classified as Rural, is a Condotel, is a Non-Warrantable Condo, or
          is used or documented as a Short-Term Rental.


          ### Not Applicable

          There is no case for this outcome — this exclusion is evaluated on every Platinum Select DSCR
          loan.'
        source_digest: 6a61fbf5c7947ce03758fb820225a741d659f9675fd4c676f3b94411e6262e83
        section: Appraisal Review
        mnemonic: PRE-INELIG-TYP
    approval_refs: []
  - rule_id: PRE-LISTCOND.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD confirms that a subject property classified as listed for sale (per the six-month
        definition) satisfies every additional underwriting condition Acra requires before such a loan
        may be approved.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - LOS confirms the subject property is classified as listed for sale, and lien status and lease
        agreement are reviewed.


        ### Step 2 - Eligibility Verification

        - Loan''s calculated DSCR, reserve balance, and amortization type are compared against the listed-for-sale
        minimums (channel-minimum DSCR, 24 months reserves, fully amortizing).


        ### Step 3 - Validation and Verification

        - Prepayment penalty term and state restriction status are checked, and LTV/CLTV is calculated
        against the lesser of the appraised value or the lowest recent listing price, with no subordinate
        financing present and impounds established.


        ### Step 4 - Final Determination

        - All listed-for-sale conditions are satisfied and the loan proceeds, or a condition is unmet
        and the loan is declined or conditioned.'
      checks:
      - 'Subject property lien(s) are not in default or otherwise delinquent: TRUE = pass, FALSE = fail.'
      - 'Subject property is tenant-occupied and not vacant, evidenced by a current lease agreement: TRUE
        = pass, FALSE = fail.'
      - 'Loan''s calculated DSCR meets or exceeds the applicable channel minimum (1.20 Correspondent /
        1.00 Wholesale): TRUE = pass, FALSE = fail.'
      - 'Prepayment penalty term is at least 3 years, unless the subject property is in a state that does
        not allow prepayment penalties: TRUE = pass, FALSE = fail.'
      - 'Verified reserves on file equal at least 24 months: TRUE = pass, FALSE = fail.'
      - 'Loan amortization type is fully amortizing, with no interest-only period: TRUE = pass, FALSE
        = fail.'
      - 'LoanCore.ltv_percent and LoanCore.cltv_percent do not exceed 65%, calculated using the lesser
        of the appraised value or the lowest recent listing price: TRUE = pass, FALSE = fail.'
      - 'No subordinate financing is recorded against the subject property on this loan: TRUE = pass,
        FALSE = fail.'
      - 'An impound/escrow account is established for taxes and insurance on this loan: TRUE = pass, FALSE
        = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 4
    description: Confirms a subject property classified as listed for sale meets every required overlay
      — non-delinquent lien, tenant occupancy, channel-minimum DSCR, 3-year prepayment penalty (unless
      state-restricted), 24 months reserves, full amortization, 65% LTV/CLTV cap, no subordinate financing,
      and impounds.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 4
        section_type: Collateral
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: CLTV Percent (Listed-for-Sale Overlay)
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: PRE_LISTCLTV_LM1
          indicator_context: Compare LoanCore.cltv_percent against the 65% cap required for a subject
            property classified as listed for sale, calculated using the lesser of the appraised value
            or the lowest recent listing price. Indicator is 'Pass' when cltv_percent <= 65% for a listed-for-sale
            property, or the property is not listed for sale; 'Fail' when cltv_percent exceeds 65% for
            a listed-for-sale property. Cross-verify with the appraisal report and MLS listing history;
            on mismatch use the lower of the two values. Do not populate borrower_ids for this unified
            metric under any circumstance.
          description_template: 'CLTV: {cltv_percent}% (limit: 65% for listed-for-sale property)'
        - label: Reserves (Months) - Listed-for-Sale Overlay
          metric_key: RatioSet.reserves_months
          metric_mnemonic: PRE_LISTRES_LM1
          indicator_context: Compare RatioSet.reserves_months against the 24-month minimum required when
            the subject property is classified as listed for sale. Indicator is 'Pass' when reserves_months
            >= 24 for a listed-for-sale property, or the property is not listed for sale; 'Fail' when
            reserves_months is below 24 for a listed-for-sale property. Cross-verify with verified asset
            statements; on mismatch use the asset-statement-derived value. Do not populate borrower_ids
            for this unified metric under any circumstance.
          description_template: 'Reserves: {reserves_months} months (minimum: 24 for listed-for-sale property)'
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months'
        - name: Liability
          entity_description: Mortgage and rental obligations with payment history and subject-lien flags
        - name: Asset
          entity_description: Verified funds for closing and reserves, including gifts and foreign-held
            accounts
        extraction_targets:
        - description: 'Listed-for-sale overlay results: LTV/CLTV on lesser of value or listing price,
            amortization, prepayment term'
          entity_type: LoanCore
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Loan and Property Records

          - LOS: lien status, DSCR calculation, amortization type, and subordinate financing indicators

          - Current Lease Agreement: tenant occupancy evidence for the subject property

          - Appraisal Report and MLS Listing History: appraised value and lowest recent listing price
          for the LTV/CLTV calculation


          ### Reserve and Escrow Documents

          - Asset Statements: verification of 24 months of reserves

          - Prepayment Penalty Rider: prepayment penalty term

          - Impound/Escrow Account Setup Record: establishment of tax and insurance impounds'
        source_text: '# Listed-for-Sale Property Underwriting Conditions - Base Version


          ## Purpose

          This JTBD confirms that a subject property classified as listed for sale (per the six-month
          definition) satisfies every additional underwriting condition Acra requires before such a loan
          may be approved.


          ## Reference Documents

          ### Loan and Property Records

          - LOS: lien status, DSCR calculation, amortization type, and subordinate financing indicators

          - Current Lease Agreement: tenant occupancy evidence for the subject property

          - Appraisal Report and MLS Listing History: appraised value and lowest recent listing price
          for the LTV/CLTV calculation


          ### Reserve and Escrow Documents

          - Asset Statements: verification of 24 months of reserves

          - Prepayment Penalty Rider: prepayment penalty term

          - Impound/Escrow Account Setup Record: establishment of tax and insurance impounds


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS confirms the subject property is classified as listed for sale, and lien status and lease
          agreement are reviewed.


          ### Step 2 - Eligibility Verification

          - Loan''s calculated DSCR, reserve balance, and amortization type are compared against the listed-for-sale
          minimums (channel-minimum DSCR, 24 months reserves, fully amortizing).


          ### Step 3 - Validation and Verification

          - Prepayment penalty term and state restriction status are checked, and LTV/CLTV is calculated
          against the lesser of the appraised value or the lowest recent listing price, with no subordinate
          financing present and impounds established.


          ### Step 4 - Final Determination

          - All listed-for-sale conditions are satisfied and the loan proceeds, or a condition is unmet
          and the loan is declined or conditioned.


          ## Deterministic Validation Rules

          - Subject property lien(s) are not in default or otherwise delinquent: TRUE = pass, FALSE =
          fail.

          - Subject property is tenant-occupied and not vacant, evidenced by a current lease agreement:
          TRUE = pass, FALSE = fail.

          - Loan''s calculated DSCR meets or exceeds the applicable channel minimum (1.20 Correspondent
          / 1.00 Wholesale): TRUE = pass, FALSE = fail.

          - Prepayment penalty term is at least 3 years, unless the subject property is in a state that
          does not allow prepayment penalties: TRUE = pass, FALSE = fail.

          - Verified reserves on file equal at least 24 months: TRUE = pass, FALSE = fail.

          - Loan amortization type is fully amortizing, with no interest-only period: TRUE = pass, FALSE
          = fail.

          - LoanCore.ltv_percent and LoanCore.cltv_percent do not exceed 65%, calculated using the lesser
          of the appraised value or the lowest recent listing price: TRUE = pass, FALSE = fail.

          - No subordinate financing is recorded against the subject property on this loan: TRUE = pass,
          FALSE = fail.

          - An impound/escrow account is established for taxes and insurance on this loan: TRUE = pass,
          FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - All nine listed-for-sale conditions (lien status, occupancy, DSCR, prepayment term, reserves,
          amortization, LTV/CLTV cap, no subordinate financing, impounds) are met.


          ### Conditional

          Assign **Conditional** when:

          - Every condition is met except verified reserves, which are documented but short of 24 months
          at underwriting; the file may proceed with a condition to provide additional asset documentation
          prior to closing.


          ### Fail

          Assign **Fail** when:

          - Any listed-for-sale condition — lien status, occupancy, DSCR, prepayment term, reserves, amortization
          type, the 65% LTV/CLTV cap, subordinate financing, or impounds — is not met.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The subject property is not classified as listed for sale.'
        source_digest: 803748c9377f22239a7677e5715a10a869d523582e4ad23c15803f5bfa50433d
