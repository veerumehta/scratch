  - rule_id: PPT-ARM-TERMS.platinum_select
    condition:
      kind: procedure
      purpose: Validate that an adjustable-rate loan's index, periodic and lifetime caps, and margin match
        the published ARM parameters for the applicable decisioning score band.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Note or ARM Rider states the index type, initial cap, periodic cap, lifetime cap, and margin.


        ### Step 2 - Eligibility Verification

        - Index stated on the Note/ARM Rider is the 1 Year CMT index.

        - Caps stated on the Note/ARM Rider match 2% initial, 2% periodic, and 6% lifetime.


        ### Step 3 - Validation and Verification

        - Decisioning credit score from the Credit Report is used to identify the applicable margin band
        (760+, 720-759, 700-719), and the margin stated on the Note/ARM Rider is compared to the published
        margin for that band (3.00, 3.25, 3.50 respectively).


        ### Step 4 - Final Determination

        - ARM loan is approved on this point only when the index, caps, and margin all match the published
        parameters for the borrower''s decisioning score band.'
      checks:
      - 'Note/ARM Rider index is the 1 Year CMT index: TRUE = index condition satisfied, FALSE = index
        condition not satisfied.'
      - 'Note/ARM Rider caps match 2% initial, 2% periodic, and 6% lifetime: TRUE = cap structure condition
        satisfied, FALSE = cap structure condition not satisfied.'
      - 'Note/ARM Rider margin matches the published margin for the decisioning score band (3.00 for 760+,
        3.25 for 720-759, 3.50 for 700-719): TRUE = margin condition satisfied, FALSE = margin condition
        not satisfied.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
