        source_text: '# Operating Agreement or Bylaws Requirement - Base Version


          ## Purpose

          This JTBD confirms that the entity borrower''s Operating Agreement or Bylaws is complete, current,
          and demonstrates the entity''s authority to borrow and designated signing authority, as required
          without exception for every entity borrower.


          ## Reference Documents

          ### Entity Governance Documents

          - Operating Agreement (LLCs and Partnerships) or Bylaws (Corporations): governance terms, management
          structure, and amendments

          - Certificate of Formation / Articles of Organization: entity type used to determine which governance
          document applies


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for a complete, legible copy of the Operating Agreement or Bylaws, including
          all referenced exhibits and amendments.


          ### Step 2 - Eligibility Verification

          - Governance document states whether the entity is member-managed or manager-managed.


          ### Step 3 - Validation and Verification

          - Governance document contains authorization for the entity to borrow money and enter into mortgage
          contracts.

          - Governance document designates the individual(s) authorized to sign on behalf of the entity,
          and this designation does not conflict with the formation document.


          ### Step 4 - Final Determination

          - Operating Agreement/Bylaws requirement is satisfied and the file proceeds, or a gap is identified
          and the file is conditioned for additional information.


          ## Deterministic Validation Rules

          - A complete Operating Agreement or Bylaws document, with all referenced exhibits and amendments,
          is present in the file: TRUE = pass, FALSE = fail.

          - The governance document states the entity''s member-managed or manager-managed status: TRUE
          = pass, FALSE = fail.

          - The governance document authorizes the entity to borrow money and enter into mortgage contracts
          and designates authorized signers: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A complete governance document is on file, states the management structure, authorizes borrowing,
          and designates signers without conflicting with the formation document.


          ### Conditional

          Assign **Conditional** when:

          - The governance document is on file but conflicts with the formation document as to designated
          signers; the file may proceed with a condition for additional supporting documentation resolving
          the conflict.


          ### Fail

          Assign **Fail** when:

          - No Operating Agreement or Bylaws is present, the document is incomplete, or it does not authorize
          borrowing or designate signers.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is being made to an individual borrower rather than an entity borrower.'
        source_digest: 01dd661f8aa0b45289e1759f25f82580a4bd40298ab390479639917708c5aa09
