        source_text: '# Single-Purpose Entity Definition - Base Version


          ## Purpose

          Validate that an entity borrower meets the single-purpose entity (SPE) definition and is not
          structured as a prohibited series limited liability company.


          ## Reference Documents

          ### Entity Formation Documents

          - Operating Agreement / Certificate of Formation: states the entity''s stated business purpose
          and organizational type

          - Entity Asset Schedule / Financial Statement: lists all assets owned by the entity, when available


          ## Steps


          ### Step 1 - Initial Document Review

          - Operating Agreement or Certificate of Formation states the entity''s business purpose and
          organizational type.


          ### Step 2 - Eligibility Verification

          - Stated business purpose is limited to owning and operating residential investment or rental
          properties.

          - Certificate of Formation does not identify the entity as a series limited liability company.


          ### Step 3 - Validation and Verification

          - Entity Asset Schedule, when available, confirms the entity holds no assets other than residential
          investment or rental properties.


          ### Step 4 - Final Determination

          - Entity borrower is approved as a single-purpose entity when its stated purpose and assets
          are limited to residential investment or rental property and it is not a series LLC; entities
          holding other asset types or organized as a series LLC are not approved.


          ## Deterministic Validation Rules

          - Certificate of Formation identifies the entity as a series limited liability company: TRUE
          = entity is not eligible, FALSE = series LLC exclusion does not apply.

          - Operating Agreement / Certificate of Formation and Entity Asset Schedule show the entity''s
          assets are limited to residential investment or rental properties: TRUE = single-purpose-entity
          condition satisfied, FALSE = condition not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Entity''s stated purpose and assets are limited to residential investment or rental properties
          and it is not a series LLC.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Entity is organized as a series LLC, or its formation or asset documentation shows assets
          other than residential investment or rental properties.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual rather than an entity.'
