        reference_documents: '### Loan and Income Documents

          - Note: states the first payment amount due at origination and the amortization type (fixed,
          ARM, interest-only)

          - Rent Schedule (Form 1007/1025) and Lease Agreement: source of the qualifying gross rental
          income figure

          - Tax Certification, Hazard Insurance Policy, HOA Statement: source of the tax, insurance, and
          association fee components of the payment'
        source_text: '# DSCR Ratio Calculation - Base Version


          ## Purpose

          Compute the Debt Service Coverage Ratio by dividing qualifying gross rental income by the PITIA
          payment due under the first payment on the Note, establishing the ratio used for minimum-DSCR
          eligibility testing.


          ## Reference Documents

          ### Loan and Income Documents

          - Note: states the first payment amount due at origination and the amortization type (fixed,
          ARM, interest-only)

          - Rent Schedule (Form 1007/1025) and Lease Agreement: source of the qualifying gross rental
          income figure

          - Tax Certification, Hazard Insurance Policy, HOA Statement: source of the tax, insurance, and
          association fee components of the payment


          ## Steps


          ### Step 1 - Initial Document Review

          - Note states the first payment amount due at origination and identifies whether the loan is
          fully amortizing or interest-only.


          ### Step 2 - Eligibility Verification

          - Qualifying gross rental income figure and the PITIA payment figure are both present in the
          file and dated as of or after the credit and appraisal documentation used in underwriting.


          ### Step 3 - Validation and Verification

          - DSCR is calculated as qualifying gross rental income divided by the PITIA payment due under
          the first payment on the Note; the calculated ratio is recorded to two decimal places.


          ### Step 4 - Final Determination

          - Calculated DSCR is compared to the applicable channel minimum ratio to determine whether the
          loan meets or falls short of the required minimum ratio.


          ## Deterministic Validation Rules

          - DSCR is calculated using the first payment due under the Note, rather than a fully amortized
          payment, as the denominator basis: TRUE = calculation methodology is correct, FALSE = recalculation
          is required.

          - Where the loan is interest-only, the denominator basis is tested separately under DSCR-IO-DENOM
          (Q-21).

          - Calculated DSCR (qualifying rent divided by PITIA) is a positive numeric value greater than
          zero: TRUE = ratio is valid for comparison, FALSE = a calculation error requires correction.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - DSCR is calculated as qualifying rent divided by the first-payment-due PITIA and the resulting
          ratio is a valid positive number.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - DSCR cannot be calculated because either the qualifying rent figure or the first-payment PITIA
          figure is missing from the file.


          ### Not Applicable

          There is no case for this outcome.'
