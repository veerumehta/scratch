  - rule_id: CRD-GUAR-SCOPE.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD defines the population of individuals whose credit is reviewed on an entity-borrower
        loan and confirms that each program credit requirement is applied to every one of them. Acra requires
        all individuals with direct or indirect ownership of 20% or more to provide a joint-and-several
