  - rule_id: CRD-ONETWOSCR.platinum_select
    condition:
      kind: procedure
      purpose: Identify loan files where the borrower has one or two credit repository scores so the applicable
        tradeline overlay is applied and the unresolved decisioning-score-setting question is flagged
        for underwriter attention.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Credit Report states the number of repository scores obtained for the borrower (one, two, or
        three).


        ### Step 2 - Eligibility Verification

        - Borrower''s repository score count is confirmed to be one or two, placing the file within the
        "2 or fewer scores" tradeline category.


        ### Step 3 - Validation and Verification

        - Applicable tradeline overlay (2 tradelines/24 months or 3 tradelines/12 months) is confirmed
        as satisfied for the one- or two-score borrower.


        ### Step 4 - Final Determination

        - File with a one- or two-score borrower is approved on this point only when the applicable tradeline
        overlay is satisfied; the file is flagged for underwriter review of how the decisioning score
        itself is set, since the source guideline does not state the methodology for one or two scores.'
      checks:
      - 'Borrower has exactly one or two repository scores on the Credit Report: TRUE = tradeline overlay
        category applies and file is flagged for decisioning-score-methodology review, FALSE = three-score
        methodology applies instead.'
      - 'Applicable tradeline overlay (2 tradelines/24 months or 3 tradelines/12 months) is satisfied
        for the one- or two-score borrower: TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 10
    description: Identifies applicants with one or two credit repository scores, applies the corresponding
      tradeline overlay, and flags the file for underwriter confirmation since the source guideline does
      not state how the decisioning score itself is set in this scenario.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 10
        section_type: Credit
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Number of Repository Scores
          metric_key: CreditReport.scores
          metric_mnemonic: CRD_ONETWOSCR_LM1
          indicator_context: Count the entries in CreditReport.scores (one per repository) for each borrower
            / guarantor. Indicator is 'Not Applicable' when score_count = 3; 'Conditional' when score_count
            is 1 or 2 (apply the 2-tradelines/24-months or 3-tradelines/12-months overlay and flag for
            underwriter confirmation of the decisioning score, Q-05); 'Fail' when score_count = 0 since
            no no-score pathway is published. Do not populate borrower_ids for this unified metric under
            any circumstance.
          description_template: 'Repository scores: {score_count} (3 = no overlay; 1-2 = tradeline overlay;
            0 = ineligible)'
        entity_types:
        - name: CreditReport
          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        extraction_targets:
        - description: Repository score count and tradeline depth
          entity_type: CreditReport
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Credit Documents

          - Credit Report: states the number of repository scores obtained for the borrower'
        source_text: '# One or Two Repository Score Treatment - Base Version


          ## Purpose

          Identify loan files where the borrower has one or two credit repository scores so the applicable
          tradeline overlay is applied and the unresolved decisioning-score-setting question is flagged
          for underwriter attention.


          ## Reference Documents

          ### Credit Documents

          - Credit Report: states the number of repository scores obtained for the borrower


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report states the number of repository scores obtained for the borrower (one, two,
          or three).


          ### Step 2 - Eligibility Verification

          - Borrower''s repository score count is confirmed to be one or two, placing the file within
          the "2 or fewer scores" tradeline category.


          ### Step 3 - Validation and Verification

          - Applicable tradeline overlay (2 tradelines/24 months or 3 tradelines/12 months) is confirmed
          as satisfied for the one- or two-score borrower.


          ### Step 4 - Final Determination

          - File with a one- or two-score borrower is approved on this point only when the applicable
          tradeline overlay is satisfied; the file is flagged for underwriter review of how the decisioning
          score itself is set, since the source guideline does not state the methodology for one or two
          scores.


          ## Deterministic Validation Rules

          - Borrower has exactly one or two repository scores on the Credit Report: TRUE = tradeline overlay
          category applies and file is flagged for decisioning-score-methodology review, FALSE = three-score
          methodology applies instead.

          - Applicable tradeline overlay (2 tradelines/24 months or 3 tradelines/12 months) is satisfied
          for the one- or two-score borrower: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Borrower has one or two repository scores, the applicable tradeline overlay is satisfied,
          and the file is flagged for underwriter confirmation of the decisioning-score methodology.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Borrower has one or two repository scores and the applicable tradeline overlay is not satisfied.


          ### Not Applicable

          Assign **Not Applicable** when:

          - Borrower has scores from all three repositories.'
