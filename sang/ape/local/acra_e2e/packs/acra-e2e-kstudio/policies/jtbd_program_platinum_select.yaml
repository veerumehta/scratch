        source_text: '# Minimum DSCR by Origination Channel - Base Version


          ## Purpose

          This JTBD determines whether the loan''s calculated debt service coverage ratio meets the minimum
          threshold published for its origination channel before the loan can be approved under the Platinum
          Select DSCR program.


          ## Reference Documents

          ### Loan Origination Records

          - LOS: system of record for the origination channel (Correspondent or Wholesale)


          ### DSCR Support Documents

          - Rent Schedule (Form 1007/1025): qualifying rent used in the DSCR numerator

          - DSCR Calculation Worksheet: computed ratio and its underlying PITIA denominator


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS origination channel field (Correspondent or Wholesale) is populated for the loan.

          - DSCR calculation worksheet showing the computed ratio is present in the file.


          ### Step 2 - Eligibility Verification

          - Calculated DSCR value on the worksheet is compared against the minimum threshold applicable
          to the loan''s origination channel.


          ### Step 3 - Validation and Verification

          - DSCR calculation''s numerator (qualifying rent) traces to the rent schedule in the file and
          its denominator (PITIA) traces to the payment and escrow figures in the file.


          ### Step 4 - Final Determination

          - Loan''s calculated DSCR meets or fails its channel''s minimum ratio and is approved or declined
          accordingly.


          ## Deterministic Validation Rules

          - LOS origination channel is Correspondent and the calculated DSCR is 1.20 or greater: TRUE
          = pass, FALSE = fail.

          - LOS origination channel is Wholesale and the calculated DSCR is 1.00 or greater: TRUE = pass,
          FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The calculated DSCR is 1.20 or greater for a Correspondent-channel loan, or 1.00 or greater
          for a Wholesale-channel loan.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The calculated DSCR is below 1.20 for a Correspondent-channel loan, or below 1.00 for a Wholesale-channel
          loan.


          ### Not Applicable

          There is no case for this outcome — every Platinum Select DSCR loan is subject to a channel-specific
          minimum ratio.'
        source_digest: 6a5c8813e4a9f5aeafe7cf1f673a1fc781b3e8ad9763090372ea895147a30f67
        section: Loan Program Eligibility
        mnemonic: LPE-MIN-DSCR
