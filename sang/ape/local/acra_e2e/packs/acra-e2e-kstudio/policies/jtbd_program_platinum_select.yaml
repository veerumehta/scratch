        notes: 'Ontology gap: no entity-ownership-percent field on Borrower; guarantor population is derived
          from Operating Agreement / ownership evidence.'
        entity_types:
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
            dates
        - name: CreditReport
          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        extraction_targets:
        - description: Guarantor records for every 20%+ owner
          entity_type: Borrower
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - CREATE
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Entity Documents

          - Operating Agreement / Bylaws and ownership evidence: owners and ownership percentages, direct
          and indirect

          - Personal Guarantee(s) (Exhibit 7 or Acra-approved): executed guarantors

          ### Credit Documentation

          - Tri-merge Credit Report for each guarantor: scores, tradelines, mortgage / rental history,
          public records

          - Loan Application (1003) for each guarantor: declarations of prior credit events'
        source_text: '# Guarantor Credit Review Scope - Base Version


          ## Purpose

          This JTBD defines the population of individuals whose credit is reviewed on an entity-borrower
          loan and confirms that each program credit requirement is applied to every one of them. Acra
          requires all individuals with direct or indirect ownership of 20% or more to provide a joint-and-several
          recourse guarantee, reviews the background of the entity, the recourse guarantors and any party
          owning 20% or more or having managing control, and requires housing-history documentation for
          the "borrower and / or guarantor(s)". The decisioning credit score (CRD-DECSCORE) is drawn from
          one guarantor, but the minimum score, tradeline, 0x30x12 and 48-month seasoning requirements
          are borrower-level standards that apply to each guarantor. Whether "Applicant" in the forbearance
          / mortgage-late provision includes guarantors is an open point (Acra confirmation requested
          → Q-17).


          ## Reference Documents

          ### Entity Documents

          - Operating Agreement / Bylaws and ownership evidence: owners and ownership percentages, direct
          and indirect

          - Personal Guarantee(s) (Exhibit 7 or Acra-approved): executed guarantors

          ### Credit Documentation

          - Tri-merge Credit Report for each guarantor: scores, tradelines, mortgage / rental history,
          public records

          - Loan Application (1003) for each guarantor: declarations of prior credit events


          ## Steps


          ### Step 1 - Initial Document Review

          - Ownership evidence identifies every individual with 20% or greater direct or indirect ownership;
          the list is reconciled with the executed personal guarantees.


          ### Step 2 - Eligibility Verification

          - A tri-merge credit report is in the file for each identified guarantor.


          ### Step 3 - Validation and Verification

          - For each guarantor, the file records the outcome of the minimum-score, tradeline, 0x30x12
          housing-history and 48-month previous-credit-event evaluations; any guarantor failing a requirement
          is identified.


          ### Step 4 - Final Determination

          - All guarantors have been evaluated and meet each credit requirement and the file proceeds,
          or a guarantor is missing from the review or fails a requirement and the file is conditioned
          or declined.


          ## Deterministic Validation Rules

          - Every individual with 20% or greater direct or indirect ownership per the Operating Agreement
          / ownership evidence has executed a personal guarantee: TRUE = pass, FALSE = fail.

          - Every guarantor has a credit report in the file: TRUE = pass, FALSE = fail.

          - Every guarantor has a recorded outcome for CRD-MINSCORE, CRD-TRADELINE, CRD-HOUSHIST and CRD-PCESEASON:
          TRUE = pass, FALSE = fail.

          - No guarantor has a Fail outcome on any of those four JTBDs: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Every 20%-or-greater owner is a guarantor with a credit report and passes each program credit
          requirement.


          ### Conditional

          Assign **Conditional** when:

          - All guarantors are identified and pass, but a guarantor''s file relies on the forbearance
          / late alternative documentation whose application to guarantors awaits Acra''s response (Q-17c).


          ### Fail

          Assign **Fail** when:

          - A 20%-or-greater owner has not guaranteed, lacks a credit report, has not been evaluated,
          or fails any program credit requirement.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual (or a revocable trust of individuals) and no entity borrower
          is on the loan.'
        source_digest: 498d34ffbb5d74186e7bdd13fa9a3f2c42f168419ed68cd14c7d86ac5aea1029
        section: Credit Review & Analysis
        mnemonic: CRD-GUAR-SCOPE
        also_as:
          standard: CRD-GUAR-SCOPE
