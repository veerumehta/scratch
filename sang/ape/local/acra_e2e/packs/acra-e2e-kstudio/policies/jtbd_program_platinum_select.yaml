        ### Step 1 - Initial Document Review

        - Operating Agreement or Bylaws states the ownership percentage for each guarantor on the entity-borrower
        loan.


        ### Step 2 - Eligibility Verification

        - Ownership percentages are compared across all guarantors to determine whether two or more guarantors
        hold an equal largest ownership interest while overall ownership is not equal across all guarantors.


        ### Step 3 - Validation and Verification

        - Credit Report middle scores are obtained for each guarantor holding the tied largest ownership
        interest.


        ### Step 4 - Final Determination

        - File is flagged for underwriter confirmation of which tied guarantor''s score is used as the
        decisioning score whenever the tied-largest-ownership scenario is identified; the file does not
        proceed on an assumed score selection.'
      checks:
      - 'Two or more guarantors hold an equal largest ownership interest and ownership is not equal across
        all guarantors on the entity-borrower loan: TRUE = file is flagged for underwriter confirmation
        of score selection, FALSE = the standard ownership-based score selection rule applies.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
