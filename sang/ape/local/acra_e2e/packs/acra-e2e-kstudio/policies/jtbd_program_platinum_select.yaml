          metric_mnemonic: CRD_TRDLN_LM1
          indicator_context: Compare CreditReport.open_trade_lines and CreditReport.oldest_trade_line_date
            against the applicable tradeline depth requirement (2 tradelines/24 months or 3 tradelines/12
