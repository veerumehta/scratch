          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Asset Documents

          - Bank Statements / VOD: balances, deposit history and account ownership for every account relied
          on

          - Gift Letter and evidence of transfer: where gift funds are used (see AFC-GIFT-MIN)

          - Closing Disclosure / Settlement Statement: funds required from borrower and their disbursement
          source

          ### Acra Guidance

          - Acra Seller''s Guide, unacceptable sources of funds provision: list of prohibited sources'
        source_text: '# Unacceptable Sources of Funds - Base Version


          ## Purpose

          This JTBD confirms that the funds used to close and the reserves counted toward any trigger
          do not derive from a source Acra''s Seller''s Guide designates as unacceptable. The Platinum
          Summary''s Reserve Requirements panel refers to "guidelines for unacceptable source of funds";
          the governing Seller''s Guide provision is not reproduced in the consolidation (Appendix B.3),
          so this JTBD applies the Seller''s Guide list and conditions any question of interpretation
          for Acra (Acra confirmation requested → Q-20).


          ## Reference Documents

          ### Asset Documents

          - Bank Statements / VOD: balances, deposit history and account ownership for every account relied
          on

          - Gift Letter and evidence of transfer: where gift funds are used (see AFC-GIFT-MIN)

          - Closing Disclosure / Settlement Statement: funds required from borrower and their disbursement
          source

          ### Acra Guidance

          - Acra Seller''s Guide, unacceptable sources of funds provision: list of prohibited sources


          ## Steps


          ### Step 1 - Initial Document Review

          - Every account or asset relied on for funds to close or reserves is identified on the asset
          documentation and tied to the Closing Disclosure.


          ### Step 2 - Eligibility Verification

          - Each relied-on asset is classified by source; any source appearing on the Seller''s Guide
          unacceptable list (for example unsecured borrowed funds, cash on hand, undocumented large deposits,
          or contributions from an interested party outside a permitted gift) is flagged.


          ### Step 3 - Validation and Verification

          - Large or irregular deposits within the documentation period are sourced with supporting evidence,
          and gift funds are reconciled with the borrower''s own 10% contribution.


          ### Step 4 - Final Determination

          - Funds to close and counted reserves are confirmed to derive only from acceptable, documented
          sources, or the unacceptable or unsourced funds are excluded and the file is re-tested for sufficiency.


          ## Deterministic Validation Rules

          - Every relied-on asset has a documented source not on the Seller''s Guide unacceptable list:
          TRUE = pass, FALSE = fail.

          - Every large or irregular deposit within the documentation period is sourced: TRUE = pass,
          FALSE = conditional.

          - After excluding unacceptable or unsourced funds, verified funds still cover funds to close
          plus required reserves: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - All funds relied on for closing and reserves derive from acceptable, documented sources and
          any large deposits are sourced.


          ### Conditional

          Assign **Conditional** when:

          - A large or irregular deposit is unsourced but the remaining verified funds still cover closing
          and reserves; the file proceeds pending sourcing documentation.


          ### Fail

          Assign **Fail** when:

          - Any relied-on funds derive from an unacceptable source, or excluding unacceptable or unsourced
          funds leaves verified funds short of funds to close plus required reserves.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: cc1c7861909a82f16c12e368e72e28f4de4a088c780b7c90c4bbce9c033ff79a
        section: Asset Assessment
        mnemonic: AFC-UNACCEPT-SRC
