        source_text: '# Cash-Out Refinance Current Lease Requirement - Base Version


          ## Purpose

          This JTBD confirms that a current lease agreement is on file for the subject property whenever
          the loan''s purpose is a Cash-Out Refinance, as the Platinum Select program conditions this
          transaction type on an in-force lease.


          ## Reference Documents

          ### Loan Origination Records

          - LOS: system of record for the loan purpose field


          ### Lease and Rent Documents

          - Current Lease Agreement: tenant, term, and subject property address

          - Rent Schedule (Form 1007/1025): supporting market rent documentation


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for the presence of a current lease agreement for the subject property.


          ### Step 2 - Eligibility Verification

          - LoanCore.loan_purpose value of Cash-Out Refinance is confirmed, which triggers the current-lease
          requirement.


          ### Step 3 - Validation and Verification

          - Lease agreement term has not expired as of the application date.

          - Lease agreement''s property address matches the subject property address.


          ### Step 4 - Final Determination

          - Current lease requirement is satisfied for the cash-out transaction and the file proceeds,
          or the requirement is unmet and the file is conditioned or declined.


          ## Deterministic Validation Rules

          - LoanCore.loan_purpose equals Cash-Out Refinance and a lease agreement is present in the file:
          TRUE = pass, FALSE = fail.

          - The lease agreement''s term has not expired as of the application date: TRUE = pass, FALSE
          = fail.

          - The lease agreement''s property address matches the subject property address: TRUE = pass,
          FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The transaction is a Cash-Out Refinance and the file contains a current, unexpired lease agreement
          matching the subject property address.


          ### Conditional

          Assign **Conditional** when:

          - The transaction is a Cash-Out Refinance with a lease agreement pending renewal signature;
          the file may proceed with a condition to provide the renewed lease prior to closing.


          ### Fail

          Assign **Fail** when:

          - The transaction is a Cash-Out Refinance and no lease agreement is present, the lease has expired,
          or the address on the lease does not match the subject property.


          ### Not Applicable

          Assign **Not Applicable** when:

          - LoanCore.loan_purpose is not Cash-Out Refinance.'
