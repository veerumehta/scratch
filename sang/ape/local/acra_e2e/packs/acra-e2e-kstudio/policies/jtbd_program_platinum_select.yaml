          - Loan Application (1003): Identifies the subject property unit count to determine which rent-schedule
          form applies.


          ---'
        source_text: '# Rent Schedule Form Requirement - Base Version


          ## Purpose

          This JTBD verifies that the loan file contains the appraisal-form-based rent schedule required
          to establish market rent for DSCR qualification on the subject property.


          ## Reference Documents

          ### Appraisal Documents

          - Appraisal Report: Provides the form type (1007 or 1025) and the market rent conclusion used
          for DSCR qualification.

          - Loan Application (1003): Identifies the subject property unit count to determine which rent-schedule
          form applies.


          ---


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal Report file identifies the completed rent-schedule addendum and its form type field.

          - Loan Application (1003) subject property section shows the number of units on the subject
          property.


          ### Step 2 - Eligibility Verification

          - Appraisal Report form type field is populated with a recognized rent-schedule form designation
          for the property''s unit count.

          - Appraisal Report market rent conclusion is present and dated no earlier than the note date
          minus the program''s appraisal currency window.


          ### Step 3 - Validation and Verification

          - Appraisal Report form type matches the subject property unit count recorded on the Loan Application
          (1003).

          - Appraiser license number and state on the Appraisal Report are present and unexpired as of
          the appraisal effective date.


          ### Step 4 - Final Determination

          - Loan file evidences a rent-schedule form whose type is consistent with the subject property''s
          unit count and whose market rent conclusion is dated and legible: gate to Pass.

          - Loan file lacks a rent-schedule form or shows a form type inconsistent with the subject unit
          count: gate to Fail or Conditional per the outcome rules below.


          ---


          ## Deterministic Validation Rules

          - Appraisal Report form_type field is populated: TRUE = pass, FALSE = fail.

          - A single-family subject property (1 unit) has an appraisal form_type recognized as a single-family
          comparable rent schedule (Form 1007): TRUE = pass, FALSE = fail.

          - A two-unit subject property has an appraisal form_type recognized as a small residential income
          property appraisal (Form 1025): TRUE = pass, FALSE = fail.

          - Appraisal Report effective_date is on or before the loan''s expected closing date: TRUE =
          pass, FALSE = fail.


          ---


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The Appraisal Report form_type matches the required rent-schedule form for the subject property''s
          unit count and a market rent conclusion is present.


          ### Conditional

          Assign **Conditional** when:

          - A rent-schedule form is on file but the form type field is illegible or missing, pending a
          corrected or re-issued appraisal exhibit from the appraiser.


          ### Fail

          Assign **Fail** when:

          - No rent-schedule appraisal form is present in the file, or the form type on file does not
          correspond to the subject property''s unit count.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 47fc2be0ef9d8bab86c5ef30d8ab7d266fdfaa41773131128153b2085e0bff06
