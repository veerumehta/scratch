        source_text: '# Foreign-Held Funds Repatriation - Base Version


          ## Purpose

          Verify that funds to close held in a foreign bank account or foreign currency are repatriated
          to a US account within the required timing before closing.


          ## Reference Documents

          ### Asset Documents

          - Foreign Bank Statement: evidences funds held in a foreign account or currency

          - Domestic Bank Statement / Wire Transfer Confirmation: evidences repatriation of the funds
          into a US account

          - Closing Disclosure: states the scheduled closing date


          ## Steps


          ### Step 1 - Initial Document Review

          - Foreign Bank Statement is present in the file identifying funds held in a foreign account
          or currency that will be used for closing.


          ### Step 2 - Eligibility Verification

          - Domestic Bank Statement or Wire Transfer Confirmation evidences the transfer of the foreign-held
          funds into a US account.


          ### Step 3 - Validation and Verification

          - Date of the domestic deposit or wire transfer confirmation is compared to the scheduled closing
          date on the Closing Disclosure to confirm at least three business days between repatriation
          and closing.


          ### Step 4 - Final Determination

          - Foreign-held funds are approved for use in closing only when repatriation into a US account
          is documented at least three business days prior to the scheduled closing date.


          ## Deterministic Validation Rules

          - Domestic Bank Statement or Wire Transfer Confirmation shows the foreign-held funds deposited
          into a US account at least 3 business days before the scheduled closing date: TRUE = pass, FALSE
          = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Foreign-held funds are repatriated into a US account at least three business days before the
          scheduled closing date.


          ### Conditional

          Assign **Conditional** when:

          - Foreign-held funds are identified in the file but the domestic deposit or wire transfer confirming
          repatriation has not yet been provided.


          ### Fail

          Assign **Fail** when:

          - Foreign-held funds are identified and repatriation is documented fewer than three business
          days before closing, or is not documented at all.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No funds to close are held in a foreign bank account or foreign currency.'
        source_digest: 72e91e0f6f2b938aa6142277e072fe38cd8ef510ed36659b69cc46a6a923bbf1
