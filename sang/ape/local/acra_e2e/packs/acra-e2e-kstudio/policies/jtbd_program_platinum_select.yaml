  - rule_id: LFC-AMT-STEPDN.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD determines whether a Platinum Select DSCR loan's base loan amount falls outside
        the $350,000-$1,500,000 band that carries the standard matrix cap, and if so, applies the reduced
        75.00% maximum CLTV that governs loans below $350,000 or above $1,500,000.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - LOS loan record shows a base loan amount for the transaction.


        ### Step 2 - Eligibility Verification

        - Base loan amount is classified as below $350,000, above $1,500,000, or within the $350,000-$1,500,000
        band.


        ### Step 3 - Validation and Verification

        - Where base loan amount is below $350,000 or above $1,500,000, LOS proposed CLTV does not exceed
        75.00%.


        ### Step 4 - Final Determination

        - LOS proposed CLTV is compared against 75.00% for loans outside the $350,000-$1,500,000 band
        to reach a pass/fail determination; loans within the band are evaluated instead under the standard
        FICO/purpose matrix cap.'
      checks:
      - 'Base loan amount < $350,000 OR base loan amount > $1,500,000: TRUE = the 75.00% CLTV step-down
        cap applies, FALSE = the standard matrix cap applies instead.'
      - 'Where the step-down cap applies: LOS proposed CLTV percent <= 75.00% is TRUE = pass, FALSE =
        fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
