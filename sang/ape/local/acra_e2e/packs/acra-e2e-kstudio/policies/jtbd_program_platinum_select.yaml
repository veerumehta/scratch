  - rule_id: LPE-DECL-MKT.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD verifies that a 5-percentage-point CLTV reduction has been applied when the subject
        property is identified as being in a declining market, against the borrower's full credit and
        property profile.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Appraisal Report neighborhood/market conditions section indicates whether the market is identified
        as declining.

        - LOS Loan Record CLTV field is populated with the matrix-derived CLTV prior to any declining-market
        reduction.


        ### Step 2 - Eligibility Verification

        - Declining market designation on the Appraisal Report is confirmed against the matrix-derived
        CLTV applicable to the borrower''s FICO tier and loan purpose.

        - Adjusted CLTV is calculated by reducing the matrix-derived CLTV by 5 percentage points when
        a declining market is identified.


        ### Step 3 - Validation and Verification

        - LOS Loan Record CLTV used in the credit decision reflects the 5-percentage-point reduction when
        the Appraisal Report identifies a declining market.

        - Reduction is applied against the full matrix-derived CLTV applicable to the borrower''s profile,
        not against a partial or already-capped figure.


        ### Step 4 - Final Determination

        - Appraisal Report identifies a declining market and the LOS Loan Record CLTV reflects the 5-percentage-point
        reduction: gate to Pass.

        - Appraisal Report identifies a declining market and the LOS Loan Record CLTV does not reflect
        the reduction: gate to Fail.


        ---'
      checks:
      - 'Appraisal Report market conditions section identifies the subject property''s market as declining:
        TRUE = declining-market adjustment applies, FALSE = adjustment does not apply.'
      - 'Where the adjustment applies, LOS Loan Record cltv_percent is less than or equal to the matrix-derived
        CLTV minus 5 percentage points: TRUE = pass, FALSE = fail.'
