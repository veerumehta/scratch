          description_template: 'ARM Margin: {arm_margin_percent}% (Index: {arm_index_type})'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: CreditReport
          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        extraction_targets:
        - description: ARM index, caps and margin
          entity_type: LoanCore
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### ARM Terms Documents

          - Note / ARM Rider: states the index, initial cap, periodic cap, lifetime cap, and margin

          - Credit Report: states the decisioning credit score used to determine the applicable margin
          band'
        source_text: '# ARM Index, Caps and Margin Verification - Base Version


          ## Purpose

          Validate that an adjustable-rate loan''s index, periodic and lifetime caps, and margin match
          the published ARM parameters for the applicable decisioning score band.


          ## Reference Documents

          ### ARM Terms Documents

          - Note / ARM Rider: states the index, initial cap, periodic cap, lifetime cap, and margin

          - Credit Report: states the decisioning credit score used to determine the applicable margin
          band


          ## Steps


          ### Step 1 - Initial Document Review

          - Note or ARM Rider states the index type, initial cap, periodic cap, lifetime cap, and margin.


          ### Step 2 - Eligibility Verification

          - Index stated on the Note/ARM Rider is the 1 Year CMT index.

          - Caps stated on the Note/ARM Rider match 2% initial, 2% periodic, and 6% lifetime.


          ### Step 3 - Validation and Verification

          - Decisioning credit score from the Credit Report is used to identify the applicable margin
          band (760+, 720-759, 700-719), and the margin stated on the Note/ARM Rider is compared to the
          published margin for that band (3.00, 3.25, 3.50 respectively).


          ### Step 4 - Final Determination

          - ARM loan is approved on this point only when the index, caps, and margin all match the published
          parameters for the borrower''s decisioning score band.


          ## Deterministic Validation Rules

          - Note/ARM Rider index is the 1 Year CMT index: TRUE = index condition satisfied, FALSE = index
          condition not satisfied.

          - Note/ARM Rider caps match 2% initial, 2% periodic, and 6% lifetime: TRUE = cap structure condition
          satisfied, FALSE = cap structure condition not satisfied.

          - Note/ARM Rider margin matches the published margin for the decisioning score band (3.00 for
          760+, 3.25 for 720-759, 3.50 for 700-719): TRUE = margin condition satisfied, FALSE = margin
          condition not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Index, caps, and margin on the Note/ARM Rider all match the published parameters for the applicable
          decisioning score band.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Index, caps, or margin on the Note/ARM Rider do not match the published parameters for the
          applicable decisioning score band.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan product is a fixed-rate loan rather than an ARM.'
        source_digest: 1aa9e5612b549a31db914af12db294b7f95a231ce4622a9ed1c72bb384cbb7cf
