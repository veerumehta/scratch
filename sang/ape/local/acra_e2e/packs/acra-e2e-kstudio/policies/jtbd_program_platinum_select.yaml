        source_text: '# Borrower Citizenship Eligibility - Base Version


          ## Purpose

          Confirm each borrower on the loan application holds an eligible citizenship or residency status
          before the loan advances in underwriting.


          ## Reference Documents

          ### Identification Documents

          - Loan Application (1003): states each borrower''s citizenship status

          - Government-Issued Photo ID: evidences citizenship status

          - Permanent Resident Alien Card (PRA ID): evidences permanent resident status, when applicable


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application citizenship status field is populated for each borrower on the transaction.

          - Government-Issued Photo ID or Permanent Resident Alien Card is present in the file for each
          borrower.


          ### Step 2 - Eligibility Verification

          - Each borrower''s citizenship status field on the Loan Application is set to either US Citizen
          or Permanent Resident Alien.


          ### Step 3 - Validation and Verification

          - Citizenship status declared on the Loan Application matches the type of identification document
          provided in the file (US passport or state ID for a US Citizen; PRA ID for a Permanent Resident).


          ### Step 4 - Final Determination

          - Loan is eligible on citizenship grounds only when every borrower''s declared and documented
          status is US Citizen or Permanent Resident Alien; any other status returns the file as ineligible.


          ## Deterministic Validation Rules

          - Loan Application citizenship status field for every borrower is set to US Citizen or Permanent
          Resident Alien: TRUE = pass, FALSE = fail.

          - Identification document type on file matches the declared citizenship status for each borrower:
          TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Every borrower''s citizenship status is US Citizen or Permanent Resident Alien, supported
          by matching identification documentation.


          ### Conditional

          Assign **Conditional** when:

          - A borrower''s citizenship status field is populated but the corresponding identification document
          has not yet been provided in the file.


          ### Fail

          Assign **Fail** when:

          - Any borrower''s citizenship status is Non-Permanent Resident, Foreign National, or any status
          other than US Citizen or Permanent Resident Alien.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 36eb1c89f3094b8558c238727eac0e67def660a5683da48d29152e5638ba7338
