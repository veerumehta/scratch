        reference_documents: '### Property Documents

          - Appraisal Report: appraiser''s occupancy observation for the subject property


          ### Lease Documents

          - Current Lease Agreement: evidence of an active tenant in place at the subject property'
        source_text: '# Vacant Property Ineligibility - Base Version


          ## Purpose

          This JTBD determines whether the subject property is vacant, which disqualifies the loan from
          the Platinum Select DSCR program regardless of transaction purpose.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: appraiser''s occupancy observation for the subject property


          ### Lease Documents

          - Current Lease Agreement: evidence of an active tenant in place at the subject property


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal report and lease agreement, if any, are reviewed for the occupancy status of the
          subject property.


          ### Step 2 - Eligibility Verification

          - Loan file is checked for the presence of a signed, active lease agreement for the subject
          property.


          ### Step 3 - Validation and Verification

          - Appraisal report''s occupancy observation is cross-checked against the lease agreement to
          confirm a tenant is in place at the time of appraisal.


          ### Step 4 - Final Determination

          - Subject property is confirmed non-vacant and the file proceeds, or the property is identified
          as vacant and the loan is declined as ineligible.


          ## Deterministic Validation Rules

          - Appraisal report occupancy observation for the subject property does not indicate the property
          is vacant: TRUE = pass, FALSE = fail.

          - A signed, active lease agreement for the subject property is present in the loan file: TRUE
          = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The appraisal report confirms tenant occupancy and an active lease agreement for the subject
          property is on file.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The appraisal report identifies the subject property as vacant, or no active lease agreement
          can be produced for the subject property.


          ### Not Applicable

          There is no case for this outcome — vacancy status must be confirmed on every Platinum Select
          DSCR loan.'
