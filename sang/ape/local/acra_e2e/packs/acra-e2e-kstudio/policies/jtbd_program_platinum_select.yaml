          metric_mnemonic: LPE_PURPOSE_LM1
          indicator_context: 'Compare LoanCore.loan_purpose against the Platinum Select eligible purpose
            list (Purchase, Rate & Term Refinance, Cash-Out Refinance, Delayed Financing). Indicator is
            ''Pass'' when loan_purpose matches one of the eligible values; ''Fail'' otherwise. Cross-verify
            with the purchase contract or payoff statement in the file; on mismatch use the document-extracted
            value. Do not populate borrower_ids for this unified metric under any circumstance. Ontology
            enum mapping: Purchase -> ''Purchase''; Rate & Term -> ''RefinanceRateAndTerm''; Cash-Out
            -> ''RefinanceCashOut''; Delayed Financing is recorded as ''RefinanceCashOut'' with the delayed-financing
            indicator from the LOS.'
          description_template: 'Loan Purpose: {loan_purpose} (eligible: Purchase, R&T Refi, Cash-Out
            Refi, Delayed Financing)'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        extraction_targets:
        - description: Loan purpose
          entity_type: LoanCore
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Loan Origination Records

          - LOS: system of record for the loan purpose field

          - Loan Application (1003): borrower-declared transaction purpose


          ### Transaction Support Documents

          - Purchase Contract: required for purchase transactions

          - Payoff Statement / Note Being Refinanced: required for rate & term or cash-out refinance transactions

          - Prior Settlement Statement: required for delayed financing transactions'
        source_text: '# Eligible Loan Purpose Types - Base Version


          ## Purpose

          This JTBD determines whether the loan''s stated transaction purpose falls within the set of
          loan purposes Acra publishes as eligible for the Platinum Select DSCR program and that it is
          supported by the corresponding transaction document.


          ## Reference Documents

          ### Loan Origination Records

          - LOS: system of record for the loan purpose field

          - Loan Application (1003): borrower-declared transaction purpose


          ### Transaction Support Documents

          - Purchase Contract: required for purchase transactions

          - Payoff Statement / Note Being Refinanced: required for rate & term or cash-out refinance transactions

          - Prior Settlement Statement: required for delayed financing transactions


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS loan purpose field is populated for the loan.

          - Corresponding transaction support document (purchase contract, payoff statement, or prior
          settlement statement) is present in the file.


          ### Step 2 - Eligibility Verification

          - LoanCore.loan_purpose value is one of: Purchase, Rate & Term Refinance, Cash-Out Refinance,
          Delayed Financing.


          ### Step 3 - Validation and Verification

          - Supporting transaction document in the file matches the declared loan purpose (e.g., a purchase
          contract is present when loan_purpose is Purchase).


          ### Step 4 - Final Determination

          - Transaction purpose is confirmed as an eligible type and consistent with its supporting document,
          or the file is declined/reclassified for an ineligible or unsupported purpose.


          ## Deterministic Validation Rules

          - LoanCore.loan_purpose is one of Purchase, Rate & Term Refinance, Cash-Out Refinance, or Delayed
          Financing: TRUE = pass, FALSE = fail.

          - The supporting transaction document present in the file matches the declared loan purpose:
          TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - LoanCore.loan_purpose is an eligible type and the supporting transaction document in the file
          matches that purpose.


          ### Conditional

          Assign **Conditional** when:

          - The loan purpose is eligible but the matching supporting document (e.g., a final executed
          purchase contract) is outstanding; the file may proceed pending receipt prior to closing.


          ### Fail

          Assign **Fail** when:

          - LoanCore.loan_purpose is not one of the four eligible types, or the supporting documentation
          in the file contradicts the stated purpose.


          ### Not Applicable

          There is no case for this outcome — every Platinum Select DSCR loan must have a stated, verifiable
          loan purpose.'
        source_digest: ed881be28ba43c1778babce2e006fde37f2582f793ce4befc0c3aa79dd4dbb28
        section: Loan Program Eligibility
        mnemonic: LPE-PURPOSE
        also_as:
          standard: LPE-PURPOSE
