        source_text: '# Minimum Decisioning Score and Correspondent CLTV Cap - Base Version


          ## Purpose

          Verify the decisioning credit score meets the minimum threshold for program eligibility and
          apply the Correspondent-channel CLTV restriction for scores in the 700-719 band.


          ## Reference Documents

          ### Credit and Loan Documents

          - Credit Report: provides the decisioning score used for the minimum-score test

          - Loan Application (1003) / Rate Lock Agreement: identifies the origination channel as Correspondent
          or Wholesale


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report is present and states the decisioning score identified for the loan.


          ### Step 2 - Eligibility Verification

          - Decisioning score is confirmed to be at or above 700.


          ### Step 3 - Validation and Verification

          - Origination channel (Correspondent or Wholesale) is identified from the Loan Application or
          Rate Lock Agreement.

          - For a Correspondent-channel loan with a decisioning score of 700-719, the combined loan-to-value
          ratio is checked against the 60% cap.


          ### Step 4 - Final Determination

          - Loan is eligible on minimum-score grounds only when the decisioning score is 700 or higher;
          a Correspondent-channel loan with a 700-719 score is further limited to a maximum CLTV of 60%.


          ## Deterministic Validation Rules

          - Decisioning score is at or above 700: TRUE = pass, FALSE = fail.

          - Origination channel is Correspondent and decisioning score is 700-719 and CLTV exceeds 60%:
          TRUE = fail, FALSE = pass.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Decisioning score is 700 or higher, and for a Correspondent-channel loan with a score of 700-719,
          CLTV does not exceed 60%.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Decisioning score is below 700, or the loan is Correspondent-channel with a 700-719 score
          and CLTV exceeds 60%.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: c001e0f516fcec599d4ca841febfe831a5501791be19c265b76e69c5420498de
        section: Credit Review & Analysis
        mnemonic: CRD-MINSCORE
