          ## Reference Documents

          ### Entity Ownership Documents

          - Operating Agreement / Bylaws: current version and all amendments, with amendment dates

          - Unanimous Written Consent / Amendment History: records the date and nature of any ownership-percentage
          change

          - Loan Application: states the Application Date


          ## Steps


          ### Step 1 - Initial Document Review

          - Operating Agreement or Bylaws amendment history is reviewed for any change to ownership percentages.


          ### Step 2 - Eligibility Verification

          - Date of any ownership-percentage amendment is compared against the Application Date stated
          on the Loan Application.


          ### Step 3 - Validation and Verification

          - An amendment dated within 30 days prior to the Application Date, or dated during the application
          process, is identified as falling within the lookback restriction.


          ### Step 4 - Final Determination

          - Ownership percentages used for guarantee determination are based on the pre-amendment ownership
          when an amendment falls within the lookback restriction; amendments outside the restriction
          are recognized as filed.


          ## Deterministic Validation Rules

          - Ownership-percentage amendment is dated within 30 days prior to the Application Date or during
          the application process: TRUE = amendment is not recognized for guarantee determination, FALSE
          = amendment is recognized.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - No ownership-percentage amendment exists within the 30-day lookback period or during the application
          process, or the entity''s ownership percentages are unchanged.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - An ownership-percentage amendment dated within the lookback restriction is relied on to reduce
          a guarantor''s ownership below the 20% guarantee threshold.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual rather than an entity, and no ownership-percentage amendment
          applies.'
        source_digest: bdd7a75df16317b2f2506177e9bf20fa52fd213982f8bb47637b0779579faf58
        section: Compliance and Closing
        mnemonic: BET-OWNCHG-LOOKBACK
