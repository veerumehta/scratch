          metric_key: SubjectProperty.occupancy_type
          metric_mnemonic: PRE_VACANT_LM1
          indicator_context: Read SubjectProperty.occupancy_type together with the appraisal's occupancy
            observation and the current lease. Indicator is 'Pass' when the subject is tenant-occupied
            (Non-Owner Occupied with a current lease and no vacancy indication on the appraisal); 'Fail'
            when the appraisal or lease evidence indicates the subject is vacant. Cross-verify with the
            appraisal report; on mismatch use the appraisal-extracted value. Do not populate borrower_ids
            for this unified metric under any circumstance.
          description_template: 'Occupancy: {occupancy_type}; appraisal vacancy indication: {vacancy_indicated}'
        entity_types:
