      purpose: Verify credit report tradeline depth and history length meet the applicable requirement
        based on the number of repository scores obtained for the borrower.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Credit Report states the number of repository scores obtained (one, two, or three) for the borrower.


        ### Step 2 - Eligibility Verification

        - Credit Report open trade lines and oldest trade line date are reviewed to determine tradeline
        count and history length in months.


        ### Step 3 - Validation and Verification

        - For a borrower with two or fewer repository scores, tradeline count and history length are checked
        against the 2-tradelines/24-months or 3-tradelines/12-months alternative thresholds.


        ### Step 4 - Final Determination

        - Tradeline requirement is satisfied when the borrower has scores from all three repositories,
        or when a borrower with two or fewer scores meets the 2-tradeline/24-month or 3-tradeline/12-month
        alternative.'
