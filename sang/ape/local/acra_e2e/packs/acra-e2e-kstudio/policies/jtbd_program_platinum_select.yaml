  - rule_id: LPE-OCCUPANCY.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD determines whether the subject property's occupancy classification satisfies
        the Platinum Select DSCR program's Non-Owner Occupied requirement before the file proceeds to
        DSCR underwriting.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - LOS occupancy field for the subject property is populated with a value.

        - Loan application (1003) states the borrower''s intended occupancy for the subject property.


        ### Step 2 - Eligibility Verification

        - SubjectProperty.occupancy_type field is set to an investment/non-owner-occupied value, not Primary
        Residence or Second Home.

        - Borrower.will_occupy_as_primary_residence field is set to FALSE for the applicant(s) on this
        loan.


        ### Step 3 - Validation and Verification

        - Occupancy classification declared in LOS matches the occupancy status observed on the appraisal
        report.

        - Occupancy classification declared in LOS matches the vesting/occupancy representation in the
        title commitment.


        ### Step 4 - Final Determination

        - Occupancy classification across LOS, appraisal, and title is uniformly Non-Owner Occupied and
        the file is cleared to proceed to DSCR underwriting, or a discrepancy is identified and routed
        for correction.'
      checks:
      - 'SubjectProperty.occupancy_type field is populated with an investment/non-owner-occupied value:
        TRUE = pass, FALSE = fail.'
      - 'Borrower.will_occupy_as_primary_residence is FALSE for every borrower on the loan: TRUE = pass,
        FALSE = fail.'
      - 'Appraisal report occupancy observation and title commitment vesting representation both agree
        with the LOS occupancy classification: TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 21
    description: Confirms the subject property's occupancy is classified Non-Owner Occupied before a loan
      proceeds under the Platinum Select DSCR program, since the program is restricted to non-owner occupied
      investment property.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 21
        section_type: Eligibility
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Subject Property Occupancy Type
          metric_key: SubjectProperty.occupancy_type
          metric_mnemonic: LPE_OCC_LM1
          indicator_context: 'Compare SubjectProperty.occupancy_type against the required Non-Owner Occupied/Investment
            classification for the Platinum Select DSCR program. Indicator is ''Pass'' when the value
            is ''Investment'' (ontology enum: PrimaryResidence / SecondHome / Investment); ''Fail'' when
            it indicates Primary Residence or Second Home. Cross-verify with the appraisal report and
            title commitment; on mismatch flag for underwriter review. Do not populate borrower_ids for
            this unified metric under any circumstance.'
          description_template: 'Occupancy: {occupancy_type} (required: Non-Owner Occupied)'
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
            dates
        extraction_targets:
        - description: Occupancy type
          entity_type: SubjectProperty
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Loan Origination Records

          - LOS: system of record for the subject property occupancy field and loan purpose

          - Loan Application (1003): borrower''s declared intended occupancy for the subject property


          ### Property and Title Documents

          - Appraisal Report: appraiser''s observed occupancy status of the subject property

          - Title Commitment: vesting and occupancy representations for the subject property'
        source_text: '# Non-Owner Occupancy Requirement - Base Version


          ## Purpose

          This JTBD determines whether the subject property''s occupancy classification satisfies the
          Platinum Select DSCR program''s Non-Owner Occupied requirement before the file proceeds to DSCR
          underwriting.


          ## Reference Documents

          ### Loan Origination Records

          - LOS: system of record for the subject property occupancy field and loan purpose

          - Loan Application (1003): borrower''s declared intended occupancy for the subject property


          ### Property and Title Documents

          - Appraisal Report: appraiser''s observed occupancy status of the subject property

          - Title Commitment: vesting and occupancy representations for the subject property


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS occupancy field for the subject property is populated with a value.

          - Loan application (1003) states the borrower''s intended occupancy for the subject property.


          ### Step 2 - Eligibility Verification

          - SubjectProperty.occupancy_type field is set to an investment/non-owner-occupied value, not
          Primary Residence or Second Home.

          - Borrower.will_occupy_as_primary_residence field is set to FALSE for the applicant(s) on this
          loan.


          ### Step 3 - Validation and Verification

          - Occupancy classification declared in LOS matches the occupancy status observed on the appraisal
          report.

          - Occupancy classification declared in LOS matches the vesting/occupancy representation in the
          title commitment.


          ### Step 4 - Final Determination

          - Occupancy classification across LOS, appraisal, and title is uniformly Non-Owner Occupied
          and the file is cleared to proceed to DSCR underwriting, or a discrepancy is identified and
          routed for correction.


          ## Deterministic Validation Rules

          - SubjectProperty.occupancy_type field is populated with an investment/non-owner-occupied value:
          TRUE = pass, FALSE = fail.

          - Borrower.will_occupy_as_primary_residence is FALSE for every borrower on the loan: TRUE =
          pass, FALSE = fail.

          - Appraisal report occupancy observation and title commitment vesting representation both agree
          with the LOS occupancy classification: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - SubjectProperty.occupancy_type is Non-Owner Occupied/Investment, Borrower.will_occupy_as_primary_residence
          is FALSE, and the appraisal and title documents show no conflicting occupancy representation.


          ### Conditional

          Assign **Conditional** when:

          - Occupancy is declared Non-Owner Occupied in LOS and on the application, but one ancillary
          document (e.g., a hazard insurance binder) has not yet been updated to reflect non-owner occupancy;
          the file may proceed with a prior-to-closing condition to correct that document.


          ### Fail

          Assign **Fail** when:

          - SubjectProperty.occupancy_type indicates Primary Residence or Second Home, or Borrower.will_occupy_as_primary_residence
          is TRUE for any borrower on the loan.


          ### Not Applicable

          There is no case for this outcome — occupancy classification is required on every Platinum Select
          DSCR loan.'
        source_digest: 1d6f89bfe9f6be9df26c8de4ce8efc02dbd4a3e1c3289d5be338c3c3f7b06eed
        section: Loan Program Eligibility
        mnemonic: LPE-OCCUPANCY
        also_as:
          standard: LPE-OCCUPANCY
