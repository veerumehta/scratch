  - rule_id: RLI-RESERVE-SUB.platinum_select
    condition:
      kind: procedure
      purpose: Validate the reserve substitution calculation and documentation used when required rent
        loss insurance coverage is unavailable.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Insurance Denial / Unavailability Letter or equivalent documentation is present in the file
        when required rent loss insurance cannot be obtained.


        ### Step 2 - Eligibility Verification

        - Number of months of required rent loss coverage not provided is identified from the six-month
        requirement less any partial coverage actually obtained.


        ### Step 3 - Validation and Verification

        - Borrower''s reserve funds, per Asset Statements, are calculated at two months of reserves for
        every one month of rent loss coverage not provided.


        ### Step 4 - Final Determination

        - Reserve substitution is accepted only when the calculated additional reserve amount (two months
        for every one month of missing coverage) is fully evidenced in the borrower''s verified assets.'
      checks:
      - 'Insurance Denial / Unavailability Letter documents that required rent loss insurance could not
        be obtained: TRUE = reserve substitution provision applies, FALSE = the standard rent loss insurance
        requirement applies unchanged.'
      - 'Verified borrower reserves equal or exceed two months of reserves for every one month of rent
        loss coverage not provided: TRUE = substitution requirement satisfied, FALSE = substitution requirement
        not satisfied.'
      outcomes:
