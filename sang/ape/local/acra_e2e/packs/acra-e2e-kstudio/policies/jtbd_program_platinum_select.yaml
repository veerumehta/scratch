          indicator_context: Read SubjectProperty.occupancy_type with the appraisal's occupancy observation
            and the current lease. Indicator is 'Pass' when tenant-occupied; 'Fail' when vacant under
            any loan purpose. Cross-verify with the appraisal report; on mismatch use the appraisal-extracted
