    priority: 37
    description: Determines the single governing maximum CLTV for the loan by taking the lowest of every
      applicable published cap — FICO/purpose matrix, loan-size 75.00%, Warrantable Condo/Two-Unit 75.00%,
      Interest-Only 75.00%, Correspondent 700-719 60%, listed-for-sale 65% — then applying the 5-point
      declining-market reduction, and confirms the loan's CLTV does not exceed that result.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 37
        section_type: Eligibility
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Final Governing Maximum CLTV
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: LFC_CLTVFINAL_LM1
          indicator_context: Derive the governing maximum CLTV as the minimum of every cap that applies
            to the loan (matrix cap for CreditReport.representative_score tier and LoanCore.loan_purpose;
            75.00% when LoanCore.base_loan_amount_usd < 350,000 or > 1,500,000; 75.00% when SubjectProperty.property_type
            is Warrantable Condo or SubjectProperty.number_of_units = 2; 75.00% when LoanCore.interest_only_period_months
            > 0; 60% when LoanCore.channel is Correspondent and representative_score is 700-719; 65% when
            the subject is listed for sale within six months), then subtract 5 percentage points when
            the appraisal flags a declining market. Indicator is 'Pass' when LoanCore.cltv_percent <=
            the derived governing cap; 'Fail' otherwise. Cross-verify each input against the appraisal,
            credit report and Note; on mismatch use the document-extracted value. Do not populate borrower_ids
            for this unified metric under any circumstance.
          calculation_context: governing_max_cltv = MIN(matrix_cap, size_cap, property_type_cap, io_cap,
            correspondent_cap, listed_for_sale_cap) - (5 if declining_market else 0). Pass when LoanCore.cltv_percent
            <= governing_max_cltv. Caps that do not apply to the loan are omitted from the MIN.
          description_template: 'CLTV: {cltv_percent}% (governing max: {governing_max_cltv}% = lowest
            of {applicable_caps}{declining_market_adjustment})'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
