        source_text: '# Previous Credit Event Seasoning - Base Version


          ## Purpose

          Verify that a borrower''s previous credit event, if any, meets the program''s 48-month seasoning
          requirement before loan approval.


          ## Reference Documents

          ### Credit and Legal Documents

          - Credit Report: shows public records and tradelines reflecting bankruptcy, foreclosure, short
          sale, deed-in-lieu, or loan modification events

          - Bankruptcy Discharge Papers / Foreclosure Deed / Short Sale Settlement Statement: states the
          event or discharge date


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report public records section is reviewed for any bankruptcy, foreclosure, short sale,
          deed-in-lieu, or loan modification event.


          ### Step 2 - Eligibility Verification

          - Bankruptcy Discharge Papers, Foreclosure Deed, or Short Sale Settlement Statement, when a
          previous credit event is present, states the event or discharge date.


          ### Step 3 - Validation and Verification

          - Number of months between the documented event or discharge date and the Loan Application date
          is calculated.


          ### Step 4 - Final Determination

          - Previous credit event seasoning requirement is satisfied only when the calculated seasoning
          period is 48 months or more from the event or discharge date to the application date.


          ## Deterministic Validation Rules

          - Number of months from the documented previous credit event or discharge date to the Loan Application
          date is 48 or more: TRUE = pass, FALSE = fail.

          - No previous credit event (bankruptcy, foreclosure, short sale, deed-in-lieu, or modification)
          is present on the Credit Report or public records: TRUE = requirement not triggered (pass),
          FALSE = seasoning calculation applies.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - No previous credit event is present, or the documented event/discharge date is 48 months or
          more before the application date.


          ### Conditional

          Assign **Conditional** when:

          - A previous credit event is present but the event or discharge date has not yet been documented,
          pending Bankruptcy Discharge Papers, Foreclosure Deed, or Settlement Statement.


          ### Fail

          Assign **Fail** when:

          - A previous credit event''s documented event or discharge date is less than 48 months before
          the application date.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: ab60fbb5445a3c6c83df2db6ea9a075eece04bed22454ba5a8089175f8fa761d
        section: Credit Review & Analysis
        mnemonic: CRD-PCESEASON
    approval_refs: []
  - rule_id: CRD-TIEOWN.platinum_select
    condition:
      kind: procedure
      purpose: Identify entity-borrower loan files with a tied-largest-ownership scenario among guarantors
        so the file is routed for underwriter confirmation of which guarantor's score is used as the decisioning
        score.
      steps:
