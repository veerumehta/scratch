    domain_extensions:
      jtbd:
        sequence: 7
        section_type: Credit
        source: NEW
        assistant:
        - Underwriter
        entity_types:
        - name: Liability
          entity_description: Mortgage and rental obligations with payment history and subject-lien flags
        reference_documents: '### Credit Documentation

          - Credit Report or mortgage statement: shows the maturity date for a matured mortgage loan tied
          to a rated property.

          ### Maturity Extension Documentation

          - Written maturity extension agreement: documents any revised maturity date agreed between the
          borrower and the prior lender.'
        source_text: '# Matured-Loan Rating Treatment - Base Version


          ## Purpose

          This JTBD confirms that a matured mortgage loan tied to a rated property is evaluated using
          its maturity date, and that any extension of that maturity date is supported by a written agreement.


          ## Reference Documents

          ### Credit Documentation

          - Credit Report or mortgage statement: shows the maturity date for a matured mortgage loan tied
          to a rated property.

          ### Maturity Extension Documentation

          - Written maturity extension agreement: documents any revised maturity date agreed between the
          borrower and the prior lender.


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report or mortgage statement shows a maturity date for a mortgage loan tied to a rated
          property.


          ### Step 2 - Eligibility Verification

          - The mortgage loan is confirmed as matured, with its reported maturity date on or before the
          application date.


          ### Step 3 - Validation and Verification

          - Where the maturity date was extended, the file contains a written extension agreement documenting
          the revised maturity date.


          ### Step 4 - Final Determination

          - The mortgage''s payment rating is evaluated using the maturity date, or the written extension
          date if applicable, to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - Reported mortgage maturity date is on or before the application date: TRUE = the loan is matured
          and is rated based on that maturity date.

          - The maturity date has been extended beyond the originally reported date: TRUE = a written
          extension agreement is required, FALSE = not required.

          - Where an extension applies: a written extension agreement is on file: TRUE = pass, FALSE =
          fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A matured loan is rated as of its maturity date, and any extension of that date is supported
          by a written extension agreement on file.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - A maturity extension is applied to the rating without a written extension agreement on file.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No mortgage loan used in the rating has reached its maturity date.'
