  - rule_id: DSCR-SUBFIN.platinum_select
    condition:
      kind: procedure
      purpose: Determine whether a subordinate lien's monthly payment must be added to the PITIA denominator
        when calculating DSCR, and document that this calculation treatment does not by itself establish
        permission for subordinate financing on the transaction.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Title Commitment is reviewed to identify whether a subordinate lien is recorded or will be recorded
        against the subject property at closing.


        ### Step 2 - Eligibility Verification

        - Subordinate Financing Note or HELOC Agreement, when a subordinate lien exists, states a monthly
        payment amount for that lien.


        ### Step 3 - Validation and Verification

        - Subordinate lien monthly payment amount is added to the first-lien PITIA components to produce
        the total DSCR denominator.


        ### Step 4 - Final Determination

        - DSCR denominator includes the subordinate lien payment whenever a subordinate lien is present
        on the subject property at closing; absence of a subordinate lien leaves the denominator as first-lien
        PITIA only.'
      checks:
      - 'Title Commitment shows a subordinate lien recorded or to be recorded against the subject property:
        TRUE = subordinate lien payment must be added to the denominator, FALSE = denominator is first-lien
        PITIA only.'
      - 'Subordinate Financing Note or HELOC Agreement states a monthly payment amount when a subordinate
        lien exists: TRUE = amount is available for inclusion in the denominator, FALSE = denominator
        cannot be finalized until the amount is documented.'
      outcomes:
