        source_text: '# Business Entity Eligibility - Base Version


          ## Purpose

          Determine whether a business entity borrower is eligible to obtain financing under the program,
          limited to business-purpose transactions secured by investment property.


          ## Reference Documents

          ### Entity and Loan Purpose Documents

          - Loan Application: states the borrowing party (individual or entity) and the subject property
          occupancy/use type

          - Business Purpose Attestation: states that the transaction is a business-purpose transaction

          - Certificate of Formation / Articles of Organization: identifies the borrowing entity type


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application identifies the borrower as a business entity and states the subject property
          occupancy type.

          - Business Purpose Attestation is present in the file when the borrower is a business entity.


          ### Step 2 - Eligibility Verification

          - Subject property occupancy type recorded on the Loan Application is investment property, not
          a primary residence or second home.

          - Business Purpose Attestation is executed confirming the transaction is a business-purpose
          transaction.


          ### Step 3 - Validation and Verification

          - Certificate of Formation / Articles of Organization confirms the borrower is a legally formed
          business entity.

          - Business entity name on the Certificate of Formation matches the borrower name on the Loan
          Application.


          ### Step 4 - Final Determination

          - Entity borrower is approved for financing when the transaction is confirmed business-purpose
          and the subject property is an investment property; entity borrowers on non-investment-property
          or non-business-purpose transactions are not approved.


          ## Deterministic Validation Rules

          - Loan Application identifies the borrower as a business entity: TRUE = entity eligibility rule
          applies, FALSE = individual borrower eligibility rules apply instead.

          - Subject property occupancy type is investment property: TRUE = entity borrower is eligible
          on this basis, FALSE = entity borrower is not eligible.

          - Business Purpose Attestation is executed and on file: TRUE = business-purpose condition satisfied,
          FALSE = business-purpose condition not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Borrower is a business entity, the subject property is an investment property, and a Business
          Purpose Attestation is on file.


          ### Conditional

          Assign **Conditional** when:

          - Business entity borrower and investment property occupancy are confirmed but the Business
          Purpose Attestation has not yet been executed.


          ### Fail

          Assign **Fail** when:

          - A business entity borrower is submitted on a transaction where the subject property is not
          an investment property.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual rather than a business entity.'
        source_digest: 44e965fa1a2c91dd39d44951fc0f44b6dfd413044a4ecc7da7b1c96926722061
