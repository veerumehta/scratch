            operating agreement; on mismatch use document-extracted value. Do not populate borrower_ids
            for this unified metric under any circumstance.
          description_template: 'Decisioning Score: {representative_score}'
        entity_types:
        - name: CreditReport
          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
