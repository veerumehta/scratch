        source_text: '# Excessive Rent Supporting Documentation - Base Version


          ## Purpose

          This JTBD confirms that, when a single-family investment property''s lease reflects a monthly
          rent that is excessive for the area, the file contains acceptable third-party evidence that
          the rent is typical for the market.


          ## Reference Documents

          ### Rent Support Documentation

          - Classified newspaper advertisements: comparable local rent listings for the area.

          - Single-Family Comparable Rent Schedule (Form 1007): appraiser-completed rent comparison.

          - Market rent survey: survey completed by a local real estate or rental management company familiar
          with area market rents.


          ## Steps


          ### Step 1 - Initial Document Review

          - Lease agreement on file shows a monthly rent amount for a single-family investment property.


          ### Step 2 - Eligibility Verification

          - Monthly rent reflected on the lease is identified as excessive relative to typical rents for
          the property''s area, which triggers the supporting-documentation requirement.


          ### Step 3 - Validation and Verification

          - File contains at least one of: classified newspaper advertisements evidencing comparable local
          rents, a Form 1007 completed by the appraiser, or a market rent survey completed by a local
          real estate or rental management company.


          ### Step 4 - Final Determination

          - Presence of qualifying supporting documentation is compared against the excessive-rent trigger
          to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - Subject property is single-family AND lease-reflected monthly rent is identified as excessive
          for the area: TRUE = supporting documentation is required, FALSE = not required.

          - Where required: file contains classified ads, a Form 1007, or a market rent survey evidencing
          the rent is typical for the area: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Excessive rent is identified and at least one acceptable form of supporting documentation
          is on file.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Excessive rent is identified and no acceptable supporting documentation is on file.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The subject property is not single-family, or the lease-reflected rent is not identified as
          excessive for the area.'
        source_digest: 263f87b15adc17103d23f331dc5a941c7d4d2df63a0c43ded9d7455e13d6f881
