        reference_documents: '### Credit Documents

          - Credit Report: provides the number of repository scores and the number and age of tradelines'
        source_text: '# Tradeline Depth Requirement - Base Version


          ## Purpose

          Verify credit report tradeline depth and history length meet the applicable requirement based
          on the number of repository scores obtained for the borrower.


          ## Reference Documents

          ### Credit Documents

          - Credit Report: provides the number of repository scores and the number and age of tradelines


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report states the number of repository scores obtained (one, two, or three) for the
          borrower.


          ### Step 2 - Eligibility Verification

          - Credit Report open trade lines and oldest trade line date are reviewed to determine tradeline
          count and history length in months.


          ### Step 3 - Validation and Verification

          - For a borrower with two or fewer repository scores, tradeline count and history length are
          checked against the 2-tradelines/24-months or 3-tradelines/12-months alternative thresholds.


          ### Step 4 - Final Determination

          - Tradeline requirement is satisfied when the borrower has scores from all three repositories,
          or when a borrower with two or fewer scores meets the 2-tradeline/24-month or 3-tradeline/12-month
          alternative.


          ## Deterministic Validation Rules

          - Credit Report shows scores from all three repositories: TRUE = no tradeline overlay applies
          (pass), FALSE = tradeline overlay applies.

          - Borrower has two or fewer repository scores and Credit Report shows at least 2 tradelines
          each with at least 24 months of history: TRUE = pass, FALSE = check the 3-tradeline alternative.

          - Borrower has two or fewer repository scores and Credit Report shows at least 3 tradelines
          each with at least 12 months of history: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Borrower has scores from all three repositories, or a borrower with two or fewer scores meets
          the 2-tradeline/24-month or 3-tradeline/12-month alternative.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Borrower has two or fewer repository scores and meets neither the 2-tradeline/24-month nor
          the 3-tradeline/12-month alternative.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: f806c1863b76a379f7d2e45cabf316ce37c61d424dd018abf65fe816df23ac3f
        section: Credit Review & Analysis
        mnemonic: CRD-TRADELINE
        also_as:
          standard: CRD-TRADELINE
