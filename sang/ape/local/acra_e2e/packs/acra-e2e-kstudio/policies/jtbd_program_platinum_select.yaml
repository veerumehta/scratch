          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Appraisal Report: appraiser''s occupancy observation and property condition rating at time
          of inspection

          - Property Inspection / Property Data Report, if obtained: occupancy and condition findings'
        source_text: '# Vacant Property Ineligibility (Property Condition) - Base Version


          ## Purpose

          This JTBD determines, from the physical condition and occupancy indicators recorded during property
          inspection, whether the subject property is vacant, which disqualifies it from the Platinum
          Select DSCR program.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: appraiser''s occupancy observation and property condition rating at time
          of inspection

          - Property Inspection / Property Data Report, if obtained: occupancy and condition findings


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal report''s occupancy and property condition sections are reviewed for the subject
          property.


          ### Step 2 - Eligibility Verification

          - Property condition indicators noted by the appraiser (utilities status, furnishings, general
          upkeep) are checked against a vacant designation.


          ### Step 3 - Validation and Verification

          - Any separate property inspection or Property Data Report in the file is reconciled against
          the appraisal''s occupancy finding for consistency.


          ### Step 4 - Final Determination

          - Subject property is confirmed occupied (not vacant) and the file proceeds, or the property
          is confirmed vacant and the loan is declined.


          ## Deterministic Validation Rules

          - Appraisal report does not designate the subject property''s occupancy status as vacant: TRUE
          = pass, FALSE = fail.

          - No separate property inspection or Property Data Report in the file contradicts the appraisal''s
          non-vacant occupancy finding: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The appraisal report, and any separate property inspection on file, confirm the subject property
          is occupied and not vacant.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The appraisal report or a separate property inspection designates the subject property as
          vacant.


          ### Not Applicable

          There is no case for this outcome — vacancy status must be confirmed on every Platinum Select
          DSCR loan.'
        source_digest: a8b2e53fcf682e9f1e0cb9ed3ed81cf471ce4fb86fd9320d97ba5e58008230e3
        section: Appraisal Review
        mnemonic: PRE-VACANT
