  - rule_id: LFC-CLTV-FINAL.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD produces one governing maximum CLTV for the loan by combining every CLTV cap
        and adjustment Acra publishes for the Platinum Select DSCR program. The individual caps are each
        tested by their own JTBD; this JTBD confirms that, when more than one applies, the lowest cap
        governs, that the declining-market reduction is taken from that lowest cap, and that the loan's
        CLTV does not exceed the final result. The consolidation assumes the matrix sets the starting
        limit and each applicable condition can only lower it (Acra confirmation requested → Q-08).
      steps:
      - "## Steps\n\n### Step 1 - Initial Document Review\n- LOS record, Credit Report and Appraisal Report\
        \ supply every input needed to evaluate each published cap: FICO score, purpose, loan amount,\
        \ channel, interest-only term, property type, unit count, declining-market flag and listing status.\n\
        \n### Step 2 - Eligibility Verification\n- Each published cap is evaluated for applicability and,\
        \ where applicable, its value is recorded:\n  - Matrix cap by FICO tier and purpose (730+: 80/80/75;\
        \ 721-729: 80/80/65; 700-720: 80/80/55 for Purchase / Rate & Term / Cash-Out).\n  - Loan amount\
        \ below $350,000 or above $1,500,000: 75.00%.\n  - Warrantable Condo or Two-Unit subject: 75.00%.\n\
        \  - Interest-Only (5-year term): 75.00%.\n  - Correspondent channel with FICO 700-719: 60%.\n\
        \  - Subject listed for sale within six months: 65% LTV/CLTV on the lesser of appraised value\
        \ or lowest recent listing price.\n\n### Step 3 - Validation and Verification\n- Governing maximum\
        \ CLTV is the lowest of the applicable cap values.\n- Where the Appraisal Report identifies a\
        \ declining market, 5 percentage points are subtracted from the governing maximum.\n- LOS proposed\
        \ CLTV is compared with the final governing maximum.\n\n### Step 4 - Final Determination\n- Loan\
        \ CLTV at or below the final governing maximum proceeds; a CLTV above it is restructured or declined.\
        \ Where the file depends on how caps combine (Q-08) the determination is conditioned on Acra confirmation."
      checks:
      - 'Every cap applicable to the loan has been evaluated and its value recorded: TRUE = consolidation
        complete, FALSE = consolidation incomplete.'
      - 'governing_max_cltv = MIN(all applicable caps) - (5 if declining market else 0): computed value
        is recorded on the file.'
      - 'LoanCore.cltv_percent <= governing_max_cltv: TRUE = pass, FALSE = fail.'
      - 'Declining-market reduction is applied to the lowest applicable cap and not only to the matrix
        cap: TRUE = correct, FALSE = recalculation required.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
