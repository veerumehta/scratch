          metric_key: SubjectProperty.property_type
          metric_mnemonic: PRE_UNADDRESSED_LM1
          indicator_context: Evaluate SubjectProperty.property_type and SubjectProperty.number_of_units
            against the Platinum Summary. Indicator is 'Not Applicable' when the property is expressly
            eligible (SFR, Townhome, PUD, Warrantable Condo, Two-Unit) or expressly ineligible (Rural,
            Condotel, Non-Warrantable Condo, Short-Term Rental); 'Conditional' when the property is a
            three- or four-unit dwelling, a manufactured home, mixed-use, Adult Care / Assisted Living,
            or PUDtel, which the Summary does not address (Q-07). Cross-verify with the appraisal report;
            on mismatch use the appraisal-extracted value. Do not populate borrower_ids for this unified
            metric under any circumstance.
          description_template: 'Property: {property_type}, {number_of_units} unit(s) — Platinum Summary
            status: {summary_status}'
        entity_types:
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        - name: CondoProject
          entity_description: Condo project warrantability and classification
        extraction_targets:
        - description: Unit count, manufactured / mixed-use flags and project type from the appraisal
          entity_type: SubjectProperty
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Property Documents

          - Appraisal Report: property type, unit count, manufactured-home indicator, commercial / mixed-use
          component, project type (PUD / PUDtel)

          - Condo / PUD Project Questionnaire: project classification where applicable'
        source_text: '# Property Features Not Addressed in the Platinum Summary - Base Version


          ## Purpose

          This JTBD separates three states of a subject property under the Platinum Select Summary: expressly
          eligible (PRE-TYPES), expressly ineligible (PRE-INELIG-TYP), and not addressed. Three- and four-unit
          properties, manufactured homes, mixed-use and Adult Care / Assisted Living properties (§10.7),
          and PUDtels fall in the third state. The consolidation does not import the Standard program''s
          treatment and does not treat silence as prohibition; each is a question to Acra (Acra confirmation
          requested → Q-07). Where §10.7 mixed-use properties are approved, the excerpt requires a minimum
          DSCR of 1.2.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: property type, unit count, manufactured-home indicator, commercial / mixed-use
          component, project type (PUD / PUDtel)

          - Condo / PUD Project Questionnaire: project classification where applicable


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal Report and project questionnaire identify the property type, unit count and any
          commercial, care-facility or resort-style (PUDtel) characteristic.


          ### Step 2 - Eligibility Verification

          - Property is tested against the expressly eligible list and the expressly ineligible list;
          a property on either list exits this JTBD as Not Applicable.


          ### Step 3 - Validation and Verification

          - Property that is on neither list is classified as "not addressed" and the specific feature
          (3-4 units, manufactured, mixed-use / Adult Care / Assisted Living, PUDtel) is recorded.


          ### Step 4 - Final Determination

          - File is conditioned for Acra''s written confirmation of eligibility and any applicable overlay
          (for mixed-use: minimum DSCR 1.2) before approval; no approval is issued on the basis of silence.


          ## Deterministic Validation Rules

          - Property type is expressly eligible or expressly ineligible under the Platinum Summary: TRUE
          = not applicable, FALSE = continue.

          - SubjectProperty.number_of_units is 3 or 4, OR the property is a manufactured home, mixed-use,
          Adult Care / Assisted Living, or PUDtel: TRUE = conditional (Q-07), FALSE = not applicable.

          - Written Acra confirmation of eligibility is in the file for a not-addressed feature: TRUE
          = pass, FALSE = conditional.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The property has a not-addressed feature and Acra''s written confirmation of eligibility,
          with any stated overlay satisfied, is in the file.


          ### Conditional

          Assign **Conditional** when:

          - The property has a not-addressed feature and Acra''s confirmation is outstanding; the file
          may not be approved until it is received.


          ### Fail

          Assign **Fail** when:

          - The property has a not-addressed feature and Acra has confirmed in writing that it is ineligible
          on Platinum Select, or a confirmed overlay (e.g., 1.2 DSCR for mixed-use) is not met.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The property type is expressly eligible or expressly ineligible under the Platinum Summary.'
        source_digest: 3006fd4d4c05ec5445c31ee6b9e803b48d5f3356d9f81a454fdfcc338f59af46
        section: Appraisal Review
        mnemonic: PRE-UNADDRESSED
