  - rule_id: CRD-HIST-SCOPE.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD confirms that housing-history documentation for a DSCR loan file is limited to
        the subject property, the borrower's principal residence, and any second home, and that other
        owned properties are excluded from the scope unless a major credit event is reported against them.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - RealEstateOwned records identify which property is the subject property, which is the borrower''s
        principal residence, and which (if any) is a second home.


        ### Step 2 - Eligibility Verification

        - Housing-history documentation scope is limited to the subject property, principal residence,
        and second home(s); other owned properties are excluded from the scope unless the Credit Report
        reports a major credit event tied to one of them.


        ### Step 3 - Validation and Verification

        - Payment history documentation (Credit Report tradeline or mortgage statement / VOM) is present
        for the subject property, principal residence, and each second home.


        ### Step 4 - Final Determination

        - Presence of required payment-history documentation for in-scope properties, and treatment of
        any major-credit-event flag on an out-of-scope property, are used together to reach a pass/fail
        determination.'
      checks:
      - 'RealEstateOwned.property_use identifies a record as subject property, principal residence, or
        second home: TRUE = payment history documentation is required for that property.'
      - 'Credit Report reports a foreclosure or other major credit event tied to an out-of-scope owned
        property: TRUE = housing-history documentation is also required for that property, FALSE = not
        required.'
      - 'Required payment history documentation is present for each in-scope property: TRUE = pass, FALSE
        = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 4
    description: Confirms that housing-history documentation on a Platinum Select DSCR loan is scoped
      to only the subject property, principal residence, and second home(s), unless a major credit event
      is flagged on another owned property.
    citations: []
