          metric_key: Asset.asset_type
          metric_mnemonic: AFC_UNACCEPTSRC_LM1
          indicator_context: For every Asset record relied on for funds to close or reserves, read Asset.asset_type
            (and Asset.asset_subtype where 'Other'). Indicator is 'Pass' when every relied-on asset is
            an acceptable, documented type (depository accounts, GiftFunds meeting the 10% own-funds rule,
