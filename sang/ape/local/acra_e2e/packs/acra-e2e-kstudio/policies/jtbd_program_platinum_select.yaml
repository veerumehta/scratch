          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        reference_documents: '### Closing Documents

          - One- to Four-Family Rider: Confirms borrower execution of the rider required for one- to four-family
          investment property transactions.

          - Loan Application (1003): Identifies the subject property type and occupancy to determine whether
          the rider applies.


          ---'
        source_text: '# One- to Four-Family Rider Execution - Base Version


          ## Purpose

          This JTBD verifies that all borrowers purchasing or refinancing a one- to four-family investment
          property have executed the One- to Four-Family Rider with the loan documents and that the file
          flags the related rent loss insurance requirement for downstream review.


          ## Reference Documents

          ### Closing Documents

          - One- to Four-Family Rider: Confirms borrower execution of the rider required for one- to four-family
          investment property transactions.

          - Loan Application (1003): Identifies the subject property type and occupancy to determine whether
          the rider applies.


          ---


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application (1003) subject property section shows property type as a one- to four-family
          residential dwelling.

          - Closing document package is checked for presence of the One- to Four-Family Rider.


          ### Step 2 - Eligibility Verification

          - Loan Application (1003) occupancy field shows the subject property as non-owner occupied investment
          property.

          - One- to Four-Family Rider is present in the closing document set for every borrower named
          on the note.


          ### Step 3 - Validation and Verification

          - Signature block on the One- to Four-Family Rider contains the name of every borrower listed
          on the note and security instrument.

          - Rider execution date matches or precedes the closing date on the note.


          ### Step 4 - Final Determination

          - All borrowers on a one- to four-family investment property transaction have executed the rider
          with matching names and a valid execution date: gate to Pass.

          - Any borrower on the note is missing from the rider signature block, or the rider is absent
          from the closing package: gate to Fail.


          ---


          ## Deterministic Validation Rules

          - One- to Four-Family Rider is present in the closing document package: TRUE = pass, FALSE =
          fail.

          - Every borrower name on the note and security instrument appears in the rider signature block:
          TRUE = pass, FALSE = fail.

          - Rider execution date is on or before the note date: TRUE = pass, FALSE = fail.


          ---


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The One- to Four-Family Rider is present, signed by every borrower on the note, and dated
          on or before closing.


          ### Conditional

          Assign **Conditional** when:

          - The rider is present but missing one or more required borrower signatures, pending a corrected
          rider prior to funding.


          ### Fail

          Assign **Fail** when:

          - The One- to Four-Family Rider is absent from the closing document package for a one- to four-family
          investment property transaction.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 080965d0790039ab13654cbbf3d9dfbc8cab786f21de8b0b2024ccc1356b6637
