      purpose: This JTBD confirms that the entity borrower's federal tax identification number is documented
        in the loan file, or that an exception to this requirement has been properly requested through
        Acra's Legal Department.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Loan file is checked for IRS Form SS-4 or an EIN issuance letter bearing the entity borrower''s
        name and Employer Identification Number.


        ### Step 2 - Eligibility Verification

        - EIN on the SS-4 or issuance letter matches the Taxpayer Identification Number represented for
        the entity elsewhere in the file.


        ### Step 3 - Validation and Verification

        - Where no SS-4 or EIN issuance letter is available, the file contains an exception request submitted
        to Acra''s Legal Department with a letter of explanation stating the grounds.


        ### Step 4 - Final Determination

        - EIN documentation or an approved exception is on file and the file proceeds, or neither is present
        and the file is conditioned.'
      checks:
