  - rule_id: PRE-UNADDRESSED.platinum_select
    condition:
      kind: procedure
      purpose: 'This JTBD separates three states of a subject property under the Platinum Select Summary:
        expressly eligible (PRE-TYPES), expressly ineligible (PRE-INELIG-TYP), and not addressed. Three-
        and four-unit properties, manufactured homes, mixed-use and Adult Care / Assisted Living properties
        (§10.7), and PUDtels fall in the third state. The consolidation does not import the Standard program''s
        treatment and does not treat silence as prohibition; each is a question to Acra (Acra confirmation
        requested → Q-07). Where §10.7 mixed-use properties are approved, the excerpt requires a minimum
        DSCR of 1.2.'
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Appraisal Report and project questionnaire identify the property type, unit count and any commercial,
        care-facility or resort-style (PUDtel) characteristic.


        ### Step 2 - Eligibility Verification

        - Property is tested against the expressly eligible list and the expressly ineligible list; a
        property on either list exits this JTBD as Not Applicable.


        ### Step 3 - Validation and Verification

        - Property that is on neither list is classified as "not addressed" and the specific feature (3-4
        units, manufactured, mixed-use / Adult Care / Assisted Living, PUDtel) is recorded.


        ### Step 4 - Final Determination

        - File is conditioned for Acra''s written confirmation of eligibility and any applicable overlay
        (for mixed-use: minimum DSCR 1.2) before approval; no approval is issued on the basis of silence.'
      checks:
      - 'Property type is expressly eligible or expressly ineligible under the Platinum Summary: TRUE
        = not applicable, FALSE = continue.'
      - 'SubjectProperty.number_of_units is 3 or 4, OR the property is a manufactured home, mixed-use,
        Adult Care / Assisted Living, or PUDtel: TRUE = conditional (Q-07), FALSE = not applicable.'
      - 'Written Acra confirmation of eligibility is in the file for a not-addressed feature: TRUE = pass,
        FALSE = conditional.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
