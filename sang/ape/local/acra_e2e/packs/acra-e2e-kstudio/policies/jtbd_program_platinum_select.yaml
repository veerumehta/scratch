        notes: 'Ontology gap: no entity-ownership-percent field on Borrower; tie detection is document-driven
          from the Operating Agreement.'
        entity_types:
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
            dates
        - name: CreditReport
          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        reference_documents: '### Ownership and Credit Documents

          - Operating Agreement / Bylaws: states each guarantor''s ownership percentage

          - Credit Report: provides each guarantor''s middle score'
        source_text: '# Tied Guarantor Ownership Score Selection Flag - Base Version


          ## Purpose

          Identify entity-borrower loan files with a tied-largest-ownership scenario among guarantors
          so the file is routed for underwriter confirmation of which guarantor''s score is used as the
          decisioning score.


          ## Reference Documents

          ### Ownership and Credit Documents

          - Operating Agreement / Bylaws: states each guarantor''s ownership percentage

          - Credit Report: provides each guarantor''s middle score


          ## Steps


          ### Step 1 - Initial Document Review

          - Operating Agreement or Bylaws states the ownership percentage for each guarantor on the entity-borrower
          loan.


          ### Step 2 - Eligibility Verification

          - Ownership percentages are compared across all guarantors to determine whether two or more
          guarantors hold an equal largest ownership interest while overall ownership is not equal across
          all guarantors.


          ### Step 3 - Validation and Verification

          - Credit Report middle scores are obtained for each guarantor holding the tied largest ownership
          interest.


          ### Step 4 - Final Determination

          - File is flagged for underwriter confirmation of which tied guarantor''s score is used as the
          decisioning score whenever the tied-largest-ownership scenario is identified; the file does
          not proceed on an assumed score selection.


          ## Deterministic Validation Rules

          - Two or more guarantors hold an equal largest ownership interest and ownership is not equal
          across all guarantors on the entity-borrower loan: TRUE = file is flagged for underwriter confirmation
          of score selection, FALSE = the standard ownership-based score selection rule applies.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Ownership percentages among guarantors do not present a tied-largest-ownership scenario, so
          the standard score-selection rule applies without flagging.


          ### Conditional

          Assign **Conditional** when:

          - A tied-largest-ownership scenario is identified among guarantors and the file is pending underwriter
          confirmation of which guarantor''s score governs.


          ### Fail

          There is no case for this outcome.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is made to an individual borrower rather than an entity borrower with guarantors.'
        source_digest: 27cd364a4e362784958ff897f44cc9d368509b6316f36ad326963518d14f8bc1
        section: Credit Review & Analysis
        mnemonic: CRD-TIEOWN
