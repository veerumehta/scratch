  - rule_id: LFC-CORR-CAP.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD evaluates whether a Correspondent-channel Platinum Select DSCR loan with a decisioning
        FICO score of 700-719 stays within the matrix footnote's 60% CLTV pricing cap, applied in addition
        to the standard purpose-column matrix cap.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - LOS loan record identifies the origination channel as Correspondent.

        - Credit Report shows a decisioning FICO score for the borrower or applicable guarantor.


        ### Step 2 - Eligibility Verification

        - Decisioning FICO score falls within the 700-719 band.

        - LOS loan record shows a proposed CLTV percent to be tested against the footnote cap.


        ### Step 3 - Validation and Verification

        - LOS proposed CLTV percent does not exceed 60%, the Correspondent-channel footnote cap for the
        700-719 FICO band.

        - Where the loan purpose is Cash-Out, the standard 700-tier matrix cap of 55% is also observed,
        since the 55% matrix figure is lower than the 60% footnote and is not raised by the footnote.


        ### Step 4 - Final Determination

        - The lower of the 60% Correspondent footnote cap and the standard matrix purpose-column cap is
        compared against the LOS proposed CLTV to reach a pass/fail determination.'
      checks:
      - 'LOS origination channel = Correspondent AND decisioning FICO score is 700 through 719: TRUE =
        the 60% footnote cap applies, FALSE = the footnote does not apply and only the standard matrix
        cap governs.'
      - 'Loan purpose is Purchase or Rate & Term Refinance and the footnote applies: LOS proposed CLTV
        percent <= 60% is TRUE = pass, FALSE = fail.'
      - 'Loan purpose is Cash-Out Refinance and the footnote applies: LOS proposed CLTV percent <= 55%
        (the lower of the 60% footnote and the 55% matrix figure) is TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 8
    description: Applies Acra's Correspondent-channel footnote capping CLTV at 60% for Platinum Select
      DSCR loans with a decisioning FICO score of 700-719, on top of the standard matrix cap for the loan's
      purpose.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 8
        section_type: Eligibility
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Correspondent 700-719 CLTV vs. 60% Footnote Cap
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: LFC_CORRCAP_LM1
          indicator_context: When LoanCore.channel is Correspondent and CreditReport.representative_score
            is 700-719, compare LoanCore.cltv_percent against a 60% cap (or 55% when LoanCore.loan_purpose
            is Cash-Out). Indicator is 'Pass' when cltv_percent is within the applicable capped value;
            'Fail' otherwise; 'Not Applicable' when channel is not Correspondent or score is outside 700-719.
            Do not populate borrower_ids for this unified metric under any circumstance.
          description_template: 'Correspondent CLTV: {cltv_percent}% (cap: {correspondent_cltv_cap}%,
            channel: {channel})'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: CreditReport
          entity_description: Credit scores, tradelines, late counts, public records, OFAC alert
        reference_documents: '### Credit Documentation

          - Credit Report: provides the decisioning FICO score used to determine whether the 700-719 band
          applies.

          ### Loan Origination System (LOS)

          - LOS loan record: provides the origination channel and the proposed CLTV for the loan.'
        source_text: '# Loan Amount, FICO and CLTV Matrix - Base Version


          ## Purpose

          This JTBD evaluates whether a Correspondent-channel Platinum Select DSCR loan with a decisioning
          FICO score of 700-719 stays within the matrix footnote''s 60% CLTV pricing cap, applied in addition
          to the standard purpose-column matrix cap.


          ## Reference Documents

          ### Credit Documentation

          - Credit Report: provides the decisioning FICO score used to determine whether the 700-719 band
          applies.

          ### Loan Origination System (LOS)

          - LOS loan record: provides the origination channel and the proposed CLTV for the loan.


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS loan record identifies the origination channel as Correspondent.

          - Credit Report shows a decisioning FICO score for the borrower or applicable guarantor.


          ### Step 2 - Eligibility Verification

          - Decisioning FICO score falls within the 700-719 band.

          - LOS loan record shows a proposed CLTV percent to be tested against the footnote cap.


          ### Step 3 - Validation and Verification

          - LOS proposed CLTV percent does not exceed 60%, the Correspondent-channel footnote cap for
          the 700-719 FICO band.

          - Where the loan purpose is Cash-Out, the standard 700-tier matrix cap of 55% is also observed,
          since the 55% matrix figure is lower than the 60% footnote and is not raised by the footnote.


          ### Step 4 - Final Determination

          - The lower of the 60% Correspondent footnote cap and the standard matrix purpose-column cap
          is compared against the LOS proposed CLTV to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - LOS origination channel = Correspondent AND decisioning FICO score is 700 through 719: TRUE
          = the 60% footnote cap applies, FALSE = the footnote does not apply and only the standard matrix
          cap governs.

          - Loan purpose is Purchase or Rate & Term Refinance and the footnote applies: LOS proposed CLTV
          percent <= 60% is TRUE = pass, FALSE = fail.

          - Loan purpose is Cash-Out Refinance and the footnote applies: LOS proposed CLTV percent <=
          55% (the lower of the 60% footnote and the 55% matrix figure) is TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The loan is not Correspondent-channel with a 700-719 score, or it is and the proposed CLTV
          is at or below the applicable capped value (60% for Purchase/Rate & Term, 55% for Cash-Out).


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The loan is Correspondent-channel with a decisioning FICO score of 700-719 and the proposed
          CLTV exceeds 60% (Purchase/Rate & Term) or 55% (Cash-Out).


          ### Not Applicable

          Assign **Not Applicable** when:

          - The origination channel is Wholesale, since the 60% footnote cap is stated only for Correspondent
          pricing.'
