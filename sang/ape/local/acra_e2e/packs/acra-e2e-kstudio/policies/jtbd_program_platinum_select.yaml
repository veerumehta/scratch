  - rule_id: DSCR-1007-REQ.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD confirms that a Single-Family Comparable Rent Schedule (Form 1007), prepared
        by the original appraiser or any state-licensed appraiser, is on file wherever it is required
        for a single-family Platinum Select DSCR transaction.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - AppraisalSummary record shows a form_type value for the rent schedule document on file.


        ### Step 2 - Eligibility Verification

        - Subject property is single-family, and the transaction is a DSCR-qualifying file, a lease-option
        purchase funded from excess monthly rent contributions, or a file where proposed rental income
        is used to qualify, each of which triggers the Form 1007 requirement.


        ### Step 3 - Validation and Verification

        - AppraisalSummary.form_type reflects the Single-Family Comparable Rent Schedule (Form 1007).

        - AppraisalSummary.appraiser_license_number and appraiser_license_state are populated, confirming
        the preparer is a state-licensed appraiser.


        ### Step 4 - Final Determination

        - Presence of a properly completed Form 1007 from a licensed appraiser is compared against the
        triggering condition to reach a pass/fail determination.'
      checks:
      - 'Subject property is single-family AND (file is DSCR-qualifying OR is a lease-option purchase
        funded from excess rent contributions OR proposed rental income is used to qualify): TRUE = Form
        1007 is required, FALSE = not required.'
      - 'Where required: AppraisalSummary.form_type = Form 1007 AND appraiser_license_number is populated:
        TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
