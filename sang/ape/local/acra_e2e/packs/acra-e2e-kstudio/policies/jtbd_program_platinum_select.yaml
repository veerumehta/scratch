          supported_operations:
          - CREATE
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Application Documents

          - Loan Application (1003): Records the Schedule of Real Estate Owned and each listed property''s
          use.

          - Credit Report: Cross-references reported mortgage tradelines against properties listed on
          the Schedule of Real Estate Owned.


          ---'
        source_text: '# Schedule of Real Estate Owned Listing Scope - Base Version


          ## Purpose

          This JTBD verifies that the loan application and Schedule of Real Estate Owned reflect only
          the properties required to be disclosed for a DSCR-qualified borrower: the subject property,
          the borrower''s principal residence, and any second home.


          ## Reference Documents

          ### Application Documents

          - Loan Application (1003): Records the Schedule of Real Estate Owned and each listed property''s
          use.

          - Credit Report: Cross-references reported mortgage tradelines against properties listed on
          the Schedule of Real Estate Owned.


          ---


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application (1003) Schedule of Real Estate Owned section lists each property''s address
          and occupancy/use classification.

          - Credit Report mortgage tradelines are enumerated for comparison against the Schedule of Real
          Estate Owned.


          ### Step 2 - Eligibility Verification

          - Each property listed on the Schedule of Real Estate Owned is classified as the subject property,
          the borrower''s principal residence, or a second home.

          - Investment properties other than the subject property that are not required for disclosure
          are identified and excluded from the required-documentation set.


          ### Step 3 - Validation and Verification

          - Every mortgage tradeline on the Credit Report tied to the borrower''s principal residence
          or second home has a corresponding entry on the Schedule of Real Estate Owned.

          - The subject property entry on the Schedule of Real Estate Owned matches the property address
          on the Loan Application (1003).


          ### Step 4 - Final Determination

          - The Schedule of Real Estate Owned correctly lists the subject property, principal residence,
          and any second home with no required entry omitted: gate to Pass.

          - A required entry (subject property, principal residence, or second home) is missing from the
          Schedule of Real Estate Owned: gate to Fail.


          ---


          ## Deterministic Validation Rules

          - Loan Application (1003) Schedule of Real Estate Owned includes an entry for the subject property:
          TRUE = pass, FALSE = fail.

          - Loan Application (1003) Schedule of Real Estate Owned includes an entry for the borrower''s
          principal residence, if one exists: TRUE = pass, FALSE = fail.

          - Loan Application (1003) Schedule of Real Estate Owned includes an entry for each second home
          the borrower owns, if any: TRUE = pass, FALSE = fail.


          ---


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The Schedule of Real Estate Owned lists the subject property, principal residence, and any
          second home, with no required entry omitted.


          ### Conditional

          Assign **Conditional** when:

          - A required property (principal residence or second home) is identified on the Credit Report
          but not yet reflected on the Schedule of Real Estate Owned, pending an updated application.


          ### Fail

          Assign **Fail** when:

          - The subject property, principal residence, or an existing second home is absent from the Schedule
          of Real Estate Owned.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: c6772fcb0c5330229f57d294508b067601747451c3a4cd125ef68c579b22e80f
