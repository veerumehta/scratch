        source_text: '# No-Ratio / Sub-Minimum DSCR Exclusion - Base Version


          ## Purpose

          This JTBD confirms that a Platinum Select DSCR loan is not being originated as a No-Ratio product
          or with an underwriting override permitting a DSCR below the applicable channel minimum, neither
          of which the program offers.


          ## Reference Documents

          ### Loan Origination Records

          - LOS: system of record for the product/program selection field and any underwriting override
          or exception log


          ### DSCR Support Documents

          - DSCR Calculation Worksheet: computed ratio for the loan


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS product/program selection field for the loan is reviewed.


          ### Step 2 - Eligibility Verification

          - Calculated DSCR on the loan is compared against the applicable channel minimum (1.20 Correspondent
          / 1.00 Wholesale).


          ### Step 3 - Validation and Verification

          - Underwriting file is checked for any exception or override record that would permit a ratio
          below the channel minimum.


          ### Step 4 - Final Determination

          - Loan is confirmed as not using a No-Ratio or sub-minimum DSCR path, or is declined/reclassified
          where such a path was applied.


          ## Deterministic Validation Rules

          - LOS product/program selection field does not indicate a "No Ratio" or "No DSCR" product: TRUE
          = pass, FALSE = fail.

          - No underwriting exception or override record exists that lowers the required DSCR below the
          applicable channel minimum: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - No No-Ratio product selection is recorded and no override permits a DSCR below the channel
          minimum.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - LOS reflects a No-Ratio product selection, or an underwriting override permits a DSCR below
          the applicable channel minimum.


          ### Not Applicable

          There is no case for this outcome — this exclusion applies to every Platinum Select DSCR loan.'
        source_digest: d974b05fd43c18c2ca324e16bec81bdc0e67a5c9adc6defe3cc6bca38728b412
        section: Loan Program Eligibility
        mnemonic: LPE-NO-RATIO
