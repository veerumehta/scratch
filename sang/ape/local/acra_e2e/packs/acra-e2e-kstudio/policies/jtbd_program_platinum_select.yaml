        source_text: '# Guarantor Homeownership Attestation - Base Version


          ## Purpose

          Validate the entity-borrower first-time-homebuyer attestation and the prior-homeownership-experience
          requirement for at least one guarantor.


          ## Reference Documents

          ### Application and Attestation Documents

          - Loan Application: contains the first-time homebuyer attestation for each borrower and guarantor

          - Credit Report / Public Property Records: evidence of prior homeownership for at least one
          guarantor


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application records a first-time homebuyer attestation response for each borrower and
          guarantor.


          ### Step 2 - Eligibility Verification

          - At least one borrower or guarantor attests on the Loan Application that they are not a first-time
          homebuyer.

          - Credit Report or public property records show prior homeownership for at least one guarantor.


          ### Step 3 - Validation and Verification

          - Where prior homeownership is not evident in the Credit Report or public property records,
          supporting documentation is requested from the borrower or guarantor.


          ### Step 4 - Final Determination

          - Entity loan is approved on this point only when at least one guarantor demonstrates prior
          homeownership experience and at least one borrower or guarantor attests they are not a first-time
          homebuyer.


          ## Deterministic Validation Rules

          - At least one borrower or guarantor attests on the Loan Application that they are not a first-time
          homebuyer: TRUE = attestation condition satisfied, FALSE = attestation condition not satisfied.

          - Credit Report or public property records show prior homeownership for at least one guarantor:
          TRUE = prior-homeownership condition satisfied, FALSE = supporting documentation is required
          to satisfy the condition.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - At least one borrower/guarantor attestation of non-first-time-homebuyer status is on file
          and prior homeownership is evidenced for at least one guarantor.


          ### Conditional

          Assign **Conditional** when:

          - Attestation is on file but prior homeownership is not evident in the Credit Report or public
          records, and supporting documentation has been requested but not yet received.


          ### Fail

          Assign **Fail** when:

          - No borrower or guarantor attests to non-first-time-homebuyer status, or no evidence or documentation
          of prior homeownership exists for any guarantor.


          ### Not Applicable

          There is no case for this outcome.'
