        source_text: '# Rent Loss Insurance Reserve Substitution - Base Version


          ## Purpose

          Validate the reserve substitution calculation and documentation used when required rent loss
          insurance coverage is unavailable.


          ## Reference Documents

          ### Reserve and Insurance Documents

          - Insurance Denial / Unavailability Letter: documents that rent loss insurance could not be
          obtained

          - Hazard Insurance Policy / Rent Loss Insurance Endorsement: states any partial months of rent
          loss coverage actually obtained

          - Asset Statements: evidence of the borrower''s reserve funds


          ## Steps


          ### Step 1 - Initial Document Review

          - Insurance Denial / Unavailability Letter or equivalent documentation is present in the file
          when required rent loss insurance cannot be obtained.


          ### Step 2 - Eligibility Verification

          - Number of months of required rent loss coverage not provided is identified from the six-month
          requirement less any partial coverage actually obtained.


          ### Step 3 - Validation and Verification

          - Borrower''s reserve funds, per Asset Statements, are calculated at two months of reserves
          for every one month of rent loss coverage not provided.


          ### Step 4 - Final Determination

          - Reserve substitution is accepted only when the calculated additional reserve amount (two months
          for every one month of missing coverage) is fully evidenced in the borrower''s verified assets.


          ## Deterministic Validation Rules

          - Insurance Denial / Unavailability Letter documents that required rent loss insurance could
          not be obtained: TRUE = reserve substitution provision applies, FALSE = the standard rent loss
          insurance requirement applies unchanged.

          - Verified borrower reserves equal or exceed two months of reserves for every one month of rent
          loss coverage not provided: TRUE = substitution requirement satisfied, FALSE = substitution
          requirement not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Rent loss insurance is unavailable per documentation on file, and verified reserves equal
          or exceed two months for every one month of coverage not provided.


          ### Conditional

          Assign **Conditional** when:

          - Rent loss insurance is unavailable per documentation on file, but the reserve calculation
          has not yet been fully verified against Asset Statements.


          ### Fail

          Assign **Fail** when:

          - Rent loss insurance is unavailable and verified reserves are less than two months for every
          one month of coverage not provided.


          ### Not Applicable

          Assign **Not Applicable** when:

          - Required rent loss insurance has been obtained in full and no substitution is needed.'
        source_digest: ac050d11953283def99d6213ae329846f843e9a4ec2a0222b9e88767c5b1623f
        section: Insurance Coverage Sufficiency & Policy Assessment
        mnemonic: RLI-RESERVE-SUB
        also_as:
          standard: RLI-RESERVE-SUB
