        source_text: '# Rent Loss Insurance LTV Trigger - Base Version


          ## Purpose

          Determine whether the six-month rent loss insurance requirement is triggered based on the subject
          property''s LTV and use of subject property rents in loan qualification.


          ## Reference Documents

          ### Loan and Insurance Documents

          - Appraisal Report: states the appraised value used to compute LTV

          - Closing Disclosure: states the loan amount used to compute LTV

          - Rent Schedule (Form 1007/1025): confirms subject property rents are being used to qualify
          the loan

          - Hazard Insurance Policy / Rent Loss Insurance Endorsement: states the rent loss coverage period
          obtained


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal Report and Closing Disclosure are used to calculate the loan-to-value ratio for
          the subject property.


          ### Step 2 - Eligibility Verification

          - Subject property is a one- to four-unit non-owner-occupied income property, and the Rent Schedule
          confirms subject property rents are used to qualify the loan.

          - Calculated LTV exceeds 70%.


          ### Step 3 - Validation and Verification

          - Hazard Insurance Policy or Rent Loss Insurance Endorsement is reviewed to confirm it provides
          at least six months of rent loss coverage.


          ### Step 4 - Final Determination

          - Six months of rent loss insurance is required and must be on file when the subject property
          is a one- to four-unit non-owner-occupied income property, LTV exceeds 70%, and subject property
          rents are used to qualify.


          ## Deterministic Validation Rules

          - Subject property is a one- to four-unit non-owner-occupied income property, LTV exceeds 70%,
          and subject property rents are used to qualify the loan: TRUE = six-month rent loss insurance
          is required, FALSE = this trigger does not require rent loss insurance.

          - Hazard Insurance Policy or Rent Loss Insurance Endorsement on file provides at least six months
          of rent loss coverage when required: TRUE = requirement satisfied, FALSE = requirement not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - LTV exceeds 70%, subject property rents are used to qualify, and a policy providing at least
          six months of rent loss coverage is on file.


          ### Conditional

          Assign **Conditional** when:

          - LTV exceeds 70% and subject property rents are used to qualify, but the six-month rent loss
          insurance policy has not yet been provided.


          ### Fail

          Assign **Fail** when:

          - LTV exceeds 70% and subject property rents are used to qualify, and no rent loss insurance,
          or coverage of less than six months, is on file, and no reserve substitution has been documented.


          ### Not Applicable

          Assign **Not Applicable** when:

          - LTV is 70% or below, or subject property rents are not used to qualify the loan.'
        source_digest: e63c0b65a2cb6d03996b0730df18367e19bd71b275eb3fd808b6a6f15f862763
