        source_text: '# Ineligible Property Location - Base Version


          ## Purpose

          This JTBD determines whether the subject property''s state or territory falls within the locations
          Acra excludes from the Platinum Select DSCR program.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: subject property address, including state

          - Title Commitment: subject property address, including state


          ### Loan Origination Records

          - LOS: system of record for the subject property state field


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS subject property address field, including state, is reviewed.


          ### Step 2 - Eligibility Verification

          - Subject property''s state value is compared against the ineligible location list (South Dakota,
          U.S. territories).


          ### Step 3 - Validation and Verification

          - State recorded in LOS is cross-checked against the state shown on the appraisal report and
          the title commitment for consistency.


          ### Step 4 - Final Determination

          - Subject property location is confirmed eligible and the file proceeds, or the property is
          located in an ineligible state/territory and the loan is declined.


          ## Deterministic Validation Rules

          - Subject property''s state, as recorded in LOS, is not South Dakota and is not a U.S. territory:
          TRUE = pass, FALSE = fail.

          - State recorded in LOS matches the state shown on the appraisal report and the title commitment:
          TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The subject property''s state is not South Dakota or a U.S. territory, and the state is consistent
          across LOS, appraisal, and title documents.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The subject property''s state is South Dakota or a U.S. territory.


          ### Not Applicable

          There is no case for this outcome — property location eligibility is evaluated on every Platinum
          Select DSCR loan.'
        source_digest: 7e01bfc2a279a617fe8feaf4a9158f6ebde67d366ef043ed785b0058f5c0be70
