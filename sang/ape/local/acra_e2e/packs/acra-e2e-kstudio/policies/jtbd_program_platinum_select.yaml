    priority: 9
    description: Aggregates every reserve trigger that applies to the loan — 6 months for CLTV above 75.00%,
      24 months for a property listed for sale, 12 months of subject payment for recent forbearance/lates
      without rent receipts, and 2-for-1 substitution for unobtainable rent loss insurance — into one
      governing reserve requirement, applying the highest trigger with the substitution added, and confirms
      verified reserves meet it.
