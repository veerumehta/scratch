  - rule_id: CRD-HOUSHIST.platinum_select
    condition:
      kind: procedure
      purpose: Verify the borrower's recent housing payment history meets the program's stated 0x30x12
        standard prior to loan approval.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Credit Report is reviewed for mortgage and rental tradelines reported over the most recent 12
        months.


        ### Step 2 - Eligibility Verification

        - Verification of Mortgage or Verification of Rent is obtained when a housing payment is not reported
        on the Credit Report, to document the most recent 12 months of payment history.


        ### Step 3 - Validation and Verification

        - Payment history from the Credit Report and any Verification of Mortgage/Rent is reviewed for
        any payment reported 30 or more days late within the most recent 12 months.


        ### Step 4 - Final Determination

        - Housing history requirement is satisfied only when no mortgage or rental payment in the most
        recent 12 months was reported 30 or more days late.'
      checks:
      - 'Credit Report and any Verification of Mortgage/Rent show zero housing payments 30 or more days
        late within the most recent 12 months: TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 5
    description: Confirms the borrower's housing payment history meets the "0x30x12" standard — no mortgage
      or rental payment reported 30 or more days late within the most recent 12 months.
