        source_text: '# Guarantor Homeownership Attestation - Base Version


          ## Purpose

          Verify that the prior-homeownership evidence and non-first-time-homebuyer attestation applicable
          to borrowers and guarantors are documented in the loan file.


          ## Reference Documents

          ### Ownership History and Attestation Documents

          - Loan Application (1003): contains the borrower/guarantor attestation regarding first-time
          homebuyer status

          - Credit Report: shows prior mortgage tradeline history supporting prior homeownership experience

          - Public Property Records: evidence of a guarantor''s prior ownership interest in real property


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application contains a completed attestation section for at least one borrower or guarantor
          regarding first-time homebuyer status.


          ### Step 2 - Eligibility Verification

          - Credit Report or public property records document prior homeownership experience for at least
          one guarantor on the transaction.


          ### Step 3 - Validation and Verification

          - The individual providing the non-first-time-homebuyer attestation on the Loan Application
          is cross-checked against the individual with documented prior homeownership experience in the
          file.


          ### Step 4 - Final Determination

          - Requirement is satisfied when at least one guarantor has documented prior homeownership experience
          and at least one borrower or guarantor has attested on the Loan Application to not being a first-time
          homebuyer; absent documentation, the underwriter conditions the file for supporting evidence.


          ## Deterministic Validation Rules

          - Credit Report or public property records document prior homeownership experience for at least
          one guarantor on the transaction: TRUE = pass, FALSE = fail.

          - Loan Application contains a signed attestation from at least one borrower or guarantor stating
          they are not a first-time homebuyer: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - At least one guarantor has documented prior homeownership experience and at least one borrower
          or guarantor has signed the non-first-time-homebuyer attestation on the Loan Application.


          ### Conditional

          Assign **Conditional** when:

          - The non-first-time-homebuyer attestation is signed but prior homeownership experience is not
          yet evident in the file, pending supporting documentation at underwriter discretion.


          ### Fail

          Assign **Fail** when:

          - No borrower or guarantor has signed the non-first-time-homebuyer attestation, or no guarantor
          has documented prior homeownership experience and no supporting documentation has been provided.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 96fe9ffdef858cba19f11a35323fb736999206a986a76613b2e04f6aae535867
        section: Loan Program Eligibility
        mnemonic: BOR-GUAR-ATTEST
