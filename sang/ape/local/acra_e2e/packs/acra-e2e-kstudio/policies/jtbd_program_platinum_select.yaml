        source_text: '# Prepayment Penalty Structure Verification - Base Version


          ## Purpose

          Validate that the prepayment penalty term and percentage structure on the loan match one of
          Acra''s published structures by term.


          ## Reference Documents

          ### Prepayment Documents

          - Note / Prepayment Rider: states the prepayment penalty term and the percentage charged in
          each year of the term


          ## Steps


          ### Step 1 - Initial Document Review

          - Note or Prepayment Rider states the prepayment penalty term (5, 3, 2, 1 year, or No Prepay)
          and the percentage charged in each year of the term.


          ### Step 2 - Eligibility Verification

          - Stated term and percentage structure are compared against the published structures: 5 Year
          (5/5/5/5/5 fixed or 5/4/3/2/1 stepdown), 3 Year (5/5/5 or 3/3/3 fixed), 2 Year (3/3 fixed),
          1 Year (3% fixed), or No Prepay.


          ### Step 3 - Validation and Verification

          - Percentage charged in each year of the Note/Prepayment Rider matches the corresponding year
          of the selected published structure exactly.


          ### Step 4 - Final Determination

          - Prepayment penalty structure is approved only when both the term and the year-by-year percentages
          match one of the published structures.


          ## Deterministic Validation Rules

          - Prepayment penalty term stated on the Note/Prepayment Rider is one of 5, 3, 2, 1 year, or
          No Prepay: TRUE = term condition satisfied, FALSE = term condition not satisfied.

          - Year-by-year percentage structure stated on the Note/Prepayment Rider matches one of the published
          structures for the selected term exactly: TRUE = structure condition satisfied, FALSE = structure
          condition not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Prepayment penalty term and year-by-year percentage structure match one of the published structures
          exactly.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Prepayment penalty term or percentage structure does not match any published structure.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The subject property is located in a state where prepayment penalties are not permitted and
          No Prepay is selected.'
