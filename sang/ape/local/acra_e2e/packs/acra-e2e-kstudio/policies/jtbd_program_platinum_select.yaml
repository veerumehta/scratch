            dates
        - name: TitleInformation
          entity_description: Vesting names, trust name/date, estate held
        reference_documents: '### Entity Documents

          - Certificate of Formation / Articles of Organization and amendments: legal entity name

          - Operating Agreement / Bylaws and amendments: member, manager, officer and designated-signer
          names

          - Ownership evidence (membership certificates, stock certificates / ledger, K-1s): owner names
          and percentages

          - Certificate of Good Standing, Certificate of Foreign Qualification, IRS SS-4 / EIN letter:
          entity name as registered

          - Unanimous Written Consent / Board Resolution: names of authorized signers

          ### Identification and Loan Documents

          - Government-issued photo identification for every guarantor and signer

          - Loan Application (1003), Note, Security Instrument, Personal Guarantee(s): borrower, guarantor
          and signer names

          - Letter of Explanation: for any name discrepancy'
        source_text: '# Entity Document Name Consistency - Base Version


          ## Purpose

          This JTBD confirms that names on the entity borrower''s documents match the identification of
          the individuals and the entity as it will appear on the Note, Deed of Trust and personal guarantees.
          Acra requires that names on the entity documents match the identification; if they do not match
          exactly, a letter of explanation is required to address the discrepancy. Applies to every entity
          borrower and to any trust vesting title.


          ## Reference Documents

          ### Entity Documents

          - Certificate of Formation / Articles of Organization and amendments: legal entity name

          - Operating Agreement / Bylaws and amendments: member, manager, officer and designated-signer
          names

          - Ownership evidence (membership certificates, stock certificates / ledger, K-1s): owner names
          and percentages

          - Certificate of Good Standing, Certificate of Foreign Qualification, IRS SS-4 / EIN letter:
          entity name as registered

          - Unanimous Written Consent / Board Resolution: names of authorized signers

          ### Identification and Loan Documents

          - Government-issued photo identification for every guarantor and signer

          - Loan Application (1003), Note, Security Instrument, Personal Guarantee(s): borrower, guarantor
          and signer names

          - Letter of Explanation: for any name discrepancy


          ## Steps


          ### Step 1 - Initial Document Review

          - Entity name is extracted from each entity document and the individual names are extracted
          from the Operating Agreement / Bylaws, ownership evidence and Consent / Resolution.


          ### Step 2 - Eligibility Verification

          - Entity name is identical (including suffix such as LLC, Inc., LP) across the formation document,
          Good Standing certificate, EIN letter, Consent / Resolution and the loan documents.


          ### Step 3 - Validation and Verification

          - Each individual name on the entity documents is compared with the name on that individual''s
          government-issued identification and on the personal guarantee; any variance (spelling, middle
          name / initial, suffix, former name) is identified.


          ### Step 4 - Final Determination

          - Names match exactly and the file proceeds, or a signed letter of explanation addressing each
          discrepancy is on file; unexplained discrepancies condition the file.


          ## Deterministic Validation Rules

          - Entity legal name is identical across all entity documents and loan documents: TRUE = pass,
          FALSE = discrepancy.

          - Every individual name on entity documents matches the government-issued identification exactly:
          TRUE = pass, FALSE = discrepancy.

          - For every discrepancy identified, a letter of explanation signed by the affected party is
          on file: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - All entity and individual names match exactly across entity documents, identification and
          loan documents, or every discrepancy is addressed by a letter of explanation on file.


          ### Conditional

          Assign **Conditional** when:

          - A name discrepancy has been identified and the letter of explanation has been requested but
          not yet received.


          ### Fail

          Assign **Fail** when:

          - A name discrepancy exists that is not addressed by a letter of explanation, or the letter
          does not reconcile the identities.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual (not an entity or trust) and no entity documents are in the
          file.'
        source_digest: 5926ce1b9dc80e9ffa2c311fa1b1a4207195c328a8c4cac322518c9ee6f5b9f6
