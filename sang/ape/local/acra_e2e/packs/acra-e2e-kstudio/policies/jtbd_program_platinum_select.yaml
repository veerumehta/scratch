  - rule_id: AFC-SEASON-THRESH.platinum_select
    condition:
      kind: procedure
      purpose: Determine whether the seasoning of funds to close must be verified, based on the transaction
        type, CLTV, and the dollar amount of funds to close.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Loan Application identifies the transaction as consumer or business purpose.

        - Closing Disclosure states the funds to close amount and the transaction''s CLTV.


        ### Step 2 - Eligibility Verification

        - CLTV is compared to the 70% threshold to determine whether seasoning verification is triggered.

        - For business purpose loans, funds to close amount is compared to the $50,000 threshold in combination
        with the CLTV threshold.


        ### Step 3 - Validation and Verification

        - Where verification is triggered, Bank Statements or VOD documenting the seasoning of the source
        account(s) are obtained.


        ### Step 4 - Final Determination

        - Seasoning verification is required when the loan is a consumer transaction with CLTV over 70%,
        or a business purpose loan with funds to close over $50,000 and CLTV over 70%; verification is
        not required outside those conditions.'
      checks:
      - 'Transaction is a consumer transaction and CLTV exceeds 70%: TRUE = seasoning verification required,
        FALSE = evaluate the business-purpose condition.'
      - 'Transaction is a business purpose loan with funds to close exceeding $50,000 and CLTV exceeding
        70%: TRUE = seasoning verification required, FALSE = seasoning verification not required under
        this rule.'
