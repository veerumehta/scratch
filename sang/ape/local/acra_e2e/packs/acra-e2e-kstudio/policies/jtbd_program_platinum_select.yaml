        - label: ARM Margin
          metric_key: LoanCore.arm_margin_percent
          metric_mnemonic: PPT_ARMTERMS_LM1
          indicator_context: Compare LoanCore.arm_margin_percent, arm_index_type, arm_initial_cap_percent,
            arm_periodic_cap_percent, and arm_lifetime_cap_percent against the published Platinum Select
            ARM terms (1 Yr CMT index; 2/2/6 caps; margin 3.00/3.25/3.50 by decisioning score band). Indicator
            is 'Pass' when all values match the band applicable to the decisioning credit score; 'Fail'
