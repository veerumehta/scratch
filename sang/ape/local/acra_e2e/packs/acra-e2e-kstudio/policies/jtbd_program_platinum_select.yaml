        source_text: '# Interest-Only Payment Calculation Verification - Base Version


          ## Purpose

          Validate that the interest-only payment amount and post-term recast are calculated per Acra''s
          stated interest-only payment methodology.


          ## Reference Documents

          ### Loan Terms Documents

          - Note: states the interest-only payment amount, the interest-only term, and the recast/amortization
          schedule after the interest-only period


          ## Steps


          ### Step 1 - Initial Document Review

          - Note states the interest-only payment amount applicable during the interest-only term.


          ### Step 2 - Eligibility Verification

          - Interest-only payment amount stated on the Note is calculated as the amount sufficient to
          pay accrued interest on the loan balance monthly at the time of origination.


          ### Step 3 - Validation and Verification

          - Note''s amortization schedule shows the payment recasting to a fully amortized principal-and-interest
          payment for the remaining term after the interest-only period ends.


          ### Step 4 - Final Determination

          - Interest-only payment structure is approved only when the initial payment matches the accrued-interest-only
          calculation and the schedule correctly recasts to a fully amortized payment after the interest-only
          term.


          ## Deterministic Validation Rules

          - Interest-only payment amount on the Note equals the amount sufficient to pay accrued monthly
          interest on the loan balance at origination: TRUE = payment calculation condition satisfied,
          FALSE = condition not satisfied.

          - Note''s amortization schedule shows recast to a fully amortized payment for the balance of
          the term after the interest-only period: TRUE = recast condition satisfied, FALSE = condition
          not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Interest-only payment matches the accrued-interest-only calculation and the schedule recasts
          to a fully amortized payment after the interest-only term.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Interest-only payment amount does not match the accrued-interest-only calculation, or the
          schedule does not recast to a fully amortized payment after the interest-only term.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan product is fully amortizing rather than interest-only.'
        source_digest: 9cb2a85e82cd8609399a5dd1582badeaab546e3204ef9c7a84dfae2f316a2ef5
