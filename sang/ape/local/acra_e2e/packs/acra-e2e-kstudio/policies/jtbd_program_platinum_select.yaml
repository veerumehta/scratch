  - rule_id: DSCR-IO-DENOM.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD fixes the payment that enters the DSCR denominator when the loan is a 30 Yr Fixed
        Interest-Only or 5 Yr ARM Interest-Only product. Acra calculates the DSCR using the first payment
        due under the terms of the Note, and defines the interest-only payment as the amount sufficient
        to pay the accrued interest monthly at origination; the §5.32 denominator, however, lists "annual
        principal, interest, real estate taxes, property insurance, and association fees". Which payment
        enters the denominator on an interest-only loan is an open point (Acra confirmation requested
        → Q-21). This JTBD applies the first-payment-due rule, computes the fully amortized alternative,
        and conditions files whose eligibility depends on the answer.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Note confirms the loan is interest-only, states the interest-only payment as the first payment
        due and the term after which payments recast.


        ### Step 2 - Eligibility Verification

        - Interest-only denominator is assembled from the first payment due plus taxes, insurance, association
        fees and any subordinate lien payment; the fully amortized alternative is assembled from the recast
        P&I plus the same components.


        ### Step 3 - Validation and Verification

        - DSCR is computed on both denominators and each is compared with the channel minimum (1.20 Correspondent
        / 1.00 Wholesale).


        ### Step 4 - Final Determination

        - Loan meeting the minimum under both denominators proceeds; a loan meeting it only under the
        interest-only denominator proceeds subject to Acra''s Q-21 response; a loan failing under the
        interest-only denominator fails.'
      checks:
      - 'LoanCore.interest_only_period_months > 0: TRUE = continue, FALSE = not applicable.'
      - 'RatioSet.total_monthly_obligation_usd equals Note first payment due plus taxes, insurance, HOA
        and subordinate payment: TRUE = denominator basis correct, FALSE = recalculation required.'
      - 'DSCR on the interest-only denominator >= channel minimum: TRUE = continue, FALSE = fail.'
      - 'DSCR on the fully amortized denominator >= channel minimum: TRUE = pass, FALSE = conditional
        (Q-21).'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
