        source_text: '# Thirty-Day Minimum Documentation Requirement - Base Version


          ## Purpose

          Verify that all transactions meet the minimum 30-day documentation requirement for funds used
          to close.


          ## Reference Documents

          ### Asset Documents

          - Bank Statements / VOD: source for the 30-day documentation window


          ## Steps


          ### Step 1 - Initial Document Review

          - Bank Statements or VOD covering the source account(s) for funds to close are present in the
          file.


          ### Step 2 - Eligibility Verification

          - Documentation period covered by the Bank Statements or VOD is calculated in days.


          ### Step 3 - Validation and Verification

          - Documentation period is compared to the 30-day minimum.


          ### Step 4 - Final Determination

          - Funds-to-close documentation is approved only when at least 30 days of documentation is present
          for the source account(s).


          ## Deterministic Validation Rules

          - Documentation period covered by Bank Statements or VOD for the source account(s) is at least
          30 days: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - At least 30 days of documentation is present for the funds-to-close source account(s).


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Documentation covers fewer than 30 days for the funds-to-close source account(s).


          ### Not Applicable

          There is no case for this outcome.'
