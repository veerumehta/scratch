        reference_documents: '### Entity Tax Identification Documents

          - IRS Form SS-4 or EIN Issuance Letter: entity''s Employer Identification Number

          - Letter of Explanation: grounds for an EIN exception request, when applicable'
        source_text: '# Entity EIN / Tax ID Documentation - Base Version


          ## Purpose

          This JTBD confirms that the entity borrower''s federal tax identification number is documented
          in the loan file, or that an exception to this requirement has been properly requested through
          Acra''s Legal Department.


          ## Reference Documents

          ### Entity Tax Identification Documents

          - IRS Form SS-4 or EIN Issuance Letter: entity''s Employer Identification Number

          - Letter of Explanation: grounds for an EIN exception request, when applicable


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for IRS Form SS-4 or an EIN issuance letter bearing the entity borrower''s
          name and Employer Identification Number.


          ### Step 2 - Eligibility Verification

          - EIN on the SS-4 or issuance letter matches the Taxpayer Identification Number represented
          for the entity elsewhere in the file.


          ### Step 3 - Validation and Verification

          - Where no SS-4 or EIN issuance letter is available, the file contains an exception request
          submitted to Acra''s Legal Department with a letter of explanation stating the grounds.


          ### Step 4 - Final Determination

          - EIN documentation or an approved exception is on file and the file proceeds, or neither is
          present and the file is conditioned.


          ## Deterministic Validation Rules

          - IRS Form SS-4 or an EIN issuance letter for the entity borrower is present in the file: TRUE
          = pass, FALSE = fail.

          - Where the SS-4/issuance letter is absent, an EIN exception request with a letter of explanation
          submitted to Acra''s Legal Department is present in the file: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - IRS Form SS-4 or an EIN issuance letter for the entity borrower is present in the file.


          ### Conditional

          Assign **Conditional** when:

          - No SS-4/EIN issuance letter is present, but an EIN exception request with a letter of explanation
          has been submitted to Legal and is pending a determination.


          ### Fail

          Assign **Fail** when:

          - Neither an SS-4/EIN issuance letter nor an EIN exception request is present in the file.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is being made to an individual borrower rather than an entity borrower.'
        source_digest: 1e428f6058f834213da3013747f4d6e85b0b7b982de308bba3376d8b155288b8
