        reference_documents: '### Property Documents

          - Appraisal Report: subject property''s type, unit count, and construction characteristics

          - Condo Project Documentation (questionnaire, HOA certification): warrantability status when
          the property is a condominium


          ### Loan Origination Records

          - LOS: system of record for the subject property type field'
        source_text: '# Eligible Property Types - Base Version


          ## Purpose

          This JTBD determines whether the subject property''s type falls within the set of property types
          Acra publishes as eligible for the Platinum Select DSCR program.


          ## Reference Documents

          ### Property Documents

          - Appraisal Report: subject property''s type, unit count, and construction characteristics

          - Condo Project Documentation (questionnaire, HOA certification): warrantability status when
          the property is a condominium


          ### Loan Origination Records

          - LOS: system of record for the subject property type field


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal report identifies the subject property''s type and number of units.

          - LOS property type field for the subject property is populated.


          ### Step 2 - Eligibility Verification

          - SubjectProperty.property_type value is one of SFR, Townhome, PUD, Condo, or a 2-unit dwelling.


          ### Step 3 - Validation and Verification

          - Where the property type is a condominium, condo project documentation (questionnaire, HOA
          certification) confirms the project''s warrantable classification.


          ### Step 4 - Final Determination

          - Subject property type is confirmed eligible and the file proceeds, or the type is not among
          the eligible list and the loan is declined.


          ## Deterministic Validation Rules

          - SubjectProperty.property_type is one of SFR, Townhome, PUD, Condo, or a 2-unit property: TRUE
          = pass, FALSE = fail.

          - Where SubjectProperty.property_type is Condo, SubjectProperty.condo_project_classification
          indicates a warrantable project: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - SubjectProperty.property_type is SFR, Townhome, or PUD, or is a 2-unit dwelling, or is a Condo
          with a warrantable project classification.


          ### Conditional

          Assign **Conditional** when:

          - SubjectProperty.property_type is Condo and the condo project warrantability review is pending
          at the time of underwriting; the file may proceed with a condition to obtain the completed project
          review prior to closing.


          ### Fail

          Assign **Fail** when:

          - SubjectProperty.property_type is not among SFR, Townhome, PUD, Condo, or a 2-unit dwelling,
          or is a Condo without a warrantable project classification.


          ### Not Applicable

          There is no case for this outcome — property type eligibility is evaluated on every Platinum
          Select DSCR loan.'
        source_digest: f8465321c14ad5c1e2199e2dd0c4f7d7bf61474a669ffe4da169c494bc236869
        section: Appraisal Review
        mnemonic: PRE-TYPES
        also_as:
          standard: PRE-TYPES
