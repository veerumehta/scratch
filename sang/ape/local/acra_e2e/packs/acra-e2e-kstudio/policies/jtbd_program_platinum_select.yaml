        reference_documents: '### Credit Documentation

          - Credit Report: shows reported mortgage tradelines and their payment history for properties
          the borrower owns.

          ### Mortgage / Rental Payment Documentation

          - Mortgage statement or Verification of Mortgage (VOM): evidences payment history for mortgages
          not reported on the Credit Report.'
        source_text: '# Mortgage / Rental Rating Evaluation Window - Base Version


          ## Purpose

          This JTBD determines the mortgage / rental payment rating used for pricing by evaluating the
          trailing 12-month payment history for properties the borrower owns or rents, and confirms that
          unreported mortgages are separately documented.


          ## Reference Documents

          ### Credit Documentation

          - Credit Report: shows reported mortgage tradelines and their payment history for properties
          the borrower owns.

          ### Mortgage / Rental Payment Documentation

          - Mortgage statement or Verification of Mortgage (VOM): evidences payment history for mortgages
          not reported on the Credit Report.


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report shows payment history for reported mortgage tradelines tied to properties the
          borrower owns or rents.


          ### Step 2 - Eligibility Verification

          - Properties evaluated for the rating are limited to those the borrower owned or rented within
          the 12 months preceding the Credit Report date, establishing the rating window.


          ### Step 3 - Validation and Verification

          - Where a mortgage on an evaluated property is not reported on the Credit Report, the file contains
          an independent mortgage statement or VOM evidencing that property''s trailing 12-month payment
          history.


          ### Step 4 - Final Determination

          - Trailing 12-month payment history, from the Credit Report or from independent documentation,
          is compiled across all evaluated properties to reach the rating pass/fail determination.


          ## Deterministic Validation Rules

          - A property was owned or rented by the borrower within the 12 months preceding the Credit Report
          date: TRUE = its payment history is within the rating window and must be evaluated, FALSE =
          it is outside the window.

          - A reported mortgage tradeline exists on the Credit Report for the property: TRUE = Credit
          Report payment history is used for the rating, FALSE = an independent mortgage statement or
          VOM is required to evaluate the rating.

          - Where a mortgage is unreported: independent mortgage statement or VOM documentation is on
          file: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Trailing 12-month payment history is available, either from a reported Credit Report tradeline
          or from independent documentation, for every property within the rating window.


          ### Conditional

          Assign **Conditional** when:

          - A mortgage within the rating window is not reported on the Credit Report and independent documentation
          has not yet been provided but can be obtained prior to closing.


          ### Fail

          Assign **Fail** when:

          - A mortgage within the rating window is not reported on the Credit Report and no independent
          documentation evidencing its trailing 12-month payment history is obtained prior to closing.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: cd5e8c73e67d7da8891cdc78880503aaea7657720f171bc5895ecc754803bbcf
        section: Credit Review & Analysis
        mnemonic: CRD-MTG-RATING
        also_as:
          standard: CRD-MTG-RATING
