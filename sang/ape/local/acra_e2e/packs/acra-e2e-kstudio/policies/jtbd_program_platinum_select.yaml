            read LoanCore.interest_only_period_months. Indicator is 'Pass' when it is 0 (fully amortizing);
            'Fail' when greater than 0; 'Not Applicable' when the subject is not listed for sale. Do not
            populate borrower_ids for this unified metric under any circumstance.
          description_template: 'Interest-only months: {interest_only_period_months}; listed for sale:
            {listed_for_sale}'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
