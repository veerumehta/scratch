          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Credit and Housing History Documents

          - Credit Report: shows mortgage and rental tradeline payment history for the most recent 12
          months

          - Verification of Mortgage / Verification of Rent: supplements the Credit Report where a housing
          payment is not reported to a credit bureau'
        source_text: '# Housing History (0x30x12) Verification - Base Version


          ## Purpose

          Verify the borrower''s recent housing payment history meets the program''s stated 0x30x12 standard
          prior to loan approval.


          ## Reference Documents

          ### Credit and Housing History Documents

          - Credit Report: shows mortgage and rental tradeline payment history for the most recent 12
          months

          - Verification of Mortgage / Verification of Rent: supplements the Credit Report where a housing
          payment is not reported to a credit bureau


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report is reviewed for mortgage and rental tradelines reported over the most recent
          12 months.


          ### Step 2 - Eligibility Verification

          - Verification of Mortgage or Verification of Rent is obtained when a housing payment is not
          reported on the Credit Report, to document the most recent 12 months of payment history.


          ### Step 3 - Validation and Verification

          - Payment history from the Credit Report and any Verification of Mortgage/Rent is reviewed for
          any payment reported 30 or more days late within the most recent 12 months.


          ### Step 4 - Final Determination

          - Housing history requirement is satisfied only when no mortgage or rental payment in the most
          recent 12 months was reported 30 or more days late.


          ## Deterministic Validation Rules

          - Credit Report and any Verification of Mortgage/Rent show zero housing payments 30 or more
          days late within the most recent 12 months: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - No mortgage or rental payment in the most recent 12 months was reported 30 or more days late.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - One or more mortgage or rental payments in the most recent 12 months were reported 30 or more
          days late.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 97041a626c86433aa52b495f689a0367e9e371f36a1790e72022ff036ecfb847
