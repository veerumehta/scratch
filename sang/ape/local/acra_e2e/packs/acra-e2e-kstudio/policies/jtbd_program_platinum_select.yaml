        source_text: '# Short-Term Rental Income Exclusion - Base Version


          ## Purpose

          Ensure that only long-term rental income is used to qualify DSCR, excluding short-term or nightly-rental
          cash flow from the qualifying rent figure.


          ## Reference Documents

          ### Rent Documentation

          - Lease Agreement: states tenancy term and occupancy type

          - Form 1007 / Form 1025: states market rent based on comparable long-term rentals

          - Property Listing / Booking Platform Records: evidence of short-term or nightly rental activity,
          when present in the file


          ## Steps


          ### Step 1 - Initial Document Review

          - Lease Agreement, when present, states a tenancy term of one month or longer.


          ### Step 2 - Eligibility Verification

          - Property listing, marketing materials, or booking platform records in the file do not show
          the subject property being advertised or rented on a nightly or short-term basis.


          ### Step 3 - Validation and Verification

          - Form 1007 or Form 1025 market rent value is based on comparable long-term rental rates rather
          than nightly or short-term comparable rates.


          ### Step 4 - Final Determination

          - Rental income is approved for DSCR qualification only when the documented tenancy is long-term;
          short-term or nightly rental income is excluded from the DSCR numerator.


          ## Deterministic Validation Rules

          - Lease Agreement or occupancy documentation shows a tenancy term of one month or longer: TRUE
          = income eligible for DSCR qualification under this rule, FALSE = income is not eligible under
          this rule.

          - Property listing or booking platform records in the file show nightly or short-term rental
          marketing for the subject property: TRUE = income is excluded from DSCR qualification, FALSE
          = no exclusion applies on this basis.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Documented tenancy is long-term (lease term of one month or longer, or no short-term marketing
          evidence is present).


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Property listing or booking platform records show the subject property is marketed or rented
          on a short-term or nightly basis.


          ### Not Applicable

          There is no case for this outcome.'
