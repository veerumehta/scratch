          entity_type: Asset
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Asset Verification Documents

          - Bank Statement(s): most recent month(s) statement for the source account

          - Verification of Deposit (VOD): reflects current and average balance for the most recent month(s)'
        source_text: '# Acceptable Fund Seasoning Verification Documentation - Base Version


          ## Purpose

          Verify that acceptable documentation is used to evidence the seasoning of the source account(s)
          when seasoning verification is required.


          ## Reference Documents

          ### Asset Verification Documents

          - Bank Statement(s): most recent month(s) statement for the source account

          - Verification of Deposit (VOD): reflects current and average balance for the most recent month(s)


          ## Steps


          ### Step 1 - Initial Document Review

          - File contains either a Bank Statement for the most recent month(s) or a VOD for the source
          account.


          ### Step 2 - Eligibility Verification

          - Bank Statement or VOD covers the most recent month(s) required to establish seasoning.


          ### Step 3 - Validation and Verification

          - Account number and balance on the Bank Statement or VOD match the source account referenced
          in the asset documentation for the transaction.


          ### Step 4 - Final Determination

          - Seasoning verification is satisfied only when a Bank Statement for the most recent month(s),
          or a VOD reflecting current and average balance for the most recent month(s), is present and
          matches the source account.


          ## Deterministic Validation Rules

          - Bank Statement for the most recent month(s) is present for the source account: TRUE = pass,
          FALSE = evaluate the VOD alternative.

          - VOD reflecting current and average balance for the most recent month(s) is present for the
          source account: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A Bank Statement for the most recent month(s) or a VOD reflecting current and average balance
          is present for the source account.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Neither a Bank Statement nor a VOD is present for the source account when seasoning verification
          is required.


          ### Not Applicable

          Assign **Not Applicable** when:

          - Seasoning verification is not triggered for the transaction.'
