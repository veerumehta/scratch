        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Interest-Only DSCR Denominator
          metric_key: RatioSet.total_monthly_obligation_usd
          metric_mnemonic: DSCR_IODENOM_LM1
          indicator_context: When LoanCore.interest_only_period_months > 0, confirm RatioSet.total_monthly_obligation_usd
            equals the Note's first payment due (interest-only payment) plus monthly taxes, insurance,
            association fees and any subordinate lien payment, and also compute the alternative denominator
            using the fully amortized P&I. Indicator is 'Pass' when the DSCR meets the channel minimum
            under both denominators; 'Conditional' when it meets the minimum only on the interest-only
            denominator (Q-21); 'Fail' when it fails under the interest-only denominator; 'Not Applicable'
            when the loan is fully amortizing. Do not populate borrower_ids for this unified metric under
            any circumstance.
          calculation_context: IO denominator = Note first payment (interest-only) + taxes + insurance
            + HOA + subordinate payment. Amortized denominator = fully amortized P&I + taxes + insurance
            + HOA + subordinate payment. DSCR_io = qualifying rent ÷ IO denominator; DSCR_am = qualifying
            rent ÷ amortized denominator.
          description_template: 'IO denominator: ${io_denominator} (DSCR {dscr_io}); amortized denominator:
            ${amortized_denominator} (DSCR {dscr_amortized}); channel minimum {channel_min_dscr}'
        entity_types:
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months'
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: MortgageLoanInformation
          entity_description: '1003 L3: amortization, interest-only flag and term'
        extraction_targets:
        - description: IO and amortized DSCR denominators
          entity_type: RatioSet
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - CREATE
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Loan Documents

          - Note: interest-only term, first payment amount due, recast to fully amortized payment

          - Tax Certification, Hazard Insurance Policy, HOA Statement: taxes, insurance and association
          fees

          - Subordinate lien statement, if any: monthly payment

          ### Income Documents

          - Form 1007 / 1025 and Lease: qualifying gross rent (from DSCR-QUALRENT)'
        source_text: '# DSCR Denominator on Interest-Only Loans - Base Version


          ## Purpose

          This JTBD fixes the payment that enters the DSCR denominator when the loan is a 30 Yr Fixed
          Interest-Only or 5 Yr ARM Interest-Only product. Acra calculates the DSCR using the first payment
          due under the terms of the Note, and defines the interest-only payment as the amount sufficient
          to pay the accrued interest monthly at origination; the §5.32 denominator, however, lists "annual
          principal, interest, real estate taxes, property insurance, and association fees". Which payment
          enters the denominator on an interest-only loan is an open point (Acra confirmation requested
          → Q-21). This JTBD applies the first-payment-due rule, computes the fully amortized alternative,
          and conditions files whose eligibility depends on the answer.


          ## Reference Documents

          ### Loan Documents

          - Note: interest-only term, first payment amount due, recast to fully amortized payment

          - Tax Certification, Hazard Insurance Policy, HOA Statement: taxes, insurance and association
          fees

          - Subordinate lien statement, if any: monthly payment

          ### Income Documents

          - Form 1007 / 1025 and Lease: qualifying gross rent (from DSCR-QUALRENT)


          ## Steps


          ### Step 1 - Initial Document Review

          - Note confirms the loan is interest-only, states the interest-only payment as the first payment
          due and the term after which payments recast.


          ### Step 2 - Eligibility Verification

          - Interest-only denominator is assembled from the first payment due plus taxes, insurance, association
          fees and any subordinate lien payment; the fully amortized alternative is assembled from the
          recast P&I plus the same components.


          ### Step 3 - Validation and Verification

          - DSCR is computed on both denominators and each is compared with the channel minimum (1.20
          Correspondent / 1.00 Wholesale).


          ### Step 4 - Final Determination

          - Loan meeting the minimum under both denominators proceeds; a loan meeting it only under the
          interest-only denominator proceeds subject to Acra''s Q-21 response; a loan failing under the
          interest-only denominator fails.


          ## Deterministic Validation Rules

          - LoanCore.interest_only_period_months > 0: TRUE = continue, FALSE = not applicable.

          - RatioSet.total_monthly_obligation_usd equals Note first payment due plus taxes, insurance,
          HOA and subordinate payment: TRUE = denominator basis correct, FALSE = recalculation required.

          - DSCR on the interest-only denominator >= channel minimum: TRUE = continue, FALSE = fail.

          - DSCR on the fully amortized denominator >= channel minimum: TRUE = pass, FALSE = conditional
          (Q-21).


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The loan is interest-only and the DSCR meets the channel minimum on both the interest-only
          and the fully amortized denominator.


          ### Conditional

          Assign **Conditional** when:

          - The DSCR meets the channel minimum on the interest-only (first-payment-due) denominator but
          not on the fully amortized denominator; the file proceeds subject to Acra''s Q-21 response.


          ### Fail

          Assign **Fail** when:

          - The DSCR on the interest-only denominator is below the channel minimum, or the denominator
          was not built from the first payment due under the Note.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is fully amortizing with no interest-only period.'
        source_digest: 18998e0c675ad08505cc13f886306cf110c07456f7fa45b1f04c9d4ee4f46657
        section: Income Stability & Sufficiency Analysis
        mnemonic: DSCR-IO-DENOM
        also_as:
          standard: DSCR-IO-DENOM
