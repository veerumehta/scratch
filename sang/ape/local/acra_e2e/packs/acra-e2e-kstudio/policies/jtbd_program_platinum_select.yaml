          - LOS loan record: provides the base loan amount, escrow waiver request status, and Section
          35 / HPML designation.

          ### Credit Documentation

          - Credit Report: shows mortgage payment history for the trailing 24 months.'
        source_text: '# Escrow Waiver Eligibility - Base Version


          ## Purpose

          This JTBD determines whether a Platinum Select DSCR loan qualifies for an escrow waiver based
          on the published loan-amount cap, mortgage payment history standard, and Section 35 (HPML) exclusion.


          ## Reference Documents

          ### Loan Origination System (LOS)

          - LOS loan record: provides the base loan amount, escrow waiver request status, and Section
          35 / HPML designation.

          ### Credit Documentation

          - Credit Report: shows mortgage payment history for the trailing 24 months.


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS loan record indicates an escrow waiver has been requested for the loan.


          ### Step 2 - Eligibility Verification

          - LOS loan record shows the base loan amount and the HPML / Section 35 designation for the loan.


          ### Step 3 - Validation and Verification

          - Base loan amount does not exceed $1,500,000.

          - Credit Report mortgage history shows no late payment of 30 days or more within the trailing
          24 months (0x30x24).

          - LOS loan record does not designate the loan as a Section 35 (HPML) loan.


          ### Step 4 - Final Determination

          - Loan amount, mortgage payment history, and Section 35 designation are evaluated together to
          reach the escrow-waiver pass/fail determination.


          ## Deterministic Validation Rules

          - LOS base loan amount <= $1,500,000: TRUE = loan-amount condition met, FALSE = fail.

          - Credit Report mortgage history shows zero 30-day-or-greater late payments within the trailing
          24 months: TRUE = 0x30x24 condition met, FALSE = fail.

          - LOS Section 35 (HPML) designation = TRUE: TRUE = fail, since Section 35 loans are ineligible
          for the escrow waiver.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Base loan amount is $1,500,000 or below, 0x30x24 mortgage history is met, and the loan is
          not designated Section 35 (HPML).


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Base loan amount exceeds $1,500,000, mortgage history shows a late payment within the trailing
          24 months, or the loan is designated Section 35 (HPML).


          ### Not Applicable

          Assign **Not Applicable** when:

          - No escrow waiver has been requested for the loan.'
        source_digest: 122b08706b1c17c54df73e947bbc3efe89827eca185067d558e63e9155ae29e1
