        source_text: '# Impounds Requirement for Listed-For-Sale Property - Base Version


          ## Purpose

          This JTBD confirms that impounds are established on a loan secured by a property listed for
          sale within the six months preceding the application date, regardless of any otherwise-approved
          escrow waiver.


          ## Reference Documents

          ### Property Listing Records

          - MLS / property listing history record: provides the subject property''s most recent listing
          date.

          ### Loan Origination System (LOS)

          - LOS loan record: provides the escrow / impound setup status and the application date.


          ## Steps


          ### Step 1 - Initial Document Review

          - MLS / property listing history record shows the subject property''s most recent listing date,
          if any.


          ### Step 2 - Eligibility Verification

          - Subject property''s most recent listing date is confirmed as falling within the six months
          preceding the LOS application date, which triggers the impounds requirement.


          ### Step 3 - Validation and Verification

          - LOS loan record shows impounds are established (escrow is not waived) for the loan.


          ### Step 4 - Final Determination

          - Impound setup status is compared against the listed-for-sale trigger to reach a pass/fail
          determination.


          ## Deterministic Validation Rules

          - MLS listing date is within six months before the LOS application date: TRUE = impounds are
          required for the loan, FALSE = the general escrow waiver rule applies instead.

          - Where impounds are required: LOS escrow waiver status = not waived: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The property was listed for sale within six months preceding the application date and impounds
          are established on the loan.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The property was listed for sale within six months preceding the application date and the
          loan reflects an escrow waiver instead of impounds.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The property was not listed for sale within the six months preceding the application date.'
        source_digest: f71d960c055ae15d8290f35be9e7dcbf26ebf310227381750d694ec451fbf3a7
