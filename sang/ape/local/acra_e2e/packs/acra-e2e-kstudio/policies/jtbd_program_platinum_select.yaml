        loan_metrics:
        - label: Subject Property Type
          metric_key: SubjectProperty.property_type
          metric_mnemonic: PRE_TYPE_LM1
          indicator_context: 'Compare SubjectProperty.property_type against the Platinum Select eligible
            list (SFR, Townhome, PUD, Warrantable Condo, Two-Unit). Indicator is ''Pass'' when property_type
            matches an eligible value (and, for Condo, the project is warrantable); ''Fail'' otherwise.
            Cross-verify with the appraisal report; on mismatch use the appraisal-extracted value. Do
            not populate borrower_ids for this unified metric under any circumstance. Ontology enum mapping:
            SFR -> ''SingleFamily''; Townhome -> ''Townhouse''; PUD -> ''PUD''; Warrantable Condo -> ''Condominium''
            / ''DetachedCondominium'' / ''HighRiseCondominium'' with SubjectProperty.condo_project_classification
            not ''NonWarrantable''; Two-Unit -> ''TwoToFourUnit'' with SubjectProperty.number_of_units
            = 2.'
