  - rule_id: AFC-RESERVE-OTHER.platinum_select
    condition:
      kind: procedure
      purpose: Verify that the borrower has documented reserves meeting the applicable requirement for
        the listed-for-sale, forbearance/mortgage-lates, or rent-loss-insurance-waiver triggers.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Property Listing History, Credit Report, and Rent Loss Insurance Quote/Declination are reviewed
        to identify which, if any, of the three reserve triggers apply to the transaction.


        ### Step 2 - Eligibility Verification

        - Applicable reserve amount is identified per trigger: 24 months of reserves for a property listed
        for sale within the last six months; 12 months of the subject''s payment in reserve for forbearance
