        source_text: '# Rent Loss Insurance CLTV Exemption - Base Version


          ## Purpose

          Determine whether a loan qualifies for the stated exemption from rent loss insurance based on
          combined loan-to-value at or below 70%, while documenting that the coverage trigger is expressed
          in LTV and the exemption is expressed in CLTV.


          ## Reference Documents

          ### Loan and Valuation Documents

          - Appraisal Report: states the appraised value used to compute CLTV

          - Closing Disclosure: states the total lien amount(s) used to compute CLTV

          - Title Commitment: identifies any subordinate liens included in the CLTV calculation


          ## Steps


          ### Step 1 - Initial Document Review

          - Appraisal Report, Closing Disclosure, and Title Commitment are used to calculate the combined
          loan-to-value ratio for the subject property.


          ### Step 2 - Eligibility Verification

          - Calculated CLTV is compared against the 70% exemption threshold.


          ### Step 3 - Validation and Verification

          - Where LTV exceeds 70% but CLTV is at or below 70%, the file documents which basis (LTV or
          CLTV) governs the rent loss insurance requirement for the loan.


          ### Step 4 - Final Determination

          - Loan is exempt from the rent loss insurance requirement when CLTV is at or below 70%; a loan
          with CLTV above 70% remains subject to the rent loss insurance coverage trigger.


          ## Deterministic Validation Rules

          - Calculated CLTV for the subject property is at or below 70%: TRUE = loan is exempt from the
          rent loss insurance requirement on this basis, FALSE = exemption does not apply on this basis.

          - LTV exceeds 70% while CLTV is at or below 70%: TRUE = file must document which basis governs
          before waiving rent loss insurance, FALSE = no basis conflict exists.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - CLTV is at or below 70% and rent loss insurance is not required on this basis.


          ### Conditional

          Assign **Conditional** when:

          - LTV exceeds 70% while CLTV is at or below 70%, and the file has not yet documented which basis
          governs the requirement.


          ### Fail

          There is no case for this outcome.


          ### Not Applicable

          Assign **Not Applicable** when:

          - CLTV exceeds 70%, and the loan is evaluated instead under the LTV-based coverage trigger.'
        source_digest: b938bfed8694094efc96b52e9ba9e7a74792acd41a233bbedd661c63d16f24d4
