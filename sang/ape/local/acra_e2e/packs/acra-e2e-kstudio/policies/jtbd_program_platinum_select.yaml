        source_text: '# Loan Amount, FICO and CLTV Matrix - Base Version


          ## Purpose

          This JTBD determines the maximum combined loan-to-value (CLTV) ratio permitted for a Platinum
          Select DSCR loan by locating the borrower''s decisioning FICO score within Acra''s published
          minimum-FICO tiers and reading the CLTV cap printed for the loan''s purpose (Purchase, Rate
          & Term, Cash-Out).


          ## Reference Documents

          ### Credit Documentation

          - Credit Report: provides the decisioning FICO score used to select the matrix row.

          ### Loan Origination System (LOS)

          - LOS loan record: provides the loan purpose and the proposed CLTV to be tested against the
          matrix cap.


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report shows a representative decisioning score for the borrower or, for an entity
          borrower, the applicable guarantor.

          - LOS loan record specifies a loan purpose value of Purchase, Rate & Term Refinance, or Cash-Out
          Refinance.


          ### Step 2 - Eligibility Verification

          - Decisioning FICO score is at or above 700, since no matrix row is printed for a score below
          700.

          - Decisioning FICO score is mapped to exactly one minimum-FICO tier: 730 and above, 721 through
          729, or 700 through 720.


          ### Step 3 - Validation and Verification

          - LOS loan purpose value matches one of the three matrix purpose columns before a CLTV cap is
          applied.

          - LOS proposed CLTV percent for the loan does not exceed the matrix-printed cap for the borrower''s
          FICO tier and purpose column.


          ### Step 4 - Final Determination

          - Matrix lookup produces a single maximum CLTV value for the loan''s FICO tier and purpose column,
          and that value is compared against the LOS proposed CLTV to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - Credit Report decisioning score >= 700: TRUE = a matrix row exists, FALSE = loan is ineligible
          under the matrix.

          - Decisioning score >= 730: TRUE = 730-tier caps apply (80% Purchase / 80% Rate & Term / 75%
          Cash-Out).

          - Decisioning score is 721 through 729: TRUE = 721-tier caps apply (80% Purchase / 80% Rate
          & Term / 65% Cash-Out).

          - Decisioning score is 700 through 720: TRUE = 700-tier caps apply (80% Purchase / 80% Rate
          & Term / 55% Cash-Out). A score of exactly 720 is read literally into the 700 row because the
          printed thresholds are 730 / 721 / 700; whether 721 is intended or should read 720 is open (Acra
          confirmation requested → Q-01).

          - LOS proposed CLTV percent <= the matrix cap identified for the borrower''s tier and purpose
          column: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Decisioning score is 700 or higher and LOS proposed CLTV is at or below the matrix cap for
          the borrower''s FICO tier and loan purpose.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Decisioning score is below 700, or LOS proposed CLTV exceeds the matrix cap for the borrower''s
          FICO tier and loan purpose.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 62f89fd8e6f3f7ce2b941ab2eba7e6c41da53af17a676b1a6456e00dd5bfe966
