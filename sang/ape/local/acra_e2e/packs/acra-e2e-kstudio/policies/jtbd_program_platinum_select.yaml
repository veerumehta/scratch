        reference_documents: '### Loan Origination Records

          - LOS loan record: channel / delivery type field

          - Lock Confirmation or Loan Registration: identifies whether the loan was submitted through
          a Correspondent seller or a Wholesale broker

          - Correspondent Purchase Agreement or Broker Agreement: counterparty type'
        source_text: '# Origination Channel Determination - Base Version


          ## Purpose

          This JTBD establishes the loan''s origination channel before any channel-dependent rule is applied.
          Acra publishes two channel-specific requirements for Platinum Select: the minimum DSCR (Correspondent
          ≥ 1.2, Wholesale ≥ 1.0) and the Correspondent pricing limit of 60% CLTV for a 700-719 decisioning
          FICO. Downstream JTBDs (DSCR-MINRATIO, DSCR-LIST-MIN, LPE-MIN-DSCR, LFC-CORR-CAP, CRD-MINSCORE,
          PRE-LISTCOND, LFC-CLTV-FINAL) rely on the channel recorded here.


          ## Reference Documents

          ### Loan Origination Records

          - LOS loan record: channel / delivery type field

          - Lock Confirmation or Loan Registration: identifies whether the loan was submitted through
          a Correspondent seller or a Wholesale broker

          - Correspondent Purchase Agreement or Broker Agreement: counterparty type


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS channel field is populated and the lock confirmation / registration record identifies
          the submitting counterparty.


          ### Step 2 - Eligibility Verification

          - Channel value is one of the two channels through which Acra offers the program: Correspondent
          or Wholesale.


          ### Step 3 - Validation and Verification

          - LOS channel value agrees with the counterparty type on the lock confirmation / registration
          record and the governing counterparty agreement.


          ### Step 4 - Final Determination

          - Channel is recorded as Correspondent or Wholesale and the corresponding minimum DSCR (1.20
          or 1.00) and Correspondent-cap applicability are noted for downstream JTBDs.


          ## Deterministic Validation Rules

          - LoanCore.channel is populated: TRUE = proceed, FALSE = fail.

          - LoanCore.channel is ''Correspondent'' or ''Wholesale'': TRUE = pass, FALSE = fail.

          - LoanCore.channel agrees with the counterparty type on the lock/registration record: TRUE =
          pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The channel is populated with Correspondent or Wholesale and agrees with the lock/registration
          record.


          ### Conditional

          Assign **Conditional** when:

          - The LOS channel field is populated but the lock/registration record is not yet in the file
          to corroborate it; the file proceeds pending that record.


          ### Fail

          Assign **Fail** when:

          - The channel is blank, is not Correspondent or Wholesale, or contradicts the lock/registration
          record.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 8e03bffcc080f14d4ad0828b83f561c6df797474b8f288b916de625d6865b06c
