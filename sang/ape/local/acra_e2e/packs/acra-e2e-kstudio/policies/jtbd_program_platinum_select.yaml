          indicator_context: Check Liability.late_30_days_count on the applicant's mortgage tradelines
            to identify a reported late payment within the last 12 months, which triggers the rent-receipt
            or reserve alternative documentation requirement on a tenant-occupied subject. Indicator is
            'Pass' when late_30_days_count = 0 (overlay not triggered), or when triggered and qualifying
            rent-receipt or reserve documentation is on file; 'Fail' when triggered and neither documentation
            path is on file. Do not populate borrower_ids for this unified metric under any circumstance.
          description_template: 'Late 30-day count (12mo): {late_30_days_count} (overlay triggered: {overlay_triggered})'
        entity_types:
        - name: Liability
          entity_description: Mortgage and rental obligations with payment history and subject-lien flags
        - name: Asset
          entity_description: Verified funds for closing and reserves, including gifts and foreign-held
            accounts
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months'
        reference_documents: '### Credit and Payment History

          - Credit Report: shows any forbearance or mortgage late payment reported within the 12 months
          preceding the application date.

          ### Rent and Reserve Documentation

          - Rent receipt records: evidence of timely rental payment receipt for the prior two months.

          - Asset / reserve statements: evidence of reserve funds equal to 12 months of the subject property''s
          payment.'
        source_text: '# Forbearance / Mortgage-Late Overlay - Base Version


          ## Purpose

          This JTBD determines whether an applicant''s recent forbearance or mortgage late payment triggers
          Acra''s alternative documentation requirement on a tenant-occupied subject property, and confirms
          that one of the two permitted evidence paths is satisfied.


          ## Reference Documents

          ### Credit and Payment History

          - Credit Report: shows any forbearance or mortgage late payment reported within the 12 months
          preceding the application date.

          ### Rent and Reserve Documentation

          - Rent receipt records: evidence of timely rental payment receipt for the prior two months.

          - Asset / reserve statements: evidence of reserve funds equal to 12 months of the subject property''s
          payment.


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report shows whether the applicant or guarantor has a forbearance or mortgage late
          payment reported within the 12 months preceding the application date.


          ### Step 2 - Eligibility Verification

          - Subject property is confirmed as tenant-occupied, which is a condition for the alternative
          documentation path to apply.


          ### Step 3 - Validation and Verification

          - File contains either rent receipt records evidencing timely receipt of the prior two months''
          rental payments, or asset / reserve statements evidencing 12 months of the subject property''s
          payment held in reserve, which may be drawn from the transaction''s cash-in-hand.


          ### Step 4 - Final Determination

          - Presence of one of the two qualifying documentation paths is compared against the forbearance
          / late-payment trigger to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - Credit Report shows a forbearance or mortgage late reported within the last 12 months AND
          subject property is tenant-occupied: TRUE = the alternative documentation requirement applies,
          FALSE = it does not apply.

          - Where the requirement applies: file contains rent receipt records for the prior two months
          OR asset / reserve statements evidencing 12 months of the subject payment in reserve: TRUE =
          pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The forbearance / late trigger is present on a tenant-occupied subject property and either
          the two-month rent-receipt evidence or the 12-month reserve evidence is on file.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The forbearance / late trigger is present on a tenant-occupied subject property and neither
          qualifying documentation path is on file.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No forbearance or mortgage late is reported within the 12 months preceding the application
          date.'
        source_digest: e42df02345a8b01acd186b2f30c714225b4c0b9a0f782fa1287d6512b3d1a857
