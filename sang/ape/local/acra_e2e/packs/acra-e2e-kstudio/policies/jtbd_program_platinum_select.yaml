  - rule_id: CRD-MATURED.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD confirms that a matured mortgage loan tied to a rated property is evaluated using
        its maturity date, and that any extension of that maturity date is supported by a written agreement.
      steps:
