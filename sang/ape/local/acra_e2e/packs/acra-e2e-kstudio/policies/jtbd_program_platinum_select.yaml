        source_text: '# Entity Ownership Evidence - Base Version


          ## Purpose

          This JTBD confirms that documentation evidencing every person''s ownership interest in the entity
          borrower is present in the file, using the document type appropriate to the entity''s legal
          form.


          ## Reference Documents

          ### Ownership Evidence Documents

          - Operating Agreement (LLCs and Partnerships): identification of all persons by name with ownership
          interest, or membership interest certificates/units

          - Shareholder / Stockholder Certificates or Corporate Stock Ledger (S or C Corporations): record
          of all outstanding shares

          - Affidavit of Lost Stock Certificate: substitute when certificates are lost, destroyed, mutilated,
          or otherwise unavailable

          - Most Recent K-1 Statement and CPA/Tax Preparer Letter: alternative for S-corporations or Partnerships
          where both stock certificate and stock ledger are unavailable


          ## Steps


          ### Step 1 - Initial Document Review

          - Entity type (LLC, Partnership, S Corp, or C Corp) is identified from the formation document.

          - Loan file is checked for the ownership evidence document type corresponding to that entity
          type.


          ### Step 2 - Eligibility Verification

          - For LLCs/Partnerships: the Operating Agreement identifies, or attaches as an exhibit, all
          persons by name with their ownership interest, or membership interest certificates are provided.

          - For S/C Corporations: shareholder/stockholder certificates or the corporate stock ledger account
          for all outstanding shares noted in the formation document.


          ### Step 3 - Validation and Verification

          - Where stock certificates are lost, destroyed, mutilated, or unavailable, an Affidavit of Lost
          Stock Certificate is present.

          - Where both stock certificate and stock ledger are unavailable for an S-corporation or Partnership,
          the file contains the most recent preceding tax year''s K-1 for every 20%-or-greater member
          and a CPA/Tax Preparer letter affirming current ownership.


          ### Step 4 - Final Determination

          - Ownership evidence requirement is satisfied for the entity''s legal form and the file proceeds,
          or the required document is missing and the file is conditioned.


          ## Deterministic Validation Rules

          - The ownership evidence document type appropriate to the entity''s legal form (Operating Agreement/membership
          certificates for LLC/Partnership, or stock certificates/ledger for corporations) is present
          in the file: TRUE = pass, FALSE = fail.

          - Where stock certificates are unavailable, an Affidavit of Lost Stock Certificate is present:
          TRUE = pass, FALSE = fail.

          - Where both stock certificate and ledger are unavailable for an S-corp/Partnership, the K-1
          and CPA/Tax Preparer letter alternative is present in the file: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The ownership evidence document appropriate to the entity''s legal form is present and accounts
          for all ownership interests, using the lost-certificate affidavit or K-1/CPA-letter alternative
          where applicable.


          ### Conditional

          Assign **Conditional** when:

          - Ownership evidence is on file for all but one owner and a letter of explanation is pending
          to reconcile the discrepancy; the file may proceed with a condition to resolve it prior to closing.


          ### Fail

          Assign **Fail** when:

          - No ownership evidence document appropriate to the entity''s legal form is present, or the
          document on file does not account for all ownership interests.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is being made to an individual borrower rather than an entity borrower.'
        source_digest: 928a772ee5e4a9db5264b3f13d965e91c1827b075b2e6bc60ab8aeebe381f696
