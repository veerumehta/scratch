  - rule_id: LPE-SIZE-CLTV.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD verifies that a loan amount below $350,000 or above $1,500,000 is capped at the
        program's 75.00% maximum CLTV, regardless of the CLTV otherwise available at the borrower's FICO
        tier.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - LOS Loan Record base loan amount field is populated with a specific dollar figure.

        - LOS Loan Record CLTV field is populated with a calculated ratio.


        ### Step 2 - Eligibility Verification

        - LOS Loan Record base loan amount is evaluated against the $350,000 and $1,500,000 thresholds
        to determine whether the loan-size cap applies.

        - LOS Loan Record CLTV is compared against 75.00% when the loan amount falls below $350,000 or
        above $1,500,000.


        ### Step 3 - Validation and Verification

        - Where the loan-size cap applies, the CLTV used in the credit decision reflects the lower of
        the matrix-derived cap and 75.00%.

        - The CLTV calculation source (appraised value or purchase price, whichever is lower) matches
        the value used elsewhere in the file.


        ### Step 4 - Final Determination

        - Loan amount is below $350,000 or above $1,500,000 and the CLTV does not exceed 75.00%: gate
        to Pass.

        - Loan amount is below $350,000 or above $1,500,000 and the CLTV exceeds 75.00%: gate to Fail.


        ---'
      checks:
      - 'LOS Loan Record base_loan_amount_usd is less than $350,000 or greater than $1,500,000: TRUE =
        loan-size cap applies, FALSE = standard matrix CLTV applies.'
      - 'Where the loan-size cap applies, LOS Loan Record cltv_percent is less than or equal to 75.00%:
        TRUE = pass, FALSE = fail.'
      - --
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
