  - rule_id: LFC-CASHHAND.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD evaluates the cash-in-hand amount on a cash-out transaction against the maximum
        permitted under the matrix's cash-in-hand footnotes, which set a dollar cap when LTV exceeds 65%
        and allow unlimited cash-in-hand when LTV is 65% or below.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - LOS loan record identifies the transaction as a Cash-Out Refinance.

        - LOS loan record shows a proposed LTV percent and a base loan amount for the transaction.


        ### Step 2 - Eligibility Verification

        - LOS loan record shows a cash-in-hand (cash-out proceeds) dollar amount to be tested against
        the applicable cap.

        - LTV percent is classified into one of two bands: greater than 65%, or 65% and below.


        ### Step 3 - Validation and Verification

        - For LTV greater than 65% and base loan amount of $1,500,000 or more, cash-in-hand does not exceed
        $1,000,000.

        - For LTV greater than 65% and base loan amount under $1,500,000, cash-in-hand does not exceed
        $500,000.

        - For LTV of 65% or below, no dollar cap applies to cash-in-hand.


        ### Step 4 - Final Determination

        - Cash-in-hand amount is compared against the LTV-band-specific cap (or against no cap, at LTV
        65% or below) to reach a pass/fail determination.'
      checks:
      - 'LTV percent > 65% and base loan amount >= $1,500,000: cash-in-hand amount <= $1,000,000 is TRUE
        = pass, FALSE = fail.'
      - 'LTV percent > 65% and base loan amount < $1,500,000: cash-in-hand amount <= $500,000 is TRUE
        = pass, FALSE = fail.'
      - 'LTV percent <= 65%: cash-in-hand amount has no dollar cap; TRUE = pass in all cases.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
    action: require_evidence
    priority: 7
    description: Verifies that cash-in-hand proceeds on a Platinum Select DSCR cash-out refinance do not
      exceed Acra's matrix-footnote caps, which vary by the loan's LTV band and base loan amount.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 7
        section_type: Eligibility
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Cash-In-Hand vs. Footnote Cap
          metric_key: LoanCore.cash_out_amount_usd
          metric_mnemonic: LFC_CASHHAND_LM1
          indicator_context: Compare LoanCore.cash_out_amount_usd against the cap set by LoanCore.ltv_percent
            (cap applies only when ltv_percent > 65) and LoanCore.base_loan_amount_usd (cap is $1,000,000
            at or above $1,500,000 base loan amount, otherwise $500,000). Indicator is 'Pass' when cash_out_amount_usd
            is within the applicable cap or ltv_percent <= 65; 'Fail' otherwise. Do not populate borrower_ids
            for this unified metric under any circumstance.
          description_template: 'Cash-in-hand: {cash_out_amount_usd} (LTV: {ltv_percent}%, cap: {cash_in_hand_cap})'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        extraction_targets:
        - description: Cash-out amount and LTV
          entity_type: LoanCore
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Loan Origination System (LOS)

          - LOS loan record: provides loan purpose, LTV percent, base loan amount, and the cash-out proceeds
          (cash-in-hand) amount.'
        source_text: '# Loan Amount, FICO and CLTV Matrix - Base Version


          ## Purpose

          This JTBD evaluates the cash-in-hand amount on a cash-out transaction against the maximum permitted
          under the matrix''s cash-in-hand footnotes, which set a dollar cap when LTV exceeds 65% and
          allow unlimited cash-in-hand when LTV is 65% or below.


          ## Reference Documents

          ### Loan Origination System (LOS)

          - LOS loan record: provides loan purpose, LTV percent, base loan amount, and the cash-out proceeds
          (cash-in-hand) amount.


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS loan record identifies the transaction as a Cash-Out Refinance.

          - LOS loan record shows a proposed LTV percent and a base loan amount for the transaction.


          ### Step 2 - Eligibility Verification

          - LOS loan record shows a cash-in-hand (cash-out proceeds) dollar amount to be tested against
          the applicable cap.

          - LTV percent is classified into one of two bands: greater than 65%, or 65% and below.


          ### Step 3 - Validation and Verification

          - For LTV greater than 65% and base loan amount of $1,500,000 or more, cash-in-hand does not
          exceed $1,000,000.

          - For LTV greater than 65% and base loan amount under $1,500,000, cash-in-hand does not exceed
          $500,000.

          - For LTV of 65% or below, no dollar cap applies to cash-in-hand.


          ### Step 4 - Final Determination

          - Cash-in-hand amount is compared against the LTV-band-specific cap (or against no cap, at LTV
          65% or below) to reach a pass/fail determination.


          ## Deterministic Validation Rules

          - LTV percent > 65% and base loan amount >= $1,500,000: cash-in-hand amount <= $1,000,000 is
          TRUE = pass, FALSE = fail.

          - LTV percent > 65% and base loan amount < $1,500,000: cash-in-hand amount <= $500,000 is TRUE
          = pass, FALSE = fail.

          - LTV percent <= 65%: cash-in-hand amount has no dollar cap; TRUE = pass in all cases.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - LTV is 65% or below (no cap applies), or LTV is above 65% and cash-in-hand is at or below
          the $1,000,000 / $500,000 cap that corresponds to the base loan amount band.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - LTV is above 65% and cash-in-hand exceeds $1,000,000 (loans >= $1,500,000) or $500,000 (loans
          < $1,500,000).


          ### Not Applicable

          Assign **Not Applicable** when:

          - The transaction is not a Cash-Out Refinance, since the cash-in-hand footnotes apply only to
          cash-out proceeds.'
        source_digest: 2c9ee2a8b2cccea27e972715a57b52509fedb6e91785c2a755e2430fd4f26098
        section: Loan Program Eligibility
        mnemonic: LFC-CASHHAND
        also_as:
          standard: LFC-CASHHAND
