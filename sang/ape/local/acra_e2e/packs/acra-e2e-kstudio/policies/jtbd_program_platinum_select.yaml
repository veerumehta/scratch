        source_text: '# Rent Loss Insurance Coverage Purpose - Base Version


          ## Purpose

          Validate that the rent loss insurance policy on file provides coverage for rental income losses
          during casualty-related rehabilitation of the subject property, consistent with the program''s
          definition of the coverage.


          ## Reference Documents

          ### Insurance Documents

          - Hazard Insurance Policy / Rent Loss Insurance Endorsement: states the scope and coverage period
          of rent loss insurance

          - Insurance Declarations Page: identifies the named insured, coverage type, and policy period


          ## Steps


          ### Step 1 - Initial Document Review

          - Hazard Insurance Policy or Rent Loss Insurance Endorsement is present in the file when rent
          loss coverage is required.


          ### Step 2 - Eligibility Verification

          - Policy or endorsement language states that coverage applies to rental income losses incurred
          while the property is being rehabilitated following a casualty.


          ### Step 3 - Validation and Verification

          - Insurance Declarations Page identifies the subject property as the covered property and states
          the rent loss coverage period.


          ### Step 4 - Final Determination

          - Rent loss insurance is accepted only when its stated coverage matches casualty-related rehabilitation
          rental loss; a policy providing a different or narrower scope of coverage is not accepted as
          satisfying the requirement.


          ## Deterministic Validation Rules

          - Rent Loss Insurance Endorsement or Policy states coverage for rental income losses incurred
          during casualty-related rehabilitation: TRUE = coverage scope condition satisfied, FALSE = coverage
          scope condition not satisfied.

          - Insurance Declarations Page identifies the subject property as the covered property: TRUE
          = coverage applies to the correct property, FALSE = coverage does not apply to the subject property.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Rent Loss Insurance Endorsement or Policy on file states coverage for rental income losses
          during casualty-related rehabilitation of the subject property.


          ### Conditional

