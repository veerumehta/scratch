        source_text: '# Foreign National and ITIN Ineligibility Screening - Base Version


          ## Purpose

          Screen the loan file to ensure no borrower falls into a citizenship or tax-ID category excluded
          from this program.


          ## Reference Documents

          ### Identification Documents

          - Loan Application (1003): states each borrower''s citizenship status and tax ID type

          - Government-Issued Photo ID / Passport / Visa: evidences the borrower''s citizenship or immigration
          status


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application citizenship status field and tax ID type field are populated for each borrower
          on the transaction.


          ### Step 2 - Eligibility Verification

          - No borrower''s citizenship status field on the Loan Application is set to Non-Permanent Resident
          or Foreign National.

          - No borrower''s tax ID type field on the Loan Application is set to ITIN.


          ### Step 3 - Validation and Verification

          - Identification documents on file (passport, visa, government ID) are consistent with the declared
          citizenship status and do not indicate a status excluded from this program.


          ### Step 4 - Final Determination

          - Loan is ineligible under this rule if any borrower''s citizenship status is Non-Permanent
          Resident or Foreign National, or any borrower''s tax ID type is ITIN.


          ## Deterministic Validation Rules

          - Any borrower''s citizenship status field is set to Non-Permanent Resident or Foreign National:
          TRUE = fail, FALSE = pass.

          - Any borrower''s tax ID type field is set to ITIN: TRUE = fail, FALSE = pass.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - No borrower on the transaction is a Non-Permanent Resident, Foreign National, or ITIN tax-ID
          holder.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Any borrower''s citizenship status is Non-Permanent Resident or Foreign National, or any borrower''s
          tax ID type is ITIN.


          ### Not Applicable

          There is no case for this outcome.'
