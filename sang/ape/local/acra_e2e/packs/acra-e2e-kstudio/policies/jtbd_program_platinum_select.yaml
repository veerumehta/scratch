        source_text: '# First-Time Homebuyer Credit-History Cross-Reference - Base Version


          ## Purpose

          This JTBD cross-references, from the Borrower Credit History Requirements panel, Acra''s program-wide
          First-Time Homebuyer ineligibility rule and confirms that no applicant on the loan is designated
          a first-time homebuyer.


          ## Reference Documents

          ### Loan Origination System (LOS)

          - LOS application record: provides each borrower''s first-time-homebuyer indicator.

          ### Credit Documentation

          - Credit Report: provides borrower credit history used to corroborate prior housing history.


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS application record shows a first-time-homebuyer indicator for every borrower on the loan.


          ### Step 2 - Eligibility Verification

          - Program-level First-Time Homebuyer ineligibility, restated in the Borrower Credit History
          Requirements panel, is confirmed as applicable to every applicant on a Platinum Select DSCR
