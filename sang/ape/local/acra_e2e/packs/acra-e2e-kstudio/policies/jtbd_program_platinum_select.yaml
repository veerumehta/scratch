  - rule_id: DSCR-QUALRENT.platinum_select
    condition:
      kind: procedure
      purpose: Determine the qualifying gross rental income used in the DSCR numerator by selecting between
        market rent and documented actual rent for the subject property.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Form 1007 or Form 1025 is present in the file and states a market rent value for the subject
        property.

        - Lease Agreement, when actual rent is being used, states the monthly rent amount and lease start
        and expiration dates.

        - Evidence of rent receipt (bank statement or canceled checks) covering the months claimed as
        actual rent is present in the file.


        ### Step 2 - Eligibility Verification

        - Subject property rental use documented in the file is long-term rather than short-term or nightly
        rental.

        - Lease Agreement expiration date extends at least 3 months beyond the scheduled loan closing
        date.

        - Rent receipt evidence documents at least 2 months of actual rent payments.


        ### Step 3 - Validation and Verification

        - Market rent value from Form 1007/1025 is compared against the documented actual rent amount
        from the Lease Agreement.

        - The higher of the two values is identified as the candidate qualifying rent figure.

        - Actual rent is used only when the 2-month receipt evidence and the 3-month post-closing lease
        continuance conditions are both independently satisfied.


        ### Step 4 - Final Determination

        - Qualifying gross rental income is set to the greater of market rent (Form 1007/1025) or documented
        actual rent, subject to the actual-rent documentation conditions being fully met.'
      checks:
      - 'Form 1007 or Form 1025 is present with a stated market rent value: TRUE = market rent figure
        available for the greater-of comparison, FALSE = only actual rent may be considered if fully documented.'
      - 'Lease Agreement expiration date is at least 3 months after the scheduled closing date: TRUE =
        actual rent may be considered, FALSE = actual rent is not eligible for use.'
      - 'Rent receipt evidence documents at least 2 months of actual payments: TRUE = actual rent may
        be considered, FALSE = actual rent is not eligible for use.'
      - 'Subject property rental use documented in the file is long-term: TRUE = rent income qualifies
        under this rule, FALSE = income is not eligible for DSCR qualification under this rule.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
