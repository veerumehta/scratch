      at least three years unless located in a state that does not allow prepayment penalties.
    citations: []
    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 33
        section_type: Eligibility
        source: NEW
        assistant:
        - Officer
        loan_metrics:
        - label: Prepayment Penalty Term (Listed-for-Sale Minimum)
          metric_key: LoanCore.prepayment_penalty_term_months
          metric_mnemonic: PPT_PPPLISTED_LM1
          indicator_context: Compare LoanCore.prepayment_penalty_term_months against the three-year minimum
            required when the subject property has been listed for sale within six months of the Application
            Date and is located in a state that permits prepayment penalties. Indicator is 'Pass' when
            prepayment_penalty_term_months >= 36 or the state prohibits prepayment penalties; 'Fail' otherwise.
            Do not populate borrower_ids for this unified metric under any circumstance.
          description_template: 'Prepayment Term: {prepayment_penalty_term_months} months (listed-for-sale
            minimum: 36 months)'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        reference_documents: '### Prepayment and Listing Documents

          - Note / Prepayment Rider: states the prepayment penalty term

          - Listing Agreement / MLS Listing History: documents whether the subject property has been listed
          for sale in the last six months

          - State Prepayment Restriction Table: identifies states where prepayment penalties are not permitted'
        source_text: '# Listed-for-Sale Minimum Prepayment Term Verification - Base Version


          ## Purpose

          Validate that the minimum three-year prepayment penalty term is applied to loans on properties
          listed for sale within the last six months, except where state law prohibits prepayment penalties.


          ## Reference Documents

          ### Prepayment and Listing Documents

          - Note / Prepayment Rider: states the prepayment penalty term

          - Listing Agreement / MLS Listing History: documents whether the subject property has been listed
          for sale in the last six months

          - State Prepayment Restriction Table: identifies states where prepayment penalties are not permitted


          ## Steps


          ### Step 1 - Initial Document Review

          - Listing Agreement or MLS Listing History is reviewed to determine whether the subject property
          has been listed for sale within the last six months, measured to the Application Date.


          ### Step 2 - Eligibility Verification

          - Subject property''s state is checked against the State Prepayment Restriction Table to determine
          whether prepayment penalties are permitted there.


          ### Step 3 - Validation and Verification

          - Note/Prepayment Rider prepayment penalty term is compared against the three-year minimum required
          for listed-for-sale properties in states that permit prepayment penalties.


          ### Step 4 - Final Determination

          - Loan on a property listed for sale within six months is approved on this point only when its
          prepayment penalty term is at least three years, or the subject property is located in a state
          that does not permit prepayment penalties.


          ## Deterministic Validation Rules

          - Subject property has been listed for sale within six months of the Application Date: TRUE
          = the three-year minimum prepayment term requirement applies, FALSE = this requirement does
          not apply.

          - Note/Prepayment Rider prepayment penalty term is at least three years, when the property is
          listed for sale and located in a state that permits prepayment penalties: TRUE = requirement
          satisfied, FALSE = requirement not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Subject property has not been listed for sale within six months, or the listed-for-sale property
          carries a prepayment penalty term of at least three years, or the property is in a state that
          does not permit prepayment penalties.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Subject property has been listed for sale within six months, is located in a state that permits
          prepayment penalties, and carries a prepayment penalty term of less than three years.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: e84b522b3f36fec9ab42147a099eba6cb003674b21828d5f243c44fb69d49a38
        section: Loan Program Eligibility
        mnemonic: PPT-PPP-LISTEDSALE
    approval_refs: []
  - rule_id: PPT-PPP-STATE.platinum_select
    condition:
      kind: procedure
      purpose: Validate that the loan's prepayment penalty treatment complies with the state-specific
        restriction table for the state in which the subject property is located.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Subject Property Address identifies the state in which the property is located.


        ### Step 2 - Eligibility Verification

        - Subject property''s state is checked against the State Prepayment Restriction Table to determine
        whether a restriction applies.


        ### Step 3 - Validation and Verification

        - Where a restriction applies, the Note/Prepayment Rider''s borrower type, loan amount, interest
        rate, and transaction type are compared against the state-specific conditions that trigger the
        restriction.


        ### Step 4 - Final Determination

        - Loan is approved on this point only when its prepayment penalty structure complies with the
        published restriction for the subject property''s state, applying the buy-out or term restriction
        where the state-specific trigger conditions are met.'
      checks:
      - 'Subject property state matches a state listed on the State Prepayment Restriction Table: TRUE
        = the state-specific restriction applies, FALSE = no state-specific restriction applies beyond
        the standard structures.'
      - 'Note/Prepayment Rider prepayment penalty treatment (buy-out or standard structure) matches the
        restriction published for the subject property''s state and the loan''s specific borrower type,
        amount, rate, or transaction type where the state''s restriction is conditional: TRUE = requirement
        satisfied, FALSE = requirement not satisfied.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
