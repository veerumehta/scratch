  - rule_id: CRD-MTG-RATING.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD determines the mortgage / rental payment rating used for pricing by evaluating
        the trailing 12-month payment history for properties the borrower owns or rents, and confirms
        that unreported mortgages are separately documented.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Credit Report shows payment history for reported mortgage tradelines tied to properties the
        borrower owns or rents.


        ### Step 2 - Eligibility Verification

        - Properties evaluated for the rating are limited to those the borrower owned or rented within
        the 12 months preceding the Credit Report date, establishing the rating window.


        ### Step 3 - Validation and Verification

        - Where a mortgage on an evaluated property is not reported on the Credit Report, the file contains
        an independent mortgage statement or VOM evidencing that property''s trailing 12-month payment
        history.


        ### Step 4 - Final Determination

        - Trailing 12-month payment history, from the Credit Report or from independent documentation,
        is compiled across all evaluated properties to reach the rating pass/fail determination.'
      checks:
      - 'A property was owned or rented by the borrower within the 12 months preceding the Credit Report
        date: TRUE = its payment history is within the rating window and must be evaluated, FALSE = it
        is outside the window.'
      - 'A reported mortgage tradeline exists on the Credit Report for the property: TRUE = Credit Report
        payment history is used for the rating, FALSE = an independent mortgage statement or VOM is required
        to evaluate the rating.'
      - 'Where a mortgage is unreported: independent mortgage statement or VOM documentation is on file:
        TRUE = pass, FALSE = fail.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
