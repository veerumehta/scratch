            {required_treatment}'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: SubjectProperty
          entity_description: Subject property type, units, occupancy, address, condo classification,
            taxes/HOA
        - name: Borrower
          entity_description: Borrower / guarantor identity, citizenship, declarations and credit-event
            dates
        extraction_targets:
        - description: Prepayment penalty flag and term
          entity_type: LoanCore
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: "### Prepayment and Property Documents\n- Note / Prepayment Rider: states\
          \ the prepayment penalty term, structure, and any buy-out provision\n- State Prepayment Restriction\
          \ Table (Platinum Summary, as printed):\n  - AK: BUY-OUT all Residential 1-4\n  - IL: (1) BUY-OUT\
          \ all Residential 1-4 if to an ENTITY OR INDIVIDUAL and loan amount is ≤ $250,000; (2) BUY-OUT\
          \ all Residential 1-4 if to an INDIVIDUAL and loan amount is > $250,000 and interest rate is\
          \ > 8%\n  - KS: BUY-OUT all Residential 1-4\n  - MD: BUY-OUT all loans\n  - MI: BUY-OUT all\
          \ Residential 1-4\n  - MN: BUY-OUT all Residential 1-4\n  - MS: BUY-OUT or 5 year (STEP) for\
          \ all Residential 1 unit; no restrictions on 2+ units\n  - NJ: BUY-OUT all loans closing in\
          \ name of an INDIVIDUAL\n  - NM: BUY-OUT all Residential 1-4\n  - OH: BUY-OUT all Residential\
          \ 1-2\n  - PA: BUY-OUT if to an INDIVIDUAL AND on Residential 1-2 AND loan amount < $319,777\n\
          \  - RI: BUY-OUT if a PURCHASE transaction\n  - VA: BUY-OUT all Residential 1-4 closed in the\
          \ name of an individual\n  - VT: BUY-OUT for loans < $1 Million\n  - What \"BUY-OUT\" requires\
          \ (no penalty on the loan, or a priced alternative), and whether a state restriction waives\
          \ the listed-for-sale 3-year minimum, is open: Acra confirmation requested → Q-19\n- Subject\
          \ Property Address: identifies the state in which the subject property is located"
        source_text: "# State-Specific Prepayment Restriction Verification - Base Version\n\n## Purpose\n\
          Validate that the loan's prepayment penalty treatment complies with the state-specific restriction\
          \ table for the state in which the subject property is located.\n\n## Reference Documents\n\
          ### Prepayment and Property Documents\n- Note / Prepayment Rider: states the prepayment penalty\
          \ term, structure, and any buy-out provision\n- State Prepayment Restriction Table (Platinum\
          \ Summary, as printed):\n  - AK: BUY-OUT all Residential 1-4\n  - IL: (1) BUY-OUT all Residential\
          \ 1-4 if to an ENTITY OR INDIVIDUAL and loan amount is ≤ $250,000; (2) BUY-OUT all Residential\
          \ 1-4 if to an INDIVIDUAL and loan amount is > $250,000 and interest rate is > 8%\n  - KS: BUY-OUT\
          \ all Residential 1-4\n  - MD: BUY-OUT all loans\n  - MI: BUY-OUT all Residential 1-4\n  - MN:\
          \ BUY-OUT all Residential 1-4\n  - MS: BUY-OUT or 5 year (STEP) for all Residential 1 unit;\
          \ no restrictions on 2+ units\n  - NJ: BUY-OUT all loans closing in name of an INDIVIDUAL\n\
          \  - NM: BUY-OUT all Residential 1-4\n  - OH: BUY-OUT all Residential 1-2\n  - PA: BUY-OUT if\
          \ to an INDIVIDUAL AND on Residential 1-2 AND loan amount < $319,777\n  - RI: BUY-OUT if a PURCHASE\
          \ transaction\n  - VA: BUY-OUT all Residential 1-4 closed in the name of an individual\n  -\
          \ VT: BUY-OUT for loans < $1 Million\n  - What \"BUY-OUT\" requires (no penalty on the loan,\
          \ or a priced alternative), and whether a state restriction waives the listed-for-sale 3-year\
          \ minimum, is open: Acra confirmation requested → Q-19\n- Subject Property Address: identifies\
          \ the state in which the subject property is located\n\n## Steps\n\n### Step 1 - Initial Document\
          \ Review\n- Subject Property Address identifies the state in which the property is located.\n\
          \n### Step 2 - Eligibility Verification\n- Subject property's state is checked against the State\
          \ Prepayment Restriction Table to determine whether a restriction applies.\n\n### Step 3 - Validation\
          \ and Verification\n- Where a restriction applies, the Note/Prepayment Rider's borrower type,\
          \ loan amount, interest rate, and transaction type are compared against the state-specific conditions\
          \ that trigger the restriction.\n\n### Step 4 - Final Determination\n- Loan is approved on this\
          \ point only when its prepayment penalty structure complies with the published restriction for\
          \ the subject property's state, applying the buy-out or term restriction where the state-specific\
          \ trigger conditions are met.\n\n## Deterministic Validation Rules\n- Subject property state\
          \ matches a state listed on the State Prepayment Restriction Table: TRUE = the state-specific\
          \ restriction applies, FALSE = no state-specific restriction applies beyond the standard structures.\n\
          - Note/Prepayment Rider prepayment penalty treatment (buy-out or standard structure) matches\
          \ the restriction published for the subject property's state and the loan's specific borrower\
          \ type, amount, rate, or transaction type where the state's restriction is conditional: TRUE\
          \ = requirement satisfied, FALSE = requirement not satisfied.\n\n## Outcomes\n\n### Pass\nAssign\
          \ **Pass** when:\n- Subject property's state carries no restriction, or the loan's prepayment\
          \ penalty treatment complies with the published state-specific restriction and its trigger conditions.\n\
          \n### Conditional\nAssign **Conditional** when:\n- A state restriction is triggered and the\
          \ Note reflects a buy-out treatment whose sufficiency depends on Acra's definition of BUY-OUT\
          \ (Q-19), or the subject is listed for sale and the state restriction removes the 3-year minimum\
          \ prepayment term required under §11.5.\n\n### Fail\nAssign **Fail** when:\n- Subject property's\
          \ state carries a restriction and the loan's prepayment penalty treatment does not comply with\
          \ the published restriction or its trigger conditions.\n\n### Not Applicable\nAssign **Not Applicable**\
          \ when:\n- The subject property's state does not appear on the State Prepayment Restriction\
          \ Table."
        source_digest: 53efcad30123bdb86e8573ff7dbff53d0464a3c226c6fa2afb3c2d702d7a4c58
