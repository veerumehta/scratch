        source_text: '# Gift Fund Minimum Borrower Contribution - Base Version


          ## Purpose

          Verify that the borrower''s own sourced and seasoned funds meet the minimum 10% of purchase
          price contribution requirement on investment property transactions using gift funds.


          ## Reference Documents

          ### Asset Documents

          - Bank Statements: evidence of the borrower''s own sourced and seasoned funds

          - Gift Letter: states the gift amount, donor, and relationship

          - Purchase Contract: states the purchase price used to calculate the minimum contribution


          ## Steps


          ### Step 1 - Initial Document Review

          - Purchase Contract states the purchase price for the transaction.

          - Bank Statements are present showing the borrower''s own funds, and a Gift Letter is present
          if gift funds are being used.


          ### Step 2 - Eligibility Verification

          - Dollar amount of the borrower''s own sourced and seasoned funds, excluding gift funds, is
          calculated from Bank Statements.


          ### Step 3 - Validation and Verification

          - Borrower''s own sourced and seasoned funds are compared to 10% of the purchase price stated
          on the Purchase Contract.


          ### Step 4 - Final Determination

          - Requirement is satisfied only when the borrower''s own sourced and seasoned funds equal or
          exceed 10% of the purchase price, independent of any gift funds contributed to the transaction.


          ## Deterministic Validation Rules

          - Borrower''s own sourced and seasoned funds, excluding gift funds, are greater than or equal
          to 10% of the purchase price stated on the Purchase Contract: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Borrower''s own sourced and seasoned funds equal or exceed 10% of the purchase price.


          ### Conditional

          Assign **Conditional** when:

          - Bank Statements are on file but the seasoning period for the borrower''s own funds has not
          yet been fully documented.


          ### Fail

          Assign **Fail** when:

          - Borrower''s own sourced and seasoned funds are less than 10% of the purchase price.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The transaction is a refinance rather than a purchase, since the minimum contribution is stated
          relative to purchase price.'
        source_digest: a51f6747fa077da15c40a13f2bcd56bdd0e1b706fc0b98d2cd57dddeddff6784
