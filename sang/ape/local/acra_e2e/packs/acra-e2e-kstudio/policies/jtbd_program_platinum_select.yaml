        assistant:
        - Underwriter
        notes: Duplicate of LFC-AMT-STEPDN; retained per instruction.
        loan_metrics:
        - label: CLTV Ratio (Loan-Size Cap)
          metric_key: LoanCore.cltv_percent
          metric_mnemonic: LPE_SIZECLTV_LM1
          indicator_context: When LoanCore.total_loan_amount_usd is below $350,000 or above $1,500,000,
            compare LoanCore.cltv_percent against the 75.00% loan-size cap. Indicator is 'Pass' when cltv_percent
            <= 75.00; 'Fail' otherwise; 'Not Applicable' when the loan amount is between $350,000 and
            $1,500,000. Cross-verify with the Appraisal Report; on mismatch use document-extracted value.
            Do not populate borrower_ids for this unified metric under any circumstance.
          description_template: 'CLTV: {cltv_percent}% (loan-size cap: 75.00%)'
        entity_types:
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        reference_documents: '### Loan Origination Documents

          - LOS Loan Record: Provides the final loan amount and calculated CLTV for comparison against
          the loan-size cap.

          - Appraisal Report: Supplies the value used to calculate the CLTV ratio.


          ---'
        source_text: '# Loan-Size CLTV Step-Down - Base Version


          ## Purpose

          This JTBD verifies that a loan amount below $350,000 or above $1,500,000 is capped at the program''s
          75.00% maximum CLTV, regardless of the CLTV otherwise available at the borrower''s FICO tier.


          ## Reference Documents

          ### Loan Origination Documents

          - LOS Loan Record: Provides the final loan amount and calculated CLTV for comparison against
          the loan-size cap.

          - Appraisal Report: Supplies the value used to calculate the CLTV ratio.


          ---


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS Loan Record base loan amount field is populated with a specific dollar figure.

          - LOS Loan Record CLTV field is populated with a calculated ratio.


          ### Step 2 - Eligibility Verification

          - LOS Loan Record base loan amount is evaluated against the $350,000 and $1,500,000 thresholds
          to determine whether the loan-size cap applies.

          - LOS Loan Record CLTV is compared against 75.00% when the loan amount falls below $350,000
          or above $1,500,000.


          ### Step 3 - Validation and Verification

          - Where the loan-size cap applies, the CLTV used in the credit decision reflects the lower of
          the matrix-derived cap and 75.00%.

          - The CLTV calculation source (appraised value or purchase price, whichever is lower) matches
          the value used elsewhere in the file.


          ### Step 4 - Final Determination

          - Loan amount is below $350,000 or above $1,500,000 and the CLTV does not exceed 75.00%: gate
          to Pass.

          - Loan amount is below $350,000 or above $1,500,000 and the CLTV exceeds 75.00%: gate to Fail.


          ---


          ## Deterministic Validation Rules

          - LOS Loan Record base_loan_amount_usd is less than $350,000 or greater than $1,500,000: TRUE
          = loan-size cap applies, FALSE = standard matrix CLTV applies.

          - Where the loan-size cap applies, LOS Loan Record cltv_percent is less than or equal to 75.00%:
          TRUE = pass, FALSE = fail.


          ---


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The loan amount is below $350,000 or above $1,500,000 and the resulting CLTV is at or below
          75.00%.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - The loan amount is below $350,000 or above $1,500,000 and the resulting CLTV exceeds 75.00%.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan amount is at or above $350,000 and at or below $1,500,000, so the loan-size CLTV
          step-down does not apply.'
        source_digest: 8b97552fdd221894a59cd17155f457182401292f7bdf2716bb1169056f2c627f
        section: Loan Program Eligibility
        mnemonic: LPE-SIZE-CLTV
