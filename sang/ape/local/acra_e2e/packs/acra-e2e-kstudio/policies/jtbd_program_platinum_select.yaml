        source_text: '# Minimum Borrower-Sourced Funds with Gift Contribution - Base Version


          ## Purpose

          This JTBD verifies that, on an investment property transaction where gift funds are used, the
          borrower has contributed at least 10% of the purchase price from their own sourced and seasoned
          funds.


          ## Reference Documents

          ### Asset Documents

          - Asset Statements: Identify each fund source, including gift funds, and the borrower''s own
          seasoned account balances.

          - Purchase Contract: Provides the purchase price used to calculate the minimum required borrower
          contribution.


          ---


          ## Steps


          ### Step 1 - Initial Document Review

          - Asset Statements identify each asset entry''s source and whether it is flagged as a gift.

          - Purchase Contract purchase price field is present for calculating the required minimum contribution.


          ### Step 2 - Eligibility Verification

          - Total gift fund amount is identified separately from the borrower''s own sourced and seasoned
          asset balances.

          - Borrower''s own sourced and seasoned funds are calculated as a percentage of the purchase
          price.


          ### Step 3 - Validation and Verification

          - Borrower''s own sourced and seasoned funds percentage of purchase price is compared against
          the 10% minimum contribution requirement.

          - Gift funds are confirmed not to be counted toward the borrower''s own minimum 10% contribution.


          ### Step 4 - Final Determination

          - Borrower''s own sourced and seasoned funds equal or exceed 10% of the purchase price, exclusive
          of gift funds: gate to Pass.

          - Borrower''s own sourced and seasoned funds are less than 10% of the purchase price: gate to
          Fail.


          ---


          ## Deterministic Validation Rules

          - Borrower''s own sourced and seasoned asset funds, excluding any gift funds, divided by the
          Purchase Contract purchase price, is greater than or equal to 10%: TRUE = pass, FALSE = fail.

          - Gift funds are documented separately from the borrower''s own contribution on the Asset Statements:
          TRUE = pass, FALSE = fail.


          ---


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The borrower''s own sourced and seasoned funds, excluding gift funds, are at least 10% of
          the purchase price.


          ### Conditional

          Assign **Conditional** when:

          - Asset Statements show a borrower contribution close to but not yet documented at 10% of the
          purchase price, pending an updated statement or additional seasoned funds documentation.


          ### Fail

          Assign **Fail** when:

          - The borrower''s own sourced and seasoned funds, excluding gift funds, are less than 10% of
          the purchase price.


          ### Not Applicable

          Assign **Not Applicable** when:

          - No gift funds are used in the transaction, so the minimum borrower-sourced contribution rule
          for gift-fund transactions does not apply.'
