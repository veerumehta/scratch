  - rule_id: PPT-IO-PMTCALC.platinum_select
    condition:
      kind: procedure
      purpose: Validate that the interest-only payment amount and post-term recast are calculated per
        Acra's stated interest-only payment methodology.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Note states the interest-only payment amount applicable during the interest-only term.


        ### Step 2 - Eligibility Verification

        - Interest-only payment amount stated on the Note is calculated as the amount sufficient to pay
        accrued interest on the loan balance monthly at the time of origination.


        ### Step 3 - Validation and Verification

        - Note''s amortization schedule shows the payment recasting to a fully amortized principal-and-interest
        payment for the remaining term after the interest-only period ends.


        ### Step 4 - Final Determination

        - Interest-only payment structure is approved only when the initial payment matches the accrued-interest-only
        calculation and the schedule correctly recasts to a fully amortized payment after the interest-only
        term.'
