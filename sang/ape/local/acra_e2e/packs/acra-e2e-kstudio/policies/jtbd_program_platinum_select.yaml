        source_text: '# Prohibited Entity Type and Nesting Limit - Base Version


          ## Purpose

          Screen out entity borrowers organized under a prohibited structure and enforce the single wholly-owned-subsidiary
          nesting limit.


          ## Reference Documents

          ### Entity Formation Documents

          - Certificate of Formation / Articles of Organization: states the entity''s legal structure
          and organizational type

          - Ownership Chart / Operating Agreement: shows the entity''s ownership structure, including
          any parent or subsidiary entities


          ## Steps


          ### Step 1 - Initial Document Review

          - Certificate of Formation / Articles of Organization states the entity''s organizational type.


          ### Step 2 - Eligibility Verification

          - Entity type is compared against the prohibited list: Cooperative, Irrevocable Trust, Land
          Trust, IRA, Non-Profit, or Joint Venture.

          - Ownership Chart is reviewed to count the number of entity layers between the borrowing entity
          and its ultimate individual owners.


          ### Step 3 - Validation and Verification

          - Where an intermediate holding entity exists, the Ownership Chart confirms it is a single wholly-owned
          subsidiary that is itself owned directly by individuals.


          ### Step 4 - Final Determination

          - Entity borrower is approved on this point only when it is not a prohibited type and its ownership
          nesting does not exceed one wholly-owned subsidiary layer owned by individuals.


          ## Deterministic Validation Rules

          - Certificate of Formation shows the entity is organized as a Cooperative, Irrevocable Trust,
          Land Trust, IRA, Non-Profit, or Joint Venture: TRUE = entity is not eligible, FALSE = prohibited-type
          exclusion does not apply.

          - Ownership Chart shows more than one intermediate holding entity, or an intermediate holding
          entity not wholly owned by individuals, between the borrowing entity and its ultimate individual
          owners: TRUE = nesting limit exceeded and entity is not eligible, FALSE = nesting limit satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Entity is not a prohibited type and ownership nesting does not exceed one wholly-owned subsidiary
          layer owned directly by individuals.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Entity is organized as a prohibited type, or ownership nesting exceeds the single wholly-owned
          subsidiary limit or involves multiple entities or trusts.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual rather than an entity.'
