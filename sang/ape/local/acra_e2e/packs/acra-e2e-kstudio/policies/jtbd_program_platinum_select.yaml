        source_text: '# Allowed Entity Type Verification - Base Version


          ## Purpose

          Validate that the borrowing entity or guarantor type falls within Acra''s permitted list of
          domestic business entity types and that the entity is US-formed, US-based, and not foreign-owned.


          ## Reference Documents

          ### Entity Formation Documents

          - Certificate of Formation / Articles of Organization: states the entity''s legal type and state
          and country of formation

          - Operating Agreement / Bylaws: confirms entity type and ownership structure


          ## Steps


          ### Step 1 - Initial Document Review

          - Certificate of Formation / Articles of Organization states the entity''s legal type and the
          state and country of formation.


          ### Step 2 - Eligibility Verification

          - Entity type is compared against the list of allowed types: domestic C or S Corporation, single-purpose
          non-series LLC, LLP, LLLP, General Partnership, Limited Partnership, or Sole Proprietorship.

          - Certificate of Formation confirms the entity is formed and based in the United States.


          ### Step 3 - Validation and Verification

          - Ownership records are reviewed to confirm the entity is not foreign-owned.


          ### Step 4 - Final Determination

          - Entity is approved as a borrower or guarantor only when its type is on the allowed list and
          it is US-formed, US-based, and not foreign-owned.


          ## Deterministic Validation Rules

          - Entity type stated on the Certificate of Formation matches one of the allowed types (C Corp,
          S Corp, single-purpose LLC, LLP, LLLP, GP, LP, Sole Proprietorship): TRUE = type condition satisfied,
          FALSE = type condition not satisfied.

          - Certificate of Formation shows the entity is formed or based outside the United States, or
          ownership records show the entity is foreign-owned: TRUE = entity is not eligible, FALSE = US
          formation and ownership condition satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Entity type matches an allowed type and the entity is US-formed, US-based, and not foreign-owned.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Entity type is not on the allowed list, or the entity is formed or based outside the United
          States, or is foreign-owned.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual rather than an entity.'
