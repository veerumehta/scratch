        reference_documents: '### Loan Origination Records

          - LOS: system of record for the qualification method (DSCR) and the underwriting decision basis

          - Loan Application (1003): any income/employment fields represented for the borrower(s)

          - Underwriting Summary: recorded decision and the ratios cited in support of it'
        source_text: '# DTI Exemption for DSCR-Qualified Borrowers - Base Version


          ## Purpose

          This JTBD confirms that the underwriting decision on a DSCR-qualified Platinum Select loan does
          not rely on a calculated debt-to-income ratio, consistent with Acra''s policy that income and
          employment are not used to decision these loans.


          ## Reference Documents

          ### Loan Origination Records

          - LOS: system of record for the qualification method (DSCR) and the underwriting decision basis

          - Loan Application (1003): any income/employment fields represented for the borrower(s)

          - Underwriting Summary: recorded decision and the ratios cited in support of it


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan application income and employment fields for the qualifying borrower(s) are reviewed;
          these fields may be blank since qualification is DSCR-based.


          ### Step 2 - Eligibility Verification

          - Underwriting Summary decision record is reviewed for whether a debt-to-income ratio was cited
          as a basis for the loan decision.


          ### Step 3 - Validation and Verification

          - Where income or employment is represented on the application, the file is checked to confirm
          no DTI ratio was calculated and applied as part of the decision.


          ### Step 4 - Final Determination

          - File is confirmed DTI-exempt and the DSCR-based decision stands, or a DTI-based decisioning
          factor is identified and the file is routed for correction.


          ## Deterministic Validation Rules

          - UnderwritingSummary.underwriter_decision does not cite a debt-to-income ratio as a decisioning
          basis: TRUE = pass, FALSE = fail.

          - Where income or employment is represented on the loan application, no RatioSet.dti_percent
          value was used to approve or decline the loan: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - No debt-to-income ratio is calculated or cited in the underwriting decision for the DSCR-qualified
          borrower(s).


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - A debt-to-income ratio is calculated and used as a basis for approval or denial on a DSCR-qualified
          loan.


          ### Not Applicable

          There is no case for this outcome — this exemption applies to every borrower qualifying under
          the DSCR method on this program.'
        source_digest: 9edf3ccc356896fd0197be96d2abd805d4daddbc577ed7bac63a68c60952142f
        section: Loan Program Eligibility
        mnemonic: LPE-NO-DTI
        also_as:
          standard: LPE-NO-DTI
    approval_refs: []
