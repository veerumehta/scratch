  - rule_id: AFC-RESERVE-TOTAL.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD consolidates the reserve triggers Acra states for Platinum Select into one governing
        requirement. The sources state reserves only for four situations and state the payment basis in
        none of them; they do not say whether overlapping triggers are cumulative or whether reserves
        substituted for rent loss insurance are additional (Acra confirmation requested → Q-08). This
        JTBD applies the highest applicable trigger, adds the rent-loss substitution because it replaces
        a distinct coverage rather than duplicating a reserve trigger, and conditions any file whose outcome
        would change under a cumulative reading. The individual triggers are tested in AFC-RESERVE-CLTV,
        AFC-RESERVE-OTHER and RLI-RESERVE-SUB.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - LOS record and property documents establish which reserve triggers apply: CLTV > 75.00%; listed
        for sale within six months; forbearance or mortgage late within 12 months on a tenant-occupied
        subject without two months of timely rent receipts; rent loss insurance required but not obtained.


        ### Step 2 - Eligibility Verification

        - Months required under each applicable trigger are recorded: 6, 24, 12, and 2 for every month
        of rent loss coverage not provided.


        ### Step 3 - Validation and Verification

        - Governing requirement is the highest of the applicable reserve triggers plus the rent-loss substitution;
        verified reserves (in months of subject PITIA) are compared against it, counting cash-in-hand
        only where the trigger permits it (listed for sale; forbearance / late).


        ### Step 4 - Final Determination

        - Verified reserves at or above the governing requirement satisfy the reserve condition; a shortfall
        conditions or fails the file; a file that passes only under the highest-applies reading is conditioned
        on Acra''s Q-08 response.'
      checks:
      - 'At least one reserve trigger applies: TRUE = continue, FALSE = not applicable.'
      - 'governing_months = MAX(applicable trigger months) + 2 × (rent loss months required but not obtained):
        computed and recorded.'
      - 'RatioSet.reserves_months >= governing_months: TRUE = pass, FALSE = fail.'
      - 'RatioSet.reserves_months >= SUM(applicable trigger months) + rent-loss substitution: TRUE = pass
