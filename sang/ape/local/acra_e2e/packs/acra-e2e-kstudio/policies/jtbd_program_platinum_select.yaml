        source_text: '# Seasoning of Funds Verification Threshold - Base Version


          ## Purpose

          Determine whether the seasoning of funds to close must be verified, based on the transaction
          type, CLTV, and the dollar amount of funds to close.


          ## Reference Documents

          ### Loan and Asset Documents

          - Loan Application (1003): identifies whether the transaction is consumer or business purpose

          - Closing Disclosure: states funds to close and the transaction''s CLTV

          - Bank Statements / VOD: source for seasoning verification when required


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan Application identifies the transaction as consumer or business purpose.

          - Closing Disclosure states the funds to close amount and the transaction''s CLTV.


          ### Step 2 - Eligibility Verification

          - CLTV is compared to the 70% threshold to determine whether seasoning verification is triggered.

          - For business purpose loans, funds to close amount is compared to the $50,000 threshold in
          combination with the CLTV threshold.


          ### Step 3 - Validation and Verification

          - Where verification is triggered, Bank Statements or VOD documenting the seasoning of the source
          account(s) are obtained.


          ### Step 4 - Final Determination

          - Seasoning verification is required when the loan is a consumer transaction with CLTV over
          70%, or a business purpose loan with funds to close over $50,000 and CLTV over 70%; verification
          is not required outside those conditions.


          ## Deterministic Validation Rules

          - Transaction is a consumer transaction and CLTV exceeds 70%: TRUE = seasoning verification
          required, FALSE = evaluate the business-purpose condition.

          - Transaction is a business purpose loan with funds to close exceeding $50,000 and CLTV exceeding
          70%: TRUE = seasoning verification required, FALSE = seasoning verification not required under
          this rule.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Seasoning verification is not triggered under either condition, or is triggered and fully
          documented with Bank Statements/VOD.


          ### Conditional

          Assign **Conditional** when:

          - Seasoning verification is triggered but Bank Statements/VOD documenting the source account
          seasoning have not yet been provided.


          ### Fail

          Assign **Fail** when:

          - Seasoning verification is triggered and no Bank Statements or VOD documenting the source account
          seasoning are present in the file.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: fef46703eae0911cdf53c72ef4ef5f780fc20f41bce27e4ff4f8e9764e7f193b
        section: Asset Assessment
        mnemonic: AFC-SEASON-THRESH
        also_as:
          standard: AFC-SEASON-THRESH
