        reference_documents: '### Credit and Loan Records

          - Credit Report: decisioning FICO score used to select the matrix tier and the Correspondent
          700-719 footnote

          - LOS loan record: loan purpose, base loan amount, channel, amortization type / interest-only
          term, proposed CLTV

          ### Property Documents

          - Appraisal Report: property type, unit count, declining-market indicator

          - MLS Listing History: whether the subject was listed for sale within six months of the Application
          Date'
        source_text: "# Consolidated Maximum CLTV Determination - Base Version\n\n## Purpose\nThis JTBD\
          \ produces one governing maximum CLTV for the loan by combining every CLTV cap and adjustment\
          \ Acra publishes for the Platinum Select DSCR program. The individual caps are each tested by\
          \ their own JTBD; this JTBD confirms that, when more than one applies, the lowest cap governs,\
          \ that the declining-market reduction is taken from that lowest cap, and that the loan's CLTV\
          \ does not exceed the final result. The consolidation assumes the matrix sets the starting limit\
          \ and each applicable condition can only lower it (Acra confirmation requested → Q-08).\n\n\
          ## Reference Documents\n### Credit and Loan Records\n- Credit Report: decisioning FICO score\
          \ used to select the matrix tier and the Correspondent 700-719 footnote\n- LOS loan record:\
          \ loan purpose, base loan amount, channel, amortization type / interest-only term, proposed\
          \ CLTV\n### Property Documents\n- Appraisal Report: property type, unit count, declining-market\
          \ indicator\n- MLS Listing History: whether the subject was listed for sale within six months\
          \ of the Application Date\n\n## Steps\n\n### Step 1 - Initial Document Review\n- LOS record,\
          \ Credit Report and Appraisal Report supply every input needed to evaluate each published cap:\
          \ FICO score, purpose, loan amount, channel, interest-only term, property type, unit count,\
          \ declining-market flag and listing status.\n\n### Step 2 - Eligibility Verification\n- Each\
          \ published cap is evaluated for applicability and, where applicable, its value is recorded:\n\
          \  - Matrix cap by FICO tier and purpose (730+: 80/80/75; 721-729: 80/80/65; 700-720: 80/80/55\
          \ for Purchase / Rate & Term / Cash-Out).\n  - Loan amount below $350,000 or above $1,500,000:\
          \ 75.00%.\n  - Warrantable Condo or Two-Unit subject: 75.00%.\n  - Interest-Only (5-year term):\
          \ 75.00%.\n  - Correspondent channel with FICO 700-719: 60%.\n  - Subject listed for sale within\
          \ six months: 65% LTV/CLTV on the lesser of appraised value or lowest recent listing price.\n\
          \n### Step 3 - Validation and Verification\n- Governing maximum CLTV is the lowest of the applicable\
          \ cap values.\n- Where the Appraisal Report identifies a declining market, 5 percentage points\
          \ are subtracted from the governing maximum.\n- LOS proposed CLTV is compared with the final\
          \ governing maximum.\n\n### Step 4 - Final Determination\n- Loan CLTV at or below the final\
          \ governing maximum proceeds; a CLTV above it is restructured or declined. Where the file depends\
          \ on how caps combine (Q-08) the determination is conditioned on Acra confirmation.\n\n## Deterministic\
          \ Validation Rules\n- Every cap applicable to the loan has been evaluated and its value recorded:\
          \ TRUE = consolidation complete, FALSE = consolidation incomplete.\n- governing_max_cltv = MIN(all\
          \ applicable caps) - (5 if declining market else 0): computed value is recorded on the file.\n\
          - LoanCore.cltv_percent <= governing_max_cltv: TRUE = pass, FALSE = fail.\n- Declining-market\
          \ reduction is applied to the lowest applicable cap and not only to the matrix cap: TRUE = correct,\
          \ FALSE = recalculation required.\n\n## Outcomes\n\n### Pass\nAssign **Pass** when:\n- All applicable\
          \ caps have been evaluated and LoanCore.cltv_percent is at or below the final governing maximum\
          \ CLTV.\n\n### Conditional\nAssign **Conditional** when:\n- The loan's CLTV passes under the\
          \ lowest-cap-governs reading but would fail if Acra confirms a different combination rule for\
          \ caps or for the declining-market adjustment (Q-08); the file proceeds subject to Acra's response.\n\
          \n### Fail\nAssign **Fail** when:\n- LoanCore.cltv_percent exceeds the final governing maximum\
          \ CLTV.\n\n### Not Applicable\nThere is no case for this outcome."
        source_digest: 2d18e944c032923ba5af2d1514efb4df398efed10deda0a9ce2286885e9f6c05
