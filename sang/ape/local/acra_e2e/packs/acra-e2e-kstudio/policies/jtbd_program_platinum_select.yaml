      jtbd:
        sequence: 9
        section_type: Assets
        source: NEW
        assistant:
        - Underwriter
        loan_metrics:
        - label: Governing Reserve Requirement (Months)
          metric_key: RatioSet.reserves_months
          metric_mnemonic: AFC_RESERVETOTAL_LM1
          indicator_context: 'Compute the governing reserve requirement: base_months = MAX(6 if LoanCore.cltv_percent
            > 75.00, 24 if the subject is listed for sale within six months, 12 if the forbearance/late
            overlay applies without two months of rent receipts, 0 otherwise); add 2 months for every
            month of required rent loss insurance not obtained. Compare RatioSet.reserves_months (verified
            reserves expressed in months of the subject PITIA) against the result. Indicator is ''Pass''
            when reserves_months >= governing requirement; ''Fail'' otherwise; ''Not Applicable'' when
            no trigger applies. Whether overlapping triggers are cumulative rather than highest-applies,
            the payment basis, and permitted sources are open (Q-08) — mark ''Conditional'' when the file
            passes under highest-applies but would fail if triggers are cumulative. Do not populate borrower_ids
            for this unified metric under any circumstance.'
          calculation_context: governing_months = MAX(applicable trigger months) + 2 × (months of rent
            loss insurance required but not obtained). Verified months = eligible verified reserves ÷
            subject PITIA (payment basis pending Q-08). Pass when verified months >= governing_months.
          description_template: 'Reserves: {reserves_months} months verified (required: {governing_months}
            months from triggers {applicable_triggers})'
        entity_types:
        - name: RatioSet
          entity_description: 'Qualifying ratios: DSCR inputs, PITIA, reserves in months'
        - name: Asset
          entity_description: Verified funds for closing and reserves, including gifts and foreign-held
            accounts
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        - name: HazardInsurance
          entity_description: Hazard / rent-loss insurance coverage and premiums
        extraction_targets:
