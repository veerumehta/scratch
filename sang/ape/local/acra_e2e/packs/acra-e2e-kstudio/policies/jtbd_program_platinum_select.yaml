        reference_documents: '### Entity Ownership and Guarantee Documents

          - Operating Agreement / Bylaws: states the ownership percentage held by each member or shareholder

          - Personal Guarantee (Acra-approved form or Exhibit 7): executed guarantee for each qualifying
          owner

          - Certificate of Formation / Articles of Organization: identifies the entity and its owners'
        source_text: '# Entity Owner Recourse Guarantee - Base Version


          ## Purpose

          Validate that all qualifying owners of an entity borrower have executed the required recourse
          personal guarantee, with joint and several recourse where multiple guarantors are involved.


          ## Reference Documents

          ### Entity Ownership and Guarantee Documents

          - Operating Agreement / Bylaws: states the ownership percentage held by each member or shareholder

          - Personal Guarantee (Acra-approved form or Exhibit 7): executed guarantee for each qualifying
          owner

          - Certificate of Formation / Articles of Organization: identifies the entity and its owners


          ## Steps


          ### Step 1 - Initial Document Review

          - Operating Agreement or Bylaws states the ownership percentage held by each individual member
          or shareholder of the entity borrower.


          ### Step 2 - Eligibility Verification

          - Each individual with direct or indirect ownership of 20% or greater is identified from the
          ownership documentation.


          ### Step 3 - Validation and Verification

          - A Personal Guarantee (Acra-approved form or Exhibit 7) is executed by each individual identified
          as holding 20% or greater ownership.

          - Personal Guarantee documentation states that recourse is joint and several when more than
          one guarantor is required.


          ### Step 4 - Final Determination

          - Entity borrower''s guarantee requirement is satisfied only when every individual with 20%
          or greater ownership has executed the required Personal Guarantee with joint and several recourse
          where applicable.


          ## Deterministic Validation Rules

          - Each individual with direct or indirect ownership of 20% or greater per the Operating Agreement
          / Bylaws has an executed Personal Guarantee on file: TRUE = guarantee requirement satisfied
          for that owner, FALSE = guarantee requirement not satisfied.

          - Personal Guarantee documentation states recourse is joint and several when more than one guarantor
          is required: TRUE = joint-and-several condition satisfied, FALSE = condition not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Every individual with 20% or greater direct or indirect ownership has executed a Personal
          Guarantee, and multi-guarantor files state joint and several recourse.


          ### Conditional

          Assign **Conditional** when:

          - One or more required Personal Guarantees are identified as needed but not yet executed or
          on file.


          ### Fail

          Assign **Fail** when:

          - An individual with 20% or greater ownership is identified with no Personal Guarantee on file
          at closing.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower is an individual rather than an entity, and no entity ownership guarantee applies.'
        source_digest: 7ac9266c6d5c99148b94b41881b47cd61ffaa3de0b45224812282a180a809734
        section: Compliance and Closing
        mnemonic: BET-GUAR-20PCT
        also_as:
          standard: BET-GUAR-20PCT
