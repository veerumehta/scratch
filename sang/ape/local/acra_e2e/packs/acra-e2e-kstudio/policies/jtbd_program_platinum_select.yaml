  - rule_id: DSCR-CALC.platinum_select
    condition:
      kind: procedure
      purpose: Compute the Debt Service Coverage Ratio by dividing qualifying gross rental income by the
        PITIA payment due under the first payment on the Note, establishing the ratio used for minimum-DSCR
        eligibility testing.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Note states the first payment amount due at origination and identifies whether the loan is fully
        amortizing or interest-only.


        ### Step 2 - Eligibility Verification

        - Qualifying gross rental income figure and the PITIA payment figure are both present in the file
        and dated as of or after the credit and appraisal documentation used in underwriting.


        ### Step 3 - Validation and Verification

        - DSCR is calculated as qualifying gross rental income divided by the PITIA payment due under
        the first payment on the Note; the calculated ratio is recorded to two decimal places.


        ### Step 4 - Final Determination

        - Calculated DSCR is compared to the applicable channel minimum ratio to determine whether the
        loan meets or falls short of the required minimum ratio.'
      checks:
      - 'DSCR is calculated using the first payment due under the Note, rather than a fully amortized
        payment, as the denominator basis: TRUE = calculation methodology is correct, FALSE = recalculation
        is required.'
      - Where the loan is interest-only, the denominator basis is tested separately under DSCR-IO-DENOM
        (Q-21).
      - 'Calculated DSCR (qualifying rent divided by PITIA) is a positive numeric value greater than zero:
        TRUE = ratio is valid for comparison, FALSE = a calculation error requires correction.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
