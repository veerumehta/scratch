            populate borrower_ids for this unified metric under any circumstance.
          description_template: 'Sources of funds relied on: {source_list} (unacceptable sources found:
            {unacceptable_count})'
        entity_types:
        - name: Asset
          entity_description: Verified funds for closing and reserves, including gifts and foreign-held
            accounts
        - name: LoanCore
          entity_description: 'Loan-level terms: purpose, amounts, CLTV/LTV, channel, amortization, IO
            term, prepayment, dates'
        extraction_targets:
