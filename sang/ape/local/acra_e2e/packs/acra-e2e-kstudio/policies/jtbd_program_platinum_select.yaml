    on_violation: fail
    replaces: []
    domain_extensions:
      jtbd:
        sequence: 34
        section_type: Eligibility
        source: NEW
        assistant:
        - Officer
        notes: Subject state is not reachable as a metric path (SubjectProperty.address is a $ref); the
          state lookup is document-driven (appraisal / title). Metric kept for the prepayment term.
        loan_metrics:
        - label: Prepayment Penalty Term
          metric_key: LoanCore.prepayment_penalty_term_months
          metric_mnemonic: PPT_PPP_STATE_LM1
          indicator_context: Read LoanCore.prepayment_penalty_term_months. Where the state restriction
            requires BUY-OUT for this loan, indicator is 'Pass' when the term is 0 (no prepayment penalty)
            or a priced buy-out is documented per Acra's confirmed meaning of BUY-OUT (Q-19); 'Fail' when
            a penalty term remains. Where MS permits a 5-year step alternative on a 1-unit, 'Pass' when
            term is 60 months with the 5/4/3/2/1 stepdown. Do not populate borrower_ids for this unified
            metric under any circumstance.
