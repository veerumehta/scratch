        source_text: '# Governing Source Version Control - Base Version


          ## Purpose

          This JTBD confirms that every requirement applied to the file was taken from the controlling
          versions of Acra''s sources for the Platinum Select DSCR program, and that any Acra response
          to the consolidation''s confirmation register has been applied. The consolidation was prepared
          from the Platinum Select DSCR Program Summary (8.17.2026, matching the published version at
          acralending.com/ratesheets) and the Acra DSCR Guidelines — Seller''s Guide excerpt (August 28,
          2026). Program matrices control where cited, and the full Seller''s Guide controls over the
          excerpt. Whether these are the controlling versions and whether unsupplied Seller''s Guide material
          changes any requirement is an open point (Acra confirmation requested → Q-20).


          ## Reference Documents

          ### Acra Program Sources

          - Platinum Select DSCR Program Summary: version date printed on the Summary

          - Acra DSCR Guidelines — Seller''s Guide excerpt: version date

          - Acra confirmation register responses (Appendix A, Q-01 to Q-22), if received

          ### Loan Records

          - LOS loan record: application date, lock date, program code

          - Underwriting approval / conditions: source version cited


          ## Steps


          ### Step 1 - Initial Document Review

          - Source versions cited on the underwriting approval and in the JTBD requirement texts are identified
          alongside the loan''s application and lock dates.


          ### Step 2 - Eligibility Verification

          - Cited Platinum Summary version is 8.17.2026 or a later version Acra has published as governing
          for the loan''s application / lock date; cited Seller''s Guide version is August 28, 2026 or
          later.


          ### Step 3 - Validation and Verification

          - Any Acra confirmation-register response received (Q-01 to Q-22) is checked against the requirements
          applied to the file; where a response changes a requirement, the affected JTBD outcome is re-evaluated.


          ### Step 4 - Final Determination

          - File is confirmed as underwritten to the governing source versions with Acra responses applied,
          or is conditioned for re-underwriting to the correct version.


          ## Deterministic Validation Rules

          - Platinum Summary version applied is 8.17.2026 or a later Acra-confirmed governing version
          for the loan''s lock date: TRUE = pass, FALSE = fail.

          - Seller''s Guide excerpt version applied is August 28, 2026 or later: TRUE = pass, FALSE =
          fail.

          - Every received Acra confirmation-register response has been applied to the affected JTBD(s):
          TRUE = pass, FALSE = conditional.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The file is underwritten to the governing source versions and all received Acra responses
          have been applied.


          ### Conditional

          Assign **Conditional** when:

          - The file relies on a requirement marked "Acra confirmation requested" whose response has not
          been received, or a received response has not yet been applied.


          ### Fail

          Assign **Fail** when:

          - The file was underwritten to a superseded Program Summary or Seller''s Guide version, or contradicts
          a received Acra confirmation-register response.


          ### Not Applicable

          There is no case for this outcome.'
