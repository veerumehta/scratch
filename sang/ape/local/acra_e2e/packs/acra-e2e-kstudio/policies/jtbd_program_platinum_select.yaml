  - rule_id: DSCR-ACTRENT-DOC.platinum_select
    condition:
      kind: procedure
      purpose: Validate that documentation is sufficient to support use of actual (in-place) rent, rather
        than market rent, when qualifying DSCR income.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Lease Agreement is present in the file and states a monthly rent amount, start date, and expiration
        date.

        - Rent receipt evidence (bank statement, canceled check, or landlord ledger) is present in the
        file for the two most recent months prior to application.


        ### Step 2 - Eligibility Verification

        - Rent receipt evidence documents at least two months of actual payments as recorded in the file.

        - Lease Agreement expiration date is at least three months after the scheduled closing date on
        the Closing Disclosure.


        ### Step 3 - Validation and Verification

        - Rent receipt amounts match the monthly rent amount stated on the Lease Agreement.

        - Rent receipt evidence does not consist solely of a security deposit or a prepaid rent lump sum
        (§5.32: "Security Deposit does not count towards receipt, and the rents cannot be prepaid").

        - The two months of receipts are the two most recent consecutive months where available; whether
        consecutive months are mandatory on Platinum Select, and whether the security-deposit / prepaid-rent
        conditions of §5.32 apply, is open (Acra confirmation requested → Q-03).


        ### Step 4 - Final Determination

        - Actual rent is approved as a qualifying income source only when both the two-month receipt evidence
        and the three-month post-closing lease continuance conditions are documented and internally consistent.'
      checks:
      - 'Lease Agreement expiration date is on or after the scheduled closing date plus 3 months: TRUE
        = lease continuance condition met, FALSE = lease continuance condition not met.'
      - 'Rent receipt evidence documents at least 2 months of payments matching the Lease Agreement rent
        amount: TRUE = receipt condition met, FALSE = receipt condition not met.'
      - 'Rent receipt evidence consists only of a security deposit or a prepaid rent lump sum: TRUE =
        receipt evidence is not acceptable, FALSE = receipt evidence may be acceptable.'
      outcomes:
      - status: PASS
        verdict: satisfied
        criterion: every step is met and every check holds
        carries_conditions: false
      - status: CONDITIONAL
        verdict: satisfied
        criterion: met, subject to conditions that must be cleared
        carries_conditions: true
      - status: FAIL
        verdict: violated
        criterion: a step is not met or a check does not hold
        carries_conditions: false
      - status: NOT_APPLICABLE
        verdict: not_applicable
        criterion: the job does not apply to this case
        carries_conditions: false
      evidence_types: []
      reads: []
      missing_reads: []
