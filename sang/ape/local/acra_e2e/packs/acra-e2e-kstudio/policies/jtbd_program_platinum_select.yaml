        source_text: '# Business-Purpose vs Consumer Transaction Classification - Base Version


          ## Purpose

          This JTBD records whether the loan is a business-purpose transaction. Acra lists the program
          as "Business Purpose DSCR Platinum" and requires a Business Purpose Attestation where the borrower
          qualifies on the subject property''s cash flow under a business purpose transaction, yet the
          Seller''s Guide excerpt also refers to consumer transactions when setting the funds-to-close
          seasoning threshold. Whether every Platinum Select loan is business-purpose is an open point
          (Acra confirmation requested → Q-22). The classification recorded here is consumed by LPE-BIZPURPOSE
          and AFC-SEASON-THRESH.


          ## Reference Documents

          ### Loan Origination Records

          - LOS loan record: business-purpose flag, occupancy, qualification method

          - Loan Application (1003): occupancy declaration and stated purpose of the loan proceeds

          ### Closing Documents

          - Business Purpose Attestation (Exhibit 8) or Acra-approved equivalent: borrower''s certification
          of business purpose


          ## Steps


          ### Step 1 - Initial Document Review

          - LOS record and Loan Application show the occupancy declaration (Non-Owner Occupied), the qualification
          method (DSCR on subject rent) and any stated use of proceeds.


          ### Step 2 - Eligibility Verification

          - Transaction facts are consistent with business purpose: investment property, not owner-occupied,
          qualified on rental cash flow, proceeds not for personal, family or household use.


          ### Step 3 - Validation and Verification

          - Business Purpose Attestation is executed with the loan documents where the transaction is
          business-purpose; a transaction the file classifies as consumer is flagged for Acra confirmation
          (Q-22) before consumer-specific rules are applied.


          ### Step 4 - Final Determination

          - Transaction classification is recorded as business-purpose (attestation on file) or is escalated
          as a consumer transaction pending Acra''s response.


          ## Deterministic Validation Rules

          - Occupancy is Non-Owner Occupied and qualification is by DSCR: TRUE = business-purpose indicators
          present, FALSE = escalate.

          - the transaction is classified business-purpose and Business Purpose Attestation executed:
          TRUE = pass, FALSE = fail.

          - the transaction is classified consumer: TRUE = conditional (Q-22), FALSE = not triggered.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - The transaction is classified business-purpose, the file facts support that classification,
          and the Business Purpose Attestation is executed.


          ### Conditional

          Assign **Conditional** when:

          - The transaction is classified as a consumer transaction; the file proceeds only on Acra''s
          confirmation that a consumer DSCR transaction is permitted on Platinum Select and with the consumer
          seasoning threshold applied.


          ### Fail

          Assign **Fail** when:

          - The business-purpose flag contradicts the file (for example, proceeds stated for personal
          use with is_business_purpose TRUE), or the transaction is business-purpose and no attestation
          is executed.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 317cb63541517842d608168f8248e94191a6b9e22bca239f9adc269707cd8016
