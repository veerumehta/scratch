        source_text: '# Key Principal and Entity Due Diligence - Base Version


          ## Purpose

          This JTBD confirms that Acra''s background due diligence on the entity borrower and its Key
          Principals is current as of the date of loan approval or draw, covering OFAC, criminal, litigation,
          judgment, and lien searches.


          ## Reference Documents

          ### Due Diligence Documents

          - Background Check Report (Checkpoint, LexisNexis, or comparable provider): criminal history,
          OFAC search, litigation, judgment, and lien search results

          - Credit Report: OFAC alert flag for the applicable borrower(s)/guarantor(s)

          - Loan Application (1003): identification of the entity, recourse guarantor(s), and any party
          with 20%+ ownership or managing control


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for a background check report covering the entity borrower and its Key
          Principals.


          ### Step 2 - Eligibility Verification

          - Background check scope includes the entity, the recourse guarantor(s), and any individual
          or entity owning 20% or more of the borrowing entity directly or indirectly, or holding managing
          control.


          ### Step 3 - Validation and Verification

          - Background check report date, or the credit report''s OFAC alert field, is current as of the
          date of loan approval or draw.

          - No unresolved OFAC alert, undisclosed criminal history, litigation, judgment, or lien is present
          for any Key Principal without underwriter review and disposition.


          ### Step 4 - Final Determination

          - Due diligence requirement is satisfied with no unresolved adverse finding and the file proceeds,
          or an adverse finding is identified and the file is declined or conditioned pending underwriter
          review.


          ## Deterministic Validation Rules

          - A background check report covering the entity, recourse guarantor(s), and every 20%+ owner
          or managing-control party is present and dated current as of loan approval or draw: TRUE = pass,
          FALSE = fail.

          - CreditReport.ofac_alert is not flagged for any borrower or guarantor in scope, or is flagged
          and has documented underwriter disposition: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A current background check report covers every required party and no unresolved adverse finding
          (OFAC, criminal, litigation, judgment, lien) exists.


          ### Conditional

          Assign **Conditional** when:

          - A background check report is on file but is dated prior to loan approval; the file may proceed
          with a condition to obtain a current report before the draw.


          ### Fail

          Assign **Fail** when:

          - No background check report is present for a required party, or an unresolved OFAC, criminal,
          litigation, judgment, or lien finding exists without underwriter disposition.


          ### Not Applicable

          There is no case for this outcome — background due diligence applies to every entity borrower''s
          Key Principals and, per the same standard, to individual borrowers.'
        source_digest: 320bb48226f4836dd75e684ae971bc998af04d2c135bcc1dd71aa161f850e82b
