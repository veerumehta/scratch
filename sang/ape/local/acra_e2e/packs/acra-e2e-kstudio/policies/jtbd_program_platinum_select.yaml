        ### Step 2 - Eligibility Verification

        - Property condition indicators noted by the appraiser (utilities status, furnishings, general
        upkeep) are checked against a vacant designation.


        ### Step 3 - Validation and Verification

        - Any separate property inspection or Property Data Report in the file is reconciled against the
        appraisal''s occupancy finding for consistency.


        ### Step 4 - Final Determination

        - Subject property is confirmed occupied (not vacant) and the file proceeds, or the property is
        confirmed vacant and the loan is declined.'
