        source_text: '# Interest-Only Baseline Minimum Verification - Base Version


          ## Purpose

          Since no interest-only-specific minimum loan amount or minimum decisioning score is published
          for the Platinum Select program, validate that interest-only loans meet the program''s baseline
          minimum loan amount and baseline minimum decisioning score that apply to the program as a whole.


          ## Reference Documents

          ### Loan Terms Documents

          - Note: states the interest-only loan''s principal amount

          - Credit Report: states the decisioning credit score


          ## Steps


          ### Step 1 - Initial Document Review

          - Note states the interest-only loan''s principal amount.


          ### Step 2 - Eligibility Verification

          - Credit Report states the decisioning credit score used for the loan.


          ### Step 3 - Validation and Verification

          - Loan amount is compared against the program''s baseline minimum of $100,000; decisioning score
          is compared against the program''s baseline minimum of 700.


          ### Step 4 - Final Determination

          - Interest-only loan is approved on this point only when it meets the program''s baseline minimum
          loan amount and minimum decisioning score, since no interest-only-specific floor is separately
          published.


          ## Deterministic Validation Rules

          - Interest-only loan amount is at least $100,000: TRUE = baseline loan-amount condition satisfied,
          FALSE = condition not satisfied.

          - Decisioning credit score is at least 700: TRUE = baseline score condition satisfied, FALSE
          = condition not satisfied.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Interest-only loan amount is at least $100,000 and the decisioning score is at least 700.


          ### Conditional

          There is no case for this outcome.


          ### Fail

          Assign **Fail** when:

          - Interest-only loan amount is below $100,000, or the decisioning score is below 700.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan product is fully amortizing rather than interest-only.'
        source_digest: bd5bbc38bb10550a77a7f2fb54e398dc6f639c66990a84d9061ad04c9f063957
