  - rule_id: LPE-INV-PROP.platinum_select
    condition:
      kind: procedure
      purpose: This JTBD verifies that the subject property's physical characteristics and lease arrangement
        meet Acra's defined investment property standard as a precondition for Platinum Select DSCR eligibility.
      steps:
      - '## Steps


        ### Step 1 - Initial Document Review

        - Appraisal report identifies the subject property''s type and number of units.

        - Current lease agreement for the subject property is present in the loan file.


        ### Step 2 - Eligibility Verification

        - SubjectProperty.number_of_units is between 1 and 4, or SubjectProperty.is_condo or SubjectProperty.is_pud
        is TRUE.

        - SubjectProperty.property_type is a form recognized as eligible investment property under the
        program.


        ### Step 3 - Validation and Verification

        - Lease agreement names a tenant who is not the borrower or guarantor on the loan.

        - Lease agreement term reflects a year-round residential tenancy rather than a short-term or nightly
        rental structure.


        ### Step 4 - Final Determination

        - Subject property is confirmed to meet the investment property definition and the file proceeds,
        or the definition is not met and the file is declined or routed for property-eligibility review.'
      checks:
      - 'SubjectProperty.number_of_units is between 1 and 4, or SubjectProperty.is_condo is TRUE, or SubjectProperty.is_pud
        is TRUE: TRUE = pass, FALSE = fail.'
      - 'Lease agreement identifies a tenant distinct from every borrower and guarantor on the loan: TRUE
        = pass, FALSE = fail.'
      - 'Lease term structure reflects a year-round residential tenancy, not a short-term/nightly rental:
        TRUE = pass, FALSE = fail.'
