          entity_type: CreditReport
          exclude_fields:
          - id
          - created_at
          - updated_at
          - provenance
          supported_operations:
          - UPDATE
          default_extraction_mode: ASK_USER
        reference_documents: '### Credit and Ownership Documents

          - Credit Report: provides each borrower''s or guarantor''s three-repository scores

          - Loan Application (1003): identifies the Primary Wage Earner and, for entity loans, each guarantor

          - Operating Agreement / Bylaws: states each guarantor''s ownership percentage for entity borrowers'
        source_text: '# Decisioning Credit Score Selection - Base Version


          ## Purpose

          Establish the single decisioning credit score used for underwriting and pricing by identifying
          the correct borrower or guarantor score per the program''s methodology.


          ## Reference Documents

          ### Credit and Ownership Documents

          - Credit Report: provides each borrower''s or guarantor''s three-repository scores

          - Loan Application (1003): identifies the Primary Wage Earner and, for entity loans, each guarantor

          - Operating Agreement / Bylaws: states each guarantor''s ownership percentage for entity borrowers


          ## Steps


          ### Step 1 - Initial Document Review

          - Credit Report is present for each individual borrower and, for entity loans, each personal
          guarantor.

          - Loan Application identifies which individual is the Primary Wage Earner, or lists each guarantor
          for an entity-borrower loan.


          ### Step 2 - Eligibility Verification

          - Middle score is calculated for the Primary Wage Earner on an individual-borrower loan, or
          for each guarantor on an entity-borrower loan.


          ### Step 3 - Validation and Verification

          - For entity loans, guarantor ownership percentages from the Operating Agreement or Bylaws are
          compared to determine whether ownership is equal or unequal across guarantors.

          - Applicable guarantor score is selected: the highest middle score among guarantors with equal
          ownership, or the middle score of the guarantor with the highest ownership concentration when
          ownership is unequal.


          ### Step 4 - Final Determination

          - Decisioning score is finalized as the Primary Wage Earner''s middle score on an individual-borrower
          loan, or the guarantor score selected per the ownership-based rule on an entity-borrower loan.


          ## Deterministic Validation Rules

          - Loan is an individual-borrower loan and the Primary Wage Earner''s middle score is used as
          the decisioning score: TRUE = pass, FALSE = fail.

          - Loan is an entity-borrower loan with equal guarantor ownership percentages and the highest
          middle score among those guarantors is used as the decisioning score: TRUE = pass, FALSE = fail.

          - Loan is an entity-borrower loan with unequal guarantor ownership percentages and the middle
          score of the guarantor with the highest ownership concentration is used as the decisioning score:
          TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - Decisioning score is calculated per the applicable rule: the Primary Wage Earner''s middle
          score for an individual-borrower loan, or the correctly selected guarantor score for an entity-borrower
          loan.


          ### Conditional

          Assign **Conditional** when:

          - An entity loan has multiple guarantors but ownership percentages are not yet documented in
          the file, so the applicable guarantor score cannot be selected.


          ### Fail

          Assign **Fail** when:

          - The decisioning score is calculated using a score other than the Primary Wage Earner''s on
          an individual loan, or a guarantor score inconsistent with the ownership-based selection rule
          on an entity loan.


          ### Not Applicable

          There is no case for this outcome.'
        source_digest: 96671c1eab5cd40fcbc31a7a5ead7868ea1d33e99155edd4d70b9602816ee798
