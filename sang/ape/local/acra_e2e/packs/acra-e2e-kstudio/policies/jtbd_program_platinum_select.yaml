          default_extraction_mode: ASK_USER
        reference_documents: '### Identification Documents

          - Permanent Resident Alien Card (PRA ID): evidences lawful permanent resident status and states
          an expiration date

          - Social Security Card or Form SSA-89: evidences the borrower''s Social Security number'
        source_text: '# Permanent Resident Identification Documentation - Base Version


          ## Purpose

          Confirm that a borrower documented as a Permanent Resident Alien provides the specific identification
          required to support that status.


          ## Reference Documents

          ### Identification Documents

          - Permanent Resident Alien Card (PRA ID): evidences lawful permanent resident status and states
          an expiration date

          - Social Security Card or Form SSA-89: evidences the borrower''s Social Security number


          ## Steps


          ### Step 1 - Initial Document Review

          - Permanent Resident Alien Card is present in the file and states an expiration date.

          - Social Security Card or Form SSA-89 is present in the file for the borrower.


          ### Step 2 - Eligibility Verification

          - Permanent Resident Alien Card expiration date is on or after the application date.


          ### Step 3 - Validation and Verification

          - Name on the Permanent Resident Alien Card matches the name on the Social Security Card or
          Form SSA-89 and on the Loan Application.


          ### Step 4 - Final Determination

          - Permanent Resident borrower is approved on identification grounds only when an unexpired Permanent
          Resident Alien Card and a Social Security Card or Form SSA-89 are both on file with matching
          names.


          ## Deterministic Validation Rules

          - Permanent Resident Alien Card expiration date is on or after the application date: TRUE =
          pass, FALSE = fail.

          - Social Security Card or Form SSA-89 is present in the file for the Permanent Resident borrower:
          TRUE = pass, FALSE = fail.

          - Name on the Permanent Resident Alien Card matches the name on the Social Security Card/Form
          SSA-89 and the Loan Application: TRUE = pass, FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - An unexpired Permanent Resident Alien Card and a Social Security Card or Form SSA-89 are both
          present with matching names across documents.


          ### Conditional

          Assign **Conditional** when:

          - The Permanent Resident Alien Card is present and unexpired but the Social Security Card or
          Form SSA-89 has not yet been provided.


          ### Fail

          Assign **Fail** when:

          - The Permanent Resident Alien Card is expired or missing, or the name does not match across
          the identification documents.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The borrower''s citizenship status is US Citizen rather than Permanent Resident Alien.'
        source_digest: 82b8615339b6f7ead9cfd7157e1cd1fd90b403f766c91d9a9d4cd12adf1b33e4
        section: Loan Program Eligibility
        mnemonic: BOR-PRA-ID
        also_as:
          standard: BOR-PRA-ID
