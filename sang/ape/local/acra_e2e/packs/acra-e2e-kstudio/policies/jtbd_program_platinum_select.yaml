        reference_documents: '### Entity Formation Documents

          - Certificate of Formation / Articles of Organization: entity''s formation record and all amendments

          - Loan Application (1003): entity borrower name and state of formation'
        source_text: '# Entity Formation Documents - Base Version


          ## Purpose

          This JTBD confirms that the entity borrower''s formation document and all amendments are present
          and legible in the loan file, since Acra requires this document without exception for every
          entity borrower.


          ## Reference Documents

          ### Entity Formation Documents

          - Certificate of Formation / Articles of Organization: entity''s formation record and all amendments

          - Loan Application (1003): entity borrower name and state of formation


          ## Steps


          ### Step 1 - Initial Document Review

          - Loan file is checked for a complete, legible copy of the Certificate of Formation or Articles
          of Organization for the entity borrower.


          ### Step 2 - Eligibility Verification

          - Formation document reflects the exact entity name and state of formation stated on the loan
          application.


          ### Step 3 - Validation and Verification

          - Formation document is accompanied by copies of all amendments made since the original filing.

          - No borrower letter is present in the file substituting for, or excusing, the formation document.


          ### Step 4 - Final Determination

          - Formation documentation requirement is satisfied and the file proceeds, or the document is
          missing/incomplete and the file is conditioned before closing.


          ## Deterministic Validation Rules

          - A complete, legible Certificate of Formation or Articles of Organization for the entity borrower
          is present in the file: TRUE = pass, FALSE = fail.

          - All amendments to the formation document, if any exist, are present in the file: TRUE = pass,
          FALSE = fail.

          - No borrower letter in the file substitutes for or excuses the formation document: TRUE = pass,
          FALSE = fail.


          ## Outcomes


          ### Pass

          Assign **Pass** when:

          - A complete, legible formation document and all its amendments are on file, and no substitute
          borrower letter is present.


          ### Conditional

          Assign **Conditional** when:

          - The formation document is present but one referenced amendment has not yet been provided;
          the file may proceed with a condition to obtain the missing amendment prior to closing.


          ### Fail

          Assign **Fail** when:

          - No formation document is present, the copy on file is illegible, or a borrower letter is used
          in place of the required document.


          ### Not Applicable

          Assign **Not Applicable** when:

          - The loan is being made to an individual borrower rather than an entity borrower.'
