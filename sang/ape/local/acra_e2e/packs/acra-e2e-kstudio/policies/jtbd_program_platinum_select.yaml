          indicator_context: Compare Borrower.id_expiration against the loan application date for Permanent
            Resident Alien borrowers. Indicator is 'Pass' when id_expiration is on or after the application
            date; 'Fail' otherwise. Cross-verify with the Permanent Resident Alien Card; on mismatch use
            document-extracted value. Do not populate borrower_ids for this unified metric under any circumstance.
          description_template: 'PRA ID Expiration: {id_expiration}'
        entity_types:
